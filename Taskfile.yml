version: "3"

env:
  GOFLAGS: -tags=ts_omit_ssh

tasks:
  generate:
    desc: Regenerate all committed artifacts
    deps: [go:generate]

  generate-check:
    desc: Check generated files for drift
    deps: [go:generate-check]

  format:
    desc: Format all source files
    deps: [go:format, js:format]

  format-check:
    desc: Check formatting without changing files
    deps: [go:format-check, js:format-check]

  lint:
    desc: Run static analysis
    deps: [go:lint, go:vulncheck, js:lint, js:typecheck, workflows:lint]

  test:
    desc: Run all tests
    deps: [go:test, js:test]

  build:
    desc: Build all packages and commands
    deps: [go:build, js:build]

  package:
    desc: Build a local release snapshot
    deps: [release:snapshot, js:pack]

  go:generate:
    cmds:
      - go generate ./...

  go:generate-check:
    cmds:
      - task: go:generate
      - go test ./pkg/protocol/workerv1 -run='^TestControlSchemaTracksMessageTypes$'
      - git diff --exit-code -- pkg/protocol internal/state/statedb

  go:format:
    cmds:
      - |
        files="$(git ls-files --cached --others --exclude-standard -- '*.go' | while IFS= read -r file; do test ! -f "$file" || printf '%s\n' "$file"; done)"
        test -z "$files" || goimports -w $files

  go:format-check:
    cmds:
      - |
        files="$(git ls-files --cached --others --exclude-standard -- '*.go' | while IFS= read -r file; do test ! -f "$file" || printf '%s\n' "$file"; done)"
        test -z "$files" || test -z "$(gofmt -l $files)"
      - |
        files="$(git ls-files --cached --others --exclude-standard -- '*.go' | while IFS= read -r file; do test ! -f "$file" || printf '%s\n' "$file"; done)"
        test -z "$files" || test -z "$(goimports -l $files)"

  go:lint:
    cmds:
      - go vet ./...
      - staticcheck ./...

  go:vulncheck:
    cmds:
      - govulncheck ./...

  go:test:
    cmds:
      - go test ./...

  go:test-race:
    desc: Run all Go tests with the race detector
    cmds:
      - go test -race ./...

  go:test-integration:
    desc: Run opt-in Go integration tests
    env:
      TNL_TEST_INTEGRATION: "1"
    cmds:
      - go test -race -v ./cmd/tnld ./internal/controltls ./internal/tailtransport ./internal/publication -run='^TestIntegration' -count=1 -timeout=5m

  go:bench-fly:
    desc: Benchmark complete single-node and HA route paths on Fly
    cmds:
      - ./scripts/bench-fly.sh

  go:build:
    cmds:
      - go build ./cmd/...

  js:format:
    cmds:
      - pnpm format

  js:format-check:
    cmds:
      - pnpm format:check

  js:lint:
    cmds:
      - pnpm lint

  js:typecheck:
    cmds:
      - pnpm typecheck

  js:test:
    cmds:
      - pnpm test

  js:build:
    cmds:
      - pnpm build

  js:pack:
    cmds:
      - pnpm run pack

  release:snapshot:
    desc: Build release archives, checksums, and SBOMs without publishing or signing
    cmds:
      - goreleaser release --snapshot --clean --skip=sign

  workflows:lint:
    cmds:
      - actionlint
      - zizmor .github/workflows
