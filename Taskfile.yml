version: "3"

env:
  GOFLAGS: -tags=ts_omit_ssh

tasks:
  generate:
    desc: Regenerate all committed artifacts
    deps: [go:generate]

  generate-check:
    desc: Check generated files for drift
    deps: [go:generate-check]

  format:
    desc: Format all source files
    deps: [go:format]

  format-check:
    desc: Check formatting without changing files
    deps: [go:format-check]

  lint:
    desc: Run static analysis
    deps: [go:lint, go:vulncheck, workflows:lint]

  test:
    desc: Run all tests
    deps: [go:test]

  build:
    desc: Build all packages and commands
    deps: [go:build]

  go:generate:
    cmds:
      - go generate ./...

  go:generate-check:
    cmds:
      - task: go:generate
      - git diff --exit-code -- pkg/protocol

  go:format:
    cmds:
      - |
        files="$(git ls-files --cached --others --exclude-standard -- '*.go')"
        test -z "$files" || goimports -w $files

  go:format-check:
    cmds:
      - |
        files="$(git ls-files --cached --others --exclude-standard -- '*.go')"
        test -z "$files" || test -z "$(gofmt -l $files)"
      - |
        files="$(git ls-files --cached --others --exclude-standard -- '*.go')"
        test -z "$files" || test -z "$(goimports -l $files)"

  go:lint:
    cmds:
      - go vet ./...
      - staticcheck ./...

  go:vulncheck:
    cmds:
      - govulncheck ./...

  go:test:
    cmds:
      - go test ./...

  go:test-race:
    desc: Run all Go tests with the race detector
    cmds:
      - go test -race ./...

  go:test-integration:
    desc: Run opt-in Go integration tests
    env:
      TNL_TEST_INTEGRATION: "1"
    cmds:
      - go test -race -v ./internal/tailtransport -run='^TestIntegration' -count=1 -timeout=5m

  go:bench-tailcat-capacity:
    desc: Run the opt-in Tailcat route-capacity matrix
    vars:
      ROUTES: '{{default "1,10,100" .ROUTES}}'
      PATH_MODE: '{{default "any" .PATH_MODE}}'
      PARALLEL: '{{default "8" .PARALLEL}}'
    env:
      TNL_TEST_TAILCAT_CAPACITY: "1"
      TNL_TEST_TAILCAT_ROUTES: "{{.ROUTES}}"
      TNL_TEST_TAILCAT_PATH: "{{.PATH_MODE}}"
      TNL_TEST_TAILCAT_PARALLEL: "{{.PARALLEL}}"
    cmds:
      - go test -v ./internal/tailtransport -run='^$' -bench='^BenchmarkTailcatCapacity$' -benchtime=1x -count=1 -timeout=90m

  go:bench-tailcat-churn:
    desc: Run opt-in Tailcat lifecycle churn (default 100 cycles)
    vars:
      CYCLES: '{{default "100x" .CYCLES}}'
      PARALLEL: '{{default "8" .PARALLEL}}'
    env:
      TNL_TEST_TAILCAT_CAPACITY: "1"
      TNL_TEST_TAILCAT_PARALLEL: "{{.PARALLEL}}"
    cmds:
      - go test -v ./internal/tailtransport -run='^$' -bench='^BenchmarkTailcatChurn$' -benchtime={{.CYCLES}} -count=1 -timeout=5h

  go:bench-tailcat-fly:
    desc: Run the Mac-to-Fly Tailcat capacity ramp
    cmds:
      - ./scripts/bench-tailcat-fly.sh

  go:bench-tailcat-fly-autoscale:
    desc: Run the sharded Fly Tailcat autoscaling benchmark
    cmds:
      - ./scripts/bench-tailcat-fly-autoscale.sh

  go:build:
    cmds:
      - go build ./cmd/...

  workflows:lint:
    cmds:
      - actionlint
      - zizmor .github/workflows
