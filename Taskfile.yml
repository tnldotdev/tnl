version: "3"

# public aliases below keep mixed-owner task names stable. implementations use
# absolute task references across includes and always run at the repository root.
includes:
  local:
    taskfile: ./tasks/local.yml
    dir: "{{.ROOT_DIR}}"
  generation:
    taskfile: ./tasks/generate.yml
    dir: "{{.ROOT_DIR}}"
    internal: true
  go:
    taskfile: ./tasks/go.yml
    dir: "{{.ROOT_DIR}}"
  js:
    taskfile: ./tasks/javascript.yml
    dir: "{{.ROOT_DIR}}"
  py:
    taskfile: ./tasks/python.yml
    dir: "{{.ROOT_DIR}}"
  go:test:integration:
    taskfile: ./tasks/integration.yml
    dir: "{{.ROOT_DIR}}"
  workloads:
    taskfile: ./tasks/load.yml
    dir: "{{.ROOT_DIR}}"
    internal: true
  packaging:
    taskfile: ./tasks/packaging.yml
    dir: "{{.ROOT_DIR}}"
    internal: true
  deploy:
    taskfile: ./tasks/deployment.yml
    dir: "{{.ROOT_DIR}}"

tasks:
  dev:
    dir: "{{.ROOT_DIR}}"
    desc: Run the local development stack
    cmds:
      - task: local:dev

  generate:
    dir: "{{.ROOT_DIR}}"
    desc: Regenerate all committed artifacts
    cmds:
      - task: generation:generate

  generate-check:
    dir: "{{.ROOT_DIR}}"
    desc: Check generated files for drift
    cmds:
      - task: generation:generate-check

  format:
    dir: "{{.ROOT_DIR}}"
    desc: Format all source files
    cmds:
      - task: generation:format

  format-check:
    dir: "{{.ROOT_DIR}}"
    desc: Check formatting without changing files
    cmds:
      - task: generation:format-check

  go:generate:
    dir: "{{.ROOT_DIR}}"
    cmds:
      - task: generation:go:generate

  go:generate-check:
    dir: "{{.ROOT_DIR}}"
    cmds:
      - task: generation:go:generate-check

  go:format:
    dir: "{{.ROOT_DIR}}"
    cmds:
      - task: generation:go:format

  go:format-check:
    dir: "{{.ROOT_DIR}}"
    cmds:
      - task: generation:go:format-check

  lint:
    dir: "{{.ROOT_DIR}}"
    desc: Run static analysis
    cmds:
      - task: go:lint
      - task: go:vulncheck
      - task: js:lint
      - task: js:typecheck
      - task: py:lint
      - task: py:typecheck
      - task: workflows:lint

  test:
    dir: "{{.ROOT_DIR}}"
    desc: Run routine Go, JavaScript, and Python tests
    cmds:
      - task: go:test
      - task: js:test
      - task: py:test

  coverage:
    dir: "{{.ROOT_DIR}}"
    desc: Produce diagnostic Go and TypeScript coverage reports
    cmds:
      - task: go:test:coverage
      - task: js:test:coverage

  build:
    dir: "{{.ROOT_DIR}}"
    desc: Build all packages and commands
    cmds:
      - task: go:build
      - task: js:build

  connect:check:
    dir: "{{.ROOT_DIR}}"
    desc: Build and check the GitHub connection action without cloud access
    cmds:
      - task: js:connect:check

  connect:generate-check:
    dir: "{{.ROOT_DIR}}"
    desc: Regenerate and compare the committed action bundles
    cmds:
      - task: js:connect:generate-check

  connect:fixture:prepare:
    dir: "{{.ROOT_DIR}}"
    desc: Prepare the local action workflow fixture
    cmds:
      - task: js:connect:fixture:prepare

  connect:fixture:observe:
    dir: "{{.ROOT_DIR}}"
    desc: Verify a prepared action owner from a later workflow step
    cmds:
      - task: js:connect:fixture:observe

  connect:fixture:remove-original:
    dir: "{{.ROOT_DIR}}"
    desc: Remove the fixture's original CLI to qualify action-owned cleanup
    cmds:
      - task: js:connect:fixture:remove-original

  connect:fixture:stop-oidc:
    dir: "{{.ROOT_DIR}}"
    desc: Stop the local action workflow issuer
    cmds:
      - task: js:connect:fixture:stop-oidc

  go:test:load:database:
    dir: "{{.ROOT_DIR}}"
    desc: Run database load tests (DELAY=0ms/5ms/20ms, PUBLIC_URLS=1000, HISTORY=1 event/route, RUN=^TestLoad)
    cmds:
      - task: workloads:go:test:load:database

  go:test:load:runtime:
    dir: "{{.ROOT_DIR}}"
    desc: Run per-component constrained real visitor/recovery/shutdown load
    cmds:
      - task: workloads:go:test:load:runtime

  go:bench:plan:
    dir: "{{.ROOT_DIR}}"
    desc: Describe a local workload against an explicit tnl server without creating resources
    cmds:
      - task: workloads:go:bench:plan

  go:bench:run:
    dir: "{{.ROOT_DIR}}"
    desc: Run an explicitly approved benchmark against the selected tnl server
    cmds:
      - task: workloads:go:bench:run

  go:bench:report:
    dir: "{{.ROOT_DIR}}"
    desc: Display results from a deployed benchmark
    cmds:
      - task: workloads:go:bench:report

  package:
    dir: "{{.ROOT_DIR}}"
    desc: Build a local release snapshot
    cmds:
      - task: packaging:package

  installer:test:
    dir: "{{.ROOT_DIR}}"
    desc: Test the shell installer without accessing GitHub or client state
    cmds:
      - task: packaging:installer:test

  release:check:plan:
    dir: "{{.ROOT_DIR}}"
    desc: Preview three functional checks against an explicit server
    cmds:
      - task: packaging:release:check:plan

  release:check:run:
    dir: "{{.ROOT_DIR}}"
    desc: Publish test-owned public URLs on an explicit server
    cmds:
      - task: packaging:release:check:run

  release:snapshot:
    dir: "{{.ROOT_DIR}}"
    desc: Build release archives, checksums, and SBOMs without publishing or signing
    cmds:
      - task: packaging:release:snapshot

  release:npm-package:
    dir: "{{.ROOT_DIR}}"
    desc: Build and check npm release tarballs in installed npm and pnpm consumers
    cmds:
      - task: packaging:release:npm-package

  workflows:lint:
    dir: "{{.ROOT_DIR}}"
    cmds:
      - actionlint
      - zizmor .github
