version: "3"

env:
  GOFLAGS: -tags=ts_omit_ssh

tasks:
  dev:
    desc: Run the local development stack
    deps: [local:certificates]
    cmds:
      - docker compose --file deploy/local/compose.yaml up --build

  local:certificates:
    internal: true
    status:
      - test -s .local/certs/local.crt
      - test -s .local/certs/local.key
      - test -s .local/certs/local-root.pem
    cmds:
      - install -d -m 0700 .local/certs
      - openssl req -x509 -newkey rsa:2048 -nodes -days 3650 -subj /CN=tnl-local-root -keyout .local/certs/local-root.key -out .local/certs/local-root.pem
      - openssl req -newkey rsa:2048 -nodes -subj /CN=localhost -keyout .local/certs/local.key -out .local/certs/local.csr
      - printf 'subjectAltName=DNS:*.127.0.0.1.nip.io\nbasicConstraints=critical,CA:FALSE\nkeyUsage=critical,digitalSignature,keyEncipherment\nextendedKeyUsage=serverAuth\n' | openssl x509 -req -sha256 -days 825 -in .local/certs/local.csr -CA .local/certs/local-root.pem -CAkey .local/certs/local-root.key -CAcreateserial -extfile /dev/stdin -out .local/certs/local.crt
      - chmod 0600 .local/certs/local-root.key .local/certs/local.key

  local:up:
    desc: Start the local services in the background
    deps: [local:certificates]
    cmds:
      - docker compose --file deploy/local/compose.yaml up --build --detach
      - curl --noproxy '*' --retry 30 --retry-all-errors --retry-delay 1 --fail --silent --show-error --cacert deploy/local/pebble.minica.crt --output .local/certs/pebble-root.pem https://127.0.0.1:15000/roots/0
      - curl --noproxy '*' --retry 30 --retry-all-errors --retry-delay 1 --fail --silent --show-error --cacert .local/certs/local-root.pem https://control.127.0.0.1.nip.io/v1/ready

  local:trust:
    desc: Trust the local control and Pebble issuance roots on macOS
    preconditions:
      - sh: test -s .local/certs/local-root.pem
        msg: Run task local:up first
      - sh: test -s .local/certs/pebble-root.pem
        msg: Run task local:up first
      - sh: test "$(uname -s)" = Darwin
        msg: Automatic local CA trust is currently supported only on macOS
    cmds:
      - |
        set -eu
        keychain="$HOME/Library/Keychains/login.keychain-db"
        for root in .local/certs/local-root.pem .local/certs/pebble-root.pem; do
          fingerprint="$(openssl x509 -in "$root" -noout -fingerprint -sha1 | cut -d= -f2 | tr -d :)"
          security delete-certificate -Z "$fingerprint" "$keychain" >/dev/null 2>&1 || true
          security add-trusted-cert -r trustRoot -p ssl -k "$keychain" "$root"
        done

  local:untrust:
    desc: Remove the local control and Pebble issuance roots from the macOS keychain
    cmds:
      - |
        set -eu
        if [ "$(uname -s)" != Darwin ]; then
          exit 0
        fi
        keychain="$HOME/Library/Keychains/login.keychain-db"
        for root in .local/certs/local-root.pem .local/certs/pebble-root.pem; do
          if [ -s "$root" ]; then
            fingerprint="$(openssl x509 -in "$root" -noout -fingerprint -sha1 | cut -d= -f2 | tr -d :)"
            security delete-certificate -Z "$fingerprint" "$keychain" >/dev/null 2>&1 || true
          fi
        done

  local:login:
    desc: Authenticate the isolated local client with the daemon login token
    cmds:
      - |
        TNL_LOGIN_TOKEN="${TNLD_LOGIN_TOKEN:-tnl_login_AAECAwQFBgcICQoLDA0ODw.EBESExQVFhcYGRobHB0eHyAhIiMkJSYnKCkqKywtLi8}" \
          TNL_SERVER=https://control.127.0.0.1.nip.io TNL_STATE_DIR=.local/client-state \
          go run ./cmd/tnl login --token

  local:tnl:
    desc: Run the isolated local client; pass arguments after --
    requires:
      vars: [CLI_ARGS]
    cmds:
      - TNL_SERVER=https://control.127.0.0.1.nip.io TNL_STATE_DIR=.local/client-state go run ./cmd/tnl {{.CLI_ARGS}}

  local:down:
    desc: Stop the local services without removing state
    cmds:
      - docker compose --file deploy/local/compose.yaml stop

  local:reset:
    desc: Remove local services, trust, and persistent state
    cmds:
      - task: local:untrust
      - docker compose --file deploy/local/compose.yaml down --volumes --remove-orphans
      - rm -rf .local

  generate:
    desc: Regenerate all committed artifacts
    deps: [go:generate]

  generate-check:
    desc: Check generated files for drift
    deps: [go:generate-check]

  format:
    desc: Format all source files
    deps: [go:format, js:format]

  format-check:
    desc: Check formatting without changing files
    deps: [go:format-check, js:format-check]

  lint:
    desc: Run static analysis
    cmds:
      - task: go:lint
      - task: go:vulncheck
      - task: js:lint
      - task: js:typecheck
      - task: workflows:lint

  test:
    desc: Run routine Go and JavaScript tests
    cmds:
      - task: go:test
      - task: js:test

  coverage:
    desc: Produce diagnostic Go and TypeScript coverage reports
    cmds:
      - task: go:test:coverage
      - task: js:test:coverage

  build:
    desc: Build all packages and commands
    cmds:
      - task: go:build
      - task: js:build

  package:
    desc: Build a local release snapshot
    cmds:
      - task: js:pack
      - task: release:snapshot
      - task: release:npm-package

  go:generate:
    cmds:
      - go generate ./...

  go:generate-check:
    cmds:
      - task: go:generate
      - git diff --exit-code HEAD -- pkg/api internal/clientstate/clientstatedb internal/controlstate/controlstatedb internal/projectconfig/keys.gen.json packages/tnl/lib/config.d.ts schema/v1.json
      - test -z "$(git ls-files --others --exclude-standard -- pkg/api internal/clientstate/clientstatedb internal/controlstate/controlstatedb internal/projectconfig/keys.gen.json packages/tnl/lib/config.d.ts schema/v1.json)"

  go:format:
    cmds:
      - goimports -w .

  go:format-check:
    cmds:
      - test -z "$(goimports -l .)"

  go:lint:
    cmds:
      - go vet ./...
      - staticcheck ./...

  go:vulncheck:
    cmds:
      - govulncheck ./...

  go:test:
    cmds:
      - go test ./...

  go:test:coverage:
    desc: Produce a diagnostic Go coverage report
    cmds:
      - mkdir -p coverage/go
      - go test ./... -coverprofile=coverage/go/coverage-with-generated.out
      - go run scripts/filter-go-coverage.go coverage/go/coverage-with-generated.out coverage/go/coverage.out
      - go tool cover -html=coverage/go/coverage.out -o=coverage/go/index.html

  go:test:race:
    desc: Run routine Go tests with the race detector
    cmds:
      - go test -race ./...

  go:test:integration:
    desc: Run PostgreSQL-backed Go integration tests
    vars:
      RUN: '{{default "^TestIntegration" .RUN}}'
    cmds:
      - node scripts/run-go-tests-with-postgres.mjs -- go test -race -v ./internal/controlapi ./internal/controlstate ./internal/certificates ./internal/dnscontroller ./internal/tnldruntime -run='{{.RUN}}' -count=1 -timeout=15m -args -tnl-test-tier=integration

  go:test:integration:binary:
    desc: Run Linux binary integration tests
    deps: [js:build]
    preconditions:
      - sh: test "$(uname -s)" = Linux
        msg: Binary integration tests require Linux
    cmds:
      - node scripts/run-go-tests-with-postgres.mjs -- go test -race -v ./internal/tnldruntime -run='^TestBinaryIntegration' -count=1 -timeout=15m -args -tnl-test-tier=binary

  go:test:integration:dns:
    desc: Run the authoritative DNS integration test in disposable Linux containers
    cmds:
      - |
        bash -euo pipefail -c '
          compose() {
            docker compose --file internal/tnldruntime/testdata/dns-integration.compose.yaml "$@"
          }
          cleanup() {
            compose down --volumes --remove-orphans >/dev/null 2>&1 || true
          }
          trap cleanup EXIT HUP INT TERM
          cleanup
          compose up --abort-on-container-exit --exit-code-from test --remove-orphans
        '

  go:test:load:database:
    desc: Run database load tests (DELAY=0ms/5ms/20ms, ROUTES=1000, HISTORY=1 event/route, RUN=^TestLoad)
    vars:
      DELAY: '{{default "0ms" .DELAY}}'
      ROUTES: '{{default "1000" .ROUTES}}'
      HISTORY: '{{default "1" .HISTORY}}'
      DURATION: '{{default "0s" .DURATION}}'
      RETENTION: '{{default "0s" .RETENTION}}'
      RUN: '{{default "^TestLoad" .RUN}}'
    cmds:
      - node scripts/run-go-tests-with-postgres.mjs -- go test -v ./internal/controlstate -run='{{.RUN}}' -count=1 -timeout=20m -args -tnl-test-tier=database-load -tnl-load-delay='{{.DELAY}}' -tnl-load-routes='{{.ROUTES}}' -tnl-load-history='{{.HISTORY}}' -tnl-load-duration='{{.DURATION}}' -tnl-load-retention='{{.RETENTION}}'

  go:test:load:runtime:
    desc: Run per-component constrained real visitor/recovery/shutdown load
    vars:
      ROUTES: '{{default "4" .ROUTES}}'
      RPS: '{{default "16" .RPS}}'
      DURATION: '{{default "10s" .DURATION}}'
      WORKERS: '{{default "128" .WORKERS}}'
      QUEUE: '{{default "8" .QUEUE}}'
      SCENARIO: '{{default "relay-restart" .SCENARIO}}'
      TRACE: '{{default "0" .TRACE}}'
      RACE: '{{default "0" .RACE}}'
      RESULTS: '{{default (printf "bench-results/runtime-%s" (now | date "20060102-150405")) .RESULTS}}'
    env:
      ROUTES: "{{.ROUTES}}"
      RPS: "{{.RPS}}"
      DURATION: "{{.DURATION}}"
      WORKERS: "{{.WORKERS}}"
      QUEUE: "{{.QUEUE}}"
      SCENARIO: "{{.SCENARIO}}"
      TRACE: "{{.TRACE}}"
      RACE: "{{.RACE}}"
      RESULTS: "{{.ROOT_DIR}}/{{.RESULTS}}"
    cmds:
      - node scripts/runtime-load.mjs

  go:test:fuzz:
    desc: Fuzz all Go parser and policy boundaries
    vars:
      TIME: '{{default "15s" .TIME}}'
    cmds:
      - go test ./internal/router -run='^$' -fuzz='^FuzzInspectClientHello$' -fuzztime='{{.TIME}}'
      - go test ./internal/proxyproto -run='^$' -fuzz='^FuzzDecode$' -fuzztime='{{.TIME}}'
      - go test ./pkg/protocol/tunnelv1 -run='^$' -fuzz='^FuzzReadFrames$' -fuzztime='{{.TIME}}'
      - go test ./internal/localproxy -run='^$' -fuzz='^FuzzNormalizeTarget$' -fuzztime='{{.TIME}}'
      - go test ./internal/naming -run='^$' -fuzz='^FuzzCanonicalize$' -fuzztime='{{.TIME}}'
      - go test ./internal/naming -run='^$' -fuzz='^FuzzDomainPolicy$' -fuzztime='{{.TIME}}'
      - go test ./internal/clioutput -run='^$' -fuzz='^FuzzRender$' -fuzztime='{{.TIME}}'

  go:bench-fly:plan:
    desc: Describe one Fly workload and its resources without creating them
    dotenv: [.env.bench]
    cmds:
      - go run ./cmd/tnlbench plan

  go:bench-fly:run:
    desc: Run an explicitly approved Fly benchmark and clean up its resources
    dotenv: [.env.bench]
    cmds:
      - go run ./cmd/tnlbench run

  go:bench-fly:cleanup:
    desc: Clean up resources recorded by an interrupted Fly benchmark
    dotenv: [.env.bench]
    cmds:
      - go run ./cmd/tnlbench cleanup

  go:bench-fly:report:
    desc: Merge Fly benchmark result rows and write reports
    dotenv: [.env.bench]
    cmds:
      - go run ./cmd/tnlbench report

  go:build:
    cmds:
      - go build ./...

  js:format:
    cmds:
      - pnpm format

  js:format-check:
    cmds:
      - pnpm format:check

  js:lint:
    cmds:
      - pnpm lint

  js:typecheck:
    cmds:
      - pnpm typecheck

  js:test:
    cmds:
      - pnpm test

  js:test:coverage:
    desc: Produce a diagnostic TypeScript coverage report
    cmds:
      - pnpm test:coverage

  js:build:
    cmds:
      - pnpm build

  js:pack:
    cmds:
      - pnpm run pack

  release:snapshot:
    desc: Build release archives, checksums, and SBOMs without publishing or signing
    cmds:
      - goreleaser release --snapshot --clean --skip=sign

  release:npm-package:
    desc: Package the tnl release binaries for npm
    cmds:
      - node scripts/pack-tnl.mjs dist/npm
      - node scripts/verify-tnl-install.mjs dist/npm

  workflows:lint:
    cmds:
      - actionlint
      - zizmor .github
