version: "3"

# included tasks inherit the repository root as their working directory.
includes:
  local:
    taskfile: ./tasks/local.yml
    dir: "{{.ROOT_DIR}}"
  generation:
    taskfile: ./tasks/generate.yml
    dir: "{{.ROOT_DIR}}"
    flatten: true
  go:
    taskfile: ./tasks/go.yml
    dir: "{{.ROOT_DIR}}"
  js:
    taskfile: ./tasks/javascript.yml
    dir: "{{.ROOT_DIR}}"
  py:
    taskfile: ./tasks/python.yml
    dir: "{{.ROOT_DIR}}"
  connect:
    taskfile: ./tasks/connect.yml
    dir: "{{.ROOT_DIR}}"
  go:test:integration:
    taskfile: ./tasks/integration.yml
    dir: "{{.ROOT_DIR}}"
  workloads:
    taskfile: ./tasks/load.yml
    dir: "{{.ROOT_DIR}}"
    flatten: true
  packaging:
    taskfile: ./tasks/packaging.yml
    dir: "{{.ROOT_DIR}}"
    flatten: true

tasks:
  dev:
    desc: Run the local development stack
    cmds:
      - task: local:dev

  lint:
    desc: Run static analysis
    cmds:
      - task: go:lint
      - task: go:vulncheck
      - task: js:lint
      - task: js:typecheck
      - task: py:lint
      - task: py:typecheck
      - task: workflows:lint

  test:
    desc: Run routine Go, JavaScript, and Python tests
    cmds:
      - task: go:test
      - task: js:test
      - task: py:test

  coverage:
    desc: Produce diagnostic Go and TypeScript coverage reports
    cmds:
      - task: go:test:coverage
      - task: js:test:coverage

  build:
    desc: Build all packages and commands
    cmds:
      - task: go:build
      - task: js:build

  workflows:lint:
    cmds:
      - actionlint
      - zizmor --offline .github
