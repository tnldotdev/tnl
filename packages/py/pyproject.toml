[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[project]
name = "tnldotdev-tnl"
version = "1.0.0.dev0"
description = "take a shortcut through the internet."
readme = "readme.md"
requires-python = ">=3.12"
license = "BSD-3-Clause"
dependencies = [
  "cryptography>=50.0.2,<51",
  "httpx>=0.28,<0.29",
  "starlette>=0.45,<2",
  "uvicorn>=0.40,<1",
  "websockets>=14,<17",
]

[dependency-groups]
dev = ["mypy>=1.18,<1.20", "psycopg[binary,pool]>=3.2,<4", "pytest>=8.4,<10", "ruff>=0.14,<0.16"]

[tool.hatch.build.targets.wheel]
packages = ["src/tnl"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ANN"]

[tool.mypy]
strict = true
python_version = "3.12"
mypy_path = "packages/py/src"
files = ["packages/py/src", "packages/py/tests"]

[tool.pytest.ini_options]
testpaths = ["packages/py/tests"]
