name: tnl-local-dev

services:
  postgres:
    image: public.ecr.aws/docker/library/postgres:17.6-alpine@sha256:ef257d85f76e48da1c64832459b59fcaba1a4dac97bf5d7450c77753542eee94
    environment:
      POSTGRES_DB: tnl
      POSTGRES_PASSWORD: tnl
      POSTGRES_USER: tnl
    healthcheck:
      test: [CMD-SHELL, pg_isready --username tnl --dbname tnl]
      interval: 2s
      timeout: 5s
      retries: 10
    ports:
      - "127.0.0.1:25432:5432"
    volumes:
      - postgres-state:/var/lib/postgresql/data

  pebble:
    image: ghcr.io/letsencrypt/pebble:2.10.1@sha256:ddf230642b1a584f519f32e347de1b05a6e4c1f6c35c1863b33effeab5f78199
    command: -config /test/config/tnl-pebble-config.json -strict=false
    environment:
      PEBBLE_AUTHZREUSE: "0"
      PEBBLE_VA_ALWAYS_VALID: "1"
      PEBBLE_VA_NOSLEEP: "1"
      PEBBLE_WFE_NONCEREJECT: "0"
    ports:
      - "127.0.0.1:14000:14000"
      - "127.0.0.1:15000:15000"
    volumes:
      - ./pebble-config.json:/test/config/tnl-pebble-config.json:ro

  migrate:
    build:
      context: ../..
      args:
        VERSION: dev
    command: migrate
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      TNLD_DATABASE_DIRECT_URL: postgresql://tnl:tnl@postgres/${TNL_LOCAL_DATABASE:-tnl}?sslmode=disable

  tnld:
    build:
      context: ../..
      args:
        VERSION: dev
    depends_on:
      migrate:
        condition: service_completed_successfully
      pebble:
        condition: service_started
      postgres:
        condition: service_healthy
    read_only: true
    cap_add:
      - NET_BIND_SERVICE
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 45s
    environment:
      TNLD_ACCESS_TOKEN_LIFETIME: 1h
      TNLD_ACME_ACCEPT_TERMS: "true"
      TNLD_ACME_DIRECTORY_URL: https://pebble:14000/dir
      TNLD_ACME_EMAIL: developer@localhost
      TNLD_ACME_PROFILE: tlsserver
      TNLD_CONTROL_LISTEN: :8443
      TNLD_CONTROL_TLS_CERTIFICATE_FILE: /etc/tnl/local.crt
      TNLD_CONTROL_TLS_PRIVATE_KEY_FILE: /etc/tnl/local.key
      TNLD_RELAY_TLS_CERTIFICATE_FILE: /etc/tnl/local.crt
      TNLD_RELAY_TLS_PRIVATE_KEY_FILE: /etc/tnl/local.key
      TNLD_DATABASE_URL: postgresql://tnl:tnl@postgres/${TNL_LOCAL_DATABASE:-tnl}?sslmode=disable
      TNLD_INGRESS_LISTEN: :8443
      TNLD_LOGIN_TOKEN: ${TNLD_LOGIN_TOKEN:-tnl_login_AAECAwQFBgcICQoLDA0ODw.EBESExQVFhcYGRobHB0eHyAhIiMkJSYnKCkqKywtLi8}
      TNLD_MANAGED_DOMAIN: 127.0.0.1.nip.io
      TNLD_METRICS_LISTEN: 0.0.0.0:9090
      TNLD_ROLE: standalone
      TNLD_RELAY_UDP_LISTEN: :8443
      TNLD_REFRESH_TOKEN_LIFETIME: 720h
      TNLD_SERVER_DOMAIN: 127.0.0.1.nip.io
      TNLD_STORAGE_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
    ports:
      - "127.0.0.1:443:8443/tcp"
      - "127.0.0.1:443:8443/udp"
      - "127.0.0.1:9090:9090"
    tmpfs:
      - /tmp:size=16m,mode=1777
    volumes:
      - ../../.local/certs/local.crt:/etc/tnl/local.crt:ro
      - ../../.local/certs/local.key:/etc/tnl/local.key:ro
      - ../../.local/certs/local-root.pem:/etc/ssl/certs/tnl-local-root.pem:ro
      - ./pebble.minica.crt:/etc/ssl/certs/pebble.minica.crt:ro

volumes:
  postgres-state:
