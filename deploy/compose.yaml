name: tnl

x-tnld: &tnld
  image: ${TNL_IMAGE:?set TNL_IMAGE to a verified digest-pinned image}
  entrypoint: [/usr/local/bin/tnld]
  read_only: true
  cap_add:
    - NET_BIND_SERVICE
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  env_file:
    - ${TNL_ENV_FILE:-.env}
  tmpfs:
    - /tmp:size=16m,mode=1777

services:
  control-proxy:
    image: caddy:2.10.2-alpine@sha256:4c6e91c6ed0e2fa03efd5b44747b625fec79bc9cd06ac5235a779726618e530d
    restart: unless-stopped
    environment:
      TNL_CONTROL_HOSTNAME: ${TNL_CONTROL_HOSTNAME:?set TNL_CONTROL_HOSTNAME}
      TNL_CONTROL_BACKEND: tnld:8080
    ports:
      - "${TNL_CONTROL_BIND:?set a separate control proxy bind address}:443:443/tcp"
      - "${TNL_CONTROL_BIND}:80:80/tcp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - control-proxy-data:/data
      - control-proxy-config:/config
    networks:
      control:
        ipv4_address: 172.31.253.2
  migrate:
    <<: *tnld
    command: migrate
    env_file: []
    environment:
      TNLD_DATABASE_DIRECT_URL: ${TNLD_DATABASE_DIRECT_URL:?set a direct migration URL}
    restart: "no"

  tnld:
    <<: *tnld
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    stop_grace_period: 45s
    environment:
      TNLD_DATABASE_DIRECT_URL: ""
      TNLD_CLUSTER_SECRET: ""
      TNLD_CLUSTER_SECRET_PREVIOUS: ""
      TNLD_CONTROL_LISTEN: 172.31.253.3:8080
      TNLD_CONTROL_TRUSTED_PROXIES: 172.31.253.2/32
      TNLD_CONTROL_CLIENT_IP_HEADER: X-Forwarded-For
      TNLD_SERVICE_PORT_RANGES: 20000-20015
      TNLD_INGRESS_LISTEN: :443
      TNLD_METRICS_LISTEN: 0.0.0.0:9090
      TNLD_ROLE: standalone
      TNLD_RELAY_UDP_LISTEN: :443
    ports:
      - "${TNL_PUBLIC_BIND:-0.0.0.0}:443:443/tcp"
      - "${TNL_PUBLIC_BIND:-0.0.0.0}:443:443/udp"
      - "${TNL_PUBLIC_BIND:-0.0.0.0}:20000-20015:20000-20015/tcp"
    expose:
      - "9090"
    networks:
      default:
      control:
        ipv4_address: 172.31.253.3

networks:
  control:
    ipam:
      config: [{ subnet: 172.31.253.0/24 }]

volumes:
  control-proxy-data:
  control-proxy-config:
