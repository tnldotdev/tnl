name: tnl

x-tnld: &tnld
  image: ${TNL_IMAGE:?set TNL_IMAGE to a verified digest-pinned image}
  read_only: true
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  env_file:
    - ${TNL_ENV_FILE:-.env}
  tmpfs:
    - /tmp:size=16m,mode=1777

services:
  migrate:
    <<: *tnld
    command: migrate
    restart: "no"

  tnld:
    <<: *tnld
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    stop_grace_period: 45s
    environment:
      TNLD_CONTROL_LISTEN: :8443
      TNLD_INGRESS_LISTEN: :8443
      TNLD_METRICS_LISTEN: 0.0.0.0:9090
      TNLD_MODE: standalone
      TNLD_RELAY_UDP_LISTEN: :8443
    ports:
      - "${TNL_PUBLIC_BIND:-0.0.0.0}:443:8443/tcp"
      - "${TNL_PUBLIC_BIND:-0.0.0.0}:443:8443/udp"
    expose:
      - "9090"
