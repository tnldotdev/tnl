name: tnl

services:
  tnld:
    image: ${TNL_IMAGE:?set TNL_IMAGE to a verified digest-pinned image}
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 45s
    env_file:
      - ${TNL_ENV_FILE:-.env}
    environment:
      TNLD_MODE: standalone
      TNLD_STATE_DIR: /var/lib/tnl
      TNLD_PUBLIC_LISTEN: :8443
      TNLD_METRICS_LISTEN: 0.0.0.0:9090
    ports:
      - "${TNL_PUBLIC_BIND:-0.0.0.0}:443:8443/tcp"
    expose:
      - "9090"
    tmpfs:
      - /tmp:size=16m,mode=1777
    volumes:
      - tnld-state:/var/lib/tnl

volumes:
  tnld-state:
    name: ${TNL_STATE_VOLUME:-tnl_tnld-state}
