AWSTemplateFormatVersion: "2010-09-09"
Description: 'tnl publisher group: independent single-task replicas, pinned signing identities, durable private EFS identity files, task-local runtime state.'
Metadata:
  tnl:parameter-contract-version: 1
  tnl:template-version: "2"
Parameters:
  AdditionalSecurityGroup1:
    Type: String
    Description: Additional task security group in VpcId. At most five groups including the primary.
    Default: ""
    AllowedPattern: (sg-[0-9a-f]{8,17})?
    MaxLength: 20
  AdditionalSecurityGroup2:
    Type: String
    Description: Additional task security group in VpcId. At most five groups including the primary.
    Default: ""
    AllowedPattern: (sg-[0-9a-f]{8,17})?
    MaxLength: 20
  AdditionalSecurityGroup3:
    Type: String
    Description: Additional task security group in VpcId. At most five groups including the primary.
    Default: ""
    AllowedPattern: (sg-[0-9a-f]{8,17})?
    MaxLength: 20
  AdditionalSecurityGroup4:
    Type: String
    Description: Additional task security group in VpcId. At most five groups including the primary.
    Default: ""
    AllowedPattern: (sg-[0-9a-f]{8,17})?
    MaxLength: 20
  AssignPublicIp:
    Type: String
    Description: Keep disabled for private subnets with NAT/endpoints; enable only with appropriate public routing.
    Default: DISABLED
    AllowedValues:
      - DISABLED
      - ENABLED
  CPUArchitecture:
    Type: String
    Description: Image architecture; the pinned digest must support this architecture.
    Default: X86_64
    AllowedValues:
      - X86_64
      - ARM64
  ClusterName:
    Type: String
    Description: Optional new cluster name; overrides prefix.
    Default: ""
    AllowedPattern: ([A-Za-z0-9_-]+)?
    MaxLength: 255
  ControlURL:
    Type: String
    Description: HTTPS control origin supplied by bootstrap.
    AllowedPattern: https://[a-z0-9.-]+(:[0-9]+)?
    MaxLength: 253
  DeploymentID:
    Type: String
    Description: Immutable unique deployment ID from bootstrap. Preserve on every update; never reuse for another group.
    AllowedPattern: '[a-z0-9][a-z0-9-]{0,47}'
    MaxLength: 48
  EFSSecurityGroupName:
    Type: String
    Description: Optional new EFS security group name; overrides resource prefix.
    Default: ""
    AllowedPattern: ((?!sg-)[A-Za-z0-9 ._:/()#,@\[\]+=;{}!$*-]+)?
    MaxLength: 255
  ExistingClusterArn:
    Type: String
    Description: Existing cluster ARN; never owned or modified by this stack.
    Default: ""
    AllowedPattern: (arn:[a-z0-9-]+:ecs:[a-z0-9-]+:[0-9]{12}:cluster/[A-Za-z0-9_-]+)?
    MaxLength: 512
  ExistingPublisherSecurityGroupId:
    Type: String
    Description: Existing task security group in VpcId; customer owns its egress and inbound rules.
    Default: ""
    AllowedPattern: (sg-[0-9a-f]{8,17})?
    MaxLength: 20
  FileSystemKMSKeyArn:
    Type: String
    Description: Key for the stack's encrypted Regional filesystem. EFS service uses this key; task roles need no KMS decrypt permission.
    Default: ""
    AllowedPattern: (arn:[a-z0-9-]+:kms:[a-z0-9-]+:[0-9]{12}:key/[a-zA-Z0-9-]+)?
    MaxLength: 256
  Group:
    Type: String
    Description: Configuration group selector; may change without changing replica storage paths.
    AllowedPattern: (?!local$)[a-z](?:[a-z0-9-]{0,30}[a-z0-9])?
    MaxLength: 32
  LogRetentionDays:
    Type: String
    Description: Retention for new log groups; existing groups retain their settings.
    Default: "30"
    AllowedValues:
      - "1"
      - "3"
      - "5"
      - "7"
      - "14"
      - "30"
      - "60"
      - "90"
      - "120"
      - "150"
      - "180"
      - "365"
      - "400"
      - "545"
      - "731"
      - "1096"
      - "1827"
      - "2192"
      - "2557"
      - "2922"
      - "3288"
      - "3653"
  LogsKMSKeyArn:
    Type: String
    Description: Key for new log groups only. Key policy must allow logs.REGION.URLSuffix with kms:EncryptionContext:aws:logs:arn scoped to the log group ARN.
    Default: ""
    AllowedPattern: (arn:[a-z0-9-]+:kms:[a-z0-9-]+:[0-9]{12}:key/[a-zA-Z0-9-]+)?
    MaxLength: 256
  MountSubnet1:
    Type: String
    Description: EFS mount subnet. Select exactly one subnet per AZ used by tasks; unused entries stay empty.
    Default: ""
    AllowedPattern: (subnet-[0-9a-f]{8,17})?
    MaxLength: 24
  MountSubnet2:
    Type: String
    Description: EFS mount subnet. Select exactly one subnet per AZ used by tasks; unused entries stay empty.
    Default: ""
    AllowedPattern: (subnet-[0-9a-f]{8,17})?
    MaxLength: 24
  MountSubnet3:
    Type: String
    Description: EFS mount subnet. Select exactly one subnet per AZ used by tasks; unused entries stay empty.
    Default: ""
    AllowedPattern: (subnet-[0-9a-f]{8,17})?
    MaxLength: 24
  MountSubnet4:
    Type: String
    Description: EFS mount subnet. Select exactly one subnet per AZ used by tasks; unused entries stay empty.
    Default: ""
    AllowedPattern: (subnet-[0-9a-f]{8,17})?
    MaxLength: 24
  MountSubnet5:
    Type: String
    Description: EFS mount subnet. Select exactly one subnet per AZ used by tasks; unused entries stay empty.
    Default: ""
    AllowedPattern: (subnet-[0-9a-f]{8,17})?
    MaxLength: 24
  MountSubnet6:
    Type: String
    Description: EFS mount subnet. Select exactly one subnet per AZ used by tasks; unused entries stay empty.
    Default: ""
    AllowedPattern: (subnet-[0-9a-f]{8,17})?
    MaxLength: 24
  MountSubnetCount:
    Type: String
    Description: Number of distinct AZ mount subnets, one per AZ. Never put two mount subnets in the same AZ.
    Default: "2"
    AllowedValues:
      - "1"
      - "2"
      - "3"
      - "4"
      - "5"
      - "6"
  PermissionsBoundaryArn:
    Type: String
    Description: Boundary for new IAM roles only; existing role policies and boundaries remain customer-owned.
    Default: ""
    AllowedPattern: (arn:[a-z0-9-]+:iam::[0-9]{12}:policy/[A-Za-z0-9+=,.@_/-]+)?
    MaxLength: 512
  PlatformVersion:
    Type: String
    Description: Linux Fargate platform with EFS and pinned secret-version injection.
    Default: 1.4.0
    AllowedValues:
      - 1.4.0
      - LATEST
  ProjectKey:
    Type: String
    Description: Stable Git source project key; must match the provisioned identities.
    AllowedPattern: '[a-z0-9][a-z0-9-]{0,62}'
    MaxLength: 63
  PublisherGroupID:
    Type: String
    Description: Actual immutable publisher group ID supplied by bootstrap.
    AllowedPattern: '[A-Za-z0-9][A-Za-z0-9_-]{0,127}'
    MaxLength: 128
  PublisherImage:
    Type: String
    Description: Publicly pullable image by digest, with /usr/local/bin/tnl and private /state owned by 65532. Private registry authentication is external.
    AllowedPattern: '[a-z0-9.-]+(:[0-9]+)?/[a-z0-9._/-]+@sha256:[a-f0-9]{64}'
    MaxLength: 512
  PublisherSecurityGroupName:
    Type: String
    Description: Optional new task security group name; overrides resource prefix.
    Default: ""
    AllowedPattern: ((?!sg-)[A-Za-z0-9 ._:/()#,@\[\]+=;{}!$*-]+)?
    MaxLength: 255
  Replica1DesiredCount:
    Type: String
    Description: One runs this independent replica; zero stops it without destroying identity state.
    Default: "1"
    AllowedValues:
      - "0"
      - "1"
  Replica1ExecutionRoleName:
    Type: String
    Description: Optional new role name; requires CAPABILITY_NAMED_IAM. Overrides resource prefix.
    Default: ""
    AllowedPattern: ([A-Za-z0-9+=,.@_-]+)?
    MaxLength: 64
  Replica1ExistingExecutionRoleArn:
    Type: String
    Description: Existing replica-private role. Customer must supply the same scoped policy as the generated role; stack never changes it.
    Default: ""
    AllowedPattern: (arn:[a-z0-9-]+:iam::[0-9]{12}:role/[A-Za-z0-9+=,.@_/-]+)?
    MaxLength: 512
  Replica1ExistingLogGroupName:
    Type: String
    Description: Existing log group; customer owns retention and KMS policy.
    Default: ""
    AllowedPattern: ([A-Za-z0-9_./#-]+)?
    MaxLength: 512
  Replica1ExistingTaskRoleArn:
    Type: String
    Description: Existing replica-private role. Customer must supply the same scoped policy as the generated role; stack never changes it.
    Default: ""
    AllowedPattern: (arn:[a-z0-9-]+:iam::[0-9]{12}:role/[A-Za-z0-9+=,.@_/-]+)?
    MaxLength: 512
  Replica1IdentityKMSKeyArn:
    Type: String
    Description: Customer-managed key for this replica secret; key policy must permit execution-role decrypt via Secrets Manager with SecretARN context.
    Default: ""
    AllowedPattern: (arn:[a-z0-9-]+:kms:[a-z0-9-]+:[0-9]{12}:key/[a-zA-Z0-9-]+)?
    MaxLength: 256
  Replica1IdentitySecretArn:
    Type: String
    Description: Existing replica-private Secrets Manager SecretString containing provisioned group identity JSON; never shared with another replica.
    AllowedPattern: arn:[a-z0-9-]+:secretsmanager:[a-z0-9-]+:[0-9]{12}:secret:[A-Za-z0-9/_+=.@-]+
    MaxLength: 512
  Replica1IdentitySecretVersion:
    Type: String
    Description: Pinned secret version ID injected at every task launch, including replacements.
    AllowedPattern: '[A-Za-z0-9-]{32,64}'
    MaxLength: 64
  Replica1Instance:
    Type: String
    Description: Provisioned instance name; must match identity JSON. EFS paths use immutable replica keys.
    AllowedPattern: '[a-z](?:[a-z0-9-]{0,30}[a-z0-9])?'
    MaxLength: 32
  Replica1LogGroupName:
    Type: String
    Description: Optional new log group name; overrides resource prefix.
    Default: ""
    AllowedPattern: ((?!aws/)[A-Za-z0-9_./#-]+)?
    MaxLength: 512
  Replica1PublisherIdentityID:
    Type: String
    Description: Public publisher identity ID returned by bootstrap; never the signing key.
    AllowedPattern: '[A-Za-z0-9][A-Za-z0-9_-]{0,127}'
    MaxLength: 128
  Replica1ServiceName:
    Type: String
    Description: Optional ECS service physical name; overrides resource prefix.
    Default: ""
    AllowedPattern: ([A-Za-z0-9_-]+)?
    MaxLength: 255
  Replica1TaskFamily:
    Type: String
    Description: Optional task definition family; overrides resource prefix.
    Default: ""
    AllowedPattern: ([A-Za-z0-9_-]+)?
    MaxLength: 255
  Replica1TaskRoleName:
    Type: String
    Description: Optional new role name; requires CAPABILITY_NAMED_IAM. Overrides resource prefix.
    Default: ""
    AllowedPattern: ([A-Za-z0-9+=,.@_-]+)?
    MaxLength: 64
  Replica2DesiredCount:
    Type: String
    Description: One runs this independent replica; zero stops it without destroying identity state.
    Default: "1"
    AllowedValues:
      - "0"
      - "1"
  Replica2ExecutionRoleName:
    Type: String
    Description: Optional new role name; requires CAPABILITY_NAMED_IAM. Overrides resource prefix.
    Default: ""
    AllowedPattern: ([A-Za-z0-9+=,.@_-]+)?
    MaxLength: 64
  Replica2ExistingExecutionRoleArn:
    Type: String
    Description: Existing replica-private role. Customer must supply the same scoped policy as the generated role; stack never changes it.
    Default: ""
    AllowedPattern: (arn:[a-z0-9-]+:iam::[0-9]{12}:role/[A-Za-z0-9+=,.@_/-]+)?
    MaxLength: 512
  Replica2ExistingLogGroupName:
    Type: String
    Description: Existing log group; customer owns retention and KMS policy.
    Default: ""
    AllowedPattern: ([A-Za-z0-9_./#-]+)?
    MaxLength: 512
  Replica2ExistingTaskRoleArn:
    Type: String
    Description: Existing replica-private role. Customer must supply the same scoped policy as the generated role; stack never changes it.
    Default: ""
    AllowedPattern: (arn:[a-z0-9-]+:iam::[0-9]{12}:role/[A-Za-z0-9+=,.@_/-]+)?
    MaxLength: 512
  Replica2IdentityKMSKeyArn:
    Type: String
    Description: Customer-managed key for this replica secret; key policy must permit execution-role decrypt via Secrets Manager with SecretARN context.
    Default: ""
    AllowedPattern: (arn:[a-z0-9-]+:kms:[a-z0-9-]+:[0-9]{12}:key/[a-zA-Z0-9-]+)?
    MaxLength: 256
  Replica2IdentitySecretArn:
    Type: String
    Description: Existing replica-private Secrets Manager SecretString containing provisioned group identity JSON; never shared with another replica.
    AllowedPattern: arn:[a-z0-9-]+:secretsmanager:[a-z0-9-]+:[0-9]{12}:secret:[A-Za-z0-9/_+=.@-]+
    MaxLength: 512
  Replica2IdentitySecretVersion:
    Type: String
    Description: Pinned secret version ID injected at every task launch, including replacements.
    AllowedPattern: '[A-Za-z0-9-]{32,64}'
    MaxLength: 64
  Replica2Instance:
    Type: String
    Description: Provisioned instance name; must match identity JSON. EFS paths use immutable replica keys.
    AllowedPattern: '[a-z](?:[a-z0-9-]{0,30}[a-z0-9])?'
    MaxLength: 32
  Replica2LogGroupName:
    Type: String
    Description: Optional new log group name; overrides resource prefix.
    Default: ""
    AllowedPattern: ((?!aws/)[A-Za-z0-9_./#-]+)?
    MaxLength: 512
  Replica2PublisherIdentityID:
    Type: String
    Description: Public publisher identity ID returned by bootstrap; never the signing key.
    AllowedPattern: '[A-Za-z0-9][A-Za-z0-9_-]{0,127}'
    MaxLength: 128
  Replica2ServiceName:
    Type: String
    Description: Optional ECS service physical name; overrides resource prefix.
    Default: ""
    AllowedPattern: ([A-Za-z0-9_-]+)?
    MaxLength: 255
  Replica2TaskFamily:
    Type: String
    Description: Optional task definition family; overrides resource prefix.
    Default: ""
    AllowedPattern: ([A-Za-z0-9_-]+)?
    MaxLength: 255
  Replica2TaskRoleName:
    Type: String
    Description: Optional new role name; requires CAPABILITY_NAMED_IAM. Overrides resource prefix.
    Default: ""
    AllowedPattern: ([A-Za-z0-9+=,.@_-]+)?
    MaxLength: 64
  ResourcePrefix:
    Type: String
    Description: Optional physical-name prefix. Empty uses CloudFormation-generated names; IAM names require CAPABILITY_NAMED_IAM. Must not produce an sg- security group name.
    Default: ""
    AllowedPattern: ((?![sS][gG](?:-|$))[A-Za-z][A-Za-z0-9-]{0,31})?
    MaxLength: 32
  Subnets:
    Type: List<AWS::EC2::Subnet::Id>
    Description: Existing task subnets with DNS and outbound connectivity to control, relays, targets, EFS, registry, Secrets Manager and logs.
  TaskCPU:
    Type: String
    Description: Fargate CPU units. Rules enforce supported memory combinations.
    Default: "256"
    AllowedValues:
      - "256"
      - "512"
      - "1024"
      - "2048"
      - "4096"
  TaskMemory:
    Type: String
    Description: Fargate memory MiB. Rules enforce supported CPU combinations.
    Default: "512"
    AllowedValues:
      - "512"
      - "1024"
      - "1536"
      - "2048"
      - "2560"
      - "3072"
      - "3584"
      - "4096"
      - "4608"
      - "5120"
      - "5632"
      - "6144"
      - "6656"
      - "7168"
      - "7680"
      - "8192"
      - "8704"
      - "9216"
      - "9728"
      - "10240"
      - "10752"
      - "11264"
      - "11776"
      - "12288"
      - "12800"
      - "13312"
      - "13824"
      - "14336"
      - "14848"
      - "15360"
      - "15872"
      - "16384"
      - "16896"
      - "17408"
      - "17920"
      - "18432"
      - "18944"
      - "19456"
      - "19968"
      - "20480"
      - "20992"
      - "21504"
      - "22016"
      - "22528"
      - "23040"
      - "23552"
      - "24064"
