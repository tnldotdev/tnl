      - "29184"
      - "29696"
      - "30208"
      - "30720"
  TeamID:
    Type: String
    Description: Actual team ID supplied by bootstrap; not a mutable team name.
    AllowedPattern: '[A-Za-z0-9][A-Za-z0-9_-]{0,127}'
    MaxLength: 128
  TemplateSHA256:
    Type: String
    Description: Exact template byte SHA-256 from manifest.json, supplied by the consumer (a template cannot hash itself).
    AllowedPattern: '[a-f0-9]{64}'
    MaxLength: 64
  VpcId:
    Type: String
    Description: Existing VPC for tasks and EFS mount targets.
    AllowedPattern: vpc-[0-9a-f]{8,17}
    MaxLength: 21
Conditions:
  CreateCluster:
    Fn::Not:
      - Condition: HasExistingClusterArn
  CreateMountTarget1:
    Fn::And:
      - Fn::Or:
          - Fn::Equals:
              - Ref: MountSubnetCount
              - "1"
          - Fn::Equals:
              - Ref: MountSubnetCount
              - "2"
          - Fn::Equals:
              - Ref: MountSubnetCount
              - "3"
          - Fn::Equals:
              - Ref: MountSubnetCount
              - "4"
          - Fn::Equals:
              - Ref: MountSubnetCount
              - "5"
          - Fn::Equals:
              - Ref: MountSubnetCount
              - "6"
      - Condition: HasMountSubnet1
  CreateMountTarget2:
    Fn::And:
      - Fn::Or:
          - Fn::Equals:
              - Ref: MountSubnetCount
              - "2"
          - Fn::Equals:
              - Ref: MountSubnetCount
              - "3"
          - Fn::Equals:
              - Ref: MountSubnetCount
              - "4"
          - Fn::Equals:
              - Ref: MountSubnetCount
              - "5"
          - Fn::Equals:
              - Ref: MountSubnetCount
              - "6"
      - Condition: HasMountSubnet2
  CreateMountTarget3:
    Fn::And:
      - Fn::Or:
          - Fn::Equals:
              - Ref: MountSubnetCount
              - "3"
          - Fn::Equals:
              - Ref: MountSubnetCount
              - "4"
          - Fn::Equals:
              - Ref: MountSubnetCount
              - "5"
          - Fn::Equals:
              - Ref: MountSubnetCount
              - "6"
      - Condition: HasMountSubnet3
  CreateMountTarget4:
    Fn::And:
      - Fn::Or:
          - Fn::Equals:
              - Ref: MountSubnetCount
              - "4"
          - Fn::Equals:
              - Ref: MountSubnetCount
              - "5"
          - Fn::Equals:
              - Ref: MountSubnetCount
              - "6"
      - Condition: HasMountSubnet4
  CreateMountTarget5:
    Fn::And:
      - Fn::Or:
          - Fn::Equals:
              - Ref: MountSubnetCount
              - "5"
          - Fn::Equals:
              - Ref: MountSubnetCount
              - "6"
      - Condition: HasMountSubnet5
  CreateMountTarget6:
    Fn::And:
      - Fn::Equals:
          - Ref: MountSubnetCount
          - "6"
      - Condition: HasMountSubnet6
  CreatePublisherSecurityGroup:
    Fn::Not:
      - Condition: HasExistingPublisherSecurityGroupId
  CreateReplica1ExecutionRole:
    Fn::Not:
      - Condition: HasReplica1ExistingExecutionRoleArn
  CreateReplica1Logs:
    Fn::Not:
      - Condition: HasReplica1ExistingLogGroupName
  CreateReplica1TaskRole:
    Fn::Not:
      - Condition: HasReplica1ExistingTaskRoleArn
  CreateReplica2ExecutionRole:
    Fn::Not:
      - Condition: HasReplica2ExistingExecutionRoleArn
  CreateReplica2Logs:
    Fn::Not:
      - Condition: HasReplica2ExistingLogGroupName
  CreateReplica2TaskRole:
    Fn::Not:
      - Condition: HasReplica2ExistingTaskRoleArn
  HasAdditionalSecurityGroup1:
    Fn::Not:
      - Fn::Equals:
          - Ref: AdditionalSecurityGroup1
          - ""
  HasAdditionalSecurityGroup2:
    Fn::Not:
      - Fn::Equals:
          - Ref: AdditionalSecurityGroup2
          - ""
  HasAdditionalSecurityGroup3:
    Fn::Not:
      - Fn::Equals:
          - Ref: AdditionalSecurityGroup3
          - ""
  HasAdditionalSecurityGroup4:
    Fn::Not:
      - Fn::Equals:
          - Ref: AdditionalSecurityGroup4
          - ""
  HasClusterName:
    Fn::Not:
      - Fn::Equals:
          - Ref: ClusterName
          - ""
  HasEFSSecurityGroupName:
    Fn::Not:
      - Fn::Equals:
          - Ref: EFSSecurityGroupName
          - ""
  HasExistingClusterArn:
    Fn::Not:
      - Fn::Equals:
          - Ref: ExistingClusterArn
          - ""
  HasExistingPublisherSecurityGroupId:
    Fn::Not:
      - Fn::Equals:
          - Ref: ExistingPublisherSecurityGroupId
          - ""
  HasFileSystemKMSKeyArn:
    Fn::Not:
      - Fn::Equals:
          - Ref: FileSystemKMSKeyArn
          - ""
  HasLogsKMSKeyArn:
    Fn::Not:
      - Fn::Equals:
          - Ref: LogsKMSKeyArn
          - ""
  HasMountSubnet1:
    Fn::Not:
      - Fn::Equals:
          - Ref: MountSubnet1
          - ""
  HasMountSubnet2:
    Fn::Not:
      - Fn::Equals:
