  HasPermissionsBoundaryArn:
    Fn::Not:
      - Fn::Equals:
          - Ref: PermissionsBoundaryArn
          - ""
  HasPublisherSecurityGroupName:
    Fn::Not:
      - Fn::Equals:
          - Ref: PublisherSecurityGroupName
          - ""
  HasReplica1ExecutionRoleName:
    Fn::Not:
      - Fn::Equals:
          - Ref: Replica1ExecutionRoleName
          - ""
  HasReplica1ExistingExecutionRoleArn:
    Fn::Not:
      - Fn::Equals:
          - Ref: Replica1ExistingExecutionRoleArn
          - ""
  HasReplica1ExistingLogGroupName:
    Fn::Not:
      - Fn::Equals:
          - Ref: Replica1ExistingLogGroupName
          - ""
  HasReplica1ExistingTaskRoleArn:
    Fn::Not:
      - Fn::Equals:
          - Ref: Replica1ExistingTaskRoleArn
          - ""
  HasReplica1IdentityKMSKeyArn:
    Fn::Not:
      - Fn::Equals:
          - Ref: Replica1IdentityKMSKeyArn
          - ""
  HasReplica1LogGroupName:
    Fn::Not:
      - Fn::Equals:
          - Ref: Replica1LogGroupName
          - ""
  HasReplica1ServiceName:
    Fn::Not:
      - Fn::Equals:
          - Ref: Replica1ServiceName
          - ""
  HasReplica1TaskFamily:
    Fn::Not:
      - Fn::Equals:
          - Ref: Replica1TaskFamily
          - ""
  HasReplica1TaskRoleName:
    Fn::Not:
      - Fn::Equals:
          - Ref: Replica1TaskRoleName
          - ""
  HasReplica2ExecutionRoleName:
    Fn::Not:
      - Fn::Equals:
          - Ref: Replica2ExecutionRoleName
          - ""
  HasReplica2ExistingExecutionRoleArn:
    Fn::Not:
      - Fn::Equals:
          - Ref: Replica2ExistingExecutionRoleArn
          - ""
  HasReplica2ExistingLogGroupName:
    Fn::Not:
      - Fn::Equals:
          - Ref: Replica2ExistingLogGroupName
