app = "tnl-control-staging"
primary_region = "sjc"
kill_signal = "SIGTERM"
kill_timeout = 45

[env]
AWS_EC2_METADATA_DISABLED = "true"
AWS_ROLE_ARN = "arn:aws:iam::238224495584:role/tnl-dns-runtime-staging"
TNLD_ROLE = "control"
TNLD_CONTROL_LISTEN = "0.0.0.0:8443"
TNLD_PRIVATE_CONTROL_LISTEN = "[::]:9443"
TNLD_METRICS_LISTEN = "[::]:9090"
TNLD_REQUIRE_PROXY_HEADER = "true"
TNLD_SERVER_DOMAIN = "tnl.wtf"
TNLD_MANAGED_DOMAIN = "tnl.wtf"
TNLD_MANAGED_URL_MODE = "generated"
TNLD_MANAGED_DOMAIN_MAX_MEMBER_CHILD_LABELS = "1"
TNLD_CUSTOM_DOMAINS_ENABLED = "true"
TNLD_EMAIL_URL = "https://account.tnl.wtf"
TNLD_GUEST_DEMO_ENABLED = "true"
TNLD_OIDC_ISSUER = "https://account.tnl.wtf"
TNLD_OIDC_CLIENT_ID = "tnl-cli"
TNLD_BROWSER_OIDC_CLIENT_ID = "tnl-browser"
TNLD_OIDC_LOGIN_FLOW = "device_code"
TNLD_OIDC_SCOPES = "openid,offline_access,product,operations"
TNLD_ACME_ACCEPT_TERMS = "true"
TNLD_ACME_DIRECTORY_URL = "https://acme-v02.api.letsencrypt.org/directory"
TNLD_ACME_EMAIL = "ops@tnl.dev"
TNLD_RESERVED_ROUTE_NAMES = "account,bench,test"
TNLD_PUBLIC_URL_CERTIFICATE_WORKERS = "8"
TNLD_ROUTE53_REGION = "us-east-1"
TNLD_PUBLIC_URL_USAGE_URL = "https://account.tnl.wtf"

[[metrics]]
port = 9090
path = "/metrics"

[[services]]
protocol = "tcp"
internal_port = 8443
auto_stop_machines = "off"
auto_start_machines = true
min_machines_running = 2

[[services.ports]]
handlers = ["proxy_proto"]
port = 443
proxy_proto_options = { version = "v2" }

[[services.tcp_checks]]
grace_period = "30s"
interval = "15s"
timeout = "2s"

[[vm]]
cpu_kind = "shared"
cpus = 1
memory = "512mb"
