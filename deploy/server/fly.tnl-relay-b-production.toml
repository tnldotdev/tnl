app = "tnl-relay-b-production"
primary_region = "sjc"
kill_signal = "SIGTERM"
kill_timeout = 45

[processes]
app = "serve"
udp = "serve"

[env]
TNLD_ROLE = "relay"
TNLD_RELAY_SERVICE_ID = "relay-b"
TNLD_RELAY_ADDRESS = "relay-b.tnl.dev:443"
TNLD_RELAY_TCP_LISTEN = "0.0.0.0:8443"
TNLD_RELAY_UDP_LISTEN = "fly-global-services:443"
TNLD_INTERNAL_RELAY_LISTEN = "[::]:9445"
TNLD_METRICS_LISTEN = "[::]:9090"
TNLD_CONTROL_HOSTNAME = "control.tnl.dev"
TNLD_PRIVATE_CONTROL_ADDRESS = "tnl-control-production.internal:9443"
TNLD_CLUSTER_SECRET_PREVIOUS = ""

[[metrics]]
port = 9090
path = "/metrics"

[[services]]
protocol = "tcp"
internal_port = 8443
processes = ["app", "udp"]
auto_stop_machines = "off"
auto_start_machines = true
min_machines_running = 2

[[services.ports]]
port = 443

[[services.tcp_checks]]
grace_period = "30s"
interval = "15s"
timeout = "2s"

[[services]]
protocol = "udp"
internal_port = 443
processes = ["udp"]

[[services.ports]]
port = 443

[[vm]]
cpu_kind = "shared"
cpus = 1
memory = "512mb"
