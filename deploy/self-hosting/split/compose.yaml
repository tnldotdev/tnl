name: tnl-split

x-tnld: &tnld
  image: ${TNL_IMAGE:?set TNL_IMAGE to a verified digest-pinned image}
  entrypoint: [/usr/local/bin/tnld]
  read_only: true
  cap_add:
    - NET_BIND_SERVICE
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  tmpfs:
    - /tmp:size=16m,mode=1777

services:
  migrate:
    <<: *tnld
    command: migrate
    environment:
      TNLD_DATABASE_DIRECT_URL: ${TNLD_DATABASE_DIRECT_URL:?set a direct migration URL}
    restart: "no"

  control:
    <<: *tnld
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    env_file:
      - ${TNL_CONTROL_ENV_FILE:-control.env}
    environment:
      TNLD_DATABASE_DIRECT_URL: ""
      TNLD_CONTROL_LISTEN: :8080
      TNLD_CONTROL_TRUSTED_PROXIES: ${TNLD_CONTROL_TRUSTED_PROXIES:?set the HTTPS edge peer CIDRs}
      TNLD_CONTROL_PROXY_PROVIDER: ${TNLD_CONTROL_PROXY_PROVIDER:?select the HTTPS proxy provider}
      TNLD_SERVICE_PORT_RANGES: ${TNL_SERVICE_PORT_RANGE:-20000-20015}
      TNLD_PRIVATE_CONTROL_TLS_CERTIFICATE_FILE: /etc/tnl/cluster.crt
      TNLD_PRIVATE_CONTROL_TLS_PRIVATE_KEY_FILE: /etc/tnl/cluster.key
      TNLD_METRICS_LISTEN: 0.0.0.0:9090
      TNLD_ROLE: control
      TNLD_INGRESS_CONTROL_CREDENTIAL: ${TNL_INGRESS_CONTROL_CREDENTIAL:?set the ingress control credential}
      TNLD_RELAY_SLOTS_FILE: /etc/tnl/relay-slots.json
      TNLD_SERVER_DOMAIN: ${TNLD_SERVER_DOMAIN:?set the server domain}
      TNLD_PRIVATE_CONTROL_LISTEN: :9443
      TNLD_ROUTE53_SERVER_ZONE_ID: ${TNL_SERVER_ZONE_ID:?set TNL_SERVER_ZONE_ID}
    volumes:
      - ${TNL_RELAY_SLOTS_FILE:?set the relay slot inventory}:/etc/tnl/relay-slots.json:ro
      - ${TNL_PRIVATE_CONTROL_CERTIFICATE_FILE:?set the internal control certificate}:/etc/tnl/cluster.crt:ro
      - ${TNL_PRIVATE_CONTROL_KEY_FILE:?set the internal control key}:/etc/tnl/cluster.key:ro
    expose:
      - "9090"
    ports:
      - "${TNL_CONTROL_BIND:-127.0.0.1}:8080:8080/tcp"

  ingress:
    <<: *tnld
    restart: unless-stopped
    depends_on:
      - control
    environment:
      TNLD_CONTROL_HOSTNAME: ${TNL_CONTROL_HOSTNAME:?set TNL_CONTROL_HOSTNAME}
      TNLD_PRIVATE_CONTROL_ADDRESS: control:9443
      TNLD_INGRESS_CONTROL_CREDENTIAL: ${TNL_INGRESS_CONTROL_CREDENTIAL:?set the ingress control credential}
      TNLD_FORWARDING_CREDENTIAL: ${TNL_FORWARDING_CREDENTIAL:?set the forwarding credential}
      TNLD_INGRESS_ID: ingress-a
      TNLD_INGRESS_LISTEN: :443
      TNLD_METRICS_LISTEN: 0.0.0.0:9090
      TNLD_ROLE: ingress
    ports:
      - "${TNL_INGRESS_BIND:?set TNL_INGRESS_BIND}:443:443/tcp"
      - "${TNL_INGRESS_BIND}:443:443/udp"
      - "${TNL_INGRESS_BIND}:${TNL_SERVICE_PORT_RANGE:-20000-20015}:${TNL_SERVICE_PORT_RANGE:-20000-20015}/tcp"
    volumes:
      - ${TNL_CLUSTER_CA_FILE:?set the internal control issuer}:/etc/ssl/certs/tnl-cluster.pem:ro
    expose:
      - "9090"

  ingress-b:
    <<: *tnld
    restart: unless-stopped
    depends_on:
      - control
    environment:
      TNLD_CONTROL_HOSTNAME: ${TNL_CONTROL_HOSTNAME:?set TNL_CONTROL_HOSTNAME}
      TNLD_PRIVATE_CONTROL_ADDRESS: control:9443
      TNLD_INGRESS_CONTROL_CREDENTIAL: ${TNL_INGRESS_CONTROL_CREDENTIAL:?set the ingress control credential}
      TNLD_FORWARDING_CREDENTIAL: ${TNL_FORWARDING_CREDENTIAL:?set the forwarding credential}
      TNLD_INGRESS_ID: ingress-b
      TNLD_INGRESS_LISTEN: :443
      TNLD_METRICS_LISTEN: 0.0.0.0:9090
      TNLD_ROLE: ingress
    ports:
      - "${TNL_INGRESS_B_BIND:?set TNL_INGRESS_B_BIND}:443:443/tcp"
      - "${TNL_INGRESS_B_BIND}:443:443/udp"
      - "${TNL_INGRESS_B_BIND}:${TNL_SERVICE_PORT_RANGE:-20000-20015}:${TNL_SERVICE_PORT_RANGE:-20000-20015}/tcp"
    volumes:
      - ${TNL_CLUSTER_CA_FILE:?set the internal control issuer}:/etc/ssl/certs/tnl-cluster.pem:ro
    expose:
      - "9090"

  relay-a:
    <<: *tnld
    restart: unless-stopped
    volumes:
      - ${TNL_CLUSTER_CA_FILE:?set the internal control issuer}:/etc/ssl/certs/tnl-cluster.pem:ro
    depends_on:
      - control
    environment:
      TNLD_CONTROL_HOSTNAME: ${TNL_CONTROL_HOSTNAME:?set TNL_CONTROL_HOSTNAME}
      TNLD_PRIVATE_CONTROL_ADDRESS: control:9443
      TNLD_RELAY_SLOT_CREDENTIAL: ${TNL_RELAY_A_CREDENTIAL:?set slot A's credential}
      TNLD_FORWARDING_CREDENTIAL: ${TNL_FORWARDING_CREDENTIAL:?set the forwarding credential}
      TNLD_INTERNAL_RELAY_ADDRESS: relay-a:9445
      TNLD_INTERNAL_RELAY_LISTEN: :9445
      TNLD_METRICS_LISTEN: 0.0.0.0:9090
      TNLD_ROLE: relay
      TNLD_RELAY_ADDRESS: relay-a.${TNLD_SERVER_DOMAIN}:443
      TNLD_RELAY_ID: relay-a-1
      TNLD_RELAY_SERVICE_ID: relay-a
      TNLD_RELAY_TCP_LISTEN: :443
      TNLD_RELAY_UDP_LISTEN: :443
      TNLD_RELAY_QUIC_PROFILE: standard
    ports:
      - "${TNL_RELAY_A_BIND:?set TNL_RELAY_A_BIND}:443:443/tcp"
      - "${TNL_RELAY_A_BIND}:443:443/udp"
    expose:
      - "9090"
      - "9445"
      - "9445/udp"

  relay-b:
    <<: *tnld
    restart: unless-stopped
    volumes:
      - ${TNL_CLUSTER_CA_FILE:?set the internal control issuer}:/etc/ssl/certs/tnl-cluster.pem:ro
    depends_on:
      - control
    environment:
      TNLD_CONTROL_HOSTNAME: ${TNL_CONTROL_HOSTNAME:?set TNL_CONTROL_HOSTNAME}
      TNLD_PRIVATE_CONTROL_ADDRESS: control:9443
      TNLD_RELAY_SLOT_CREDENTIAL: ${TNL_RELAY_B_CREDENTIAL:?set slot B's credential}
      TNLD_FORWARDING_CREDENTIAL: ${TNL_FORWARDING_CREDENTIAL:?set the forwarding credential}
      TNLD_INTERNAL_RELAY_ADDRESS: relay-b:9445
      TNLD_INTERNAL_RELAY_LISTEN: :9445
      TNLD_METRICS_LISTEN: 0.0.0.0:9090
      TNLD_ROLE: relay
      TNLD_RELAY_ADDRESS: relay-b.${TNLD_SERVER_DOMAIN}:443
      TNLD_RELAY_ID: relay-b-1
      TNLD_RELAY_SERVICE_ID: relay-b
      TNLD_RELAY_TCP_LISTEN: :443
      TNLD_RELAY_UDP_LISTEN: :443
      TNLD_RELAY_QUIC_PROFILE: standard
    ports:
      - "${TNL_RELAY_B_BIND:?set TNL_RELAY_B_BIND}:443:443/tcp"
      - "${TNL_RELAY_B_BIND}:443:443/udp"
    expose:
      - "9090"
      - "9445"
      - "9445/udp"
