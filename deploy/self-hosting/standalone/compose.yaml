name: tnl

x-tnld: &tnld
  image: ${TNL_IMAGE:?set TNL_IMAGE to a verified digest-pinned image}
  entrypoint: [/usr/local/bin/tnld]
  read_only: true
  cap_add:
    - NET_BIND_SERVICE
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  env_file:
    - ${TNL_ENV_FILE:-.env}
  tmpfs:
    - /tmp:size=16m,mode=1777

services:
  migrate:
    <<: *tnld
    command: migrate
    env_file: []
    environment:
      TNLD_DATABASE_DIRECT_URL: ${TNLD_DATABASE_DIRECT_URL:?set a direct migration URL}
    restart: "no"

  tnld:
    <<: *tnld
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    stop_grace_period: 45s
    environment:
      TNLD_DATABASE_DIRECT_URL: ""
      TNLD_CLUSTER_SECRET: ""
      TNLD_CLUSTER_SECRET_PREVIOUS: ""
      TNLD_CONTROL_LISTEN: :8080
      TNLD_CONTROL_TRUSTED_PROXIES: ${TNLD_CONTROL_TRUSTED_PROXIES:?set the HTTPS edge peer CIDRs}
      TNLD_CONTROL_CLIENT_IP_HEADER: X-Forwarded-For
      TNLD_SERVICE_PORT_RANGES: 20000-20015
      TNLD_INGRESS_LISTEN: :443
      TNLD_METRICS_LISTEN: 0.0.0.0:9090
      TNLD_ROLE: standalone
      TNLD_RELAY_UDP_LISTEN: :443
      TNLD_RELAY_QUIC_PROFILE: standard
    ports:
      - "${TNL_CONTROL_BIND:-127.0.0.1}:8080:8080/tcp"
      - "${TNL_PUBLIC_BIND:-0.0.0.0}:443:443/tcp"
      - "${TNL_PUBLIC_BIND:-0.0.0.0}:443:443/udp"
      - "${TNL_PUBLIC_BIND:-0.0.0.0}:20000-20015:20000-20015/tcp"
    expose:
      - "9090"
