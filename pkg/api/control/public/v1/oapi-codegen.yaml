# yaml-language-server: $schema=https://raw.githubusercontent.com/oapi-codegen/oapi-codegen/v2.8.0/configuration-schema.json
package: controlv1
output: openapi.gen.go
generate:
  client: true
  models: true
  std-http-server: true
output-options:
  # browser feedback references these identical wire models without control
  # content endpoints. keep their defining schemas available to native clients.
  skip-prune: true
