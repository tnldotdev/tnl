version: 2

project_name: tnl

snapshot:
  version_template: "1.0.0-SNAPSHOT-{{ .ShortCommit }}"

before:
  hooks:
    - go mod download

builds:
  - &native-build
    id: tnl
    main: ./cmd/tnl
    binary: tnl
    env:
      - CGO_ENABLED=0
    flags:
      - -mod=readonly
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/tnldotdev/tnl/internal/buildinfo.Version={{ .Version }}
      - -X github.com/tnldotdev/tnl/internal/buildinfo.Commit={{ .FullCommit }}
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
    mod_timestamp: "{{ .CommitTimestamp }}"

  - <<: *native-build
    id: tnld
    main: ./cmd/tnld
    binary: tnld

archives:
  - id: release
    ids:
      - tnl
      - tnld
    formats:
      - tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - NOTICE
      - THIRD_PARTY_LICENSES.txt

checksum:
  name_template: checksums.txt
  algorithm: sha256

sboms:
  - id: archives
    artifacts: archive
    documents:
      - "{{ .ArtifactName }}.spdx.json"
    cmd: syft
    args:
      - ${artifact}
      - --output
      - spdx-json=${document}

signs:
  - id: checksums
    artifacts: checksum
    cmd: cosign
    signature: ${artifact}.sigstore.json
    args:
      - sign-blob
      - --bundle=${signature}
      - ${artifact}
      - --yes

release:
  header: |
    ### database migration history

    Control and client state now use numbered migrations without separate
    baseline identities. The maintainer explicitly approved starting from the
    current schema and dropping compatibility with older development databases
    so future changes can follow one immutable migration history.

    This is a one-time cutover: back up the old PostgreSQL database, storage
    keys, and client state, then stop the old server roles and client processes.
    Initialize a fresh PostgreSQL database with the matching `tnld migrate`
    and `TNLD_DATABASE_DIRECT_URL`, start matching server roles, and use a fresh
    `TNL_STATE_DIR` to sign in and enroll publishers again. There is no import
    or in-place upgrade path from the older development schemas.

    Keep the old deployment and its state together for recovery; do not point
    old binaries at the new database. Future upgrades use numbered migrations
    on existing data. Writable client opens apply pending SQLite migrations;
    read-only opens require the supported schema version.
  draft: true
  replace_existing_draft: true
  prerelease: auto
  preflight:
    fail_on_error: true

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
