version: "3"

tasks:
  publishers:check:
    dir: "{{.ROOT_DIR}}"
    desc: Validate publisher templates, TypeScript contracts, and CloudFormation schemas without AWS
    cmds:
      - go test ./internal/publisher/deployment ./cmd/tnl -run='^Test(Storage|GoldenAndReplicaStability|ReadValidateAndReadOnlyCheck|ManifestRejectsUnsafeAndUnboundedInputs|OutputOwnershipAndSymlinks|ParameterContract|GenerateOfflineAcrossWorktreesAndReadOnlyCheck|ApplyIgnoresPublisherInfrastructure)' -count=1
      - pnpm exec vitest run deploy/publisher/fargate/fargate.test.ts
      - pnpm exec tsc --project deploy/publisher/fargate/tsconfig.json
      - pnpm exec oxlint --deny-warnings --report-unused-disable-directives deploy/publisher/fargate/*.ts
      - uvx --from cfn-lint==1.40.2 cfn-lint --regions us-east-1 --template deploy/publisher/fargate/fargate.yaml
      - uvx --from cfn-lint==1.40.2 cfn-lint --regions us-east-1 --template deploy/publisher/fargate/fargate.yaml --parameters VpcId=vpc-0123456789abcdef0 MountSubnet1=subnet-0123456789abcdef0 MountSubnet2=subnet-0123456789abcdef1 ResourcePrefix=tnl-test FileSystemKMSKeyArn=arn:aws:kms:us-east-1:123456789012:key/12345678-1234-1234-1234-123456789012 LogsKMSKeyArn=arn:aws:kms:us-east-1:123456789012:key/12345678-1234-1234-1234-123456789012 Replica1IdentityKMSKeyArn=arn:aws:kms:us-east-1:123456789012:key/12345678-1234-1234-1234-123456789012 Replica2IdentityKMSKeyArn=arn:aws:kms:us-east-1:123456789012:key/12345678-1234-1234-1234-123456789012
      - uvx --from cfn-lint==1.40.2 cfn-lint --regions us-east-1 --template deploy/publisher/fargate/fargate.yaml --parameters VpcId=vpc-0123456789abcdef0 MountSubnet1=subnet-0123456789abcdef0 MountSubnet2=subnet-0123456789abcdef1 ExistingClusterArn=arn:aws:ecs:us-east-1:123456789012:cluster/existing ExistingPublisherSecurityGroupId=sg-0123456789abcdef0 Replica1ExistingLogGroupName=/customer/replica-1 Replica2ExistingLogGroupName=/customer/replica-2 Replica1ExistingTaskRoleArn=arn:aws:iam::123456789012:role/task-1 Replica2ExistingTaskRoleArn=arn:aws:iam::123456789012:role/task-2 Replica1ExistingExecutionRoleArn=arn:aws:iam::123456789012:role/execution-1 Replica2ExistingExecutionRoleArn=arn:aws:iam::123456789012:role/execution-2

  publishers:storage-check:
    dir: "{{.ROOT_DIR}}"
    desc: Reject immutable publisher storage changes using resolved parameter files, without AWS
    requires:
      vars: [PREVIOUS, NEXT]
    cmds:
      - go run ./internal/publisher/deployment/cmd/storage-check -previous '{{.PREVIOUS}}' -next '{{.NEXT}}'
