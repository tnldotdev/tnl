version: "3"

tasks:
  lint:
    cmds:
      - go vet ./...
      - go -C tools/testharness vet ./...
      - staticcheck ./...

  vulncheck:
    cmds:
      - govulncheck ./...

  vulncheck:wasm:
    desc: Scan the portable SDK, including its embedded certificate roots
    env:
      GOOS: js
      GOARCH: wasm
      CGO_ENABLED: "0"
    cmds:
      - govulncheck -tags=tnlsdk ./packages/ts/wasm

  test:
    desc: Run routine Go tests and compile the public SDK example
    cmds:
      - go test ./...
      - go test ./pkg/tnl/testdata/publicapi

  test:focused:
    desc: Run selected Go assertions without changing their test tier
    requires:
      vars: [PACKAGES]
    vars:
      RUN: '{{default "." .RUN}}'
      FLAGS: '{{default "" .FLAGS}}'
      COUNT: '{{default "1" .COUNT}}'
    cmds:
      - go test {{.FLAGS}} {{.PACKAGES}} -run='{{.RUN}}' -count={{.COUNT}} -timeout=5m

  test:wasm:
    desc: Execute selected Go tests in the pinned JS/WASM runtime
    requires:
      vars: [PACKAGES]
    vars:
      RUN: '{{default "." .RUN}}'
    env:
      GOOS: js
      GOARCH: wasm
      CGO_ENABLED: "0"
    cmds:
      - go test -exec="$(go env GOROOT)/lib/wasm/go_js_wasm_exec" {{.PACKAGES}} -run='{{.RUN}}' -count=1 -timeout=5m

  test:wasm:browser:
    desc: Execute selected Go/WASM tests in installed Google Chrome
    requires:
      vars: [PACKAGES]
    vars:
      RUN: '{{default "." .RUN}}'
    env:
      GOOS: js
      GOARCH: wasm
      CGO_ENABLED: "0"
    cmds:
      - go test -exec="node {{.ROOT_DIR}}/scripts/test/go-wasm-browser.ts" {{.PACKAGES}} -run='{{.RUN}}' -count=1 -timeout=5m

  test:wasm:optimized:
    desc: Execute selected Go tests after the SDK's Binaryen optimization
    requires:
      vars: [PACKAGES]
    vars:
      RUN: '{{default "." .RUN}}'
      RUNTIME: '{{default "node" .RUNTIME}}'
      TAGS: '{{default "" .TAGS}}'
    env:
      GOOS: js
      GOARCH: wasm
      CGO_ENABLED: "0"
    cmds:
      - go test -tags='{{.TAGS}}' -exec="node {{.ROOT_DIR}}/scripts/test/go-wasm-optimized.ts {{.RUNTIME}}" {{.PACKAGES}} -run='{{.RUN}}' -count=1 -timeout=5m

  test:coverage:
    desc: Produce a diagnostic Go coverage report
    cmds:
      - mkdir -p coverage/go
      - go test ./... -coverprofile=coverage/go/coverage.out
      - go tool cover -html=coverage/go/coverage.out -o=coverage/go/index.html

  test:race:
    desc: Run routine Go tests with the race detector
    cmds:
      - go test -race -json ./...
      - go test -race -json ./pkg/tnl/testdata/publicapi

  test:race:service:
    desc: Run routine publisher service-tree tests with the race detector
    cmds:
      - |
        set -eu
        packages="$(go list -race ./internal/publisher/service/...)"
        if [ -z "$packages" ]; then
          echo "No publisher service packages found" >&2
          exit 1
        fi
        go test -race -json $packages

  test:race:rest:
    desc: Run remaining routine Go race tests and compile the public SDK example
    cmds:
      - |
        set -eu
        packages="$(go list -race ./...)"
        packages="$(printf '%s\n' "$packages" | grep -Ev '/internal/publisher/service(/|$)')"
        if [ -z "$packages" ]; then
          echo "No Go packages found outside the publisher service tree" >&2
          exit 1
        fi
        go test -race -json $packages
      - go test -race -json ./pkg/tnl/testdata/publicapi

  test:harness:
    desc: Check disposable orchestration and stable shard selection
    cmds:
      - go -C tools/testharness test -race ./...

  test:fuzz:
    desc: Fuzz Go parser, wire, and policy boundaries
    vars:
      TIME: '{{default "15s" .TIME}}'
    cmds:
      - go test ./internal/ingress/clienthello -run='^$' -fuzz='^FuzzInspectClientHello$' -fuzztime='{{.TIME}}'
      - go test ./internal/transport/proxyproto -run='^$' -fuzz='^FuzzDecode$' -fuzztime='{{.TIME}}'
      - go test ./pkg/protocol/tunnelv1 -run='^$' -fuzz='^FuzzReadFrames$' -fuzztime='{{.TIME}}'
      - go test ./pkg/protocol/tunnelv1 -run='^$' -fuzz='^FuzzReturnFrame$' -fuzztime='{{.TIME}}'
      - go test ./pkg/protocol/tunnelv1 -run='^$' -fuzz='^FuzzConnectorControlMessage$' -fuzztime='{{.TIME}}' -parallel=2
      - go test ./pkg/protocol/tunnelv1 -run='^$' -fuzz='^FuzzWireTraceContext$' -fuzztime='{{.TIME}}' -parallel=2
      - go test ./internal/policy/target -run='^$' -fuzz='^FuzzNormalizeTarget$' -fuzztime='{{.TIME}}'
      - go test ./internal/naming -run='^$' -fuzz='^FuzzCanonicalize$' -fuzztime='{{.TIME}}'
      - go test ./internal/naming -run='^$' -fuzz='^FuzzDomainPolicy$' -fuzztime='{{.TIME}}'
      - go test ./internal/clioutput -run='^$' -fuzz='^FuzzRender$' -fuzztime='{{.TIME}}'

  build:
    cmds:
      - go build ./...
