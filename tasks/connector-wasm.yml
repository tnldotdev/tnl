version: "3"

tasks:
  build:
    dir: "{{.ROOT_DIR}}"
    desc: Build the experimental connector with the pinned Go JS/WASM runtime
    cmds:
      - node scripts/build/connector-wasm.ts

  check:
    dir: "{{.ROOT_DIR}}"
    desc: Check the experimental WASM host and PostgreSQL adapters without infrastructure
    cmds:
      - task: test:go
      - pnpm exec tsc --project development/connector-wasm/tsconfig.json
      - pnpm exec oxlint --deny-warnings --report-unused-disable-directives development/connector-wasm scripts/build/connector-wasm.ts
      - pnpm exec vitest run development/connector-wasm

  test:go:
    dir: "{{.ROOT_DIR}}"
    desc: Run bridge and TLS invariants inside the pinned Go JS/WASM runtime
    env:
      GOOS: js
      GOARCH: wasm
    cmds:
      - go vet ./development/connector-wasm/go
      - go test -exec="$(go env GOROOT)/lib/wasm/go_js_wasm_exec" ./development/connector-wasm/go -count=1 -timeout=1m

  workerd-preflight:
    dir: "{{.ROOT_DIR}}"
    desc: Load the experimental Worker and precompiled WASM module locally without PostgreSQL
    deps: [build]
    cmds:
      - node scripts/test/connector-wasm-workerd.ts --preflight

  benchmark:
    internal: true
    dir: "{{.ROOT_DIR}}"
    desc: Compare retained PostgreSQL queries without race instrumentation
    deps: [build]
    vars:
      RUNTIME: '{{default "node" .RUNTIME}}'
      QUERIES: '{{default "1000" .QUERIES}}'
      VARIANT: '{{default "baseline" .VARIANT}}'
      WARMUP: '{{default "1" .WARMUP}}'
    cmds:
      - go -C tools/testharness run . postgres -- go test -v ./internal/daemon -run='^TestLoadConnectorWASMFixture$' -count=1 -timeout=10m -args -tnl-test-tier=runtime-load -tnl-wasm-fixture-command='["node","scripts/test/connector-wasm.ts","--runtime","{{.RUNTIME}}","--queries","{{.QUERIES}}","--variant","{{.VARIANT}}","--warmup","{{.WARMUP}}","--fixture","{fixture}"]'

  profile:
    dir: "{{.ROOT_DIR}}"
    desc: Compare isolated bridge variants with counters and allocation deltas (CPU=true for separate sampled runs)
    deps: [build]
    vars:
      QUERIES: '{{default "1000" .QUERIES}}'
      CPU: '{{default "false" .CPU}}'
    cmds:
      - node scripts/build/connector-wasm.ts --profile
      - go -C tools/testharness run . postgres -- go test -v ./internal/daemon -run='^TestLoadConnectorWASMFixture$' -count=1 -timeout=10m -args -tnl-test-tier=runtime-load -tnl-wasm-fixture-command='["node","scripts/test/connector-wasm-profile.ts","--queries","{{.QUERIES}}","--fixture","{fixture}"{{if eq .CPU "true"}},"--cpu","--variant","baseline","--variant","optimized","--repeats","1"{{end}}]'

  benchmark:crypto:
    dir: "{{.ROOT_DIR}}"
    desc: Measure synthetic AEAD primitives natively, without assembly, and inside WASM
    cmds:
      - go test ./development/connector-wasm/go -run='^TestCryptoAEADRoundTrip$' -bench='^BenchmarkCryptoAEAD$' -benchmem -benchtime=100ms -count=3 -cpu=1
      - go test -tags=purego ./development/connector-wasm/go -run='^TestCryptoAEADRoundTrip$' -bench='^BenchmarkCryptoAEAD$' -benchmem -benchtime=100ms -count=3 -cpu=1
      - task: benchmark:crypto:wasm

  benchmark:crypto:wasm:
    internal: true
    dir: "{{.ROOT_DIR}}"
    env:
      GOOS: js
      GOARCH: wasm
    cmds:
      - go test -exec="$(go env GOROOT)/lib/wasm/go_js_wasm_exec" ./development/connector-wasm/go -run='^TestCryptoAEADRoundTrip$' -bench='^BenchmarkCryptoAEAD$' -benchmem -benchtime=100ms -count=3 -cpu=1
