version: "3"

tasks:
  format:
    cmds:
      - pnpm format

  format-check:
    cmds:
      - pnpm format:check

  lint:
    cmds:
      - pnpm lint

  typecheck:
    cmds:
      - pnpm typecheck

  test:
    cmds:
      - pnpm test

  test:focused:
    desc: Build and run selected JavaScript assertions with the normal test configuration
    requires:
      vars: [FILES]
    vars:
      FLAGS: '{{default "" .FLAGS}}'
    cmds:
      - task: build
      - pnpm exec vitest run {{.FILES}} {{.FLAGS}}

  test:coverage:
    desc: Produce a diagnostic TypeScript coverage report
    cmds:
      - pnpm test:coverage

  test:browser:
    desc: Test the embedded feedback toolbar in installed Google Chrome
    cmds:
      - pnpm exec vitest run --config vitest.browser.config.ts

  build:
    cmds:
      - pnpm build

  keepalive:build:
    desc: Build the Keepalive site and Worker
    cmds:
      - task: build
      - node demos/keepalive/scripts/build.ts

  keepalive:dev:
    desc: Run the Keepalive proxy locally with Wrangler
    vars:
      FLAGS: '{{default "" .FLAGS}}'
    cmds:
      - task: keepalive:build
      - wrangler dev --config demos/keepalive/wrangler.jsonc --ip 127.0.0.1 {{.FLAGS}}

  keepalive:preview:
    desc: Preview the Keepalive page with Vite (no host connections)
    cmds:
      - pnpm --filter @tnldotdev/keepalive exec vite

  keepalive:test:
    desc: Check the Keepalive proxy and host commands
    cmds:
      - pnpm exec vitest run demos/keepalive/tests

  keepalive:handoff:
    desc: Check a real browser handoff against an empty Keepalive test deployment
    requires:
      vars: [SITE, START]
    cmds:
      - node demos/keepalive/tests/handoff.ts --site "{{.SITE}}" --start "{{.START}}"

  wasm:build:
    desc: Build the SDK's Go/WASM module and matching Go runtime
    cmds:
      - node scripts/build/sdk-wasm.ts

  check:
    desc: Build once and run JavaScript checks
    cmds:
      - task: :js:build
      - pnpm typecheck:run
      - pnpm test:run
      - task: :js:lint
      - task: :js:format-check
