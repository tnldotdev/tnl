version: "3"

tasks:
  format:
    cmds:
      - pnpm format

  format-check:
    cmds:
      - pnpm format:check

  lint:
    cmds:
      - pnpm lint

  typecheck:
    cmds:
      - pnpm typecheck

  test:
    cmds:
      - pnpm test

  test:focused:
    desc: Build and run selected JavaScript assertions with the normal test configuration
    requires:
      vars: [FILES]
    vars:
      FLAGS: '{{default "" .FLAGS}}'
    cmds:
      - task: build
      - pnpm exec vitest run {{.FILES}} {{.FLAGS}}

  test:coverage:
    desc: Produce a diagnostic TypeScript coverage report
    cmds:
      - pnpm test:coverage

  test:browser:
    desc: Test the feedback toolbar and Keepalive page in installed Google Chrome
    cmds:
      - pnpm exec vitest run --config vitest.browser.config.ts

  build:
    cmds:
      - pnpm build

  keepalive:build:
    desc: Build the Keepalive site and Worker
    cmds:
      - task: build
      - node demos/keepalive/scripts/build.ts
      - node demos/keepalive/scripts/build.ts --fleet ramp

  keepalive:dev:
    desc: Run the Keepalive proxy locally with Wrangler
    vars:
      FLAGS: '{{default "" .FLAGS}}'
    cmds:
      - task: keepalive:build
      - wrangler dev --config demos/keepalive/wrangler.jsonc --ip 127.0.0.1 {{.FLAGS}}

  keepalive:deploy:
    desc: Build and deploy Keepalive to production
    cmds:
      - task: build
      - node demos/keepalive/scripts/build.ts
      - wrangler deploy --config demos/keepalive/wrangler.jsonc

  keepalive:preview:
    desc: Preview the Keepalive page with Vite (no host connections)
    cmds:
      - pnpm --filter @tnldotdev/keepalive exec vite

  keepalive:test:
    desc: Check the Keepalive proxy and host commands
    cmds:
      - pnpm exec vitest run demos/keepalive/tests

  keepalive:test:browser:
    desc: Check the production Keepalive page in Chrome with local protocol fixtures
    cmds:
      - pnpm exec vitest run --config vitest.browser.config.ts demos/keepalive/tests/page.browser.test.ts

  keepalive:restart:
    desc: Check certificate reuse after restarting Chrome on the empty ramp fleet
    requires:
      vars: [RELEASE, PROFILE_DIR]
    cmds:
      - node demos/keepalive/scripts/check-restart.ts --release "{{.RELEASE}}" --profile-dir "{{.PROFILE_DIR}}"

  keepalive:handoff:
    desc: Check a real browser handoff against an empty Keepalive test deployment
    requires:
      vars: [SITE, START]
    cmds:
      - node demos/keepalive/tests/handoff.ts --site "{{.SITE}}" --start "{{.START}}" {{if .PEER_PROXY}}--peer-proxy "{{.PEER_PROXY}}"{{end}} {{if .REPORT}}--report "{{.REPORT}}"{{end}} {{if .METRICS}}--metrics "{{.METRICS}}"{{end}} {{if .VISITOR_INTERVAL_MS}}--visitor-interval-ms "{{.VISITOR_INTERVAL_MS}}"{{end}}

  keepalive:measurement-check:
    desc: Check the Keepalive observers with Chrome and a loopback fixture
    cmds:
      - node demos/keepalive/tests/measurement-browser.ts

  keepalive:coordination:
    desc: Simulate real gossip and invitation decisions without browsers or external services
    vars:
      HOSTS: '{{default "500" .HOSTS}}'
      MINUTES: '{{default "10" .MINUTES}}'
      SEED: '{{default "1" .SEED}}'
      SCENARIO: '{{default "growth" .SCENARIO}}'
      LATENCY_MS: '{{default "20" .LATENCY_MS}}'
      LOSS: '{{default "0" .LOSS}}'
      DISCOVERY: '{{default "shared" .DISCOVERY}}'
      DEPARTURE: '{{default "current" .DEPARTURE}}'
      POLICY: '{{default "visitors" .POLICY}}'
    cmds:
      - node demos/keepalive/scripts/check-coordination.ts --hosts "{{.HOSTS}}" --minutes "{{.MINUTES}}" --seed "{{.SEED}}" --scenario "{{.SCENARIO}}" --latency-ms "{{.LATENCY_MS}}" --loss "{{.LOSS}}" --discovery "{{.DISCOVERY}}" --departure "{{.DEPARTURE}}" --policy "{{.POLICY}}" {{if .SAFE_BYTES_PER_HOST}}--safe-bytes-per-host "{{.SAFE_BYTES_PER_HOST}}"{{end}} {{if .READER_BYTES_PER_SECOND}}--reader-bytes-per-second "{{.READER_BYTES_PER_SECOND}}"{{end}} {{if .REPORT}}--report "{{.REPORT}}"{{end}}

  keepalive:load:readers:
    desc: Opt-in bounded reader/connection load on an existing ramp fleet (no fleet ownership)
    requires:
      vars: [SITE, MANIFEST, RELEASE, REPORT]
    vars:
      RATES: '{{default "1,5,10" .RATES}}'
      SECONDS: '{{default "60" .SECONDS}}'
      CONCURRENCY: '{{default "128" .CONCURRENCY}}'
      CONNECTIONS: '{{default "fresh" .CONNECTIONS}}'
      WORKLOAD: '{{default "page" .WORKLOAD}}'
    cmds:
      - node demos/keepalive/scripts/check-reader-load.ts --site "{{.SITE}}" --manifest "{{.MANIFEST}}" --release "{{.RELEASE}}" --report "{{.REPORT}}" --rates "{{.RATES}}" --seconds "{{.SECONDS}}" --concurrency "{{.CONCURRENCY}}" --connections "{{.CONNECTIONS}}" --workload "{{.WORKLOAD}}" {{if .ALLOW_RAMP_LOAD}}--allow-ramp-load{{end}} {{if .TARGET}}--target "{{.TARGET}}" --run "{{.RUN}}"{{end}} {{if .METRICS}}--metrics "{{.METRICS}}"{{end}}

  keepalive:load:check:
    desc: Check the reader load task against a loopback compressed fixture
    cmds:
      - node demos/keepalive/tests/reader-load-check.ts

  wasm:build:
    desc: Build the SDK's Go/WASM module and matching Go runtime
    cmds:
      - node scripts/build/sdk-wasm.ts

  check:
    desc: Build once and run JavaScript checks
    cmds:
      - task: :js:build
      - pnpm typecheck:run
      - pnpm test:run
      - task: :js:lint
      - task: :js:format-check
