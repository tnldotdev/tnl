version: "3"

tasks:
  test:web:
    desc: Check Fetch-only HTTP scopes, credential isolation and Node-free runtime dependencies
    deps: [":js:build"]
    cmds:
      - pnpm exec vitest run packages/ts/test/connector/web-http.test.ts packages/ts/test/connector/web-streams.test.ts packages/ts/test/connector/application-http.test.ts packages/ts/test/connector/client-fence.test.ts packages/ts/test/publisher/runtime-instance.test.ts
      - pnpm exec tsc --project packages/ts/test/fixtures/web-only/tsconfig.json

  test:publications:
    desc: Check publication handles, fresh readiness, scoped journal observation and listener ownership
    deps: [":js:build"]
    cmds:
      - pnpm exec vitest run packages/ts/test/publisher/publication.test.ts packages/ts/test/publisher/runtime-instance.test.ts packages/ts/test/publisher/observation-http.test.ts packages/ts/test/publisher/status.test.ts packages/ts/test/publisher/adhoc-open.test.ts packages/ts/test/publisher/adhoc-fetch.test.ts packages/ts/test/publisher/app-runtime.test.ts

  test:client-factories:
    dir: "{{.ROOT_DIR}}"
    desc: Check ordinary client caching, exact native bindings and joined driver cleanup
    deps: [":js:build"]
    cmds:
      - pnpm exec vitest run packages/ts/test/connector/client-factory.test.ts packages/ts/test/connector/awaitable-connection.test.ts

  test:ipc-boundaries:
    desc: Check local SDK descriptor, HTTP, and process boundaries
    deps: [":js:build"]
    cmds:
      - pnpm exec vitest run packages/ts/test/publisher/app-runtime.test.ts packages/ts/test/connector/connection-ipc.test.ts

  test:client-tracing:
    desc: Check SDK and framework tracing, connector carriers and lifecycle cleanup
    deps: [":js:build"]
    cmds:
      - pnpm exec vitest run packages/ts/test/native/tracing.test.ts packages/ts/test/publisher/app-runtime.test.ts packages/ts/test/connector/connection.test.ts packages/ts/test/connector/connection-fetch.test.ts packages/ts/test/connector/connection-owner-recovery.test.ts packages/ts/test/publisher/adhoc-open.test.ts packages/ts/test/publisher/adhoc-fetch.test.ts packages/ts/test/frameworks/vite.test.ts packages/ts/test/frameworks/next.test.ts

  format:
    cmds:
      - pnpm format

  format-check:
    cmds:
      - pnpm format:check

  lint:
    cmds:
      - pnpm lint

  typecheck:
    cmds:
      - pnpm typecheck

  test:
    cmds:
      - pnpm test

  test:connections:
    desc: Check connector connection snapshots, verified workload owner selection, streaming fetch and provider acquisition
    deps: [":js:build"]
    cmds:
      - pnpm exec vitest run packages/ts/test/connector/connection.test.ts packages/ts/test/connector/connection-environment.test.ts packages/ts/test/connector/awaitable-connection.test.ts packages/ts/test/connector/connection-fetch.test.ts packages/ts/test/connector/connection-ipc.test.ts packages/ts/test/connector/connection-installed.test.ts packages/ts/test/connector/connection-owner-recovery.test.ts packages/ts/test/connector/workload-native.test.ts packages/ts/test/connector/workload-provider.test.ts packages/ts/test/project/service-metadata.test.ts
      - task: :go:test:focused
        vars:
          PACKAGES: ./internal/connector/workload ./internal/client/project/workloadmanifest ./internal/connector
          RUN: "Test(AssertionSource|FlyMachineToken|GitHubAssertion|Session.*(Validation|Decoder)|Selection|Manifest|ConnectionSDK.*Workload)"

  test:frameworks:
    desc: Check app preparation and real Node, Bun, Vite and Next framework lifetimes
    deps: [":js:build"]
    cmds:
      - pnpm exec vitest run packages/ts/test/publisher/app-runtime.test.ts packages/ts/test/native/bun.test.ts packages/ts/test/frameworks/vite.test.ts packages/ts/test/frameworks/next.test.ts packages/ts/test/project/runtime.test.ts

  test:coverage:
    desc: Produce a diagnostic TypeScript coverage report
    cmds:
      - pnpm test:coverage

  test:browser:
    desc: Test the embedded feedback toolbar in installed Google Chrome
    cmds:
      - pnpm exec vitest run --config vitest.browser.config.ts

  build:
    cmds:
      - pnpm build

  check:
    desc: Build once and run JavaScript checks
    cmds:
      - task: :js:build
      - pnpm typecheck:run
      - pnpm test:run
      - task: :js:lint
      - task: :js:format-check

  test:packaging:
    desc: Check manifest-driven npm exports and Python wheel metadata
    cmds:
      - pnpm exec vitest run scripts/package/npm-artifacts.test.ts scripts/package/python-version.test.ts scripts/package/python-wheels.test.ts
