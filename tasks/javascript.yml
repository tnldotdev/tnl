version: "3"

tasks:
  format:
    cmds:
      - pnpm format

  format-check:
    cmds:
      - pnpm format:check

  lint:
    cmds:
      - pnpm lint

  typecheck:
    cmds:
      - pnpm typecheck

  test:
    cmds:
      - pnpm test

  test:coverage:
    desc: Produce a diagnostic TypeScript coverage report
    cmds:
      - pnpm test:coverage

  test:browser:
    desc: Test the embedded feedback toolbar in installed Google Chrome
    cmds:
      - pnpm exec vitest run --config vitest.browser.config.ts

  build:
    cmds:
      - pnpm build

  check:
    desc: Build once and run JavaScript checks
    cmds:
      - task: :js:build
      - pnpm typecheck:run
      - pnpm test:run
      - task: :js:lint
      - task: :js:format-check
