version: "3"

tasks:
  default:
    desc: Run PostgreSQL-backed integration boundaries
    cmds:
      - task: api
      - task: state:shard
      - task: runtime

  api:
    desc: Check APIs, database bindings, certificates, DNS, and relay claims with disposable PostgreSQL
    vars:
      RUN: '{{default "^TestIntegration" .RUN}}'
    cmds:
      - go -C tools/testharness run . postgres -- go test -race -v ./internal/client/control ./internal/control/api/authority ./internal/control/api/public ./internal/control/state/controlstatedb ./internal/control/certificates ./internal/control/dns ./internal/relay ./internal/publisher/group -run='{{.RUN}}' -count=1 -timeout=8m -args -tnl-test-tier=integration

  state:shard:
    desc: Check control state with disposable PostgreSQL (optional SHARD=1/4)
    vars:
      SHARD: '{{default "1/1" .SHARD}}'
      RUN: '{{default "^TestIntegration" .RUN}}'
    cmds:
      - go -C tools/testharness run . --tnl-test-shard='{{.SHARD}}' postgres -- go test -race -v ./internal/control/state -run='{{.RUN}}' -count=1 -timeout=8m -args -tnl-test-tier=integration

  runtime:
    desc: Check separated and standalone runtime boundaries with disposable PostgreSQL and Pebble
    vars:
      RUN: '{{default "^TestIntegration" .RUN}}'
    cmds:
      - go -C tools/testharness run . postgres -- go test -race -v ./internal/daemon -run='{{.RUN}}' -count=1 -timeout=20m -args -tnl-test-tier=integration

  runtime:shard:
    desc: Run a runtime shard, excluding separately scheduled lease, direct UDP, and rebinding proofs
    requires:
      vars: [SHARD]
    cmds:
      - go -C tools/testharness run . --tnl-test-shard='{{.SHARD}}' postgres -- go test -race -v ./internal/daemon -run='^TestIntegration' -skip='^TestIntegration(ConnectorDirect|WorkloadTransport(Lifecycle|Closure)$|PrivateDefaultLeaseCycles$|ConnectorRebindingRetainsApplicationAndTarget$|ConnectorSourceRebindingRetainsApplicationAndTarget$|ConnectorRebindingRetainsPostgresTransaction$)' -count=1 -timeout=8m -args -tnl-test-tier=integration

  runtime:leases:
    desc: Cross production private visitor lease cycles and outage deadlines on real sockets
    cmds:
      - go -C tools/testharness run . postgres -- go test -race -v ./internal/daemon -run='^TestIntegrationPrivateDefaultLeaseCycles$' -count=1 -timeout=5m -args -tnl-test-tier=integration

  runtime:workload:
    desc: Retain capped and uncapped workload streams across real lease, proof, and hard deadlines
    cmds:
      - go -C tools/testharness run . postgres -- go test -race -v ./internal/daemon -run='^TestIntegrationWorkloadTransportLifecycle$' -count=1 -timeout=10m -args -tnl-test-tier=integration

  runtime:workload:closure:
    desc: Close workload TCP, HTTP, and PostgreSQL streams after revocation or an unrenewed lease
    cmds:
      - go -C tools/testharness run . postgres -- go test -race -v ./internal/daemon -run='^TestIntegrationWorkloadTransportClosure$' -count=1 -timeout=5m -args -tnl-test-tier=integration

  connector-direct:
    desc: Check relay-first ICE upgrades, repeated direct fallback, and retained application sessions with disposable PostgreSQL
    cmds:
      - go -C tools/testharness run . postgres -- go test -race -v ./internal/daemon -run='^TestIntegrationConnectorDirect' -count=1 -timeout=5m -args -tnl-test-tier=integration

  connector-rebinding:
    desc: Check retained connector sessions and relay replacements with disposable PostgreSQL
    vars:
      RUN: '{{default "^TestIntegrationConnector.*Rebind" .RUN}}'
    cmds:
      - go -C tools/testharness run . postgres -- go test -race -v ./internal/control/state ./internal/control/api/public ./internal/relay ./internal/daemon -run='{{.RUN}}' -count=1 -timeout=10m -args -tnl-test-tier=integration

  connector-rebinding:network:
    desc: Check real connector source-IP changes on Linux
    preconditions:
      - sh: test "$(uname -s)" = Linux
        msg: Source-IP rebinding requires Linux multi-source loopback sockets
    cmds:
      - task: connector-rebinding
        vars:
          RUN: ^TestIntegrationConnectorSourceRebindingRetainsApplicationAndTarget$

  cli:
    desc: Check Linux CLI workflows with disposable PostgreSQL and an existing OpenSSH daemon
    vars:
      RUN: '{{default "^TestIntegration" .RUN}}'
      SHARD: '{{default "1/1" .SHARD}}'
      SKIP: '{{default "^$" .SKIP}}'
      TIMEOUT: '{{default "10m" .TIMEOUT}}'
    preconditions:
      - sh: test "$(uname -s)" = Linux
        msg: CLI integration requires Linux for isolated credential protection
    cmds:
      - go -C tools/testharness run . --tnl-test-shard='{{.SHARD}}' postgres -- go test -race -v ./cmd/tnl -run='{{.RUN}}' -skip='{{.SKIP}}' -count=1 -timeout='{{.TIMEOUT}}' -args -tnl-test-tier=integration

  cli:shard:
    desc: Run an ordinary CLI shard, excluding the separately scheduled real-clock identity proof
    requires:
      vars: [SHARD]
    cmds:
      - task: cli
        vars:
          SHARD: "{{.SHARD}}"
          SKIP: ^TestIntegrationCLINamedLocalIdentityContinuity$

  cli:identity:
    desc: Cross three complete local owner and Git transitions
    cmds:
      - task: cli
        vars:
          RUN: ^TestIntegrationCLINamedLocalIdentityContinuity$

  connections:
    aliases: [action-background-refresh]
    desc: Check built native connector owners, the Action, and both SDKs with local signed fixtures
    deps: [":js:build", ":py:sync"]
    vars:
      RUN: '{{default "^TestIntegration" .RUN}}'
    cmds:
      - go -C tools/testharness run . connections -- go test -race -v ./tests/integration/connector -run='{{.RUN}}' -count=1 -timeout=8m -args -tnl-test-tier=integration

  owner-lifecycle:
    desc: Check shared HTTP/PostgreSQL owner isolation with disposable PostgreSQL
    cmds:
      - go -C tools/testharness run . postgres -- go test -race -v ./internal/connector -run='^TestIntegration' -count=1 -timeout=3m -args -tnl-test-tier=integration

  service-access:
    desc: Check deployment-scoped CLI sharing against real control without granting visitor access
    cmds:
      - go -C tools/testharness run . postgres -- go test -race -v ./cmd/tnl -run='^TestIntegrationServiceShareManagerLookup$' -count=1 -timeout=3m -args -tnl-test-tier=integration

  local-database:
    desc: Check the explicit local deployment SDK against disposable PostgreSQL without sign-in
    deps: [":js:build"]
    cmds:
      - go -C tools/testharness run . postgres -- go test -race -v ./tests/integration/connector -run='^TestPostgresLocalDeployment$' -count=1 -timeout=3m -args -tnl-test-tier=integration

  management-sdk:
    desc: Check the generated HTTP management SDK against real control and disposable PostgreSQL
    deps: [":js:build"]
    cmds:
      - go -C tools/testharness run . postgres -- go test -race -v ./packages/ts/test/http -run='^TestIntegrationGeneratedManagementHTTP$' -count=1 -timeout=3m -args -tnl-test-tier=integration

  tcp-clients:
    desc: Check both SDKs against disposable PostgreSQL and MySQL with verified TLS
    deps: [":js:build", ":py:sync"]
    cmds:
      - go -C tools/testharness run . postgres-tls -- go test -race -v ./internal/publisher/service/stream -run='^TestIntegration(ManagedDatabaseProviders|DatabaseSDKSmoke|ManagedPostgres)' -count=1 -timeout=5m -args -tnl-test-tier=integration
      - go -C tools/testharness run . mysql-tls -- go test -race -v ./internal/publisher/service/stream -run='^TestIntegration(ManagedDatabaseProviders|DatabaseSDKSmoke)/mysql' -count=1 -timeout=5m -args -tnl-test-tier=integration

  binary:
    desc: Check built server processes on Linux with disposable PostgreSQL
    deps: [":js:build"]
    vars:
      RUN: '{{default "^TestBinaryIntegration" .RUN}}'
      COMPOSE_HOST_ADDRESS: '{{default "host-gateway" .COMPOSE_HOST_ADDRESS}}'
    preconditions:
      - sh: test "$(uname -s)" = Linux
        msg: Binary integration requires Linux
    cmds:
      - go -C tools/testharness run . postgres -- go test -race -v ./internal/daemon -run='{{.RUN}}' -count=1 -timeout=15m -args -tnl-test-tier=binary -tnl-test-compose-host-address='{{.COMPOSE_HOST_ADDRESS}}'

  sshd:
    desc: Check an existing OpenSSH daemon through QUIC and TLS/TCP visitor streams
    cmds:
      - go test -race -v ./internal/connector/stream -run='^TestIntegrationExistingOpenSSHOverPrivateTCP$' -count=1 -timeout=3m -args -tnl-test-tier=integration

  kubernetes:
    desc: Run kubectl against a digest-pinned disposable kind cluster
    vars:
      KIND: '{{default "kind" .KIND}}'
    cmds:
      - go test -v ./internal/publisher/service/stream -run='^TestIntegrationKubernetesKubectl$' -count=1 -timeout=8m -args -tnl-test-tier=integration -tnl-kind-binary={{.KIND}}

  compose:
    desc: Check disposable host-side Compose HTTP and TCP targets
    cmds:
      - go test -race -v ./internal/publisher/target -run='^TestComposeIntegrationHostTargets$' -count=1 -timeout=8m -args -tnl-compose-integration

  publisher-install:
    desc: Check installation and reboot in disposable Ubuntu/systemd and Compose
    cmds:
      - go -C tools/testharness run . publisher-install

  dns:
    desc: Check authoritative DNS in disposable Linux containers
    cmds:
      - go -C tools/testharness run . dns

  route53:
    desc: Issue a staging ACME certificate using real Route 53 TXT propagation
    requires:
      vars: [ZONE_ID]
    cmds:
      - go -C tools/testharness run . postgres -- go test -race -v ./internal/control/certificates -run='^TestIntegrationRoute53StagingACME$' -count=1 -timeout=12m -args -tnl-test-tier=route53 -tnl-route53-zone-id='{{.ZONE_ID}}'
