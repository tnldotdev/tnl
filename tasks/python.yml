version: "3"

tasks:
  test:application-http:
    desc: Check Python application document proofs, exact visit grants and HTTP client bindings
    cmds:
      - task: :py:test
        vars:
          CLI_ARGS: "-k 'application_http or token_http'"

  test:token-http:
    desc: Check explicit Python visitor tokens, origin-bound HTTPX and joined cleanup without native authentication
    cmds:
      - task: :py:test
        vars:
          CLI_ARGS: "-k token_http"

  test:runtime-instances:
    desc: Check Python runtime selection, isolated workload callbacks and joined cleanup
    cmds:
      - task: :py:test
        vars:
          CLI_ARGS: "-k 'runtime or workload or client or publication or forked or token_http or application_http'"

  test:publications:
    desc: Check Python publication observations, ASGI ownership and native registration
    cmds:
      - task: :py:test
        vars:
          CLI_ARGS: "-k 'publication or asgi or status or worker_registers or native_assignment'"

  test:client-factories:
    dir: "{{.ROOT_DIR}}"
    desc: Check ordinary Python client caching, cancellation and joined cleanup
    cmds:
      - uv run --frozen --project packages/py pytest -q packages/py/tests/test_client_factory.py

  sync:
    dir: "{{.ROOT_DIR}}"
    desc: Install the locked Python SDK environment
    cmds:
      - uv sync --frozen --project packages/py

  format:
    desc: Format the Python SDK
    cmds:
      - uv run --frozen --project packages/py ruff format packages/py/src packages/py/tests packages/py/hatch_build.py

  format-check:
    desc: Check Python SDK formatting
    cmds:
      - uv run --frozen --project packages/py ruff format --check packages/py/src packages/py/tests packages/py/hatch_build.py

  lint:
    desc: Lint the Python SDK
    cmds:
      - uv run --frozen --project packages/py ruff check packages/py/src packages/py/tests packages/py/hatch_build.py

  typecheck:
    desc: Typecheck the Python SDK
    cmds:
      - uv run --frozen --project packages/py mypy packages/py/src packages/py/tests

  test:
    desc: Run Python tests with the real native CLI and local owners
    cmds:
      - |
        set -eu
        build_dir="$(mktemp -d "${TMPDIR:-/tmp}/tnl-python-native.XXXXXXXX")"
        trap 'rm -rf "$build_dir"' EXIT
        go build -race -o "$build_dir/tnl" ./cmd/tnl
        go build -race -o "$build_dir/owner" ./packages/py/tests/testdata/connection_owner
        go build -race -o "$build_dir/app-owner" ./packages/py/tests/testdata/app_owner
        uv run --frozen --project packages/py pytest -q packages/py/tests --tnl-binary="$build_dir/tnl" --tnl-connection-owner="$build_dir/owner" --tnl-app-owner="$build_dir/app-owner" {{.CLI_ARGS}}

  build:
    desc: Build and verify four platform Python wheels from a GoReleaser snapshot
    preconditions:
      - sh: test -s dist/artifacts.json && test -s dist/metadata.json
        msg: Run task release:snapshot before building Python wheels
    cmds:
      - node scripts/package/pack-python-wheels.ts "{{default "dist/py" .OUTPUT}}" {{.VERSION}}
      - node scripts/package/verify-python-wheels.ts "{{default "dist/py" .OUTPUT}}"

  check:
    desc: Run all Python SDK checks
    cmds:
      - task: :py:format-check
      - task: :py:lint
      - task: :py:typecheck
      - task: :py:test
