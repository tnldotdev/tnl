version: "3"

vars:
  GENERATED_PATHS: >-
    pkg/api
    internal/client/state/clientstatedb
    internal/control/state/controlstatedb
    internal/failure/diagnostic/codes.gen.go
    internal/failure/catalog.gen.json
    internal/publisher/toolbar/toolbar.js
    internal/publisher/browserapi/model.gen.ts
    internal/client/project/keys.gen.json
    internal/client/project/loader.mjs
    packages/ts/src/config.gen.ts
    schema/v1.json
    scripts/install.sh
    contracts/observability/v1/vocabulary.json

tasks:
  generate:
    desc: Regenerate all committed artifacts
    cmds:
      # generate API models and browser validators before compiling Go generators.
      - node scripts/generate/api-contracts.ts
      - node scripts/generate/browser-api-schemas.ts
      - sqlc generate -f internal/client/state/sqlc.yaml
      - sqlc generate -f internal/control/state/sqlc.yaml
      - go run ./scripts/installer/generate.go -root .
      - go run ./internal/config/cmd/configgen
      - node scripts/generate/config-types.ts
      - pnpm exec oxfmt --write schema/v1.json internal/client/project/keys.gen.json packages/ts/src/config.gen.ts
      - node scripts/generate/project-config-loader.ts
      - node scripts/generate/diagnostic-codes.ts
      - go -C internal/failure run ./cmd/cataloggen
      - go run ./internal/observability/cmd/vocabulary contracts/observability/v1/vocabulary.json
      - node scripts/generate/feedback-toolbar.ts

  generate-check:
    desc: Check generated files for drift
    cmds:
      - task: generate
      - git diff --exit-code HEAD -- {{.GENERATED_PATHS}}
      - test -z "$(git ls-files --others --exclude-standard -- {{.GENERATED_PATHS}})"

  format:
    desc: Format all source files
    deps: ["go:format", "js:format", "py:format"]

  format-check:
    desc: Check formatting without changing files
    deps: ["go:format-check", "js:format-check", "py:format-check"]

  go:format:
    cmds:
      - goimports -w .

  go:format-check:
    cmds:
      - test -z "$(goimports -l .)"
