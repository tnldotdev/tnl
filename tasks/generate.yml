version: "3"

vars:
  GENERATED_PATHS: >-
    pkg/api
    internal/client/state/clientstatedb
    internal/control/state/controlstatedb
    internal/failure/diagnostic/codes.gen.go
    internal/failure/catalog.gen.json
    internal/publisher/toolbar/toolbar.js
    internal/publisher/browserapi/model.gen.ts
    internal/client/project/keys.gen.json
    internal/client/project/loader.mjs
    packages/ts/src/config.gen.ts
    schema/v1.json
    scripts/install.sh
    deploy/publisher/fargate/fargate.yaml
    deploy/publisher/fargate/fargate.parameters.example.json
    deploy/publisher/fargate/fargate.manifest.example.json
    deploy/publisher/fargate/fargate.storage-policy.json
    api/observability/v1/vocabulary.json

tasks:
  generate:
    aliases: [go:generate]
    desc: Regenerate all committed artifacts
    cmds:
      # generate API models and browser validators before compiling Go generators.
      - node scripts/generate/openapi.ts
      - node scripts/generate/publisher-model.ts
      - go generate -skip 'scripts/generate/(openapi|publisher-model)\.ts' ./...

  generate-check:
    aliases: [go:generate-check]
    desc: Check generated files for drift
    cmds:
      - task: generate
      - git diff --exit-code HEAD -- {{.GENERATED_PATHS}}
      - test -z "$(git ls-files --others --exclude-standard -- {{.GENERATED_PATHS}})"

  format:
    desc: Format all source files
    deps: ["go:format", "js:format", "py:format"]

  format-check:
    desc: Check formatting without changing files
    deps: ["go:format-check", "js:format-check", "py:format-check"]

  go:format:
    cmds:
      - goimports -w .

  go:format-check:
    cmds:
      - test -z "$(goimports -l .)"
