version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 14
    open-pull-requests-limit: 1
    rebase-strategy: disabled
    groups:
      github-actions:
        patterns:
          - "*"
      security:
        applies-to: security-updates
        patterns:
          - "*"
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 14
    open-pull-requests-limit: 1
    rebase-strategy: disabled
    groups:
      go-modules:
        patterns:
          - "*"
      security:
        applies-to: security-updates
        patterns:
          - "*"
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 14
    open-pull-requests-limit: 1
    rebase-strategy: disabled
    groups:
      npm-packages:
        patterns:
          - "*"
      security:
        applies-to: security-updates
        patterns:
          - "*"
    ignore:
      - dependency-name: "@types/node"
        update-types:
          - version-update:semver-major
