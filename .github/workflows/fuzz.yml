name: Fuzz

on:
  pull_request:
  schedule:
    - cron: "0 8 * * *"

permissions:
  contents: read

concurrency:
  group: fuzz-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fuzz:
    name: Go fuzz
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Run fuzz tests
        env:
          FUZZ_TIME: ${{ github.event_name == 'schedule' && '5m' || '15s' }}
        run: |
          go test ./internal/router -run='^$' -fuzz=. -fuzztime="$FUZZ_TIME"
          go test ./internal/proxyproto -run='^$' -fuzz=. -fuzztime="$FUZZ_TIME"
