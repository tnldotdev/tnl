name: Fuzz

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 8 * * *"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GOFLAGS: -tags=ts_omit_ssh

jobs:
  fuzz:
    name: Go fuzz (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: router
            package: ./internal/router
            target: FuzzInspectClientHello
          - name: proxy protocol
            package: ./internal/proxyproto
            target: FuzzDecode
          - name: worker protocol
            package: ./pkg/protocol/workerv1
            target: FuzzReadFrames
          - name: local target policy
            package: ./internal/localproxy
            target: FuzzNormalizeTarget
          - name: hostname policy
            package: ./internal/naming
            target: FuzzCanonicalize
          - name: custom domain policy
            package: ./internal/naming
            target: FuzzDomainPolicy
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Run fuzz tests
        env:
          FUZZ_TIME: ${{ github.event_name == 'schedule' && '5m' || '15s' }}
          PACKAGE: ${{ matrix.package }}
          TARGET: ${{ matrix.target }}
        run: go test "$PACKAGE" -run='^$' -fuzz="^${TARGET}$" -fuzztime="$FUZZ_TIME"
