name: Release

on:
  push:
    tags:
      - "v[0-9]*.[0-9]*.[0-9]*"

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    outputs:
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify release tag and commit
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]; then
            echo "release tag is not Docker-compatible SemVer: $TAG" >&2
            exit 1
          fi
          test "${#TAG}" -le 128
          tag_sha="$(git rev-parse "refs/tags/$TAG^{tag}")"
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$tag_sha" --jq '.verification.verified')" = true
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$tag_sha" --jq '.object.sha')" = "$GITHUB_SHA"
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          version="${TAG#v}"
          test "$version" != "$TAG"
          if [[ "$version" == *-* ]]; then
            IFS=. read -r -a identifiers <<< "${version#*-}"
            for identifier in "${identifiers[@]}"; do
              if [[ "$identifier" =~ ^[0-9]+$ && "$identifier" == 0* && "$identifier" != 0 ]]; then
                echo "numeric prerelease identifier has a leading zero: $identifier" >&2
                exit 1
              fi
            done
          fi
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"

      - name: Verify checks passed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for workflow in checks.yml integration.yml; do
            count="$(gh api --method GET \
              "repos/$GITHUB_REPOSITORY/actions/workflows/$workflow/runs" \
              -f branch=main \
              -f event=push \
              -f head_sha="$GITHUB_SHA" \
              -f status=success \
              -f per_page=1 \
              --jq '.total_count')"
            if [ "$count" -lt 1 ]; then
              printf 'no successful %s run found for %s\n' "$workflow" "$GITHUB_SHA" >&2
              exit 1
            fi
          done

  approve:
    name: Approve release
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: release
    permissions: {}
    steps:
      - name: Approve publishing
        run: "true"

  archives:
    name: Publish release archives
    needs: [validate, approve]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      attestations: write
      contents: write
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Set up pnpm and Node
        uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          runtime: node@22.23.2
          cache: false
          require-lockfile: true

      - name: Install Syft
        uses: anchore/sbom-action/download-syft@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          syft-version: v1.51.1

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3

      - name: Build draft release
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: v2.18.0
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify release artifacts
        run: |
          shopt -s nullglob
          archives=(dist/*.tar.gz)
          sboms=(dist/*.spdx.json)
          test "${#archives[@]}" -eq 4
          test "${#sboms[@]}" -eq 4
          for archive in "${archives[@]}"; do
            tar -tzf "$archive" LICENSE NOTICE THIRD_PARTY_LICENSES.txt tnl tnld >/dev/null
            tar -xOzf "$archive" LICENSE | grep -F -x 'MIT License' >/dev/null
          done
          (cd dist && sha256sum --check checksums.txt)

      - name: Attest release artifacts
        if: github.event.repository.visibility == 'public'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: dist/checksums.txt

      - name: Package npm client
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          pnpm build
          node scripts/pack-tnl.ts "$RUNNER_TEMP/tnl-npm-packages" "$VERSION"
          node scripts/verify-tnl-install.ts "$RUNNER_TEMP/tnl-npm-packages"

      - name: Upload npm client packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tnl-npm-packages
          path: ${{ runner.temp }}/tnl-npm-packages
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
          overwrite: true

  image:
    name: Publish container image
    needs: [validate, approve]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      attestations: write
      contents: read
      id-token: write
      packages: write
    outputs:
      digest: ${{ steps.image.outputs.digest }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build and push image
        id: image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/tnldotdev/tnl:${{ github.ref_name }}
            ghcr.io/tnldotdev/tnl:${{ needs.validate.outputs.version }}
          build-args: |
            VERSION=${{ needs.validate.outputs.version }}
            COMMIT=${{ github.sha }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=tnl-release-image
          cache-to: type=gha,mode=max,scope=tnl-release-image

      - name: Sign image
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
          IMAGE: ghcr.io/tnldotdev/tnl
        run: cosign sign --yes "$IMAGE@$DIGEST"

      - name: Attest image provenance
        if: github.event.repository.visibility == 'public'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/tnldotdev/tnl
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true
          create-storage-record: false

  npm:
    name: Publish npm client packages
    needs: [validate, archives, image]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install tooling dependencies
        uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          runtime: node@22.23.2
          cache: true
          require-lockfile: true

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.20.0
          package-manager-cache: false
          registry-url: https://registry.npmjs.org

      - name: Download npm client packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: tnl-npm-packages
          path: ${{ runner.temp }}/tnl-npm-packages

      - name: Publish with npm OIDC
        env:
          NPM_CONFIG_PROVENANCE: ${{ github.event.repository.visibility == 'public' }}
          VERSION: ${{ needs.validate.outputs.version }}
        run: node scripts/publish-tnl-packages.ts "$RUNNER_TEMP/tnl-npm-packages" "$VERSION"

  publish:
    name: Publish release
    needs: [archives, image, npm]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Attach image digest
        env:
          DIGEST: ${{ needs.image.outputs.digest }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE: ghcr.io/tnldotdev/tnl
          TAG: ${{ github.ref_name }}
        run: |
          printf '%s@%s\n' "$IMAGE" "$DIGEST" > "$RUNNER_TEMP/tnld-image-digest.txt"
          gh release upload "$TAG" "$RUNNER_TEMP/tnld-image-digest.txt" --clobber

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: gh release edit "$TAG" --draft=false

  homebrew:
    name: Publish Homebrew formula
    if: ${{ !contains(github.ref_name, '-') }}
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: homebrew
    permissions:
      contents: read
    steps:
      - name: Download release checksums
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          mkdir artifacts
          gh release download "$TAG" --pattern checksums.txt --dir artifacts

      - name: Generate formula
        env:
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          version="${TAG#v}"
          test "$version" != "$TAG"

          checksum() {
            awk -v name="$1" '$2 == name { print $1 }' artifacts/checksums.txt
          }

          darwin_arm64="$(checksum "tnl_${version}_darwin_arm64.tar.gz")"
          darwin_amd64="$(checksum "tnl_${version}_darwin_amd64.tar.gz")"
          linux_arm64="$(checksum "tnl_${version}_linux_arm64.tar.gz")"
          linux_amd64="$(checksum "tnl_${version}_linux_amd64.tar.gz")"

          for value in "$darwin_arm64" "$darwin_amd64" "$linux_arm64" "$linux_amd64"; do
            if [[ ! "$value" =~ ^[0-9a-f]{64}$ ]]; then
              echo "missing release checksum" >&2
              exit 1
            fi
          done

          mkdir Formula
          cat > Formula/tnl.rb <<EOF
          class Tnl < Formula
            desc "public urls for every worktree."
            homepage "https://github.com/tnldotdev/tnl"
            version "$version"
            license "MIT"

            on_macos do
              on_arm do
                url "https://github.com/tnldotdev/tnl/releases/download/$TAG/tnl_${version}_darwin_arm64.tar.gz"
                sha256 "$darwin_arm64"
              end

              on_intel do
                url "https://github.com/tnldotdev/tnl/releases/download/$TAG/tnl_${version}_darwin_amd64.tar.gz"
                sha256 "$darwin_amd64"
              end
            end

            on_linux do
              on_arm do
                url "https://github.com/tnldotdev/tnl/releases/download/$TAG/tnl_${version}_linux_arm64.tar.gz"
                sha256 "$linux_arm64"
              end

              on_intel do
                url "https://github.com/tnldotdev/tnl/releases/download/$TAG/tnl_${version}_linux_amd64.tar.gz"
                sha256 "$linux_amd64"
              end
            end

            def install
              bin.install "tnl", "tnld"
            end

            test do
              assert_match(/^tnl #{Regexp.escape(version.to_s)} \([0-9a-f]{40}\)$/, shell_output("#{bin}/tnl version").strip)
              assert_match(/^tnld #{Regexp.escape(version.to_s)} \([0-9a-f]{40}\)$/, shell_output("#{bin}/tnld version").strip)
            end
          end
          EOF

          ruby -c Formula/tnl.rb

      - name: Publish formula
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          VERSION: ${{ github.ref_name }}
        shell: bash
        run: |
          content="$(base64 -w 0 Formula/tnl.rb)"
          sha="$(gh api repos/tnldotdev/homebrew-tap/contents/Formula/tnl.rb --jq .sha 2>/dev/null || true)"

          if [ -n "$sha" ]; then
            gh api repos/tnldotdev/homebrew-tap/contents/Formula/tnl.rb \
              --method PUT \
              -f message="tnl ${VERSION#v}" \
              -f content="$content" \
              -f sha="$sha"
          else
            gh api repos/tnldotdev/homebrew-tap/contents/Formula/tnl.rb \
              --method PUT \
              -f message="tnl ${VERSION#v}" \
              -f content="$content"
          fi
