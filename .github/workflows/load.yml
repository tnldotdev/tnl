name: Load

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "30 8 * * *"
  workflow_dispatch:
    inputs:
      delay:
        description: Added delay after each database command
        type: choice
        options: [0ms, 5ms]
        default: 5ms

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  database:
    name: Database workload
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up tools
        uses: ./.github/actions/setup # zizmor: ignore[self-repository] pinned actionlint does not support $/ syntax
        with:
          go-cache: build

      - name: Run load tests
        env:
          DELAY: ${{ github.event_name == 'schedule' && '5ms' || inputs.delay || '0ms' }}
          PUBLIC_URLS: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && '1000' || '32' }}
        run: task go:test:load:database DELAY="$DELAY" PUBLIC_URLS="$PUBLIC_URLS"

  runtime:
    name: Runtime workload (${{ matrix.scenario }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        scenario: [smoke, relay-kill, connect]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up tools
        uses: ./.github/actions/setup # zizmor: ignore[self-repository] pinned actionlint does not support $/ syntax
        with:
          go-cache: build

      - name: Run runtime smoke
        if: matrix.scenario == 'smoke'
        run: task go:test:load:runtime RACE=1 RESULTS=bench-results/ci-smoke

      - name: Run relay-kill fallback workload
        if: matrix.scenario == 'relay-kill'
        run: task go:test:load:runtime SCENARIO=relay-kill RPS=160 RESULTS=bench-results/ci-relay-kill

      - name: Run connector load smoke
        if: matrix.scenario == 'connect'
        run: task go:test:load:connect RACE=1 RESULTS=bench-results/ci-connect

      - name: Retain workload evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: runtime-workloads-${{ matrix.scenario }}
          path: bench-results/ci-*
          if-no-files-found: ignore
          retention-days: 7

  runtime-extended:
    name: Extended runtime workloads
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up tools
        uses: ./.github/actions/setup # zizmor: ignore[self-repository] pinned actionlint does not support $/ syntax
        with:
          go-cache: build

      - name: Run reference and extended fault workloads
        run: |
          task go:test:load:runtime PUBLIC_URLS=64 START_PARALLEL=64 RPS=160 DURATION=30s RESULTS=bench-results/ci-reference
          task go:test:load:runtime SCENARIO=forwarding-blackhole RESULTS=bench-results/ci-forwarding-blackhole
          task go:test:load:runtime SCENARIO=publisher-blackhole RESULTS=bench-results/ci-publisher-blackhole
          task go:test:load:runtime SCENARIO=udp-fallback RESULTS=bench-results/ci-udp-fallback
          task go:test:load:connect SCENARIO=latency NETWORK_PATH=publisher RTT=50ms RESULTS=bench-results/ci-connect-publisher-latency
          task go:test:load:connect SCENARIO=latency NETWORK_PATH=connector RTT=50ms RESULTS=bench-results/ci-connect-connector-latency

      - name: Retain workload evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: runtime-workloads-extended
          path: bench-results/ci-*
          if-no-files-found: ignore
          retention-days: 7

  load:
    name: Load tests
    if: always()
    needs: [database, runtime, runtime-extended]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Verify workload jobs passed
        env:
          DATABASE_RESULT: ${{ needs.database.result }}
          RUNTIME_RESULT: ${{ needs.runtime.result }}
          EXTENDED_RESULT: ${{ needs.runtime-extended.result }}
          EXTENDED_REQUIRED: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
        run: |
          test "$DATABASE_RESULT" = success
          test "$RUNTIME_RESULT" = success
          if [ "$EXTENDED_REQUIRED" = true ]; then
            test "$EXTENDED_RESULT" = success
          else
            test "$EXTENDED_RESULT" = skipped
          fi
