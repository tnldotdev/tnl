name: Load

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "30 8 * * *"
  workflow_dispatch:
    inputs:
      delay:
        description: Added delay after each database command
        type: choice
        options: [0ms, 5ms]
        default: 5ms

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  database:
    name: Database workload
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            .github/workflows/load.yml

      - name: Set up Node
        uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          runtime: node@22.23.2
          cache: false
          require-lockfile: true

      - name: Install Task
        uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
        with:
          version: 3.53.1
          repo-token: ""
          checksum: a54a408f6861ff921f6e87774180db31bacd8c1e7c944ca696db9fea49a82fc7

      - name: Run load tests
        env:
          DELAY: ${{ github.event_name == 'schedule' && '5ms' || inputs.delay || '0ms' }}
          PUBLIC_URLS: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && '1000' || '32' }}
        run: task go:test:load:database DELAY="$DELAY" PUBLIC_URLS="$PUBLIC_URLS"

  runtime:
    name: Runtime workloads
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          runtime: node@22.23.2
          cache: false
          require-lockfile: true

      - name: Install Task
        uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
        with:
          version: 3.53.1
          repo-token: ""
          checksum: a54a408f6861ff921f6e87774180db31bacd8c1e7c944ca696db9fea49a82fc7

      - name: Run runtime smoke
        run: task go:test:load:runtime RACE=1 RESULTS=bench-results/ci-smoke

      - name: Run relay-kill fallback workload
        run: task go:test:load:runtime SCENARIO=relay-kill RPS=160 RESULTS=bench-results/ci-relay-kill

      - name: Run reference and extended fault workloads
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          task go:test:load:runtime PUBLIC_URLS=64 START_PARALLEL=64 RPS=160 DURATION=30s RESULTS=bench-results/ci-reference
          task go:test:load:runtime SCENARIO=forwarding-blackhole RESULTS=bench-results/ci-forwarding-blackhole
          task go:test:load:runtime SCENARIO=publisher-blackhole RESULTS=bench-results/ci-publisher-blackhole
          task go:test:load:runtime SCENARIO=udp-fallback RESULTS=bench-results/ci-udp-fallback

      - name: Retain workload evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: runtime-workloads
          path: bench-results/ci-*
          if-no-files-found: ignore
          retention-days: 7

  load:
    name: Load tests
    if: always()
    needs: [database, runtime]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Verify workload jobs passed
        env:
          DATABASE_RESULT: ${{ needs.database.result }}
          RUNTIME_RESULT: ${{ needs.runtime.result }}
        run: test "$DATABASE_RESULT" = success && test "$RUNTIME_RESULT" = success
