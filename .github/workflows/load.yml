name: Load

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "30 8 * * *"
  workflow_dispatch:
    inputs:
      delay:
        description: Added delay after each database command
        type: choice
        options: [0ms, 5ms]
        default: 5ms

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  load:
    name: Database load
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            .github/workflows/load.yml

      - name: Set up Node
        uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          runtime: node@22.23.2
          cache: false
          require-lockfile: true

      - name: Install Task
        uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
        with:
          version: 3.53.1
          repo-token: ""
          checksum: a54a408f6861ff921f6e87774180db31bacd8c1e7c944ca696db9fea49a82fc7

      - name: Run load tests
        env:
          DELAY: ${{ github.event_name == 'schedule' && '5ms' || inputs.delay || '0ms' }}
        run: task go:test:load:database DELAY="$DELAY"
