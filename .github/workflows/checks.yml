name: Checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Install pinned tools
        run: |
          go install github.com/go-task/task/v3/cmd/task@v3.53.1
          go install github.com/oapi-codegen/oapi-codegen/v2/cmd/oapi-codegen@v2.8.0
          go install golang.org/x/tools/cmd/goimports@v0.49.0
          go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
          go install honnef.co/go/tools/cmd/staticcheck@v0.8.1

      - name: Check formatting
        run: task go:format-check

      - name: Check generated files
        run: task go:generate-check

      - name: Run static analysis
        run: task go:lint

      - name: Scan for vulnerabilities
        run: task go:vulncheck

      - name: Run tests
        run: task go:test

      - name: Build commands
        run: task go:build

  typescript:
    name: TypeScript
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm and Node
        uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2.0.2
        with:
          version: 11.24.0
          runtime: node@24.20.0
          install: false
          cache: true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      - name: Generate files
        run: pnpm generate

      - name: Check generated files
        run: git diff --exit-code -- packages/hosted-protocol/src/generated

      - name: Check types
        run: pnpm check-types

      - name: Run static analysis
        run: pnpm lint

      - name: Lint API contracts
        run: pnpm lint:contracts

      - name: Run tests
        run: pnpm test

      - name: Build packages
        run: pnpm build

  github-actions:
    name: GitHub Actions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Run actionlint
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          actionlint

      - name: Run zizmor
        uses: zizmorcore/zizmor-action@3dc1ecc9bcb9e94e9b2c709687979e1298497054 # v0.6.2
        with:
          advanced-security: false
          online-audits: false
          version: 1.29.0
