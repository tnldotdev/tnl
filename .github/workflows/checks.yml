name: Checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  dns-e2e:
    name: Route 53 and ACME staging
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: dns-e2e-staging
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Install Task
        uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
        with:
          version: 3.53.1
          repo-token: ""
          checksum: a54a408f6861ff921f6e87774180db31bacd8c1e7c944ca696db9fea49a82fc7

      - name: Assume staging DNS test role
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          aws-region: us-east-1
          role-to-assume: arn:aws:iam::238224495584:role/tnl-dns-e2e-staging
          role-session-name: dns-e2e-${{ github.run_id }}

      - name: Run one DNS-01 issuance
        run: task go:test:integration:route53 ZONE_ID=Z0733537358Q00OAKA0PZ

  javascript:
    name: JavaScript
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm and Node
        uses: ./.github/actions/setup-pnpm # zizmor: ignore[self-repository] pinned actionlint does not support $/ syntax
        with:
          node-version: 22.23.2
          cache: true

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2

      - name: Install Task
        uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
        with:
          version: 3.53.1
          repo-token: ""
          checksum: a54a408f6861ff921f6e87774180db31bacd8c1e7c944ca696db9fea49a82fc7

      - name: Check packages
        run: task js:check

      - name: Show toolbar test browser
        run: google-chrome --version

      - name: Test embedded toolbar
        run: task js:test:browser

  python:
    name: Python
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Set up pnpm and Node
        uses: ./.github/actions/setup-pnpm # zizmor: ignore[self-repository] pinned actionlint does not support $/ syntax
        with:
          node-version: 22.23.2
          cache: true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13.9"

      - name: Install pinned uv
        run: python3 -m pip install uv==0.9.18

      - name: Install Task
        uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
        with:
          version: 3.53.1
          repo-token: ""
          checksum: a54a408f6861ff921f6e87774180db31bacd8c1e7c944ca696db9fea49a82fc7

      - name: Install GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: v2.18.0
          install-only: true

      - name: Install Syft
        uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          syft-version: v1.51.1

      - name: Install package tooling
        run: pnpm install --frozen-lockfile

      - name: Check Python SDK
        run: task py:check

      - name: Build and verify installed release packages
        run: |
          task release:snapshot
          task release:npm-package
          task py:build

  framework-compatibility:
    name: ${{ matrix.framework }} ${{ matrix.version }}
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - framework: next
            version: "16.3.4"
            vitest-version: "5.0.0"
          - framework: vite
            version: "6.0.9"
            vitest-version: "4.1.11"
          - framework: vite
            version: "7.0.0"
            vitest-version: "5.0.0"
          - framework: vite
            version: "8.2.2"
            vitest-version: "5.0.0"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm and Node
        uses: ./.github/actions/setup-pnpm # zizmor: ignore[self-repository] pinned actionlint does not support $/ syntax
        with:
          node-version: 22.23.2
          cache: true

      - name: Install test runner version
        env:
          VITEST_VERSION: ${{ matrix.vitest-version }}
        run: pnpm --workspace-root add --save-dev --save-exact --ignore-scripts "vitest@$VITEST_VERSION" "@vitest/coverage-v8@$VITEST_VERSION" # zizmor: ignore[adhoc-packages] compatibility matrix

      - name: Install framework version
        env:
          FRAMEWORK: ${{ matrix.framework }}
          VERSION: ${{ matrix.version }}
        run: pnpm --filter @tnldotdev/tnl add --save-dev --save-exact --ignore-scripts "$FRAMEWORK@$VERSION" # zizmor: ignore[adhoc-packages] compatibility matrix

      - name: Build integrations
        run: pnpm --filter @tnldotdev/tnl build

      - name: Test integration
        env:
          FRAMEWORK: ${{ matrix.framework }}
        run: pnpm exec vitest run "packages/ts/test/frameworks/$FRAMEWORK.test.ts"

  go-linux:
    name: Go (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check patch
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: git diff --check "$BASE_SHA" HEAD

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            tools/staticcheck/go.sum
            tools/testharness/go.sum
            mise.toml

      - name: Set up pnpm and Node
        uses: ./.github/actions/setup-pnpm # zizmor: ignore[self-repository] pinned actionlint does not support $/ syntax
        with:
          node-version: 22.23.2
          cache: true

      - name: Install Task
        uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
        with:
          version: 3.53.1
          repo-token: ""
          checksum: a54a408f6861ff921f6e87774180db31bacd8c1e7c944ca696db9fea49a82fc7

      - name: Install pinned tools
        run: |
          go install github.com/oapi-codegen/oapi-codegen/v2/cmd/oapi-codegen@v2.8.0
          go install github.com/sqlc-dev/sqlc/cmd/sqlc@v1.31.1
          go install golang.org/x/tools/cmd/goimports@v0.49.0
          go install golang.org/x/vuln/cmd/govulncheck@v1.7.0

      - name: Check formatting
        run: task go:format-check

      - name: Check generated files
        run: task go:generate-check

      - name: Run static analysis
        run: task go:lint

      - name: Scan for vulnerabilities
        run: task go:vulncheck

      - name: Run tests
        run: task go:test

      - name: Build commands
        run: task go:build

  go-macos:
    name: Go (macOS)
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up pnpm and Node
        uses: ./.github/actions/setup-pnpm # zizmor: ignore[self-repository] pinned actionlint does not support $/ syntax
        with:
          node-version: 22.23.2
          cache: true

      - name: Install Task
        uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
        with:
          version: 3.53.1
          repo-token: ""
          checksum: 85d2d96c2380b33d7855b07b3f7a20dc7ca0eda999a26efa0fb5f6f32b366cd7

      - name: Run Go tests
        run: task go:test

  go-race:
    name: Go race
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            Taskfile.yml
            tasks/*.yml

      - name: Install Task
        uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
        with:
          version: 3.53.1
          repo-token: ""
          checksum: a54a408f6861ff921f6e87774180db31bacd8c1e7c944ca696db9fea49a82fc7

      - name: Run race tests
        run: task go:test:race

  release-build:
    name: Release build (${{ matrix.target }})
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        target:
          - darwin_amd64_v1
          - darwin_arm64_v8.0
          - linux_amd64_v1
          - linux_arm64_v8.0
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Install GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: v2.18.0
          install-only: true

      - name: Check release configuration
        run: goreleaser check

      - name: Build release target
        env:
          TARGET: ${{ matrix.target }}
        run: goreleaser build --snapshot --clean --single-target

      - name: Verify release target
        env:
          TARGET: ${{ matrix.target }}
        run: |
          test -x "dist/tnl_${TARGET}/tnl"
          test -x "dist/tnld_${TARGET}/tnld"

  container:
    name: Container
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Buildx
        id: buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Restore container Go build cache
        if: github.event_name == 'pull_request'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .buildkit-go-cache
          key: ${{ runner.os }}-${{ runner.arch }}-tnl-container-go-${{ hashFiles('go.sum', 'Dockerfile') }}

      - name: Cache container Go builds
        if: github.event_name == 'push'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # zizmor: ignore[cache-poisoning] v6.1.0; writes run only on trusted pushes
        with:
          path: .buildkit-go-cache
          key: ${{ runner.os }}-${{ runner.arch }}-tnl-container-go-${{ hashFiles('go.sum', 'Dockerfile') }}

      - name: Inject container Go build cache
        uses: reproducible-containers/buildkit-cache-dance@5422eac04292c961a382e0f584ea0f03ad9da723 # v3.4.0
        with:
          builder: ${{ steps.buildx.outputs.name }}
          cache-map: '{".buildkit-go-cache":"/root/.cache/go-build"}'
          scratch-dir: .buildkit-cache-dance

      - name: Build native image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: tnl:ci
          provenance: false
          sbom: false
          build-args: |
            VERSION=ci
            COMMIT=ci
          cache-from: type=gha,scope=tnl-container-check

      - name: Smoke-test image
        shell: bash
        run: |
          test "$(docker run --rm --network none tnl:ci version)" = "tnl ci (ci)"
          test "$(docker run --rm --network none --entrypoint /usr/local/bin/tnld tnl:ci version)" = "tnld ci (ci)"
          test "$(docker image inspect tnl:ci --format '{{ .Config.User }}')" = "65532:65532"
          docker run --rm --network none tnl:ci --no-telemetry status --all --scope local --output json |
            jq -e '.schema_version == 1 and .scope == "local" and .projects == []' > /dev/null

          status=0
          output="$(docker run --rm --network none --entrypoint /usr/local/bin/tnld tnl:ci migrate 2>&1)" || status=$?
          test "$status" = 1
          test "$output" = "tnld: migrate TNLD_DATABASE_DIRECT_URL: direct database URL is required for migration; set a direct PostgreSQL URL with migration permissions, then rerun tnld migrate"
          for role in standalone control; do
            status=0
            output="$(docker run --rm --network none --entrypoint /usr/local/bin/tnld --env TNLD_ROLE="$role" tnl:ci 2>&1)" || status=$?
            test "$status" = 1
            test "$output" = "tnld: validate pooled database URL TNLD_DATABASE_URL: database URL must be a pooled PostgreSQL URL; set the pooled runtime URL and reserve TNLD_DATABASE_DIRECT_URL for tnld migrate"
          done

          test "$(docker image inspect tnl:ci --format '{{ index .Config.Labels "org.opencontainers.image.licenses" }}')" = BSD-3-Clause
          container="$(docker create tnl:ci)"
          trap 'docker rm "$container" >/dev/null' EXIT
          docker cp "$container:/licenses/tnl/LICENSE" "$RUNNER_TEMP/LICENSE"
          grep -q '^BSD 3-Clause License$' "$RUNNER_TEMP/LICENSE"

      - name: Build multi-platform image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          outputs: type=oci,dest=/tmp/tnl-image.tar
          provenance: false
          sbom: false
          build-args: |
            VERSION=ci
            COMMIT=ci
          cache-from: type=gha,scope=tnl-container-check
          cache-to: type=gha,mode=max,scope=tnl-container-check

      - name: Validate Compose deployment
        shell: bash
        env:
          TNL_ENV_FILE: .env.example
        run: |
          for directory in deploy/server/standalone deploy/server/split; do
            docker compose --env-file "$directory/.env.example" --file "$directory/compose.yaml" config --format json |
              jq -e '
                .services as $services |
                [$services | to_entries[] | select(.key != "control-proxy") | .value] as $daemons |
                $services.migrate.command == ["migrate"] and
                ($daemons | length > 0 and all(.entrypoint == ["/usr/local/bin/tnld"])) and
                ($services["control-proxy"] |
                  .image == "caddy:2.10.2-alpine@sha256:4c6e91c6ed0e2fa03efd5b44747b625fec79bc9cd06ac5235a779726618e530d" and
                  .entrypoint == null and
                  any(.volumes[];
                    .type == "bind" and (.source | test("/deploy/server/(standalone|split)/Caddyfile$")) and
                    .target == "/etc/caddy/Caddyfile" and .read_only == true))
              ' > /dev/null
          done
          docker compose --file development/local/compose.yaml config --format json |
            jq -e '.services.migrate.command == ["migrate"] and ([.services.migrate, .services.tnld] | all(.entrypoint == ["/usr/local/bin/tnld"]))' > /dev/null

  github-actions:
    name: GitHub Actions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            .github/workflows/checks.yml

      - name: Run actionlint
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          actionlint

      - name: Run zizmor
        uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          advanced-security: false
          inputs: .github
          online-audits: false
          version: 1.30.0
