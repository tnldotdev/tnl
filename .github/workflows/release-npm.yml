name: Release npm package

on:
  push:
    tags:
      - "npm/dev/v[0-9]*.[0-9]*.[0-9]*"
      - "npm/next/v[0-9]*.[0-9]*.[0-9]*"
      - "npm/vite/v[0-9]*.[0-9]*.[0-9]*"

permissions:
  contents: read

concurrency:
  group: npm-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish npm package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify release tag and commit
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          case "$TAG" in
            npm/dev/v*) package=dev; version="${TAG#npm/dev/v}" ;;
            npm/next/v*) package=next; version="${TAG#npm/next/v}" ;;
            npm/vite/v*) package=vite; version="${TAG#npm/vite/v}" ;;
            *) echo "unsupported npm release tag: $TAG" >&2; exit 1 ;;
          esac
          if [[ ! "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]; then
            echo "invalid npm package version: $version" >&2
            exit 1
          fi
          tag_sha="$(git rev-parse "refs/tags/$TAG^{tag}")"
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$tag_sha" --jq '.verification.verified')" = true
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$tag_sha" --jq '.object.sha')" = "$GITHUB_SHA"
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          printf 'package=%s\n' "$package" >> "$GITHUB_OUTPUT"
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"

      - name: Set up pnpm
        uses: pnpm/action-setup@ff378ebe6b225b0680b81c1ad4498ae0d1d3a5e3 # v6.0.10
        with:
          version: 11.24.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.1
          package-manager-cache: false
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify package version
        env:
          PACKAGE: ${{ steps.release.outputs.package }}
          VERSION: ${{ steps.release.outputs.version }}
        run: node scripts/verify-package-versions.mjs "$PACKAGE" "$VERSION"

      - name: Check packages
        run: |
          pnpm build
          pnpm typecheck
          pnpm test
          pnpm lint
          pnpm format:check
          pnpm run pack

      - name: Pack package for publishing
        env:
          PACKAGE: ${{ steps.release.outputs.package }}
        run: |
          mkdir "$RUNNER_TEMP/npm-package"
          pnpm --filter "@tnldotdev/$PACKAGE" pack --pack-destination "$RUNNER_TEMP/npm-package"

      - name: Publish package with npm OIDC
        env:
          PACKAGE: ${{ steps.release.outputs.package }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          dist_tag=latest
          if [[ "$VERSION" == *-* ]]; then
            dist_tag=next
          fi
          tarball="$RUNNER_TEMP/npm-package/tnldotdev-$PACKAGE-$VERSION.tgz"
          test -f "$tarball"
          pnpm exec npm publish "$tarball" --access public --tag "$dist_tag"
