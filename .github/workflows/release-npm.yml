name: Release npm package

on:
  push:
    tags:
      - "npm/dev/v[0-9]*.[0-9]*.[0-9]*"
      - "npm/next/v[0-9]*.[0-9]*.[0-9]*"
      - "npm/vite/v[0-9]*.[0-9]*.[0-9]*"

permissions:
  contents: read

concurrency:
  group: npm-release
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare npm package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      package: ${{ steps.release.outputs.package }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify release tag and commit
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          case "$TAG" in
            npm/dev/v*) package=dev; version="${TAG#npm/dev/v}" ;;
            npm/next/v*) package=next; version="${TAG#npm/next/v}" ;;
            npm/vite/v*) package=vite; version="${TAG#npm/vite/v}" ;;
            *) echo "unsupported npm release tag: $TAG" >&2; exit 1 ;;
          esac
          if [[ ! "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]; then
            echo "invalid npm package version: $version" >&2
            exit 1
          fi
          tag_sha="$(git rev-parse "refs/tags/$TAG^{tag}")"
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$tag_sha" --jq '.verification.verified')" = true
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$tag_sha" --jq '.object.sha')" = "$GITHUB_SHA"
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          printf 'package=%s\n' "$package" >> "$GITHUB_OUTPUT"
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"

      - name: Set up pnpm and Node
        uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          runtime: node@22.23.2
          cache: true
          require-lockfile: true

      - name: Verify package version
        env:
          PACKAGE: ${{ steps.release.outputs.package }}
          VERSION: ${{ steps.release.outputs.version }}
        run: node scripts/verify-package-versions.mjs "$PACKAGE" "$VERSION"

      - name: Check packages
        run: |
          pnpm build
          pnpm typecheck:ci
          pnpm test:ci
          pnpm lint
          pnpm format:check

      - name: Pack package
        env:
          PACKAGE: ${{ steps.release.outputs.package }}
        run: |
          mkdir "$RUNNER_TEMP/npm-package"
          pnpm --filter "@tnldotdev/$PACKAGE" pack --pack-destination "$RUNNER_TEMP/npm-package"

      - name: Upload package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-package
          path: ${{ runner.temp }}/npm-package/tnldotdev-${{ steps.release.outputs.package }}-${{ steps.release.outputs.version }}.tgz
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  publish:
    name: Publish npm package
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.20.0
          package-manager-cache: false
          registry-url: https://registry.npmjs.org

      - name: Download package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-package
          path: ${{ runner.temp }}/npm-package

      - name: Publish package with npm OIDC
        env:
          PACKAGE: ${{ needs.prepare.outputs.package }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          dist_tag=latest
          if [[ "$VERSION" == *-* ]]; then
            dist_tag=next
          fi
          tarball="$RUNNER_TEMP/npm-package/tnldotdev-$PACKAGE-$VERSION.tgz"
          test -f "$tarball"
          npm publish "$tarball" --access public --tag "$dist_tag"
