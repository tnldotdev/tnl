name: Integration

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  postgres:
    name: PostgreSQL (${{ matrix.suite }}, ${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        suite: [state:shard, runtime:shard]
        shard: [1/4, 2/4, 3/4, 4/4]
        include:
          - suite: api
            shard: 1/1
          - suite: runtime:leases
            shard: 1/1
          - suite: runtime:workload
            shard: 1/1
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            tools/testharness/go.sum
            .github/workflows/integration.yml

      - name: Install Task
        uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
        with:
          version: 3.53.1
          repo-token: ""
          checksum: a54a408f6861ff921f6e87774180db31bacd8c1e7c944ca696db9fea49a82fc7

      - name: Install pinned tools
        run: go install github.com/letsencrypt/pebble/v2/cmd/pebble@v2.10.1

      - name: Check test harness and shard selection
        if: matrix.suite == 'api'
        run: task go:test:harness

      - name: Run integration tests
        env:
          TEST_SUITE: ${{ matrix.suite }}
          SHARD: ${{ matrix.shard }}
        run: task "go:test:integration:$TEST_SUITE" SHARD="$SHARD"

  workload-function:
    name: Native workload (${{ matrix.suite }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        suite: [provider-http, vercel]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            tools/testharness/go.sum

      - name: Set up pnpm and Node 24
        uses: ./.github/actions/setup-pnpm # zizmor: ignore[self-repository] pinned actionlint does not support $/ syntax
        with:
          runtime: node@24.20.0

      - name: Set up Bun for installed SDK checks
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2

      - name: Install Task
        uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
        with:
          version: 3.53.1
          repo-token: ""
          checksum: a54a408f6861ff921f6e87774180db31bacd8c1e7c944ca696db9fea49a82fc7

      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile
          go install github.com/letsencrypt/pebble/v2/cmd/pebble@v2.10.1

      - name: Qualify native workload boundary
        env:
          TEST_SUITE: ${{ matrix.suite }}
        run: task "go:test:integration:$TEST_SUITE"

  clients:
    name: Clients (${{ matrix.suite }}, ${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        suite: [cli]
        shard: [1/3, 2/3, 3/3]
        include:
          - suite: publisher-groups
            shard: 1/1
          - suite: management
            shard: 1/1
          - suite: tcp-clients
            shard: 1/1
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            tools/testharness/go.sum
            .github/workflows/integration.yml

      - name: Install Task
        uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
        with:
          version: 3.53.1
          repo-token: ""
          checksum: a54a408f6861ff921f6e87774180db31bacd8c1e7c944ca696db9fea49a82fc7

      - name: Set up pnpm and Node
        uses: ./.github/actions/setup-pnpm # zizmor: ignore[self-repository] pinned actionlint does not support $/ syntax
        with:
          runtime: node@22.23.2

      - name: Install driver fixture dependencies
        run: pnpm install --frozen-lockfile

      - name: Set up Python driver fixture
        if: matrix.suite == 'tcp-clients'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13.9"

      - name: Install pinned uv
        if: matrix.suite == 'tcp-clients'
        run: python3 -m pip install uv==0.9.18

      - name: Install OpenSSH fixture
        if: matrix.suite == 'cli' || matrix.suite == 'management'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends openssh-server
          sudo install -d -m 0755 /run/sshd

      - name: Verify client boundary
        env:
          TEST_SUITE: ${{ matrix.suite }}
          SHARD: ${{ matrix.shard }}
        run: task "go:test:integration:$TEST_SUITE" SHARD="$SHARD"

  binary:
    name: Binary (${{ matrix.suite }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        suite: [owner-lifecycle, connections, binary]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            .github/workflows/integration.yml

      - name: Set up pnpm and Node
        uses: ./.github/actions/setup-pnpm # zizmor: ignore[self-repository] pinned actionlint does not support $/ syntax
        with:
          runtime: node@22.23.2

      - name: Install Task
        uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
        with:
          version: 3.53.1
          repo-token: ""
          checksum: a54a408f6861ff921f6e87774180db31bacd8c1e7c944ca696db9fea49a82fc7

      - name: Install pinned tools
        run: go install github.com/letsencrypt/pebble/v2/cmd/pebble@v2.10.1

      - name: Allow local DNS and HTTPS test listeners
        run: sudo sysctl --write net.ipv4.ip_unprivileged_port_start=53

      - name: Verify binary boundary
        env:
          TEST_SUITE: ${{ matrix.suite }}
        run: task "go:test:integration:$TEST_SUITE"

  compose:
    name: Compose publisher integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            .github/workflows/integration.yml

      - name: Install Task
        uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
        with:
          version: 3.53.1
          repo-token: ""
          checksum: a54a408f6861ff921f6e87774180db31bacd8c1e7c944ca696db9fea49a82fc7

      - name: Check Compose target discovery
        run: task go:test:integration:compose

      - name: Check Ubuntu and Compose publisher installation
        run: task go:test:integration:publisher-install

      - name: Check exact certificate recovery and durable publisher replacement
        run: task go:test:integration:publisher-recovery go:test:integration:publisher-replacement

  dns:
    name: DNS integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            tools/testharness/go.sum

      - name: Install Task
        uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
        with:
          version: 3.53.1
          repo-token: ""
          checksum: a54a408f6861ff921f6e87774180db31bacd8c1e7c944ca696db9fea49a82fc7

      - name: Run DNS integration test
        run: task go:test:integration:dns

  postgres-result:
    name: PostgreSQL integration
    if: always()
    needs: [postgres]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Verify every PostgreSQL shard passed
        env:
          RESULT: ${{ needs.postgres.result }}
        run: test "$RESULT" = success

  binary-result:
    name: Binary integration
    if: always()
    needs: [binary]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Verify every binary boundary passed
        env:
          RESULT: ${{ needs.binary.result }}
        run: test "$RESULT" = success

  integration:
    name: Go integration
    if: always()
    needs: [postgres-result, workload-function, clients, binary-result, compose, dns]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Verify integration jobs passed
        env:
          POSTGRES_RESULT: ${{ needs.postgres-result.result }}
          WORKLOAD_FUNCTION_RESULT: ${{ needs.workload-function.result }}
          CLIENTS_RESULT: ${{ needs.clients.result }}
          BINARY_RESULT: ${{ needs.binary-result.result }}
          COMPOSE_RESULT: ${{ needs.compose.result }}
          DNS_RESULT: ${{ needs.dns.result }}
        run: |
          test "$POSTGRES_RESULT" = success
          test "$WORKLOAD_FUNCTION_RESULT" = success
          test "$CLIENTS_RESULT" = success
          test "$BINARY_RESULT" = success
          test "$COMPOSE_RESULT" = success
          test "$DNS_RESULT" = success
