name: Integration

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  postgres:
    name: PostgreSQL integration
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            tools/testharness/go.sum
            .github/workflows/integration.yml

      - name: Install Task
        uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
        with:
          version: 3.53.1
          repo-token: ""
          checksum: a54a408f6861ff921f6e87774180db31bacd8c1e7c944ca696db9fea49a82fc7

      - name: Install pinned tools
        run: go install github.com/letsencrypt/pebble/v2/cmd/pebble@v2.10.1

      - name: Run integration tests
        run: task go:test:integration

  clients:
    name: CLI and database clients
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            tools/testharness/go.sum
            .github/workflows/integration.yml

      - name: Install Task
        uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
        with:
          version: 3.53.1
          repo-token: ""
          checksum: a54a408f6861ff921f6e87774180db31bacd8c1e7c944ca696db9fea49a82fc7

      - name: Install OpenSSH fixture
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends openssh-server
          sudo install -d -m 0755 /run/sshd

      - name: Verify CLI workflows
        run: task go:test:integration:cli

      - name: Verify private connector and publisher lifecycle
        run: task go:test:integration:tcp-lifecycle

      - name: Verify TCP clients
        run: task go:test:integration:tcp-clients

      - name: Verify existing sshd through private streams
        run: task go:test:integration:private-sshd

  binary:
    name: Binary integration
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            .github/workflows/integration.yml

      - name: Set up pnpm and Node
        uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
        with:
          runtime: node@22.23.2
          cache: true
          require-lockfile: true

      - name: Install Task
        uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
        with:
          version: 3.53.1
          repo-token: ""
          checksum: a54a408f6861ff921f6e87774180db31bacd8c1e7c944ca696db9fea49a82fc7

      - name: Install pinned tools
        run: go install github.com/letsencrypt/pebble/v2/cmd/pebble@v2.10.1

      - name: Allow local DNS and HTTPS test listeners
        run: sudo sysctl --write net.ipv4.ip_unprivileged_port_start=53

      - name: Verify native SDK connections
        run: task go:test:connections

      - name: Verify native Drizzle Kit migration
        run: task go:test:integration:connections

      - name: Run binary integration tests
        run: task go:test:integration:binary

  compose:
    name: Compose publisher integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            .github/workflows/integration.yml

      - name: Install Task
        uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
        with:
          version: 3.53.1
          repo-token: ""
          checksum: a54a408f6861ff921f6e87774180db31bacd8c1e7c944ca696db9fea49a82fc7

      - name: Check Compose target discovery
        run: task go:test:integration:compose

  dns:
    name: DNS integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            tools/testharness/go.sum

      - name: Install Task
        uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
        with:
          version: 3.53.1
          repo-token: ""
          checksum: a54a408f6861ff921f6e87774180db31bacd8c1e7c944ca696db9fea49a82fc7

      - name: Run DNS integration test
        run: task go:test:integration:dns

  integration:
    name: Go integration
    if: always()
    needs: [postgres, clients, binary, compose, dns]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Verify integration jobs passed
        env:
          POSTGRES_RESULT: ${{ needs.postgres.result }}
          CLIENTS_RESULT: ${{ needs.clients.result }}
          BINARY_RESULT: ${{ needs.binary.result }}
          COMPOSE_RESULT: ${{ needs.compose.result }}
          DNS_RESULT: ${{ needs.dns.result }}
        run: |
          test "$POSTGRES_RESULT" = success
          test "$CLIENTS_RESULT" = success
          test "$BINARY_RESULT" = success
          test "$COMPOSE_RESULT" = success
          test "$DNS_RESULT" = success
