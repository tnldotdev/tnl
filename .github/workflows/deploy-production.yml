name: Deploy production

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Published release tag
        required: true
        type: string
      sha:
        description: Release commit
        required: true
        type: string
      image:
        description: Published image digest reference
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: server-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy release to production
    if: github.ref == 'refs/heads/production'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: deploy-production
    steps:
      - name: Verify published release
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
          SHA: ${{ inputs.sha }}
          IMAGE: ${{ inputs.image }}
          ACTUAL_SHA: ${{ github.sha }}
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$ ]]
          [[ "$SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$IMAGE" =~ ^ghcr\.io/tnldotdev/tnl@sha256:[a-f0-9]{64}$ ]]
          test "$SHA" = "$ACTUAL_SHA"
          test "$(gh release view "$TAG" --repo "$REPOSITORY" --json isDraft --jq '.isDraft')" = false
          tag_object="$(gh api "repos/$REPOSITORY/git/ref/tags/$TAG" --jq '.object.sha')"
          test "$(gh api "repos/$REPOSITORY/git/tags/$tag_object" --jq '[.verification.verified, .object.sha] | @tsv')" = "$(printf 'true\t%s' "$SHA")"
          gh release download "$TAG" --repo "$REPOSITORY" --pattern tnld-image-digest.txt --dir "$RUNNER_TEMP"
          test "$(<"$RUNNER_TEMP/tnld-image-digest.txt")" = "$IMAGE"

      - name: Check out production
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3

      - name: Verify release image signature
        env:
          TAG: ${{ inputs.tag }}
          IMAGE: ${{ inputs.image }}
        run: |
          cosign verify --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity "https://github.com/tnldotdev/tnl/.github/workflows/release.yml@refs/tags/$TAG" \
            "$IMAGE" > /dev/null

      - name: Set up Fly tools
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.9.0
          install_args: flyctl task node
          cache: false

      - name: Migrate and deploy production
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          TNLD_DATABASE_DIRECT_URL: ${{ secrets.TNLD_DATABASE_DIRECT_URL }}
          TAG: ${{ inputs.tag }}
          SHA: ${{ inputs.sha }}
          IMAGE: ${{ inputs.image }}
        run: task server:deploy:production IMAGE="$IMAGE" VERSION="${TAG#v}" COMMIT="$SHA"
