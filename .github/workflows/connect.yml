name: Connect action

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  connect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup # zizmor: ignore[self-repository] pinned actionlint does not support $/ syntax
        with:
          tools: go node pnpm task go:github.com/rhysd/actionlint/cmd/actionlint aqua:zizmorcore/zizmor
          go-cache: race
          pnpm: true
      - run: task connect:check connect:generate-check
      - id: fixture
        run: task connect:fixture:prepare
      - uses: ./connect # zizmor: ignore[self-repository] exercises the checked-out action bundle
        with:
          workload: deploy
          cli-path: ${{ steps.fixture.outputs.binary }}
          working-directory: ${{ steps.fixture.outputs.project }}
          services: database
        env:
          ACTIONS_ID_TOKEN_REQUEST_URL: ${{ steps.fixture.outputs.oidc }}
          ACTIONS_ID_TOKEN_REQUEST_TOKEN: fixture-bearer
          NO_PROXY: 127.0.0.1
      - run: task connect:fixture:observe
      - run: task connect:fixture:remove-original
        env:
          FIXTURE_ROOT: ${{ steps.fixture.outputs.root }}
      - run: task connect:fixture:observe
      - if: always() && steps.fixture.outcome == 'success'
        run: task connect:fixture:stop-oidc
        env:
          FIXTURE_ROOT: ${{ steps.fixture.outputs.root }}
