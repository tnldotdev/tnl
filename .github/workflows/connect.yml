name: Connect action

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  connect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-pnpm # zizmor: ignore[self-repository] pinned actionlint does not support $/ syntax
        with:
          node-version: 22.23.2
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13.9"
      - uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
        with:
          version: 3.53.1
          repo-token: ""
          checksum: a54a408f6861ff921f6e87774180db31bacd8c1e7c944ca696db9fea49a82fc7
      - name: Install workflow lint tools
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          python3 -m pip install zizmor==1.30.0
      - run: pnpm install --frozen-lockfile
      - run: task connect:check
      - run: task connect:generate-check
      - id: fixture
        run: task connect:fixture:prepare
      - uses: ./connect # zizmor: ignore[self-repository] exercises the checked-out action bundle
        with:
          workload: deploy
          cli-path: ${{ steps.fixture.outputs.binary }}
          working-directory: ${{ steps.fixture.outputs.project }}
          services: database
        env:
          ACTIONS_ID_TOKEN_REQUEST_URL: ${{ steps.fixture.outputs.oidc }}
          ACTIONS_ID_TOKEN_REQUEST_TOKEN: fixture-bearer
          NO_PROXY: 127.0.0.1
      - run: task connect:fixture:observe
      - run: task connect:fixture:remove-original
        env:
          FIXTURE_ROOT: ${{ steps.fixture.outputs.root }}
      - run: task connect:fixture:observe
      - if: always() && steps.fixture.outcome == 'success'
        run: task connect:fixture:stop-oidc
        env:
          FIXTURE_ROOT: ${{ steps.fixture.outputs.root }}
