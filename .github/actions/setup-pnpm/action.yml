name: Set up pnpm and Node
description: Install the project's pinned pnpm, exact Node version, and frozen dependencies
inputs:
  node-version:
    description: Exact Node version
    required: true
  cache:
    description: Cache the pnpm store
    default: "false"
runs:
  using: composite
  steps:
    - name: Install pinned pnpm
      uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      with:
        run_install: false
        cache: ${{ inputs.cache }}

    - name: Install selected Node version
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: ${{ inputs.node-version }}
        package-manager-cache: false

    - name: Install frozen dependencies
      shell: bash
      env:
        PNPM_CONFIG_GLOBAL_SHIMS: '{"node":false}'
      run: |
        printf '%s\n' 'PNPM_CONFIG_GLOBAL_SHIMS={"node":false}' >> "$GITHUB_ENV"
        pnpm install --frozen-lockfile --no-runtime
