name: Set up pnpm and Node
description: Install the project's pinned pnpm, exact Node version, and frozen dependencies
inputs:
  node-version:
    description: Exact Node version
    required: true
  cache:
    description: Restore the pnpm store
    default: "false"
  cache-save:
    description: Save the frozen pnpm store on main pushes
    default: "false"
runs:
  using: composite
  steps:
    - name: Install pinned pnpm
      uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      with:
        run_install: false
        cache: false

    - name: Install selected Node version
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: ${{ inputs.node-version }}
        package-manager-cache: false

    - name: Locate pnpm store
      if: inputs.cache == 'true'
      id: store
      shell: bash
      run: echo "path=$(pnpm store path)" >> "$GITHUB_OUTPUT"

    - name: Restore pnpm store
      if: inputs.cache == 'true'
      id: cache
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.store.outputs.path }}
        key: pnpm-v1-${{ runner.os }}-${{ runner.arch }}-node-${{ inputs.node-version }}-${{ hashFiles('pnpm-lock.yaml') }}

    - name: Install frozen dependencies
      shell: bash
      env:
        PNPM_CONFIG_GLOBAL_SHIMS: '{"node":false}'
      run: |
        printf '%s\n' 'PNPM_CONFIG_GLOBAL_SHIMS={"node":false}' >> "$GITHUB_ENV"
        pnpm install --frozen-lockfile --no-runtime

    - name: Save pnpm store on main
      if: inputs.cache == 'true' && inputs.cache-save == 'true' && steps.cache.outputs.cache-hit != 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # zizmor: ignore[cache-poisoning] v6.1.0; frozen dependencies on trusted main pushes only
      with:
        path: ${{ steps.store.outputs.path }}
        key: pnpm-v1-${{ runner.os }}-${{ runner.arch }}-node-${{ inputs.node-version }}-${{ hashFiles('pnpm-lock.yaml') }}
