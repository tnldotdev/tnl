name: Install workspace dependencies
description: Install frozen dependencies using the mise Node and pnpm versions
inputs:
  cache-save:
    description: Save the frozen pnpm store on main pushes
    default: "false"
runs:
  using: composite
  steps:
    - name: Locate pnpm store
      id: store
      shell: bash
      run: |
        echo "path=$(pnpm store path)" >> "$GITHUB_OUTPUT"
        echo "node=$(node --version)" >> "$GITHUB_OUTPUT"

    - name: Restore pnpm store
      id: cache
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.store.outputs.path }}
        key: pnpm-v2-${{ runner.os }}-${{ runner.arch }}-node-${{ steps.store.outputs.node }}-${{ hashFiles('pnpm-lock.yaml') }}

    - name: Install frozen dependencies
      shell: bash
      env:
        PNPM_CONFIG_GLOBAL_SHIMS: '{"node":false}'
      run: |
        printf '%s\n' 'PNPM_CONFIG_GLOBAL_SHIMS={"node":false}' >> "$GITHUB_ENV"
        pnpm install --frozen-lockfile --no-runtime

    - name: Save pnpm store on main
      if: inputs.cache-save == 'true' && steps.cache.outputs.cache-hit != 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # zizmor: ignore[cache-poisoning] v6.1.0; frozen dependencies on trusted main pushes only
      with:
        path: ${{ steps.store.outputs.path }}
        key: pnpm-v2-${{ runner.os }}-${{ runner.arch }}-node-${{ steps.store.outputs.node }}-${{ hashFiles('pnpm-lock.yaml') }}
