paths:
  /__tnl/access:
    get:
      operationId: getBrowserAccessStatus
      summary: Check whether this browser can visit the current service run
      description: >-
        Uses the same prepared visitor permission, anonymous policy, and IP filter as forwarding
        on this hostname. The response contains no share or session secrets.
        This endpoint does not reach the local service.
      responses:
        "200":
          description: Current browser access to the published preview
          content:
            application/json:
              schema:
                $ref: "../openapi.yaml#/components/schemas/BrowserAccessStatus"
        "403":
          description: This browser cannot currently visit the service
          content:
            application/json:
              schema:
                $ref: "../openapi.yaml#/components/schemas/BrowserAccessStatus"
        default:
          $ref: "../openapi.yaml#/components/responses/FeedbackError"
