schemas:
  ApplicationOIDCProof:
    type: object
    additionalProperties: false
    required: [kind, machine_id, assertion]
    description: Transient proof from an explicitly selected OIDC source. Never persist or log the assertion.
    properties:
      kind: { type: string, enum: [oidc] }
      machine_id:
        type: string
        description: Explicit approved machine identity, pinned before the first exchange. A retry cannot switch identity policies after an uncertain reply.
      assertion:
        type: string
        minLength: 1
        maxLength: 32768
        pattern: '^[^\s\u0000]+$'
  ApplicationRegisteredKeyProof:
    type: object
    additionalProperties: false
    required: [kind, machine_id, key_id]
    description: Explicit registered source selection. Challenge requests omit reply; publication requests require the defining authority IdentitySourceReply for the native-issued challenge. The source key never crosses IPC.
    properties:
      kind: { type: string, enum: [registered_key] }
      machine_id: { type: string, pattern: '^mci_[A-Za-z0-9]{22}$' }
      key_id: { type: string, minLength: 1, maxLength: 128 }
      reply: { $ref: '../openapi.yaml#/components/schemas/IdentitySourceReply' }
  ApplicationPublication:
    type: object
    additionalProperties: false
    required: [version, invocation_id, owner, pid, target, server_url, auth]
    description: Exactly one of resource_id and allocate is required. The bound target is independent of resource selection. Auth is an explicit private IPC handoff and must never be persisted in observations or logs.
    properties:
      version: { type: integer, enum: [1] }
      invocation_id: { type: string, maxLength: 128 }
      owner: { type: string, pattern: "^[a-f0-9]{32}$" }
      pid: { type: integer, minimum: 1 }
      target: { type: string, maxLength: 4096 }
      server_url: { type: string, maxLength: 4096 }
      auth:
        oneOf:
          - $ref: "../openapi.yaml#/components/schemas/ApplicationOIDCProof"
          - $ref: "../openapi.yaml#/components/schemas/ApplicationRegisteredKeyProof"
        x-go-type: json.RawMessage
        description: Identity-source proof interpreted only by the application publication authority. No environment, saved login, or publisher-file fallback is permitted.
      resource_id: { type: string, maxLength: 128 }
      allocate:
        type: object
        additionalProperties: false
        required: [namespace]
        properties:
          namespace: { type: string, maxLength: 253 }
      access_mode: { type: string, enum: [restricted, anonymous] }
      require_post_quantum: { type: boolean }
      ip: { type: array, maxItems: 32, items: { type: string, maxLength: 64 } }
      limits:
        $ref: "../../../../control/public/v1/openapi.yaml#/components/schemas/PublisherApplicationLimits"
  AcceptedPublication:
    type: object
    additionalProperties: false
    required: [registration, public_url_id, hostname, public_url]
    properties:
      registration: { $ref: "../openapi.yaml#/components/schemas/Registration" }
      public_url_id: { type: string, maxLength: 128 }
      hostname: { type: string, maxLength: 253 }
      public_url: { type: string, maxLength: 4096 }
