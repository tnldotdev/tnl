schemas:
  SuppliedServiceCertificateMaterial:
    type: object
    additionalProperties: false
    required: [certificate_pem, private_key_pem]
    properties:
      certificate_pem: { type: string, minLength: 1, maxLength: 131072 }
      private_key_pem: { type: string, minLength: 1, maxLength: 16384 }
  Registration:
    type: object
    additionalProperties: false
    required: [version, registration_id, owner]
    properties:
      version: { type: integer, enum: [1] }
      registration_id: { type: string, maxLength: 128, x-go-name: RegistrationID }
      owner: { type: string, pattern: "^[a-f0-9]{32}$" }
      target: { type: string, maxLength: 4096, x-go-type-skip-optional-pointer: true }
      certificate:
        $ref: "../openapi.yaml#/components/schemas/SuppliedServiceCertificateMaterial"
        description: Private replacement material; accepted only on renewal of an invocation that selected supplied certificates at registration.
      shutdown_deadline:
        type: string
        format: date-time
        description: Original caller shutdown deadline. Valid only for unregister; the native owner may shorten it but never grants more than ten seconds.
  Lease:
    type: object
    additionalProperties: false
    required: [service, owner, pid, configuration_digest]
    properties:
      service: { type: string, maxLength: 63 }
      telemetry_disabled: { type: boolean, x-go-type-skip-optional-pointer: true }
      owner: { type: string, pattern: "^[a-f0-9]{32}$" }
      pid: { type: integer, minimum: 1 }
      configuration_digest:
        type: string
        pattern: "^[a-f0-9]{64}$"
        description: Digest of the complete selected native project snapshot, including configuration provenance and resolved server/team selection. The owner rejects another snapshot before reserving a service.
  Invocation:
    type: object
    additionalProperties: false
    required: [version, invocation_id, owner, pid, target]
    properties:
      version: { type: integer, enum: [1] }
      invocation_id: { type: string, maxLength: 128 }
      telemetry_disabled: { type: boolean, x-go-type-skip-optional-pointer: true }
      owner: { type: string, pattern: "^[a-f0-9]{32}$" }
      pid: { type: integer, minimum: 1 }
      target: { type: string, maxLength: 4096 }
      certificate:
        $ref: "../openapi.yaml#/components/schemas/SuppliedServiceCertificateMaterial"
      server_url: { type: string, maxLength: 4096 }
      deployment:
        type: object
        additionalProperties: false
        required: [project, name, credential]
        properties:
          project: { type: string, minLength: 3, maxLength: 256 }
          name: { type: string, minLength: 1, maxLength: 128 }
          service:
            { type: string, minLength: 1, maxLength: 32, x-go-type-skip-optional-pointer: true }
          credential: { type: string, minLength: 1, maxLength: 32768 }
        description: Private captured selection. Omit service for a temporary service; named publication retains saved visitor policy and limits.
      publisher_identity_id: { type: string, maxLength: 128, x-go-type-skip-optional-pointer: true }
      publisher_credential_file:
        { type: string, maxLength: 4096, x-go-type-skip-optional-pointer: true }
      access_mode: { type: string, enum: [restricted, anonymous] }
      public:
        type: boolean
        description: Defaults to true for a temporary service. False enables connector access only. Omit for a saved named binding.
      require_post_quantum: { type: boolean }
      ip: { type: array, maxItems: 32, items: { type: string, maxLength: 64 } }
      limits:
        $ref: "../../../../control/public/v1/openapi.yaml#/components/schemas/ProjectHTTPApplicationLimits"
