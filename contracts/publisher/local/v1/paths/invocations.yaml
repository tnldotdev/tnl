paths:
  /v1/leases:
    post:
      operationId: acquireLease
      description: Owner only. Acquire one configured non-app service for a CLI invocation. Uses the same publication workers as app registrations.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "../openapi.yaml#/components/schemas/Lease" }
      responses:
        default: { $ref: "../openapi.yaml#/components/responses/Problem" }
        "200":
          description: lease registration
          content:
            application/json:
              schema: { $ref: "../openapi.yaml#/components/schemas/Registration" }
  /v1/publications/certificate:
    post:
      operationId: exportInvocationCertificate
      description: Exact invocation capability and current registration owner only. Export the installed certificate and private key without requesting issuance or renewing the registration. Never cache the response.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "../openapi.yaml#/components/schemas/Registration" }
      responses:
        default: { $ref: "../openapi.yaml#/components/responses/Problem" }
        "200":
          description: installed certificate and matching private key
          content:
            application/json:
              schema: { $ref: "../openapi.yaml#/components/schemas/InstalledServiceCertificate" }
  /v1/publications/register:
    post:
      operationId: registerInvocation
      description: Invocation capability only. Publish a bound HTTP listener using either a captured deployment credential or a local namespace publisher. A deployment service selects its saved URL and limits; omitting it allocates a temporary URL. Registration acknowledges the target before asynchronous provisioning. Renewal and unregister share the app registration lifetime. Credentials remain private and never enter snapshots, metadata, or logs.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "../openapi.yaml#/components/schemas/Invocation" }
      responses:
        default: { $ref: "../openapi.yaml#/components/responses/Problem" }
        "200":
          description: invocation registration
          content:
            application/json:
              schema: { $ref: "../openapi.yaml#/components/schemas/Registration" }
