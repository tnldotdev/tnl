schemas:
  ServiceRecoveryObservationRequest:
    unevaluatedProperties: false
    allOf:
      - $ref: "../openapi.yaml#/components/schemas/IngressLeaseIdentity"
      - type: object
        required: [service_id, service_run_id, run_number, visitor_connection_id, observed_at]
        properties:
          service_id:
            $ref: "../openapi.yaml#/components/schemas/ServiceID"
          service_run_id:
            $ref: "../openapi.yaml#/components/schemas/ServiceRunID"
          visitor_connection_id:
            $ref: "../openapi.yaml#/components/schemas/VisitorConnectionID"
          run_number:
            type: integer
            format: int64
            minimum: 1
          observed_at:
            type: string
            format: date-time
          source_evidence:
            type: string
            format: byte
            maxLength: 2048
            x-go-type-skip-optional-pointer: true
            description: Exact ingress-created PROXY v2 header with its signed source proof, required for HTTP and absent for native certificate admission. Contains no application bytes. Evidence authenticates the original visitor and socket facts; it grants no access or renewal.
  ServiceRecoveryObservation:
    type: object
    additionalProperties: false
    required:
      [
        recovery_episode_id,
        service_id,
        service_run_id,
        run_number,
        opened_at,
        observed_at,
        observed_seconds,
      ]
    properties:
      recovery_episode_id:
        type: integer
        format: int64
        minimum: 1
      service_id:
        $ref: "../openapi.yaml#/components/schemas/ServiceID"
      service_run_id:
        $ref: "../openapi.yaml#/components/schemas/ServiceRunID"
      run_number:
        type: integer
        format: int64
        minimum: 1
      opened_at:
        type: string
        format: date-time
      observed_at:
        type: string
        format: date-time
      observed_seconds:
        type: number
        format: double
        minimum: 0
