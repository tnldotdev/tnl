securitySchemes:
  clusterAuth:
    type: http
    scheme: bearer
    bearerFormat: tnl cluster secret
parameters:
  IngressID:
    name: ingress_id
    in: path
    required: true
    schema:
      $ref: "../openapi.yaml#/components/schemas/Identifier"
  IngressRunID:
    name: ingress_run_id
    in: query
    required: true
    schema:
      $ref: "../openapi.yaml#/components/schemas/Identifier"
  IngressLeaseRevision:
    name: ingress_lease_revision
    in: query
    required: true
    schema:
      type: integer
      format: int64
      minimum: 1
responses:
  Problem:
    description: Request failed
    content:
      application/problem+json:
        schema:
          $ref: "../openapi.yaml#/components/schemas/Problem"
schemas:
  Identifier:
    type: string
    minLength: 1
    maxLength: 256
    pattern: '^\S(?:.*\S)?$'
  ProblemCode:
    type: string
    enum:
      - invalid_request
      - invalid_json
      - unsupported_media_type
      - unauthenticated
      - not_found
      - internal
      - ingress_already_running
      - ingress_lease_stale
      - recovery_episode_stale
  Problem:
    type: object
    additionalProperties: false
    required: [type, title, status, code, detail, request_id]
    properties:
      type:
        type: string
        format: uri
      title:
        type: string
      status:
        type: integer
        minimum: 400
        maximum: 599
      code:
        $ref: "../openapi.yaml#/components/schemas/ProblemCode"
      detail:
        type: string
        minLength: 1
      request_id:
        type: string
        minLength: 1
      retry_at:
        type: string
        format: date-time
      details:
        type: object
        additionalProperties: true
