schemas:
  IngressRegistration:
    type: object
    additionalProperties: false
    required:
      [
        ingress_id,
        region,
        ingress_run_id,
        protocol_version,
        connection_capacity,
        ingress_pool_id,
        https,
        service_ports,
      ]
    properties:
      region:
        $ref: "../../../../public/v1/schemas/common.yaml#/schemas/RegionID"
      ingress_pool_id:
        $ref: "../openapi.yaml#/components/schemas/Identifier"
      https:
        type: boolean
        description: This process serves the shared HTTPS listener on public port 443, independently of allocated non-HTTP service ports.
      service_ports:
        type: array
        maxItems: 256
        uniqueItems: true
        description: Sorted allocated non-HTTP ports bound before registration or exposed by the trusted destination-metadata proxy. Shared HTTPS 443 is advertised separately.
        items:
          type: integer
          minimum: 1024
          maximum: 65535
      ingress_id:
        $ref: "../openapi.yaml#/components/schemas/Identifier"
      ingress_run_id:
        $ref: "../openapi.yaml#/components/schemas/Identifier"
      protocol_version:
        type: integer
        format: int64
        minimum: 1
      connection_capacity:
        type: integer
        format: int64
        minimum: 1
  IngressLeaseIdentity:
    type: object
    additionalProperties: false
    required: [ingress_id, ingress_run_id, ingress_lease_revision]
    properties:
      ingress_id:
        $ref: "../openapi.yaml#/components/schemas/Identifier"
      ingress_run_id:
        $ref: "../openapi.yaml#/components/schemas/Identifier"
      ingress_lease_revision:
        type: integer
        format: int64
        minimum: 1
  IngressRenewal:
    unevaluatedProperties: false
    allOf:
      - $ref: "../openapi.yaml#/components/schemas/IngressLeaseIdentity"
      - type: object
        required: [reported_connections, routing_table_revision]
        properties:
          reported_connections:
            type: integer
            format: int64
            minimum: 0
          routing_table_revision:
            type: integer
            format: int64
            minimum: 0
          prepared_public_runs:
            type: array
            maxItems: 1000
            description: Installed routing and policy, bounded by their current deadlines; never a promise to install the response.
            items:
              $ref: "../openapi.yaml#/components/schemas/IngressPublicRunObservation"
  IngressPublicRunObservation:
    type: object
    additionalProperties: false
    required: [publish_run_id, publish_run_number, entry_revision, valid_until]
    properties:
      publish_run_id:
        $ref: "../openapi.yaml#/components/schemas/Identifier"
      publish_run_number:
        type: integer
        format: int64
        minimum: 1
      entry_revision:
        type: integer
        format: int64
        minimum: 1
      valid_until:
        type: string
        format: date-time
  IngressDrainRequest:
    unevaluatedProperties: false
    allOf:
      - $ref: "../openapi.yaml#/components/schemas/IngressLeaseIdentity"
      - type: object
        required: [deadline]
        properties:
          deadline:
            type: string
            format: date-time
  IngressLease:
    type: object
    additionalProperties: false
    required:
      - ingress_id
      - ingress_run_id
      - ingress_lease_revision
      - region
      - protocol_version
      - connection_capacity
      - reported_connections
      - routing_table_revision
      - draining
      - registered_at
      - renewed_at
      - lease_expires_at
    properties:
      region:
        $ref: "../../../../public/v1/schemas/common.yaml#/schemas/RegionID"
      ingress_id:
        $ref: "../openapi.yaml#/components/schemas/Identifier"
      ingress_run_id:
        $ref: "../openapi.yaml#/components/schemas/Identifier"
      ingress_lease_revision:
        type: integer
        format: int64
        minimum: 1
      protocol_version:
        type: integer
        format: int64
        minimum: 1
      connection_capacity:
        type: integer
        format: int64
        minimum: 1
      reported_connections:
        type: integer
        format: int64
        minimum: 0
      routing_table_revision:
        type: integer
        format: int64
        minimum: 0
      draining:
        type: boolean
      drain_deadline:
        type: string
        format: date-time
      registered_at:
        type: string
        format: date-time
      renewed_at:
        type: string
        format: date-time
      lease_expires_at:
        type: string
        format: date-time
  IngressTrafficLimits:
    $ref: "../../../../public/v1/openapi.yaml#/components/schemas/TrafficLimits"
