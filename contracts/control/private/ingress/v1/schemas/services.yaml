schemas:
  IngressServices:
    type: object
    additionalProperties: false
    required: [observed_at, valid_until, runs]
    properties:
      observed_at: { type: string, format: date-time }
      valid_until: { type: string, format: date-time }
      runs:
        type: array
        items: { $ref: "../openapi.yaml#/components/schemas/IngressServiceRun" }
  IngressServiceRun:
    type: object
    additionalProperties: false
    required:
      [
        service_id,
        service_run_id,
        run_number,
        protocol,
        hostname,
        port,
        endpoint_revision,
        valid_until,
        anonymous,
        traffic,
        connected_relays,
        source_authority,
        source_key,
      ]
    properties:
      service_id: { $ref: "../openapi.yaml#/components/schemas/ServiceID" }
      service_run_id: { $ref: "../openapi.yaml#/components/schemas/ServiceRunID" }
      run_number: { type: integer, format: int64, minimum: 1 }
      protocol:
        $ref: "../../../../public/v1/schemas/services.yaml#/schemas/ServiceProtocol"
      hostname: { type: string, minLength: 1, maxLength: 253 }
      run_hostname:
        type: string
        minLength: 1
        maxLength: 253
        description: An approved HTTP hostname selecting only this exact service run. Unavailable runs never fall back to the canonical pool.
      alias_dns_until:
        type: string
        format: date-time
        description: Shorter expiry for a run hostname backed by wildcard DNS. Does not apply to the canonical hostname.
      port: { type: integer, minimum: 1, maximum: 65535 }
      endpoint_revision: { type: integer, format: int64, minimum: 1 }
      valid_until: { type: string, format: date-time }
      anonymous: { type: boolean }
      recovery_episode_id: { type: integer, format: int64, minimum: 1 }
      ip:
        $ref: "../../../../public/v1/schemas/visitor-policy.yaml#/schemas/VisitorPolicyIP"
      traffic: { $ref: "../openapi.yaml#/components/schemas/IngressTrafficLimits" }
      connected_relays:
        type: array
        minItems: 1
        maxItems: 2
        items: { $ref: "../openapi.yaml#/components/schemas/ServiceRelay" }
      source_authority: { type: string, format: byte, minLength: 1, maxLength: 1368 }
      source_key: { type: string, format: byte, minLength: 44, maxLength: 44 }
