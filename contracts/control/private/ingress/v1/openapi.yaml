openapi: 3.1.0
info:
  title: tnl ingress API
  version: 1.0.0
  license:
    name: BSD-3-Clause
    identifier: BSD-3-Clause
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
servers:
  - url: https://ingress-control.internal
security:
  - ingressControlAuth: []
paths:
  /internal/v1/ingress-pools/{pool_id}/ports:
    $ref: "./paths/leases.yaml#/paths/~1internal~1v1~1ingress-pools~1{pool_id}~1ports"
  /internal/v1/ingresses/{ingress_id}/services:
    $ref: "./paths/services.yaml#/paths/~1internal~1v1~1ingresses~1{ingress_id}~1services"
  /internal/v1/ingresses/{ingress_id}/public-services/admit:
    $ref: "./paths/public-services.yaml#/paths/~1internal~1v1~1ingresses~1{ingress_id}~1public-services~1admit"
  /internal/v1/ingresses/{ingress_id}/public-services/status:
    $ref: "./paths/public-services.yaml#/paths/~1internal~1v1~1ingresses~1{ingress_id}~1public-services~1status"
  /internal/v1/ingresses/{ingress_id}/public-services/promote:
    $ref: "./paths/public-services.yaml#/paths/~1internal~1v1~1ingresses~1{ingress_id}~1public-services~1promote"
  /internal/v1/ingresses/{ingress_id}/public-services/close:
    $ref: "./paths/public-services.yaml#/paths/~1internal~1v1~1ingresses~1{ingress_id}~1public-services~1close"
  /internal/v1/ingresses/{ingress_id}/public-services/closed-runs:
    $ref: "./paths/public-services.yaml#/paths/~1internal~1v1~1ingresses~1{ingress_id}~1public-services~1closed-runs"
  /internal/v1/ingresses/{ingress_id}/service-observations:
    $ref: "./paths/reporting.yaml#/paths/~1internal~1v1~1ingresses~1{ingress_id}~1service-observations"
  /internal/v1/ingresses/register:
    $ref: "./paths/leases.yaml#/paths/~1internal~1v1~1ingresses~1register"
  /internal/v1/ingresses/{ingress_id}/renew:
    $ref: "./paths/leases.yaml#/paths/~1internal~1v1~1ingresses~1{ingress_id}~1renew"
  /internal/v1/ingresses/{ingress_id}/drain:
    $ref: "./paths/leases.yaml#/paths/~1internal~1v1~1ingresses~1{ingress_id}~1drain"
  /internal/v1/ingresses/{ingress_id}/service-recovery/{recovery_episode_id}/observed:
    $ref: "./paths/reporting.yaml#/paths/~1internal~1v1~1ingresses~1{ingress_id}~1service-recovery~1{recovery_episode_id}~1observed"
components:
  securitySchemes:
    ingressControlAuth:
      $ref: "./schemas/common.yaml#/securitySchemes/ingressControlAuth"
  parameters:
    IngressID:
      $ref: "./schemas/common.yaml#/parameters/IngressID"
    IngressRunID:
      $ref: "./schemas/common.yaml#/parameters/IngressRunID"
    IngressLeaseRevision:
      $ref: "./schemas/common.yaml#/parameters/IngressLeaseRevision"
  responses:
    Problem:
      $ref: "./schemas/common.yaml#/responses/Problem"
  schemas:
    IngressServices:
      $ref: "./schemas/services.yaml#/schemas/IngressServices"
    IngressServiceRun:
      $ref: "./schemas/services.yaml#/schemas/IngressServiceRun"
    ServiceID:
      $ref: "./schemas/public-services.yaml#/schemas/ServiceID"
    ServiceRunID:
      $ref: "./schemas/public-services.yaml#/schemas/ServiceRunID"
    VisitorConnectionID:
      $ref: "./schemas/public-services.yaml#/schemas/VisitorConnectionID"
    PublicServiceVisitorClaim:
      $ref: "./schemas/public-services.yaml#/schemas/PublicServiceVisitorClaim"
    PublicServiceVisitorLookup:
      $ref: "./schemas/public-services.yaml#/schemas/PublicServiceVisitorLookup"
    PublicServiceVisitorAdmission:
      $ref: "./schemas/public-services.yaml#/schemas/PublicServiceVisitorAdmission"
    PublicServiceVisitorStatus:
      $ref: "./schemas/public-services.yaml#/schemas/PublicServiceVisitorStatus"
    ServiceRunReference:
      $ref: "./schemas/public-services.yaml#/schemas/ServiceRunReference"
    ServiceRunCursor:
      $ref: "./schemas/public-services.yaml#/schemas/ServiceRunCursor"
    ServiceRunClosureLookup:
      $ref: "./schemas/public-services.yaml#/schemas/ServiceRunClosureLookup"
    ServiceRunClosures:
      $ref: "./schemas/public-services.yaml#/schemas/ServiceRunClosures"
    ServiceRelay:
      $ref: "./schemas/public-services.yaml#/schemas/ServiceRelay"
    Identifier:
      $ref: "./schemas/common.yaml#/schemas/Identifier"
    IngressRegistration:
      $ref: "./schemas/leases.yaml#/schemas/IngressRegistration"
    ServicePortRange:
      $ref: "./schemas/leases.yaml#/schemas/ServicePortRange"
    IngressLeaseIdentity:
      $ref: "./schemas/leases.yaml#/schemas/IngressLeaseIdentity"
    IngressRenewal:
      $ref: "./schemas/leases.yaml#/schemas/IngressRenewal"
    IngressDrainRequest:
      $ref: "./schemas/leases.yaml#/schemas/IngressDrainRequest"
    IngressLease:
      $ref: "./schemas/leases.yaml#/schemas/IngressLease"
    IngressTrafficLimits:
      $ref: "./schemas/leases.yaml#/schemas/IngressTrafficLimits"
    ServiceRecoveryObservationRequest:
      $ref: "./schemas/reporting.yaml#/schemas/ServiceRecoveryObservationRequest"
    ServiceRecoveryObservation:
      $ref: "./schemas/reporting.yaml#/schemas/ServiceRecoveryObservation"
    ProblemCode:
      $ref: "./schemas/common.yaml#/schemas/ProblemCode"
    Problem:
      $ref: "./schemas/common.yaml#/schemas/Problem"
