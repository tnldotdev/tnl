schemas:
  MachineTrust:
    type: object
    additionalProperties: false
    required: [provider, issuer, jwks_url, audience, claims]
    description: Manager-approved OIDC provider policy. Provider modes retain their signed execution identity; generic oidc requires an exact sub. GitHub pins repository and owner IDs, repository, workflow_ref and ref, with an explicit event allowlist. Kubernetes pins sub and service_account_uid. Google pins the immutable numeric sub. GitLab pins job project and namespace IDs and paths, ref_path and pipeline_source. Vercel and Fly pin their stable project or application and owner IDs.
    if:
      properties:
        provider: { const: github }
    then: { required: [events] }
    else:
      not: { required: [events] }
    properties:
      provider:
        type: string
        enum: [github, vercel, fly, google, kubernetes, gitlab, oidc]
        x-enum-varnames:
          [
            MachineTrustGitHub,
            MachineTrustVercel,
            MachineTrustFly,
            MachineTrustGoogle,
            MachineTrustKubernetes,
            MachineTrustGitLab,
            MachineTrustOIDC,
          ]
      issuer: { type: string, maxLength: 2048 }
      jwks_url: { type: string, maxLength: 2048 }
      audience: { type: string, maxLength: 1024 }
      claims: { type: object, maxProperties: 32, additionalProperties: { type: string } }
      events:
        type: array
        minItems: 1
        maxItems: 10
        uniqueItems: true
        items: { type: string }
        description: Required only for GitHub. Exact allowed workflow events; all other provider modes reject this field.
  RegisterMachineRequest:
    type: object
    additionalProperties: false
    required: [name, proof_kind]
    properties:
      name: { type: string, minLength: 1, maxLength: 128 }
      proof_kind: { type: string, enum: [oidc, signing_key] }
      trust: { $ref: "../openapi.yaml#/components/schemas/MachineTrust" }
      key_id: { type: string, maxLength: 128 }
      public_key: { type: string, description: Unpadded base64url Ed25519 public key. }
  MachineIdentity:
    type: object
    additionalProperties: false
    required: [id, team_id, name, proof_kind, revision]
    properties:
      id: { type: string }
      team_id: { type: string }
      name: { type: string }
      proof_kind: { type: string, enum: [oidc, signing_key] }
      revision: { type: integer, format: int64 }
      trust: { $ref: "../openapi.yaml#/components/schemas/MachineTrust" }
  MachineKey:
    type: object
    additionalProperties: false
    required: [key_id, public_key]
    properties:
      key_id: { type: string, minLength: 1, maxLength: 128 }
      public_key: { type: string }
  ProvisioningOperation:
    type: string
    enum: [create, read, update, enroll, revoke_member, retire]
    x-enum-varnames:
      [
        ProvisioningCreate,
        ProvisioningRead,
        ProvisioningUpdate,
        ProvisioningEnroll,
        ProvisioningRevokeMember,
        ProvisioningRetire,
      ]
  ProvisioningGrantRequest:
    type: object
    additionalProperties: false
    required:
      [
        project_key,
        scope,
        services,
        operations,
        max_enrollment_members,
        max_enrollment_seconds,
        enrollment_budget,
        expires_at,
      ]
    properties:
      project_key: { type: string }
      scope: { $ref: "../openapi.yaml#/components/schemas/EnvironmentPermissionScope" }
      services:
        { type: array, minItems: 1, maxItems: 128, uniqueItems: true, items: { type: string } }
      operations:
        {
          type: array,
          minItems: 1,
          maxItems: 6,
          uniqueItems: true,
          items: { $ref: "../openapi.yaml#/components/schemas/ProvisioningOperation" },
        }
      max_enrollment_members: { type: integer, minimum: 0, maximum: 256 }
      max_enrollment_seconds: { type: integer, minimum: 0, maximum: 86400 }
      enrollment_budget: { type: integer, minimum: 0, maximum: 65536 }
      expires_at: { type: string, format: date-time }
  MachinePermissionResult:
    type: object
    additionalProperties: false
    required: [id]
    properties:
      id: { type: string }
  EnvironmentPermissionScope:
    type: object
    additionalProperties: false
    description: Select exact environment IDs or one saved collection. A collection scope requires an explicit choice about future members. When false, the initial members are captured once; current membership is still required on every use. Services are a separate fixed allowlist and never grow with a definition.
    dependentRequired:
      collection_id: [include_future_environments]
      include_future_environments: [collection_id]
    if: { required: [environment_ids] }
    then:
      not:
        anyOf:
          - required: [collection_id]
          - required: [include_future_environments]
    else: { required: [collection_id, include_future_environments] }
    properties:
      environment_ids:
        { type: array, minItems: 1, maxItems: 1024, uniqueItems: true, items: { type: string } }
      collection_id: { type: string }
      include_future_environments: { type: boolean }
  EnvironmentVisitorPermissionRequest:
    type: object
    additionalProperties: false
    required: [project_key, scope, services, max_duration_seconds, expires_at]
    properties:
      project_key: { type: string }
      scope: { $ref: "../openapi.yaml#/components/schemas/EnvironmentPermissionScope" }
      services:
        { type: array, minItems: 1, maxItems: 128, uniqueItems: true, items: { type: string } }
      max_duration_seconds:
        {
          type: integer,
          minimum: 0,
          maximum: 31557600,
          description: Zero omits the hard session deadline; otherwise the deadline is fixed at initial admission.,
        }
      expires_at: { type: string, format: date-time }
  ProvisioningExchange:
    type: object
    additionalProperties: false
    required: [grant_id, operation, assertion]
    properties:
      machine_id:
        {
          type: string,
          x-go-type-skip-optional-pointer: true,
          description: Optional identity assertion; the grant selects the saved machine identity.,
        }
      grant_id: { type: string }
      operation: { $ref: "../openapi.yaml#/components/schemas/ProvisioningOperation" }
      assertion:
        type: string
        minLength: 1
        maxLength: 32768
        description: Current OIDC assertions may be reused across exchanges; each exchange verifies current trust and grant. Registered-key JWTs require a fresh jti, exact exchange audience and machineproof.Provisioning grant_id scope for this grant and operation.
  ProvisioningSession:
    type: object
    additionalProperties: false
    required:
      [
        access_token,
        token_type,
        expires_at,
        grant_id,
        operation,
        team_id,
        project_key,
        scope,
        services,
      ]
    properties:
      access_token:
        {
          type: string,
          description: Opaque provisioning-only token. Not a human session or visitor credential.,
        }
      token_type: { type: string, enum: [Bearer] }
      expires_at:
        {
          type: string,
          format: date-time,
          description: Capped at five minutes and at proof and grant expiry.,
        }
      grant_id: { type: string }
      operation: { $ref: "../openapi.yaml#/components/schemas/ProvisioningOperation" }
      team_id: { type: string }
      project_key: { type: string }
      scope: { $ref: "../openapi.yaml#/components/schemas/EnvironmentPermissionScope" }
      services: { type: array, minItems: 1, maxItems: 128, items: { type: string } }
