schemas:
  DomainID:
    $ref: "../openapi.yaml#/components/schemas/ResourceID"
  CanonicalHostname:
    type: string
    minLength: 1
    maxLength: 253
    pattern: "^[a-z0-9](?:[a-z0-9.-]*[a-z0-9])?$"
  DomainKind:
    type: string
    enum: [managed, custom]
  DomainState:
    type: string
    enum: [pending, ready, releasing, released, failed]
  DomainReleaseBlocker:
    type: string
    enum:
      - deployments
      - services
      - endpoint_dns
      - challenge_cleanup
      - issuance
      - uncertain_issuance
      - certificate
      - dns_authority
  DomainRelease:
    type: object
    additionalProperties: false
    description: Current owner observations, not a release estimate. DNS authority release must be confirmed even after other blockers clear. Facts may change after observed_at.
    required: [observed_at, blockers, completion_unknown]
    properties:
      observed_at:
        type: string
        format: date-time
      blockers:
        type: array
        uniqueItems: true
        maxItems: 8
        items:
          $ref: "../openapi.yaml#/components/schemas/DomainReleaseBlocker"
      certificate_expires_at:
        type: string
        format: date-time
        description: Latest actual retained certificate expiry, including expired evidence. This is not the release completion time; unresolved work can block release beyond this date.
      completion_unknown:
        type: boolean
        description: True until the DNS authority owner has durably confirmed final release. No universal quarantine duration or completion date is promised.
      released_at:
        type: string
        format: date-time
        description: Present only after the DNS authority owner confirms final release.
  DNSRecord:
    type: object
    additionalProperties: false
    required: [name, type, value]
    properties:
      name:
        type: string
        minLength: 1
        maxLength: 253
        pattern: "^[a-z0-9_](?:[a-z0-9_.-]*[a-z0-9])?$"
      type:
        type: string
        enum: [NS, TXT, CNAME, A, AAAA]
      value:
        type: string
  Domain:
    type: object
    additionalProperties: false
    required:
      [
        id,
        kind,
        canonical_domain,
        state,
        authority_revision,
        required_records,
        created_at,
        updated_at,
      ]
    properties:
      id:
        $ref: "../openapi.yaml#/components/schemas/DomainID"
      kind:
        $ref: "../openapi.yaml#/components/schemas/DomainKind"
      team_id:
        $ref: "../openapi.yaml#/components/schemas/TeamID"
      canonical_domain:
        $ref: "../openapi.yaml#/components/schemas/CanonicalHostname"
      state:
        $ref: "../openapi.yaml#/components/schemas/DomainState"
      authority_revision:
        {
          type: string,
          pattern: "^[0-9]+$",
          x-go-type: int64,
          x-oapi-codegen-extra-tags: { json: "authority_revision,string" },
        }
      required_records:
        type: array
        items:
          $ref: "../openapi.yaml#/components/schemas/DNSRecord"
      claim_stage:
        type: string
        enum: [checking_nameservers, waiting_for_ownership, preparing_zone, waiting_for_delegation]
      claim_expires_at:
        type: string
        format: date-time
      delegation_target:
        type: string
        description: Where to set the delegation, either the parent DNS name or `registrar` for a registered domain.
      verified_at:
        type: string
        format: date-time
      created_at:
        type: string
        format: date-time
      updated_at:
        type: string
        format: date-time
      release:
        $ref: "../openapi.yaml#/components/schemas/DomainRelease"
  DomainPage:
    type: object
    additionalProperties: false
    required: [domains]
    properties:
      domains:
        type: array
        items:
          $ref: "../openapi.yaml#/components/schemas/Domain"
      next_cursor:
        $ref: "../openapi.yaml#/components/schemas/DomainID"
  ClaimDomainRequest:
    type: object
    additionalProperties: false
    required: [domain]
    properties:
      domain:
        $ref: "../openapi.yaml#/components/schemas/CanonicalHostname"
      make_default:
        type: boolean
        default: false
