paths:
  /v1/teams/{team_id}/domains:
    get:
      operationId: listTeamDomains
      summary: List domains available to the team
      security:
        - bearerAuth: []
      parameters:
        - $ref: "../openapi.yaml#/components/parameters/TeamID"
      responses:
        "200":
          description: Domain page
          content:
            application/json:
              schema:
                $ref: "../openapi.yaml#/components/schemas/DomainPage"
        default:
          $ref: "../openapi.yaml#/components/responses/Problem"
    post:
      operationId: claimTeamDomain
      summary: Begin claiming one domain
      security:
        - bearerAuth: []
      parameters:
        - $ref: "../openapi.yaml#/components/parameters/TeamID"
        - $ref: "../openapi.yaml#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/ClaimDomainRequest"
      responses:
        "201":
          description: Domain claim
          content:
            application/json:
              schema:
                $ref: "../openapi.yaml#/components/schemas/Domain"
        default:
          $ref: "../openapi.yaml#/components/responses/Problem"
  /v1/teams/{team_id}/domains/{domain_id}/default:
    post:
      operationId: setTeamDefaultDomain
      summary: Select a ready default domain
      security:
        - bearerAuth: []
      parameters:
        - $ref: "../openapi.yaml#/components/parameters/TeamID"
        - $ref: "../openapi.yaml#/components/parameters/DomainID"
      responses:
        "200":
          description: Updated team
          content:
            application/json:
              schema:
                $ref: "../openapi.yaml#/components/schemas/Team"
        default:
          $ref: "../openapi.yaml#/components/responses/Problem"
  /v1/teams/{team_id}/domains/{domain_id}:
    get:
      operationId: getTeamDomain
      summary: Read one team domain and its current release observations
      description: Requires current team access. Includes a released custom domain's final owner confirmation without making it available for domain selection. A missing domain is not proof of completed release.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "../openapi.yaml#/components/parameters/TeamID"
        - $ref: "../openapi.yaml#/components/parameters/DomainID"
      responses:
        "200":
          description: Current domain and owner observations
          content:
            application/json:
              schema:
                $ref: "../openapi.yaml#/components/schemas/Domain"
        default:
          $ref: "../openapi.yaml#/components/responses/Problem"
    delete:
      operationId: releaseTeamDomain
      summary: Begin releasing one custom domain
      security:
        - bearerAuth: []
      parameters:
        - $ref: "../openapi.yaml#/components/parameters/TeamID"
        - $ref: "../openapi.yaml#/components/parameters/DomainID"
      responses:
        "204":
          description: Domain release requested, not completed. Read the domain by its exact ID for blockers and final owner confirmation. The default domain must be switched first.
        default:
          $ref: "../openapi.yaml#/components/responses/Problem"
