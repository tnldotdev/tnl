paths:
  /v1/teams/{team_id}/machine-identities:
    post:
      operationId: registerMachineIdentity
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "../openapi.yaml#/components/parameters/TeamID" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "../openapi.yaml#/components/schemas/RegisterMachineRequest" }
      responses:
        "201":
          description: Manager-approved machine identity, without any implicit provisioning or visitor rights.
          content:
            application/json:
              schema: { $ref: "../openapi.yaml#/components/schemas/MachineIdentity" }
        default: { $ref: "../openapi.yaml#/components/responses/Problem" }
  /v1/teams/{team_id}/machine-identities/{machine_id}:
    delete:
      operationId: revokeMachineIdentity
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: "../openapi.yaml#/components/parameters/TeamID" }
        - { name: machine_id, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: Machine identity revoked. }
        default: { $ref: "../openapi.yaml#/components/responses/Problem" }
  /v1/teams/{team_id}/machine-identities/{machine_id}/keys:
    post:
      operationId: rotateMachineIdentityKey
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: "../openapi.yaml#/components/parameters/TeamID" }
        - { name: machine_id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "../openapi.yaml#/components/schemas/MachineKey" }
      responses:
        "204": { description: Old keys and sessions invalidated; replacement key registered. }
        default: { $ref: "../openapi.yaml#/components/responses/Problem" }
  /v1/teams/{team_id}/machine-identities/{machine_id}/provisioning-grants:
    post:
      operationId: createProvisioningGrant
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: "../openapi.yaml#/components/parameters/TeamID" }
        - { name: machine_id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "../openapi.yaml#/components/schemas/ProvisioningGrantRequest" }
      responses:
        "201":
          description: Scoped provisioning grant.
          content:
            application/json:
              schema: { $ref: "../openapi.yaml#/components/schemas/MachinePermissionResult" }
        default: { $ref: "../openapi.yaml#/components/responses/Problem" }
  /v1/teams/{team_id}/provisioning-grants/{grant_id}:
    delete:
      operationId: revokeProvisioningGrant
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: "../openapi.yaml#/components/parameters/TeamID" }
        - { name: grant_id, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: Grant and dependent provisioning sessions revoked. }
        default: { $ref: "../openapi.yaml#/components/responses/Problem" }
  /v1/teams/{team_id}/machine-identities/{machine_id}/environment-visitor-permissions:
    post:
      operationId: createEnvironmentVisitorPermission
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: "../openapi.yaml#/components/parameters/TeamID" }
        - { name: machine_id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              { $ref: "../openapi.yaml#/components/schemas/EnvironmentVisitorPermissionRequest" }
      responses:
        "201":
          description: Separate environment visitor permission; grants no provisioning authority.
          content:
            application/json:
              schema: { $ref: "../openapi.yaml#/components/schemas/MachinePermissionResult" }
        default: { $ref: "../openapi.yaml#/components/responses/Problem" }
  /v1/teams/{team_id}/environment-visitor-permissions/{permission_id}:
    delete:
      operationId: revokeEnvironmentVisitorPermission
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: "../openapi.yaml#/components/parameters/TeamID" }
        - { name: permission_id, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: Environment visitor permission revoked. }
        default: { $ref: "../openapi.yaml#/components/responses/Problem" }
  /v1/provisioning-sessions/exchange:
    post:
      operationId: exchangeProvisioning
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "../openapi.yaml#/components/schemas/ProvisioningExchange" }
      responses:
        "200":
          description: Short-lived provisioning-only credential.
          content:
            application/json:
              schema: { $ref: "../openapi.yaml#/components/schemas/ProvisioningSession" }
        default: { $ref: "../openapi.yaml#/components/responses/Problem" }
