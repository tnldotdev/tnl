openapi: 3.1.0
info:
  title: tnl control API
  version: 1.0.0
  description: "Manage services, projects, sharing, and publisher runtimes. Revisions, run numbers, generations, epochs, and event cursors are decimal strings in JSON, including mutation preconditions; their range is 0 through 9223372036854775807, subject to each operation's positive-value rules. Keep these values as strings in JavaScript, or use BigInt for comparison and arithmetic. Ports, bounded counts, and durations remain numbers. Each operation names the credential it accepts; control sessions, publisher tokens, deployment leases, run tokens, guest credentials, and workload credentials are not interchangeable. Some operations authenticate with a signed assertion or credential in the request body instead of Authorization. Use the authority API for sign-in, identities, teams, and domains."
  license:
    name: BSD-3-Clause
    identifier: BSD-3-Clause
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
servers:
  - url: https://control.example.com
tags:
  - name: deployments
    description: Manage isolated deployment bindings and verified target trust.
  - name: discovery
    description: Discover server capabilities, readiness, client addresses, and webhook source policies.
  - name: guest-demos
    description: Create a restricted guest trial and enroll its demo publisher.
  - name: projects
    description: Apply project declarations and resolve source-bound local and saved services.
  - name: services
    description: Manage saved services, their approved protocol, and target TLS trust.
  - name: previews
    description: Deployment services for one project directory and select team visitor access.
  - name: shares
    description: Create and revoke expiring access to an exact service snapshot.
  - name: feedback
    description: Read immutable reports and append ordered replies, source updates, and state changes.
  - name: visitor-access
    description: Manage visitor grants and invitations, then prepare exact-resource visitor tokens.
  - name: browser-access
    description: Sign visitors in and exchange host-bound browser handoffs and sessions through publishers.
  - name: connectors
    description: Enroll visitor devices, select service runs, and prepare signed connector peer pairs.
  - name: workloads
    description: Discover and prepare service access using an existing visitor-only workload credential.
  - name: publisher-identities
    description: Issue enrollments, manage publisher grants, and read the resource selected by a grant.
  - name: deployment-runtime
    description: Manage deployment enrollment and selectors, then lease and acknowledge assignments for one replica.
  - name: publisher-runtime
    description: Inspect and update a signed publisher process lifetime independently of its publications.
  - name: service-runs
    description: Prepare and maintain service publications and deliver connector bindings to their publisher.
  - name: certificates
    description: Issue and acknowledge the approved certificate for an exact service run.
  - name: visitor-policy
    description: Refresh run-scoped visitor policy, revocations, and public verification keys.
  - name: observations
    description: Report bounded connection observations without granting visitor access.
  - name: administration
    description: Inspect server roles and relay leases, drain relays, and set maintenance controls.
  - name: service-audit
    description: Read the team's bounded service access and lifecycle audit history.
