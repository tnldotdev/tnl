schemas:
  FeedbackID:
    $ref: "../openapi.yaml#/components/schemas/ResourceID"
  ReviewSchemaVersion:
    type: integer
    minimum: 1
    description: Review data format version; writers currently emit 1. Separate from revisions and service run numbers.
  FeedbackThreadState:
    type: string
    enum: [open, resolved]
  FeedbackEventType:
    type: string
    enum: [thread.created, reply, update, thread.resolved, thread.reopened]
  FeedbackScope:
    type: object
    additionalProperties: false
    required: [preview_id, service_id, service_run_id, run_number, page_path, service]
    properties:
      preview_id:
        $ref: "../openapi.yaml#/components/schemas/PreviewID"
      service_id:
        $ref: "../openapi.yaml#/components/schemas/ServiceID"
      service_run_id:
        $ref: "../openapi.yaml#/components/schemas/ServiceRunID"
      run_number:
        {
          type: string,
          pattern: "^[0-9]+$",
          x-go-type: int64,
          x-oapi-codegen-extra-tags: { json: "run_number,string" },
        }
      page_path:
        type: string
        minLength: 1
        maxLength: 2048
        pattern: "^/"
      page_title:
        type: string
        maxLength: 256
      service:
        type: string
        minLength: 1
        maxLength: 32
  FeedbackAuthor:
    type: object
    additionalProperties: false
    required: [display_name, verified]
    properties:
      identity_id:
        $ref: "../openapi.yaml#/components/schemas/IdentityID"
      display_name:
        type: string
        minLength: 1
        maxLength: 256
      verified:
        type: boolean
  FeedbackReport:
    type: object
    additionalProperties: false
    required: [text, created_at]
    properties:
      text:
        type: string
        minLength: 1
        maxLength: 4000
      author:
        $ref: "../openapi.yaml#/components/schemas/FeedbackAuthor"
      created_at:
        type: string
        format: date-time
  FeedbackTextBoundary:
    type: object
    additionalProperties: false
    required: [selectors, text_node, offset]
    properties:
      selectors:
        $ref: "../openapi.yaml#/components/schemas/FeedbackSelectors"
      text_node:
        type: integer
        minimum: 0
        maximum: 65535
      offset:
        type: integer
        minimum: 0
        maximum: 1048576
  FeedbackSelectors:
    type: array
    minItems: 1
    maxItems: 6
    uniqueItems: true
    items:
      type: string
      minLength: 1
      maxLength: 512
  FeedbackAnchor:
    type: object
    additionalProperties: false
    required: [schema_version, selectors, x, y]
    properties:
      schema_version:
        $ref: "../openapi.yaml#/components/schemas/ReviewSchemaVersion"
      selectors:
        $ref: "../openapi.yaml#/components/schemas/FeedbackSelectors"
      x:
        type: number
        minimum: 0
        maximum: 1
      y:
        type: number
        minimum: 0
        maximum: 1
      selection:
        type: object
        additionalProperties: false
        required: [start, end, text]
        properties:
          start:
            $ref: "../openapi.yaml#/components/schemas/FeedbackTextBoundary"
          end:
            $ref: "../openapi.yaml#/components/schemas/FeedbackTextBoundary"
          text:
            type: string
            minLength: 1
            maxLength: 2000
  FeedbackElement:
    type: object
    additionalProperties: false
    properties:
      role:
        type: string
        maxLength: 128
      label:
        type: string
        maxLength: 256
      test_id:
        type: string
        maxLength: 128
      html:
        type: string
        maxLength: 4096
  FeedbackEvidence:
    type: object
    additionalProperties: false
    required: [schema_version, actions, failed_requests]
    properties:
      schema_version:
        $ref: "../openapi.yaml#/components/schemas/ReviewSchemaVersion"
      element:
        $ref: "../openapi.yaml#/components/schemas/FeedbackElement"
      actions:
        type: array
        maxItems: 20
        items:
          type: object
          additionalProperties: false
          required: [type]
          properties:
            type:
              type: string
              enum: [navigation, click, submit]
            path:
              type: string
              maxLength: 2048
            label:
              type: string
              maxLength: 256
            test_id:
              type: string
              maxLength: 128
      failed_requests:
        type: array
        maxItems: 20
        items:
          type: object
          additionalProperties: false
          required: [method, path, status, duration_ms]
          properties:
            method:
              type: string
              minLength: 1
              maxLength: 12
            path:
              type: string
              minLength: 1
              maxLength: 2048
              pattern: "^/"
            status:
              type: integer
              minimum: 0
              maximum: 599
            duration_ms:
              type: integer
              minimum: 0
              maximum: 600000
  SourceFileState:
    type: object
    additionalProperties: false
    required: [path, status]
    properties:
      path:
        type: string
        minLength: 1
        maxLength: 512
        description: Path relative to the selected project directory
      status:
        type: string
        enum: [added, modified, deleted]
        description: Working-tree change from HEAD; staging does not affect this value
      blob_id:
        type: string
        pattern: "^(?:[0-9a-f]{40}|[0-9a-f]{64})$"
        description: Git blob ID from git hash-object --no-filters; absent for deleted or unreadable files
      mode:
        type: string
        pattern: "^100(?:644|755)$"
        description: Git file mode; absent for deleted or unsupported files
  SourceState:
    type: object
    additionalProperties: false
    required: [schema_version, head_commit, project_path, branch, changed_files, complete]
    description: "Git identifiers captured for one project directory. Compare HEAD, project_path, and changed_files only when both captures are complete. Branch names, staging, and ignored files do not affect matching. File contents and absolute paths are not stored; truncated or unsupported captures are incomplete."
    properties:
      schema_version:
        $ref: "../openapi.yaml#/components/schemas/ReviewSchemaVersion"
      head_commit:
        type: string
        pattern: "^(?:[0-9a-f]{40}|[0-9a-f]{64})?$"
        description: Full Git HEAD commit ID; empty when unavailable
      project_path:
        type: string
        maxLength: 512
        description: Selected project's path relative to the repository root; empty at the root
      branch:
        type: string
        maxLength: 128
        description: Informational branch name; empty for detached HEAD or when unavailable
      changed_files:
        type: array
        maxItems: 64
        description: Unique project-relative paths sorted lexically; renames are a deletion and an addition
        items:
          $ref: "../openapi.yaml#/components/schemas/SourceFileState"
      complete:
        type: boolean
        description: All supported Git-visible project changes were captured within the bounds
  FeedbackThread:
    type: object
    additionalProperties: false
    required:
      [
        schema_version,
        id,
        state,
        scope,
        report,
        evidence,
        source_at_report,
        message_count,
        latest_event_cursor,
      ]
    properties:
      message_count:
        {
          type: string,
          pattern: "^[0-9]+$",
          x-go-type: int64,
          x-oapi-codegen-extra-tags: { json: "message_count,string" },
        }
      latest_event_cursor:
        {
          type: string,
          pattern: "^[0-9]+$",
          x-go-type: int64,
          x-oapi-codegen-extra-tags: { json: "latest_event_cursor,string" },
        }
      schema_version:
        $ref: "../openapi.yaml#/components/schemas/ReviewSchemaVersion"
      id:
        $ref: "../openapi.yaml#/components/schemas/FeedbackID"
      state:
        $ref: "../openapi.yaml#/components/schemas/FeedbackThreadState"
      scope:
        $ref: "../openapi.yaml#/components/schemas/FeedbackScope"
      report:
        $ref: "../openapi.yaml#/components/schemas/FeedbackReport"
      anchor:
        $ref: "../openapi.yaml#/components/schemas/FeedbackAnchor"
      evidence:
        $ref: "../openapi.yaml#/components/schemas/FeedbackEvidence"
      source_at_report:
        $ref: "../openapi.yaml#/components/schemas/SourceState"
  FeedbackThreadSummary:
    type: object
    additionalProperties: false
    required: [schema_version, id, state, scope, report, message_count, latest_event_cursor]
    properties:
      message_count:
        {
          type: string,
          pattern: "^[0-9]+$",
          x-go-type: int64,
          x-oapi-codegen-extra-tags: { json: "message_count,string" },
        }
      latest_event_cursor:
        {
          type: string,
          pattern: "^[0-9]+$",
          x-go-type: int64,
          x-oapi-codegen-extra-tags: { json: "latest_event_cursor,string" },
        }
      schema_version:
        $ref: "../openapi.yaml#/components/schemas/ReviewSchemaVersion"
      id:
        $ref: "../openapi.yaml#/components/schemas/FeedbackID"
      state:
        $ref: "../openapi.yaml#/components/schemas/FeedbackThreadState"
      scope:
        $ref: "../openapi.yaml#/components/schemas/FeedbackScope"
      report:
        $ref: "../openapi.yaml#/components/schemas/FeedbackReport"
      anchor:
        $ref: "../openapi.yaml#/components/schemas/FeedbackAnchor"
  FeedbackThreadPage:
    type: object
    additionalProperties: false
    required: [schema_version, threads, event_cursor]
    properties:
      schema_version:
        $ref: "../openapi.yaml#/components/schemas/ReviewSchemaVersion"
      threads:
        type: array
        maxItems: 100
        items:
          $ref: "../openapi.yaml#/components/schemas/FeedbackThreadSummary"
      next_cursor:
        $ref: "../openapi.yaml#/components/schemas/FeedbackID"
      event_cursor:
        {
          type: string,
          pattern: "^[0-9]+$",
          x-go-type: int64,
          x-oapi-codegen-extra-tags: { json: "event_cursor,string" },
        }
  FeedbackEvent:
    type: object
    additionalProperties: false
    required: [schema_version, cursor, feedback_id, type, at, actor]
    properties:
      schema_version:
        $ref: "../openapi.yaml#/components/schemas/ReviewSchemaVersion"
      cursor:
        {
          type: string,
          pattern: "^[0-9]+$",
          x-go-type: int64,
          x-oapi-codegen-extra-tags: { json: "cursor,string" },
        }
      feedback_id:
        $ref: "../openapi.yaml#/components/schemas/FeedbackID"
      type:
        $ref: "../openapi.yaml#/components/schemas/FeedbackEventType"
      actor:
        type: string
        enum: [implementer, reviewer]
      author:
        $ref: "../openapi.yaml#/components/schemas/FeedbackAuthor"
      at:
        type: string
        format: date-time
      text:
        type: string
        minLength: 1
        maxLength: 4000
      evidence:
        $ref: "../openapi.yaml#/components/schemas/FeedbackEvidence"
      source_state:
        $ref: "../openapi.yaml#/components/schemas/SourceState"
  FeedbackEventPage:
    type: object
    additionalProperties: false
    required: [schema_version, events, event_cursor]
    properties:
      schema_version:
        $ref: "../openapi.yaml#/components/schemas/ReviewSchemaVersion"
      events:
        type: array
        maxItems: 25
        items:
          $ref: "../openapi.yaml#/components/schemas/FeedbackEvent"
      next_cursor:
        {
          type: string,
          pattern: "^[0-9]+$",
          x-go-type: int64,
          x-oapi-codegen-extra-tags: { json: "next_cursor,omitempty,string" },
        }
      event_cursor:
        {
          type: string,
          pattern: "^[0-9]+$",
          x-go-type: int64,
          x-oapi-codegen-extra-tags: { json: "event_cursor,string" },
        }
  FeedbackVisitProof:
    x-go-type: json.RawMessage
    description: Publisher-selected visitor proof, never browser input. An explicit invalid proof is denied without falling back to cookie or anonymous access. Browser sign-in remains independent author evidence.
    oneOf:
      - { $ref: "../openapi.yaml#/components/schemas/FeedbackBearerVisitProof" }
      - { $ref: "../openapi.yaml#/components/schemas/FeedbackConnectorVisitProof" }
  FeedbackBearerVisitProof:
    type: object
    additionalProperties: false
    required: [kind, token]
    properties:
      kind: { type: string, enum: [bearer], x-enum-varnames: [FeedbackVisitBearer] }
      token: { type: string, minLength: 1, maxLength: 2048 }
    description: The signed bearer token actually selected by HTTP authorization, including accepted renewal. Certificate tokens are not bearer proof.
  FeedbackConnectorVisitProof:
    type: object
    additionalProperties: false
    required: [kind, pair_id, delivery_generation, permission_token]
    properties:
      kind: { type: string, enum: [connector], x-enum-varnames: [FeedbackVisitConnector] }
      pair_id: { type: string, pattern: "^cpp_[A-Za-z0-9]{22}$" }
      delivery_generation:
        {
          type: string,
          pattern: "^[1-9][0-9]*$",
          x-go-type: int64,
          x-oapi-codegen-extra-tags: { json: "delivery_generation,string" },
        }
      permission_token: { type: string, minLength: 1, maxLength: 2048 }
    description: A snapshot from the actual connector stream admission after checking use. Control rechecks the pair, delivery binding, source, current service run, and signed permission. A claimed pair ID alone is not authority.
  FeedbackReviewerAccess:
    type: object
    additionalProperties: false
    description: Browser identity and visitor access are independent. Control rechecks the supplied browser and share proofs, current service policy, and feedback policy; visit_allowed is an observation, not authority.
    required: [visit_allowed]
    properties:
      source_ip:
        type: string
        maxLength: 64
      visit_allowed:
        type: boolean
      share_secret: { type: string, minLength: 43, maxLength: 43 }
      share_id:
        $ref: "../openapi.yaml#/components/schemas/ShareID"
      cookie_secret:
        type: string
        minLength: 43
        maxLength: 43
      browser_cookie_secret:
        type: string
        minLength: 43
        maxLength: 43
      visit_proof:
        $ref: "../openapi.yaml#/components/schemas/FeedbackVisitProof"
        x-go-type-skip-optional-pointer: true
  CreateFeedbackReportRequest:
    type: object
    additionalProperties: false
    required:
      [preview_id, run_number, service, page_path, report, evidence, source_at_report, access]
    properties:
      preview_id:
        $ref: "../openapi.yaml#/components/schemas/PreviewID"
      run_number:
        {
          type: string,
          pattern: "^[0-9]+$",
          x-go-type: int64,
          x-oapi-codegen-extra-tags: { json: "run_number,string" },
        }
      service:
        type: string
      page_path:
        type: string
      page_title:
        type: string
        maxLength: 256
      report:
        type: object
        additionalProperties: false
        required: [text]
        properties:
          text:
            type: string
          display_name:
            type: string
      anchor:
        $ref: "../openapi.yaml#/components/schemas/FeedbackAnchor"
      evidence:
        $ref: "../openapi.yaml#/components/schemas/FeedbackEvidence"
      source_at_report:
        $ref: "../openapi.yaml#/components/schemas/SourceState"
      access:
        $ref: "../openapi.yaml#/components/schemas/FeedbackReviewerAccess"
  AppendFeedbackEventRequest:
    type: object
    additionalProperties: false
    required: [type]
    properties:
      type:
        $ref: "../openapi.yaml#/components/schemas/FeedbackEventInputType"
      text:
        type: string
      evidence:
        $ref: "../openapi.yaml#/components/schemas/FeedbackEvidence"
      source_state:
        $ref: "../openapi.yaml#/components/schemas/SourceState"
  AppendReviewerFeedbackEventRequest:
    type: object
    additionalProperties: false
    required: [run_number, type, access]
    properties:
      run_number:
        {
          type: string,
          pattern: "^[0-9]+$",
          x-go-type: int64,
          x-oapi-codegen-extra-tags: { json: "run_number,string" },
        }
      type:
        $ref: "../openapi.yaml#/components/schemas/ReviewerFeedbackEventInputType"
      text:
        type: string
      evidence:
        $ref: "../openapi.yaml#/components/schemas/FeedbackEvidence"
      source_state:
        $ref: "../openapi.yaml#/components/schemas/SourceState"
      access:
        $ref: "../openapi.yaml#/components/schemas/FeedbackReviewerAccess"
  FeedbackEventInputType:
    type: string
    enum: [reply, update, thread.resolved, thread.reopened]
    x-enum-varnames:
      [FeedbackInputReply, FeedbackInputUpdate, FeedbackInputResolved, FeedbackInputReopened]
  ReviewerFeedbackEventInputType:
    type: string
    enum: [reply, thread.resolved, thread.reopened]
    x-enum-varnames:
      [ReviewerFeedbackInputReply, ReviewerFeedbackInputResolved, ReviewerFeedbackInputReopened]
  ReviewerFeedbackReadRequest:
    type: object
    additionalProperties: false
    required: [run_number, preview_id, access]
    properties:
      run_number:
        {
          type: string,
          pattern: "^[0-9]+$",
          x-go-type: int64,
          x-oapi-codegen-extra-tags: { json: "run_number,string" },
        }
      preview_id:
        $ref: "../openapi.yaml#/components/schemas/PreviewID"
      after_cursor:
        {
          type: string,
          pattern: "^[0-9]+$",
          x-go-type: int64,
          x-oapi-codegen-extra-tags: { json: "after_cursor,omitempty,string" },
        }
      access:
        $ref: "../openapi.yaml#/components/schemas/FeedbackReviewerAccess"
