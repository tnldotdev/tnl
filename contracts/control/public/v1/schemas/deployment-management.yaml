schemas:
  RegisterDeploymentManagementRequest:
    type: object
    additionalProperties: false
    required: [name, public_key, services, expires_in]
    properties:
      name: { type: string, pattern: "^[a-z]([a-z0-9-]{0,30}[a-z0-9])?$" }
      public_key:
        {
          type: string,
          minLength: 43,
          maxLength: 43,
          description: Unpadded base64url Ed25519 public key. The caller keeps the private key.,
        }
      services:
        type: array
        minItems: 1
        maxItems: 128
        uniqueItems: true
        items: { type: string, pattern: "^[a-z]([a-z0-9-]{0,30}[a-z0-9])?$" }
        description: Existing project declarations. Control captures their protocols; removal or a protocol change permanently retires this approval, even after rollback.
      deployment_ids:
        type: array
        minItems: 1
        maxItems: 128
        uniqueItems: true
        items: { type: string }
        description: Exact existing deployment IDs, never names. Select this or all_deployments, not both.
      all_deployments:
        {
          type: boolean,
          const: true,
          description: Explicitly approve all current and future deployments in this project. Required for runtime deployment creation. Does not approve future service names.,
        }
      expires_in:
        {
          type: integer,
          minimum: 60,
          maximum: 2592000,
          description: Fixed lifetime in seconds,
          at most 30 days. Recovery never extends it.,
        }
    oneOf:
      - required: [deployment_ids]
        not: { required: [all_deployments] }
      - required: [all_deployments]
        not: { required: [deployment_ids] }
  DeploymentManagementCredential:
    type: object
    additionalProperties: false
    required:
      [
        client_id,
        key_id,
        grant_id,
        team_id,
        project_key,
        services,
        deployment_ids,
        all_deployments,
        expires_at,
      ]
    properties:
      client_id: { type: string }
      key_id: { type: string }
      grant_id: { type: string }
      team_id: { type: string }
      project_key: { type: string }
      services:
        type: object
        minProperties: 1
        maxProperties: 128
        additionalProperties: { $ref: "../openapi.yaml#/components/schemas/ServiceProtocol" }
      deployment_ids:
        type: array
        maxItems: 128
        items: { type: string }
      all_deployments: { type: boolean }
      expires_at: { type: string, format: date-time }
    description: Public registration facts for a team-owned management grant. Use the existing signed /v1/publisher-token exchange. No connect, publish, general credential administration, or project-definition authority is granted. Revoke with the existing publisher identity/grant administration endpoints; revocation does not revoke separately enrolled publishers.
