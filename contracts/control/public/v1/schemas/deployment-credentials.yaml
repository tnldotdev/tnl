schemas:
  RegisterDeploymentCredentialRequest:
    type: object
    additionalProperties: false
    required: [name, public_key, permissions, expires_in]
    properties:
      name: { type: string, pattern: "^[a-z]([a-z0-9-]{0,30}[a-z0-9])?$" }
      public_key:
        {
          type: string,
          minLength: 43,
          maxLength: 43,
          description: Unpadded base64url Ed25519 public key. The caller keeps the private key.,
        }
      permissions:
        type: object
        additionalProperties: false
        minProperties: 1
        properties:
          manage:
            { $ref: "../openapi.yaml#/components/schemas/DeploymentCredentialServiceSelection" }
          connect:
            { $ref: "../openapi.yaml#/components/schemas/DeploymentCredentialServiceSelection" }
          publish: { $ref: "../openapi.yaml#/components/schemas/DeploymentPublishSelection" }
        description: Independent fixed service allowlists. Management never implies connection or publication. Control captures existing protocols; removal or protocol changes permanently retire approval, even after rollback.
      deployment_ids:
        type: array
        minItems: 1
        maxItems: 128
        uniqueItems: true
        items: { type: string }
        description: Exact existing deployment IDs, never names. Select this or all_deployments, not both.
      all_deployments:
        {
          type: boolean,
          const: true,
          description: Explicitly approve all current and future deployments in this project. Required for runtime deployment creation. Does not approve future service names.,
        }
      expires_in:
        {
          type: integer,
          minimum: 60,
          maximum: 2592000,
          description: Fixed lifetime in seconds,
          at most 30 days. Recovery never extends it.,
        }
    oneOf:
      - required: [deployment_ids]
        not: { required: [all_deployments] }
      - required: [all_deployments]
        not: { required: [deployment_ids] }
  DeploymentCredentialServiceSelection:
    type: array
    minItems: 1
    maxItems: 128
    uniqueItems: true
    items: { type: string, pattern: "^[a-z]([a-z0-9-]{0,30}[a-z0-9])?$" }
  DeploymentCredential:
    type: object
    additionalProperties: false
    required:
      [
        client_id,
        key_id,
        grant_id,
        team_id,
        project_key,
        permissions,
        deployment_ids,
        all_deployments,
        expires_at,
      ]
    properties:
      client_id: { type: string }
      key_id: { type: string }
      grant_id: { type: string }
      team_id: { type: string }
      project_key: { type: string }
      permissions:
        type: object
        minProperties: 1
        maxProperties: 3
        additionalProperties: false
        properties:
          manage:
            { $ref: "../openapi.yaml#/components/schemas/DeploymentCredentialServiceProtocols" }
          connect:
            { $ref: "../openapi.yaml#/components/schemas/DeploymentCredentialServiceProtocols" }
          publish: { $ref: "../openapi.yaml#/components/schemas/DeploymentPublishApproval" }
      deployment_ids:
        type: array
        maxItems: 128
        items: { type: string }
      all_deployments: { type: boolean }
      expires_at: { type: string, format: date-time }
    description: Public registration facts for one team-owned signing identity and independent approved capabilities. Use the signed /v1/publisher-token exchange. Publication uses only explicitly approved HTTP bindings or temporary allocation. No credential administration or project-definition authority is granted. Revoke with existing publisher identity/grant administration; separately enrolled publishers remain independent.
  DeploymentPublishSelection:
    type: object
    additionalProperties: false
    minProperties: 1
    properties:
      services: { $ref: "../openapi.yaml#/components/schemas/DeploymentCredentialServiceSelection" }
      temporary: { $ref: "../openapi.yaml#/components/schemas/DeploymentTemporaryPublication" }
    description: Independently approve named saved HTTP URLs, temporary allocation, or both. Named approval does not imply temporary allocation or permit editing saved visitor policy. No service declarations are needed for temporary-only approval.
  DeploymentPublishApproval:
    type: object
    additionalProperties: false
    minProperties: 1
    properties:
      services: { $ref: "../openapi.yaml#/components/schemas/DeploymentCredentialServiceProtocols" }
      temporary: { $ref: "../openapi.yaml#/components/schemas/DeploymentTemporaryPublication" }
  DeploymentTemporaryPublication:
    type: string
    enum: [restricted, anonymous]
    x-enum-varnames: [TemporaryPublicationRestricted, TemporaryPublicationAnonymous]
    description: Explicit temporary allocation approval in the selected deployments' namespaces. restricted permits only restricted visitor access; anonymous also permits an explicit anonymous request. Every allocation defaults to restricted. Exact custom saved hostnames never become allocation namespaces.
  DeploymentCredentialServiceProtocols:
    type: object
    minProperties: 1
    maxProperties: 128
    additionalProperties: { $ref: "../openapi.yaml#/components/schemas/ServiceProtocol" }
