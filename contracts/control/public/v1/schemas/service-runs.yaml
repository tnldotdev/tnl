schemas:
  ConnectorPeerPairDisposition:
    type: string
    description: Candidate is a preparation hint, not serving authority. Retired is an explicit durable terminal fact for this exact pair and outranks every delivery generation.
    enum: [candidate, retired]
    x-enum-varnames: [ConnectorPeerPairDispositionCandidate, ConnectorPeerPairDispositionRetired]
  ConnectorPeerPairRetirementObservation:
    type: object
    additionalProperties: false
    description: "Negative-only observation: retired_at <= observed_at < retained_until. retained_until is the unchanged max(expires_at, replay_fence_until), at most five minutes plus existing five-second request skew after retired_at. It is not a new serving lease, cleanup window, or proof of remote join. Repeated observations never extend retention."
    required: [observed_at, retired_at, retained_until]
    properties:
      observed_at: { type: string, format: date-time }
      retired_at: { type: string, format: date-time }
      retained_until: { type: string, format: date-time }
  ConnectorPeerPairCandidate:
    type: object
    additionalProperties: false
    description: "An exact pair disposition, never permission to open an application stream. Candidate requires owner_revision 1, no retirement, and optional positive owner_authority. Retired requires owner_revision 2, a retirement observation, and no owner_authority; do not prepare or revive it even for a higher delivery generation. Unknown or contradictory states are invalid. Omission, pagination, and missing positive authority never mean retired."
    required: [pair_id, delivery_generation, disposition, owner_revision]
    properties:
      pair_id: { type: string, pattern: "^cpp_[A-Za-z0-9]{22}$" }
      disposition: { $ref: "../openapi.yaml#/components/schemas/ConnectorPeerPairDisposition" }
      owner_revision:
        {
          type: string,
          pattern: "^[12]$",
          x-go-type: int64,
          x-oapi-codegen-extra-tags: { json: "owner_revision,string" },
        }
      retirement:
        $ref: "../openapi.yaml#/components/schemas/ConnectorPeerPairRetirementObservation"
      delivery_generation:
        {
          type: string,
          pattern: "^[0-9]+$",
          x-go-type: int64,
          x-oapi-codegen-extra-tags: { json: "delivery_generation,string" },
        }
      owner_authority:
        $ref: "../openapi.yaml#/components/schemas/ConnectorPeerPairOwnerAuthority"
  ConnectorPeerPairOwnerAuthority:
    type: object
    additionalProperties: false
    description: "Current authorization for an installed connector owner in this publisher run. It contains no delivery key and does not renew any relay claim, installation, path proof, or visitor permission. It can be read during relay loss but cannot revive an expired owner."
    required: [observed_at, expires_at]
    properties:
      observed_at: { type: string, format: date-time }
      expires_at: { type: string, format: date-time }
  ConnectorPeerPairCandidates:
    type: object
    additionalProperties: false
    required: [items]
    properties:
      items:
        type: array
        maxItems: 64
        items: { $ref: "../openapi.yaml#/components/schemas/ConnectorPeerPairCandidate" }
      next_after:
        type: string
        pattern: "^cpp_[A-Za-z0-9]{22}$"
        description: Continue after this pair ID; restart from the first page on the next reconciliation pass.
  ConnectorPeerPairPrepared:
    type: object
    additionalProperties: false
    description: Report installation of the exact independently prepared binding; this does not renew pair or application authority.
    required: [phase, delivery_id, delivery_generation, binding_expires_at]
    properties:
      phase:
        $ref: "../openapi.yaml#/components/schemas/ConnectorPeerPairPreparedPhase"
      operation_id: { type: string, maxLength: 25, x-go-type-skip-optional-pointer: true }
      binding_challenge: { type: string, maxLength: 43, x-go-type-skip-optional-pointer: true }
      path_proofs:
        type: array
        maxItems: 2
        description: Empty for installed; two ordered publisher-initiated proofs for proved. A duplicate proof cannot extend its freshness bound.
        x-go-type-skip-optional-pointer: true
        items: { $ref: "../openapi.yaml#/components/schemas/ConnectorPeerPairPathProof" }
      delivery_id: { type: string, pattern: "^[A-Za-z0-9_-]{21}[AQgw]$" }
      delivery_generation:
        {
          type: string,
          pattern: "^[0-9]+$",
          x-go-type: int64,
          x-oapi-codegen-extra-tags: { json: "delivery_generation,string" },
        }
      binding_expires_at:
        type: string
        format: date-time
        description: The original control-clock expires_at from the installed delivery response, not a new local deadline.
  ConnectorPeerPairPreparedPhase:
    type: string
    description: Installed reports binding installation; proved reports publisher-initiated path proofs for that binding.
    enum: [installed, proved]
    x-enum-varnames: [ConnectorPeerPairPreparedInstalled, ConnectorPeerPairPreparedProved]
  ConnectorPeerPairDelivery:
    type: object
    additionalProperties: false
    description: Existing pair delivery for the authenticated publisher run only; never grants an application stream.
    required:
      [
        pair_id,
        service_id,
        service_run_id,
        run_number,
        publisher_identity_id,
        subject,
        delivery_id,
        delivery_generation,
        key,
        source_ip,
        relays,
        observed_at,
        expires_at,
      ]
    properties:
      pair_id: { type: string, pattern: "^cpp_[A-Za-z0-9]{22}$" }
      service_id: { $ref: "../openapi.yaml#/components/schemas/ServiceID" }
      service_run_id: { $ref: "../openapi.yaml#/components/schemas/ServiceRunID" }
      run_number:
        {
          type: string,
          pattern: "^[0-9]+$",
          x-go-type: int64,
          x-oapi-codegen-extra-tags: { json: "run_number,string" },
        }
      publisher_identity_id: { type: string, pattern: "^pub_[A-Za-z0-9]{22}$" }
      subject: { $ref: "../openapi.yaml#/components/schemas/VisitorSubject" }
      delivery_id: { type: string, pattern: "^[A-Za-z0-9_-]{21}[AQgw]$" }
      delivery_generation:
        {
          type: string,
          pattern: "^[0-9]+$",
          x-go-type: int64,
          x-oapi-codegen-extra-tags: { json: "delivery_generation,string" },
        }
      key: { type: string, description: Per-binding delivery credential; do not log or persist. }
      session_key:
        type: string
        x-go-type-skip-optional-pointer: true
        description: Stable retained endpoint frame key; never returned by the private relay claim API.
      trust_revision:
        {
          type: string,
          x-go-type-skip-optional-pointer: true,
          pattern: "^[0-9]+$",
          x-go-type: int64,
          x-oapi-codegen-extra-tags: { json: "trust_revision,omitempty,string" },
        }
      operation_id: { type: string, maxLength: 25, x-go-type-skip-optional-pointer: true }
      binding_challenge: { type: string, maxLength: 43, x-go-type-skip-optional-pointer: true }
      binding_state:
        $ref: "../openapi.yaml#/components/schemas/ConnectorPeerPairBindingState"
        x-go-type-skip-optional-pointer: true
      source_ip: { type: string, description: Canonical source observed by both relays. }
      observed_at:
        type: string
        format: date-time
        description: Control time for this authority observation; the publisher subtracts request delay when installing its local deadline.
      relays:
        type: array
        minItems: 2
        maxItems: 2
        items: { $ref: "../openapi.yaml#/components/schemas/ConnectorPeerPairRelay" }
      expires_at: { type: string, format: date-time }
  VisitorConnectionID:
    type: string
    pattern: "^vc_[A-Za-z0-9]{22}$"
  ServiceRunID:
    type: string
    pattern: "^srun_[A-Za-z0-9]{22}$"
  AuthorizeServiceClientCertificateRequest:
    type: object
    additionalProperties: false
    required: [run_number, visitor_connection_id, source_ip, destination_port, certificate]
    properties:
      run_number:
        {
          type: string,
          pattern: "^[0-9]+$",
          x-go-type: int64,
          x-oapi-codegen-extra-tags: { json: "run_number,string" },
        }
      visitor_connection_id: { $ref: "../openapi.yaml#/components/schemas/VisitorConnectionID" }
      source_ip: { type: string, maxLength: 64 }
      destination_port: { type: integer, minimum: 1024, maximum: 65535 }
      certificate: { type: string, format: byte, maxLength: 21848 }
  CreateServiceCertificateIssuanceRequest:
    type: object
    additionalProperties: false
    required: [run_number, csr]
    properties:
      run_number:
        {
          type: string,
          pattern: "^[0-9]+$",
          x-go-type: int64,
          x-oapi-codegen-extra-tags: { json: "run_number,string" },
        }
      csr: { type: string, format: byte, maxLength: 87384 }
  SuppliedServiceCertificateInstalledRequest:
    type: object
    additionalProperties: false
    required: [run_number, certificate_pem, previous_certificate_sha256]
    properties:
      run_number:
        {
          type: string,
          pattern: "^[0-9]+$",
          x-go-type: int64,
          x-oapi-codegen-extra-tags: { json: "run_number,string" },
        }
      certificate_pem: { type: string, minLength: 1, maxLength: 131072 }
      previous_certificate_sha256:
        type: string
        pattern: "^([a-f0-9]{64})?$"
        description: Empty for the first install; otherwise the fingerprint of the previous acknowledged leaf. A retry of the currently installed leaf is idempotent.
  SuppliedServiceCertificateInstallation:
    type: object
    additionalProperties: false
    required: [certificate_sha256, expires_at]
    properties:
      certificate_sha256: { type: string, pattern: "^[a-f0-9]{64}$" }
      expires_at: { type: string, format: date-time }
  ServiceCertificateInstalledRequest:
    type: object
    additionalProperties: false
    required: [run_number, issuance_id, not_after]
    properties:
      run_number:
        {
          type: string,
          pattern: "^[0-9]+$",
          x-go-type: int64,
          x-oapi-codegen-extra-tags: { json: "run_number,string" },
        }
      issuance_id: { $ref: "../openapi.yaml#/components/schemas/IssuanceID" }
      not_after: { type: string, format: date-time }
  ServiceCertificateIssuance:
    type: object
    additionalProperties: false
    required:
      [id, service_id, service_run_id, run_number, publisher_identity_id, certificate_plan, state]
    properties:
      id: { $ref: "../openapi.yaml#/components/schemas/IssuanceID" }
      service_id: { $ref: "../openapi.yaml#/components/schemas/ServiceID" }
      service_run_id: { $ref: "../openapi.yaml#/components/schemas/ServiceRunID" }
      run_number:
        {
          type: string,
          pattern: "^[0-9]+$",
          x-go-type: int64,
          x-oapi-codegen-extra-tags: { json: "run_number,string" },
        }
      certificate_plan: { $ref: "../openapi.yaml#/components/schemas/CertificatePlan" }
      publisher_identity_id: { type: string, pattern: "^pub_[A-Za-z0-9]{22}$" }
      state: { $ref: "../openapi.yaml#/components/schemas/CertificateIssuanceState" }
      certificate_pem: { type: string }
      not_before: { type: string, format: date-time }
      not_after: { type: string, format: date-time }
      retry_at:
        type: string
        format: date-time
        description: Do not poll this pending issuance before this time. Usable certificate material can be installed and acknowledged immediately while DNS challenge cleanup continues.
