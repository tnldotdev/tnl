schemas:
  PublishRunServiceObservations:
    type: object
    additionalProperties: false
    required: [publish_run_number, events]
    properties:
      publish_run_number:
        {
          type: string,
          pattern: "^[0-9]+$",
          x-go-type: int64,
          x-oapi-codegen-extra-tags: { json: "publish_run_number,string" },
        }
      events:
        {
          type: array,
          minItems: 1,
          maxItems: 256,
          items: { $ref: "../openapi.yaml#/components/schemas/ServiceObservation" },
        }
  PublishRunID:
    $ref: "../openapi.yaml#/components/schemas/ResourceID"
  PublisherConnectionID:
    $ref: "../openapi.yaml#/components/schemas/ResourceID"
  CertificatePlan:
    type: object
    additionalProperties: false
    required: [cache_key, scope, identifiers, challenge_method]
    properties:
      cache_key:
        type: string
        minLength: 1
        maxLength: 256
      scope:
        type: string
        minLength: 1
        maxLength: 256
      identifiers:
        type: array
        minItems: 1
        maxItems: 2
        uniqueItems: true
        items:
          type: string
          minLength: 1
          maxLength: 253
          pattern: "^(?:\\*\\.)?[a-z0-9](?:[a-z0-9.-]*[a-z0-9])?$"
      challenge_method:
        $ref: "../openapi.yaml#/components/schemas/CertificateChallengeMethod"
  CreatePublishRunRequest:
    type: object
    additionalProperties: false
    properties:
      preferred_regions:
        $ref: "./common.yaml#/schemas/PreferredRegions"
      traffic:
        $ref: "../openapi.yaml#/components/schemas/TrafficSelection"
  PublishRunState:
    type: string
    enum: [starting, ready, draining, closed, expired, canceled]
  PublishRun:
    type: object
    additionalProperties: false
    required:
      [
        id,
        public_url_id,
        team_id,
        publish_run_number,
        policy_revision,
        state,
        created_at,
        expires_at,
      ]
    properties:
      id:
        $ref: "../openapi.yaml#/components/schemas/PublishRunID"
      public_url_id:
        $ref: "../openapi.yaml#/components/schemas/PublicURLID"
      team_id:
        $ref: "../openapi.yaml#/components/schemas/TeamID"
      membership_id:
        $ref: "../openapi.yaml#/components/schemas/MembershipID"
      publish_run_number:
        {
          type: string,
          pattern: "^[0-9]+$",
          x-go-type: int64,
          x-oapi-codegen-extra-tags: { json: "publish_run_number,string" },
        }
      policy_revision:
        {
          type: string,
          pattern: "^[0-9]+$",
          x-go-type: int64,
          x-oapi-codegen-extra-tags: { json: "policy_revision,string" },
        }
      state:
        $ref: "../openapi.yaml#/components/schemas/PublishRunState"
      ready_publisher_connections:
        type: integer
        minimum: 0
        maximum: 2
      created_at:
        type: string
        format: date-time
      expires_at:
        type: string
        format: date-time
      ready_at:
        type: string
        format: date-time
      closed_at:
        type: string
        format: date-time
  PublisherConnectionState:
    type: string
    enum: [assigned, connected, ready, replacing]
  PublishRunSetup:
    type: object
    additionalProperties: false
    required: [public_url, publish_run, publish_run_token, publisher_connections, certificate_plan]
    properties:
      traffic:
        $ref: "../openapi.yaml#/components/schemas/TrafficLimits"
      public_url:
        $ref: "../openapi.yaml#/components/schemas/PublicURL"
      publish_run:
        $ref: "../openapi.yaml#/components/schemas/PublishRun"
      publish_run_token:
        type: string
        minLength: 1
        maxLength: 4096
      certificate_plan:
        $ref: "../openapi.yaml#/components/schemas/CertificatePlan"
      publisher_connections:
        type: array
        minItems: 2
        maxItems: 2
        items:
          $ref: "../openapi.yaml#/components/schemas/ConnectionAssignment"
  PublishRunVersionRequest:
    type: object
    additionalProperties: false
    required: [publish_run_number]
    properties:
      publish_run_number:
        {
          type: string,
          pattern: "^[0-9]+$",
          x-go-type: int64,
          x-oapi-codegen-extra-tags: { json: "publish_run_number,string" },
        }
  EnableShareAccessRequest:
    type: object
    additionalProperties: false
    required: [publish_run_number]
    properties:
      publish_run_number:
        {
          type: string,
          pattern: "^[0-9]+$",
          x-go-type: int64,
          x-oapi-codegen-extra-tags: { json: "publish_run_number,string" },
        }
      preview_id:
        $ref: "../openapi.yaml#/components/schemas/PreviewID"
  RedeemShareRequest:
    type: object
    additionalProperties: false
    required: [publish_run_number]
    properties:
      publish_run_number:
        {
          type: string,
          pattern: "^[0-9]+$",
          x-go-type: int64,
          x-oapi-codegen-extra-tags: { json: "publish_run_number,string" },
        }
      share_id:
        $ref: "../openapi.yaml#/components/schemas/ShareID"
      secret:
        type: string
        minLength: 43
        maxLength: 43
        pattern: "^[A-Za-z0-9_-]+$"
      handoff_token:
        type: string
        minLength: 43
        maxLength: 43
        pattern: "^[A-Za-z0-9_-]+$"
  PublishRunHeartbeat:
    type: object
    additionalProperties: false
    description: Each HTTP publisher becomes ready independently after DNS, its installed public URL certificate, and two ready publisher connections.
    required: [publish_run, publisher_connections]
    properties:
      publish_run:
        $ref: "../openapi.yaml#/components/schemas/PublishRun"
      publisher_connections:
        type: array
        minItems: 2
        maxItems: 2
        items:
          $ref: "../openapi.yaml#/components/schemas/ConnectionAssignment"
  CertificateInstalledRequest:
    type: object
    additionalProperties: false
    required: [publish_run_number, issuance_id, not_after]
    properties:
      publish_run_number:
        {
          type: string,
          pattern: "^[0-9]+$",
          x-go-type: int64,
          x-oapi-codegen-extra-tags: { json: "publish_run_number,string" },
        }
      issuance_id:
        $ref: "../openapi.yaml#/components/schemas/IssuanceID"
      not_after:
        type: string
        format: date-time
  CreateCertificateIssuanceRequest:
    type: object
    additionalProperties: false
    required: [publish_run_number, csr]
    properties:
      publish_run_number:
        {
          type: string,
          pattern: "^[0-9]+$",
          x-go-type: int64,
          x-oapi-codegen-extra-tags: { json: "publish_run_number,string" },
        }
      csr:
        type: string
        format: byte
        minLength: 1
        maxLength: 65536
  CertificateIssuanceState:
    type: string
    enum:
      [
        pending,
        authorizing,
        ready_to_finalize,
        finalizing,
        waiting_for_install,
        installed,
        failed,
        canceled,
      ]
  CertificateIssuance:
    type: object
    additionalProperties: false
    required:
      [
        id,
        publish_run_id,
        public_url_id,
        publish_run_number,
        certificate_plan,
        state,
        created_at,
        updated_at,
      ]
    properties:
      id:
        $ref: "../openapi.yaml#/components/schemas/IssuanceID"
      publish_run_id:
        $ref: "../openapi.yaml#/components/schemas/PublishRunID"
      public_url_id:
        $ref: "../openapi.yaml#/components/schemas/PublicURLID"
      publish_run_number:
        {
          type: string,
          pattern: "^[0-9]+$",
          x-go-type: int64,
          x-oapi-codegen-extra-tags: { json: "publish_run_number,string" },
        }
      certificate_plan:
        $ref: "../openapi.yaml#/components/schemas/CertificatePlan"
      state:
        $ref: "../openapi.yaml#/components/schemas/CertificateIssuanceState"
      certificate_pem:
        type: string
      retry_at:
        type: string
        format: date-time
      not_before:
        type: string
        format: date-time
      not_after:
        type: string
        format: date-time
      created_at:
        type: string
        format: date-time
      updated_at:
        type: string
        format: date-time
