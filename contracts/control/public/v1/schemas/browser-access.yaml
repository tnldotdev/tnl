schemas:
  VisitorResourceScope:
    type: object
    additionalProperties: false
    required: [kind, id]
    properties:
      kind: { type: string, enum: [service] }
      id: { type: string, maxLength: 64 }
    description: An exact service authorization scope.
  CreateVisitorCredentialRequest:
    type: object
    additionalProperties: false
    required: [kind, expires_at]
    properties:
      kind: { type: string, enum: [token] }
      expires_at: { type: string, format: date-time }
  VisitorCredential:
    type: object
    additionalProperties: false
    required: [grant_id, kind, permission, refresh_credential, expires_at]
    properties:
      grant_id: { type: string, pattern: "^shg_[A-Za-z0-9]{22}$" }
      kind: { type: string, enum: [token] }
      permission: { $ref: "../openapi.yaml#/components/schemas/VisitorTokenResponse" }
      refresh_credential: { type: string, maxLength: 128 }
      expires_at: { type: string, format: date-time }
  ServiceHTTPGrantSummary:
    type: object
    additionalProperties: false
    required: [subject, id, kind, expires_at]
    properties:
      subject: { $ref: "../openapi.yaml#/components/schemas/VisitorResourceScope" }
      id: { type: string, pattern: "^shg_[A-Za-z0-9]{22}$" }
      kind: { type: string, enum: [token] }
      expires_at: { type: string, format: date-time }
      revoked_at: { type: string, format: date-time }
  ServiceBrowserRequest:
    type: object
    additionalProperties: false
    required: [run_number, secret]
    properties:
      run_number:
        {
          type: string,
          pattern: "^[0-9]+$",
          x-go-type: int64,
          x-oapi-codegen-extra-tags: { json: "run_number,string" },
        }
      secret: { type: string, maxLength: 256 }
      share_id: { $ref: "../openapi.yaml#/components/schemas/ShareID" }
      share_cookie_secret:
        type: string
        pattern: "^[A-Za-z0-9_-]{43}$"
    description: The secret is a handoff ticket or browser session cookie. Optional share_id and share_cookie_secret must be supplied together; they prove visitor permission independently of browser identity.
  BrowserHandoffResponse:
    type: object
    additionalProperties: false
    required: [cookie_secret, return_path, expires_at]
    properties:
      cookie_secret:
        type: string
        pattern: "^[A-Za-z0-9_-]{43}$"
      permission:
        $ref: "../openapi.yaml#/components/schemas/VisitorTokenResponse"
        description: Present only when current browser or supplied share permission allows visiting. Identity-only sign-in still returns the browser cookie.
      return_path:
        type: string
        pattern: "^/"
      next_url:
        type: string
        pattern: "^https://"
      bridge:
        type: boolean
      expires_at:
        type: string
        format: date-time
  BrowserAccessResponse:
    type: object
    additionalProperties: false
    required: [identity_id, display_name, team_member, visit_allowed]
    properties:
      identity_id:
        $ref: "../openapi.yaml#/components/schemas/IdentityID"
      display_name:
        type: string
        minLength: 1
        maxLength: 256
      team_member:
        type: boolean
      visit_allowed:
        type: boolean
