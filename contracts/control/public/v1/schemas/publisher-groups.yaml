schemas:
  CreatePublisherGroupRequest:
    type: object
    additionalProperties: false
    required: [team_id, from, expected_revision]
    properties:
      team_id: { type: string }
      from: { type: string }
      expected_revision: { type: integer, format: int64, minimum: 1 }
      name: { type: string, pattern: "^[a-z]([a-z0-9-]{0,30}[a-z0-9])?$" }
      idempotency_key: { type: string, minLength: 1, maxLength: 256 }
      bindings: { $ref: "../openapi.yaml#/components/schemas/PublisherGroupBindings" }
  PublisherGroupTargetBinding:
    type: object
    additionalProperties: false
    description: Exact target settings for one group. Control privately pins the template service's protocol when this binding is explicitly saved; callers never select a separate protocol. A retained binding cannot be reinterpreted by a template protocol change.
    properties:
      target: { type: string, maxLength: 8192 }
      target_tls: { $ref: "../openapi.yaml#/components/schemas/ProjectTargetTLS" }
      target_discovery: { $ref: "../openapi.yaml#/components/schemas/ProjectTargetDiscovery" }
  PublisherGroupBindings:
    type: object
    maxProperties: 128
    additionalProperties:
      { $ref: "../openapi.yaml#/components/schemas/PublisherGroupTargetBinding" }
  PublisherGroupResource:
    type: object
    additionalProperties: false
    required: [id, name, from, revision, retired, bindings, services, members]
    properties:
      id: { type: string, pattern: "^pgrp_[A-Za-z0-9]{22}$" }
      name: { type: string }
      from: { type: string }
      revision: { type: integer, format: int64 }
      retired: { type: boolean }
      bindings: { $ref: "../openapi.yaml#/components/schemas/PublisherGroupBindings" }
      services:
        {
          type: array,
          items: { $ref: "../openapi.yaml#/components/schemas/AppliedProjectService" },
        }
      members:
        {
          type: array,
          items: { $ref: "../openapi.yaml#/components/schemas/PublisherGroupMemberStatus" },
        }
  UpdatePublisherGroupBindingsRequest:
    type: object
    additionalProperties: false
    required: [team_id, expected_revision, bindings]
    properties:
      team_id: { type: string }
      expected_revision: { type: integer, format: int64, minimum: 1 }
      bindings: { $ref: "../openapi.yaml#/components/schemas/PublisherGroupBindings" }
  PublisherGroupConnection:
    type: object
    additionalProperties: false
    required:
      [
        schema,
        server,
        team_id,
        project_key,
        source_fingerprint,
        project_label,
        group_id,
        group_name,
        services,
        workloads,
      ]
    properties:
      schema: { type: integer, enum: [1] }
      server: { type: string, format: uri }
      team_id: { type: string }
      project_key: { type: string }
      source_fingerprint: { type: string, pattern: "^[0-9a-f]{64}$" }
      project_label: { type: string }
      group_id: { type: string, pattern: "^pgrp_[A-Za-z0-9]{22}$" }
      group_name: { type: string }
      services:
        type: object
        maxProperties: 128
        additionalProperties: { $ref: "../openapi.yaml#/components/schemas/ServiceProtocol" }
      workloads:
        type: object
        additionalProperties:
          { $ref: "../openapi.yaml#/components/schemas/PublisherGroupConnectionWorkload" }
  PublisherGroupConnectionWorkload:
    type: object
    additionalProperties: false
    required: [provider, services, max_duration_seconds]
    properties:
      provider: { $ref: "../openapi.yaml#/components/schemas/WorkloadProvider" }
      services: { type: array, items: { type: string }, maxItems: 32 }
      max_duration_seconds: { type: integer, minimum: 0, maximum: 9223372036 }
  RenamePublisherNamespaceRequest:
    type: object
    additionalProperties: false
    required: [team_id, namespace_label, expected_revision, idempotency_key]
    properties:
      team_id: { type: string }
      namespace_label: { type: string, pattern: "^[a-z]([a-z0-9-]{0,30}[a-z0-9])?$" }
      expected_revision: { type: integer, format: int64, minimum: 1 }
      idempotency_key: { type: string, minLength: 1, maxLength: 256 }
  RenamePublisherGroupRequest:
    type: object
    additionalProperties: false
    required: [team_id, name, expected_revision]
    properties:
      team_id: { type: string }
      name: { type: string, pattern: "^[a-z]([a-z0-9-]{0,30}[a-z0-9])?$" }
      expected_revision: { type: integer, format: int64, minimum: 1 }
  CreatePublisherGroupEnrollmentRequest:
    type: object
    additionalProperties: false
    required: [team_id, max_members, expires_in]
    properties:
      team_id: { type: string }
      max_members: { type: integer, minimum: 1, maximum: 256 }
      expires_in: { type: integer, minimum: 60, maximum: 86400 }
  PublisherGroupEnrollment:
    type: object
    required: [enrollment_key, group_id, expires_at, max_members, publisher]
    properties:
      publisher:
        type: object
        additionalProperties: false
        required: [server, project, group]
        properties:
          server: { type: string }
          project: { type: string }
          group: { type: string }
      enrollment_key: { type: string }
      group_id: { type: string }
      expires_at: { type: string, format: date-time }
      max_members: { type: integer }
  RedeemPublisherGroupEnrollmentRequest:
    type: object
    additionalProperties: false
    required: [enrollment_key, public_key]
    properties:
      enrollment_key: { type: string, maxLength: 256 }
      public_key: { type: string, pattern: "^[A-Za-z0-9_-]{43}$" }
  PublisherGroupMember:
    type: object
    required: [team_id, project_key, group_id, group_name, publisher_identity_id, key_id]
    properties:
      team_id: { type: string }
      project_key: { type: string }
      group_id: { type: string }
      group_name: { type: string }
      publisher_identity_id: { type: string }
      key_id: { type: string }
  PublisherGroupMemberStatus:
    allOf:
      - { $ref: "../openapi.yaml#/components/schemas/PublisherGroupMember" }
      - type: object
        required: [observed_revision, current_revision, snapshot_at, healthy]
        properties:
          observed_revision: { type: integer, format: int64 }
          current_revision: { type: integer, format: int64 }
          snapshot_at: { type: string, format: date-time }
          acknowledged_at: { type: string, format: date-time }
          healthy: { type: boolean }
          lease_expires_at: { type: string, format: date-time }
          runtime: { $ref: "../openapi.yaml#/components/schemas/PublisherRuntimeStatus" }
  PublisherGroupLeaseRequest:
    type: object
    additionalProperties: false
    required: [publisher_identity_id, group_id, assertion]
    properties:
      publisher_identity_id: { type: string }
      group_id: { type: string }
      assertion: { type: string, maxLength: 4096 }
  PublisherGroupLease:
    type: object
    required: [access_token, expires_at]
    properties:
      access_token: { type: string }
      expires_at: { type: string, format: date-time }
  PublisherGroupVerification:
    type: object
    required: [member, group_names]
    properties:
      member: { $ref: "../openapi.yaml#/components/schemas/PublisherGroupMember" }
      group_names:
        type: array
        minItems: 1
        uniqueItems: true
        items: { type: string, minLength: 1, maxLength: 63 }
  PublisherGroupAssignments:
    type: object
    required: [member, revision, configuration_hash, services, certificate_state_plans]
    properties:
      certificate_state_plans:
        type: array
        maxItems: 1024
        description: Every certificate plan submitted by this publisher identity. Restore each plan's private material; unrelated or older plans cannot satisfy this list.
        items: { $ref: "../openapi.yaml#/components/schemas/CertificatePlan" }
      member: { $ref: "../openapi.yaml#/components/schemas/PublisherGroupMember" }
      revision: { type: integer, format: int64 }
      configuration_hash: { type: string }
      services:
        {
          type: array,
          maxItems: 128,
          items: { $ref: "../openapi.yaml#/components/schemas/PublisherGroupServiceAssignment" },
        }
  PublisherGroupServiceAssignment:
    type: object
    required: [service, service_id, service_kind, grant_id, configuration, trust_revision]
    properties:
      service: { type: string }
      service_id: { type: string }
      service_kind: { type: string, enum: [public_url, service] }
      grant_id: { type: string }
      hostname: { type: string }
      trust_revision: { type: integer, format: int64 }
      configuration: { $ref: "../openapi.yaml#/components/schemas/ProjectServiceConfiguration" }
      environment: { $ref: "../openapi.yaml#/components/schemas/EnvironmentPublication" }
  PublisherGroupAcknowledgement:
    type: object
    additionalProperties: false
    required: [revision, configuration_hash, healthy]
    properties:
      revision: { type: integer, format: int64, minimum: 1 }
      configuration_hash: { type: string, pattern: "^[0-9a-f]{64}$" }
      healthy: { type: boolean }
