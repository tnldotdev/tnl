schemas:
  PreviewID:
    $ref: "../openapi.yaml#/components/schemas/ResourceID"
  ShareID:
    $ref: "../openapi.yaml#/components/schemas/ResourceID"
  CreatePreviewRequest:
    type: object
    additionalProperties: false
    required: [team_id]
    properties:
      team_id:
        $ref: "../openapi.yaml#/components/schemas/TeamID"
  AddPreviewServiceRequest:
    type: object
    additionalProperties: false
    required: [service_id]
    properties:
      service_id:
        $ref: "../openapi.yaml#/components/schemas/ServiceID"
  SetPreviewTeamAccessRequest:
    type: object
    additionalProperties: false
    required: [enabled]
    properties:
      enabled:
        type: boolean
  Preview:
    type: object
    additionalProperties: false
    required: [schema_version, id, service_ids, created_at]
    properties:
      schema_version:
        $ref: "../openapi.yaml#/components/schemas/ReviewSchemaVersion"
      id:
        $ref: "../openapi.yaml#/components/schemas/PreviewID"
      team_id:
        $ref: "../openapi.yaml#/components/schemas/TeamID"
        x-go-type-skip-optional-pointer: true
      guest_id:
        $ref: "../openapi.yaml#/components/schemas/GuestID"
        x-go-type-skip-optional-pointer: true
      service_ids:
        type: array
        uniqueItems: true
        items:
          $ref: "../openapi.yaml#/components/schemas/ServiceID"
      team_access_enabled:
        type: boolean
      created_at:
        type: string
        format: date-time
    not:
      anyOf:
        - required: [team_id, guest_id]
        - not:
            anyOf:
              - required: [team_id]
              - required: [guest_id]
  CreateShareRequest:
    type: object
    additionalProperties: false
    required: [service_ids, entry_service_id, expires_at]
    properties:
      service_ids:
        type: array
        minItems: 1
        uniqueItems: true
        items:
          $ref: "../openapi.yaml#/components/schemas/ServiceID"
      expires_at:
        type: string
        format: date-time
      entry_service_id:
        $ref: "../openapi.yaml#/components/schemas/ServiceID"
      label:
        type: string
        maxLength: 128
  ShareCreation:
    type: object
    additionalProperties: false
    description: "The share, a link for reviewers, and a token source for visitor-token requests. Keep these values: lists and detail reads do not return secrets. An identical retry returns credential_delivery_unavailable with the existing share ID."
    required: [share, link, token_source]
    properties:
      share:
        $ref: "../openapi.yaml#/components/schemas/Share"
      link:
        type: string
        format: uri
        pattern: "^https://"
      token_source:
        $ref: "../openapi.yaml#/components/schemas/VisitorTokenShareSource"
  Share:
    type: object
    additionalProperties: false
    required:
      [schema_version, id, scope, label, service_ids, entry_service_id, created_at, expires_at]
    properties:
      schema_version:
        $ref: "../openapi.yaml#/components/schemas/ReviewSchemaVersion"
      id:
        $ref: "../openapi.yaml#/components/schemas/ShareID"
      preview_id:
        $ref: "../openapi.yaml#/components/schemas/PreviewID"
      scope:
        type: string
        enum: [service, preview, guest]
      label:
        type: string
      team_id:
        $ref: "../openapi.yaml#/components/schemas/TeamID"
        x-go-type-skip-optional-pointer: true
      guest_id:
        $ref: "../openapi.yaml#/components/schemas/GuestID"
        x-go-type-skip-optional-pointer: true
      entry_service_id:
        $ref: "../openapi.yaml#/components/schemas/ServiceID"
      service_ids:
        type: array
        minItems: 1
        uniqueItems: true
        items:
          $ref: "../openapi.yaml#/components/schemas/ServiceID"
      created_by_identity_id:
        $ref: "../openapi.yaml#/components/schemas/IdentityID"
        x-go-type-skip-optional-pointer: true
      created_at:
        type: string
        format: date-time
      expires_at:
        type: string
        format: date-time
      revoked_at:
        type: string
        format: date-time
    not:
      anyOf:
        - required: [team_id, guest_id]
        - not:
            anyOf:
              - required: [team_id]
              - required: [guest_id]
        - required: [team_id]
          not: { required: [created_by_identity_id] }
        - required: [guest_id]
          anyOf:
            - properties:
                scope: { not: { const: guest } }
            - required: [created_by_identity_id]
  SharePage:
    type: object
    additionalProperties: false
    required: [schema_version, shares]
    properties:
      schema_version:
        $ref: "../openapi.yaml#/components/schemas/ReviewSchemaVersion"
      shares:
        type: array
        maxItems: 100
        items:
          $ref: "../openapi.yaml#/components/schemas/Share"
      next_cursor:
        $ref: "../openapi.yaml#/components/schemas/ShareID"
  PreviewPageFeedbackRequest:
    type: object
    additionalProperties: false
    required: [preview_id, run_number, access]
    properties:
      state:
        $ref: "../openapi.yaml#/components/schemas/FeedbackThreadState"
      preview_id:
        $ref: "../openapi.yaml#/components/schemas/PreviewID"
      run_number:
        {
          type: string,
          pattern: "^[0-9]+$",
          x-go-type: int64,
          x-oapi-codegen-extra-tags: { json: "run_number,string" },
        }
      page_path:
        type: string
      cursor:
        $ref: "../openapi.yaml#/components/schemas/FeedbackID"
      access:
        $ref: "../openapi.yaml#/components/schemas/FeedbackReviewerAccess"
  ServiceRunPreviewRequest:
    type: object
    additionalProperties: false
    required: [run_number]
    properties:
      run_number:
        type: string
        pattern: "^[0-9]+$"
        x-go-type: int64
        x-oapi-codegen-extra-tags: { json: "run_number,string" }
  RedeemServiceShareRequest:
    type: object
    additionalProperties: false
    required: [run_number]
    description: Supply either a share ID and secret, or a one-use handoff token. The exact publisher service run token authenticates this operation separately.
    properties:
      run_number:
        $ref: "#/schemas/ServiceRunPreviewRequest/properties/run_number"
      hostname:
        type: string
        minLength: 1
        maxLength: 253
        x-go-type-skip-optional-pointer: true
        description: Exact HTTP hostname receiving the share cookie. Omission selects the canonical service hostname.
      share_id:
        $ref: "../openapi.yaml#/components/schemas/ShareID"
      secret:
        type: string
        minLength: 43
        maxLength: 43
        pattern: "^[A-Za-z0-9_-]+$"
      handoff_token:
        type: string
        minLength: 43
        maxLength: 43
        pattern: "^[A-Za-z0-9_-]+$"
  ShareRedemption:
    type: object
    additionalProperties: false
    required: [schema_version, share_id, cookie_secret, expires_at, next_url, bridge, permission]
    properties:
      schema_version:
        $ref: "../openapi.yaml#/components/schemas/ReviewSchemaVersion"
      share_id:
        $ref: "../openapi.yaml#/components/schemas/ShareID"
      cookie_secret:
        type: string
        minLength: 43
        maxLength: 43
      permission:
        $ref: "../openapi.yaml#/components/schemas/VisitorTokenResponse"
      expires_at:
        type: string
        format: date-time
      next_url:
        type: string
        format: uri
        pattern: "^https://"
      bridge:
        type: boolean
