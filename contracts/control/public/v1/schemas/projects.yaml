schemas:
  GitProjectSource:
    description: "Repository origin and configuration path used to identify a project. These facts are a locator, not proof of repository ownership."
    type: object
    additionalProperties: false
    required: [git_origin, configuration_path]
    properties:
      git_origin:
        {
          "type": "string",
          "minLength": 1,
          "maxLength": 4096,
          "description": "Network Git remote URL. Do not include private credentials; transport and login details do not affect project identity.",
        }
      configuration_path:
        type: string
        minLength: 1
        maxLength: 4096
        description: Repository-relative configuration filename using forward slashes. Absolute paths and parent traversal are rejected.
  ProjectSourceIdentity:
    description: "Server-derived source identity. Use project_key to read or apply configuration; callers do not need to compute the fingerprint."
    type: object
    additionalProperties: false
    required: [project_key, source_fingerprint, project_label]
    properties:
      project_key: { type: string }
      source_fingerprint: { type: string }
      project_label: { type: string }
  ProjectSummary:
    description: "Saved project identity and configuration revision. Fetch configuration separately to read or edit its declarations."
    type: object
    additionalProperties: false
    required: [team_id, project_key, project_label, revision, updated_at]
    properties:
      team_id: { type: string }
      project_key: { type: string }
      project_label: { type: string }
      revision:
        {
          type: string,
          pattern: "^[0-9]+$",
          x-go-type: int64,
          x-oapi-codegen-extra-tags: { json: "revision,string" },
        }
      updated_at: { type: string, format: date-time }
  PreviewSummary:
    description: "A preview created by the current identity. Fetch its detail for the included public URLs."
    type: object
    additionalProperties: false
    required: [id, team_id, created_at]
    properties:
      id: { $ref: "../openapi.yaml#/components/schemas/PreviewID" }
      team_id: { type: string }
      created_at: { type: string, format: date-time }
  PreviewPage:
    type: object
    additionalProperties: false
    required: [previews]
    properties:
      previews:
        type: array
        items: { $ref: "../openapi.yaml#/components/schemas/PreviewSummary" }
      next_cursor: { type: string }
  ProjectPage:
    type: object
    additionalProperties: false
    required: [projects]
    properties:
      projects:
        type: array
        items: { $ref: "../openapi.yaml#/components/schemas/ProjectSummary" }
      next_cursor: { type: string }
  ProjectPublicMetadata:
    type: object
    additionalProperties: false
    required: [source_fingerprint, services]
    properties:
      source_fingerprint: { type: string }
      services:
        type: array
        items:
          type: object
          additionalProperties: false
          required: [service, hostname, port]
          properties:
            service: { type: string }
            public_url_id: { $ref: "../openapi.yaml#/components/schemas/PublicURLID" }
            service_id: { $ref: "../openapi.yaml#/components/schemas/ServiceID" }
            port:
              type: integer
              minimum: 0
              maximum: 65535
              description: Public reservation, or zero for a connector-only service with no public reservation.
            hostname: { type: string }
  RealizeLocalProjectServiceRequest:
    type: object
    additionalProperties: false
    required: [team_id, source_fingerprint, worktree_key, configuration]
    properties:
      team_id: { type: string }
      source_fingerprint: { type: string, pattern: "^[0-9a-f]{64}$" }
      worktree_key: { type: string, minLength: 1, maxLength: 128 }
      worktree_label: { type: string, minLength: 1, maxLength: 63 }
      domain_id: { $ref: "../openapi.yaml#/components/schemas/DomainID" }
      public_url_id: { $ref: "../openapi.yaml#/components/schemas/PublicURLID" }
      configuration: { $ref: "../openapi.yaml#/components/schemas/ProjectServiceConfiguration" }
  LocalProjectService:
    type: object
    additionalProperties: false
    required: [service, worktree_key, service_kind, service_id]
    properties:
      service: { type: string }
      worktree_key: { type: string }
      service_kind: { type: string, enum: [service, public_url] }
      service_id: { type: string }
      hostname: { type: string }
      metadata: { $ref: "../openapi.yaml#/components/schemas/ServiceMetadata" }
  ApplyProjectConfigurationRequest:
    type: object
    additionalProperties: false
    required: [team_id, deployment, service_declarations, expected_revision, configuration]
    properties:
      team_id: { type: string }
      source:
        $ref: "../openapi.yaml#/components/schemas/GitProjectSource"
        description: Required on first apply. Omit on updates to retain the saved source binding.
      project_label:
        {
          type: string,
          minLength: 1,
          maxLength: 63,
          pattern: "^[a-z0-9]([a-z0-9-]*[a-z0-9])?$",
          description: "Initial DNS label. Saved on first apply; later values do not rename the project or existing namespaces. Read project status or discovery for the saved label.",
        }
      expected_revision:
        {
          type: string,
          pattern: "^[0-9]+$",
          x-go-type: int64,
          x-oapi-codegen-extra-tags: { json: "expected_revision,string" },
        }
      deployment: { type: string, pattern: "^[a-z]([a-z0-9-]{0,30}[a-z0-9])?$" }
      service_declarations:
        { $ref: "../openapi.yaml#/components/schemas/ProjectServiceDeclarations" }
      configuration: { $ref: "../openapi.yaml#/components/schemas/ProjectConfiguration" }
  ProjectServiceDeclarations:
    type: object
    maxProperties: 128
    propertyNames: { pattern: "^[a-z]([a-z0-9-]{0,30}[a-z0-9])?$" }
    additionalProperties: { $ref: "../openapi.yaml#/components/schemas/ServiceProtocol" }
  ProjectConfiguration:
    type: object
    description: Normalized bindings for one selected deployment, at most 512 KiB encoded. Remote selections include settings; local selection omits settings and workloads. Logical declarations are sent separately. Local bindings allocate resources through source-bound worktree realization. A project supports at most 256 active enrolled replicas across its deployments.
    additionalProperties: false
    required: [services, oauth, webhooks]
    properties:
      workloads:
        type: object
        maxProperties: 32
        additionalProperties: { $ref: "../openapi.yaml#/components/schemas/ProjectWorkload" }
      oauth:
        type: boolean
        default: false
        description: Desired local app-led OAuth integration URL declaration. Applying it does not provision a handler on a saved deployment.
      webhooks:
        type: object
        maxProperties: 32
        additionalProperties: { $ref: "../openapi.yaml#/components/schemas/ProjectWebhook" }
        description: Desired exact endpoints for the existing local webhook integration handler. Each endpoint names a declared local HTTP service with public_url enabled, including app, address, compose, and docker targets. Control does not fetch provider catalogs or provision remote webhook handlers during apply.
      settings:
        $ref: "../openapi.yaml#/components/schemas/DeploymentSettings"
      services:
        {
          type: object,
          maxProperties: 128,
          additionalProperties:
            { $ref: "../openapi.yaml#/components/schemas/ProjectServiceConfiguration" },
        }
  DeploymentSettings:
    type: object
    additionalProperties: false
    properties:
      description: { type: string, maxLength: 1024 }
      domain_id: { type: string }
      public: { type: boolean, default: false }
  ProjectWorkload:
    type: object
    additionalProperties: false
    required: [deployment, provider, trust, services, max_duration_seconds]
    properties:
      deployment:
        { type: string, pattern: "^[a-z]([a-z0-9-]{0,30}[a-z0-9])?$", not: { const: local } }
      provider: { $ref: "../openapi.yaml#/components/schemas/WorkloadProvider" }
      trust: { $ref: "../openapi.yaml#/components/schemas/WorkloadTrust" }
      github: { $ref: "../openapi.yaml#/components/schemas/ProjectWorkloadGitHub" }
      google: { $ref: "../openapi.yaml#/components/schemas/ProjectWorkloadGoogle" }
      kubernetes: { $ref: "../openapi.yaml#/components/schemas/ProjectWorkloadKubernetes" }
      gitlab: { $ref: "../openapi.yaml#/components/schemas/ProjectWorkloadGitLab" }
      services:
        type: array
        minItems: 1
        maxItems: 32
        uniqueItems: true
        items: { type: string }
      max_duration_seconds:
        type: integer
        minimum: 0
        maximum: 9223372036
        description: Optional absolute session limit in seconds. Zero means no hard limit; permission leases and verified platform-proof expiry still apply.
  ProjectWorkloadGitLab:
    type: object
    additionalProperties: false
    required: [server, project, project_id, namespace_id]
    properties:
      server: { type: string, minLength: 1, maxLength: 1024 }
      project: { type: string, minLength: 1, maxLength: 512 }
      project_id: { type: string, minLength: 1, maxLength: 32 }
      namespace_id: { type: string, minLength: 1, maxLength: 32 }
      default_branch: { type: string, minLength: 1, maxLength: 512 }
  ProjectWorkloadKubernetes:
    type: object
    additionalProperties: false
    required: [context, cluster_server, namespace, service_account]
    description: Trusted setup selectors retained for unchanged applies. The trust sub and service_account_uid claims define the approved service account identity; runtime never reads these setup selectors as credentials.
    properties:
      context: { type: string, minLength: 1, maxLength: 1024 }
      cluster_server: { type: string, minLength: 1, maxLength: 4096 }
      namespace: { type: string, minLength: 1, maxLength: 63 }
      service_account: { type: string, minLength: 1, maxLength: 253 }
  ProjectWorkloadGoogle:
    type: object
    additionalProperties: false
    required: [service_account]
    description: Service account selector retained by trusted apply. The verified numeric identity is the trust sub claim; this selector is setup metadata, not an assertion claim.
    properties:
      service_account: { type: string, minLength: 1, maxLength: 280 }
  ProjectWorkloadGitHub:
    type: object
    additionalProperties: false
    description: Immutable repository metadata verified during trusted manager apply; job assertions never establish this binding. Unchanged applies reuse the saved binding.
    required: [repository, repository_id, repository_owner_id, workflow_ref, ref, events]
    properties:
      repository: { type: string, maxLength: 256 }
      repository_id: { type: string, pattern: "^[1-9][0-9]{0,19}$" }
      repository_owner_id: { type: string, pattern: "^[1-9][0-9]{0,19}$" }
      default_branch:
        type: string
        minLength: 1
        maxLength: 512
        description: Repository default branch resolved during trusted apply; reused when the declaration omits branch and tag.
      workflow_ref: { type: string, maxLength: 1024 }
      ref: { type: string, maxLength: 512 }
      events: { type: array, minItems: 1, maxItems: 10, uniqueItems: true, items: { type: string } }
      environment: { type: string, maxLength: 256 }
      job_workflow_ref: { type: string, maxLength: 1024 }
  ProjectTargetDiscovery:
    type: object
    additionalProperties: false
    required: [type, region]
    properties:
      type: { type: string, enum: [eks, rds] }
      region: { type: string, maxLength: 64 }
      cluster: { type: string, maxLength: 100 }
      instance: { type: string, maxLength: 100 }
      endpoint: { type: string, enum: [writer, reader] }
    description: Exact provider selector resolved by the assigned publisher with its own AWS credentials. Control does not discover targets or credentials. EKS requires kubernetes; RDS requires postgres or mysql, verified against provider metadata.
  ProjectWebhook:
    type: object
    additionalProperties: false
    required: [service, path, provider]
    properties:
      service: { type: string, minLength: 1, maxLength: 32 }
      path: { type: string, minLength: 1, maxLength: 2048 }
      provider: { $ref: "../openapi.yaml#/components/schemas/WebhookProvider" }
      delivery: { type: string, pattern: "^(fanout|selected)$" }
      methods:
        type: array
        maxItems: 7
        uniqueItems: true
        items: { type: string, pattern: "^(POST|GET|PUT|PATCH|DELETE|HEAD|OPTIONS)$" }
      source_ips:
        type: array
        minItems: 1
        maxItems: 256
        uniqueItems: true
        items: { type: string, minLength: 1, maxLength: 64 }
  ProjectServiceConfiguration:
    type: object
    additionalProperties: false
    required: [target]
    properties:
      name: { type: string, maxLength: 32 }
      protocol: { $ref: "../openapi.yaml#/components/schemas/ServiceProtocol" }
      target:
        type: string
        maxLength: 8192
        description: Public URL targets are HTTP/HTTPS origins with an explicit port and no trailing slash. Service targets normalize to host:port with separate target_tls trust. The app descriptor defers an HTTP public URL listener to its application owner in any deployment. Only local declarations may use compose:SERVICE:PORT or docker:CONTAINER:PORT descriptors; control does not discover targets.
      target_discovery: { $ref: "../openapi.yaml#/components/schemas/ProjectTargetDiscovery" }
      public:
        type: boolean
        description: Public endpoint access for this service binding, independent of visitor authorization. Local bindings allocate only when realized by an authorized worktree. False keeps connector access only. Overrides the retained deployment default. Mutually exclusive with public_url.
      public_url: { $ref: "../openapi.yaml#/components/schemas/ProjectServicePublicURL" }
      target_tls: { $ref: "../openapi.yaml#/components/schemas/ProjectTargetTLS" }
      access: { $ref: "../openapi.yaml#/components/schemas/ProjectServiceAccess" }
      http: { $ref: "../openapi.yaml#/components/schemas/ProjectServiceHTTP" }
  ProjectServiceHTTP:
    type: object
    additionalProperties: false
    description: Local readiness and path mounts, or restricted HTTP access and request limits for a saved deployment. The deployment owns its endpoint and reachability.
    properties:
      access: { $ref: "../openapi.yaml#/components/schemas/ProjectPublicAccess" }
      limits: { $ref: "../openapi.yaml#/components/schemas/ProjectHTTPApplicationLimits" }
      readiness:
        type: object
        additionalProperties: false
        required: [path]
        properties:
          path: { type: string, minLength: 1, maxLength: 2048 }
      paths:
        type: object
        maxProperties: 32
        additionalProperties:
          type: object
          additionalProperties: false
          required: [service]
          properties:
            service: { type: string }
            strip_prefix: { type: boolean }
      open: { type: boolean }
  ProjectServicePublicURL:
    type: object
    additionalProperties: false
    properties:
      require_post_quantum: { type: boolean }
      domain_id: { type: string }
      hostname: { type: string, maxLength: 253 }
      access: { $ref: "../openapi.yaml#/components/schemas/ProjectPublicAccess" }
      limits: { $ref: "../openapi.yaml#/components/schemas/ProjectPublicLimits" }
      ephemeral:
        type: boolean
        default: false
        description: Local declarations may request an ephemeral worktree URL.
    description: Enables an HTTP public URL. Local URLs belong to the developer preview; remote saved URLs belong to the team/project/deployment and retain their own visitor policy. Remote declarations cannot mark a named URL ephemeral; unnamed application publication allocates temporary URLs separately.
  ProjectPublicAccess:
    type: object
    additionalProperties: false
    properties:
      mode: { $ref: "../openapi.yaml#/components/schemas/VisitorAccessMode" }
      ip:
        type: array
        minItems: 1
        maxItems: 256
        uniqueItems: true
        items: { type: string, maxLength: 64 }
  ProjectPublicLimits:
    type: object
    additionalProperties: false
    properties:
      http: { $ref: "../openapi.yaml#/components/schemas/ProjectHTTPApplicationLimits" }
      traffic: { $ref: "../openapi.yaml#/components/schemas/TrafficSelection" }
  ProjectHTTPApplicationLimits:
    type: object
    additionalProperties: false
    properties:
      total: { type: integer, minimum: 1, maximum: 9007199254740991 }
      concurrency: { type: integer, minimum: 1, maximum: 9007199254740991 }
      rate: { $ref: "../openapi.yaml#/components/schemas/ProjectApplicationRate" }
  ProjectApplicationRate:
    type: object
    additionalProperties: false
    required: [count, per]
    properties:
      count: { type: integer, minimum: 1, maximum: 9007199254740991 }
      per: { type: string, minLength: 1, maxLength: 64 }
      burst: { type: integer, minimum: 1, maximum: 9007199254740991 }
  ProjectTargetTLS:
    type: object
    additionalProperties: false
    required: [hostname]
    description: "Publisher-to-target TLS trust, separate from visitor TLS. ca_pem adds CA certificates to the publisher's system roots. Control computes digest from the exact hostname and CA bytes. Omit it when changing trust settings; a supplied digest must match."
    properties:
      hostname: { type: string, minLength: 1, maxLength: 253 }
      ca_pem:
        {
          "type": "string",
          "maxLength": 1048576,
          "description": "CA certificates in PEM format, not a file path or URL. Do not include private keys.",
        }
      digest:
        {
          "type": "string",
          "pattern": "^[0-9a-f]{64}$",
          "x-go-type-skip-optional-pointer": true,
          "description": "Computed by control and included in resolved configuration. Callers may omit it.",
        }
  ProjectServiceAccess:
    type: object
    additionalProperties: false
    required: [team]
    properties:
      team: { type: boolean, enum: [true] }
  AppliedProjectConfiguration:
    type: object
    additionalProperties: false
    required:
      [
        team_id,
        deployment,
        service_declarations,
        project_key,
        source_fingerprint,
        revision,
        configuration_hash,
        configuration,
        services,
        members,
      ]
    properties:
      retired_at:
        {
          type: string,
          format: date-time,
          description: "Present after retirement. The saved source and revision remain; an apply with this exact current revision reactivates the project.",
        }
      team_id: { type: string }
      project_key: { type: string }
      source_fingerprint: { type: string }
      revision:
        {
          type: string,
          pattern: "^[0-9]+$",
          x-go-type: int64,
          x-oapi-codegen-extra-tags: { json: "revision,string" },
        }
      configuration_hash: { type: string }
      deployment: { type: string }
      service_declarations:
        { $ref: "../openapi.yaml#/components/schemas/ProjectServiceDeclarations" }
      configuration: { $ref: "../openapi.yaml#/components/schemas/ProjectConfiguration" }
      services:
        {
          type: array,
          items: { $ref: "../openapi.yaml#/components/schemas/AppliedProjectService" },
        }
      members:
        {
          type: array,
          items: { $ref: "../openapi.yaml#/components/schemas/DeploymentPublisherStatus" },
        }
      deployments:
        { type: array, items: { $ref: "../openapi.yaml#/components/schemas/AppliedDeployment" } }
  AppliedDeployment:
    type: object
    required: [id, name, deployment_names, namespace, domain_id, public]
    properties:
      id: { type: string }
      name: { type: string }
      deployment_names:
        type: array
        description: Authoritative current and historical selectors permanently bound to this deployment ID.
        items: { type: string }
      namespace: { type: string }
      domain_id: { type: string }
      public: { type: boolean }
  AppliedProjectService:
    type: object
    required: [service, deployment, service_kind, desired_revision, trust_revision]
    properties:
      service: { type: string }
      deployment: { type: string }
      service_kind: { type: string, enum: [public_url, service, local] }
      service_id: { type: string }
      hostname: { type: string }
      desired_revision:
        {
          type: string,
          pattern: "^[0-9]+$",
          x-go-type: int64,
          x-oapi-codegen-extra-tags: { json: "desired_revision,string" },
        }
      trust_revision:
        {
          type: string,
          pattern: "^[0-9]+$",
          x-go-type: int64,
          x-oapi-codegen-extra-tags: { json: "trust_revision,string" },
        }
      port: { type: integer, minimum: 1024, maximum: 65535 }
      public: { type: boolean }
  LocalServiceSource:
    type: object
    additionalProperties: false
    required: [project_key, source_fingerprint, service, worktree_key]
    properties:
      project_key: { type: string }
      source_fingerprint: { type: string, pattern: "^[0-9a-f]{64}$" }
      service: { type: string }
      worktree_key: { type: string }
