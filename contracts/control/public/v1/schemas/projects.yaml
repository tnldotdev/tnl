schemas:
  ProjectPublicMetadata:
    type: object
    additionalProperties: false
    required: [source_fingerprint, services]
    properties:
      source_fingerprint: { type: string }
      services:
        type: array
        items:
          type: object
          additionalProperties: false
          required: [service, hostname, port]
          properties:
            service: { type: string }
            public_url_id: { $ref: "../openapi.yaml#/components/schemas/PublicURLID" }
            service_id: { $ref: "../openapi.yaml#/components/schemas/ServiceID" }
            port: { type: integer, minimum: 1, maximum: 65535 }
            hostname: { type: string }
  RealizeLocalProjectServiceRequest:
    type: object
    additionalProperties: false
    required: [team_id, source_fingerprint, worktree_key, configuration]
    properties:
      team_id: { type: string }
      source_fingerprint: { type: string, pattern: "^[0-9a-f]{64}$" }
      worktree_key: { type: string, minLength: 1, maxLength: 128 }
      worktree_label: { type: string, minLength: 1, maxLength: 63 }
      domain_id: { $ref: "../openapi.yaml#/components/schemas/DomainID" }
      public_url_id: { $ref: "../openapi.yaml#/components/schemas/PublicURLID" }
      configuration: { $ref: "../openapi.yaml#/components/schemas/LocalServiceDeclaration" }
  LocalProjectService:
    type: object
    additionalProperties: false
    required: [service, worktree_key, service_kind, service_id]
    properties:
      service: { type: string }
      worktree_key: { type: string }
      service_kind: { type: string, enum: [service, public_url] }
      service_id: { type: string }
      hostname: { type: string }
      metadata: { $ref: "../openapi.yaml#/components/schemas/ServiceMetadata" }
  ProjectWorkload:
    type: object
    additionalProperties: false
    required: [provider, trust, services, max_duration_seconds]
    properties:
      provider: { $ref: "../openapi.yaml#/components/schemas/WorkloadProvider" }
      trust: { $ref: "../openapi.yaml#/components/schemas/WorkloadTrust" }
      github: { $ref: "../openapi.yaml#/components/schemas/ProjectWorkloadGitHub" }
      google: { $ref: "../openapi.yaml#/components/schemas/ProjectWorkloadGoogle" }
      kubernetes: { $ref: "../openapi.yaml#/components/schemas/ProjectWorkloadKubernetes" }
      gitlab: { $ref: "../openapi.yaml#/components/schemas/ProjectWorkloadGitLab" }
      services:
        type: array
        minItems: 1
        maxItems: 32
        uniqueItems: true
        items: { type: string }
      max_duration_seconds:
        type: integer
        minimum: 0
        maximum: 9223372036
        description: Optional absolute session limit in seconds. Zero means no hard limit; permission leases and verified platform-proof expiry still apply.
  ProjectWorkloadGitLab:
    type: object
    additionalProperties: false
    required: [server, project, project_id, namespace_id]
    properties:
      server: { type: string, minLength: 1, maxLength: 1024 }
      project: { type: string, minLength: 1, maxLength: 512 }
      project_id: { type: string, minLength: 1, maxLength: 32 }
      namespace_id: { type: string, minLength: 1, maxLength: 32 }
      default_branch: { type: string, minLength: 1, maxLength: 512 }
  ProjectWorkloadKubernetes:
    type: object
    additionalProperties: false
    required: [context, cluster_server, namespace, service_account]
    description: Trusted setup selectors retained for unchanged applies. The trust sub and service_account_uid claims define the approved service account identity; runtime never reads these setup selectors as credentials.
    properties:
      context: { type: string, minLength: 1, maxLength: 1024 }
      cluster_server: { type: string, minLength: 1, maxLength: 4096 }
      namespace: { type: string, minLength: 1, maxLength: 63 }
      service_account: { type: string, minLength: 1, maxLength: 253 }
  ProjectWorkloadGoogle:
    type: object
    additionalProperties: false
    required: [service_account]
    description: Service account selector retained by trusted apply. The verified numeric identity is the trust sub claim; this selector is setup metadata, not an assertion claim.
    properties:
      service_account: { type: string, minLength: 1, maxLength: 280 }
  ProjectWorkloadGitHub:
    type: object
    additionalProperties: false
    description: Immutable repository metadata verified during trusted manager apply; job assertions never establish this binding. Unchanged applies reuse the saved binding.
    required: [repository, repository_id, repository_owner_id, workflow_ref, ref, events]
    properties:
      repository: { type: string, maxLength: 256 }
      repository_id: { type: string, pattern: "^[1-9][0-9]{0,19}$" }
      repository_owner_id: { type: string, pattern: "^[1-9][0-9]{0,19}$" }
      default_branch:
        type: string
        minLength: 1
        maxLength: 512
        description: Repository default branch resolved during trusted apply; reused when the declaration omits branch and tag.
      workflow_ref: { type: string, maxLength: 1024 }
      ref: { type: string, maxLength: 512 }
      events: { type: array, minItems: 1, maxItems: 10, uniqueItems: true, items: { type: string } }
      environment: { type: string, maxLength: 256 }
      job_workflow_ref: { type: string, maxLength: 1024 }
  ProjectTargetDiscovery:
    type: object
    additionalProperties: false
    required: [type, region]
    properties:
      type: { type: string, enum: [eks, rds] }
      region: { type: string, maxLength: 64 }
      cluster: { type: string, maxLength: 100 }
      instance: { type: string, maxLength: 100 }
      endpoint: { type: string, enum: [writer, reader] }
    description: Exact provider selector resolved by the assigned publisher with its own AWS credentials. Control does not discover targets or credentials. EKS requires kubernetes; RDS requires postgres or mysql, verified against provider metadata.
  ProjectWebhook:
    type: object
    additionalProperties: false
    required: [service, path, provider]
    properties:
      service: { type: string, minLength: 1, maxLength: 32 }
      path: { type: string, minLength: 1, maxLength: 2048 }
      provider: { $ref: "../openapi.yaml#/components/schemas/WebhookProvider" }
      delivery: { type: string, pattern: "^(fanout|selected)$" }
      methods:
        type: array
        maxItems: 7
        uniqueItems: true
        items: { type: string, pattern: "^(POST|GET|PUT|PATCH|DELETE|HEAD|OPTIONS)$" }
      source_ips:
        type: array
        minItems: 1
        maxItems: 256
        uniqueItems: true
        items: { type: string, minLength: 1, maxLength: 64 }
  LocalServiceDeclaration:
    type: object
    additionalProperties: false
    required: [target]
    properties:
      name: { type: string, maxLength: 32 }
      protocol: { $ref: "../openapi.yaml#/components/schemas/ServiceProtocol" }
      target:
        type: string
        maxLength: 8192
        description: Public URL targets are HTTP/HTTPS origins with an explicit port and no trailing slash. Service targets normalize to host:port with separate target_tls trust. Only local declarations may use deferred app, compose:SERVICE:PORT, or docker:CONTAINER:PORT descriptors; control does not discover targets.
      target_discovery: { $ref: "../openapi.yaml#/components/schemas/ProjectTargetDiscovery" }
      public_url: { $ref: "../openapi.yaml#/components/schemas/ProjectServicePublicURL" }
      target_tls: { $ref: "../openapi.yaml#/components/schemas/ProjectTargetTLS" }
      access: { $ref: "../openapi.yaml#/components/schemas/ProjectServiceAccess" }
      http: { $ref: "../openapi.yaml#/components/schemas/ProjectServiceHTTP" }
  ProjectServiceHTTP:
    type: object
    additionalProperties: false
    description: Local listener readiness, browser opening and path mounts. Remote environment HTTP policy has its own serving-owner contract.
    properties:
      readiness:
        type: object
        additionalProperties: false
        required: [path]
        properties:
          path: { type: string, minLength: 1, maxLength: 2048 }
      paths:
        type: object
        maxProperties: 32
        additionalProperties:
          type: object
          additionalProperties: false
          required: [service]
          properties:
            service: { type: string }
            strip_prefix: { type: boolean }
      open: { type: boolean }
  ProjectServicePublicURL:
    type: object
    additionalProperties: false
    properties:
      require_post_quantum: { type: boolean }
      domain_id: { type: string }
      hostname: { type: string, maxLength: 253 }
      access: { $ref: "../openapi.yaml#/components/schemas/ProjectPublicAccess" }
      limits: { $ref: "../openapi.yaml#/components/schemas/ProjectPublicLimits" }
      ephemeral:
        type: boolean
        default: false
        description: Local declarations may request an ephemeral worktree URL.
    description: Enables a local service's public URL. Remote environment service endpoints are separate resources.
  ProjectPublicAccess:
    type: object
    additionalProperties: false
    properties:
      mode: { $ref: "../openapi.yaml#/components/schemas/VisitorAccessMode" }
      ip:
        type: array
        minItems: 1
        maxItems: 256
        uniqueItems: true
        items: { type: string, maxLength: 64 }
  ProjectPublicLimits:
    type: object
    additionalProperties: false
    properties:
      http: { $ref: "../openapi.yaml#/components/schemas/ProjectHTTPApplicationLimits" }
      traffic: { $ref: "../openapi.yaml#/components/schemas/TrafficSelection" }
  ProjectHTTPApplicationLimits:
    type: object
    additionalProperties: false
    properties:
      total: { type: integer, minimum: 1, maximum: 9007199254740991 }
      concurrency: { type: integer, minimum: 1, maximum: 9007199254740991 }
      rate: { $ref: "../openapi.yaml#/components/schemas/ProjectApplicationRate" }
  ProjectApplicationRate:
    type: object
    additionalProperties: false
    required: [count, per]
    properties:
      count: { type: integer, minimum: 1, maximum: 9007199254740991 }
      per: { type: string, minLength: 1, maxLength: 64 }
      burst: { type: integer, minimum: 1, maximum: 9007199254740991 }
  ProjectTargetTLS:
    type: object
    additionalProperties: false
    required: [hostname, digest]
    description: Publisher-to-target TLS trust, independent of visitor TLS. The protocol selects native negotiation. ca_pem is a CA-only snapshot added to the publisher's system roots. digest is lowercase SHA-256 of "tnl-target-tls/v1", NUL, hostname, NUL, and ca_pem.
    properties:
      hostname: { type: string, minLength: 1, maxLength: 253 }
      ca_pem: { type: string, maxLength: 1048576 }
      digest: { type: string, pattern: "^[0-9a-f]{64}$" }
  ProjectServiceAccess:
    type: object
    additionalProperties: false
    required: [team]
    properties:
      team: { type: boolean, enum: [true] }
  LocalServiceSource:
    type: object
    additionalProperties: false
    required: [project_key, source_fingerprint, service, worktree_key]
    properties:
      project_key: { type: string }
      source_fingerprint: { type: string, pattern: "^[0-9a-f]{64}$" }
      service: { type: string }
      worktree_key: { type: string }
