schemas:
  ReleaseServiceEndpointRequest:
    type: object
    additionalProperties: false
    required: [expected_endpoint_revision, expected_port]
    properties:
      expected_endpoint_revision:
        type: string
        pattern: "^[0-9]+$"
        x-go-type: int64
        x-oapi-codegen-extra-tags: { json: "expected_endpoint_revision,string" }
      expected_port: { type: integer, minimum: 1024, maximum: 65535 }
  UpdateServiceRequest:
    type: object
    additionalProperties: false
    required: [protocol, publisher_pool, expected_trust_revision]
    dependentRequired:
      expected_configuration_digest: [configuration]
      unconditional_configuration: [configuration]
    dependentSchemas:
      configuration:
        oneOf:
          - required: [expected_configuration_digest]
            not: { required: [unconditional_configuration] }
          - required: [unconditional_configuration]
            not: { required: [expected_configuration_digest] }
    description: "Replacement service settings. Copy trust_revision into expected_trust_revision; a stale revision is rejected independently of the full configuration fingerprint and pool condition. Supplied configuration replaces a standalone service's entire declaration on the same service ID; omitted settings return to defaults, including restricted HTTP access and no IP filter or request-limit overrides. Protocol and target_tls must agree with it. Every configuration replacement requires the unquoted ETag token from getServiceConfiguration as expected_configuration_digest, or an explicit unconditional_configuration: true instead. A stale digest conflicts before any service write, even when trust_revision has not changed. To protect a read publisher_pool value, send it as expected_publisher_pool. Conditions describe observed state, not desired settings. Omitting configuration is a distinct metadata-only update that retains the saved declaration, which must still agree with the metadata. Allocated and project-managed declarations cannot be changed here."
    properties:
      expected_trust_revision:
        {
          type: string,
          pattern: "^[0-9]+$",
          x-go-type: int64,
          x-oapi-codegen-extra-tags: { json: "expected_trust_revision,string" },
        }
      protocol: { $ref: "../openapi.yaml#/components/schemas/ServiceProtocol" }
      target_tls: { $ref: "../openapi.yaml#/components/schemas/ServiceTargetTLS" }
      publisher_pool: { type: boolean }
      expected_publisher_pool:
        type: boolean
        description: Observed publisher_pool value, not the desired setting. A mismatch with the locked service conflicts independently of trust and declaration conditions. Omit for an unconditional pool replacement; null is invalid.
      configuration: { $ref: "../openapi.yaml#/components/schemas/ProjectServiceConfiguration" }
      expected_configuration_digest:
        type: string
        minLength: 71
        maxLength: 71
        pattern: "^sha256:[0-9a-f]{64}$"
        description: Observed full configuration fingerprint, without ETag quotes. Required for configuration replacement unless unconditional_configuration is true; the two are mutually exclusive. Also covers the absence of a saved declaration.
      unconditional_configuration:
        type: boolean
        const: true
        x-go-type: bool
        description: Explicitly replace configuration without checking its current fingerprint. Requires configuration and excludes expected_configuration_digest. Does not bypass trust revision, publisher-pool conditions, authorization, or validation.
  ServiceInvitationCredential:
    type: object
    additionalProperties: false
    required: [secret]
    properties:
      secret: { type: string, minLength: 32, maxLength: 128 }
  ServiceSelection:
    type: object
    additionalProperties: false
    required:
      [service_id, service_run_id, run_number, subject, expires_at, protocol, trust_revision]
    properties:
      service_id: { $ref: "../openapi.yaml#/components/schemas/ServiceID" }
      service_run_id: { $ref: "../openapi.yaml#/components/schemas/ServiceRunID" }
      run_number:
        {
          type: string,
          pattern: "^[0-9]+$",
          x-go-type: int64,
          x-oapi-codegen-extra-tags: { json: "run_number,string" },
        }
      subject: { $ref: "../openapi.yaml#/components/schemas/VisitorSubject" }
      expires_at: { type: string, format: date-time }
      protocol: { $ref: "../openapi.yaml#/components/schemas/ServiceProtocol" }
      trust_revision:
        {
          type: string,
          pattern: "^[0-9]+$",
          x-go-type: int64,
          x-oapi-codegen-extra-tags: { json: "trust_revision,string" },
        }
      endpoint: { $ref: "../openapi.yaml#/components/schemas/ServiceEndpoint" }
      pair_ready: { $ref: "../openapi.yaml#/components/schemas/ConnectorPeerPairReady" }
      kubernetes_auth: { $ref: "../openapi.yaml#/components/schemas/KubernetesAuth" }
  ServiceID:
    type: string
    pattern: "^svc_[A-Za-z0-9]{22}$"
  ServiceInvitationID:
    type: string
    pattern: "^sivt_[A-Za-z0-9]{22}$"
  ServiceGrantID:
    type: string
    pattern: "^sgr_[A-Za-z0-9]{22}$"
  ServiceName:
    type: string
    pattern: "^[a-z](?:[a-z0-9-]{0,30}[a-z0-9])?$"
    maxLength: 32
  CreateServiceRequest:
    type: object
    additionalProperties: false
    required: [team_id, name]
    properties:
      team_id: { $ref: "../openapi.yaml#/components/schemas/TeamID" }
      name: { $ref: "../openapi.yaml#/components/schemas/ServiceName" }
      reserve:
        type: boolean
        default: false
        description: Create or recover one exact standalone service at the explicit domain and hostname, without reading team inventory. Requires a service-owned declaration and no worktree placement. Current members may reserve HTTP in their own namespace; shared names require current team administration. Recovery returns current intent without replacing it. This request flag does not select durable ownership, visitor permission, or publisher capability.
      protocol: { $ref: "../openapi.yaml#/components/schemas/ServiceProtocol" }
      target_tls: { $ref: "../openapi.yaml#/components/schemas/ServiceTargetTLS" }
      publisher_pool: { type: boolean, default: false }
      placement: { $ref: "../openapi.yaml#/components/schemas/ServicePlacement" }
      configuration:
        $ref: "../openapi.yaml#/components/schemas/ProjectServiceConfiguration"
        description: Optional service-owned declaration. Control normalizes and encrypts it without creating project or deployment provenance. Explicit protocol, target trust, hostname, and domain selections must agree with the declaration. Exact create retries recover only equivalent normalized intent.
  ServicePlacement:
    type: object
    additionalProperties: false
    properties:
      domain_id: { $ref: "../openapi.yaml#/components/schemas/DomainID" }
      hostname: { type: string, minLength: 1, maxLength: 253 }
      worktree_key: { type: string, minLength: 1, maxLength: 128 }
      worktree_label: { type: string, minLength: 1, maxLength: 63 }
  ServiceProtocol:
    type: string
    enum: [http, tcp, mysql, postgres, kubernetes]
    x-enum-varnames: [ServiceProtocolHTTP, Tcp, Mysql, Postgres, Kubernetes]
  ServiceTargetTLS:
    type: object
    additionalProperties: false
    required: [hostname, system, digest]
    description: Approved publisher-to-target trust. This never selects or disables visitor TLS.
    properties:
      hostname: { type: string, minLength: 1, maxLength: 253 }
      system: { type: boolean }
      pem: { type: string, maxLength: 1048576 }
      digest: { type: string, pattern: "^[0-9a-f]{64}$" }
  ServiceMetadata:
    type: object
    additionalProperties: false
    required: [protocol, publisher_pool, trust_revision]
    properties:
      protocol: { $ref: "../openapi.yaml#/components/schemas/ServiceProtocol" }
      target_tls: { $ref: "../openapi.yaml#/components/schemas/ServiceTargetTLS" }
      publisher_pool: { type: boolean }
      trust_revision:
        {
          type: string,
          pattern: "^[0-9]+$",
          x-go-type: int64,
          x-oapi-codegen-extra-tags: { json: "trust_revision,string" },
        }
      endpoint: { $ref: "../openapi.yaml#/components/schemas/ServiceEndpoint" }
  ServiceRunDeclaration:
    type: object
    additionalProperties: false
    required: [protocol, trust_revision]
    properties:
      preferred_regions:
        $ref: "./common.yaml#/schemas/PreferredRegions"
      traffic:
        $ref: "../openapi.yaml#/components/schemas/TrafficSelection"
      protocol: { $ref: "../openapi.yaml#/components/schemas/ServiceProtocol" }
      target_tls: { $ref: "../openapi.yaml#/components/schemas/ServiceTargetTLS" }
      trust_revision:
        {
          type: string,
          pattern: "^[0-9]+$",
          x-go-type: int64,
          x-oapi-codegen-extra-tags: { json: "trust_revision,string" },
        }
  Service:
    type: object
    additionalProperties: false
    description: Saved service and its approved protocol/TLS trust. service_run_id and run_number are an optional ready-publisher hint; select a run before each new connection.
    required:
      [
        id,
        name,
        enabled,
        created_at,
        protocol,
        publisher_pool,
        trust_revision,
        endpoint_revision,
        service_revision,
        ephemeral,
        require_post_quantum,
      ]
    dependentRequired:
      service_run_id: [run_number]
      run_number: [service_run_id]
    properties:
      id: { $ref: "../openapi.yaml#/components/schemas/ServiceID" }
      team_id:
        {
          $ref: "../openapi.yaml#/components/schemas/TeamID",
          x-go-type-skip-optional-pointer: true,
        }
      guest_id:
        {
          $ref: "../openapi.yaml#/components/schemas/GuestID",
          x-go-type-skip-optional-pointer: true,
        }
      domain_id: { $ref: "../openapi.yaml#/components/schemas/DomainID" }
      placement: { $ref: "../openapi.yaml#/components/schemas/ServicePlacement" }
      source: { $ref: "../openapi.yaml#/components/schemas/LocalServiceSource" }
      name: { $ref: "../openapi.yaml#/components/schemas/ServiceName" }
      enabled: { type: boolean }
      ephemeral: { type: boolean }
      expires_at:
        type: string
        format: date-time
        description: Fixed service expiration. Publisher renewal cannot extend it.
      require_post_quantum: { type: boolean }
      endpoint: { $ref: "../openapi.yaml#/components/schemas/ServiceEndpoint" }
      endpoint_revision:
        type: string
        pattern: "^[0-9]+$"
        x-go-type: int64
        x-oapi-codegen-extra-tags: { json: "endpoint_revision,string" }
        description: Revision of the hostname, domain, ingress pool, and port reservation. Independent of target trust and connector permission.
      service_revision:
        type: string
        pattern: "^[1-9][0-9]*$"
        x-go-type: int64
        x-oapi-codegen-extra-tags: { json: "service_revision,string" }
        description: Current saved-service settings revision. Advances for metadata, configuration, enablement, endpoint, and service visitor-grant changes, not run preparation or heartbeat churn. Use as expected_service_revision for ordinary deletion; a configuration digest or trust revision is not a substitute.
      http_limits:
        $ref: "../openapi.yaml#/components/schemas/ProjectHTTPApplicationLimits"
        description: Approved run-local HTTP request limits returned to the scoped publisher. Applies after visitor authorization on public and connector admissions.
      http_request_body_idle_timeout:
        type: string
        minLength: 1
        maxLength: 64
        description: Approved request-body idle timeout returned only to the scoped HTTP publisher. Omission uses 30s; a configured value is a positive Go duration. Counts active incoming body reads, not target backpressure, responses, or upgrades.
      protocol: { $ref: "../openapi.yaml#/components/schemas/ServiceProtocol" }
      kubernetes_auth: { $ref: "../openapi.yaml#/components/schemas/KubernetesAuth" }
      target_tls: { $ref: "../openapi.yaml#/components/schemas/ServiceTargetTLS" }
      publisher_pool: { type: boolean }
      trust_revision:
        {
          type: string,
          pattern: "^[0-9]+$",
          x-go-type: int64,
          x-oapi-codegen-extra-tags: { json: "trust_revision,string" },
        }
      created_at: { type: string, format: date-time }
      service_run_id:
        {
          $ref: "../openapi.yaml#/components/schemas/ServiceRunID",
          description: Present for a ready run with a live publisher grant and at least one live ready publisher connection; first readiness requires two.,
        }
      run_number:
        {
          type: string,
          description: "Present only alongside service_run_id.",
          pattern: "^[0-9]+$",
          x-go-type: int64,
          x-oapi-codegen-extra-tags: { json: "run_number,omitempty,string" },
        }
    not:
      anyOf:
        - required: [team_id, guest_id]
        - not:
            anyOf:
              - required: [team_id]
              - required: [guest_id]
  ServiceAccessPath:
    type: string
    enum: [connector, public_endpoint]
    x-enum-varnames: [ServiceAccessPathConnector, ServiceAccessPathPublicEndpoint]
    default: connector
  SetServiceEnabledRequest:
    type: object
    additionalProperties: false
    required: [enabled]
    properties:
      enabled:
        type: boolean
        x-go-type: "*bool"
        description: False suspends publication; true allows new runs after current authorization checks.
  ServiceSummary:
    type: object
    additionalProperties: false
    description: "Service identity, placement, and an optional run. Omits target trust, target addresses, credentials, and publisher HTTP limits."
    required:
      [
        id,
        name,
        enabled,
        created_at,
        protocol,
        publisher_pool,
        trust_revision,
        require_post_quantum,
      ]
    dependentRequired:
      service_run_id: [run_number]
      run_number: [service_run_id]
    properties:
      id: { $ref: "../openapi.yaml#/components/schemas/ServiceID" }
      team_id:
        {
          $ref: "../openapi.yaml#/components/schemas/TeamID",
          x-go-type-skip-optional-pointer: true,
        }
      guest_id:
        {
          $ref: "../openapi.yaml#/components/schemas/GuestID",
          x-go-type-skip-optional-pointer: true,
        }
      domain_id: { $ref: "../openapi.yaml#/components/schemas/DomainID" }
      placement: { $ref: "../openapi.yaml#/components/schemas/ServicePlacement" }
      source: { $ref: "../openapi.yaml#/components/schemas/LocalServiceSource" }
      name: { $ref: "../openapi.yaml#/components/schemas/ServiceName" }
      team_name:
        type: string
        description: Actual stored team name. Present in signed-in visitor inventory; omitted in management inventory.
        x-go-type-skip-optional-pointer: true
      visitor_access:
        type: string
        enum: [owner, team_grant, identity_grant, preview_team]
        description: Current identity permission reason for the requested access path. Present in visitor inventory only; listing is not traffic authorization.
        x-go-type-skip-optional-pointer: true
      enabled: { type: boolean }
      require_post_quantum: { type: boolean }
      endpoint: { $ref: "../openapi.yaml#/components/schemas/ServiceEndpoint" }
      protocol: { $ref: "../openapi.yaml#/components/schemas/ServiceProtocol" }
      kubernetes_auth: { $ref: "../openapi.yaml#/components/schemas/KubernetesAuth" }
      publisher_pool: { type: boolean }
      trust_revision:
        {
          type: string,
          pattern: "^[0-9]+$",
          x-go-type: int64,
          x-oapi-codegen-extra-tags: { json: "trust_revision,string" },
        }
      created_at: { type: string, format: date-time }
      service_run_id: { $ref: "../openapi.yaml#/components/schemas/ServiceRunID" }
      run_number:
        {
          type: string,
          pattern: "^[0-9]+$",
          x-go-type: int64,
          x-oapi-codegen-extra-tags: { json: "run_number,omitempty,string" },
        }
    not:
      anyOf:
        - required: [team_id, guest_id]
        - not:
            anyOf:
              - required: [team_id]
              - required: [guest_id]
  ServicePage:
    type: object
    additionalProperties: false
    description: At most 100 service summaries. Inventory preserves identity, placement, source and selection hints but never includes publisher-only target_tls or http_limits. Fetch an exact service for its approved publisher trust and limits.
    required: [services]
    properties:
      services:
        {
          type: array,
          maxItems: 100,
          items: { $ref: "../openapi.yaml#/components/schemas/ServiceSummary" },
        }
      next_cursor: { $ref: "../openapi.yaml#/components/schemas/ServiceID" }
  CreateServiceGrantRequest:
    type: object
    additionalProperties: false
    required: [kind]
    properties:
      kind: { type: string, enum: [team, identity] }
      identity_id: { $ref: "../openapi.yaml#/components/schemas/IdentityID" }
      expires_at: { type: string, format: date-time }
  ServiceGrant:
    type: object
    additionalProperties: false
    required: [id, service_id, kind, created_at]
    properties:
      id: { $ref: "../openapi.yaml#/components/schemas/ServiceGrantID" }
      service_id: { $ref: "../openapi.yaml#/components/schemas/ServiceID" }
      kind: { type: string, enum: [team, identity] }
      identity_id: { $ref: "../openapi.yaml#/components/schemas/IdentityID" }
      invitation_id: { $ref: "../openapi.yaml#/components/schemas/ServiceInvitationID" }
      created_at: { type: string, format: date-time }
      expires_at: { type: string, format: date-time }
      revoked_at: { type: string, format: date-time }
  ServiceGrantPage:
    type: object
    additionalProperties: false
    required: [grants]
    properties:
      grants:
        type: array
        maxItems: 100
        items: { $ref: "../openapi.yaml#/components/schemas/ServiceGrant" }
      next_cursor: { $ref: "../openapi.yaml#/components/schemas/ServiceGrantID" }
  CreateServiceInvitationRequest:
    type: object
    additionalProperties: false
    required: [email, expires_at]
    properties:
      email: { type: string, format: email }
      expires_at: { type: string, format: date-time }
  ServiceInvitation:
    type: object
    additionalProperties: false
    required: [id, service_id, email, expires_at]
    properties:
      id: { $ref: "../openapi.yaml#/components/schemas/ServiceInvitationID" }
      service_id: { $ref: "../openapi.yaml#/components/schemas/ServiceID" }
      email: { type: string, format: email }
      expires_at: { type: string, format: date-time }
      accepted_at: { type: string, format: date-time }
      revoked_at: { type: string, format: date-time }
  ServiceInvitationCreation:
    type: object
    additionalProperties: false
    description: "Creation-only invitation metadata and credential. After signing in with the invited verified email, the recipient sends {secret: credential} to /v1/service-invitations/accept. Credentials cannot be recovered; an exact creation retry returns credential_delivery_unavailable with the invitation ID so you can revoke and reissue it."
    required: [invitation, credential]
    properties:
      invitation: { $ref: "../openapi.yaml#/components/schemas/ServiceInvitation" }
      credential: { type: string, minLength: 32, maxLength: 128 }
  ServiceInvitationPage:
    type: object
    additionalProperties: false
    required: [invitations]
    properties:
      invitations:
        type: array
        maxItems: 100
        items: { $ref: "../openapi.yaml#/components/schemas/ServiceInvitation" }
      next_cursor: { $ref: "../openapi.yaml#/components/schemas/ServiceInvitationID" }
  ServiceRunPreparation:
    type: object
    additionalProperties: false
    required:
      [
        service_id,
        service_run_id,
        run_number,
        run_token,
        publisher_identity_id,
        publisher_grant_id,
        publisher_key_id,
        idempotency_key,
        expires_at,
        hostname,
        domain_id,
        traffic,
        require_post_quantum,
      ]
    properties:
      team_id:
        {
          $ref: "../openapi.yaml#/components/schemas/TeamID",
          x-go-type-skip-optional-pointer: true,
        }
      guest_id:
        {
          $ref: "../openapi.yaml#/components/schemas/GuestID",
          x-go-type-skip-optional-pointer: true,
        }
      service_id: { $ref: "../openapi.yaml#/components/schemas/ServiceID" }
      service_run_id: { $ref: "../openapi.yaml#/components/schemas/ServiceRunID" }
      run_number:
        {
          type: string,
          pattern: "^[0-9]+$",
          x-go-type: int64,
          x-oapi-codegen-extra-tags: { json: "run_number,string" },
        }
      run_token:
        type: string
        minLength: 1
        maxLength: 4096
        description: Stable exact-run credential. Before Start, this credential permits only closing the preparation; it grants no serving authority.
      publisher_identity_id: { $ref: "../openapi.yaml#/components/schemas/ResourceID" }
      publisher_grant_id: { $ref: "../openapi.yaml#/components/schemas/ResourceID" }
      publisher_key_id: { $ref: "../openapi.yaml#/components/schemas/ResourceID" }
      idempotency_key: { $ref: "../openapi.yaml#/components/schemas/IdempotencyKey" }
      expires_at: { type: string, format: date-time }
      certificate_plan: { $ref: "../openapi.yaml#/components/schemas/CertificatePlan" }
      hostname: { type: string, minLength: 1, maxLength: 253 }
      run_hostname:
        type: string
        minLength: 1
        maxLength: 253
        description: Reserved exact-run HTTP hostname. It becomes usable only after public endpoint and alias readiness.
      domain_id: { $ref: "../openapi.yaml#/components/schemas/DomainID" }
      traffic: { $ref: "../openapi.yaml#/components/schemas/TrafficLimits" }
      require_post_quantum: { type: boolean }
    not:
      anyOf:
        - required: [team_id, guest_id]
        - not:
            anyOf:
              - required: [team_id]
              - required: [guest_id]
  ServiceRunSetup:
    type: object
    additionalProperties: false
    required:
      [service_id, service_run_id, run_number, run_token, visitor_source_key, publisher_connections]
    properties:
      service_id: { $ref: "../openapi.yaml#/components/schemas/ServiceID" }
      service_run_id: { $ref: "../openapi.yaml#/components/schemas/ServiceRunID" }
      run_number:
        {
          type: string,
          pattern: "^[0-9]+$",
          x-go-type: int64,
          x-oapi-codegen-extra-tags: { json: "run_number,string" },
        }
      run_token: { type: string, minLength: 1, maxLength: 4096 }
      visitor_source_key:
        type: string
        format: byte
        minLength: 44
        maxLength: 44
        description: Purpose-separated key for checking ingress source proofs for this run.
      publisher_connections:
        {
          type: array,
          minItems: 2,
          maxItems: 2,
          items: { $ref: "../openapi.yaml#/components/schemas/ConnectionAssignment" },
        }
  ServiceRunState:
    type: object
    additionalProperties: false
    required:
      [
        service_id,
        service_run_id,
        run_number,
        state,
        publisher_expires_at,
        observed_at,
        publisher_connections,
        endpoint_revision,
        public_endpoint_ready,
      ]
    properties:
      service_id: { $ref: "../openapi.yaml#/components/schemas/ServiceID" }
      service_run_id: { $ref: "../openapi.yaml#/components/schemas/ServiceRunID" }
      run_number:
        {
          type: string,
          pattern: "^[0-9]+$",
          x-go-type: int64,
          x-oapi-codegen-extra-tags: { json: "run_number,string" },
        }
      state: { type: string, enum: [starting, ready, closed] }
      endpoint_revision: { type: integer, format: int64, minimum: 1 }
      public_endpoint_ready:
        type: boolean
        description: The current public endpoint has compatible ingress and published or explicitly unmanaged DNS for this run. This fact does not grant access, extend authority, or affect connector readiness.
      run_hostname:
        type: string
        minLength: 1
        maxLength: 253
        description: The immutable hostname reserved for this run, when aliases were enabled at preparation.
      run_alias_ready:
        type: boolean
        description: Both the canonical endpoint and this run's exact alias have current public DNS and ingress readiness.
      publisher_expires_at: { type: string, format: date-time }
      policy_confirmation:
        $ref: "../openapi.yaml#/components/schemas/PublisherPolicyConfirmation"
        description: A fresh visitor-policy observation for a matching complete snapshot. The publisher lease and the watch do not confer this authority.
      alias_policy_confirmation:
        $ref: "../openapi.yaml#/components/schemas/PublisherPolicyConfirmation"
        description: A separate observation for the exact run_hostname, returned to publishers requesting alias policy confirmation.
      observed_at:
        type: string
        format: date-time
        description: Control observation used with publisher_expires_at to derive the local serving deadline from the request start.
      healthy: { type: boolean }
      stream_capacity: { type: integer, format: int32, minimum: 1, maximum: 1048576 }
      active_streams: { type: integer, format: int32, minimum: 0 }
      publisher_connections:
        {
          type: array,
          minItems: 2,
          maxItems: 2,
          items: { $ref: "../openapi.yaml#/components/schemas/ConnectionAssignment" },
        }
  ServiceRunHeartbeat:
    type: object
    additionalProperties: false
    required: [healthy, stream_capacity, active_streams]
    properties:
      healthy: { type: boolean }
      stream_capacity: { type: integer, format: int32, minimum: 1, maximum: 1048576 }
      active_streams: { type: integer, format: int32, minimum: 0 }
