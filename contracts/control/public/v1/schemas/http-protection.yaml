schemas:
  HTTPTemporaryBlock:
    type: object
    additionalProperties: false
    required: [source_ip, expires_at]
    x-go-type: httpprotection.TemporaryBlock
    x-go-type-import:
      name: httpprotection
      path: github.com/tnldotdev/tnl/internal/policy/httpprotection
    properties:
      source_ip: { type: string, maxLength: 45 }
      expires_at: { type: string, format: date-time }
  HTTPProtectionRejections:
    type: object
    additionalProperties: false
    required: [source_ip, started_at, ended_at, count, rule_ids]
    x-go-type: httpprotection.Rejections
    x-go-type-import:
      name: httpprotection
      path: github.com/tnldotdev/tnl/internal/policy/httpprotection
    properties:
      source_ip: { type: string, maxLength: 45 }
      started_at: { type: string, format: date-time }
      ended_at: { type: string, format: date-time }
      count: { type: integer, enum: [10] }
      rule_ids:
        type: array
        minItems: 1
        maxItems: 32
        items: { type: integer }
  ReportHTTPProtectionRejectionsRequest:
    type: object
    additionalProperties: false
    required: [resource, run_id, run_number, evidence]
    properties:
      resource: { $ref: "../openapi.yaml#/components/schemas/VisitorResourceScope" }
      run_id: { type: string, minLength: 1, maxLength: 64 }
      run_number:
        type: string
        pattern: "^[1-9][0-9]*$"
        x-go-type: int64
        x-oapi-codegen-extra-tags: { json: "run_number,string" }
      evidence: { $ref: "../openapi.yaml#/components/schemas/HTTPProtectionRejections" }
