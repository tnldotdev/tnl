schemas:
  PublisherVisitorPolicyRequest:
    type: object
    additionalProperties: false
    required: [resource, run_id, run_number, after_revision]
    properties:
      resource: { $ref: "../openapi.yaml#/components/schemas/VisitorResourceScope" }
      run_id: { type: string, maxLength: 64 }
      run_number:
        {
          type: string,
          pattern: "^[0-9]+$",
          x-go-type: int64,
          x-oapi-codegen-extra-tags: { json: "run_number,string" },
        }
      after_revision:
        {
          type: string,
          pattern: "^[0-9]+$",
          x-go-type: int64,
          x-oapi-codegen-extra-tags: { json: "after_revision,string" },
        }
  VisitorPolicyUpdate:
    type: object
    additionalProperties: false
    required: [policy, after_revision, revisions, snapshot_required]
    properties:
      policy: { $ref: "../openapi.yaml#/components/schemas/VisitorPolicySnapshot" }
      after_revision:
        {
          type: string,
          pattern: "^[0-9]+$",
          x-go-type: int64,
          x-oapi-codegen-extra-tags: { json: "after_revision,string" },
        }
      revisions:
        type: array
        x-go-type: RevisionList
        maxItems: 256
        items: { type: string, pattern: "^[0-9]+$" }
      snapshot_required: { type: boolean }
      visitor_source_key:
        type: string
        format: byte
        maxLength: 44
        description: Private public-run source key. Publishers receive the run master; ingress receives only the child key bound by visitor_source_authority. Never expose this value to a browser or relay.
      visitor_source_authority:
        type: string
        format: byte
        maxLength: 1368
        description: Opaque tunnelv1 source authority for the exact ingress process and public run. Present only in ingress preparation responses; it supplies neither visitor permission nor capacity.
  VisitorPolicySnapshot:
    type: object
    additionalProperties: false
    required:
      [
        resource,
        hostname,
        port,
        issuer,
        visitor_policy_revision,
        metadata_revision,
        key_revision,
        observed_at,
        valid_until,
        enabled,
        anonymous,
        verification_keys,
        workload_leases,
        registered_key_leases,
      ]
    properties:
      resource: { $ref: "../openapi.yaml#/components/schemas/VisitorResourceScope" }
      hostname: { type: string, maxLength: 253 }
      port:
        type: integer
        minimum: 0
        maximum: 65535
        description: Exact resource port binding. Zero is permitted only for a service without a public reservation and is never a wildcard.
      issuer: { type: string, format: uri, maxLength: 256 }
      visitor_policy_revision:
        {
          type: string,
          pattern: "^[0-9]+$",
          x-go-type: int64,
          x-oapi-codegen-extra-tags: { json: "visitor_policy_revision,string" },
        }
      metadata_revision:
        {
          type: string,
          description: "current service trust revision; zero for public URLs.",
          pattern: "^[0-9]+$",
          x-go-type: int64,
          x-oapi-codegen-extra-tags: { json: "metadata_revision,string" },
        }
      key_revision:
        {
          type: string,
          pattern: "^[0-9]+$",
          x-go-type: int64,
          x-oapi-codegen-extra-tags: { json: "key_revision,string" },
        }
      observed_at: { type: string, format: date-time }
      valid_until: { type: string, format: date-time }
      connection_deadline:
        type: string
        format: date-time
        description: "Latest allowed lifetime for guest visitor connections, including idle connections. Ingress forwards visitors only after the run is ready; ingress and publisher keep connections within this deadline. An enabled policy's valid_until cannot exceed it. Installing preparation policy does not grant visitor access."
      enabled: { type: boolean }
      anonymous: { type: boolean }
      verification_keys:
        type: array
        maxItems: 64
        items: { $ref: "../openapi.yaml#/components/schemas/VisitorVerificationKey" }
      workload_leases:
        type: array
        maxItems: 4096
        items: { $ref: "../openapi.yaml#/components/schemas/VisitorWorkloadLease" }
      registered_key_leases:
        type: array
        maxItems: 4096
        items: { $ref: "../openapi.yaml#/components/schemas/VisitorRegisteredKeyLease" }
      ip: { $ref: "../openapi.yaml#/components/schemas/VisitorPolicyIP" }
  VisitorVerificationKey:
    type: object
    additionalProperties: false
    required: [id, public_key]
    properties:
      id: { type: string, maxLength: 128 }
      public_key: { type: string, format: byte, maxLength: 44 }
  VisitorWorkloadLease:
    type: object
    additionalProperties: false
    required: [session_id, key_sha256, expires_at]
    properties:
      session_id: { type: string, pattern: "^wls_[A-Za-z0-9]{22}$" }
      key_sha256: { type: string, pattern: "^[A-Za-z0-9_-]{43}$" }
      expires_at: { type: string, format: date-time }
  VisitorRegisteredKeyLease:
    type: object
    additionalProperties: false
    required: [grant_id, key_id, key_sha256, expires_at]
    properties:
      grant_id: { type: string }
      key_id: { type: string }
      key_sha256: { type: string, pattern: "^[A-Za-z0-9_-]{43}$" }
      expires_at: { type: string, format: date-time }
  VisitorPolicyIP:
    type: object
    additionalProperties: false
    required: [key, prefixes]
    properties:
      key: { type: string, format: byte, maxLength: 44 }
      prefixes:
        type: array
        maxItems: 2048
        items: { $ref: "../openapi.yaml#/components/schemas/HashedIPPrefix" }
  HashedIPPrefix:
    type: object
    additionalProperties: false
    required: [family, prefix_length, digest]
    properties:
      family:
        type: string
        enum: [ipv4, ipv6]
      prefix_length:
        type: integer
        minimum: 0
        maximum: 128
      digest:
        type: string
        pattern: "^[A-Za-z0-9_-]{43}$"
