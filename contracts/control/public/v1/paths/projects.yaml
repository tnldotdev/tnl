paths:
  /v1/projects/resolve-source:
    post:
      operationId: resolveProjectSource
      summary: Resolve a project's portable source selector
      tags: [projects]
      security: [{ bearerAuth: [] }]
      description: Resolve a network Git origin and repository-relative configuration path to the existing portable project selector. Does not read a repository, evaluate configuration, create a project, or reserve a name. Branches, checkout directories, and configuration content do not affect this identity. Use the returned project_key with the configuration endpoint, passing these source facts on first apply.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "../openapi.yaml#/components/schemas/GitProjectSource" }
      responses:
        "200":
          description: Portable project selector and suggested label
          content:
            application/json:
              schema: { $ref: "../openapi.yaml#/components/schemas/ProjectSourceIdentity" }
        default: { $ref: "../openapi.yaml#/components/responses/Problem" }
  /v1/projects:
    get:
      operationId: listProjects
      summary: List applied projects
      tags: [projects]
      security: [{ bearerAuth: [] }]
      description: List applied project selectors for a current team manager, ordered by immutable project_key. Summaries contain no targets, configuration, or checkout paths. Use each selector with the configuration endpoint; its detail includes publisher group IDs and current members. Cursors are bound to this team, identity, and collection. Authorization is checked on every page.
      parameters:
        - { $ref: "../openapi.yaml#/components/parameters/TeamIDQuery" }
        - { name: cursor, in: query, schema: { type: string, maxLength: 2048 } }
      responses:
        "200":
          description: Up to 100 applied projects
          content:
            application/json:
              schema: { $ref: "../openapi.yaml#/components/schemas/ProjectPage" }
        default: { $ref: "../openapi.yaml#/components/responses/Problem" }
  /v1/projects/{project_key}/public-metadata:
    get:
      operationId: getProjectPublicMetadata
      tags: [projects]
      summary: Read visitor-safe project service identities and hostnames
      security: [{ bearerAuth: [] }]
      description: Browser-safe project source and public service IDs/hostnames, including exact local worktree realizations before or after first apply. Returns only public services the caller may visit, or all public services for a project manager. A service key may appear more than once for separate worktree URLs. Never returns configuration, targets, trust, grants, or publisher data.
      parameters:
        - { name: project_key, in: path, required: true, schema: { type: string } }
        - { $ref: "../openapi.yaml#/components/parameters/TeamIDQuery" }
      responses:
        "200":
          description: Authorized public service metadata
          content:
            application/json:
              schema: { $ref: "../openapi.yaml#/components/schemas/ProjectPublicMetadata" }
        default: { $ref: "../openapi.yaml#/components/responses/Problem" }
  /v1/projects/{project_key}/local-services/{service}:
    get:
      operationId: getLocalProjectService
      tags: [projects]
      summary: Resolve one existing source-bound worktree service
      security: [{ bearerAuth: [] }]
      description: Read the exact service previously realized for this team, project source, service key, and worktree. Requires current ordinary private visitor access, not project management access. Returns only immutable identity and approved visitor protocol/TLS metadata, never configuration, targets, or credentials. Does not realize or adopt a service. Missing or unauthorized bindings return not found; an authorized binding with another source fingerprint returns conflict. No other team, project, worktree, or saved name is searched.
      parameters:
        - {
            name: project_key,
            in: path,
            required: true,
            schema: { type: string, pattern: "^[a-z][a-z0-9-]{0,62}$" },
          }
        - {
            name: service,
            in: path,
            required: true,
            schema: { type: string, pattern: "^[a-z]([a-z0-9-]{0,30}[a-z0-9])?$" },
          }
        - { $ref: "../openapi.yaml#/components/parameters/TeamIDQuery" }
        - {
            name: source_fingerprint,
            in: query,
            required: true,
            schema: { type: string, pattern: "^[0-9a-f]{64}$" },
          }
        - {
            name: worktree_key,
            in: query,
            required: true,
            schema: { type: string, minLength: 1, maxLength: 128 },
          }
      responses:
        "200":
          description: Exact authorized local service and approved visitor metadata
          content:
            application/json:
              schema: { $ref: "../openapi.yaml#/components/schemas/LocalProjectService" }
        default: { $ref: "../openapi.yaml#/components/responses/Problem" }
    put:
      operationId: realizeLocalProjectService
      tags: [projects]
      summary: Realize one declared local service for a worktree
      security: [{ bearerAuth: [] }]
      description: Realize only one source-bound local service for one worktree. Private IDs are allocated here with worktree-scoped names, never adopted by name. Public IDs must be exact caller-owned app URLs already allocated by this runtime, bound to the caller's membership or to the caller's own personal team when current namespace authorization selects shared scope. Organization shared URLs and another member's or team's URLs are rejected. Records provenance before first apply; later apply reconciles that legitimate resource. When configuration has been applied the local declaration must match it. Does not apply remote group changes.
      parameters:
        - { name: project_key, in: path, required: true, schema: { type: string } }
        - { name: service, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              { $ref: "../openapi.yaml#/components/schemas/RealizeLocalProjectServiceRequest" }
      responses:
        "200":
          description: Exact local resource and approved private metadata
          content:
            application/json:
              schema: { $ref: "../openapi.yaml#/components/schemas/LocalProjectService" }
        default: { $ref: "../openapi.yaml#/components/responses/Problem" }
  /v1/projects/{project_key}/configuration:
    parameters:
      - {
          name: project_key,
          in: path,
          required: true,
          schema: { type: string, pattern: "^[a-z][a-z0-9-]{0,62}$" },
        }
    put:
      operationId: applyProjectConfiguration
      tags: [projects]
      summary: Apply a project's desired services and publisher groups
      security: [{ bearerAuth: [] }]
      description: Atomically reconcile declarations. On first apply provide source facts; control derives the source fingerprint using the same portable identity rules as resolve-source. On updates source may be omitted to retain the saved binding, or supplied to check that it matches. Identical content is idempotent; different content requires the current revision. Targets are encrypted and only returned to project managers and scoped publishers.
      requestBody:
        {
          required: true,
          content:
            {
              application/json:
                {
                  schema:
                    {
                      $ref: "../openapi.yaml#/components/schemas/ApplyProjectConfigurationRequest",
                    },
                },
            },
        }
      responses:
        "200":
          {
            description: Applied desired state and observed publisher revisions,
            content:
              {
                application/json:
                  {
                    schema:
                      { $ref: "../openapi.yaml#/components/schemas/AppliedProjectConfiguration" },
                  },
              },
          }
        default: { $ref: "../openapi.yaml#/components/responses/Problem" }
    get:
      operationId: getProjectConfiguration
      tags: [projects]
      summary: Read a project's applied configuration and publisher status
      description: Read the normalized desired configuration and observed publisher revisions for the selected team and project. Requires current project management permission; the response can include targets and must not be exposed as public project metadata.
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "../openapi.yaml#/components/parameters/TeamIDQuery" }]
      responses:
        "200":
          {
            description: Manager-only normalized configuration and status,
            content:
              {
                application/json:
                  {
                    schema:
                      { $ref: "../openapi.yaml#/components/schemas/AppliedProjectConfiguration" },
                  },
              },
          }
        default: { $ref: "../openapi.yaml#/components/responses/Problem" }
