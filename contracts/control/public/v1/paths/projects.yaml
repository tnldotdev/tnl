paths:
  /v1/projects/resolve-source:
    post:
      operationId: resolveProjectSource
      summary: Resolve a project's portable source selector
      tags: [projects]
      security: [{ bearerAuth: [] }]
      description: "Compute the portable project key from a Git origin and repository-relative configuration path. No repository is fetched, configuration evaluated, or state created. Branches, checkout directories, and file contents do not affect the key. Use it with the configuration endpoint and send the source facts on first apply."
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "../openapi.yaml#/components/schemas/GitProjectSource" }
      responses:
        "200":
          description: Portable project selector and suggested label
          content:
            application/json:
              schema: { $ref: "../openapi.yaml#/components/schemas/ProjectSourceIdentity" }
        default: { $ref: "../openapi.yaml#/components/responses/Problem" }
  /v1/projects:
    get:
      operationId: listProjects
      summary: List applied projects
      tags: [projects]
      security: [{ bearerAuth: [] }]
      description: "List applied projects the current team manager may manage, ordered by project_key. Summaries omit configuration, targets, and checkout paths. Read a project's configuration for its groups, members, and editable declarations. Follow next_cursor unchanged; each page checks current access."
      parameters:
        - { $ref: "../openapi.yaml#/components/parameters/TeamIDQuery" }
        - { name: cursor, in: query, schema: { type: string, maxLength: 2048 } }
      responses:
        "200":
          description: Up to 100 applied projects
          content:
            application/json:
              schema: { $ref: "../openapi.yaml#/components/schemas/ProjectPage" }
        default: { $ref: "../openapi.yaml#/components/responses/Problem" }
  /v1/projects/{project_key}/public-metadata:
    get:
      operationId: getProjectPublicMetadata
      tags: [projects]
      summary: Read visitor-safe project service identities and hostnames
      security: [{ bearerAuth: [] }]
      description: "Read public service IDs and hostnames for this project's worktrees. Visitors see only services they may visit; project managers see all public services. A service key can appear once per worktree. Targets, configuration, trust, grants, and publisher data are omitted."
      parameters:
        - { name: project_key, in: path, required: true, schema: { type: string } }
        - { $ref: "../openapi.yaml#/components/parameters/TeamIDQuery" }
      responses:
        "200":
          description: Authorized public service metadata
          content:
            application/json:
              schema: { $ref: "../openapi.yaml#/components/schemas/ProjectPublicMetadata" }
        default: { $ref: "../openapi.yaml#/components/responses/Problem" }
  /v1/projects/{project_key}/local-services/{service}:
    get:
      operationId: getLocalProjectService
      tags: [projects]
      summary: Resolve one existing source-bound worktree service
      security: [{ bearerAuth: [] }]
      description: "Read the existing service for this team, source, service key, and worktree. Requires visitor access, not project management permission. Returns identity and visitor protocol/TLS metadata, never targets or credentials. It does not create a service or search other worktrees or names. Missing or unauthorized bindings return 404; an authorized source mismatch returns 409."
      parameters:
        - {
            name: project_key,
            in: path,
            required: true,
            schema: { type: string, pattern: "^[a-z][a-z0-9-]{0,62}$" },
          }
        - {
            name: service,
            in: path,
            required: true,
            schema: { type: string, pattern: "^[a-z]([a-z0-9-]{0,30}[a-z0-9])?$" },
          }
        - { $ref: "../openapi.yaml#/components/parameters/TeamIDQuery" }
        - {
            name: source_fingerprint,
            in: query,
            required: true,
            schema: { type: string, pattern: "^[0-9a-f]{64}$" },
          }
        - {
            name: worktree_key,
            in: query,
            required: true,
            schema: { type: string, minLength: 1, maxLength: 128 },
          }
      responses:
        "200":
          description: Exact authorized local service and approved visitor metadata
          content:
            application/json:
              schema: { $ref: "../openapi.yaml#/components/schemas/LocalProjectService" }
        default: { $ref: "../openapi.yaml#/components/responses/Problem" }
    put:
      operationId: realizeLocalProjectService
      tags: [projects]
      summary: Realize one declared local service for a worktree
      security: [{ bearerAuth: [] }]
      description: "Create or reuse one service for this source and worktree. Private services get worktree-specific names; saved services are never adopted by name. A public URL must already belong to this runtime and the caller's membership or personal team; organization-shared and other members' URLs are rejected. If configuration was applied, the declaration must match it. Remote publisher groups are unchanged."
      parameters:
        - { name: project_key, in: path, required: true, schema: { type: string } }
        - { name: service, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              { $ref: "../openapi.yaml#/components/schemas/RealizeLocalProjectServiceRequest" }
      responses:
        "200":
          description: Exact local resource and approved private metadata
          content:
            application/json:
              schema: { $ref: "../openapi.yaml#/components/schemas/LocalProjectService" }
        default: { $ref: "../openapi.yaml#/components/responses/Problem" }
  /v1/projects/{project_key}/configuration:
    parameters:
      - {
          name: project_key,
          in: path,
          required: true,
          schema: { type: string, pattern: "^[a-z][a-z0-9-]{0,62}$" },
        }
    put:
      operationId: applyProjectConfiguration
      tags: [projects]
      summary: Apply a project's desired services and publisher groups
      security: [{ bearerAuth: [] }]
      description: "Save declarations and update their resources together. On first apply, provide source facts; control computes the fingerprint and project TLS digests. Later applies may omit source to retain its binding. Changed content requires the current revision; identical content is safe to replay. Targets remain encrypted and visible only to managers and scoped publishers."
      requestBody:
        {
          required: true,
          content:
            {
              application/json:
                {
                  schema:
                    {
                      $ref: "../openapi.yaml#/components/schemas/ApplyProjectConfigurationRequest",
                    },
                },
            },
        }
      responses:
        "200":
          {
            description: Applied desired state and observed publisher revisions,
            content:
              {
                application/json:
                  {
                    schema:
                      { $ref: "../openapi.yaml#/components/schemas/AppliedProjectConfiguration" },
                  },
              },
          }
        default: { $ref: "../openapi.yaml#/components/responses/Problem" }
    get:
      operationId: getProjectConfiguration
      tags: [projects]
      summary: Read a project's applied configuration and publisher status
      description: Read the normalized desired configuration and observed publisher revisions for the selected team and project. Requires current project management permission; the response can include targets and must not be exposed as public project metadata.
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "../openapi.yaml#/components/parameters/TeamIDQuery" }]
      responses:
        "200":
          {
            description: Manager-only normalized configuration and status,
            content:
              {
                application/json:
                  {
                    schema:
                      { $ref: "../openapi.yaml#/components/schemas/AppliedProjectConfiguration" },
                  },
              },
          }
        default: { $ref: "../openapi.yaml#/components/responses/Problem" }
