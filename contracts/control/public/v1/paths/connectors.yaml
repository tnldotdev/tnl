paths:
  /v1/services/{service_id}/client-certificates:
    post:
      operationId: issueServiceClientCertificate
      tags: [connectors]
      summary: Issue a service-scoped client certificate for an enrolled device
      description: Submit the client's CSR using the current signed-in visitor identity and an enrolled device ID. Control checks exact-service access; the private key stays with the client, and this certificate grants no management authority.
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "../openapi.yaml#/components/parameters/ServiceID" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              { $ref: "../openapi.yaml#/components/schemas/IssueServiceClientCertificateRequest" }
      responses:
        "201":
          description: Exact service/identity/device client certificate; the client key never leaves the client
          content:
            application/json:
              schema: { $ref: "../openapi.yaml#/components/schemas/ServiceClientCertificate" }
        default: { $ref: "../openapi.yaml#/components/responses/Problem" }
  /v1/visitor-devices:
    post:
      operationId: enrollVisitorDevice
      tags: [connectors]
      summary: Enroll an Ed25519 visitor device for the signed-in identity
      description: Bind the submitted public key to the current visitor identity using its control session. The private key remains local and signs connector peer pair requests; enrollment alone does not grant access to a service.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [public_key]
              properties:
                public_key: { type: string, pattern: "^[0-9a-f]{64}$" }
      responses:
        "201":
          description: Enrolled identity-bound Ed25519 device
          content:
            application/json:
              schema: { $ref: "../openapi.yaml#/components/schemas/VisitorDevice" }
        default: { $ref: "../openapi.yaml#/components/responses/Problem" }
  /v1/visitor-devices/{device_id}:
    delete:
      operationId: revokeVisitorDevice
      tags: [connectors]
      summary: Revoke a visitor device and its connector peer pairs
      description: Revoke the exact device belonging to the signed-in visitor identity and invalidate its connector peer pairs. This does not revoke the identity's control session or its other enrolled devices.
      security: [{ bearerAuth: [] }]
      parameters:
        - name: device_id
          in: path
          required: true
          schema: { type: string, pattern: "^vdev_[A-Za-z0-9]{22}$" }
      responses:
        "204": { description: Device and its connector peer pairs revoked }
        default: { $ref: "../openapi.yaml#/components/responses/Problem" }
  /v1/visitor/services:
    get:
      operationId: listAvailableServices
      tags: [connectors]
      summary: List services available to the signed-in visitor
      description: "List services the signed-in visitor may use, including offline services. Results include visitor endpoints, not target addresses, target trust, or secrets. Listing a service does not grant traffic access. Initial readiness needs two publisher connections; one surviving connection can keep an already-ready run available."
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "../openapi.yaml#/components/parameters/ServiceCursor" }]
      responses:
        "200":
          {
            description: Authorized visitor inventory,
            content:
              {
                application/json:
                  { schema: { $ref: "../openapi.yaml#/components/schemas/ServicePage" } },
              },
          }
        default: { $ref: "../openapi.yaml#/components/responses/Problem" }
  /v1/services/{service_id}/select-run:
    post:
      operationId: selectServiceRun
      tags: [connectors]
      summary: Select a ready service run for an enrolled visitor device
      description: Check current visitor access and select a ready publisher run for background preparation. pair_ready is a credential-free hint containing two exact ready connections on distinct live relay services, not a grant, stream ticket or pair key. The caller never supplies an IP address.
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "../openapi.yaml#/components/parameters/ServiceID" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [device_id]
              properties:
                device_id: { type: string, pattern: "^vdev_[A-Za-z0-9]{22}$" }
      responses:
        "201":
          {
            description: Access-checked run snapshot without a stream ticket or pair key,
            content:
              {
                application/json:
                  { schema: { $ref: "../openapi.yaml#/components/schemas/ServiceSelection" } },
              },
          }
        default: { $ref: "../openapi.yaml#/components/responses/Problem" }
  /v1/services/{service_id}/connector-peer-pairs:
    post:
      operationId: prepareConnectorPeerPair
      tags: [connectors]
      summary: Prepare a signed connector pair for an exact ready service run
      security: [{}, { bearerAuth: [] }]
      description: "Create or replace a pair for the selected service run using the device or workload signature. Device sources require the matching control session. Workload sources use the body credential and must omit Authorization, including empty headers. Control rechecks current access and both relay leases; a selection snapshot is not permission."
      parameters: [{ $ref: "../openapi.yaml#/components/parameters/ServiceID" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "../openapi.yaml#/components/schemas/ConnectorPeerPairRequest" }
      responses:
        "200":
          description: Exact pair delivered only to its signed device or workload source; never cache
          content:
            application/json:
              schema: { $ref: "../openapi.yaml#/components/schemas/ConnectorPeerPair" }
        default: { $ref: "../openapi.yaml#/components/responses/Problem" }
  /v1/services/{service_id}/connector-peer-pairs/{pair_id}/renew:
    post:
      operationId: renewConnectorPeerPair
      tags: [connectors]
      summary: Renew an exact signed connector pair and visitor permission
      security: [{}, { bearerAuth: [] }]
      description: "Renew the existing pair and visitor permission together, without selecting another run. The signature must prove the same device or workload key. Device sources require the matching control session; workload sources use the body credential and must omit Authorization, including empty headers. The response contains the pair lease, run validity, and visitor permission from that decision."
      parameters:
        - { $ref: "../openapi.yaml#/components/parameters/ServiceID" }
        - {
            name: pair_id,
            in: path,
            required: true,
            schema: { type: string, pattern: "^cpp_[A-Za-z0-9]{22}$" },
          }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "../openapi.yaml#/components/schemas/ConnectorPeerPairRequest" }
      responses:
        "200":
          description: Coherent renewal delivered only to its signed source; never cache
          content:
            application/json:
              schema: { $ref: "../openapi.yaml#/components/schemas/ConnectorPeerPairRenewal" }
        default: { $ref: "../openapi.yaml#/components/responses/Problem" }
  /v1/services/{service_id}/connector-peer-pairs/{pair_id}/rebind:
    post:
      operationId: rebindConnectorPeerPair
      tags: [connectors]
      summary: Inspect or change a retained connector pair's network binding
      security: [{}, { bearerAuth: [] }]
      description: "Inspect, prepare, activate, or abort a network binding for an existing connector owner. Sign with the same source key. Device sources require the matching control session; workload sources use the body credential and must omit Authorization, including empty headers. This cannot select another run or revive an expired owner. Only stale_network_binding permits recovery by inspecting retained state; other authorization failures are terminal."
      parameters:
        - { $ref: "../openapi.yaml#/components/parameters/ServiceID" }
        - name: pair_id
          in: path
          required: true
          schema: { type: string, pattern: "^cpp_[A-Za-z0-9]{22}$" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "../openapi.yaml#/components/schemas/ConnectorPeerPairRebindRequest" }
      responses:
        "200":
          description: Authenticated active and pending binding state; never cache
          content:
            application/json:
              schema: { $ref: "../openapi.yaml#/components/schemas/ConnectorPeerPairRebindState" }
        default: { $ref: "../openapi.yaml#/components/responses/Problem" }
