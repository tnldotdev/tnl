paths:
  /v1/publish-runs/{publish_run_id}/preview:
    post:
      operationId: createPublishRunPreview
      tags: [previews]
      description: Create or reuse the run-scoped preview used for an ephemeral demo's feedback. Authenticate with that exact publish run token and number; this is not ordinary project preview management.
      summary: Create feedback context for one ephemeral demo publish run
      security:
        - publishRunAuth: []
      parameters:
        - $ref: "../openapi.yaml#/components/parameters/PublishRunID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/PublishRunVersionRequest"
      responses:
        "200":
          description: Run-scoped preview
          content:
            application/json:
              schema:
                $ref: "../openapi.yaml#/components/schemas/Preview"
        default:
          $ref: "../openapi.yaml#/components/responses/Problem"
  /v1/previews:
    get:
      operationId: listPreviews
      summary: List the caller's previews
      tags: [previews]
      security: [{ bearerAuth: [] }]
      description: "List previews created by the signed-in identity in this team. Team visitor access does not grant access to another creator's preview records. Read each preview for its public URLs. Follow next_cursor unchanged; each page checks current access."
      parameters:
        - { $ref: "../openapi.yaml#/components/parameters/TeamIDQuery" }
        - { name: cursor, in: query, schema: { type: string, maxLength: 2048 } }
      responses:
        "200":
          description: Up to 100 creator-owned preview summaries
          content:
            application/json:
              schema: { $ref: "../openapi.yaml#/components/schemas/PreviewPage" }
        default: { $ref: "../openapi.yaml#/components/responses/Problem" }
    post:
      operationId: createPreview
      tags: [previews]
      description: Save or reuse a preview identity for the selected team and idempotency key. The preview groups public URLs; creation alone does not grant visitor access or start their publish runs.
      summary: Create or reuse a preview for one team
      security:
        - bearerAuth: []
      parameters:
        - $ref: "../openapi.yaml#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/CreatePreviewRequest"
      responses:
        "201":
          description: Preview identity
          content:
            application/json:
              schema:
                $ref: "../openapi.yaml#/components/schemas/Preview"
        default:
          $ref: "../openapi.yaml#/components/responses/Problem"
  /v1/previews/{preview_id}:
    get:
      operationId: getPreview
      tags: [previews]
      description: Read one preview's saved identity, public URL membership, and team access setting under current management authorization. Active publication and visitor permission are checked separately.
      summary: Read a preview and its public URLs
      security:
        - bearerAuth: []
      parameters:
        - $ref: "../openapi.yaml#/components/parameters/PreviewID"
      responses:
        "200":
          description: Preview
          content:
            application/json:
              schema:
                $ref: "../openapi.yaml#/components/schemas/Preview"
        default:
          $ref: "../openapi.yaml#/components/responses/Problem"
  /v1/previews/{preview_id}/public-urls:
    post:
      operationId: addPreviewPublicURL
      tags: [previews]
      description: Add an existing authorized public URL to the preview. This changes future preview membership, not the immutable public URL snapshot held by an already-created share.
      summary: Add an authorized public URL to a preview
      security:
        - bearerAuth: []
      parameters:
        - $ref: "../openapi.yaml#/components/parameters/PreviewID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/AddPreviewPublicURLRequest"
      responses:
        "200":
          description: Preview with updated public URLs
          content:
            application/json:
              schema:
                $ref: "../openapi.yaml#/components/schemas/Preview"
        default:
          $ref: "../openapi.yaml#/components/responses/Problem"
  /v1/previews/{preview_id}/team-access:
    put:
      operationId: setPreviewTeamAccess
      tags: [previews]
      description: Set the preview's opt-in team access grant using current management authorization. Enabled access still requires a current team member's sign-in; it does not make the included public URLs anonymous.
      summary: Enable or disable team visitor access for this preview
      security:
        - bearerAuth: []
      parameters:
        - $ref: "../openapi.yaml#/components/parameters/PreviewID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/SetPreviewTeamAccessRequest"
      responses:
        "200":
          description: Updated preview
          content:
            application/json:
              schema:
                $ref: "../openapi.yaml#/components/schemas/Preview"
        default:
          $ref: "../openapi.yaml#/components/responses/Problem"
  /v1/previews/{preview_id}/shares:
    post:
      operationId: createShare
      tags: [shares]
      description: "Create a share for the selected public URL IDs in this preview. entry_public_url_id chooses the landing URL and must be in that set. Later preview changes do not expand the share. Control returns the link and token source once; an identical retry returns the existing share ID in a credential_delivery_unavailable problem."
      summary: Store one share for a snapshot of authorized public URLs
      security:
        - bearerAuth: []
      parameters:
        - $ref: "../openapi.yaml#/components/parameters/PreviewID"
        - $ref: "../openapi.yaml#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/CreateShareRequest"
      responses:
        "201":
          description: Complete one-time share credential; Cache-Control is no-store
          content:
            application/json:
              schema:
                $ref: "../openapi.yaml#/components/schemas/ShareCreation"
        "409":
          description: Exact retry cannot redeliver the credential, or changed input conflicts
          content:
            application/problem+json:
              schema:
                $ref: "../openapi.yaml#/components/schemas/Problem"
        default:
          $ref: "../openapi.yaml#/components/responses/Problem"
    get:
      operationId: listShares
      tags: [shares]
      description: Read a cursor-paginated inventory of the preview's manageable shares without their secrets. A stored share record does not itself function as a share link.
      summary: List shares for a preview
      security:
        - bearerAuth: []
      parameters:
        - $ref: "../openapi.yaml#/components/parameters/PreviewID"
        - $ref: "../openapi.yaml#/components/parameters/Cursor"
      responses:
        "200":
          description: Share page
          content:
            application/json:
              schema:
                $ref: "../openapi.yaml#/components/schemas/SharePage"
        default:
          $ref: "../openapi.yaml#/components/responses/Problem"
  /v1/shares:
    post:
      operationId: createURLShare
      tags: [shares]
      summary: Store one share for an exact authorized HTTP public URL
      description: "Create a share for one public URL and return its link and token source once. Use that URL's ID as entry_public_url_id. An identical retry returns the existing share ID in a credential_delivery_unavailable problem; revoke and reissue if delivery was lost. Guest shares are limited to the trial's URL, source IP, and expiry."
      security:
        - bearerAuth: []
        - guestAuth: []
      parameters:
        - $ref: "../openapi.yaml#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/CreateShareRequest"
      responses:
        "201":
          description: Complete one-time share credential; Cache-Control is no-store
          content:
            application/json:
              schema:
                $ref: "../openapi.yaml#/components/schemas/ShareCreation"
        "409":
          description: Exact retry cannot redeliver the credential, or changed input conflicts
          content:
            application/problem+json:
              schema:
                $ref: "../openapi.yaml#/components/schemas/Problem"
        default:
          $ref: "../openapi.yaml#/components/responses/Problem"
    get:
      operationId: listTeamShares
      tags: [shares]
      description: Read a cursor-paginated share inventory under current team management authorization. Responses omit share secrets; retain the original creation link or token_source for visitor access.
      summary: List manageable shares for one team
      security:
        - bearerAuth: []
        - guestAuth: []
      parameters:
        - $ref: "../openapi.yaml#/components/parameters/TeamIDQuery"
        - $ref: "../openapi.yaml#/components/parameters/Cursor"
      responses:
        "200":
          description: Share page
          content:
            application/json:
              schema:
                $ref: "../openapi.yaml#/components/schemas/SharePage"
        default:
          $ref: "../openapi.yaml#/components/responses/Problem"
  /v1/shares/{share_id}:
    get:
      operationId: getShare
      tags: [shares]
      description: Read a manageable share's captured public URL IDs, deadline, and revocation state without revealing its secret. Reading the record does not redeem the share or create a visitor session.
      summary: Read one share
      security:
        - bearerAuth: []
        - guestAuth: []
      parameters:
        - $ref: "../openapi.yaml#/components/parameters/ShareID"
      responses:
        "200":
          description: Share without its secret
          content:
            application/json:
              schema:
                $ref: "../openapi.yaml#/components/schemas/Share"
        default:
          $ref: "../openapi.yaml#/components/responses/Problem"
  /v1/shares/{share_id}/revoke:
    post:
      operationId: revokeShare
      tags: [shares]
      description: Revoke the share under current management authorization so it cannot grant new visitor access. Retain the saved record and its captured public URL snapshot for subsequent reads.
      summary: Stop new access through one share
      security:
        - bearerAuth: []
        - guestAuth: []
      parameters:
        - $ref: "../openapi.yaml#/components/parameters/ShareID"
      responses:
        "200":
          description: Revoked share
          content:
            application/json:
              schema:
                $ref: "../openapi.yaml#/components/schemas/Share"
        default:
          $ref: "../openapi.yaml#/components/responses/Problem"
