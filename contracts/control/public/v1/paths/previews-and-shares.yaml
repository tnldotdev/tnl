paths:
  /v1/services/{service_id}/runs/{service_run_id}/preview:
    post:
      operationId: createServiceRunPreview
      tags: [previews]
      description: Create or reuse feedback context for an ephemeral HTTP service run, including a guest demo. Authenticate with that exact service run token and number, not normal project management permission.
      summary: Create feedback context for one ephemeral service run
      security:
        - serviceRunAuth: []
      parameters:
        - $ref: "../openapi.yaml#/components/parameters/ServiceID"
        - name: service_run_id
          in: path
          required: true
          schema: { $ref: "../openapi.yaml#/components/schemas/ServiceRunID" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/ServiceRunPreviewRequest"
      responses:
        "200":
          description: Run-scoped preview
          content:
            application/json:
              schema:
                $ref: "../openapi.yaml#/components/schemas/Preview"
        default:
          $ref: "../openapi.yaml#/components/responses/Problem"
  /v1/previews:
    get:
      operationId: listPreviews
      summary: List the caller's previews
      tags: [previews]
      security: [{ bearerAuth: [] }]
      description: "List previews created by the signed-in identity in this team. Team visitor access does not grant access to another creator's preview records. Read each preview for its services. Follow next_cursor unchanged; each page checks current access."
      parameters:
        - { $ref: "../openapi.yaml#/components/parameters/TeamIDQuery" }
        - { name: cursor, in: query, schema: { type: string, maxLength: 2048 } }
      responses:
        "200":
          description: Up to 100 creator-owned preview summaries
          content:
            application/json:
              schema: { $ref: "../openapi.yaml#/components/schemas/PreviewPage" }
        default: { $ref: "../openapi.yaml#/components/responses/Problem" }
    post:
      operationId: createPreview
      tags: [previews]
      description: Save or reuse a preview identity for the selected team and idempotency key. The preview groups services; creation alone does not grant visitor access or start their service runs.
      summary: Create or reuse a preview for one team
      security:
        - bearerAuth: []
      parameters:
        - $ref: "../openapi.yaml#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/CreatePreviewRequest"
      responses:
        "201":
          description: Preview identity
          content:
            application/json:
              schema:
                $ref: "../openapi.yaml#/components/schemas/Preview"
        default:
          $ref: "../openapi.yaml#/components/responses/Problem"
  /v1/previews/{preview_id}:
    get:
      operationId: getPreview
      tags: [previews]
      description: Read one preview's saved identity, service membership, and team access setting under current management authorization. Active publication and visitor permission are checked separately.
      summary: Read a preview and its services
      security:
        - bearerAuth: []
      parameters:
        - $ref: "../openapi.yaml#/components/parameters/PreviewID"
      responses:
        "200":
          description: Preview
          content:
            application/json:
              schema:
                $ref: "../openapi.yaml#/components/schemas/Preview"
        default:
          $ref: "../openapi.yaml#/components/responses/Problem"
  /v1/previews/{preview_id}/services:
    post:
      operationId: addPreviewService
      tags: [previews]
      description: Add an existing managed HTTP service to the preview. This changes future preview membership, not the immutable service snapshot held by an already-created share.
      summary: Add an authorized service to a preview
      security:
        - bearerAuth: []
      parameters:
        - $ref: "../openapi.yaml#/components/parameters/PreviewID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/AddPreviewServiceRequest"
      responses:
        "200":
          description: Preview with updated services
          content:
            application/json:
              schema:
                $ref: "../openapi.yaml#/components/schemas/Preview"
        default:
          $ref: "../openapi.yaml#/components/responses/Problem"
  /v1/previews/{preview_id}/team-access:
    put:
      operationId: setPreviewTeamAccess
      tags: [previews]
      description: Set the preview's opt-in HTTP team access using current management authorization. Enabled access requires current team sign-in; it does not make services anonymous or authorize connectors, devices, or workloads.
      summary: Enable or disable team visitor access for this preview
      security:
        - bearerAuth: []
      parameters:
        - $ref: "../openapi.yaml#/components/parameters/PreviewID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/SetPreviewTeamAccessRequest"
      responses:
        "200":
          description: Updated preview
          content:
            application/json:
              schema:
                $ref: "../openapi.yaml#/components/schemas/Preview"
        default:
          $ref: "../openapi.yaml#/components/responses/Problem"
  /v1/previews/{preview_id}/shares:
    post:
      operationId: createShare
      tags: [shares]
      description: "Capture the selected service IDs and entry_service_id from this preview. Later preview changes do not expand the share. Control returns the link and token source once; an identical retry returns the existing share ID in a credential_delivery_unavailable problem."
      summary: Store one share for a snapshot of authorized services
      security:
        - bearerAuth: []
      parameters:
        - $ref: "../openapi.yaml#/components/parameters/PreviewID"
        - $ref: "../openapi.yaml#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/CreateShareRequest"
      responses:
        "201":
          description: Complete one-time share credential; Cache-Control is no-store
          content:
            application/json:
              schema:
                $ref: "../openapi.yaml#/components/schemas/ShareCreation"
        "409":
          description: Exact retry cannot redeliver the credential, or changed input conflicts
          content:
            application/problem+json:
              schema:
                $ref: "../openapi.yaml#/components/schemas/Problem"
        default:
          $ref: "../openapi.yaml#/components/responses/Problem"
    get:
      operationId: listShares
      tags: [shares]
      description: Read a cursor-paginated inventory of the preview's manageable shares without their secrets. A stored share record does not itself function as a share link.
      summary: List shares for a preview
      security:
        - bearerAuth: []
      parameters:
        - $ref: "../openapi.yaml#/components/parameters/PreviewID"
        - $ref: "../openapi.yaml#/components/parameters/Cursor"
      responses:
        "200":
          description: Share page
          content:
            application/json:
              schema:
                $ref: "../openapi.yaml#/components/schemas/SharePage"
        default:
          $ref: "../openapi.yaml#/components/responses/Problem"
  /v1/shares:
    post:
      operationId: createServiceShare
      tags: [shares]
      summary: Store one share for an exact authorized HTTP service
      description: "Capture one service ID as entry_service_id and return its link and token source once. An identical retry returns credential_delivery_unavailable; revoke and reissue if delivery was lost. Guest shares remain limited to the trial's service, source IP, and expiry."
      security:
        - bearerAuth: []
        - guestAuth: []
      parameters:
        - $ref: "../openapi.yaml#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/CreateShareRequest"
      responses:
        "201":
          description: Complete one-time share credential; Cache-Control is no-store
          content:
            application/json:
              schema:
                $ref: "../openapi.yaml#/components/schemas/ShareCreation"
        "409":
          description: Exact retry cannot redeliver the credential, or changed input conflicts
          content:
            application/problem+json:
              schema:
                $ref: "../openapi.yaml#/components/schemas/Problem"
        default:
          $ref: "../openapi.yaml#/components/responses/Problem"
    get:
      operationId: listTeamShares
      tags: [shares]
      description: Read a cursor-paginated share inventory under current team management authorization. Responses omit share secrets; retain the original creation link or token_source for visitor access.
      summary: List manageable shares for one team
      security:
        - bearerAuth: []
        - guestAuth: []
      parameters:
        - $ref: "../openapi.yaml#/components/parameters/TeamIDQuery"
        - $ref: "../openapi.yaml#/components/parameters/Cursor"
      responses:
        "200":
          description: Share page
          content:
            application/json:
              schema:
                $ref: "../openapi.yaml#/components/schemas/SharePage"
        default:
          $ref: "../openapi.yaml#/components/responses/Problem"
  /v1/shares/{share_id}:
    get:
      operationId: getShare
      tags: [shares]
      description: Read a manageable share's captured service IDs, entry service, deadline, and revocation state without its secret. Reading the record does not redeem it or create a visitor session.
      summary: Read one share
      security:
        - bearerAuth: []
        - guestAuth: []
      parameters:
        - $ref: "../openapi.yaml#/components/parameters/ShareID"
      responses:
        "200":
          description: Share without its secret
          content:
            application/json:
              schema:
                $ref: "../openapi.yaml#/components/schemas/Share"
        default:
          $ref: "../openapi.yaml#/components/responses/Problem"
  /v1/shares/{share_id}/revoke:
    post:
      operationId: revokeShare
      tags: [shares]
      description: Revoke the share under current management authorization so it cannot grant new visitor access. Retain the saved record and its captured service snapshot for subsequent reads.
      summary: Stop new access through one share
      security:
        - bearerAuth: []
        - guestAuth: []
      parameters:
        - $ref: "../openapi.yaml#/components/parameters/ShareID"
      responses:
        "200":
          description: Revoked share
          content:
            application/json:
              schema:
                $ref: "../openapi.yaml#/components/schemas/Share"
        default:
          $ref: "../openapi.yaml#/components/responses/Problem"
  /v1/services/{service_id}/runs/{service_run_id}/share-redemptions:
    post:
      operationId: redeemServiceShare
      tags: [shares]
      summary: Redeem a share or one-use cross-host handoff through an exact service run
      description: Authenticate with the exact live service run token and number. Share membership, issuer authority, expiry, revocation, and captured handoff run bindings are checked separately. This does not authorize connector access.
      security: [{ serviceRunAuth: [] }]
      parameters:
        - $ref: "../openapi.yaml#/components/parameters/ServiceID"
        - name: service_run_id
          in: path
          required: true
          schema: { $ref: "../openapi.yaml#/components/schemas/ServiceRunID" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "../openapi.yaml#/components/schemas/RedeemServiceShareRequest" }
      responses:
        "200":
          description: Host-bound share credential and the next canonical origin
          content:
            application/json:
              schema: { $ref: "../openapi.yaml#/components/schemas/ShareRedemption" }
        default: { $ref: "../openapi.yaml#/components/responses/Problem" }
