paths:
  /v1/browser/service-login:
    get:
      operationId: beginServiceBrowserLogin
      tags: [browser-access]
      summary: Start browser sign-in for one HTTP service
      security: []
      description: "Start browser sign-in for one HTTP service, optionally within a preview. Navigate to this URL rather than fetching JSON. Sign-in verifies browser identity independently of current visit permission; it does not create a visitor grant."
      parameters:
        - {
            name: service_id,
            in: query,
            required: true,
            schema: { $ref: "../openapi.yaml#/components/schemas/ServiceID" },
          }
        - {
            name: preview_id,
            in: query,
            required: false,
            schema: { $ref: "../openapi.yaml#/components/schemas/PreviewID" },
          }
        - {
            name: return_path,
            in: query,
            required: true,
            schema: { type: string, maxLength: 2048 },
          }
        - { name: switch_account, in: query, schema: { type: boolean } }
      responses:
        "302": { description: Redirect to the configured identity provider }
        default: { $ref: "../openapi.yaml#/components/responses/Problem" }
  /v1/services/{service_id}/http-grants:
    get:
      operationId: listServiceHTTPGrants
      tags: [visitor-access]
      summary: List an HTTP service's visitor credentials without secrets
      security: [{ bearerAuth: [] }]
      description: "List this service's HTTP visitor credentials without their secrets. Requires current service management permission and includes expired and revoked records."
      parameters: [{ $ref: "../openapi.yaml#/components/parameters/ServiceID" }]
      responses:
        "200":
          description: Exact managed subject credential summaries, without secrets or share URLs
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "../openapi.yaml#/components/schemas/ServiceHTTPGrantSummary" }
        default: { $ref: "../openapi.yaml#/components/responses/Problem" }
    post:
      operationId: createServiceHTTPGrant
      tags: [visitor-access]
      summary: Create a service-scoped HTTP visitor token
      security: [{ bearerAuth: [] }]
      description: "Create an HTTP visitor credential for this service. Requires both current management and visitor permission. Each call creates a new credential, returned once; it grants neither management nor feedback permission."
      parameters: [{ $ref: "../openapi.yaml#/components/parameters/ServiceID" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "../openapi.yaml#/components/schemas/CreateVisitorCredentialRequest" }
      responses:
        "201":
          description: Exact managed subject and one-time secret
          content:
            application/json:
              schema: { $ref: "../openapi.yaml#/components/schemas/VisitorCredential" }
        default: { $ref: "../openapi.yaml#/components/responses/Problem" }
  /v1/services/{service_id}/http-grants/{grant_id}:
    delete:
      operationId: revokeServiceHTTPGrant
      tags: [visitor-access]
      summary: Revoke one service-scoped HTTP visitor credential
      description: Revoke the named token using current service management permission. The credential no longer authorizes new visitor permission; retained summaries remain visible without their secrets.
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: "../openapi.yaml#/components/parameters/ServiceID" }
        - { name: grant_id, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: Grant revoked }
        default: { $ref: "../openapi.yaml#/components/responses/Problem" }
  /v1/services/{service_id}/runs/{service_run_id}/browser/handoff:
    post:
      operationId: redeemServiceBrowserHandoff
      tags: [browser-access]
      summary: Exchange a service browser handoff through its publisher run
      description: Authenticate the publisher with the exact service run token and exchange the body's one-time handoff secret for a browser identity cookie bound to captured service runs. Visitor permission is optional and checked independently, including any supplied share cookie pair. A visitor's control session cannot substitute for the publisher run token.
      security: [{ serviceRunAuth: [] }]
      parameters:
        - { $ref: "../openapi.yaml#/components/parameters/ServiceID" }
        - {
            name: service_run_id,
            in: path,
            required: true,
            schema: { $ref: "../openapi.yaml#/components/schemas/ServiceRunID" },
          }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "../openapi.yaml#/components/schemas/ServiceBrowserRequest" }
      responses:
        "200":
          description: Host-bound browser credential for the exact managed subject
          content:
            application/json:
              schema: { $ref: "../openapi.yaml#/components/schemas/BrowserHandoffResponse" }
        default: { $ref: "../openapi.yaml#/components/responses/Problem" }
  /v1/services/{service_id}/runs/{service_run_id}/browser/session:
    post:
      operationId: checkServiceBrowserSession
      tags: [browser-access]
      summary: Check a browser session through its service publisher run
      description: Authenticate the publisher with the exact service run token and recheck the body's browser identity cookie for that captured service run. Identity remains authenticated when current visit permission is denied; neither identity nor this check creates a visitor or management grant.
      security: [{ serviceRunAuth: [] }]
      parameters:
        - { $ref: "../openapi.yaml#/components/parameters/ServiceID" }
        - {
            name: service_run_id,
            in: path,
            required: true,
            schema: { $ref: "../openapi.yaml#/components/schemas/ServiceRunID" },
          }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "../openapi.yaml#/components/schemas/ServiceBrowserRequest" }
      responses:
        "200":
          description: Current browser identity and visit permission, not management permission
          content:
            application/json:
              schema: { $ref: "../openapi.yaml#/components/schemas/BrowserAccessResponse" }
        default: { $ref: "../openapi.yaml#/components/responses/Problem" }
    delete:
      operationId: revokeServiceBrowserSession
      tags: [browser-access]
      summary: Revoke a browser session through its service publisher run
      description: Authenticate the publisher with the exact service run token and prove the body's browser session was installed for that captured service run. Revoke the shared browser session across its hostname handoff chain, including pending handoffs. Other browser sessions and the person's control session remain unchanged.
      security: [{ serviceRunAuth: [] }]
      parameters:
        - { $ref: "../openapi.yaml#/components/parameters/ServiceID" }
        - {
            name: service_run_id,
            in: path,
            required: true,
            schema: { $ref: "../openapi.yaml#/components/schemas/ServiceRunID" },
          }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "../openapi.yaml#/components/schemas/ServiceBrowserRequest" }
      responses:
        "204": { description: Shared browser session revoked }
        default: { $ref: "../openapi.yaml#/components/responses/Problem" }
  /v1/browser/callback:
    get:
      operationId: completePreviewBrowserLogin
      tags: [browser-access]
      description: "Check the pending login state and authorization code, then redirect the browser to a one-time publisher handoff. This callback uses the checked sign-in flow, not a bearer token."
      summary: Return a signed-in visitor to the preview
      security: []
      parameters:
        - name: state
          in: query
          required: true
          schema:
            type: string
        - name: code
          in: query
          required: true
          schema:
            type: string
      responses:
        "303":
          description: Redirect to a one-time handoff on the service endpoint
        default:
          $ref: "../openapi.yaml#/components/responses/Problem"
