paths:
  /v1/services/{service_id}/runs/{service_run_id}/connector-peer-pairs/{pair_id}/prepared:
    post:
      operationId: confirmConnectorPeerPairPrepared
      tags: [service-runs]
      summary: Confirm an exact connector binding installed by the publisher
      description: Record the publisher's installed packet registration and inner listener under the exact run token. Recheck the delivery authority and both matching relay claims; never extend the reported binding deadline.
      security: [{ serviceRunAuth: [] }]
      parameters:
        - { $ref: "../openapi.yaml#/components/parameters/ServiceID" }
        - name: service_run_id
          in: path
          required: true
          schema: { $ref: "../openapi.yaml#/components/schemas/ServiceRunID" }
        - name: pair_id
          in: path
          required: true
          schema: { type: string, pattern: "^cpp_[A-Za-z0-9]{22}$" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "../openapi.yaml#/components/schemas/ConnectorPeerPairPrepared" }
      responses:
        "204": { description: Exact installed binding recorded without renewing authority }
        default: { $ref: "../openapi.yaml#/components/responses/Problem" }
  /v1/services/{service_id}/runs/{service_run_id}/connector-peer-pairs:
    get:
      operationId: listConnectorPeerPairs
      tags: [service-runs]
      summary: List connector pair candidates for the current service run
      description: Reconcile unexpired pair candidates for the exact publisher run, without keys, subjects, or source addresses. An installed owner may include an independent authority observation during temporary relay loss. A candidate may still lack relay claims; prepare its delivery independently before serving it.
      security: [{ serviceRunAuth: [] }]
      parameters:
        - { $ref: "../openapi.yaml#/components/parameters/ServiceID" }
        - name: service_run_id
          in: path
          required: true
          schema: { $ref: "../openapi.yaml#/components/schemas/ServiceRunID" }
        - name: after
          in: query
          schema: { type: string, pattern: "^cpp_[A-Za-z0-9]{22}$" }
      responses:
        "200":
          description: At most 64 candidate references, ordered by pair ID
          content:
            application/json:
              schema: { $ref: "../openapi.yaml#/components/schemas/ConnectorPeerPairCandidates" }
        default: { $ref: "../openapi.yaml#/components/responses/Problem" }
  /v1/services/{service_id}/runs/{service_run_id}/connector-peer-pairs/{pair_id}/delivery:
    post:
      operationId: deliverConnectorPeerPair
      tags: [service-runs]
      summary: Deliver an existing connector pair to its current publisher run
      description: Return an existing pair key only to its current publisher run after both current relay legs have claimed the same observed source. This prepares a local binding, not an application stream.
      security: [{ serviceRunAuth: [] }]
      parameters:
        - { $ref: "../openapi.yaml#/components/parameters/ServiceID" }
        - name: service_run_id
          in: path
          required: true
          schema: { $ref: "../openapi.yaml#/components/schemas/ServiceRunID" }
        - name: pair_id
          in: path
          required: true
          schema: { type: string, pattern: "^cpp_[A-Za-z0-9]{22}$" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [delivery_generation]
              properties:
                delivery_generation:
                  {
                    type: string,
                    pattern: "^[0-9]+$",
                    x-go-type: int64,
                    x-oapi-codegen-extra-tags: { json: "delivery_generation,string" },
                  }
      responses:
        "200":
          description: Existing delivery bound to the exact active publisher run and two ready relay legs
          content:
            application/json:
              schema: { $ref: "../openapi.yaml#/components/schemas/ConnectorPeerPairDelivery" }
        default: { $ref: "../openapi.yaml#/components/responses/Problem" }
  /v1/services/{service_id}/runs/{service_run_id}/start:
    post:
      operationId: startServiceRun
      tags: [service-runs]
      summary: Start one prepared service run with its publisher grant
      security: [{ publisherAuth: [] }]
      description: Start one exact prepared run using its authenticated publisher identity. Visitor TLS uses the approved service certificate, without an ephemeral stream key or custom TLS proof.
      parameters:
        - { $ref: "../openapi.yaml#/components/parameters/ServiceID" }
        - {
            name: service_run_id,
            in: path,
            required: true,
            schema: { $ref: "../openapi.yaml#/components/schemas/ServiceRunID" },
          }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [run_number]
              properties:
                run_number:
                  {
                    type: string,
                    pattern: "^[0-9]+$",
                    x-go-type: int64,
                    x-oapi-codegen-extra-tags: { json: "run_number,string" },
                  }
      responses:
        "200":
          description: Run token and two independent relay assignments
          content:
            application/json:
              schema: { $ref: "../openapi.yaml#/components/schemas/ServiceRunSetup" }
        default: { $ref: "../openapi.yaml#/components/responses/Problem" }
  /v1/services/{service_id}/runs/{service_run_id}/authorize-http-visitor:
    post:
      operationId: authorizeServiceHTTPVisitor
      tags: [service-runs]
      summary: Record locally verified HTTP request permission and check ingress admission
      description: The publisher reports permission only after authorizing an application request or verifying its exact readiness proof. Browser preparation and valid TLS alone do not authorize a visitor. Control rechecks the exact run, source, public endpoint, and live transport. The publisher must wait for admitted before calling the target.
      security: [{ serviceRunAuth: [] }]
      parameters:
        - { $ref: "../openapi.yaml#/components/parameters/ServiceID" }
        - name: service_run_id
          in: path
          required: true
          schema: { $ref: "../openapi.yaml#/components/schemas/ServiceRunID" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              { $ref: "../openapi.yaml#/components/schemas/AuthorizeServiceHTTPVisitorRequest" }
      responses:
        "200":
          description: Current permission and ingress capacity acknowledgment for the exact visitor
          content:
            application/json:
              schema:
                { $ref: "../openapi.yaml#/components/schemas/ServiceClientCertificateDecision" }
        default: { $ref: "../openapi.yaml#/components/responses/Problem" }
  /v1/services/{service_id}/runs/{service_run_id}/authorize-client-certificate:
    post:
      operationId: authorizeServiceClientCertificate
      tags: [service-runs]
      summary: Check a public endpoint visitor's client certificate and admission
      description: Authenticate a public endpoint visitor after TLS key possession. Permission alone does not authorize target bytes until ingress acknowledges ordinary capacity.
      security: [{ serviceRunAuth: [] }]
      parameters:
        - { $ref: "../openapi.yaml#/components/parameters/ServiceID" }
        - {
            name: service_run_id,
            in: path,
            required: true,
            schema: { $ref: "../openapi.yaml#/components/schemas/ServiceRunID" },
          }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              {
                $ref: "../openapi.yaml#/components/schemas/AuthorizeServiceClientCertificateRequest",
              }
      responses:
        "200":
          description: Live permission for an exact admitted connection after TLS proved client key possession
          content:
            application/json:
              schema:
                { $ref: "../openapi.yaml#/components/schemas/ServiceClientCertificateDecision" }
        default: { $ref: "../openapi.yaml#/components/responses/Problem" }
  /v1/services/{service_id}/runs/{service_run_id}/certificate-issuances:
    parameters:
      - { $ref: "../openapi.yaml#/components/parameters/ServiceID" }
      - {
          name: service_run_id,
          in: path,
          required: true,
          schema: { $ref: "../openapi.yaml#/components/schemas/ServiceRunID" },
        }
    post:
      operationId: createServiceCertificateIssuance
      tags: [certificates]
      summary: Begin certificate issuance for one started service run
      description: Authorize DNS-01 issuance for the service run's approved certificate plan using its exact run token and run number. Submit a CSR for the publisher's key; neither a control session nor publisher access token substitutes for the run token.
      security: [{ serviceRunAuth: [] }]
      parameters: [{ $ref: "../openapi.yaml#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              {
                $ref: "../openapi.yaml#/components/schemas/CreateServiceCertificateIssuanceRequest",
              }
      responses:
        "201":
          description: DNS-01 issuance authorized for the exact private run and approved scope
          content:
            application/json:
              schema: { $ref: "../openapi.yaml#/components/schemas/ServiceCertificateIssuance" }
        default: { $ref: "../openapi.yaml#/components/responses/Problem" }
  /v1/services/{service_id}/runs/{service_run_id}/certificate-issuances/{issuance_id}:
    get:
      operationId: getServiceCertificateIssuance
      tags: [certificates]
      summary: Read a service run's current certificate issuance
      description: Poll the named issuance using the exact service run token. Control checks that the service, run, and issuance still match before returning certificate material.
      security: [{ serviceRunAuth: [] }]
      parameters:
        - { $ref: "../openapi.yaml#/components/parameters/ServiceID" }
        - {
            name: service_run_id,
            in: path,
            required: true,
            schema: { $ref: "../openapi.yaml#/components/schemas/ServiceRunID" },
          }
        - {
            name: issuance_id,
            in: path,
            required: true,
            schema: { $ref: "../openapi.yaml#/components/schemas/IssuanceID" },
          }
      responses:
        "200":
          description: Current service-run certificate issuance
          content:
            application/json:
              schema: { $ref: "../openapi.yaml#/components/schemas/ServiceCertificateIssuance" }
        default: { $ref: "../openapi.yaml#/components/responses/Problem" }
  /v1/services/{service_id}/runs/{service_run_id}/certificate-installed:
    post:
      operationId: markServiceCertificateInstalled
      tags: [certificates]
      summary: Acknowledge the certificate installed for one service run
      description: Record that the publisher installed the exact approved issuance for this run number using its service run token. The acknowledgement does not by itself prove that both publisher connections are ready.
      security: [{ serviceRunAuth: [] }]
      parameters:
        - { $ref: "../openapi.yaml#/components/parameters/ServiceID" }
        - {
            name: service_run_id,
            in: path,
            required: true,
            schema: { $ref: "../openapi.yaml#/components/schemas/ServiceRunID" },
          }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              { $ref: "../openapi.yaml#/components/schemas/ServiceCertificateInstalledRequest" }
      responses:
        "204": { description: Current run acknowledged the exact publisher-owned certificate }
        default: { $ref: "../openapi.yaml#/components/responses/Problem" }
  /v1/services/{service_id}/runs:
    post:
      operationId: prepareServiceRun
      tags: [service-runs]
      summary: Reserve a service run and its approved certificate plan
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "../openapi.yaml#/components/schemas/ServiceRunDeclaration" }
      description: Reserve a new run ID and number and capture its exact managed hostname, port, domain and certificate plan under the authenticated publisher grant. Retrying the same idempotency key returns the same preparation.
      security: [{ publisherAuth: [] }]
      parameters:
        [
          { $ref: "../openapi.yaml#/components/parameters/ServiceID" },
          { $ref: "../openapi.yaml#/components/parameters/IdempotencyKey" },
        ]
      responses:
        "201":
          {
            description: Exact prepared binding for the publisher to start,
            content:
              {
                application/json:
                  { schema: { $ref: "../openapi.yaml#/components/schemas/ServiceRunPreparation" } },
              },
          }
        default: { $ref: "../openapi.yaml#/components/responses/Problem" }
  /v1/services/{service_id}/runs/{service_run_id}/renew:
    post:
      operationId: renewServiceRun
      tags: [service-runs]
      summary: Renew a service run and report publisher health and capacity
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "../openapi.yaml#/components/schemas/ServiceRunHeartbeat" }
      description: Renew only the current run using its exact service run token. First readiness requires two live relay services; one surviving ready connection can continue serving while the other is replaced.
      security: [{ serviceRunAuth: [] }]
      parameters:
        - { $ref: "../openapi.yaml#/components/parameters/ServiceID" }
        - name: service_run_id
          in: path
          required: true
          schema: { $ref: "../openapi.yaml#/components/schemas/ServiceRunID" }
      responses:
        "200":
          description: Current run and assignments
          content:
            application/json:
              schema: { $ref: "../openapi.yaml#/components/schemas/ServiceRunState" }
        default: { $ref: "../openapi.yaml#/components/responses/Problem" }
  /v1/services/{service_id}/runs/{service_run_id}:
    delete:
      operationId: closeServiceRun
      tags: [service-runs]
      summary: Close one exact service run using its run token
      description: Close the exact run, reject stale admissions and publish a service tombstone. Managed certificates remain in the publisher's shared cache.
      security: [{ serviceRunAuth: [] }]
      parameters:
        - { $ref: "../openapi.yaml#/components/parameters/ServiceID" }
        - name: service_run_id
          in: path
          required: true
          schema: { $ref: "../openapi.yaml#/components/schemas/ServiceRunID" }
      responses:
        "204": { description: Run closed }
        default: { $ref: "../openapi.yaml#/components/responses/Problem" }
