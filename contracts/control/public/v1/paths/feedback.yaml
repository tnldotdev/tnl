paths:
  /v1/feedback/authorization:
    post:
      operationId: authorizeImplementerFeedback
      tags: [feedback]
      summary: Check current management access for one local feedback operation
      description: Returns a short-lived decision and verified author. Feedback content is stored only on the publishing machine.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/AuthorizeImplementerFeedbackRequest"
      responses:
        "200":
          description: Current authorization decision
          content:
            application/json:
              schema:
                $ref: "../openapi.yaml#/components/schemas/FeedbackAuthorization"
        default:
          $ref: "../openapi.yaml#/components/responses/Problem"
  /v1/services/{service_id}/runs/{service_run_id}/feedback/authorization:
    post:
      operationId: authorizeReviewerFeedback
      tags: [feedback]
      summary: Check current visitor access and feedback author policy
      description: Accepts the publisher's current visit proof, not a visitor assertion. Never receives or stores feedback content.
      security:
        - serviceRunAuth: []
      parameters:
        - $ref: "../openapi.yaml#/components/parameters/ServiceID"
        - name: service_run_id
          in: path
          required: true
          schema:
            $ref: "../openapi.yaml#/components/schemas/ServiceRunID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/AuthorizeReviewerFeedbackRequest"
      responses:
        "200":
          description: Current authorization decision
          content:
            application/json:
              schema:
                $ref: "../openapi.yaml#/components/schemas/FeedbackAuthorization"
        default:
          $ref: "../openapi.yaml#/components/responses/Problem"
