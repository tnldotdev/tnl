paths:
  /v1/projects/{project_key}/deployments/{deployment}/publisher-enrollments:
    parameters:
      - { name: project_key, in: path, required: true, schema: { type: string } }
      - {
          name: deployment,
          in: path,
          required: true,
          schema: { type: string },
          description: Deployment name or ID within the selected project.,
        }
      - { $ref: "../openapi.yaml#/components/parameters/TeamIDQuery" }
    post:
      operationId: createDeploymentPublisherEnrollment
      security: [{ bearerAuth: [] }]
      description: Approve bounded publisher setup for selected existing services. Requires a current team manager's control session. The original request key recovers the same secret only while its captured bindings, deadline, and remaining capacity are valid. Does not create AWS resources or grant general management/connect/namespace authority. Redeem through the existing publisher-group enrollment exchange.
      parameters:
        - {
            name: Idempotency-Key,
            in: header,
            required: true,
            schema: { type: string, minLength: 1, maxLength: 128 },
          }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              {
                $ref: "../openapi.yaml#/components/schemas/CreateDeploymentPublisherEnrollmentRequest",
              }
      responses:
        "201":
          description: New or recovered bounded enrollment
          content:
            application/json:
              schema: { $ref: "../openapi.yaml#/components/schemas/DeploymentPublisherEnrollment" }
        default: { $ref: "../openapi.yaml#/components/responses/Problem" }
  /v1/projects/{project_key}/deployments/{deployment}/publishers:
    parameters:
      - { name: project_key, in: path, required: true, schema: { type: string } }
      - { name: deployment, in: path, required: true, schema: { type: string } }
      - { $ref: "../openapi.yaml#/components/parameters/TeamIDQuery" }
    get:
      operationId: listDeploymentPublishers
      security: [{ bearerAuth: [] }]
      description: List only this deployment's publishers, including revoked identities and their retained observations. Requires current team manager authority; no enrollment secrets or unrelated targets are returned.
      parameters:
        - { name: after, in: query, schema: { type: string } }
        - {
            name: limit,
            in: query,
            schema: { type: integer, minimum: 1, maximum: 100, default: 50 },
          }
      responses:
        "200":
          description: Deployment publisher page in bytewise publisher ID order
          content:
            application/json:
              schema: { $ref: "../openapi.yaml#/components/schemas/DeploymentPublisherPage" }
        default: { $ref: "../openapi.yaml#/components/responses/Problem" }
  /v1/projects/{project_key}/deployments/{deployment}/publishers/{publisher}:
    parameters:
      - { name: project_key, in: path, required: true, schema: { type: string } }
      - { name: deployment, in: path, required: true, schema: { type: string } }
      - { name: publisher, in: path, required: true, schema: { type: string } }
      - { $ref: "../openapi.yaml#/components/parameters/TeamIDQuery" }
    get:
      operationId: getDeploymentPublisher
      security: [{ bearerAuth: [] }]
      description: Read one publisher's captured scope and observation, with current team manager authority and exact deployment ownership.
      responses:
        "200":
          description: Publisher observation without credentials or targets
          content:
            application/json:
              schema: { $ref: "../openapi.yaml#/components/schemas/DeploymentPublisher" }
        default: { $ref: "../openapi.yaml#/components/responses/Problem" }
    delete:
      operationId: revokeDeploymentPublisher
      security: [{ bearerAuth: [] }]
      description: Revoke exactly this publisher identity, its grants, leases, and current publications. Requires a current team manager. Repetition is safe; the last observation is retained. Other publishers, deployments, and shared enrollment capacity are not changed. Apply and enrollment replay cannot restore the revoked identity.
      responses:
        "204": { description: Publisher revoked }
        default: { $ref: "../openapi.yaml#/components/responses/Problem" }
