paths:
  /v1/workload/services/{service_id}/run:
    parameters:
      - {
          name: service_id,
          in: path,
          required: true,
          schema: { $ref: "../openapi.yaml#/components/schemas/ServiceID" },
        }
    post:
      operationId: selectWorkloadServiceRun
      tags: [workloads]
      summary: Select a ready service run for an authenticated workload
      security: [{ workloadAuth: [] }]
      description: Check the selected workload credential and current service permission. pair_ready appears only for two exact ready connections on distinct live relay services; it is a signing snapshot, not a grant or a pair key.
      responses:
        "200":
          description: Current publisher selection for the workload subject
          content:
            application/json:
              schema: { $ref: "../openapi.yaml#/components/schemas/ServiceSelection" }
        default: { $ref: "../openapi.yaml#/components/responses/Problem" }
  /v1/workload/services:
    get:
      operationId: listWorkloadServices
      tags: [workloads]
      description: Read the services currently authorized for this workload session using its visitor-only bearer credential. The inventory omits target addresses and application credentials and grants no publisher or control management authority.
      summary: List only the workload session's currently authorized saved services
      security: [{ workloadAuth: [] }]
      responses:
        "200":
          description: Current visitor inventory without targets or application credentials
          content:
            application/json:
              schema: { $ref: "../openapi.yaml#/components/schemas/WorkloadServices" }
        default: { $ref: "../openapi.yaml#/components/responses/Problem" }
  /v1/workload/services/{service_id}/authorization:
    parameters:
      - { name: service_id, in: path, required: true, schema: { type: string } }
    post:
      operationId: checkWorkloadService
      tags: [workloads]
      summary: Check a workload session's current permission for one service
      description: Recheck live workload authorization for the exact service using the workload bearer credential. The decision is bounded by both the renewable lease and the session's fixed absolute deadline; a prior inventory response is not sufficient authorization.
      security: [{ workloadAuth: [] }]
      responses:
        "200":
          description: Current permission bounded by lease and absolute deadline
          content:
            application/json:
              schema: { $ref: "../openapi.yaml#/components/schemas/WorkloadServiceAuthorization" }
        default: { $ref: "../openapi.yaml#/components/responses/Problem" }
  /v1/workload/services/{service_id}/client-certificate:
    parameters:
      - { name: service_id, in: path, required: true, schema: { type: string } }
    post:
      operationId: issueWorkloadServiceClientCertificate
      tags: [workloads]
      summary: Issue a service client certificate for a workload's existing key
      description: Submit a CSR under the visitor-only workload bearer credential for one currently authorized service. The returned certificate cannot outlive the workload's fixed absolute expiry, and later access still requires a current workload lease.
      security: [{ workloadAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [csr]
              properties:
                csr: { type: string, format: byte, maxLength: 11000 }
      responses:
        "200":
          description: Service-scoped certificate for the workload's existing key, bounded by its fixed absolute expiry; current authorization always checks the live lease
          content:
            application/json:
              schema: { $ref: "../openapi.yaml#/components/schemas/ServiceClientCertificate" }
        default: { $ref: "../openapi.yaml#/components/responses/Problem" }
