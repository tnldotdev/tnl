paths:
  /v1/projects/{project_key}/deployment-credentials:
    parameters:
      - { name: project_key, in: path, required: true, schema: { type: string } }
      - { $ref: "../openapi.yaml#/components/parameters/TeamIDQuery" }
    post:
      operationId: registerDeploymentCredential
      tags: [deployments]
      summary: Register scoped deployment permissions
      security: [{ bearerAuth: [] }]
      description: A current team manager registers one public signing key with independent manage and connect service allowlists. Runtime credentials cannot invoke this administration operation. The original request key and intent recover the same identity, grant and fixed deadline only while still current; recovery never restores revoked, expired or retired approval. This operation is outside the public runtime SDK allowlist.
      parameters:
        - {
            name: Idempotency-Key,
            in: header,
            required: true,
            schema: { type: string, minLength: 1, maxLength: 128 },
          }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              { $ref: "../openapi.yaml#/components/schemas/RegisterDeploymentCredentialRequest" }
      responses:
        "201":
          description: New or recovered public credential registration
          content:
            application/json:
              schema: { $ref: "../openapi.yaml#/components/schemas/DeploymentCredential" }
        default: { $ref: "../openapi.yaml#/components/responses/Problem" }
