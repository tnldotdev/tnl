paths:
  /v1/projects/{project_key}/publisher-groups/{group_name}/namespace/rename:
    post:
      operationId: renamePublisherNamespace
      tags: [publisher-groups]
      summary: Replace a publisher group's DNS namespace label
      security: [{ bearerAuth: [] }]
      description: "Change the group's DNS label while keeping its IDs and ports. This closes old service runs and assigns new publication grants and certificate plans. Old names remain reserved until control finishes its certificate and DNS cleanup checks. The configuration key and separately configured public URLs do not change. Send the current expected revision; an identical retry with the same key returns the original result."
      parameters:
        - { name: project_key, in: path, required: true, schema: { type: string } }
        - { name: group_name, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "../openapi.yaml#/components/schemas/RenamePublisherNamespaceRequest" }
      responses:
        "200":
          description: Applied descriptors with the new service hostnames
          content:
            application/json:
              schema: { $ref: "../openapi.yaml#/components/schemas/AppliedProjectConfiguration" }
        default: { $ref: "../openapi.yaml#/components/responses/Problem" }
  /v1/projects/{project_key}/publisher-groups/{group_name}/rename:
    post:
      operationId: renamePublisherGroup
      tags: [publisher-groups]
      summary: Rename a group's configuration selector without changing endpoints
      security: [{ bearerAuth: [] }]
      description: "Rename the configuration key without changing the group's ID, namespace, services, ports, or publisher grants. Old selectors remain reserved for this group. Update project configuration before the next apply; retrying a completed rename is safe."
      parameters:
        - { name: project_key, in: path, required: true, schema: { type: string } }
        - { name: group_name, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "../openapi.yaml#/components/schemas/RenamePublisherGroupRequest" }
      responses:
        "200":
          description: Renamed desired configuration and unchanged endpoint identities
          content:
            application/json:
              schema: { $ref: "../openapi.yaml#/components/schemas/AppliedProjectConfiguration" }
        default: { $ref: "../openapi.yaml#/components/responses/Problem" }
  /v1/projects/{project_key}/publisher-groups/{group_name}/members/{publisher_identity_id}:
    delete:
      operationId: revokePublisherGroupMember
      tags: [publisher-groups]
      summary: Revoke one enrolled publisher replica from a group
      description: Revoke the exact enrolled publisher identity using current project management permission. Control closes that member's public URL and service runs without revoking other group members.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: project_key, in: path, required: true, schema: { type: string } }
        - { name: group_name, in: path, required: true, schema: { type: string } }
        - { name: publisher_identity_id, in: path, required: true, schema: { type: string } }
        - { $ref: "../openapi.yaml#/components/parameters/TeamIDQuery" }
      responses:
        "204":
          { description: Exact group member identity revoked and its public/private runs closed }
        default: { $ref: "../openapi.yaml#/components/responses/Problem" }
  /v1/projects/{project_key}/publisher-groups/{group_name}/enrollments:
    post:
      operationId: createPublisherGroupEnrollment
      tags: [publisher-groups]
      summary: Issue a bounded enrollment key for a project's publisher group
      description: Create an expiring bootstrap credential using current project management permission. Each enrolled replica supplies its own key; the enrollment's member limit bounds how many identities it can create.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: project_key, in: path, required: true, schema: { type: string } }
        - { name: group_name, in: path, required: true, schema: { type: string } }
      requestBody:
        {
          required: true,
          content:
            {
              application/json:
                {
                  schema:
                    {
                      $ref: "../openapi.yaml#/components/schemas/CreatePublisherGroupEnrollmentRequest",
                    },
                },
            },
        }
      responses:
        "201":
          {
            description: Bounded project/group bootstrap credential,
            content:
              {
                application/json:
                  {
                    schema:
                      { $ref: "../openapi.yaml#/components/schemas/PublisherGroupEnrollment" },
                  },
              },
          }
        default: { $ref: "../openapi.yaml#/components/responses/Problem" }
  /v1/publisher/groups/enroll:
    post:
      operationId: redeemPublisherGroupEnrollment
      tags: [publisher-groups]
      summary: Enroll a replica's signing key with a group enrollment secret
      security: []
      description: "Register a replica's Ed25519 public key using enrollment_key in the body. Retrying the same key returns the same membership without consuming more enrollment capacity."
      requestBody:
        {
          required: true,
          content:
            {
              application/json:
                {
                  schema:
                    {
                      $ref: "../openapi.yaml#/components/schemas/RedeemPublisherGroupEnrollmentRequest",
                    },
                },
            },
        }
      responses:
        "200":
          {
            description: One signed publisher identity scoped to one group,
            content:
              {
                application/json:
                  { schema: { $ref: "../openapi.yaml#/components/schemas/PublisherGroupMember" } },
              },
          }
        default: { $ref: "../openapi.yaml#/components/responses/Problem" }
  /v1/publisher/groups/verify:
    post:
      operationId: verifyPublisherGroupIdentity
      tags: [publisher-groups]
      summary: Verify a replica's group membership without acquiring a lease
      security: []
      description: "Verify group membership using a one-use signed assertion in the body. Its audience is this endpoint's full control URL. Returns current and historical selectors without replacing the running publisher's group lease."
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "../openapi.yaml#/components/schemas/PublisherGroupLeaseRequest" }
      responses:
        "200":
          description: Verified membership without a lease or service targets
          content:
            application/json:
              schema: { $ref: "../openapi.yaml#/components/schemas/PublisherGroupVerification" }
        default: { $ref: "../openapi.yaml#/components/responses/Problem" }
  /v1/publisher/groups/lease:
    post:
      operationId: acquirePublisherGroupLease
      tags: [publisher-groups]
      summary: Exchange a signed replica assertion for a group lease
      security: []
      description: "Exchange a one-use signed assertion in the body for a pgl_ group lease. The assertion's audience is this endpoint's full control URL, and its grant claim is the group ID."
      requestBody:
        {
          required: true,
          content:
            {
              application/json:
                {
                  schema:
                    { $ref: "../openapi.yaml#/components/schemas/PublisherGroupLeaseRequest" },
                },
            },
        }
      responses:
        "200":
          {
            description: Current group lease,
            content:
              {
                application/json:
                  { schema: { $ref: "../openapi.yaml#/components/schemas/PublisherGroupLease" } },
              },
          }
        default: { $ref: "../openapi.yaml#/components/responses/Problem" }
  /v1/publisher/groups/assignments:
    get:
      operationId: getPublisherGroupAssignments
      tags: [publisher-groups]
      summary: Read services and grants assigned to one leased group replica
      description: "Read the replica's assigned services and publisher grants using its current pgl_ lease. Assignments can include targets. A pta_ publisher token cannot read them."
      security: [{ publisherGroupLeaseAuth: [] }]
      responses:
        "200":
          {
            description: Exact assigned services and native publisher grants for this replica,
            content:
              {
                application/json:
                  {
                    schema:
                      { $ref: "../openapi.yaml#/components/schemas/PublisherGroupAssignments" },
                  },
              },
          }
        default: { $ref: "../openapi.yaml#/components/responses/Problem" }
  /v1/publisher/groups/configuration-acknowledgements:
    post:
      operationId: acknowledgePublisherGroupConfiguration
      tags: [publisher-groups]
      summary: Acknowledge the exact configuration installed by a group replica
      description: "Report the installed configuration revision, hash, and health using the replica's current pgl_ lease. Stale or mismatched configuration is rejected; a pta_ publisher token cannot acknowledge it."
      security: [{ publisherGroupLeaseAuth: [] }]
      requestBody:
        {
          required: true,
          content:
            {
              application/json:
                {
                  schema:
                    { $ref: "../openapi.yaml#/components/schemas/PublisherGroupAcknowledgement" },
                },
            },
        }
      responses:
        "204": { description: Exact current configuration revision acknowledged }
        default: { $ref: "../openapi.yaml#/components/responses/Problem" }
