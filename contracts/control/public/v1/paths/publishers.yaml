paths:
  /v1/publisher-runtime:
    post:
      operationId: observePublisherRuntime
      tags: [publisher-runtime]
      summary: Inspect or update a signed publisher process lifetime
      security: []
      description: >-
        Explicit remote runtime lifecycle, independent of enrollment, verification,
        and identity kind. A one-use Ed25519 assertion binds scope_id, action,
        process_run_id and expected_epoch through the runtime proof scope, with
        this path as its audience. Inspect reads the current epoch without recording
        an address. Start compares that epoch and installs a new process run;
        retries retain that run and epoch. Renew and stop require the current run
        and epoch. Control records only the validated request source, never a body
        address. Group start/renew also issue the existing group lease atomically.
        Authentication is the signed assertion in the JSON body, not a bearer
        token; the empty security array does not mean anonymous access.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "../openapi.yaml#/components/schemas/PublisherRuntimeRequest" }
      responses:
        "200":
          description: Current runtime epoch and optional group lease
          content:
            application/json:
              schema: { $ref: "../openapi.yaml#/components/schemas/PublisherRuntimeResponse" }
        default: { $ref: "../openapi.yaml#/components/responses/Problem" }
  /v1/publisher/service:
    get:
      operationId: getPublisherService
      tags: [publisher-identities]
      summary: Read the saved service selected by the current publisher grant
      security: [{ publisherAuth: [] }]
      description: Read the exact granted service's approved protocol and public TLS trust metadata. The publisher must declare its own matching configuration when preparing a run.
      responses:
        "200":
          description: Exact granted service, without target addresses or credentials
          content:
            application/json:
              schema: { $ref: "../openapi.yaml#/components/schemas/Service" }
        default: { $ref: "../openapi.yaml#/components/responses/Problem" }
  /v1/guest-demo/publisher:
    post:
      operationId: enrollGuestPublisher
      tags: [guest-demos]
      summary: Enroll a publisher key for the guest trial's assigned demo URL
      description: Authenticate with the guest trial credential and bind an Ed25519 key to the trial's assigned public URL. Control checks the trial and validated request source; the resulting identity grants no general control session or service management permission.
      security: [{ guestAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "../openapi.yaml#/components/schemas/EnrollGuestPublisherRequest" }
      responses:
        "200":
          description: Trial-bound publisher for the assigned demo URL
          content:
            application/json:
              schema: { $ref: "../openapi.yaml#/components/schemas/GuestPublisherIdentity" }
        default: { $ref: "../openapi.yaml#/components/responses/Problem" }
  /v1/publisher/public-url:
    get:
      operationId: getPublisherPublicURL
      tags: [publisher-identities]
      description: Read the single saved public URL selected by the publisher access token's exact grant. Namespace allocation grants and control sessions do not substitute for an exact public URL publisher grant.
      summary: Read the saved URL selected by the current grant
      security:
        - publisherAuth: []
      responses:
        "200":
          description: Bound public URL
          content:
            application/json:
              schema:
                $ref: "../openapi.yaml#/components/schemas/PublicURL"
        default:
          $ref: "../openapi.yaml#/components/responses/Problem"
  /v1/publisher-enrollments:
    post:
      operationId: createPublisherEnrollment
      tags: [publisher-identities]
      description: Issue an expiring one-use enrollment secret under current management authorization. Enrollment installs a publisher's signing key for the selected scope; it is separate from exchanging signed assertions for short-lived publisher access tokens.
      summary: Issue an expiring one-use publisher enrollment
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/CreatePublisherEnrollmentRequest"
      responses:
        "201":
          description: One-use enrollment secret
          content:
            application/json:
              schema:
                $ref: "../openapi.yaml#/components/schemas/PublisherEnrollment"
        default:
          $ref: "../openapi.yaml#/components/responses/Problem"
  /v1/publisher-identities:
    get:
      operationId: listPublisherIdentities
      tags: [publisher-identities]
      description: Read a cursor-paginated inventory of publisher identities and their grants for a manageable team. Responses omit enrollment secrets and private signing keys; an inventory entry is not a publisher credential.
      summary: List publisher identities and grants without secrets
      security:
        - bearerAuth: []
      parameters:
        - $ref: "../openapi.yaml#/components/parameters/TeamIDQuery"
        - $ref: "../openapi.yaml#/components/parameters/Cursor"
      responses:
        "200":
          description: Publisher identities
          content:
            application/json:
              schema:
                $ref: "../openapi.yaml#/components/schemas/PublisherIdentityPage"
        default:
          $ref: "../openapi.yaml#/components/responses/Problem"
  /v1/publisher-identities/{publisher_identity_id}:
    delete:
      operationId: revokePublisherIdentity
      tags: [publisher-identities]
      description: Revoke an exact publisher identity under current team management authorization. Identity revocation invalidates its publishing authority independently of any individual grant record.
      summary: Revoke an identity independently of its grants
      security:
        - bearerAuth: []
      parameters:
        - $ref: "../openapi.yaml#/components/parameters/PublisherIdentityID"
        - $ref: "../openapi.yaml#/components/parameters/TeamIDQuery"
      responses:
        "204":
          description: Revoked
        default:
          $ref: "../openapi.yaml#/components/responses/Problem"
  /v1/publisher-identities/{publisher_identity_id}/grants:
    post:
      operationId: createPublisherGrant
      tags: [publisher-identities]
      summary: Add one authorized scope to a publisher identity
      description: Create a revocable publisher grant using current management authorization for the selected scope. The grant identifies what the native publisher may serve; it is not a visitor grant or a control session.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "../openapi.yaml#/components/parameters/PublisherIdentityID"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "../openapi.yaml#/components/schemas/CreatePublisherGrantRequest" }
      responses:
        "201":
          description: Grant created
          content:
            application/json:
              schema: { $ref: "../openapi.yaml#/components/schemas/PublisherGrant" }
        default: { $ref: "../openapi.yaml#/components/responses/Problem" }
  /v1/publisher-identities/{publisher_identity_id}/grants/{grant_id}:
    delete:
      operationId: revokePublisherGrant
      tags: [publisher-identities]
      summary: Revoke one publisher grant without revoking the identity
      description: Revoke the named grant under current team management authorization. Other grants on the identity remain separate; the revoked grant can no longer authorize current publishing work.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "../openapi.yaml#/components/parameters/PublisherIdentityID"
        - $ref: "../openapi.yaml#/components/parameters/TeamIDQuery"
        - name: grant_id
          in: path
          required: true
          schema: { $ref: "../openapi.yaml#/components/schemas/ResourceID" }
      responses:
        "204": { description: Grant revoked }
        default: { $ref: "../openapi.yaml#/components/responses/Problem" }
