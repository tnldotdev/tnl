paths:
  /v1/publisher/runtimes/{publisher_identity_id}/inspect:
    post:
      operationId: inspectPublisherRuntime
      tags: [publisher-runtime]
      summary: Inspect a publisher runtime
      security: []
      description: "Read the runtime epoch without recording an address. Send a one-use signed assertion for this endpoint in the body. The body's publisher identity and action must match the route."
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "../openapi.yaml#/components/schemas/PublisherRuntimeRequest" }
      responses:
        "200":
          description: Current runtime epoch and optional deployment lease
          content:
            application/json:
              schema: { $ref: "../openapi.yaml#/components/schemas/PublisherRuntimeResponse" }
        default: { $ref: "../openapi.yaml#/components/responses/Problem" }
    parameters:
      - { $ref: "../openapi.yaml#/components/parameters/PublisherIdentityID" }
  /v1/publisher/runtimes/{publisher_identity_id}/start:
    parameters:
      - { $ref: "../openapi.yaml#/components/parameters/PublisherIdentityID" }
    post:
      operationId: startPublisherRuntime
      tags: [publisher-runtime]
      summary: Start a publisher runtime
      security: []
      description: "Start a process run if the inspected epoch still matches. Send a one-use signed assertion for this endpoint in the body, with matching publisher identity and action. After an uncertain response, keep the same process run and expected epoch but use a fresh assertion. Deployment runtimes also receive a deployment lease."
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "../openapi.yaml#/components/schemas/PublisherRuntimeRequest" }
      responses:
        "200":
          description: Started runtime epoch and optional deployment lease
          content:
            application/json:
              schema: { $ref: "../openapi.yaml#/components/schemas/PublisherRuntimeResponse" }
        default: { $ref: "../openapi.yaml#/components/responses/Problem" }
  /v1/publisher/runtimes/{publisher_identity_id}/renew:
    parameters:
      - { $ref: "../openapi.yaml#/components/parameters/PublisherIdentityID" }
    post:
      operationId: renewPublisherRuntime
      tags: [publisher-runtime]
      summary: Renew a publisher runtime
      security: []
      description: "Renew the current process run and epoch using a one-use signed assertion for this endpoint. The body's publisher identity and action must match the route. Deployment runtimes also receive a deployment lease."
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "../openapi.yaml#/components/schemas/PublisherRuntimeRequest" }
      responses:
        "200":
          description: Current runtime epoch and optional deployment lease
          content:
            application/json:
              schema: { $ref: "../openapi.yaml#/components/schemas/PublisherRuntimeResponse" }
        default: { $ref: "../openapi.yaml#/components/responses/Problem" }
  /v1/publisher/runtimes/{publisher_identity_id}/stop:
    parameters:
      - { $ref: "../openapi.yaml#/components/parameters/PublisherIdentityID" }
    post:
      operationId: stopPublisherRuntime
      tags: [publisher-runtime]
      summary: Stop a publisher runtime
      security: []
      description: "Stop the current process run and epoch using a one-use signed assertion for this endpoint. The body's publisher identity and action must match the route."
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "../openapi.yaml#/components/schemas/PublisherRuntimeRequest" }
      responses:
        "200":
          description: Stopped runtime epoch
          content:
            application/json:
              schema: { $ref: "../openapi.yaml#/components/schemas/PublisherRuntimeResponse" }
        default: { $ref: "../openapi.yaml#/components/responses/Problem" }
  /v1/publisher/services/{service_id}:
    delete:
      operationId: deletePublisherService
      tags: [services]
      summary: Delete this credential's exact temporary service allocation
      description: Requires the durable allocation owner and current publication permission. Named or sibling services cannot be deleted through this operation.
      security: [{ publisherAuth: [] }]
      parameters:
        - {
            name: service_id,
            in: path,
            required: true,
            schema: { $ref: "../openapi.yaml#/components/schemas/ServiceID" },
          }
      responses:
        "204": { description: Temporary service removed }
        default: { $ref: "../openapi.yaml#/components/responses/Problem" }
    get:
      operationId: getPublisherService
      tags: [publisher-identities]
      summary: Read one service covered by the current publisher grant
      security: [{ publisherAuth: [] }]
      description: Read the selected service's approved protocol and target TLS trust metadata. Control checks current publication permission for this exact service without changing the credential's grant. The publisher must declare its own matching configuration when preparing a run.
      parameters:
        - {
            name: service_id,
            in: path,
            required: true,
            schema: { $ref: "../openapi.yaml#/components/schemas/ServiceID" },
          }
      responses:
        "200":
          description: Exact granted service, without target addresses or credentials
          content:
            application/json:
              schema: { $ref: "../openapi.yaml#/components/schemas/Service" }
        default: { $ref: "../openapi.yaml#/components/responses/Problem" }
  /v1/guest-demo/publisher:
    post:
      operationId: enrollGuestPublisher
      tags: [guest-demos]
      summary: Enroll a publisher key for this trial's exact demo service
      description: Authenticate with the trial credential and bind an Ed25519 key to its actual saved service. Control checks current trial ownership, publication eligibility, and server-observed source. The same enrolled current key recovers its facts; another key cannot take over or revive revoked authority. The exact-service grant carries the real guest_id and fixed expiry, with no team_id, namespace allocation, service management, or connector permission.
      security: [{ guestAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "../openapi.yaml#/components/schemas/EnrollGuestPublisherRequest" }
      responses:
        "200":
          description: Ordinary enrollment facts for the trial's exact service
          content:
            application/json:
              schema: { $ref: "../openapi.yaml#/components/schemas/PublisherEnrollmentResult" }
        default: { $ref: "../openapi.yaml#/components/responses/Problem" }
  /v1/publisher-enrollments:
    post:
      operationId: createPublisherEnrollment
      tags: [publisher-identities]
      description: Issue an expiring one-use enrollment secret under current management authorization. Enrollment installs a publisher's signing key for the selected scope; it is separate from exchanging signed assertions for short-lived publisher access tokens.
      summary: Issue an expiring one-use publisher enrollment
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/CreatePublisherEnrollmentRequest"
      responses:
        "201":
          description: One-use enrollment secret
          content:
            application/json:
              schema:
                $ref: "../openapi.yaml#/components/schemas/PublisherEnrollment"
        default:
          $ref: "../openapi.yaml#/components/responses/Problem"
  /v1/publisher-identities:
    get:
      operationId: listPublisherIdentities
      tags: [publisher-identities]
      description: Read a cursor-paginated inventory of publisher identities and their grants for a manageable team. Responses omit enrollment secrets and private signing keys; an inventory entry is not a publisher credential.
      summary: List publisher identities and grants without secrets
      security:
        - bearerAuth: []
      parameters:
        - $ref: "../openapi.yaml#/components/parameters/TeamIDQuery"
        - $ref: "../openapi.yaml#/components/parameters/Cursor"
      responses:
        "200":
          description: Publisher identities
          content:
            application/json:
              schema:
                $ref: "../openapi.yaml#/components/schemas/PublisherIdentityPage"
        default:
          $ref: "../openapi.yaml#/components/responses/Problem"
  /v1/publisher-identities/{publisher_identity_id}:
    delete:
      operationId: revokePublisherIdentity
      tags: [publisher-identities]
      description: Revoke an exact publisher identity under current team management authorization. Identity revocation invalidates its publishing authority independently of any individual grant record.
      summary: Revoke an identity independently of its grants
      security:
        - bearerAuth: []
      parameters:
        - $ref: "../openapi.yaml#/components/parameters/PublisherIdentityID"
        - $ref: "../openapi.yaml#/components/parameters/TeamIDQuery"
      responses:
        "204":
          description: Revoked
        default:
          $ref: "../openapi.yaml#/components/responses/Problem"
  /v1/publisher-identities/{publisher_identity_id}/grants:
    post:
      operationId: createPublisherGrant
      tags: [publisher-identities]
      summary: Add one authorized scope to a publisher identity
      description: Create a revocable publisher grant using current management authorization for the selected scope. The grant identifies what the native publisher may serve; it is not a visitor grant or a control session.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "../openapi.yaml#/components/parameters/PublisherIdentityID"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "../openapi.yaml#/components/schemas/CreatePublisherGrantRequest" }
      responses:
        "201":
          description: Grant created
          content:
            application/json:
              schema: { $ref: "../openapi.yaml#/components/schemas/PublisherGrant" }
        default: { $ref: "../openapi.yaml#/components/responses/Problem" }
  /v1/publisher-identities/{publisher_identity_id}/grants/{grant_id}:
    delete:
      operationId: revokePublisherGrant
      tags: [publisher-identities]
      summary: Revoke one publisher grant without revoking the identity
      description: Revoke the named grant under current team management authorization. Other grants on the identity remain separate; the revoked grant can no longer authorize current publishing work.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "../openapi.yaml#/components/parameters/PublisherIdentityID"
        - $ref: "../openapi.yaml#/components/parameters/TeamIDQuery"
        - name: grant_id
          in: path
          required: true
          schema: { $ref: "../openapi.yaml#/components/schemas/ResourceID" }
      responses:
        "204": { description: Grant revoked }
        default: { $ref: "../openapi.yaml#/components/responses/Problem" }
