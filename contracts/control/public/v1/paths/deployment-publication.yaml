paths:
  /v1/projects/{project_key}/deployments/{deployment}/services/{service}/publication:
    get:
      operationId: getDeploymentPublication
      tags: [deployments]
      summary: Resolve an approved HTTP service for publication
      security: [{ publisherAuth: [] }]
      description: Resolve one named HTTP service without management authority. The current signed credential must independently approve publication of this exact binding in this deployment. Selection does not issue another grant or permit changes to the service's endpoint or visitor policy.
      parameters:
        - { name: project_key, in: path, required: true, schema: { type: string } }
        - { name: deployment, in: path, required: true, schema: { type: string } }
        - { name: service, in: path, required: true, schema: { type: string } }
        - { $ref: "../openapi.yaml#/components/parameters/TeamIDQuery" }
      responses:
        "200":
          description: Approved saved publication
          content:
            application/json:
              schema: { $ref: "../openapi.yaml#/components/schemas/Service" }
        default: { $ref: "../openapi.yaml#/components/responses/Problem" }
  /v1/projects/{project_key}/deployments/{deployment}/services:
    post:
      operationId: allocateDeploymentPublication
      tags: [deployments]
      summary: Allocate an approved temporary HTTP service
      security: [{ publisherAuth: [] }]
      description: Allocate an ephemeral HTTP service in this deployment's namespace. Temporary approval is independent of named publication, management and connection approval. Anonymous visitor policy requires anonymous approval. Exact retries recover only the original live service, never a replacement or extended deadline. Delete through the publisher service operation.
      parameters:
        - { name: project_key, in: path, required: true, schema: { type: string } }
        - { name: deployment, in: path, required: true, schema: { type: string } }
        - { $ref: "../openapi.yaml#/components/parameters/TeamIDQuery" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "../openapi.yaml#/components/schemas/AllocateServiceRequest" }
      responses:
        "201":
          description: Original temporary service
          content:
            application/json:
              schema: { $ref: "../openapi.yaml#/components/schemas/Service" }
        default: { $ref: "../openapi.yaml#/components/responses/Problem" }
