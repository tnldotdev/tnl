paths:
  /v1/visitor-tokens:
    post:
      operationId: issueVisitorToken
      tags: [visitor-access]
      summary: Prepare or renew an exact-resource visitor permission
      description: "Prepare or renew permission to visit one resource.\n\n- control_session or device: send a control-session bearer token.\n- browser_session, workload, share, share_session, or grant: send the source credential in the body. Omit Authorization entirely, including empty headers.\n\nControl checks current access. Use refresh credentials only to request another visitor token."
      security: [{}, { bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "../openapi.yaml#/components/schemas/VisitorTokenRequest" }
      responses:
        "200":
          description: Signed permission, independently bounded by current visitor policy and stream capacity
          content:
            application/json:
              schema: { $ref: "../openapi.yaml#/components/schemas/VisitorTokenResponse" }
        default: { $ref: "../openapi.yaml#/components/responses/Problem" }
