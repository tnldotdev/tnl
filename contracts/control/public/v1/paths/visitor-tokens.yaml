paths:
  /v1/visitor-tokens:
    post:
      operationId: issueVisitorToken
      description: Prepare or renew one signed exact-resource visitor permission from current source facts. Serving processes verify it against current local visitor policy. HTTP-service bearer credentials can also be used directly on their exact service without this exchange; browser-session sources cannot authorize application traffic directly.
      security: [{}, { bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "../openapi.yaml#/components/schemas/VisitorTokenRequest" }
      responses:
        "200":
          description: Signed permission, independently bounded by current visitor policy and stream capacity
          content:
            application/json:
              schema: { $ref: "../openapi.yaml#/components/schemas/VisitorTokenResponse" }
        default: { $ref: "../openapi.yaml#/components/responses/Problem" }
