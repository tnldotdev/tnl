paths:
  /v1/public-urls:
    get:
      operationId: listPublicURLs
      tags: [public-urls]
      description: Read a cursor-paginated inventory of public URLs the caller may manage in one team. An exact canonical_hostname filter returns zero or one non-deleted URL and cannot be combined with a cursor.
      summary: List public URLs for one team
      security:
        - bearerAuth: []
        - guestAuth: []
      parameters:
        - $ref: "../openapi.yaml#/components/parameters/TeamIDQuery"
        - $ref: "../openapi.yaml#/components/parameters/Cursor"
        - $ref: "../openapi.yaml#/components/parameters/CanonicalHostnameQuery"
      responses:
        "200":
          description: PublicURL page
          content:
            application/json:
              schema:
                $ref: "../openapi.yaml#/components/schemas/PublicURLPage"
        default:
          $ref: "../openapi.yaml#/components/responses/Problem"
    post:
      operationId: createPublicURL
      tags: [public-urls]
      description: Save an authorized hostname, target, and visitor policy using an idempotency key. A control session selects an authorized team scope; a guest credential can create only its assigned ephemeral demo hostname. Creation does not start a publish run.
      summary: Create one team public URL
      security:
        - bearerAuth: []
        - guestAuth: []
      parameters:
        - $ref: "../openapi.yaml#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/CreatePublicURLRequest"
      responses:
        "201":
          description: PublicURL created
          content:
            application/json:
              schema:
                $ref: "../openapi.yaml#/components/schemas/PublicURL"
        default:
          $ref: "../openapi.yaml#/components/responses/Problem"
  /v1/public-urls/{public_url_id}:
    get:
      operationId: getPublicURL
      tags: [public-urls]
      description: Read one saved public URL under current management authorization. Its saved policy and lifecycle are separate from whether an active publish run is routable.
      summary: Read one public URL
      security:
        - bearerAuth: []
        - guestAuth: []
      parameters:
        - $ref: "../openapi.yaml#/components/parameters/PublicURLID"
      responses:
        "200":
          description: PublicURL
          content:
            application/json:
              schema:
                $ref: "../openapi.yaml#/components/schemas/PublicURL"
        default:
          $ref: "../openapi.yaml#/components/responses/Problem"
    patch:
      operationId: updatePublicURL
      tags: [public-urls]
      description: "Change only the supplied fields using the mutation_revision you read as expected_mutation_revision. Omitted fields keep their saved values; an empty IP list clears the filter. Null values, empty edits, and stale revisions are rejected."
      summary: Update a public URL's target and IP policy
      security:
        - bearerAuth: []
      parameters:
        - $ref: "../openapi.yaml#/components/parameters/PublicURLID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/UpdatePublicURLRequest"
      responses:
        "200":
          description: Updated public URL
          content:
            application/json:
              schema:
                $ref: "../openapi.yaml#/components/schemas/PublicURL"
        default:
          $ref: "../openapi.yaml#/components/responses/Problem"
    delete:
      operationId: deletePublicURL
      tags: [public-urls]
      description: Delete the saved public URL under current management authorization and close its active publish run. The hostname cannot keep serving through the deleted URL's old run credentials.
      summary: Delete one public URL and close its publish run
      security:
        - bearerAuth: []
        - guestAuth: []
      parameters:
        - $ref: "../openapi.yaml#/components/parameters/PublicURLID"
      responses:
        "204":
          description: PublicURL deleted
        default:
          $ref: "../openapi.yaml#/components/responses/Problem"
  /v1/publisher/public-urls:
    post:
      operationId: allocatePublisherPublicURL
      tags: [public-urls]
      description: Allocate one ephemeral public URL inside the namespace authorized by the publisher access token. This is publisher work, not a management operation; the exact identity and grant retain ownership of the allocation.
      summary: Create a temporary public URL for one ad-hoc publication
      security:
        - publisherAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/AllocateEphemeralPublicURLRequest"
      responses:
        "201":
          description: Public URL assigned to this invocation
          content:
            application/json:
              schema:
                $ref: "../openapi.yaml#/components/schemas/PublicURL"
        default:
          $ref: "../openapi.yaml#/components/responses/Problem"
  /v1/publisher/public-urls/{public_url_id}:
    delete:
      operationId: deletePublisherPublicURL
      tags: [public-urls]
      description: Remove an ephemeral public URL owned by this exact publisher identity and grant. The namespace access token does not authorize deleting other identities' allocations or ordinary saved public URLs.
      summary: Remove the exact URL allocated by this identity and grant
      security:
        - publisherAuth: []
      parameters:
        - $ref: "../openapi.yaml#/components/parameters/PublicURLID"
      responses:
        "204":
          description: The ad-hoc URL is removed
        default:
          $ref: "../openapi.yaml#/components/responses/Problem"
