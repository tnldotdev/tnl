<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 310" role="img" aria-labelledby="title description">
<title id="title">Combined load results</title><desc id="description">One-minute combined traffic on a 16 GiB Docker VM. Each dot is a complete run; orange runs missed or failed fresh requests. Offered load and the relay connection ceiling changed with the public URL count.</desc>
<rect width="660" height="310" fill="#fff"/><g font-family="system-ui, sans-serif" fill="#1d2730"><path d="M80 245H625" stroke="#d9e1e8"/><text x="70" y="249" text-anchor="end" fill="#485665" font-size="12">0</text><path d="M80 202.5H625" stroke="#d9e1e8"/><text x="70" y="206.5" text-anchor="end" fill="#485665" font-size="12">500</text><path d="M80 160H625" stroke="#d9e1e8"/><text x="70" y="164" text-anchor="end" fill="#485665" font-size="12">1000</text><path d="M80 117.5H625" stroke="#d9e1e8"/><text x="70" y="121.5" text-anchor="end" fill="#485665" font-size="12">1500</text><path d="M80 75H625" stroke="#d9e1e8"/><text x="70" y="79" text-anchor="end" fill="#485665" font-size="12">2000</text><text x="80" y="42" text-anchor="start" fill="#485665" font-size="13">Successful fresh-request p95 (ms)</text><circle cx="165" cy="231.261195" r="6" fill="#185abc" stroke="#fff" stroke-width="2"/><circle cx="185" cy="205.135255" r="6" fill="#185abc" stroke="#fff" stroke-width="2"/><circle cx="370" cy="189.984685" r="6" fill="#b84b16" stroke="#fff" stroke-width="2"/><circle cx="555" cy="121.449355" r="6" fill="#b84b16" stroke="#fff" stroke-width="2"/><circle cx="575" cy="83.43726999999998" r="6" fill="#b84b16" stroke="#fff" stroke-width="2"/><text x="175" y="270" text-anchor="middle" fill="#1d2730" font-size="13">4000</text><text x="370" y="270" text-anchor="middle" fill="#1d2730" font-size="13">4500</text><text x="565" y="270" text-anchor="middle" fill="#1d2730" font-size="13">5000</text><text x="330" y="296" text-anchor="middle" fill="#1d2730" font-size="13">Public URLs · blue: all offers succeeded · orange: failed</text></g></svg>
