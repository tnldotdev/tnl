<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 310" role="img" aria-labelledby="title description">
<title id="title">Bandwidth completion time</title><desc id="description">Thirty-second bidirectional transfers at 2,200, 2,400, and 2,600 Mbit/sec per direction. Each dot is one run. Blue passed; orange missed the completion deadline.</desc>
