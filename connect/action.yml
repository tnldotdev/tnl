name: tnl connect
description: Prepare exact tnl environment services across job steps
author: tnldotdev
inputs:
  environment:
    description: JSON environment reference with server, project_key, and environment_id
    required: true
  permission-id:
    description: Exact saved environment visitor permission ID
    required: true
  machine-id:
    description: Exact approved GitHub machine identity ID
    required: true
  audience:
    description: Exact GitHub OIDC audience approved for that identity
    required: true
  version:
    description: Exact npm release version to install; otherwise use the installed project package
    required: false
  working-directory:
    description: Project directory relative to the workspace
    required: false
    default: .
  cli-path:
    description: Explicit native tnl executable, relative to working-directory or absolute
    required: false
  services:
    description: JSON object mapping exact selected service names to protocols
    required: true
  timeout:
    description: Startup timeout in seconds (1-300); does not change authority deadlines
    required: false
    default: "90"
runs:
  using: node24
  main: dist/main/index.mjs
  post: dist/post/index.mjs
  post-if: always()
