name: tnl connect
description: Prepare connector connections for one saved tnl workload across job steps
author: tnldotdev
inputs:
  workload:
    description: Required workload key from the project's tnl configuration
    required: true
  version:
    description: Exact npm release version to install; otherwise use the installed project package
    required: false
  working-directory:
    description: Project directory relative to the workspace
    required: false
    default: .
  cli-path:
    description: Explicit native tnl executable, relative to working-directory or absolute
    required: false
  services:
    description: Newline-separated service keys narrowing the selected workload
    required: false
  timeout:
    description: Startup timeout in seconds (1-300); does not change the workload deadline
    required: false
    default: "90"
runs:
  using: node24
  main: dist/main/index.mjs
  post: dist/post/index.mjs
  post-if: always()
