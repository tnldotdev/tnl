services:
  publisher:
    image: ${TNL_IMAGE:?set the source-built fixture image}
    user: "0:0"
    command: [publish, --enrolled, --foreground, --inspection-mode=none]
    environment:
      TNL_SERVER: ${TNL_SERVER:?set the fixture control URL}
      TNL_TARGET: ${TNL_TARGET:?set the fixture target}
      TNL_ENROLL_KEY: ${TNL_ENROLL_KEY:-}
      TNL_STATE_DIR: /var/lib/tnl/publisher
    volumes:
      - publisher-state:/var/lib/tnl
    restart: unless-stopped
    stop_grace_period: 45s
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]

volumes:
  publisher-state:
