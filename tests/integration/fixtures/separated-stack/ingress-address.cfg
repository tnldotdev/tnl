global
    maxconn 4096
    nbthread 1

defaults
    mode tcp
    timeout connect 1s
    timeout client 1h
    timeout server 1h
    timeout check 1s

resolvers docker
    nameserver embedded 127.0.0.11:53
    hold valid 1s
    hold nx 1s
    hold timeout 1s

frontend ingress_address
    bind :443
    default_backend ingress_processes

backend ingress_processes
    balance roundrobin
    option httpchk GET /ready
    http-check expect status 204
    default-server inter 250ms fall 1 rise 1 resolvers docker init-addr libc,none resolve-prefer ipv4
    server ingress-a ingress-a:443 check port 9090 send-proxy-v2
    server ingress-b ingress-b:443 check port 9090 send-proxy-v2
