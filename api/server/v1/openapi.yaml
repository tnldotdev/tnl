openapi: 3.1.0
info:
  title: tnl server API
  version: 1.0.0
  license:
    name: MIT
    identifier: MIT
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
servers:
  - url: https://control.tnl.dev
paths:
  /v1/health:
    get:
      operationId: getHealth
      summary: Confirm that the control HTTP server is serving
      security: []
      responses:
        "200":
          description: Control HTTP server is serving
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        default:
          $ref: "#/components/responses/Problem"
  /v1/ready:
    get:
      operationId: getReadiness
      summary: Confirm that the control server and durable state are ready
      security: []
      responses:
        "200":
          description: Control server is ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessResponse"
        "503":
          description: Durable state is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessResponse"
        default:
          $ref: "#/components/responses/Problem"
  /v1/capabilities:
    get:
      operationId: getCapabilities
      summary: Describe supported server behavior
      security: []
      responses:
        "200":
          description: Server capabilities
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Capabilities"
        "429":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /v1/transport/relay-map:
    get:
      operationId: getRelayMap
      summary: Return the selected Tailcat DERP region
      security: []
      responses:
        "200":
          description: A bounded Tailscale DERP map containing the selected region
          content:
            application/json:
              schema:
                type: object
        "429":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /v1/auth/token:
    post:
      operationId: exchangeLoginToken
      summary: Exchange a login token for an access token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TokenExchangeRequest"
      responses:
        "200":
          description: Access token issued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenExchangeResponse"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "413":
          $ref: "#/components/responses/Problem"
        "415":
          $ref: "#/components/responses/Problem"
        "429":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /v1/auth/oidc:
    post:
      operationId: exchangeOIDCToken
      summary: Exchange an OIDC ID token for a tnl access token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
                $ref: "#/components/schemas/OIDCTokenExchangeRequest"
      responses:
        "200":
          description: Access token issued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenExchangeResponse"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "413":
          $ref: "#/components/responses/Problem"
        "415":
          $ref: "#/components/responses/Problem"
        "429":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /v1/auth/credentials/{id}:
    delete:
      operationId: revokeAccessCredential
      summary: Revoke an access credential owned by the authenticated identity
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/CredentialID"
      responses:
        "204":
          description: Access credential revoked
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/BearerProblem"
        "404":
          $ref: "#/components/responses/Problem"
        "429":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /v1/hostnames:
    get:
      operationId: listHostnames
      summary: List active hostnames owned by the authenticated identity
      security:
        - bearerAuth: []
      parameters:
        - name: cursor
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/HostnameID"
      responses:
        "200":
          description: Hostnames
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HostnamePage"
        "401":
          $ref: "#/components/responses/BearerProblem"
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: addHostname
      summary: Claim a persistent base or allocate an temporary exact name
      security:
        - bearerAuth: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 128
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddHostnameRequest"
      responses:
        "201":
          description: Hostname added
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Hostname"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/BearerProblem"
        "409":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /v1/hostnames/{id}:
    delete:
      operationId: removeHostname
      summary: Remove an owned persistent hostname
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/HostnameID"
      responses:
        "204":
          description: Hostname removed
        "401":
          $ref: "#/components/responses/BearerProblem"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /v1/domain-verifications:
    post:
      operationId: createDomainVerification
      summary: Create a pending custom-domain verification
      security:
        - bearerAuth: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 128
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateDomainVerificationRequest"
      responses:
        "201":
          description: Pending domain verification
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DomainVerification"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/BearerProblem"
        "409":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /v1/domain-verifications/{id}:
    get:
      operationId: getDomainVerification
      summary: Read an owned custom-domain verification
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/DomainVerificationID"
      responses:
        "200":
          description: Domain verification
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DomainVerification"
        "401":
          $ref: "#/components/responses/BearerProblem"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /v1/domain-verifications/{id}/complete:
    post:
      operationId: completeDomainVerification
      summary: Verify DNS and activate custom-domain ownership
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/DomainVerificationID"
      responses:
        "200":
          description: Active custom domain
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Hostname"
        "401":
          $ref: "#/components/responses/BearerProblem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "412":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /v1/routes:
    get:
      operationId: listRoutes
      summary: List routes owned by the authenticated identity
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Routes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Route"
        "401":
          $ref: "#/components/responses/BearerProblem"
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: createRoute
      summary: Create or reclaim an owned route with a new session version
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRouteRequest"
      responses:
        "201":
          description: Route created or reclaimed and session created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionSetup"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/BearerProblem"
        "409":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /v1/routes/{id}:
    delete:
      operationId: deleteRoute
      summary: Delete a route owned by the authenticated identity
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/RouteID"
      responses:
        "204":
          description: Route deleted
        "401":
          $ref: "#/components/responses/BearerProblem"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /v1/routes/{id}/sessions:
    post:
      operationId: createRouteSession
      summary: Create the next route session version
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/RouteID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRouteSessionRequest"
      responses:
        "201":
          description: Session created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionSetup"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/BearerProblem"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /v1/routes/{id}/transport:
    post:
      operationId: registerRouteTransport
      summary: Register the publisher Tailcat endpoint for a route session
      security:
        - sessionAuth: []
      parameters:
        - $ref: "#/components/parameters/RouteID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterTransportRequest"
      responses:
        "204":
          description: Transport registered and attached
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/BearerProblem"
        "409":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /v1/routes/{id}/heartbeat:
    post:
      operationId: heartbeatRouteSession
      summary: Refresh one current route session
      security:
        - sessionAuth: []
      parameters:
        - $ref: "#/components/parameters/RouteID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RouteVersionRequest"
      responses:
        "200":
          description: Lease refreshed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HeartbeatResponse"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/BearerProblem"
        "409":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /v1/routes/{id}/ready:
    post:
      operationId: markRouteReady
      summary: Publish a current attached route
      security:
        - sessionAuth: []
      parameters:
        - $ref: "#/components/parameters/RouteID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RouteVersionRequest"
      responses:
        "204":
          description: Route published
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/BearerProblem"
        "409":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /v1/routes/{id}/certificate-installed:
    post:
      operationId: markRouteCertificateInstalled
      summary: Acknowledge installation of a validated route certificate
      security:
        - sessionAuth: []
      parameters:
        - $ref: "#/components/parameters/RouteID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CertificateInstalledRequest"
      responses:
        "204":
          description: Certificate installation recorded
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/BearerProblem"
        "409":
          $ref: "#/components/responses/Problem"
        "412":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /v1/certificate-issuances:
    post:
      operationId: createCertificateIssuance
      summary: Create or resume a certificate issuance for a current route session
      security:
        - sessionAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCertificateIssuanceRequest"
      responses:
        "201":
          description: Certificate issuance
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CertificateIssuance"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/BearerProblem"
        "409":
          $ref: "#/components/responses/Problem"
        "412":
          $ref: "#/components/responses/Problem"
        "429":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /v1/certificate-issuances/{id}:
    get:
      operationId: getCertificateIssuance
      summary: Read a durable certificate issuance
      security:
        - sessionAuth: []
      parameters:
        - $ref: "#/components/parameters/CertificateIssuanceID"
      responses:
        "200":
          description: Certificate issuance
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CertificateIssuance"
        "401":
          $ref: "#/components/responses/BearerProblem"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /v1/certificate-issuances/{id}/challenge-ready:
    post:
      operationId: markCertificateChallengeReady
      summary: Probe and complete an installed TLS-ALPN challenge
      security:
        - sessionAuth: []
      parameters:
        - $ref: "#/components/parameters/CertificateIssuanceID"
      responses:
        "200":
          description: Advanced certificate issuance
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CertificateIssuance"
        "401":
          $ref: "#/components/responses/BearerProblem"
        "409":
          $ref: "#/components/responses/Problem"
        "412":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /v1/certificate-issuances/{id}/challenge-removed:
    post:
      operationId: markCertificateChallengeRemoved
      summary: Acknowledge challenge-specific cleanup by the publisher
      security:
        - sessionAuth: []
      parameters:
        - $ref: "#/components/parameters/CertificateIssuanceID"
      responses:
        "204":
          description: Challenge cleanup recorded
        "401":
          $ref: "#/components/responses/BearerProblem"
        "409":
          $ref: "#/components/responses/Problem"
        "412":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: tnl access token
    sessionAuth:
      type: http
      scheme: bearer
      bearerFormat: tnl session token
  parameters:
    RouteID:
      name: id
      in: path
      required: true
      schema:
        type: string
        pattern: ^route_[0-9a-f]{32}$
    CertificateIssuanceID:
      name: id
      in: path
      required: true
      schema:
        type: string
        pattern: ^issuance_[0-9a-f]{32}$
    DomainVerificationID:
      name: id
      in: path
      required: true
      schema:
        type: string
        pattern: ^verification_[0-9a-f]{32}$
  responses:
    Problem:
      description: Request failed
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    BearerProblem:
      description: Bearer authentication failed
      headers:
        WWW-Authenticate:
          schema:
            type: string
            const: Bearer
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
  schemas:
    HealthResponse:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          const: ok
    ReadinessResponse:
      type: object
      additionalProperties: false
      required: [status, checks]
      properties:
        status:
          type: string
          enum: [ready, not_ready]
        checks:
          $ref: "#/components/schemas/ReadinessChecks"
    ReadinessChecks:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          enum: [ok, failed]
    Capabilities:
      type: object
      additionalProperties: false
      required:
        - protocol_versions
        - anonymous_public
        - hostname_authorization
        - hostname_suffix
        - name_authority_type
        - temporary_name_support
        - persistent_base_support
        - custom_domain_support
        - maximum_subdomain_depth
        - dns_ready
        - ingress_ipv4
        - ingress_ipv6
        - transport
      properties:
        protocol_versions:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: integer
            enum: [1]
        anonymous_public:
          type: boolean
        hostname_authorization:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            enum: [local_hostnames, signed_authorization]
        hostname_suffix:
          type: string
          minLength: 1
          maxLength: 189
        name_authority_type:
          type: string
          enum: [local, hosted]
        temporary_name_support:
          type: boolean
        persistent_base_support:
          type: boolean
        custom_domain_support:
          type: boolean
        maximum_subdomain_depth:
          type: integer
          minimum: 0
          maximum: 8
        hosted_authority_endpoint:
          type: string
          format: uri
        dns_ready:
          type: boolean
        ingress_ipv4:
          type: array
          uniqueItems: true
          items:
            type: string
        ingress_ipv6:
          type: array
          uniqueItems: true
          items:
            type: string
        local_hostnames:
          $ref: "#/components/schemas/LocalHostnameCapabilities"
        transport:
          $ref: "#/components/schemas/TransportCapabilities"
        oidc:
          $ref: "#/components/schemas/OIDCCapabilities"
        acme:
          $ref: "#/components/schemas/AcmeCapabilities"
    OIDCCapabilities:
      type: object
      additionalProperties: false
      required: [issuer, client_id]
      properties:
        issuer:
          type: string
          format: uri
        client_id:
          type: string
          minLength: 1
          maxLength: 128
    TransportCapabilities:
      type: object
      additionalProperties: false
      required: [type, version, relay_region]
      properties:
        type:
          type: string
          const: tailcat
        version:
          type: integer
          const: 1
        relay_region:
          type: string
          pattern: ^[a-z0-9][a-z0-9-]{0,62}$
    AcmeCapabilities:
      type: object
      additionalProperties: false
      required: [acme_profile]
      properties:
        acme_profile:
          type: string
          pattern: ^[a-z0-9][a-z0-9-]{0,62}$
    LocalHostnameCapabilities:
      type: object
      additionalProperties: false
      required: [suffix]
      properties:
        suffix:
          type: string
          minLength: 1
          maxLength: 189
    TokenExchangeRequest:
      type: object
      additionalProperties: false
      required: [login_token]
      properties:
        login_token:
          type: string
          minLength: 1
          maxLength: 128
          pattern: '^tnl_login_[A-Za-z0-9_-]{21}[AQgw]\.[A-Za-z0-9_-]{42}[AEIMQUYcgkosw048]$'
    OIDCTokenExchangeRequest:
      type: object
      additionalProperties: false
      required: [id_token]
      properties:
        id_token:
          type: string
          minLength: 1
          maxLength: 16384
    TokenExchangeResponse:
      type: object
      additionalProperties: false
      required: [access_token, credential_id, token_type, expires_at]
      properties:
        access_token:
          type: string
          minLength: 1
          maxLength: 128
          pattern: '^tnl_access_[A-Za-z0-9_-]{21}[AQgw]\.[A-Za-z0-9_-]{42}[AEIMQUYcgkosw048]$'
        credential_id:
          $ref: "#/components/schemas/CredentialID"
        token_type:
          type: string
          const: Bearer
        expires_at:
          type: string
          format: date-time
    CredentialID:
      type: string
      pattern: ^[A-Za-z0-9_-]{21}[AQgw]$
    HostnameID:
      type: string
      pattern: ^hostname_[0-9a-f]{32}$
    AddHostnameRequest:
      type: object
      additionalProperties: false
      required: [kind]
      properties:
        kind:
          type: string
          enum: [managed, temporary]
        name:
          type: string
          minLength: 1
          maxLength: 253
    Hostname:
      type: object
      additionalProperties: false
      required: [id, hostname, kind, status, source, created_at]
      properties:
        id:
          $ref: "#/components/schemas/HostnameID"
        hostname:
          type: string
          minLength: 1
          maxLength: 253
        kind:
          type: string
          enum: [managed, custom_domain, temporary]
        status:
          type: string
          enum: [pending_route, active, inactive, available, retired]
        source:
          type: string
          enum: [generated, user]
        created_at:
          type: string
          format: date-time
        activated_at:
          type: string
          format: date-time
        deactivated_at:
          type: string
          format: date-time
    HostnamePage:
      type: object
      additionalProperties: false
      required: [hostnames]
      properties:
        hostnames:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/Hostname"
        next_cursor:
          $ref: "#/components/schemas/HostnameID"
    CreateDomainVerificationRequest:
      type: object
      additionalProperties: false
      required: [domain]
      properties:
        domain:
          type: string
          minLength: 1
          maxLength: 254
    DomainVerification:
      type: object
      additionalProperties: false
      required: [id, domain, verification_target, apex, status, records, created_at]
      properties:
        id:
          type: string
          pattern: ^verification_[0-9a-f]{32}$
        domain:
          type: string
          minLength: 1
          maxLength: 253
        verification_target:
          type: string
          minLength: 1
          maxLength: 253
        apex:
          type: boolean
        status:
          type: string
          enum: [pending, verified, invalidated]
        hostname_id:
          $ref: "#/components/schemas/HostnameID"
        records:
          type: array
          minItems: 2
          maxItems: 4
          items:
            $ref: "#/components/schemas/DNSRecord"
        created_at:
          type: string
          format: date-time
        verified_at:
          type: string
          format: date-time
        invalidated_at:
          type: string
          format: date-time
    DNSRecord:
      type: object
      additionalProperties: false
      required: [name, type, value]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        type:
          type: string
          enum: [A, AAAA, CNAME]
        value:
          type: string
          minLength: 1
          maxLength: 255
    CreateRouteRequest:
      type: object
      additionalProperties: false
      required: [hostname, local_target, route_token]
      properties:
        hostname:
          type: string
          minLength: 1
          maxLength: 254
        local_target:
          type: string
          minLength: 1
          maxLength: 256
        route_token:
          type: string
          minLength: 1
          maxLength: 128
          pattern: '^tnl_route_[A-Za-z0-9_-]{21}[AQgw]\.[A-Za-z0-9_-]{42}[AEIMQUYcgkosw048]$'
    CreateRouteSessionRequest:
      type: object
      additionalProperties: false
      required: [route_token]
      properties:
        route_token:
          type: string
          minLength: 1
          maxLength: 128
          pattern: '^tnl_route_[A-Za-z0-9_-]{21}[AQgw]\.[A-Za-z0-9_-]{42}[AEIMQUYcgkosw048]$'
    RouteVersionRequest:
      type: object
      additionalProperties: false
      required: [version]
      properties:
        version:
          type: integer
          minimum: 1
    RegisterTransportRequest:
      type: object
      additionalProperties: false
      required: [version, endpoint]
      properties:
        version:
          type: integer
          minimum: 1
        endpoint:
          $ref: "#/components/schemas/TailcatDescriptor"
    TailcatDescriptor:
      type: object
      additionalProperties: false
      required: [version, publisher_public_key, relay_region]
      properties:
        version:
          type: integer
          const: 1
        publisher_public_key:
          type: string
          pattern: ^nodekey:[0-9a-f]{64}$
        relay_region:
          type: string
          pattern: ^[a-z0-9][a-z0-9-]{0,62}$
    Route:
      type: object
      additionalProperties: false
      required: [id, hostname, local_target, status, version, created_at]
      properties:
        id:
          type: string
          pattern: ^route_[0-9a-f]{32}$
        hostname:
          type: string
          minLength: 1
          maxLength: 253
        local_target:
          type: string
          minLength: 1
          maxLength: 256
        status:
          type: string
          enum: [active]
        version:
          type: integer
          minimum: 1
        created_at:
          type: string
          format: date-time
    RouteSession:
      type: object
      additionalProperties: false
      required: [id, route_id, version, status, created_at, expires_at]
      properties:
        id:
          type: string
          pattern: ^session_[0-9a-f]{32}$
        route_id:
          type: string
          pattern: ^route_[0-9a-f]{32}$
        version:
          type: integer
          minimum: 1
        status:
          type: string
          enum: [pending, starting, ready, expired]
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
    SessionSetup:
      type: object
      additionalProperties: false
      required: [route, session, session_token, worker_public_key]
      properties:
        route:
          $ref: "#/components/schemas/Route"
        session:
          $ref: "#/components/schemas/RouteSession"
        session_token:
          type: string
          minLength: 1
          maxLength: 128
          pattern: '^tnl_session_[A-Za-z0-9_-]{21}[AQgw]\.[A-Za-z0-9_-]{42}[AEIMQUYcgkosw048]$'
        worker_public_key:
          type: string
          pattern: ^nodekey:[0-9a-f]{64}$
    HeartbeatResponse:
      type: object
      additionalProperties: false
      required: [expires_at]
      properties:
        expires_at:
          type: string
          format: date-time
    CreateCertificateIssuanceRequest:
      type: object
      additionalProperties: false
      required: [route_id, version, csr, acme_profile]
      properties:
        route_id:
          type: string
          pattern: ^route_[0-9a-f]{32}$
        version:
          type: integer
          minimum: 1
        csr:
          type: string
          minLength: 1
          maxLength: 16384
          pattern: ^[A-Za-z0-9_-]+$
        acme_profile:
          type: string
          pattern: ^[a-z0-9][a-z0-9-]{0,62}$
    CertificateIssuance:
      type: object
      additionalProperties: false
      required: [id, route_id, version, hostname, acme_profile, status, created_at, updated_at]
      properties:
        id:
          type: string
          pattern: ^issuance_[0-9a-f]{32}$
        route_id:
          type: string
          pattern: ^route_[0-9a-f]{32}$
        version:
          type: integer
          minimum: 1
        hostname:
          type: string
          minLength: 1
          maxLength: 253
        acme_profile:
          type: string
          pattern: ^[a-z0-9][a-z0-9-]{0,62}$
        status:
          type: string
          enum:
            - creating_order
            - authorizing
            - waiting_for_challenge
            - validating
            - ready_to_finalize
            - finalizing
            - downloading
            - waiting_for_install
            - installed
            - failed
            - blocked
            - canceled
        challenge:
          $ref: "#/components/schemas/CertificateChallenge"
        certificate_pem:
          type: string
          maxLength: 49152
        not_before:
          type: string
          format: date-time
        not_after:
          type: string
          format: date-time
        renew_at:
          type: string
          format: date-time
        retry_at:
          type: string
          format: date-time
        error:
          type: string
          maxLength: 1024
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    CertificateChallenge:
      type: object
      additionalProperties: false
      required: [id, hostname, digest, expires_at]
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 2048
        hostname:
          type: string
          minLength: 1
          maxLength: 253
        digest:
          type: string
          pattern: ^[A-Za-z0-9_-]{43}$
        expires_at:
          type: string
          format: date-time
    CertificateInstalledRequest:
      type: object
      additionalProperties: false
      required: [version, issuance_id]
      properties:
        version:
          type: integer
          minimum: 1
        issuance_id:
          type: string
          pattern: ^issuance_[0-9a-f]{32}$
    Problem:
      type: object
      additionalProperties: false
      required: [type, title, status, code, request_id, details]
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
          minLength: 1
          maxLength: 128
        status:
          type: integer
          minimum: 400
          maximum: 599
        code:
          type: string
          enum:
            - invalid_argument
            - unauthenticated
            - permission_denied
            - not_found
            - name_unavailable
            - status_conflict
            - idempotency_conflict
            - credential_replayed
            - rate_limited
            - precondition_failed
            - temporarily_unavailable
            - internal
        request_id:
          type: string
          pattern: ^req_[A-Za-z0-9]+$
        details:
          type: object
          maxProperties: 16
