openapi: 3.1.0
info:
  title: tnl server API
  version: 1.0.0
  license:
    name: MIT
    identifier: MIT
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
servers:
  - url: https://control.tnl.dev
paths:
  /v1/health:
    get:
      operationId: getHealth
      summary: Confirm that the control HTTP server is serving
      security: []
      responses:
        "200":
          description: Control HTTP server is serving
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        default:
          $ref: "#/components/responses/Problem"
  /v1/ready:
    get:
      operationId: getReadiness
      summary: Confirm that the control server and durable state are ready
      security: []
      responses:
        "200":
          description: Control server is ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessResponse"
        "503":
          description: Durable state is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessResponse"
        default:
          $ref: "#/components/responses/Problem"
  /v1/client-ip:
    get:
      operationId: getClientIP
      summary: Return the requesting client's public IP address
      security: []
      responses:
        "200":
          description: Client IP address
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientIPResponse"
        "429":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /v1/capabilities:
    get:
      operationId: getCapabilities
      summary: Describe supported server behavior
      security: []
      responses:
        "200":
          description: Server capabilities
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Capabilities"
        "429":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /v1/transport/relay-map:
    get:
      operationId: getRelayMap
      summary: Return the selected Tailcat DERP region
      security: []
      responses:
        "200":
          description: A Tailscale DERP map smaller than 1 MiB containing only the selected region
          content:
            application/json:
              schema:
                type: object
        "429":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /v1/auth/token:
    post:
      operationId: exchangeLoginToken
      summary: Exchange a login token for a control session
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TokenExchangeRequest"
      responses:
        "200":
          description: Control session issued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ControlSessionResponse"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "413":
          $ref: "#/components/responses/Problem"
        "415":
          $ref: "#/components/responses/Problem"
        "429":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /v1/auth/oidc:
    post:
      operationId: exchangeOIDCToken
      summary: Exchange an OIDC ID token for a control session
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OIDCTokenExchangeRequest"
      responses:
        "200":
          description: Control session issued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ControlSessionResponse"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "413":
          $ref: "#/components/responses/Problem"
        "415":
          $ref: "#/components/responses/Problem"
        "429":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /v1/auth/refresh:
    post:
      operationId: refreshControlSession
      summary: Rotate a control session's access and refresh tokens
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshControlSessionRequest"
      responses:
        "200":
          description: Control session tokens rotated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ControlSessionResponse"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "413":
          $ref: "#/components/responses/Problem"
        "415":
          $ref: "#/components/responses/Problem"
        "429":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /v1/auth/logout:
    post:
      operationId: logoutControlSession
      summary: Revoke the authenticated control session
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Control session revoked
        "401":
          $ref: "#/components/responses/BearerProblem"
        "429":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /v1/hostnames:
    get:
      operationId: listHostnames
      summary: List hostname claims owned by the authenticated identity
      security:
        - bearerAuth: []
      parameters:
        - name: cursor
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/HostnameID"
      responses:
        "200":
          description: Hostnames
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HostnamePage"
        "401":
          $ref: "#/components/responses/BearerProblem"
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: claimHostname
      summary: Claim a managed hostname or allocate a temporary hostname
      security:
        - bearerAuth: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 128
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClaimHostnameRequest"
      responses:
        "201":
          description: Hostname claimed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Hostname"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/BearerProblem"
        "409":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /v1/hostnames/{id}:
    delete:
      operationId: releaseHostname
      summary: Release an owned persistent hostname claim
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/HostnameID"
      responses:
        "204":
          description: Hostname released
        "401":
          $ref: "#/components/responses/BearerProblem"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /v1/domain-verifications:
    post:
      operationId: createDomainVerification
      summary: Create a pending custom-domain verification
      security:
        - bearerAuth: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 128
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateDomainVerificationRequest"
      responses:
        "201":
          description: Pending domain verification
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DomainVerification"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/BearerProblem"
        "409":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /v1/domain-verifications/{id}:
    get:
      operationId: getDomainVerification
      summary: Read an owned custom-domain verification
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/DomainVerificationID"
      responses:
        "200":
          description: Domain verification
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DomainVerification"
        "401":
          $ref: "#/components/responses/BearerProblem"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /v1/domain-verifications/{id}/complete:
    post:
      operationId: completeDomainVerification
      summary: Verify DNS and claim a custom domain
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/DomainVerificationID"
      responses:
        "200":
          description: Claimed custom domain
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Hostname"
        "401":
          $ref: "#/components/responses/BearerProblem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "412":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /v1/routes:
    get:
      operationId: listRoutes
      summary: List routes owned by the authenticated identity
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Routes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Route"
        "401":
          $ref: "#/components/responses/BearerProblem"
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: createRoute
      summary: Create or reclaim an owned route with a new route version
      security:
        - bearerAuth: []
        - {}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRouteRequest"
      responses:
        "201":
          description: Route created or reclaimed and session created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionSetup"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/BearerProblem"
        "409":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /v1/routes/{id}:
    delete:
      operationId: deleteRoute
      summary: Delete a route owned by the authenticated identity or route credential
      security:
        - bearerAuth: []
        - routeAuth: []
      parameters:
        - $ref: "#/components/parameters/RouteID"
      responses:
        "204":
          description: Route deleted
        "401":
          $ref: "#/components/responses/BearerProblem"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /v1/routes/{id}/sessions:
    post:
      operationId: createRouteSession
      summary: Create the next route version
      security:
        - bearerAuth: []
        - {}
      parameters:
        - $ref: "#/components/parameters/RouteID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRouteSessionRequest"
      responses:
        "201":
          description: Session created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionSetup"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/BearerProblem"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /v1/routes/{id}/transport:
    post:
      operationId: registerRouteTransport
      summary: Register the publisher Tailcat endpoint for a route session
      security:
        - routeSessionAuth: []
      parameters:
        - $ref: "#/components/parameters/RouteID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterTransportRequest"
      responses:
        "204":
          description: Transport registered and attached
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/BearerProblem"
        "409":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /v1/routes/{id}/heartbeat:
    post:
      operationId: heartbeatRouteSession
      summary: Refresh one current route session
      security:
        - routeSessionAuth: []
      parameters:
        - $ref: "#/components/parameters/RouteID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HeartbeatRouteSessionRequest"
      responses:
        "200":
          description: Route session refreshed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HeartbeatResponse"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/BearerProblem"
        "409":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /v1/routes/{id}/ready:
    post:
      operationId: markRouteReady
      summary: Publish a current attached route
      security:
        - routeSessionAuth: []
      parameters:
        - $ref: "#/components/parameters/RouteID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RouteVersionRequest"
      responses:
        "204":
          description: Route published
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/BearerProblem"
        "409":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /v1/routes/{id}/certificate-installed:
    post:
      operationId: markRouteCertificateInstalled
      summary: Acknowledge installation of a validated route certificate
      security:
        - routeSessionAuth: []
      parameters:
        - $ref: "#/components/parameters/RouteID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CertificateInstalledRequest"
      responses:
        "204":
          description: Certificate installation recorded
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/BearerProblem"
        "409":
          $ref: "#/components/responses/Problem"
        "412":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /v1/admin/status:
    get:
      operationId: getAdminServerStatus
      summary: Return self-hosted server status
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Server status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminServerStatus"
        "401":
          $ref: "#/components/responses/BearerProblem"
        "403":
          $ref: "#/components/responses/Problem"
        "501":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /v1/admin/routes:
    get:
      operationId: listAdminRoutes
      summary: List routes across identities
      security:
        - bearerAuth: []
      parameters:
        - name: cursor
          in: query
          schema:
            $ref: "#/components/schemas/RouteID"
      responses:
        "200":
          description: Route page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminRoutePage"
        "401":
          $ref: "#/components/responses/BearerProblem"
        "403":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /v1/admin/routes/{id}:
    get:
      operationId: getAdminRoute
      summary: Show one route
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/RouteID"
      responses:
        "200":
          description: Route
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminRoute"
        "401":
          $ref: "#/components/responses/BearerProblem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /v1/admin/routes/{id}/suspend:
    post:
      operationId: suspendAdminRoute
      summary: Suspend and drain one route
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/RouteID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SuspendAdminRouteRequest"
      responses:
        "200":
          description: Suspended route
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminRoute"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/BearerProblem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /v1/admin/routes/{id}/resume:
    post:
      operationId: resumeAdminRoute
      summary: Resume one route at a new route version
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/RouteID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResumeAdminRouteRequest"
      responses:
        "200":
          description: Resumed route
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminRoute"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/BearerProblem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /v1/admin/hostnames:
    get:
      operationId: listAdminHostnames
      summary: List local hostnames across identities
      security:
        - bearerAuth: []
      parameters:
        - name: cursor
          in: query
          schema:
            $ref: "#/components/schemas/HostnameID"
      responses:
        "200":
          description: Hostname page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminHostnamePage"
        "401":
          $ref: "#/components/responses/BearerProblem"
        "403":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /v1/admin/hostnames/{id}:
    get:
      operationId: getAdminHostname
      summary: Show one local hostname
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/HostnameID"
      responses:
        "200":
          description: Hostname
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminHostname"
        "401":
          $ref: "#/components/responses/BearerProblem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
    delete:
      operationId: removeAdminHostname
      summary: Remove a local hostname and its routes
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/HostnameID"
      responses:
        "204":
          description: Hostname removed
        "401":
          $ref: "#/components/responses/BearerProblem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /v1/admin/hostnames/{id}/quarantine:
    post:
      operationId: quarantineAdminHostname
      summary: Quarantine a local hostname and suspend its routes
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/HostnameID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminReasonRequest"
      responses:
        "204":
          description: Hostname quarantined
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/BearerProblem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /v1/admin/credentials:
    get:
      operationId: listAdminCredentials
      summary: List nonsecret route credentials
      security:
        - bearerAuth: []
      parameters:
        - name: cursor
          in: query
          schema:
            $ref: "#/components/schemas/CredentialID"
      responses:
        "200":
          description: Credential page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminCredentialPage"
        "401":
          $ref: "#/components/responses/BearerProblem"
        "403":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /v1/admin/credentials/{id}:
    delete:
      operationId: revokeAdminCredential
      summary: Revoke one route credential
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/CredentialID"
      responses:
        "204":
          description: Credential revoked
        "401":
          $ref: "#/components/responses/BearerProblem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /v1/admin/control-sessions:
    get:
      operationId: listAdminControlSessions
      summary: List control sessions without credentials
      security:
        - bearerAuth: []
      parameters:
        - name: cursor
          in: query
          schema:
            $ref: "#/components/schemas/ControlSessionID"
      responses:
        "200":
          description: Control-session page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminControlSessionPage"
        "401":
          $ref: "#/components/responses/BearerProblem"
        "403":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /v1/admin/control-sessions/{id}:
    delete:
      operationId: revokeAdminControlSession
      summary: Revoke one control session
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/ControlSessionID"
      responses:
        "204":
          description: Control session revoked
        "401":
          $ref: "#/components/responses/BearerProblem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /v1/admin/maintenance-controls:
    get:
      operationId: listAdminMaintenanceControls
      summary: List server maintenance controls
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Maintenance controls
          content:
            application/json:
              schema:
                type: array
                minItems: 3
                maxItems: 3
                items:
                  $ref: "#/components/schemas/AdminMaintenanceControl"
        "401":
          $ref: "#/components/responses/BearerProblem"
        "403":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /v1/admin/maintenance-controls/{name}:
    put:
      operationId: setAdminMaintenanceControl
      summary: Set one server maintenance control
      security:
        - bearerAuth: []
      parameters:
        - name: name
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/MaintenanceControlName"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetAdminMaintenanceControlRequest"
      responses:
        "200":
          description: Updated maintenance control
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminMaintenanceControl"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/BearerProblem"
        "403":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /v1/certificate-issuances:
    post:
      operationId: createCertificateIssuance
      summary: Create or resume a certificate issuance for a current route session
      security:
        - routeSessionAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCertificateIssuanceRequest"
      responses:
        "201":
          description: Certificate issuance
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CertificateIssuance"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/BearerProblem"
        "409":
          $ref: "#/components/responses/Problem"
        "412":
          $ref: "#/components/responses/Problem"
        "429":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /v1/certificate-issuances/{id}:
    get:
      operationId: getCertificateIssuance
      summary: Read persisted certificate-issuance state
      security:
        - routeSessionAuth: []
      parameters:
        - $ref: "#/components/parameters/CertificateIssuanceID"
      responses:
        "200":
          description: Certificate issuance
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CertificateIssuance"
        "401":
          $ref: "#/components/responses/BearerProblem"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /v1/certificate-issuances/{id}/challenge-ready:
    post:
      operationId: markCertificateChallengeReady
      summary: Probe and complete an installed TLS-ALPN challenge
      security:
        - routeSessionAuth: []
      parameters:
        - $ref: "#/components/parameters/CertificateIssuanceID"
      responses:
        "200":
          description: Certificate issuance updated after challenge validation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CertificateIssuance"
        "401":
          $ref: "#/components/responses/BearerProblem"
        "409":
          $ref: "#/components/responses/Problem"
        "412":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /v1/certificate-issuances/{id}/challenge-removed:
    post:
      operationId: markCertificateChallengeRemoved
      summary: Acknowledge challenge-specific cleanup by the publisher
      security:
        - routeSessionAuth: []
      parameters:
        - $ref: "#/components/parameters/CertificateIssuanceID"
      responses:
        "204":
          description: Challenge cleanup recorded
        "401":
          $ref: "#/components/responses/BearerProblem"
        "409":
          $ref: "#/components/responses/Problem"
        "412":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: tnl access token
    routeSessionAuth:
      type: http
      scheme: bearer
      bearerFormat: tnl route session token
    routeAuth:
      type: http
      scheme: bearer
      bearerFormat: tnl route token
  parameters:
    RouteID:
      name: id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/RouteID"
    CertificateIssuanceID:
      name: id
      in: path
      required: true
      schema:
        type: string
        pattern: ^issuance_[0-9a-f]{32}$
    DomainVerificationID:
      name: id
      in: path
      required: true
      schema:
        type: string
        pattern: ^verification_[0-9a-f]{32}$
  responses:
    Problem:
      description: Request failed
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    BearerProblem:
      description: Bearer authentication failed
      headers:
        WWW-Authenticate:
          schema:
            type: string
            const: Bearer
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
  schemas:
    HealthResponse:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          const: ok
    ReadinessResponse:
      type: object
      additionalProperties: false
      required: [status, checks]
      properties:
        status:
          type: string
          enum: [ready, not_ready]
        checks:
          $ref: "#/components/schemas/ReadinessChecks"
    ReadinessChecks:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          enum: [ok, failed]
    ClientIPResponse:
      type: object
      additionalProperties: false
      required: [ip]
      properties:
        ip:
          type: string
          description: Canonical IPv4 or IPv6 text as returned by net/netip.Addr.String.
          minLength: 2
          maxLength: 39
    Capabilities:
      type: object
      additionalProperties: false
      required:
        - protocol_versions
        - authentication
        - hostname_authorization
        - hostname_suffix
        - temporary_name_support
        - persistent_base_support
        - custom_domain_support
        - maximum_subdomain_depth
        - dns_ready
        - ingress_ipv4
        - ingress_ipv6
        - transport
        - administration
      properties:
        protocol_versions:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: integer
            enum: [1]
        authentication:
          $ref: "#/components/schemas/AuthenticationCapabilities"
        hostname_authorization:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            enum: [local_hostnames, signed_authorization]
        hostname_suffix:
          type: string
          minLength: 1
          maxLength: 189
        temporary_name_support:
          type: boolean
        persistent_base_support:
          type: boolean
        custom_domain_support:
          type: boolean
        maximum_subdomain_depth:
          type: integer
          minimum: 0
          maximum: 8
        authorization_authority_endpoint:
          type: string
          format: uri
        dns_ready:
          type: boolean
        ingress_ipv4:
          type: array
          uniqueItems: true
          items:
            type: string
        ingress_ipv6:
          type: array
          uniqueItems: true
          items:
            type: string
        local_hostnames:
          $ref: "#/components/schemas/LocalHostnameCapabilities"
        transport:
          $ref: "#/components/schemas/TransportCapabilities"
        oidc:
          $ref: "#/components/schemas/OIDCCapabilities"
        acme:
          $ref: "#/components/schemas/AcmeCapabilities"
        administration:
          $ref: "#/components/schemas/AdministrationCapabilities"
    AdministrationCapabilities:
      type: object
      additionalProperties: false
      required: [version, operations]
      properties:
        version:
          type: integer
          const: 1
        operations:
          type: array
          minItems: 6
          maxItems: 6
          uniqueItems: true
          items:
            type: string
            enum:
              [
                server_status,
                routes,
                hostnames,
                credentials,
                control_sessions,
                maintenance_controls,
              ]
    OIDCCapabilities:
      type: object
      additionalProperties: false
      required: [issuer, client_id, login_flow]
      properties:
        issuer:
          type: string
          format: uri
        client_id:
          type: string
          minLength: 1
          maxLength: 128
        login_flow:
          type: string
          enum: [device_code, authorization_code_pkce]
    AuthenticationCapabilities:
      type: object
      additionalProperties: false
      required: [required, methods]
      properties:
        required:
          type: boolean
          const: true
        methods:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            enum: [login_token, oidc]
    TransportCapabilities:
      type: object
      additionalProperties: false
      required: [type, version, relay_region]
      properties:
        type:
          type: string
          const: tailcat
        version:
          type: integer
          const: 1
        relay_region:
          type: string
          pattern: ^[a-z0-9][a-z0-9-]{0,62}$
    AcmeCapabilities:
      type: object
      additionalProperties: false
      required: [acme_profile]
      properties:
        acme_profile:
          type: string
          pattern: ^[a-z0-9][a-z0-9-]{0,62}$
    LocalHostnameCapabilities:
      type: object
      additionalProperties: false
      required: [suffix]
      properties:
        suffix:
          type: string
          minLength: 1
          maxLength: 189
    TokenExchangeRequest:
      type: object
      additionalProperties: false
      required: [login_token]
      properties:
        login_token:
          type: string
          minLength: 1
          maxLength: 128
          pattern: '^tnl_login_[A-Za-z0-9_-]{21}[AQgw]\.[A-Za-z0-9_-]{42}[AEIMQUYcgkosw048]$'
    OIDCTokenExchangeRequest:
      type: object
      additionalProperties: false
      required: [id_token]
      properties:
        id_token:
          type: string
          minLength: 1
          maxLength: 16384
    RefreshControlSessionRequest:
      type: object
      additionalProperties: false
      required: [refresh_token]
      properties:
        refresh_token:
          type: string
          minLength: 1
          maxLength: 128
          pattern: '^tnl_refresh_[A-Za-z0-9_-]{21}[AQgw]\.[A-Za-z0-9_-]{42}[AEIMQUYcgkosw048]$'
    ControlSessionResponse:
      type: object
      additionalProperties: false
      required:
        - session_id
        - access_token
        - access_expires_at
        - refresh_token
        - refresh_expires_at
        - grants
      properties:
        session_id:
          $ref: "#/components/schemas/ControlSessionID"
        access_token:
          type: string
          minLength: 1
          maxLength: 128
          pattern: '^tnl_access_[A-Za-z0-9_-]{21}[AQgw]\.[A-Za-z0-9_-]{42}[AEIMQUYcgkosw048]$'
        access_expires_at:
          type: string
          format: date-time
        refresh_token:
          type: string
          minLength: 1
          maxLength: 128
          pattern: '^tnl_refresh_[A-Za-z0-9_-]{21}[AQgw]\.[A-Za-z0-9_-]{42}[AEIMQUYcgkosw048]$'
        refresh_expires_at:
          type: string
          format: date-time
        grants:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            $ref: "#/components/schemas/Grant"
    ControlSessionID:
      type: string
      pattern: ^control_session_[0-9a-f]{32}$
    CredentialID:
      type: string
      pattern: ^[A-Za-z0-9_-]{22}$
    RouteID:
      type: string
      pattern: ^route_[0-9a-f]{32}$
    Grant:
      type: string
      enum: [publish, admin]
    HostnameID:
      type: string
      pattern: ^hostname_[0-9a-f]{32}$
    ClaimHostnameRequest:
      type: object
      additionalProperties: false
      required: [kind]
      allOf:
        - if:
            properties:
              kind:
                const: temporary
          then:
            not:
              required: [label]
      properties:
        kind:
          type: string
          description: Managed claims persist until released; temporary hostnames are allocated by the server.
          enum: [managed, temporary]
        label:
          type: string
          description: Preferred DNS label for a managed claim. Omit it to let the server allocate a label.
          minLength: 1
          maxLength: 63
    Hostname:
      type: object
      additionalProperties: false
      required: [id, hostname, kind, status, source, created_at]
      properties:
        id:
          $ref: "#/components/schemas/HostnameID"
        hostname:
          type: string
          minLength: 1
          maxLength: 253
        kind:
          type: string
          enum: [managed, custom_domain, temporary]
        status:
          type: string
          enum: [pending_route, active, inactive, available, retired]
        source:
          type: string
          enum: [generated, user]
        created_at:
          type: string
          format: date-time
        activated_at:
          type: string
          format: date-time
        deactivated_at:
          type: string
          format: date-time
    HostnamePage:
      type: object
      additionalProperties: false
      required: [hostnames]
      properties:
        hostnames:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/Hostname"
        next_cursor:
          $ref: "#/components/schemas/HostnameID"
    CreateDomainVerificationRequest:
      type: object
      additionalProperties: false
      required: [domain]
      properties:
        domain:
          type: string
          minLength: 1
          maxLength: 254
    DomainVerification:
      type: object
      additionalProperties: false
      required: [id, domain, verification_target, apex, status, records, created_at]
      properties:
        id:
          type: string
          pattern: ^verification_[0-9a-f]{32}$
        domain:
          type: string
          minLength: 1
          maxLength: 253
        verification_target:
          type: string
          minLength: 1
          maxLength: 253
        apex:
          type: boolean
        status:
          type: string
          enum: [pending, verified, invalidated]
        hostname_id:
          $ref: "#/components/schemas/HostnameID"
        records:
          type: array
          minItems: 2
          maxItems: 4
          items:
            $ref: "#/components/schemas/DNSRecord"
        created_at:
          type: string
          format: date-time
        verified_at:
          type: string
          format: date-time
        invalidated_at:
          type: string
          format: date-time
    DNSRecord:
      type: object
      additionalProperties: false
      required: [name, type, value]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        type:
          type: string
          enum: [A, AAAA, CNAME]
        value:
          type: string
          minLength: 1
          maxLength: 255
    CreateRouteRequest:
      type: object
      additionalProperties: false
      required: [hostname, local_target, route_token]
      properties:
        hostname:
          type: string
          minLength: 1
          maxLength: 254
        local_target:
          type: string
          minLength: 1
          maxLength: 256
        route_token:
          type: string
          minLength: 1
          maxLength: 128
          pattern: '^tnl_route_[A-Za-z0-9_-]{21}[AQgw]\.[A-Za-z0-9_-]{42}[AEIMQUYcgkosw048]$'
        allowed_ip_prefixes:
          $ref: "#/components/schemas/AllowedIPPrefixes"
        signed_authorization:
          $ref: "#/components/schemas/SignedAuthorizationToken"
    CreateRouteSessionRequest:
      type: object
      additionalProperties: false
      required: [route_token]
      properties:
        route_token:
          type: string
          minLength: 1
          maxLength: 128
          pattern: '^tnl_route_[A-Za-z0-9_-]{21}[AQgw]\.[A-Za-z0-9_-]{42}[AEIMQUYcgkosw048]$'
        allowed_ip_prefixes:
          $ref: "#/components/schemas/AllowedIPPrefixes"
        signed_authorization:
          $ref: "#/components/schemas/SignedAuthorizationToken"
    HeartbeatRouteSessionRequest:
      type: object
      additionalProperties: false
      required: [route_version]
      properties:
        route_version:
          type: integer
          description: Route version owned by the authenticated route session.
          minimum: 1
        signed_authorization:
          $ref: "#/components/schemas/SignedAuthorizationToken"
    RouteVersionRequest:
      type: object
      additionalProperties: false
      required: [route_version]
      properties:
        route_version:
          type: integer
          description: Route version owned by the authenticated route session.
          minimum: 1
    AllowedIPPrefixes:
      type: array
      description: Canonical, masked IPv4 or IPv6 prefixes that replace the policy for the new route version. An empty or omitted list allows all source addresses.
      maxItems: 64
      uniqueItems: true
      items:
        type: string
        description: Canonical IPv4 or IPv6 prefix text accepted by net/netip.ParsePrefix.
        minLength: 3
        maxLength: 43
    SignedAuthorizationToken:
      type: string
      description: Compact EdDSA JWS with kid and typ=tnl-authorization+jwt protected headers.
      minLength: 1
      maxLength: 4096
    RegisterTransportRequest:
      type: object
      additionalProperties: false
      required: [route_version, endpoint]
      properties:
        route_version:
          type: integer
          description: Route version that will use the registered transport.
          minimum: 1
        endpoint:
          $ref: "#/components/schemas/TailcatDescriptor"
    TailcatDescriptor:
      type: object
      additionalProperties: false
      required: [version, publisher_public_key, relay_region]
      properties:
        version:
          type: integer
          const: 1
        publisher_public_key:
          type: string
          pattern: ^nodekey:[0-9a-f]{64}$
        relay_region:
          type: string
          pattern: ^[a-z0-9][a-z0-9-]{0,62}$
    Route:
      type: object
      additionalProperties: false
      required: [id, hostname, local_target, status, route_version, created_at]
      properties:
        id:
          type: string
          pattern: ^route_[0-9a-f]{32}$
        hostname:
          type: string
          minLength: 1
          maxLength: 253
        local_target:
          type: string
          minLength: 1
          maxLength: 256
        status:
          type: string
          enum: [enabled]
        route_version:
          type: integer
          description: Current route version.
          minimum: 1
        created_at:
          type: string
          format: date-time
    AdminServerStatus:
      type: object
      additionalProperties: false
      required:
        [
          mode,
          started_at,
          current_time,
          enabled_routes,
          suspended_routes,
          provisioning_routes,
          connected_workers,
        ]
      properties:
        mode:
          type: string
          enum: [standalone, edge]
        started_at:
          type: string
          format: date-time
        current_time:
          type: string
          format: date-time
        enabled_routes:
          type: integer
          minimum: 0
        suspended_routes:
          type: integer
          minimum: 0
        provisioning_routes:
          type: integer
          minimum: 0
        connected_workers:
          type: integer
          minimum: 0
    AdminRoute:
      type: object
      additionalProperties: false
      required: [id, hostname, local_target, status, route_version, suspension_revision, created_at]
      properties:
        id:
          $ref: "#/components/schemas/RouteID"
        hostname:
          type: string
          minLength: 1
          maxLength: 253
        identity_id:
          type: string
          minLength: 1
          maxLength: 256
        local_target:
          type: string
          minLength: 1
          maxLength: 256
        status:
          type: string
          enum: [enabled, suspended, deleted]
        route_version:
          type: integer
          description: Current route version.
          minimum: 1
        suspension_revision:
          type: integer
          minimum: 0
        suspension_reason:
          type: string
          minLength: 1
          maxLength: 256
        suspended_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        deleted_at:
          type: string
          format: date-time
    AdminRoutePage:
      type: object
      additionalProperties: false
      required: [routes]
      properties:
        routes:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/AdminRoute"
        next_cursor:
          $ref: "#/components/schemas/RouteID"
    SuspendAdminRouteRequest:
      type: object
      additionalProperties: false
      required: [revision, reason]
      properties:
        revision:
          type: integer
          minimum: 1
        reason:
          type: string
          minLength: 1
          maxLength: 256
    ResumeAdminRouteRequest:
      type: object
      additionalProperties: false
      required: [revision]
      properties:
        revision:
          type: integer
          minimum: 1
    AdminReasonRequest:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 256
    AdminHostname:
      type: object
      additionalProperties: false
      required: [id, hostname, kind, status, source, created_at]
      properties:
        id:
          $ref: "#/components/schemas/HostnameID"
        identity_id:
          type: string
          minLength: 1
          maxLength: 256
        hostname:
          type: string
          minLength: 1
          maxLength: 253
        kind:
          type: string
          enum: [managed, custom_domain, temporary]
        status:
          type: string
          enum: [pending_route, active, inactive, available, retired, quarantined]
        source:
          type: string
          pattern: ^(generated|user)$
        created_at:
          type: string
          format: date-time
        activated_at:
          type: string
          format: date-time
        deactivated_at:
          type: string
          format: date-time
        quarantine_reason:
          type: string
          minLength: 1
          maxLength: 256
        quarantined_at:
          type: string
          format: date-time
    AdminHostnamePage:
      type: object
      additionalProperties: false
      required: [hostnames]
      properties:
        hostnames:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/AdminHostname"
        next_cursor:
          $ref: "#/components/schemas/HostnameID"
    AdminCredential:
      type: object
      additionalProperties: false
      required: [id, route_id, created_at]
      properties:
        id:
          $ref: "#/components/schemas/CredentialID"
        route_id:
          $ref: "#/components/schemas/RouteID"
        created_at:
          type: string
          format: date-time
        revoked_at:
          type: string
          format: date-time
    AdminCredentialPage:
      type: object
      additionalProperties: false
      required: [credentials]
      properties:
        credentials:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/AdminCredential"
        next_cursor:
          $ref: "#/components/schemas/CredentialID"
    AdminControlSession:
      type: object
      additionalProperties: false
      required:
        [
          id,
          identity_id,
          authentication_method,
          grants,
          created_at,
          access_expires_at,
          refresh_expires_at,
        ]
      properties:
        id:
          $ref: "#/components/schemas/ControlSessionID"
        identity_id:
          type: string
          minLength: 1
          maxLength: 256
        authentication_method:
          type: string
          pattern: ^(login_token|oidc)$
        grants:
          type: array
          minItems: 1
          maxItems: 2
          uniqueItems: true
          items:
            $ref: "#/components/schemas/Grant"
        created_at:
          type: string
          format: date-time
        access_expires_at:
          type: string
          format: date-time
        refresh_expires_at:
          type: string
          format: date-time
        revoked_at:
          type: string
          format: date-time
    AdminControlSessionPage:
      type: object
      additionalProperties: false
      required: [control_sessions]
      properties:
        control_sessions:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/AdminControlSession"
        next_cursor:
          $ref: "#/components/schemas/ControlSessionID"
    MaintenanceControlName:
      type: string
      enum: [route_creation, route_session_creation, certificate_issuance]
    AdminMaintenanceControl:
      type: object
      additionalProperties: false
      required: [name, enabled, revision, updated_at, updated_by]
      properties:
        name:
          $ref: "#/components/schemas/MaintenanceControlName"
        enabled:
          type: boolean
        revision:
          type: integer
          minimum: 1
        updated_at:
          type: string
          format: date-time
        updated_by:
          type: string
          minLength: 1
          maxLength: 256
    SetAdminMaintenanceControlRequest:
      type: object
      additionalProperties: false
      required: [enabled]
      properties:
        enabled:
          type: boolean
    RouteSession:
      type: object
      additionalProperties: false
      required: [id, route_id, route_version, status, created_at, expires_at]
      properties:
        id:
          type: string
          pattern: ^session_[0-9a-f]{32}$
        route_id:
          type: string
          pattern: ^route_[0-9a-f]{32}$
        route_version:
          type: integer
          description: Route version represented by this session.
          minimum: 1
        status:
          type: string
          enum: [pending, starting, ready, expired]
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
    SessionSetup:
      type: object
      additionalProperties: false
      required: [route, session, session_token, worker_public_key]
      properties:
        route:
          $ref: "#/components/schemas/Route"
        session:
          $ref: "#/components/schemas/RouteSession"
        session_token:
          type: string
          minLength: 1
          maxLength: 128
          pattern: '^tnl_session_[A-Za-z0-9_-]{21}[AQgw]\.[A-Za-z0-9_-]{42}[AEIMQUYcgkosw048]$'
        worker_public_key:
          type: string
          pattern: ^nodekey:[0-9a-f]{64}$
    HeartbeatResponse:
      type: object
      additionalProperties: false
      required: [expires_at]
      properties:
        expires_at:
          type: string
          format: date-time
    CreateCertificateIssuanceRequest:
      type: object
      additionalProperties: false
      required: [route_id, route_version, csr, acme_profile]
      properties:
        route_id:
          type: string
          pattern: ^route_[0-9a-f]{32}$
        route_version:
          type: integer
          description: Route version requesting the certificate.
          minimum: 1
        csr:
          type: string
          minLength: 1
          maxLength: 16384
          pattern: ^[A-Za-z0-9_-]+$
        acme_profile:
          type: string
          pattern: ^[a-z0-9][a-z0-9-]{0,62}$
    CertificateIssuance:
      type: object
      additionalProperties: false
      required:
        [id, route_id, route_version, hostname, acme_profile, status, created_at, updated_at]
      properties:
        id:
          type: string
          pattern: ^issuance_[0-9a-f]{32}$
        route_id:
          type: string
          pattern: ^route_[0-9a-f]{32}$
        route_version:
          type: integer
          description: Route version that requested the certificate.
          minimum: 1
        hostname:
          type: string
          minLength: 1
          maxLength: 253
        acme_profile:
          type: string
          pattern: ^[a-z0-9][a-z0-9-]{0,62}$
        status:
          type: string
          enum:
            - creating_order
            - authorizing
            - waiting_for_challenge
            - validating
            - ready_to_finalize
            - finalizing
            - downloading
            - waiting_for_install
            - installed
            - failed
            - blocked
            - canceled
        challenge:
          $ref: "#/components/schemas/CertificateChallenge"
        certificate_pem:
          type: string
          maxLength: 49152
        not_before:
          type: string
          format: date-time
        not_after:
          type: string
          format: date-time
        renew_at:
          type: string
          format: date-time
        retry_at:
          type: string
          format: date-time
        error:
          type: string
          maxLength: 1024
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    CertificateChallenge:
      type: object
      additionalProperties: false
      required: [id, hostname, digest, expires_at]
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 2048
        hostname:
          type: string
          minLength: 1
          maxLength: 253
        digest:
          type: string
          pattern: ^[A-Za-z0-9_-]{43}$
        expires_at:
          type: string
          format: date-time
    CertificateInstalledRequest:
      type: object
      additionalProperties: false
      required: [route_version, issuance_id]
      properties:
        route_version:
          type: integer
          description: Route version where the certificate was installed.
          minimum: 1
        issuance_id:
          type: string
          pattern: ^issuance_[0-9a-f]{32}$
    Problem:
      type: object
      additionalProperties: false
      required: [type, title, status, code, request_id, details]
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
          minLength: 1
          maxLength: 128
        status:
          type: integer
          minimum: 400
          maximum: 599
        code:
          type: string
          enum:
            - invalid_argument
            - unauthenticated
            - permission_denied
            - not_found
            - name_unavailable
            - status_conflict
            - idempotency_conflict
            - credential_replayed
            - rate_limited
            - precondition_failed
            - temporarily_unavailable
            - unsupported
            - internal
        request_id:
          type: string
          pattern: ^req_[A-Za-z0-9]+$
        details:
          type: object
          maxProperties: 16
