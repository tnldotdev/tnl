schemas:
  PublicURLRecoveryObservationRequest:
    unevaluatedProperties: false
    allOf:
      - $ref: "../openapi.yaml#/components/schemas/IngressLeaseIdentity"
      - type: object
        required: [public_url_id, publish_run_number, observed_at]
        properties:
          public_url_id:
            $ref: "../openapi.yaml#/components/schemas/Identifier"
          publish_run_number:
            type: integer
            format: int64
            minimum: 1
          observed_at:
            type: string
            format: date-time
  PublicURLRecoveryObservation:
    type: object
    additionalProperties: false
    required:
      [
        recovery_episode_id,
        public_url_id,
        publish_run_number,
        opened_at,
        observed_at,
        observed_seconds,
      ]
    properties:
      recovery_episode_id:
        type: integer
        format: int64
        minimum: 1
      public_url_id:
        $ref: "../openapi.yaml#/components/schemas/Identifier"
      publish_run_number:
        type: integer
        format: int64
        minimum: 1
      opened_at:
        type: string
        format: date-time
      observed_at:
        type: string
        format: date-time
      observed_seconds:
        type: number
        format: double
        minimum: 0
