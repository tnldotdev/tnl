schemas:
  IngressUsageReport:
    type: object
    additionalProperties: false
    required:
      - public_url_id
      - publish_run_number
      - bucket_start
      - bucket_end
      - observed_through
      - report_revision
      - connection_attempts
      - policy_denials
      - capacity_denials
      - visitor_stream_open_failures
      - successful_streams
      - connection_nanoseconds
      - ingress_bytes
      - egress_bytes
      - histogram_data
      - final
    properties:
      public_url_id:
        $ref: "../openapi.yaml#/components/schemas/Identifier"
      publish_run_number:
        type: integer
        format: int64
        minimum: 1
      bucket_start:
        type: string
        format: date-time
      bucket_end:
        type: string
        format: date-time
      observed_through:
        type: string
        format: date-time
      report_revision:
        type: integer
        format: int64
        minimum: 1
      connection_attempts:
        type: integer
        format: int64
        minimum: 0
      policy_denials:
        type: integer
        format: int64
        minimum: 0
      capacity_denials:
        type: integer
        format: int64
        minimum: 0
      visitor_stream_open_failures:
        type: integer
        format: int64
        minimum: 0
      successful_streams:
        type: integer
        format: int64
        minimum: 0
      connection_nanoseconds:
        type: integer
        format: int64
        minimum: 0
      ingress_bytes:
        type: integer
        format: int64
        minimum: 0
      egress_bytes:
        type: integer
        format: int64
        minimum: 0
      histogram_data:
        type: string
        format: byte
      final:
        type: boolean
  IngressUsageReportBatch:
    unevaluatedProperties: false
    allOf:
      - $ref: "../openapi.yaml#/components/schemas/IngressLeaseIdentity"
      - type: object
        required: [complete, reports]
        properties:
          observed_through:
            type: string
            format: date-time
          complete:
            type: boolean
          reports:
            type: array
            maxItems: 256
            items:
              $ref: "../openapi.yaml#/components/schemas/IngressUsageReport"
  PublicURLRecoveryObservationRequest:
    unevaluatedProperties: false
    allOf:
      - $ref: "../openapi.yaml#/components/schemas/IngressLeaseIdentity"
      - type: object
        required: [public_url_id, publish_run_number, observed_at]
        properties:
          public_url_id:
            $ref: "../openapi.yaml#/components/schemas/Identifier"
          publish_run_number:
            type: integer
            format: int64
            minimum: 1
          observed_at:
            type: string
            format: date-time
  PublicURLRecoveryObservation:
    type: object
    additionalProperties: false
    required:
      [
        recovery_episode_id,
        public_url_id,
        publish_run_number,
        opened_at,
        observed_at,
        observed_seconds,
      ]
    properties:
      recovery_episode_id:
        type: integer
        format: int64
        minimum: 1
      public_url_id:
        $ref: "../openapi.yaml#/components/schemas/Identifier"
      publish_run_number:
        type: integer
        format: int64
        minimum: 1
      opened_at:
        type: string
        format: date-time
      observed_at:
        type: string
        format: date-time
      observed_seconds:
        type: number
        format: double
        minimum: 0
