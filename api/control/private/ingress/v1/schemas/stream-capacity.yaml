schemas:
  StreamCapacityRequest:
    type: object
    additionalProperties: false
    required:
      [ingress_run_id, ingress_lease_revision, resource, run_id, run_number, request_id, capacity]
    properties:
      ingress_run_id: { type: string, maxLength: 128 }
      ingress_lease_revision: { type: integer, format: int64, minimum: 1 }
      resource:
        { $ref: "../../../../public/v1/openapi.yaml#/components/schemas/VisitorResourceScope" }
      run_id: { type: string, maxLength: 64 }
      run_number: { type: integer, format: int64, minimum: 1 }
      request_id: { type: string, minLength: 1, maxLength: 128 }
      capacity: { type: integer, minimum: 1, maximum: 1048576 }
  StreamCapacityRetirement:
    type: object
    additionalProperties: false
    required: [ingress_run_id, ingress_lease_revision]
    properties:
      ingress_run_id: { type: string, maxLength: 128 }
      ingress_lease_revision: { type: integer, format: int64, minimum: 1 }
