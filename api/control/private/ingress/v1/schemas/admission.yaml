schemas:
  ServiceID:
    type: string
    pattern: "^svc_[A-Za-z0-9]{22}$"
  ServiceRunID:
    type: string
    pattern: "^srun_[A-Za-z0-9]{22}$"
  ConnectorSessionID:
    type: string
    pattern: "^cns_[A-Za-z0-9]{22}$"
  VisitorConnectionID:
    type: string
    pattern: "^vc_[A-Za-z0-9]{22}$"
  ConnectorSessionClaim:
    type: object
    additionalProperties: false
    required:
      [
        ingress_run_id,
        ingress_lease_revision,
        service_id,
        connector_session_id,
        session_credential,
        observed_source_ip,
        subject,
        nonce,
        signature,
      ]
    properties:
      ingress_run_id: { $ref: "../openapi.yaml#/components/schemas/Identifier" }
      ingress_lease_revision: { type: integer, format: int64, minimum: 1 }
      service_id: { $ref: "../openapi.yaml#/components/schemas/ServiceID" }
      connector_session_id: { $ref: "../openapi.yaml#/components/schemas/ConnectorSessionID" }
      session_credential: { type: string, minLength: 32, maxLength: 512 }
      subject: { $ref: "../../../../public/v1/openapi.yaml#/components/schemas/VisitorSubject" }
      nonce: { type: string, pattern: "^[0-9a-f]{64}$" }
      signature: { type: string, pattern: "^[A-Za-z0-9_-]{86}$" }
      observed_source_ip:
        {
          type: string,
          minLength: 3,
          maxLength: 45,
          description: Trusted original source observed by ingress on this mux socket. The connector never supplies this value.,
        }
  ConnectorSessionResult:
    type: object
    additionalProperties: false
    required: [connector_session_id, service_id, subject, observed_source_ip, expires_at]
    properties:
      connector_session_id: { $ref: "../openapi.yaml#/components/schemas/ConnectorSessionID" }
      service_id: { $ref: "../openapi.yaml#/components/schemas/ServiceID" }
      subject: { $ref: "../../../../public/v1/openapi.yaml#/components/schemas/VisitorSubject" }
      observed_source_ip: { type: string, minLength: 3, maxLength: 45 }
      expires_at: { type: string, format: date-time }
  DirectServiceVisitorClaim:
    type: object
    additionalProperties: false
    required:
      [
        ingress_run_id,
        ingress_lease_revision,
        ingress_pool_id,
        destination_port,
        observed_source_ip,
        visitor_connection_id,
      ]
    properties:
      ingress_run_id: { $ref: "../openapi.yaml#/components/schemas/Identifier" }
      ingress_lease_revision: { type: integer, format: int64, minimum: 1 }
      ingress_pool_id: { type: string, minLength: 1, maxLength: 128 }
      destination_port: { type: integer, minimum: 1024, maximum: 65535 }
      observed_source_ip: { type: string, minLength: 1, maxLength: 64 }
      visitor_connection_id: { $ref: "../openapi.yaml#/components/schemas/VisitorConnectionID" }
  DirectServiceVisitorLookup:
    type: object
    additionalProperties: false
    required: [ingress_run_id, ingress_lease_revision, visitor_connection_id]
    properties:
      ingress_run_id: { $ref: "../openapi.yaml#/components/schemas/Identifier" }
      ingress_lease_revision: { type: integer, format: int64, minimum: 1 }
      visitor_connection_id: { $ref: "../openapi.yaml#/components/schemas/VisitorConnectionID" }
  DirectServiceVisitorAdmission:
    type: object
    additionalProperties: false
    required:
      [service_id, service_run_id, run_number, visitor_connection_id, expires_at, connected_relays]
    properties:
      service_id: { $ref: "../openapi.yaml#/components/schemas/ServiceID" }
      service_run_id: { $ref: "../openapi.yaml#/components/schemas/ServiceRunID" }
      run_number: { type: integer, format: int64, minimum: 1 }
      visitor_connection_id: { $ref: "../openapi.yaml#/components/schemas/VisitorConnectionID" }
      expires_at: { type: string, format: date-time }
      connected_relays:
        type: array
        minItems: 1
        maxItems: 2
        items: { $ref: "../openapi.yaml#/components/schemas/ServiceRelay" }
  DirectServiceVisitorStatus:
    type: object
    additionalProperties: false
    required: [state, valid_until]
    properties:
      state:
        {
          type: string,
          enum: [pending, authenticated, allowed, denied],
          x-enum-varnames:
            [
              DirectVisitorPending,
              DirectVisitorAuthenticated,
              DirectVisitorAllowed,
              DirectVisitorDenied,
            ],
        }
      valid_until: { type: string, format: date-time }
  ServiceProjection:
    type: object
    additionalProperties: false
    required: [revision, service_id, kind, expires_at]
    properties:
      revision: { type: integer, format: int64, minimum: 1 }
      service_id: { $ref: "../openapi.yaml#/components/schemas/ServiceID" }
      kind: { type: string, enum: [upsert, tombstone] }
      service_run_id: { $ref: "../openapi.yaml#/components/schemas/ServiceRunID" }
      run_number: { type: integer, format: int64, minimum: 1 }
      expires_at: { type: string, format: date-time }
      connected_relays:
        {
          type: array,
          minItems: 1,
          maxItems: 2,
          items: { $ref: "../openapi.yaml#/components/schemas/ServiceRelay" },
        }
  ServiceRelay:
    type: object
    additionalProperties: false
    required:
      [
        publisher_connection_id,
        connection_slot,
        connection_assignment_revision,
        internal_relay_address,
        tls_server_name,
        relay_service_id,
        relay_id,
        relay_run_id,
        relay_lease_revision,
        lease_expires_at,
      ]
    properties:
      publisher_connection_id: { $ref: "../openapi.yaml#/components/schemas/Identifier" }
      connection_slot: { type: integer, minimum: 0, maximum: 1 }
      connection_assignment_revision: { type: integer, format: int64, minimum: 1 }
      internal_relay_address: { type: string, minLength: 1 }
      tls_server_name: { type: string, minLength: 1, maxLength: 253 }
      relay_service_id: { $ref: "../openapi.yaml#/components/schemas/Identifier" }
      relay_id: { $ref: "../openapi.yaml#/components/schemas/Identifier" }
      relay_run_id: { $ref: "../openapi.yaml#/components/schemas/Identifier" }
      relay_lease_revision: { type: integer, format: int64, minimum: 1 }
      lease_expires_at: { type: string, format: date-time }
  ServiceSnapshot:
    type: object
    additionalProperties: false
    required: [revision, entries]
    properties:
      revision: { type: integer, format: int64, minimum: 0 }
      entries:
        { type: array, items: { $ref: "../openapi.yaml#/components/schemas/ServiceProjection" } }
  ServiceStreamClaim:
    type: object
    additionalProperties: false
    required:
      [
        ingress_run_id,
        ingress_lease_revision,
        service_id,
        service_run_id,
        run_number,
        connector_session_id,
        observed_source_ip,
        visitor_connection_id,
      ]
    properties:
      ingress_run_id: { $ref: "../openapi.yaml#/components/schemas/Identifier" }
      ingress_lease_revision: { type: integer, format: int64, minimum: 1 }
      service_id: { $ref: "../openapi.yaml#/components/schemas/ServiceID" }
      service_run_id: { $ref: "../openapi.yaml#/components/schemas/ServiceRunID" }
      run_number: { type: integer, format: int64, minimum: 1 }
      connector_session_id: { $ref: "../openapi.yaml#/components/schemas/ConnectorSessionID" }
      observed_source_ip:
        {
          type: string,
          minLength: 3,
          maxLength: 45,
          description: Copied by ingress from the authenticated mux socket,
          not parsed from the visitor stream.,
        }
      visitor_connection_id: { $ref: "../openapi.yaml#/components/schemas/VisitorConnectionID" }
  ServiceStreamResult:
    type: object
    additionalProperties: false
    required:
      [
        service_id,
        service_run_id,
        run_number,
        connector_session_id,
        subject,
        observed_source_ip,
        visitor_connection_id,
        expires_at,
        valid_until,
        grant_revision,
      ]
    properties:
      service_id: { $ref: "../openapi.yaml#/components/schemas/ServiceID" }
      service_run_id: { $ref: "../openapi.yaml#/components/schemas/ServiceRunID" }
      run_number: { type: integer, format: int64, minimum: 1 }
      connector_session_id: { $ref: "../openapi.yaml#/components/schemas/ConnectorSessionID" }
      subject: { $ref: "../../../../public/v1/openapi.yaml#/components/schemas/VisitorSubject" }
      observed_source_ip: { type: string, minLength: 3, maxLength: 45 }
      visitor_connection_id: { $ref: "../openapi.yaml#/components/schemas/VisitorConnectionID" }
      expires_at: { type: string, format: date-time }
      valid_until:
        type: string
        format: date-time
        description: Hard deadline bounded by the current grant, connector session, publisher run, ingress and live relay leases, and at most two minutes from this decision.
      grant_revision: { type: integer, format: int64, minimum: 1 }
  ServiceVisitorRecheck:
    type: object
    additionalProperties: false
    required:
      [
        ingress_run_id,
        ingress_lease_revision,
        service_id,
        service_run_id,
        run_number,
        connector_session_id,
        subject,
        observed_source_ip,
        visitor_connection_id,
      ]
    properties:
      ingress_run_id: { $ref: "../openapi.yaml#/components/schemas/Identifier" }
      ingress_lease_revision: { type: integer, format: int64, minimum: 1 }
      service_id: { $ref: "../openapi.yaml#/components/schemas/ServiceID" }
      service_run_id: { $ref: "../openapi.yaml#/components/schemas/ServiceRunID" }
      run_number: { type: integer, format: int64, minimum: 1 }
      connector_session_id: { $ref: "../openapi.yaml#/components/schemas/ConnectorSessionID" }
      subject: { $ref: "../../../../public/v1/openapi.yaml#/components/schemas/VisitorSubject" }
      observed_source_ip:
        {
          type: string,
          minLength: 3,
          maxLength: 45,
          description: Copied from the original ingress-observed mux source; never supplied by a visitor.,
        }
      visitor_connection_id: { $ref: "../openapi.yaml#/components/schemas/VisitorConnectionID" }
  ServiceVisitorRecheckResult:
    type: object
    additionalProperties: false
    required: [allowed, recheck_at, valid_until]
    properties:
      allowed: { type: boolean }
      recheck_at:
        {
          type: string,
          format: date-time,
          description: Ingress must check again no later than this time,
          and must cap loss of control at two minutes after the last successful check.,
        }
      valid_until:
        type: string
        format: date-time
        description: Current hard deadline, including grant and run expiration; never later than two minutes from this decision.
