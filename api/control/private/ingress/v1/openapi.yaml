openapi: 3.1.0
info:
  title: tnl ingress API
  version: 1.0.0
  license:
    name: BSD-3-Clause
    identifier: BSD-3-Clause
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
servers:
  - url: https://ingress-control.internal
security:
  - clusterAuth: []
paths:
  /internal/v1/ingresses/{ingress_id}/visitor-policy:
    $ref: "./paths/visitor-policy.yaml#/paths/~1internal~1v1~1ingresses~1{ingress_id}~1visitor-policy"
  /internal/v1/ingresses/{ingress_id}/public-services/admit:
