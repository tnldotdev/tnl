    Identifier:
      $ref: "./schemas/common.yaml#/schemas/Identifier"
    IngressRegistration:
      $ref: "./schemas/leases.yaml#/schemas/IngressRegistration"
    IngressLeaseIdentity:
      $ref: "./schemas/leases.yaml#/schemas/IngressLeaseIdentity"
    IngressRenewal:
      $ref: "./schemas/leases.yaml#/schemas/IngressRenewal"
    IngressDrainRequest:
      $ref: "./schemas/leases.yaml#/schemas/IngressDrainRequest"
    IngressLease:
      $ref: "./schemas/leases.yaml#/schemas/IngressLease"
    IngressRoutingPublisherConnection:
      $ref: "./schemas/routing.yaml#/schemas/IngressRoutingPublisherConnection"
    IngressRoutingTableEntry:
      $ref: "./schemas/routing.yaml#/schemas/IngressRoutingTableEntry"
    IngressTrafficLimits:
      $ref: "./schemas/leases.yaml#/schemas/IngressTrafficLimits"
    IngressPublicRunObservation:
      $ref: "./schemas/leases.yaml#/schemas/IngressPublicRunObservation"
    HashedIPPrefix:
      $ref: "./schemas/routing.yaml#/schemas/HashedIPPrefix"
    IngressRoutingTableEvent:
      $ref: "./schemas/routing.yaml#/schemas/IngressRoutingTableEvent"
    IngressRoutingTableSnapshot:
      $ref: "./schemas/routing.yaml#/schemas/IngressRoutingTableSnapshot"
    IngressRoutingTablePage:
      $ref: "./schemas/routing.yaml#/schemas/IngressRoutingTablePage"
    IngressUsageReport:
      $ref: "./schemas/reporting.yaml#/schemas/IngressUsageReport"
    VisitorNetworkHashKey:
      $ref: "./schemas/leases.yaml#/schemas/VisitorNetworkHashKey"
    IngressUsageReportBatch:
      $ref: "./schemas/reporting.yaml#/schemas/IngressUsageReportBatch"
    PublicURLRecoveryObservationRequest:
      $ref: "./schemas/reporting.yaml#/schemas/PublicURLRecoveryObservationRequest"
    PublicURLRecoveryObservation:
      $ref: "./schemas/reporting.yaml#/schemas/PublicURLRecoveryObservation"
    ProblemCode:
      $ref: "./schemas/routing.yaml#/schemas/ProblemCode"
    Problem:
      $ref: "./schemas/routing.yaml#/schemas/Problem"
