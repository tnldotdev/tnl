  /internal/v1/ingresses/{ingress_id}/public-services/status:
    $ref: "./paths/public-services.yaml#/paths/~1internal~1v1~1ingresses~1{ingress_id}~1public-services~1status"
  /internal/v1/ingresses/{ingress_id}/public-services/promote:
    $ref: "./paths/public-services.yaml#/paths/~1internal~1v1~1ingresses~1{ingress_id}~1public-services~1promote"
  /internal/v1/ingresses/{ingress_id}/public-services/close:
    $ref: "./paths/public-services.yaml#/paths/~1internal~1v1~1ingresses~1{ingress_id}~1public-services~1close"
  /internal/v1/ingresses/{ingress_id}/service-observations:
    $ref: "./paths/reporting.yaml#/paths/~1internal~1v1~1ingresses~1{ingress_id}~1service-observations"
  /internal/v1/ingresses/register:
    $ref: "./paths/leases.yaml#/paths/~1internal~1v1~1ingresses~1register"
  /internal/v1/ingresses/{ingress_id}/renew:
    $ref: "./paths/leases.yaml#/paths/~1internal~1v1~1ingresses~1{ingress_id}~1renew"
  /internal/v1/ingresses/{ingress_id}/drain:
    $ref: "./paths/leases.yaml#/paths/~1internal~1v1~1ingresses~1{ingress_id}~1drain"
  /internal/v1/ingresses/{ingress_id}/routing-table/snapshot:
    $ref: "./paths/routing.yaml#/paths/~1internal~1v1~1ingresses~1{ingress_id}~1routing-table~1snapshot"
  /internal/v1/ingresses/{ingress_id}/routing-table/events:
    $ref: "./paths/routing.yaml#/paths/~1internal~1v1~1ingresses~1{ingress_id}~1routing-table~1events"
  /internal/v1/ingresses/{ingress_id}/usage-reports:
    $ref: "./paths/reporting.yaml#/paths/~1internal~1v1~1ingresses~1{ingress_id}~1usage-reports"
  /internal/v1/ingresses/{ingress_id}/public-url-recovery/{recovery_episode_id}/observed:
    $ref: "./paths/reporting.yaml#/paths/~1internal~1v1~1ingresses~1{ingress_id}~1public-url-recovery~1{recovery_episode_id}~1observed"
