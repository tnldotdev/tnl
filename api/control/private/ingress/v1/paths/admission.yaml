paths:
  /internal/v1/ingresses/{ingress_id}/connector-sessions/claim:
    post:
      operationId: claimConnectorSession
      description: Authenticate an enrolled device on its assigned ingress lease and bind ingress-observed socket source metadata. Each stream is authorized separately for its exact service.
      parameters: [{ $ref: "../openapi.yaml#/components/parameters/IngressID" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "../openapi.yaml#/components/schemas/ConnectorSessionClaim" }
      responses:
        "200":
          description: Authenticated mux session, without visitor stream permission
          content:
            application/json:
              schema: { $ref: "../openapi.yaml#/components/schemas/ConnectorSessionResult" }
        default: { $ref: "../openapi.yaml#/components/responses/Problem" }
  /internal/v1/ingresses/{ingress_id}/services/snapshot:
    get:
      operationId: getServiceSnapshot
      description: Service/run IDs and connected relay assignments for a current ingress lease. Publisher stream keys are returned by authenticated control selection.
      parameters:
        - $ref: "../openapi.yaml#/components/parameters/IngressID"
        - $ref: "../openapi.yaml#/components/parameters/IngressRunID"
        - $ref: "../openapi.yaml#/components/parameters/IngressLeaseRevision"
      responses:
        "200":
          {
            description: Current service projections,
            content:
              {
                application/json:
                  { schema: { $ref: "../openapi.yaml#/components/schemas/ServiceSnapshot" } },
              },
          }
        default: { $ref: "../openapi.yaml#/components/responses/Problem" }
  /internal/v1/ingresses/{ingress_id}/services/events:
    get:
      operationId: getServiceEvents
      parameters:
        - $ref: "../openapi.yaml#/components/parameters/IngressID"
        - $ref: "../openapi.yaml#/components/parameters/IngressRunID"
        - $ref: "../openapi.yaml#/components/parameters/IngressLeaseRevision"
        - {
            name: after,
            in: query,
            required: true,
            schema: { type: integer, format: int64, minimum: 0 },
          }
      responses:
        "200":
          {
            description: Ordered private projections and tombstones,
            content:
              {
                application/json:
                  { schema: { $ref: "../openapi.yaml#/components/schemas/ServiceSnapshot" } },
              },
          }
        default: { $ref: "../openapi.yaml#/components/responses/Problem" }
