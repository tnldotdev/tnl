schemas:
  PrivateServiceID:
    type: string
    pattern: "^psvc_[A-Za-z0-9]{22}$"
  PrivateRunID:
    type: string
    pattern: "^psrun_[A-Za-z0-9]{22}$"
  PrivatePublisherConnectionClaim:
    type: object
    additionalProperties: false
    required:
      [
        private_service_id,
        private_run_id,
        run_number,
        connection_assignment_revision,
        relay_id,
        relay_run_id,
        relay_lease_revision,
        credential,
      ]
    properties:
      private_service_id: { $ref: "../openapi.yaml#/components/schemas/PrivateServiceID" }
      private_run_id: { $ref: "../openapi.yaml#/components/schemas/PrivateRunID" }
      run_number: { type: integer, format: int64, minimum: 1 }
      connection_assignment_revision: { type: integer, format: int64, minimum: 1 }
      relay_id: { $ref: "../openapi.yaml#/components/schemas/Identifier" }
      relay_run_id: { $ref: "../openapi.yaml#/components/schemas/Identifier" }
      relay_lease_revision: { type: integer, format: int64, minimum: 1 }
      credential: { type: string, minLength: 1, maxLength: 4096 }
  PrivatePublisherConnection:
    type: object
    additionalProperties: false
    required:
      [
        private_service_id,
        private_run_id,
        run_number,
        publisher_connection_id,
        connection_assignment_revision,
        relay_service_id,
      ]
    properties:
      private_service_id: { $ref: "../openapi.yaml#/components/schemas/PrivateServiceID" }
      private_run_id: { $ref: "../openapi.yaml#/components/schemas/PrivateRunID" }
      run_number: { type: integer, format: int64, minimum: 1 }
      publisher_connection_id: { $ref: "../openapi.yaml#/components/schemas/Identifier" }
      connection_assignment_revision: { type: integer, format: int64, minimum: 1 }
      relay_service_id: { $ref: "../openapi.yaml#/components/schemas/Identifier" }
  PrivatePublisherConnectionTransition:
    type: object
    additionalProperties: false
    required:
      [
        private_run_id,
        run_number,
        connection_assignment_revision,
        relay_id,
        relay_run_id,
        relay_lease_revision,
      ]
    properties:
      private_run_id: { $ref: "../openapi.yaml#/components/schemas/PrivateRunID" }
      run_number: { type: integer, format: int64, minimum: 1 }
      connection_assignment_revision: { type: integer, format: int64, minimum: 1 }
      relay_id: { $ref: "../openapi.yaml#/components/schemas/Identifier" }
      relay_run_id: { $ref: "../openapi.yaml#/components/schemas/Identifier" }
      relay_lease_revision: { type: integer, format: int64, minimum: 1 }
