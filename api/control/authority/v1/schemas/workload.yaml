schemas:
  WorkloadIdentityRequest:
    type: object
    additionalProperties: false
    required: [team_id, project_key, source_fingerprint, workload, assertion]
    properties:
      team_id: { type: string, maxLength: 128 }
      project_key: { type: string, maxLength: 128 }
      source_fingerprint: { type: string, pattern: "^[0-9a-f]{64}$" }
      workload: { type: string, maxLength: 32 }
      assertion: { type: string, minLength: 1, maxLength: 32768 }
  WorkloadIdentity:
    type: object
    additionalProperties: false
    required: [binding, services, assertion_expires_at]
    properties:
      binding: { type: string, pattern: "^[0-9a-f]{64}$" }
      services: { type: array, maxItems: 32, items: { type: string } }
      assertion_expires_at:
        {
          type: string,
          format: date-time,
          description: Expiry verified by authority for the exact supplied assertion.,
        }
  WorkloadAssertion:
    type: object
    additionalProperties: false
    required: [assertion, signature]
    properties:
      assertion: { type: string, minLength: 1, maxLength: 32768 }
      signature:
        type: string
        description: Unpadded base64url Ed25519 signature over SHA-256 of compact JSON ["tnl-workload-attach/v1", session_id, assertion_sha256_base64url].
  WorkloadExchange:
    type: object
    additionalProperties: false
    required:
      [team_id, project_key, source_fingerprint, workload, nonce, assertion, public_key, signature]
    properties:
      team_id:
        {
          type: string,
          maxLength: 128,
          description: Exact team ID or unique team-name selector. The response contains the canonical team ID.,
        }
      project_key: { type: string, maxLength: 128 }
      workload: { type: string, maxLength: 32 }
      source_fingerprint: { type: string, pattern: "^[0-9a-f]{64}$" }
      nonce: { type: string, pattern: "^[A-Za-z0-9_-]{16,128}$" }
      assertion: { type: string, minLength: 1, maxLength: 32768 }
      public_key: { type: string, description: Unpadded base64url Ed25519 public key }
      signature:
        { type: string, description: Unpadded base64url signature of the workload exchange digest }
      services:
        { type: array, minItems: 1, maxItems: 32, uniqueItems: true, items: { type: string } }
  WorkloadSession:
    # use the fields model so generated Go decoding still rejects unknown fields.
    x-go-type: WorkloadSessionFields
    allOf:
      - $ref: "../openapi.yaml#/components/schemas/WorkloadSessionFields"
      - oneOf:
          - required: [github]
            properties:
              provider:
                type: string
                enum: [github]
                x-enum-varnames: [WorkloadSessionGitHub]
          - not: { required: [github] }
            properties:
              provider:
                type: string
                enum: [vercel, fly, oidc]
                x-enum-varnames: [WorkloadSessionVercel, WorkloadSessionFly, WorkloadSessionOIDC]
  WorkloadSessionFields:
    type: object
    additionalProperties: false
    required:
      [
        id,
        credential,
        team_id,
        project_key,
        workload,
        provider,
        subject,
        lease_expires_at,
        expires_at,
        renew_after,
        service_ids,
        binding,
      ]
    properties:
      id: { type: string, pattern: "^wls_[A-Za-z0-9]{22}$" }
      credential: { type: string }
      team_id: { type: string }
      project_key: { type: string }
      workload: { type: string }
      provider: { $ref: "../../../public/v1/openapi.yaml#/components/schemas/WorkloadProvider" }
      subject: { $ref: "../../../public/v1/openapi.yaml#/components/schemas/VisitorSubject" }
      lease_expires_at: { type: string, format: date-time }
      expires_at: { type: string, format: date-time }
      renew_after: { type: string, format: date-time }
      service_ids: { type: array, maxItems: 32, items: { type: string } }
      binding: { type: string, pattern: "^[0-9a-f]{64}$" }
      github: { $ref: "../openapi.yaml#/components/schemas/WorkloadGitHubExecution" }
      assertion_expires_at:
        type: string
        format: date-time
        description: Verified expiry of the supplied assertion on exchange or attachment. Omitted on renewal; never extends the session window.
  WorkloadGitHubExecution:
    type: object
    description: Immutable GitHub execution metadata verified from the signed provider assertion. Present only for the github provider and unchanged during renewal.
    additionalProperties: false
    required: [repository_id, repository_owner_id, run_id, run_attempt, check_run_id]
    properties:
      repository_id: { type: string, pattern: "^[1-9][0-9]{0,19}$" }
      repository_owner_id: { type: string, pattern: "^[1-9][0-9]{0,19}$" }
      run_id: { type: string, pattern: "^[1-9][0-9]{0,19}$" }
      run_attempt: { type: string, pattern: "^[1-9][0-9]{0,19}$" }
      check_run_id: { type: string, pattern: "^[1-9][0-9]{0,19}$" }
