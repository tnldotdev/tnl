paths:
  /v1/service/identity-context:
    post:
      operationId: resolveServiceIdentity
      summary: Read current memberships for the signed-in website identity
      security:
        - webServiceAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/ServiceIdentity"
      responses:
        "200":
          description: Current identity and memberships, without session credentials
          content:
            application/json:
              schema:
                $ref: "../openapi.yaml#/components/schemas/IdentityContext"
        default:
          $ref: "../openapi.yaml#/components/responses/Problem"
  /v1/service/teams/{team_id}/services:
    parameters:
      - { $ref: "../openapi.yaml#/components/parameters/TeamID" }
      - { $ref: "../openapi.yaml#/components/parameters/ServiceActorToken" }
    get:
      operationId: listWebsiteServices
      security: [{ webServiceAuth: [] }]
      description: Current owner/admin inventory for this exact team, with current company source checks. Cursor is included in the signed request target.
      parameters:
        - { name: cursor, in: query, schema: { type: string } }
      responses:
        "200":
          description: Saved services, including service HTTP, with source context
          content:
            application/json:
              schema: { $ref: "../../../public/v1/openapi.yaml#/components/schemas/ServicePage" }
        default: { $ref: "../openapi.yaml#/components/responses/Problem" }
  /v1/service/services/{service_id}:
    parameters:
      - { $ref: "../openapi.yaml#/components/parameters/ServiceID" }
      - { $ref: "../openapi.yaml#/components/parameters/ServiceActorToken" }
    get:
      operationId: getWebsiteService
      security: [{ webServiceAuth: [] }]
      responses:
        "200":
          description: Exact currently manageable saved service
          content:
            application/json:
              schema: { $ref: "../../../public/v1/openapi.yaml#/components/schemas/Service" }
        default: { $ref: "../openapi.yaml#/components/responses/Problem" }
  /v1/service/services/{service_id}/grants:
    parameters:
      - { $ref: "../openapi.yaml#/components/parameters/ServiceID" }
      - { $ref: "../openapi.yaml#/components/parameters/ServiceActorToken" }
    get:
      operationId: listWebsiteServiceGrants
      description: Up to 100 records ordered by ID, including expired and revoked history. Follow next_cursor until absent. Each page requires a fresh assertion bound to the exact query and current manager/source authorization. Inventory is not proof of visitor access.
      security: [{ webServiceAuth: [] }]
      parameters:
        - name: cursor
          in: query
          schema: { $ref: "../../../public/v1/openapi.yaml#/components/schemas/ServiceGrantID" }
      responses:
        "200":
          description: Exact service grants, including expired and revoked records
          content:
            application/json:
              schema:
                { $ref: "../../../public/v1/openapi.yaml#/components/schemas/ServiceGrantPage" }
        default: { $ref: "../openapi.yaml#/components/responses/Problem" }
  /v1/service/services/{service_id}/grants/{grant_id}:
    parameters:
      - { $ref: "../openapi.yaml#/components/parameters/ServiceID" }
      - { $ref: "../openapi.yaml#/components/parameters/ServiceActorToken" }
      - {
          name: grant_id,
          in: path,
          required: true,
          schema: { $ref: "../../../public/v1/openapi.yaml#/components/schemas/ServiceGrantID" },
        }
    delete:
      operationId: revokeWebsiteServiceGrant
      security: [{ webServiceAuth: [] }]
      responses:
        "204": { description: Exact grant revoked }
        default: { $ref: "../openapi.yaml#/components/responses/Problem" }
  /v1/service/services/{service_id}/invitations:
    parameters:
      - { $ref: "../openapi.yaml#/components/parameters/ServiceID" }
      - { $ref: "../openapi.yaml#/components/parameters/ServiceActorToken" }
    get:
      operationId: listWebsiteServiceInvitations
      description: Up to 100 records ordered by ID, including accepted, expired and revoked history, without secrets. Follow next_cursor until absent. Each page requires a fresh assertion bound to the exact query and current manager/source authorization.
      security: [{ webServiceAuth: [] }]
      parameters:
        - name: cursor
          in: query
          schema:
            { $ref: "../../../public/v1/openapi.yaml#/components/schemas/ServiceInvitationID" }
      responses:
        "200":
          description: Exact service invitations without secrets
          content:
            application/json:
              schema:
                {
                  $ref: "../../../public/v1/openapi.yaml#/components/schemas/ServiceInvitationPage",
                }
        default: { $ref: "../openapi.yaml#/components/responses/Problem" }
    post:
      operationId: inviteWebsiteServiceVisitor
      description: Keep the same key and exact request when retrying with a fresh signed assertion. Current manager and company source checks run again. An exact retry returns HTTP 200 with the original ID and current state but no secret. If delivery was lost, explicitly revoke that ID and create with a new key and deadline. A changed service, email or deadline with the same actor/key returns conflict. No secret is retained for recovery.
      security: [{ webServiceAuth: [] }]
      parameters: [{ $ref: "../openapi.yaml#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              {
                $ref: "../../../public/v1/openapi.yaml#/components/schemas/CreateServiceInvitationRequest",
              }
      responses:
        "200":
          description: Existing invitation without its secret; explicitly revoke and reissue if delivery was lost
          content:
            application/json:
              schema:
                { $ref: "../../../public/v1/openapi.yaml#/components/schemas/ServiceInvitation" }
        "201":
          description: Exact service invitation; secret returned only at creation
          content:
            application/json:
              schema:
                { $ref: "../../../public/v1/openapi.yaml#/components/schemas/ServiceInvitation" }
        default: { $ref: "../openapi.yaml#/components/responses/Problem" }
  /v1/service/services/{service_id}/invitations/{invitation_id}:
    parameters:
      - { $ref: "../openapi.yaml#/components/parameters/ServiceID" }
      - { $ref: "../openapi.yaml#/components/parameters/ServiceActorToken" }
      - {
          name: invitation_id,
          in: path,
          required: true,
          schema:
            { $ref: "../../../public/v1/openapi.yaml#/components/schemas/ServiceInvitationID" },
        }
    delete:
      operationId: revokeWebsiteServiceInvitation
      security: [{ webServiceAuth: [] }]
      responses:
        "204": { description: Exact invitation and its accepted grant revoked }
        default: { $ref: "../openapi.yaml#/components/responses/Problem" }
  /v1/service/service-invitations/preview:
    post:
      operationId: previewWebsiteServiceInvitation
      security: [{ webServiceAuth: [] }]
      parameters: [{ $ref: "../openapi.yaml#/components/parameters/ServiceActorToken" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "../openapi.yaml#/components/schemas/ServiceInvitationCredential" }
      responses:
        "200":
          description: Bounded exact service and deadline for the matching verified recipient; does not accept
          content:
            application/json:
              schema: { $ref: "../openapi.yaml#/components/schemas/ServiceInvitationPreview" }
        default: { $ref: "../openapi.yaml#/components/responses/Problem" }
  /v1/service/service-invitations/accept:
    post:
      operationId: acceptWebsiteServiceInvitation
      security: [{ webServiceAuth: [] }]
      parameters: [{ $ref: "../openapi.yaml#/components/parameters/ServiceActorToken" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "../openapi.yaml#/components/schemas/ServiceInvitationCredential" }
      responses:
        "200":
          description: Existing exact-service identity grant, retaining the invitation deadline
          content:
            application/json:
              schema: { $ref: "../../../public/v1/openapi.yaml#/components/schemas/ServiceGrant" }
        default: { $ref: "../openapi.yaml#/components/responses/Problem" }
  /v1/service/services/{service_id}/http-grants:
    parameters:
      - { $ref: "../openapi.yaml#/components/parameters/ServiceID" }
      - { $ref: "../openapi.yaml#/components/parameters/ServiceActorToken" }
    get:
      operationId: listWebsiteServiceHTTPGrants
      security: [{ webServiceAuth: [] }]
      responses:
        "200":
          description: Secretless credential summaries for this exact service
          content:
            application/json:
              schema:
                type: array
                items:
                  {
                    $ref: "../../../public/v1/openapi.yaml#/components/schemas/ServiceHTTPGrantSummary",
                  }
        default: { $ref: "../openapi.yaml#/components/responses/Problem" }
    post:
      operationId: createWebsiteServiceVisitorCredential
      security: [{ webServiceAuth: [] }]
      description: Requires current management and visit access. Company-session-bound credential issuance still requires a control session; this bridge never creates a session or relaxes credential rechecks.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              {
                $ref: "../../../public/v1/openapi.yaml#/components/schemas/CreateVisitorCredentialRequest",
              }
      responses:
        "201":
          description: Exact managed subject and one-time secret
          content:
            application/json:
              schema:
                { $ref: "../../../public/v1/openapi.yaml#/components/schemas/VisitorCredential" }
        default: { $ref: "../openapi.yaml#/components/responses/Problem" }
  /v1/service/services/{service_id}/http-grants/{grant_id}:
    parameters:
      - { $ref: "../openapi.yaml#/components/parameters/ServiceID" }
      - { $ref: "../openapi.yaml#/components/parameters/ServiceActorToken" }
      - { name: grant_id, in: path, required: true, schema: { type: string } }
    delete:
      operationId: revokeWebsiteServiceHTTPGrant
      security: [{ webServiceAuth: [] }]
      responses:
        "204": { description: Exact service HTTP credential revoked }
        default: { $ref: "../openapi.yaml#/components/responses/Problem" }
