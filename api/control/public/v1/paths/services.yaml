paths:
  /v1/projects/{project_key}/private-services/{service}:
    get:
      operationId: getProjectPrivateService
      security: [{ bearerAuth: [] }]
      description: Resolve an applied service by its exact Git source and configuration key using current visitor access. Does not return targets or require project-manager permission.
      parameters:
        - { name: project_key, in: path, required: true, schema: { type: string } }
        - {
            name: service,
            in: path,
            required: true,
            schema: { $ref: "../openapi.yaml#/components/schemas/PrivateServiceName" },
          }
        - {
            name: team_id,
            in: query,
            required: true,
            schema: { $ref: "../openapi.yaml#/components/schemas/TeamID" },
          }
        - {
            name: source_fingerprint,
            in: query,
            required: true,
            schema: { type: string, pattern: "^[0-9a-f]{64}$" },
          }
      responses:
        "200":
          description: Exact saved service from the applied configuration, including offline services
          content:
            application/json:
              schema: { $ref: "../openapi.yaml#/components/schemas/PrivateService" }
        default: { $ref: "../openapi.yaml#/components/responses/Problem" }
  /v1/private-services:
    get:
      operationId: listPrivateServices
      description: Team-owned saved services; never return target addresses or stream keys.
      security: [{ bearerAuth: [] }]
      parameters:
        [
          { $ref: "../openapi.yaml#/components/parameters/TeamIDQuery" },
          { $ref: "../openapi.yaml#/components/parameters/PrivateServiceCursor" },
        ]
      responses:
        "200":
          {
            description: Team inventory,
            content:
              {
                application/json:
                  { schema: { $ref: "../openapi.yaml#/components/schemas/PrivateServicePage" } },
              },
          }
        default: { $ref: "../openapi.yaml#/components/responses/Problem" }
    post:
      operationId: createPrivateService
      description: Create a team-scoped saved name. No DNS record, public URL, certificate or dedicated visitor port is allocated.
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "../openapi.yaml#/components/parameters/IdempotencyKey" }]
      requestBody:
        {
          required: true,
          content:
            {
              application/json:
                {
                  schema:
                    { $ref: "../openapi.yaml#/components/schemas/CreatePrivateServiceRequest" },
                },
            },
        }
      responses:
        "201":
          {
            description: Saved private service,
            content:
              {
                application/json:
                  { schema: { $ref: "../openapi.yaml#/components/schemas/PrivateService" } },
              },
          }
        default: { $ref: "../openapi.yaml#/components/responses/Problem" }
  /v1/private-services/{private_service_id}:
    put:
      operationId: configurePrivateService
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "../openapi.yaml#/components/parameters/PrivateServiceID" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "../openapi.yaml#/components/schemas/PrivateServiceMetadata" }
      responses:
        "200":
          description: Approved protocol, publisher pool and immutable TLS trust snapshot
          content:
            application/json:
              schema: { $ref: "../openapi.yaml#/components/schemas/PrivateService" }
        default: { $ref: "../openapi.yaml#/components/responses/Problem" }
    get:
      operationId: getPrivateService
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "../openapi.yaml#/components/parameters/PrivateServiceID" }]
      responses:
        "200":
          {
            description: Saved service for an authorized team administrator,
            content:
              {
                application/json:
                  { schema: { $ref: "../openapi.yaml#/components/schemas/PrivateService" } },
              },
          }
        default: { $ref: "../openapi.yaml#/components/responses/Problem" }
    delete:
      operationId: deletePrivateService
      description: Revoke access and close any run before tombstoning its ID-keyed ingress projection.
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "../openapi.yaml#/components/parameters/PrivateServiceID" }]
      responses:
        "204": { description: Service deleted }
        default: { $ref: "../openapi.yaml#/components/responses/Problem" }
  /v1/private-services/{private_service_id}/grants:
    get:
      operationId: listPrivateServiceGrants
      description: Current managers may read up to 100 records ordered by ID, including expired and revoked history. Follow next_cursor until absent; inventory is not proof of current visitor access.
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: "../openapi.yaml#/components/parameters/PrivateServiceID" }
        - name: cursor
          in: query
          schema: { $ref: "../openapi.yaml#/components/schemas/PrivateServiceGrantID" }
      responses:
        "200":
          {
            description: Exact service grants,
            content:
              {
                application/json:
                  {
                    schema: { $ref: "../openapi.yaml#/components/schemas/PrivateServiceGrantPage" },
                  },
              },
          }
        default: { $ref: "../openapi.yaml#/components/responses/Problem" }
    post:
      operationId: createPrivateServiceGrant
      security: [{ bearerAuth: [] }]
      parameters:
        [
          { $ref: "../openapi.yaml#/components/parameters/PrivateServiceID" },
          { $ref: "../openapi.yaml#/components/parameters/IdempotencyKey" },
        ]
      requestBody:
        {
          required: true,
          content:
            {
              application/json:
                {
                  schema:
                    {
                      $ref: "../openapi.yaml#/components/schemas/CreatePrivateServiceGrantRequest",
                    },
                },
            },
        }
      responses:
        "201":
          {
            description: Revocable team or identity grant,
            content:
              {
                application/json:
                  { schema: { $ref: "../openapi.yaml#/components/schemas/PrivateServiceGrant" } },
              },
          }
        default: { $ref: "../openapi.yaml#/components/responses/Problem" }
  /v1/private-services/{private_service_id}/grants/{grant_id}:
    delete:
      operationId: revokePrivateServiceGrant
      security: [{ bearerAuth: [] }]
      parameters:
        [
          { $ref: "../openapi.yaml#/components/parameters/PrivateServiceID" },
          {
            name: grant_id,
            in: path,
            required: true,
            schema: { $ref: "../openapi.yaml#/components/schemas/PrivateServiceGrantID" },
          },
        ]
      responses:
        "204": { description: Grant revoked }
        default: { $ref: "../openapi.yaml#/components/responses/Problem" }
  /v1/private-services/{private_service_id}/invitations:
    get:
      operationId: listPrivateServiceInvitations
      description: Current managers may read up to 100 records ordered by ID, including accepted, expired and revoked history. Follow next_cursor until absent. Never returns secrets.
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: "../openapi.yaml#/components/parameters/PrivateServiceID" }
        - name: cursor
          in: query
          schema: { $ref: "../openapi.yaml#/components/schemas/PrivateServiceInvitationID" }
      responses:
        "200":
          description: Invitations for service administrators
          content:
            application/json:
              schema: { $ref: "../openapi.yaml#/components/schemas/PrivateServiceInvitationPage" }
        default: { $ref: "../openapi.yaml#/components/responses/Problem" }
    post:
      operationId: invitePrivateServiceVisitor
      description: A new key creates one exact-service invitation. An exact retry by the same actor returns HTTP 200 with the original ID and current state, without a secret, after current management checks. If delivery was lost, revoke that ID and create with a new key and explicit deadline. Changed service, email or deadline with a used key returns conflict. No secret is retained for recovery.
      security: [{ bearerAuth: [] }]
      parameters:
        [
          { $ref: "../openapi.yaml#/components/parameters/PrivateServiceID" },
          { $ref: "../openapi.yaml#/components/parameters/IdempotencyKey" },
        ]
      requestBody:
        {
          required: true,
          content:
            {
              application/json:
                {
                  schema:
                    {
                      $ref: "../openapi.yaml#/components/schemas/CreatePrivateServiceInvitationRequest",
                    },
                },
            },
        }
      responses:
        "200":
          description: Existing invitation without its secret; explicitly revoke and reissue if delivery was lost
          content:
            application/json:
              schema: { $ref: "../openapi.yaml#/components/schemas/PrivateServiceInvitation" }
        "201":
          {
            description: One-use verified-email invitation,
            content:
              {
                application/json:
                  {
                    schema:
                      { $ref: "../openapi.yaml#/components/schemas/PrivateServiceInvitation" },
                  },
              },
          }
        default: { $ref: "../openapi.yaml#/components/responses/Problem" }
  /v1/private-services/{private_service_id}/invitations/{invitation_id}:
    delete:
      operationId: revokePrivateServiceInvitation
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: "../openapi.yaml#/components/parameters/PrivateServiceID" }
        - name: invitation_id
          in: path
          required: true
          schema: { $ref: "../openapi.yaml#/components/schemas/PrivateServiceInvitationID" }
      responses:
        "204": { description: Invitation and accepted identity grant revoked }
        default: { $ref: "../openapi.yaml#/components/responses/Problem" }
  /v1/private-service-invitations/accept:
    post:
      operationId: acceptPrivateServiceInvitation
      security: [{ bearerAuth: [] }]
      requestBody:
        {
          required: true,
          content:
            {
              application/json:
                {
                  schema:
                    {
                      $ref: "../openapi.yaml#/components/schemas/PrivateServiceInvitationCredential",
                    },
                },
            },
        }
      responses:
        "200":
          {
            description: Exact identity grant,
            content:
              {
                application/json:
                  { schema: { $ref: "../openapi.yaml#/components/schemas/PrivateServiceGrant" } },
              },
          }
        default: { $ref: "../openapi.yaml#/components/responses/Problem" }
