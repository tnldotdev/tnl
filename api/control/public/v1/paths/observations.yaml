paths:
  /v1/publish-runs/{run_id}/service-observations:
    post:
      operationId: reportPublishRunServiceObservations
      security: [{ publishRunAuth: [] }]
      parameters:
        - { name: run_id, in: path, required: true, schema: { type: string } }
      requestBody:
        {
          required: true,
          content:
            {
              application/json:
                {
                  schema:
                    { $ref: "../openapi.yaml#/components/schemas/PublishRunServiceObservations" },
                },
            },
        }
      responses:
        "200":
          {
            description: Accepted and duplicate observation counters,
            content:
              {
                application/json:
                  {
                    schema:
                      { $ref: "../openapi.yaml#/components/schemas/ServiceObservationResult" },
                  },
              },
          }
        default: { $ref: "../openapi.yaml#/components/responses/Problem" }
