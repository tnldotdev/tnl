paths:
  /v1/private-services/{private_service_id}/runs/{private_run_id}/http-authorize:
    post:
      operationId: authorizeManagedHTTPVisitor
      security: [{ bearerAuth: [] }]
      description: Check the selected HTTP credential and exact trusted ingress admission. An allowed decision cannot forward target bytes until admitted is true. Certificate authentication is optional and never grants feedback or management.
      parameters:
        - { $ref: "../openapi.yaml#/components/parameters/PrivateServiceID" }
        - {
            name: private_run_id,
            in: path,
            required: true,
            schema: { $ref: "../openapi.yaml#/components/schemas/PrivateRunID" },
          }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "../openapi.yaml#/components/schemas/ManagedHTTPVisitorRequest" }
      responses:
        "200":
          description: Current request and ingress promotion decision
          content:
            application/json:
              schema:
                { $ref: "../openapi.yaml#/components/schemas/ServiceClientCertificateDecision" }
        default: { $ref: "../openapi.yaml#/components/responses/Problem" }
  /v1/private-services/{private_service_id}/runs/{private_run_id}/start:
    post:
      operationId: startManagedServiceRun
      security: [{ bearerAuth: [] }]
      description: Start one exact prepared run using its authenticated publisher identity. Visitor TLS uses the approved service certificate, without an ephemeral stream key or custom TLS proof.
      parameters:
        - { $ref: "../openapi.yaml#/components/parameters/PrivateServiceID" }
        - {
            name: private_run_id,
            in: path,
            required: true,
            schema: { $ref: "../openapi.yaml#/components/schemas/PrivateRunID" },
          }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [run_number]
              properties:
                run_number: { type: integer, format: int64, minimum: 1 }
      responses:
        "200":
          description: Run token and two independent relay assignments
          content:
            application/json:
              schema: { $ref: "../openapi.yaml#/components/schemas/PrivateServiceRunSetup" }
        default: { $ref: "../openapi.yaml#/components/responses/Problem" }
  /v1/private-services/{private_service_id}/runs/{private_run_id}/authorize-connector:
    post:
      operationId: authorizeServiceConnector
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: "../openapi.yaml#/components/parameters/PrivateServiceID" }
        - {
            name: private_run_id,
            in: path,
            required: true,
            schema: { $ref: "../openapi.yaml#/components/schemas/PrivateRunID" },
          }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "../openapi.yaml#/components/schemas/AuthorizeServiceConnectorRequest" }
      responses:
        "200":
          description: Live permission for the exact authenticated connector admission
          content:
            application/json:
              schema:
                { $ref: "../openapi.yaml#/components/schemas/ServiceClientCertificateDecision" }
        default: { $ref: "../openapi.yaml#/components/responses/Problem" }
  /v1/private-services/{private_service_id}/runs/{private_run_id}/authorize-client-certificate:
    post:
      operationId: authorizeServiceClientCertificate
      description: Authenticate a direct ingress visitor after TLS key possession. Connector admissions use their authenticated session instead. Permission alone does not authorize target bytes until ingress acknowledges ordinary capacity.
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: "../openapi.yaml#/components/parameters/PrivateServiceID" }
        - {
            name: private_run_id,
            in: path,
            required: true,
            schema: { $ref: "../openapi.yaml#/components/schemas/PrivateRunID" },
          }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              {
                $ref: "../openapi.yaml#/components/schemas/AuthorizeServiceClientCertificateRequest",
              }
      responses:
        "200":
          description: Live permission for an exact admitted connection after TLS proved client key possession
          content:
            application/json:
              schema:
                { $ref: "../openapi.yaml#/components/schemas/ServiceClientCertificateDecision" }
        default: { $ref: "../openapi.yaml#/components/responses/Problem" }
  /v1/private-services/{private_service_id}/runs/{private_run_id}/certificate-issuances:
    parameters:
      - { $ref: "../openapi.yaml#/components/parameters/PrivateServiceID" }
      - {
          name: private_run_id,
          in: path,
          required: true,
          schema: { $ref: "../openapi.yaml#/components/schemas/PrivateRunID" },
        }
    post:
      operationId: createPrivateCertificateIssuance
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "../openapi.yaml#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              {
                $ref: "../openapi.yaml#/components/schemas/CreatePrivateCertificateIssuanceRequest",
              }
      responses:
        "201":
          description: DNS-01 issuance authorized for the exact private run and approved scope
          content:
            application/json:
              schema: { $ref: "../openapi.yaml#/components/schemas/PrivateCertificateIssuance" }
        default: { $ref: "../openapi.yaml#/components/responses/Problem" }
  /v1/private-services/{private_service_id}/runs/{private_run_id}/certificate-issuances/{issuance_id}:
    get:
      operationId: getPrivateCertificateIssuance
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: "../openapi.yaml#/components/parameters/PrivateServiceID" }
        - {
            name: private_run_id,
            in: path,
            required: true,
            schema: { $ref: "../openapi.yaml#/components/schemas/PrivateRunID" },
          }
        - {
            name: issuance_id,
            in: path,
            required: true,
            schema: { $ref: "../openapi.yaml#/components/schemas/IssuanceID" },
          }
      responses:
        "200":
          description: Current private-run certificate issuance
          content:
            application/json:
              schema: { $ref: "../openapi.yaml#/components/schemas/PrivateCertificateIssuance" }
        default: { $ref: "../openapi.yaml#/components/responses/Problem" }
  /v1/private-services/{private_service_id}/runs/{private_run_id}/certificate-installed:
    post:
      operationId: markPrivateCertificateInstalled
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: "../openapi.yaml#/components/parameters/PrivateServiceID" }
        - {
            name: private_run_id,
            in: path,
            required: true,
            schema: { $ref: "../openapi.yaml#/components/schemas/PrivateRunID" },
          }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              { $ref: "../openapi.yaml#/components/schemas/PrivateCertificateInstalledRequest" }
      responses:
        "204": { description: Current run acknowledged the exact publisher-owned certificate }
        default: { $ref: "../openapi.yaml#/components/responses/Problem" }
  /v1/private-services/{private_service_id}/runs:
    post:
      operationId: preparePrivateServiceRun
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "../openapi.yaml#/components/schemas/PrivateServiceRunDeclaration" }
      description: Reserve a new run ID and number and capture its exact managed hostname, port, domain and certificate plan under the authenticated publisher grant. Retrying the same idempotency key returns the same preparation.
      security: [{ publisherAuth: [] }]
      parameters:
        [
          { $ref: "../openapi.yaml#/components/parameters/PrivateServiceID" },
          { $ref: "../openapi.yaml#/components/parameters/IdempotencyKey" },
        ]
      responses:
        "201":
          {
            description: Prepared run for the publisher to sign,
            content:
              {
                application/json:
                  {
                    schema:
                      { $ref: "../openapi.yaml#/components/schemas/PrivateServiceRunPreparation" },
                  },
              },
          }
        default: { $ref: "../openapi.yaml#/components/responses/Problem" }
  /v1/private-services/{private_service_id}/runs/{private_run_id}:
    post:
      operationId: heartbeatPrivateServiceRun
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "../openapi.yaml#/components/schemas/PrivateServiceRunHeartbeat" }
      description: Renew only the current run under its exact publisher grant. First readiness requires two live relay services; one surviving ready connection can continue serving while the other is replaced.
      security: [{ privateRunAuth: [] }]
      parameters:
        - { $ref: "../openapi.yaml#/components/parameters/PrivateServiceID" }
        - name: private_run_id
          in: path
          required: true
          schema: { $ref: "../openapi.yaml#/components/schemas/PrivateRunID" }
      responses:
        "200":
          description: Current run and assignments
          content:
            application/json:
              schema: { $ref: "../openapi.yaml#/components/schemas/PrivateServiceRunState" }
        default: { $ref: "../openapi.yaml#/components/responses/Problem" }
    delete:
      operationId: closePrivateServiceRun
      description: Close the exact run, reject stale admissions and publish a private-service tombstone. Managed certificates remain in the publisher's shared cache.
      security: [{ privateRunAuth: [] }]
      parameters:
        - { $ref: "../openapi.yaml#/components/parameters/PrivateServiceID" }
        - name: private_run_id
          in: path
          required: true
          schema: { $ref: "../openapi.yaml#/components/schemas/PrivateRunID" }
      responses:
        "204": { description: Run closed }
        default: { $ref: "../openapi.yaml#/components/responses/Problem" }
