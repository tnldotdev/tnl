paths:
  /v1/workload/services/{service_id}/run:
    parameters:
      - {
          name: service_id,
          in: path,
          required: true,
          schema: { $ref: "../openapi.yaml#/components/schemas/ServiceID" },
        }
    post:
      operationId: selectWorkloadServiceRun
      security: [{ workloadAuth: [] }]
      responses:
        "200":
          description: Current publisher selection for the workload subject
          content:
            application/json:
              schema: { $ref: "../openapi.yaml#/components/schemas/ServiceSelection" }
        default: { $ref: "../openapi.yaml#/components/responses/Problem" }
  /v1/workload/ingress-assignments/{session_id}:
    parameters:
      - {
          name: session_id,
          in: path,
          required: true,
          schema: { $ref: "../openapi.yaml#/components/schemas/ConnectorSessionID" },
        }
    delete:
      operationId: releaseWorkloadIngressAssignment
      security: [{ workloadAuth: [] }]
      responses:
        "204": { description: This workload's exact assignment is released }
        default: { $ref: "../openapi.yaml#/components/responses/Problem" }
  /v1/workload/ingress-assignments/{session_id}/transport-trust:
    parameters:
      - {
          name: session_id,
          in: path,
          required: true,
          schema: { $ref: "../openapi.yaml#/components/schemas/ConnectorSessionID" },
        }
    get:
      operationId: getWorkloadIngressTransportTrust
      security: [{ workloadAuth: [] }]
      responses:
        "200":
          description: Current trust for the workload-owned assigned ingress process
          content:
            application/json:
              schema: { $ref: "../openapi.yaml#/components/schemas/IngressTransportTrust" }
        default: { $ref: "../openapi.yaml#/components/responses/Problem" }
  /v1/workload/services:
    get:
      operationId: listWorkloadServices
      summary: List only the workload session's currently authorized saved services
      security: [{ workloadAuth: [] }]
      responses:
        "200":
          description: Current visitor inventory without targets or application credentials
          content:
            application/json:
              schema: { $ref: "../openapi.yaml#/components/schemas/WorkloadServices" }
        default: { $ref: "../openapi.yaml#/components/responses/Problem" }
  /v1/workload/services/{service_id}/authorization:
    parameters:
      - { name: service_id, in: path, required: true, schema: { type: string } }
    post:
      operationId: checkWorkloadService
      security: [{ workloadAuth: [] }]
      responses:
        "200":
          description: Current permission bounded by lease and absolute deadline
          content:
            application/json:
              schema: { $ref: "../openapi.yaml#/components/schemas/WorkloadServiceAuthorization" }
        default: { $ref: "../openapi.yaml#/components/responses/Problem" }
  /v1/workload/services/{service_id}/ingress-assignments:
    parameters:
      - { name: service_id, in: path, required: true, schema: { type: string } }
    post:
      operationId: createWorkloadIngressAssignments
      security: [{ workloadAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [idempotency_key]
              properties:
                idempotency_key: { type: string, minLength: 1, maxLength: 128 }
                count: { type: integer, minimum: 1, maximum: 2, default: 2 }
                exclude_ingress_id: { type: string, minLength: 1, maxLength: 256 }
                preferred_regions:
                  { $ref: "../openapi.yaml#/components/schemas/LocationPreferences" }
      responses:
        "200":
          description: Independently claimable workload-owned assignments; a replacement reserves only its failed slot
          content:
            application/json:
              schema: { $ref: "../openapi.yaml#/components/schemas/WorkloadIngressAssignments" }
        default: { $ref: "../openapi.yaml#/components/responses/Problem" }
