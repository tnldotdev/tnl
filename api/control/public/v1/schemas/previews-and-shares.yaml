schemas:
  PreviewID:
    $ref: "../openapi.yaml#/components/schemas/ResourceID"
  ShareID:
    $ref: "../openapi.yaml#/components/schemas/ResourceID"
  CreatePreviewRequest:
    type: object
    additionalProperties: false
    required: [team_id]
    properties:
      team_id:
        $ref: "../openapi.yaml#/components/schemas/TeamID"
  AddPreviewPublicURLRequest:
    type: object
    additionalProperties: false
    required: [public_url_id]
    properties:
      public_url_id:
        $ref: "../openapi.yaml#/components/schemas/PublicURLID"
  SetPreviewTeamAccessRequest:
    type: object
    additionalProperties: false
    required: [enabled]
    properties:
      enabled:
        type: boolean
  Preview:
    type: object
    additionalProperties: false
    required: [schema_version, id, team_id, public_url_ids, created_at]
    properties:
      schema_version:
        $ref: "../openapi.yaml#/components/schemas/ReviewSchemaVersion"
      id:
        $ref: "../openapi.yaml#/components/schemas/PreviewID"
      team_id:
        $ref: "../openapi.yaml#/components/schemas/TeamID"
      public_url_ids:
        type: array
        uniqueItems: true
        items:
          $ref: "../openapi.yaml#/components/schemas/PublicURLID"
      team_access_enabled:
        type: boolean
      created_at:
        type: string
        format: date-time
  CreateShareRequest:
    type: object
    additionalProperties: false
    required: [public_url_ids, expires_at, secret_fingerprint]
    properties:
      public_url_ids:
        type: array
        minItems: 1
        maxItems: 32
        uniqueItems: true
        items:
          $ref: "../openapi.yaml#/components/schemas/PublicURLID"
      expires_at:
        type: string
        format: date-time
      secret_fingerprint:
        type: string
        pattern: "^[0-9a-f]{64}$"
      label:
        type: string
        maxLength: 128
  Share:
    type: object
    additionalProperties: false
    required:
      [
        schema_version,
        id,
        scope,
        label,
        team_id,
        public_url_ids,
        created_by_identity_id,
        created_at,
        expires_at,
      ]
    properties:
      schema_version:
        $ref: "../openapi.yaml#/components/schemas/ReviewSchemaVersion"
      id:
        $ref: "../openapi.yaml#/components/schemas/ShareID"
      preview_id:
        $ref: "../openapi.yaml#/components/schemas/PreviewID"
      scope:
        type: string
        enum: [url, preview, guest]
      label:
        type: string
      team_id:
        $ref: "../openapi.yaml#/components/schemas/TeamID"
      public_url_ids:
        type: array
        minItems: 1
        maxItems: 32
        uniqueItems: true
        items:
          $ref: "../openapi.yaml#/components/schemas/PublicURLID"
      created_by_identity_id:
        $ref: "../openapi.yaml#/components/schemas/IdentityID"
      created_at:
        type: string
        format: date-time
      expires_at:
        type: string
        format: date-time
      revoked_at:
        type: string
        format: date-time
  SharePage:
    type: object
    additionalProperties: false
    required: [schema_version, shares]
    properties:
      schema_version:
        $ref: "../openapi.yaml#/components/schemas/ReviewSchemaVersion"
      shares:
        type: array
        maxItems: 100
        items:
          $ref: "../openapi.yaml#/components/schemas/Share"
      next_cursor:
        $ref: "../openapi.yaml#/components/schemas/ShareID"
  PreviewPageFeedbackRequest:
    type: object
    additionalProperties: false
    required: [preview_id, publish_run_number, access]
    properties:
      state:
        $ref: "../openapi.yaml#/components/schemas/FeedbackThreadState"
      preview_id:
        $ref: "../openapi.yaml#/components/schemas/PreviewID"
      publish_run_number:
        type: integer
        format: int64
        minimum: 1
      page_path:
        type: string
      cursor:
        $ref: "../openapi.yaml#/components/schemas/FeedbackID"
      access:
        $ref: "../openapi.yaml#/components/schemas/FeedbackReviewerAccess"
  ShareRedemption:
    type: object
    additionalProperties: false
    required: [schema_version, share_id, cookie_secret, expires_at, next_url, bridge]
    properties:
      schema_version:
        $ref: "../openapi.yaml#/components/schemas/ReviewSchemaVersion"
      share_id:
        $ref: "../openapi.yaml#/components/schemas/ShareID"
      cookie_secret:
        type: string
        minLength: 43
        maxLength: 43
      expires_at:
        type: string
        format: date-time
      next_url:
        type: string
        format: uri
        pattern: "^https://"
      bridge:
        type: boolean
