schemas:
  WorkloadServiceAuthorization:
    type: object
    additionalProperties: false
    required: [subject, service_id, valid_until, policy_revision]
    properties:
      subject: { $ref: "../openapi.yaml#/components/schemas/VisitorSubject" }
      service_id: { type: string }
      valid_until: { type: string, format: date-time }
      policy_revision: { type: integer, format: int64 }
  WorkloadServices:
    type: object
    additionalProperties: false
    required: [services]
    properties:
      services:
        type: array
        maxItems: 32
        items:
          type: object
          additionalProperties: false
          required: [id, service, protocol, endpoint]
          properties:
            id: { type: string }
            service: { type: string }
            protocol: { $ref: "../openapi.yaml#/components/schemas/ServiceProtocol" }
            endpoint: { $ref: "../openapi.yaml#/components/schemas/ServiceEndpoint" }
            kubernetes_auth: { $ref: "../openapi.yaml#/components/schemas/KubernetesAuth" }
  WorkloadIngressAssignments:
    type: object
    additionalProperties: false
    required: [subject, assignments]
    properties:
      subject: { $ref: "../openapi.yaml#/components/schemas/VisitorSubject" }
      assignments:
        type: array
        minItems: 1
        maxItems: 2
        items:
          type: object
          additionalProperties: false
          required:
            [id, service_id, credential, expires_at, ingress_id, ingress_address, tls_server_name]
          properties:
            id: { type: string }
            service_id: { type: string }
            credential: { type: string }
            expires_at: { type: string, format: date-time }
            ingress_id: { type: string }
            ingress_address: { type: string }
            tls_server_name: { type: string }
  WorkloadProvider:
    type: string
    enum: [github, vercel, fly, oidc]
    x-enum-varnames: [WorkloadGitHub, WorkloadVercel, WorkloadFly, WorkloadOIDC]
  WorkloadTrust:
    type: object
    additionalProperties: false
    required: [provider, issuer, jwks_url, audience, claims]
    properties:
      provider: { $ref: "../openapi.yaml#/components/schemas/WorkloadProvider" }
      issuer: { type: string, maxLength: 1024 }
      jwks_url: { type: string, maxLength: 1024 }
      audience: { type: string, maxLength: 1024 }
      claims:
        type: object
        maxProperties: 32
        additionalProperties: { type: string, maxLength: 1024 }
