schemas:
  HTTPAuthorizationSubject:
    type: object
    additionalProperties: false
    required: [kind, id]
    properties:
      kind: { type: string, enum: [public_url, service] }
      id: { type: string }
    description: An explicit authorization scope. A public URL grant never applies to a service, even when they have related names or owners.
  CreateServiceHTTPGrantRequest:
    type: object
    additionalProperties: false
    required: [kind, expires_at]
    properties:
      kind: { type: string, enum: [token, share] }
      expires_at: { type: string, format: date-time }
  ServiceHTTPGrant:
    type: object
    additionalProperties: false
    required: [subject, id, kind, secret, expires_at]
    properties:
      subject: { $ref: "../openapi.yaml#/components/schemas/HTTPAuthorizationSubject" }
      id: { type: string }
      kind: { type: string, enum: [token, share] }
      secret: { type: string }
      share_url: { type: string, format: uri }
      expires_at: { type: string, format: date-time }
  ServiceHTTPGrantSummary:
    type: object
    additionalProperties: false
    required: [subject, id, kind, expires_at]
    properties:
      subject: { $ref: "../openapi.yaml#/components/schemas/HTTPAuthorizationSubject" }
      id: { type: string, pattern: "^shg_[A-Za-z0-9]{22}$" }
      kind: { type: string, enum: [token, share] }
      expires_at: { type: string, format: date-time }
      revoked_at: { type: string, format: date-time }
  ServiceHTTPCredential:
    type: object
    additionalProperties: false
    required: [kind]
    properties:
      kind: { type: string, enum: [none, browser, token, share, certificate] }
      secret: { type: string, maxLength: 256 }
      certificate: { type: string, format: byte, maxLength: 22000 }
    description: Exactly one selected credential. Explicit HTTP credentials take precedence over an optional TLS client certificate. Invalid supplied credentials fail closed.
  ServiceHTTPVisitorRequest:
    type: object
    additionalProperties: false
    required: [run_number, visitor_connection_id, source_ip, destination_port, credential]
    properties:
      run_number: { type: integer, format: int64, minimum: 1 }
      visitor_connection_id: { type: string }
      source_ip: { type: string }
      destination_port: { type: integer, minimum: 1024, maximum: 65535 }
      credential: { $ref: "../openapi.yaml#/components/schemas/ServiceHTTPCredential" }
  ServiceBrowserRequest:
    type: object
    additionalProperties: false
    required: [run_number, secret]
    properties:
      run_number: { type: integer, format: int64, minimum: 1 }
      secret: { type: string, maxLength: 256 }
  HTTPVisitorRequest:
    description: A public URL is HTTP-only; services use enrolled visitor devices.
    type: object
    additionalProperties: false
    required: [publish_run_number, source_ip]
    properties:
      publish_run_number: { type: integer, format: int64, minimum: 1 }
      source_ip: { type: string, maxLength: 64 }
      browser_cookie_secret: { type: string, maxLength: 43 }
      share_id: { type: string }
      share_cookie_secret: { type: string, maxLength: 43 }
      share_secret: { type: string, maxLength: 43 }
  ReplaceVisitorAccessRequest:
    type: object
    additionalProperties: false
    required: [mode, ip, expected_revision]
    properties:
      mode: { $ref: "../openapi.yaml#/components/schemas/VisitorAccessMode" }
      ip:
        type: array
        maxItems: 256
        uniqueItems: true
        items: { type: string, minLength: 1, maxLength: 64 }
      expected_revision: { type: integer, format: int64, minimum: 1 }
  HTTPVisitorResponse:
    type: object
    additionalProperties: false
    required: [visit_allowed, team_member]
    properties:
      visit_allowed: { type: boolean }
      team_member: { type: boolean }
      identity_id: { type: string }
      display_name: { type: string }
      valid_until: { type: string, format: date-time }
  CreateTeamVisitorGrantRequest:
    type: object
    additionalProperties: false
    properties:
      expires_at: { type: string, format: date-time }
  CreateIdentityVisitorGrantRequest:
    type: object
    additionalProperties: false
    required: [identity_id]
    properties:
      identity_id: { $ref: "../openapi.yaml#/components/schemas/IdentityID" }
      expires_at: { type: string, format: date-time }
  VisitorGrant:
    type: object
    additionalProperties: false
    required: [id, public_url_id, kind, created_at]
    properties:
      id: { type: string }
      public_url_id: { $ref: "../openapi.yaml#/components/schemas/PublicURLID" }
      kind: { type: string, enum: [team, identity] }
      identity_id: { type: string }
      created_at: { type: string, format: date-time }
      expires_at: { type: string, format: date-time }
      revoked_at: { type: string, format: date-time }
  CreateVisitorInvitationRequest:
    type: object
    additionalProperties: false
    required: [email, token_digest, expires_at]
    properties:
      email: { type: string, maxLength: 320 }
      token_digest: { type: string, pattern: "^[0-9a-f]{64}$" }
      expires_at: { type: string, format: date-time }
  VisitorInvitation:
    type: object
    additionalProperties: false
    required: [id, public_url_id, email, expires_at]
    properties:
      id: { type: string }
      public_url_id: { $ref: "../openapi.yaml#/components/schemas/PublicURLID" }
      email: { type: string }
      expires_at: { type: string, format: date-time }
      accepted_identity_id: { type: string }
      revoked_at: { type: string, format: date-time }
  AvailablePublicURLPage:
    type: object
    additionalProperties: false
    required: [public_urls]
    properties:
      next_cursor: { type: string }
      public_urls:
        type: array
        items:
          $ref: "../openapi.yaml#/components/schemas/AvailablePublicURL"
  AvailablePublicURL:
    type: object
    additionalProperties: false
    required: [id, team_id, team_name, canonical_hostname, service_protocol, visitor_access]
    properties:
      id: { type: string }
      team_id: { type: string }
      team_name: { type: string }
      canonical_hostname: { type: string }
      service_protocol: { $ref: "../openapi.yaml#/components/schemas/PublicURLServiceProtocol" }
      visitor_access: { type: string, enum: [owner, preview_team, team_grant, identity_grant] }
  BrowserHandoffRequest:
    type: object
    additionalProperties: false
    required: [publish_run_number, token]
    properties:
      publish_run_number:
        type: integer
        format: int64
        minimum: 1
      token:
        type: string
        pattern: "^[A-Za-z0-9_-]{43}$"
  BrowserHandoffResponse:
    type: object
    additionalProperties: false
    required: [cookie_secret, return_path, expires_at]
    properties:
      cookie_secret:
        type: string
        pattern: "^[A-Za-z0-9_-]{43}$"
      return_path:
        type: string
        pattern: "^/"
      next_url:
        type: string
        pattern: "^https://"
      bridge:
        type: boolean
      expires_at:
        type: string
        format: date-time
  BrowserAccessRequest:
    type: object
    additionalProperties: false
    required: [publish_run_number, cookie_secret]
    properties:
      publish_run_number:
        type: integer
        format: int64
        minimum: 1
      cookie_secret:
        type: string
        pattern: "^[A-Za-z0-9_-]{43}$"
  BrowserAccessResponse:
    type: object
    additionalProperties: false
    required: [identity_id, display_name, team_member, visit_allowed]
    properties:
      identity_id:
        $ref: "../openapi.yaml#/components/schemas/IdentityID"
      display_name:
        type: string
        minLength: 1
        maxLength: 256
      team_member:
        type: boolean
      visit_allowed:
        type: boolean
