schemas:
  ConnectorPeerPairCandidate:
    type: object
    additionalProperties: false
    description: A pair to reconcile, not delivery authority or permission to open an application stream.
    required: [pair_id, delivery_generation]
    properties:
      pair_id: { type: string, pattern: "^cpp_[A-Za-z0-9]{22}$" }
      delivery_generation: { type: integer, format: int64, minimum: 1 }
  ConnectorPeerPairCandidates:
    type: object
    additionalProperties: false
    required: [items]
    properties:
      items:
        type: array
        maxItems: 64
        items: { $ref: "../openapi.yaml#/components/schemas/ConnectorPeerPairCandidate" }
      next_after:
        type: string
        pattern: "^cpp_[A-Za-z0-9]{22}$"
        description: Continue after this pair ID; restart from the first page on the next reconciliation pass.
  ConnectorPeerPairPrepared:
    type: object
    additionalProperties: false
    description: Report installation of the exact independently prepared binding; this does not renew pair or application authority.
    required: [delivery_id, delivery_generation, binding_expires_at]
    properties:
      delivery_id: { type: string, pattern: "^[A-Za-z0-9_-]{21}[AQgw]$" }
      delivery_generation: { type: integer, format: int64, minimum: 1 }
      binding_expires_at:
        type: string
        format: date-time
        description: The original control-clock expires_at from the installed delivery response, not a new local deadline.
  ConnectorPeerPairDelivery:
    type: object
    additionalProperties: false
    description: Existing pair delivery for the authenticated publisher run only; never grants an application stream.
    required:
      [
        pair_id,
        service_id,
        service_run_id,
        run_number,
        publisher_identity_id,
        subject,
        delivery_id,
        delivery_generation,
        key,
        source_ip,
        relays,
        observed_at,
        expires_at,
      ]
    properties:
      pair_id: { type: string, pattern: "^cpp_[A-Za-z0-9]{22}$" }
      service_id: { $ref: "../openapi.yaml#/components/schemas/ServiceID" }
      service_run_id: { $ref: "../openapi.yaml#/components/schemas/ServiceRunID" }
      run_number: { type: integer, format: int64, minimum: 1 }
      publisher_identity_id: { type: string, pattern: "^pub_[A-Za-z0-9]{22}$" }
      subject: { $ref: "../openapi.yaml#/components/schemas/VisitorSubject" }
      delivery_id: { type: string, pattern: "^[A-Za-z0-9_-]{21}[AQgw]$" }
      delivery_generation: { type: integer, format: int64, minimum: 1 }
      key: { type: string, description: Secret for this delivery; do not log or persist. }
      source_ip: { type: string, description: Canonical source observed by both relays. }
      observed_at:
        type: string
        format: date-time
        description: Control time for this authority observation; the publisher subtracts request delay when installing its local deadline.
      relays:
        type: array
        minItems: 2
        maxItems: 2
        items: { $ref: "../openapi.yaml#/components/schemas/ConnectorPeerPairRelay" }
      expires_at: { type: string, format: date-time }
  VisitorConnectionID:
    type: string
    pattern: "^vc_[A-Za-z0-9]{22}$"
  ServiceRunID:
    type: string
    pattern: "^srun_[A-Za-z0-9]{22}$"
  AuthorizeServiceClientCertificateRequest:
    type: object
    additionalProperties: false
    required: [run_number, visitor_connection_id, source_ip, certificate]
    properties:
      run_number: { type: integer, format: int64, minimum: 1 }
      visitor_connection_id: { $ref: "../openapi.yaml#/components/schemas/VisitorConnectionID" }
      source_ip: { type: string, maxLength: 64 }
      certificate: { type: string, format: byte, maxLength: 21848 }
  CreateServiceCertificateIssuanceRequest:
    type: object
    additionalProperties: false
    required: [run_number, csr]
    properties:
      run_number: { type: integer, format: int64, minimum: 1 }
      csr: { type: string, format: byte, maxLength: 87384 }
  ServiceCertificateInstalledRequest:
    type: object
    additionalProperties: false
    required: [run_number, issuance_id, not_after]
    properties:
      run_number: { type: integer, format: int64, minimum: 1 }
      issuance_id: { $ref: "../openapi.yaml#/components/schemas/IssuanceID" }
      not_after: { type: string, format: date-time }
  ServiceCertificateIssuance:
    type: object
    additionalProperties: false
    required:
      [id, service_id, service_run_id, run_number, publisher_identity_id, certificate_plan, state]
    properties:
      id: { $ref: "../openapi.yaml#/components/schemas/IssuanceID" }
      service_id: { $ref: "../openapi.yaml#/components/schemas/ServiceID" }
      service_run_id: { $ref: "../openapi.yaml#/components/schemas/ServiceRunID" }
      run_number: { type: integer, format: int64, minimum: 1 }
      certificate_plan: { $ref: "../openapi.yaml#/components/schemas/CertificatePlan" }
      publisher_identity_id: { type: string, pattern: "^pub_[A-Za-z0-9]{22}$" }
      state: { $ref: "../openapi.yaml#/components/schemas/CertificateIssuanceState" }
      certificate_pem: { type: string }
      not_before: { type: string, format: date-time }
      not_after: { type: string, format: date-time }
      retry_at: { type: string, format: date-time }
