schemas:
  ProjectPublicMetadata:
    type: object
    additionalProperties: false
    required: [source_fingerprint, services]
    properties:
      source_fingerprint: { type: string }
      services:
        type: array
        items:
          type: object
          additionalProperties: false
          required: [service, hostname, port]
          properties:
            service: { type: string }
            public_url_id: { $ref: "../openapi.yaml#/components/schemas/PublicURLID" }
            private_service_id: { $ref: "../openapi.yaml#/components/schemas/PrivateServiceID" }
            port: { type: integer, minimum: 1, maximum: 65535 }
            hostname: { type: string }
  RealizeLocalProjectServiceRequest:
    type: object
    additionalProperties: false
    required: [team_id, source_fingerprint, worktree_key, configuration]
    properties:
      team_id: { type: string }
      source_fingerprint: { type: string, pattern: "^[0-9a-f]{64}$" }
      worktree_key: { type: string, minLength: 1, maxLength: 128 }
      worktree_label: { type: string, minLength: 1, maxLength: 63 }
      domain_id: { $ref: "../openapi.yaml#/components/schemas/DomainID" }
      public_url_id: { $ref: "../openapi.yaml#/components/schemas/PublicURLID" }
      configuration: { $ref: "../openapi.yaml#/components/schemas/ProjectServiceConfiguration" }
  LocalProjectService:
    type: object
    additionalProperties: false
    required: [service, worktree_key, service_kind, service_id]
    properties:
      service: { type: string }
      worktree_key: { type: string }
      service_kind: { type: string, enum: [private_service, public_url] }
      service_id: { type: string }
      hostname: { type: string }
      private_service: { $ref: "../openapi.yaml#/components/schemas/PrivateServiceMetadata" }
  ApplyProjectConfigurationRequest:
    type: object
    additionalProperties: false
    required: [team_id, source_fingerprint, expected_revision, configuration]
    properties:
      team_id: { type: string }
      source_fingerprint: { type: string, pattern: "^[0-9a-f]{64}$" }
      project_label:
        { type: string, minLength: 1, maxLength: 63, pattern: "^[a-z0-9]([a-z0-9-]*[a-z0-9])?$" }
      expected_revision: { type: integer, format: int64, minimum: 0 }
      configuration: { $ref: "../openapi.yaml#/components/schemas/ProjectConfiguration" }
  ProjectConfiguration:
    type: object
    description: Normalized declarative configuration, at most 512 KiB encoded. All local declarations defer allocation to source-bound worktree realization. A project supports at most 256 active enrolled replicas across its groups.
    additionalProperties: false
    required: [publishers, services, oauth, webhooks]
    properties:
      workloads:
        type: object
        maxProperties: 32
        additionalProperties: { $ref: "../openapi.yaml#/components/schemas/ProjectWorkload" }
      oauth:
        type: boolean
        default: false
        description: Desired local app-led OAuth integration URL declaration. Control stores the declaration and revision; applying it does not provision a handler on a named publisher group.
      webhooks:
        type: object
        maxProperties: 32
        additionalProperties: { $ref: "../openapi.yaml#/components/schemas/ProjectWebhook" }
        description: Desired exact endpoints for the existing local webhook integration handler. Each endpoint names a declared local HTTP service with public_url enabled, including app, address, compose, and docker targets. Control does not fetch provider catalogs or provision remote webhook handlers during apply.
      publishers:
        {
          type: object,
          maxProperties: 32,
          additionalProperties:
            { $ref: "../openapi.yaml#/components/schemas/ProjectPublisherGroup" },
        }
      services:
        {
          type: object,
          maxProperties: 128,
          additionalProperties:
            { $ref: "../openapi.yaml#/components/schemas/ProjectServiceConfiguration" },
        }
  ProjectPublisherGroup:
    type: object
    additionalProperties: false
    properties:
      description: { type: string, maxLength: 1024 }
      domain_id: { type: string }
      public: { type: boolean, default: false }
  ProjectWorkload:
    type: object
    additionalProperties: false
    required: [provider, trust, services, max_duration_seconds]
    properties:
      provider: { $ref: "../openapi.yaml#/components/schemas/WorkloadProvider" }
      trust: { $ref: "../openapi.yaml#/components/schemas/WorkloadTrust" }
      github: { $ref: "../openapi.yaml#/components/schemas/ProjectWorkloadGitHub" }
      services:
        type: array
        minItems: 1
        maxItems: 32
        uniqueItems: true
        items: { type: string }
      max_duration_seconds: { type: integer, minimum: 1, maximum: 21600, default: 3600 }
  ProjectWorkloadGitHub:
    type: object
    additionalProperties: false
    description: Immutable repository metadata verified during trusted manager apply; job assertions never establish this binding. Unchanged applies reuse the saved binding.
    required: [repository, repository_id, repository_owner_id, workflow_ref, ref, events]
    properties:
      repository: { type: string, maxLength: 256 }
      repository_id: { type: string, pattern: "^[1-9][0-9]{0,19}$" }
      repository_owner_id: { type: string, pattern: "^[1-9][0-9]{0,19}$" }
      workflow_ref: { type: string, maxLength: 1024 }
      ref: { type: string, maxLength: 512 }
      events: { type: array, minItems: 1, maxItems: 10, uniqueItems: true, items: { type: string } }
      environment: { type: string, maxLength: 256 }
      job_workflow_ref: { type: string, maxLength: 1024 }
  ProjectTargetDiscovery:
    type: object
    additionalProperties: false
    required: [type, region]
    properties:
      type: { type: string, enum: [eks, rds] }
      region: { type: string, maxLength: 64 }
      cluster: { type: string, maxLength: 100 }
      instance: { type: string, maxLength: 100 }
      endpoint: { type: string, enum: [writer, reader] }
    description: Exact provider selector resolved by the assigned publisher with its own AWS credentials. Control and apply never fetch a target, TLS roots, or AWS credentials. EKS requires kubernetes; RDS requires the specified postgres or mysql protocol, verified against provider metadata by the publisher.
  ProjectWebhook:
    type: object
    additionalProperties: false
    required: [service, path, provider]
    properties:
      service: { type: string, minLength: 1, maxLength: 32 }
      path: { type: string, minLength: 1, maxLength: 2048 }
      provider: { $ref: "../openapi.yaml#/components/schemas/WebhookProvider" }
      delivery: { type: string, pattern: "^(fanout|selected)$" }
      methods:
        type: array
        maxItems: 7
        uniqueItems: true
        items: { type: string, pattern: "^(POST|GET|PUT|PATCH|DELETE|HEAD|OPTIONS)$" }
      source_ips:
        type: array
        minItems: 1
        maxItems: 256
        uniqueItems: true
        items: { type: string, minLength: 1, maxLength: 64 }
  ProjectServiceConfiguration:
    type: object
    additionalProperties: false
    required: [target]
    properties:
      publisher: { type: string, default: local }
      name: { type: string, maxLength: 32 }
      protocol: { $ref: "../openapi.yaml#/components/schemas/PrivateServiceProtocol" }
      target:
        type: string
        maxLength: 8192
        description: Public targets use the runtime NormalizeTarget rules, including an explicit port and no trailing slash on HTTP/HTTPS origins. Private targets normalize to host:port; private HTTPS origins require target_tls and plaintext HTTP origins forbid it. The publisher uses the approved transport/trust snapshot independently of mandatory managed visitor TLS. Only local publishers may use deferred app (HTTP only), compose:SERVICE:PORT, or docker:CONTAINER:PORT descriptors; control never discovers or executes those targets.
      target_discovery: { $ref: "../openapi.yaml#/components/schemas/ProjectTargetDiscovery" }
      public_url: { $ref: "../openapi.yaml#/components/schemas/ProjectServicePublicURL" }
      target_tls: { $ref: "../openapi.yaml#/components/schemas/ProjectTargetTLS" }
      access: { $ref: "../openapi.yaml#/components/schemas/ProjectServiceAccess" }
      http: { $ref: "../openapi.yaml#/components/schemas/ProjectServiceHTTP" }
  ProjectServiceHTTP:
    type: object
    additionalProperties: false
    description: Local HTTP behavior. Named publisher groups reject http settings until their execution contract supports readiness and path mounts.
    properties:
      readiness:
        type: object
        additionalProperties: false
        required: [path]
        properties:
          path: { type: string, minLength: 1, maxLength: 2048 }
      paths:
        type: object
        maxProperties: 32
        additionalProperties:
          type: object
          additionalProperties: false
          required: [service]
          properties:
            service: { type: string }
            strip_prefix: { type: boolean }
      open: { type: boolean }
  ProjectServicePublicURL:
    type: object
    additionalProperties: false
    properties:
      domain_id: { type: string }
      hostname: { type: string, maxLength: 253 }
      access: { $ref: "../openapi.yaml#/components/schemas/ProjectPublicAccess" }
      limits: { $ref: "../openapi.yaml#/components/schemas/ProjectPublicLimits" }
      ephemeral:
        type: boolean
        default: false
        description: Local deferred declarations may request an ephemeral worktree URL. Named publisher groups use managed endpoints and reject true.
    description: Local declarations defer URL allocation to their worktree runtime. Named publisher groups use their managed endpoint and reject domain_id and hostname overrides; their HTTP public_url settings select restricted access, optional IP filters, and HTTP request limits only.
  ProjectPublicAccess:
    type: object
    additionalProperties: false
    properties:
      mode: { $ref: "../openapi.yaml#/components/schemas/VisitorAccessMode" }
      ip:
        type: array
        minItems: 1
        maxItems: 256
        uniqueItems: true
        items: { type: string, maxLength: 64 }
  ProjectPublicLimits:
    type: object
    additionalProperties: false
    properties:
      http: { $ref: "../openapi.yaml#/components/schemas/ProjectHTTPApplicationLimits" }
      traffic: { $ref: "../openapi.yaml#/components/schemas/TrafficSelection" }
  ProjectHTTPApplicationLimits:
    type: object
    additionalProperties: false
    properties:
      total: { type: integer, minimum: 1, maximum: 9007199254740991 }
      concurrency: { type: integer, minimum: 1, maximum: 9007199254740991 }
      rate: { $ref: "../openapi.yaml#/components/schemas/ProjectApplicationRate" }
  ProjectApplicationRate:
    type: object
    additionalProperties: false
    required: [count, per]
    properties:
      count: { type: integer, minimum: 1, maximum: 9007199254740991 }
      per: { type: string, minLength: 1, maxLength: 64 }
      burst: { type: integer, minimum: 1, maximum: 9007199254740991 }
  ProjectTargetTLS:
    type: object
    additionalProperties: false
    required: [hostname, digest]
    description: Publisher-to-target TLS trust for http, tcp, postgres, or mysql, independent of mandatory managed visitor TLS. The protocol selects native negotiation. ca_pem is a CA-only snapshot added to the publisher's system roots. digest is lowercase SHA-256 of "tnl-target-tls/v1", NUL, hostname, NUL, and ca_pem. No filesystem path or remote bundle URL is accepted.
    properties:
      hostname: { type: string, minLength: 1, maxLength: 253 }
      ca_pem: { type: string, maxLength: 1048576 }
      digest: { type: string, pattern: "^[0-9a-f]{64}$" }
  ProjectServiceAccess:
    type: object
    additionalProperties: false
    required: [team]
    properties:
      team: { type: boolean, enum: [true] }
  AppliedProjectConfiguration:
    type: object
    additionalProperties: false
    required:
      [
        team_id,
        project_key,
        source_fingerprint,
        revision,
        configuration_hash,
        configuration,
        services,
        members,
      ]
    properties:
      team_id: { type: string }
      project_key: { type: string }
      source_fingerprint: { type: string }
      revision: { type: integer, format: int64 }
      configuration_hash: { type: string }
      configuration: { $ref: "../openapi.yaml#/components/schemas/ProjectConfiguration" }
      services:
        {
          type: array,
          items: { $ref: "../openapi.yaml#/components/schemas/AppliedProjectService" },
        }
      members:
        {
          type: array,
          items: { $ref: "../openapi.yaml#/components/schemas/PublisherGroupMemberStatus" },
        }
      groups:
        {
          type: array,
          items: { $ref: "../openapi.yaml#/components/schemas/AppliedPublisherGroup" },
        }
  AppliedPublisherGroup:
    type: object
    required: [id, name, group_names, namespace, domain_id, public]
    properties:
      id: { type: string }
      name: { type: string }
      group_names:
        type: array
        description: Authoritative current and historical selectors permanently bound to this group ID.
        items: { type: string }
      namespace: { type: string }
      domain_id: { type: string }
      public: { type: boolean }
  AppliedProjectService:
    type: object
    required: [service, publisher, service_kind, desired_revision, trust_revision]
    properties:
      service: { type: string }
      publisher: { type: string }
      service_kind: { type: string, enum: [public_url, private_service, local] }
      service_id: { type: string }
      hostname: { type: string }
      desired_revision: { type: integer, format: int64 }
      trust_revision: { type: integer, format: int64 }
      port: { type: integer, minimum: 1024, maximum: 65535 }
      public: { type: boolean }
  LocalServiceSource:
    type: object
    additionalProperties: false
    required: [project_key, source_fingerprint, service, worktree_key]
    properties:
      project_key: { type: string }
      source_fingerprint: { type: string, pattern: "^[0-9a-f]{64}$" }
      service: { type: string }
      worktree_key: { type: string }
