schemas:
  PublishRunServiceObservations:
    type: object
    additionalProperties: false
    required: [publish_run_number, events]
    properties:
      publish_run_number: { type: integer, format: int64, minimum: 1 }
      events:
        {
          type: array,
          minItems: 1,
          maxItems: 256,
          items: { $ref: "../openapi.yaml#/components/schemas/ServiceObservation" },
        }
  PublishRunID:
    $ref: "../openapi.yaml#/components/schemas/ResourceID"
  PublisherConnectionID:
    $ref: "../openapi.yaml#/components/schemas/ResourceID"
  CertificatePlan:
    type: object
    additionalProperties: false
    required: [cache_key, scope, identifiers, challenge_method]
    properties:
      cache_key:
        type: string
        minLength: 1
        maxLength: 256
      scope:
        type: string
        minLength: 1
        maxLength: 256
      identifiers:
        type: array
        minItems: 1
        maxItems: 2
        uniqueItems: true
        items:
          type: string
          minLength: 1
          maxLength: 253
          pattern: "^(?:\\*\\.)?[a-z0-9](?:[a-z0-9.-]*[a-z0-9])?$"
      challenge_method:
        $ref: "../openapi.yaml#/components/schemas/CertificateChallengeMethod"
  CreatePublishRunRequest:
    type: object
    additionalProperties: false
    properties:
      traffic:
        $ref: "../openapi.yaml#/components/schemas/TrafficSelection"
      preferred_regions: { $ref: "../openapi.yaml#/components/schemas/LocationPreferences" }
  TrafficLimits:
    type: object
    additionalProperties: false
    description: Resolved limits for one exact public URL and publish run. Connections are bounded across ingress allocations and both publisher connections. Rate, byte, and lifetime totals are enforced independently on each ingress process. Omitted totals are unlimited.
    required: [connections, rate, rate_per_ns, burst, upload_bytes, download_bytes]
    properties:
      connections:
        type: integer
        minimum: 1
        maximum: 1048576
      rate:
        type: integer
        minimum: 1
        maximum: 2147483648
      rate_per_ns:
        type: integer
        format: int64
        minimum: 1000000
        maximum: 86400000000000
      burst:
        type: integer
        minimum: 1
        maximum: 2147483648
      upload_bytes:
        type: integer
        format: int64
        minimum: 65536
        maximum: 1099511627776
      download_bytes:
        type: integer
        format: int64
        minimum: 65536
        maximum: 1099511627776
      total_connections:
        type: integer
        format: int64
        minimum: 1
      total_upload_bytes:
        type: integer
        format: int64
        minimum: 1
      total_download_bytes:
        type: integer
        format: int64
        minimum: 1
  PublishRunState:
    type: string
    enum: [starting, ready, draining, closed, expired, canceled]
  PublishRun:
    type: object
    additionalProperties: false
    required:
      [
        id,
        public_url_id,
        team_id,
        publish_run_number,
        policy_revision,
        state,
        created_at,
        expires_at,
      ]
    properties:
      id:
        $ref: "../openapi.yaml#/components/schemas/PublishRunID"
      public_url_id:
        $ref: "../openapi.yaml#/components/schemas/PublicURLID"
      team_id:
        $ref: "../openapi.yaml#/components/schemas/TeamID"
      membership_id:
        $ref: "../openapi.yaml#/components/schemas/MembershipID"
      publish_run_number:
        type: integer
        format: int64
        minimum: 1
      policy_revision:
        type: integer
        format: int64
        minimum: 1
      state:
        $ref: "../openapi.yaml#/components/schemas/PublishRunState"
      ready_publisher_connections:
        type: integer
        minimum: 0
        maximum: 2
      created_at:
        type: string
        format: date-time
      expires_at:
        type: string
        format: date-time
      ready_at:
        type: string
        format: date-time
      closed_at:
        type: string
        format: date-time
  PublisherConnectionState:
    type: string
    enum: [assigned, connected, ready, replacing]
  PublishRunSetup:
    type: object
    additionalProperties: false
    required: [public_url, publish_run, publish_run_token, publisher_connections, certificate_plan]
    properties:
      traffic:
        $ref: "../openapi.yaml#/components/schemas/TrafficLimits"
      public_url:
        $ref: "../openapi.yaml#/components/schemas/PublicURL"
      publish_run:
        $ref: "../openapi.yaml#/components/schemas/PublishRun"
      publish_run_token:
        type: string
        minLength: 1
        maxLength: 4096
      certificate_plan:
        $ref: "../openapi.yaml#/components/schemas/CertificatePlan"
      publisher_connections:
        type: array
        minItems: 2
        maxItems: 2
        items:
          $ref: "../openapi.yaml#/components/schemas/ConnectionAssignment"
  PublishRunVersionRequest:
    type: object
    additionalProperties: false
    required: [publish_run_number]
    properties:
      publish_run_number:
        type: integer
        format: int64
        minimum: 1
  EnableShareAccessRequest:
    type: object
    additionalProperties: false
    required: [publish_run_number]
    properties:
      publish_run_number:
        type: integer
        format: int64
        minimum: 1
      preview_id:
        $ref: "../openapi.yaml#/components/schemas/PreviewID"
  RedeemShareRequest:
    type: object
    additionalProperties: false
    required: [publish_run_number]
    properties:
      publish_run_number:
        type: integer
        format: int64
        minimum: 1
      share_id:
        $ref: "../openapi.yaml#/components/schemas/ShareID"
      secret:
        type: string
        minLength: 43
        maxLength: 43
        pattern: "^[A-Za-z0-9_-]+$"
      handoff_token:
        type: string
        minLength: 43
        maxLength: 43
        pattern: "^[A-Za-z0-9_-]+$"
  PublishRunShareState:
    type: object
    additionalProperties: false
    required: [schema_version, shares]
    properties:
      schema_version:
        $ref: "../openapi.yaml#/components/schemas/ReviewSchemaVersion"
      team_access_enabled:
        type: boolean
      shares:
        type: array
        items:
          $ref: "../openapi.yaml#/components/schemas/PublisherShare"
  PublishRunHeartbeat:
    type: object
    additionalProperties: false
    description: Each HTTP publisher becomes ready independently after DNS, its installed public URL certificate, and two ready publisher connections.
    required: [publish_run, publisher_connections, policy_denials, visitor_policy_revision]
    properties:
      visitor_policy_revision:
        type: integer
        format: int64
        minimum: 0
        description: Current team authority revision; publishers invalidate run-local visitor decisions when it advances.
      publish_run:
        $ref: "../openapi.yaml#/components/schemas/PublishRun"
      publisher_connections:
        type: array
        minItems: 2
        maxItems: 2
        items:
          $ref: "../openapi.yaml#/components/schemas/ConnectionAssignment"
      policy_denials:
        description: Total IP policy denials reported so far for this publish run number. The total may lag.
        type: integer
        format: int64
        minimum: 0
  CertificateInstalledRequest:
    type: object
    additionalProperties: false
    required: [publish_run_number, issuance_id, not_after]
    properties:
      publish_run_number:
        type: integer
        format: int64
        minimum: 1
      issuance_id:
        $ref: "../openapi.yaml#/components/schemas/IssuanceID"
      not_after:
        type: string
        format: date-time
  CreateCertificateIssuanceRequest:
    type: object
    additionalProperties: false
    required: [publish_run_number, csr]
    properties:
      publish_run_number:
        type: integer
        format: int64
        minimum: 1
      csr:
        type: string
        format: byte
        minLength: 1
        maxLength: 65536
  CertificateIssuanceState:
    type: string
    enum:
      [
        pending,
        authorizing,
        ready_to_finalize,
        finalizing,
        waiting_for_install,
        installed,
        failed,
        canceled,
      ]
  CertificateIssuance:
    type: object
    additionalProperties: false
    required:
      [
        id,
        publish_run_id,
        public_url_id,
        publish_run_number,
        certificate_plan,
        state,
        created_at,
        updated_at,
      ]
    properties:
      id:
        $ref: "../openapi.yaml#/components/schemas/IssuanceID"
      publish_run_id:
        $ref: "../openapi.yaml#/components/schemas/PublishRunID"
      public_url_id:
        $ref: "../openapi.yaml#/components/schemas/PublicURLID"
      publish_run_number:
        type: integer
        format: int64
        minimum: 1
      certificate_plan:
        $ref: "../openapi.yaml#/components/schemas/CertificatePlan"
      state:
        $ref: "../openapi.yaml#/components/schemas/CertificateIssuanceState"
      certificate_pem:
        type: string
      retry_at:
        type: string
        format: date-time
      not_before:
        type: string
        format: date-time
      not_after:
        type: string
        format: date-time
      created_at:
        type: string
        format: date-time
      updated_at:
        type: string
        format: date-time
