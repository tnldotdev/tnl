schemas:
  StreamCapacityAllocation:
    type: object
    additionalProperties: false
    required:
      [
        id,
        resource,
        run_id,
        run_number,
        ingress_id,
        ingress_run_id,
        ingress_lease_revision,
        capacity,
        observed_at,
        valid_until,
        retired,
        publisher_observed,
        reservation_key,
      ]
    properties:
      id: { type: string, pattern: "^salloc_[A-Za-z0-9]{22}$" }
      resource: { $ref: "../openapi.yaml#/components/schemas/VisitorResourceScope" }
      run_id: { type: string, maxLength: 64 }
      run_number: { type: integer, format: int64, minimum: 1 }
      ingress_id: { type: string, maxLength: 128 }
      ingress_run_id: { type: string, maxLength: 128 }
      ingress_lease_revision: { type: integer, format: int64, minimum: 1 }
      capacity: { type: integer, minimum: 1, maximum: 1048576 }
      observed_at: { type: string, format: date-time }
      valid_until: { type: string, format: date-time }
      retired: { type: boolean }
      publisher_observed: { type: boolean }
      reservation_key:
        type: string
        format: byte
        maxLength: 44
        description: private key shared only with the assigned ingress and publisher for signed visitor reservations.
