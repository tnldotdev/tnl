schemas:
  NativePeerRelayLease:
    type: object
    additionalProperties: false
    required: [relay_service_id, relay_id, relay_run_id, relay_lease_revision]
    properties:
      relay_service_id: { type: string, minLength: 1 }
      relay_id: { type: string, minLength: 1 }
      relay_run_id: { type: string, minLength: 1 }
      relay_lease_revision: { type: integer, format: int64, minimum: 1 }
  NativePeerPairRelay:
    type: object
    additionalProperties: false
    required:
      [publisher_connection_id, assignment_revision, relay_lease, relay_address, tls_server_name]
    properties:
      publisher_connection_id: { type: string, minLength: 1 }
      assignment_revision: { type: integer, format: int64, minimum: 1 }
      relay_lease: { $ref: "../openapi.yaml#/components/schemas/NativePeerRelayLease" }
      relay_address: { type: string, minLength: 1 }
      tls_server_name: { type: string, minLength: 1 }
  NativePeerPairReady:
    type: object
    additionalProperties: false
    description: A short-lived, credential-free snapshot for signing an exact pair request. It never grants a relay claim.
    required: [publisher_identity_id, relays]
    properties:
      publisher_identity_id: { type: string, minLength: 1 }
      relays:
        type: array
        minItems: 2
        maxItems: 2
        items: { $ref: "../openapi.yaml#/components/schemas/NativePeerPairRelay" }
  NativePeerPairRequest:
    type: object
    additionalProperties: false
    description: Sign the canonical NativePeerPairProofMessage Go v1 array, not the snake_case HTTP object. Source is selected by kind; a device uses the sole control bearer, a workload uses its credential and no control bearer.
    required:
      [
        service_run_id,
        run_number,
        publisher_identity_id,
        subject,
        source,
        action,
        idempotency_key,
        requested_at,
        expected_relays,
        signature,
      ]
    properties:
      service_run_id: { $ref: "../openapi.yaml#/components/schemas/ServiceRunID" }
      run_number: { type: integer, format: int64, minimum: 1 }
      publisher_identity_id: { type: string, minLength: 1 }
      subject: { $ref: "../openapi.yaml#/components/schemas/VisitorSubject" }
      source:
        x-go-type: json.RawMessage
        oneOf:
          - { $ref: "../openapi.yaml#/components/schemas/VisitorTokenDeviceSource" }
          - { $ref: "../openapi.yaml#/components/schemas/VisitorTokenWorkloadSource" }
      action: { type: string, enum: [create, replace, renew] }
      idempotency_key: { $ref: "../openapi.yaml#/components/schemas/IdempotencyKey" }
      requested_at: { type: string, format: date-time }
      previous_pair_id: { type: string, pattern: "^npp_[A-Za-z0-9]{22}$" }
      previous_generation: { type: integer, format: int64, minimum: 1 }
      expected_relays:
        type: array
        minItems: 2
        maxItems: 2
        items: { $ref: "../openapi.yaml#/components/schemas/NativePeerPairRelay" }
      signature:
        {
          type: string,
          description: Unpadded base64url Ed25519 signature over NativePeerPairProofMessage.,
        }
  NativePeerPair:
    type: object
    additionalProperties: false
    required:
      [
        pair_id,
        service_id,
        service_run_id,
        run_number,
        publisher_identity_id,
        subject,
        delivery_id,
        delivery_generation,
        key,
        relays,
        observed_at,
        expires_at,
      ]
    properties:
      pair_id: { type: string, pattern: "^npp_[A-Za-z0-9]{22}$" }
      service_id: { $ref: "../openapi.yaml#/components/schemas/ServiceID" }
      service_run_id: { $ref: "../openapi.yaml#/components/schemas/ServiceRunID" }
      run_number: { type: integer, format: int64, minimum: 1 }
      publisher_identity_id: { type: string, minLength: 1 }
      subject: { $ref: "../openapi.yaml#/components/schemas/VisitorSubject" }
      delivery_id:
        {
          type: string,
          pattern: "^[A-Za-z0-9_-]{21}[AQgw]$",
          description: Canonical unpadded base64url of the nonzero 16-byte delivery header identifier; not an access grant.,
        }
      delivery_generation: { type: integer, format: int64, minimum: 1 }
      key: { type: string, description: Secret returned only to the authorized signed source. }
      observed_at:
        type: string
        format: date-time
        description: Control's authority observation time; subtract request transit when installing local deadlines.
      publisher_prepared_until:
        type: string
        format: date-time
        description: The publisher reported its exact packet registration and inner listener installed through this bound. This startup barrier is not visitor permission or a guarantee of continued process liveness.
      relays:
        type: array
        minItems: 2
        maxItems: 2
        items: { $ref: "../openapi.yaml#/components/schemas/NativePeerPairRelay" }
      expires_at: { type: string, format: date-time }
  LocationPreferences:
    type: array
    maxItems: 8
    description: Ordered tnl region codes or provider:region names. Control normalizes known sites, rejects duplicates and unknown names, and tries another live region when preferred capacity is unavailable.
    items: { type: string, minLength: 1, maxLength: 64 }
  IngressTransportTrust:
    type: object
    additionalProperties: false
    required:
      [
        ingress_id,
        ingress_run_id,
        ingress_lease_revision,
        tls_server_name,
        certificate_pem,
        issuer_pem,
        issuer_revision,
        public_key_sha256,
        lease_uri,
        not_before,
        not_after,
        valid_until,
      ]
    properties:
      ingress_id: { type: string, minLength: 1 }
      ingress_run_id: { type: string, minLength: 1 }
      ingress_lease_revision: { type: integer, format: int64, minimum: 1 }
      tls_server_name: { type: string, minLength: 1, maxLength: 253 }
      certificate_pem: { type: string, minLength: 1, maxLength: 65536 }
      issuer_pem: { type: string, minLength: 1, maxLength: 131072 }
      issuer_revision: { type: integer, format: int64, minimum: 1 }
      public_key_sha256: { type: string, pattern: "^[0-9a-f]{64}$" }
      lease_uri: { type: string, format: uri }
      not_before: { type: string, format: date-time }
      not_after: { type: string, format: date-time }
      valid_until: { type: string, format: date-time }
  VisitorDevice:
    type: object
    additionalProperties: false
    required: [id, identity_id, public_key, created_at]
    properties:
      id: { type: string, pattern: "^vdev_[A-Za-z0-9]{22}$" }
      identity_id: { $ref: "../openapi.yaml#/components/schemas/IdentityID" }
      public_key: { type: string, pattern: "^[0-9a-f]{64}$" }
      created_at: { type: string, format: date-time }
      revoked_at: { type: string, format: date-time }
  ConnectorSessionID:
    type: string
    pattern: "^cns_[A-Za-z0-9]{22}$"
  ServiceClientCertificate:
    type: object
    additionalProperties: false
    required: [service_id, certificate_pem, issuer_pem, expires_at]
    properties:
      service_id: { $ref: "../openapi.yaml#/components/schemas/ServiceID" }
      certificate_pem: { type: string, maxLength: 16384 }
      issuer_pem: { type: string, maxLength: 16384 }
      expires_at: { type: string, format: date-time }
  ConnectorSessionSetup:
    type: object
    additionalProperties: false
    required:
      [
        connector_session_id,
        service_id,
        session_credential,
        ingress_id,
        region,
        ingress_address,
        tls_server_name,
        subject,
        expires_at,
      ]
    properties:
      connector_session_id: { $ref: "../openapi.yaml#/components/schemas/ConnectorSessionID" }
      service_id: { $ref: "../openapi.yaml#/components/schemas/ServiceID" }
      session_credential: { type: string, minLength: 32, maxLength: 512 }
      ingress_address:
        {
          type: string,
          minLength: 1,
          description: Shared ingress infrastructure TLS endpoint,
          not a service-specific hostname.,
        }
      ingress_id: { type: string, minLength: 1 }
      region: { type: string, pattern: "^(local|[a-z]{3})$" }
      tls_server_name: { type: string, minLength: 1, maxLength: 253 }
      expires_at: { type: string, format: date-time }
      subject: { $ref: "../openapi.yaml#/components/schemas/VisitorSubject" }
