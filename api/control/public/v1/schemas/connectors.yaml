schemas:
  ConnectorPeerRelayLease:
    type: object
    additionalProperties: false
    required: [relay_service_id, relay_id, relay_run_id, relay_lease_revision]
    properties:
      relay_service_id: { type: string, minLength: 1 }
      relay_id: { type: string, minLength: 1 }
      relay_run_id: { type: string, minLength: 1 }
      relay_lease_revision: { type: integer, format: int64, minimum: 1 }
  ConnectorPeerPairRelay:
    type: object
    additionalProperties: false
    required:
      [publisher_connection_id, assignment_revision, relay_lease, relay_address, tls_server_name]
    properties:
      publisher_connection_id: { type: string, minLength: 1 }
      assignment_revision: { type: integer, format: int64, minimum: 1 }
      relay_lease: { $ref: "../openapi.yaml#/components/schemas/ConnectorPeerRelayLease" }
      relay_address: { type: string, minLength: 1 }
      tls_server_name: { type: string, minLength: 1 }
  ConnectorPeerPairReady:
    type: object
    additionalProperties: false
    description: A short-lived, credential-free snapshot for signing an exact pair request. It never grants a relay claim.
    required: [publisher_identity_id, relays]
    properties:
      publisher_identity_id: { type: string, minLength: 1 }
      relays:
        type: array
        minItems: 2
        maxItems: 2
        items: { $ref: "../openapi.yaml#/components/schemas/ConnectorPeerPairRelay" }
  ConnectorPeerPairRequest:
    type: object
    additionalProperties: false
    description: Sign the canonical ConnectorPeerPairProofMessage Go v1 array, not the snake_case HTTP object. Source is selected by kind; a device uses the sole control bearer, a workload uses its credential and no control bearer. Each connector owner creates with a distinct idempotency key and retains that stable owner key across create, renew and replace. A pair ID and generation alone never prove ownership. Replacement also names the exact predecessor and issues a new pair, delivery ID, key and generation; it does not transfer a running session. An uncertain response repeats the exact signed request, including its timestamp, action and owner key.
    required:
      [
        service_run_id,
        run_number,
        publisher_identity_id,
        subject,
        source,
        action,
        idempotency_key,
        requested_at,
        expected_relays,
        signature,
      ]
    properties:
      service_run_id: { $ref: "../openapi.yaml#/components/schemas/ServiceRunID" }
      run_number: { type: integer, format: int64, minimum: 1 }
      publisher_identity_id: { type: string, minLength: 1 }
      subject: { $ref: "../openapi.yaml#/components/schemas/VisitorSubject" }
      source:
        x-go-type: json.RawMessage
        oneOf:
          - { $ref: "../openapi.yaml#/components/schemas/VisitorTokenDeviceSource" }
          - { $ref: "../openapi.yaml#/components/schemas/VisitorTokenWorkloadSource" }
      action: { type: string, enum: [create, replace, renew] }
      idempotency_key: { $ref: "../openapi.yaml#/components/schemas/IdempotencyKey" }
      requested_at:
        type: string
        format: date-time
        description: Retain this timestamp on an uncertain reply retry. A successful fresh renewal supersedes earlier create or replace reply proofs; those proofs cannot recover the later renewal's bound.
      previous_pair_id: { type: string, pattern: "^cpp_[A-Za-z0-9]{22}$" }
      previous_generation: { type: integer, format: int64, minimum: 1 }
      expected_relays:
        type: array
        minItems: 2
        maxItems: 2
        items: { $ref: "../openapi.yaml#/components/schemas/ConnectorPeerPairRelay" }
      signature:
        {
          type: string,
          description: Unpadded base64url Ed25519 signature over ConnectorPeerPairProofMessage.,
        }
  ConnectorPeerPair:
    type: object
    additionalProperties: false
    required:
      [
        pair_id,
        service_id,
        service_run_id,
        run_number,
        publisher_identity_id,
        subject,
        delivery_id,
        delivery_generation,
        key,
        relays,
        observed_at,
        expires_at,
      ]
    properties:
      pair_id: { type: string, pattern: "^cpp_[A-Za-z0-9]{22}$" }
      service_id: { $ref: "../openapi.yaml#/components/schemas/ServiceID" }
      service_run_id: { $ref: "../openapi.yaml#/components/schemas/ServiceRunID" }
      run_number: { type: integer, format: int64, minimum: 1 }
      publisher_identity_id: { type: string, minLength: 1 }
      subject: { $ref: "../openapi.yaml#/components/schemas/VisitorSubject" }
      delivery_id:
        {
          type: string,
          pattern: "^[A-Za-z0-9_-]{21}[AQgw]$",
          description: Canonical unpadded base64url of the nonzero 16-byte delivery header identifier; not an access grant.,
        }
      delivery_generation:
        type: integer
        format: int64
        minimum: 1
        description: Current network binding revision; aborted revisions are never reused.
      key:
        {
          type: string,
          description: Per-binding delivery credential; never use it as the retained endpoint frame key.,
        }
      session_key:
        type: string
        x-go-type-skip-optional-pointer: true
        description: Stable endpoint frame key, returned only to the authorized connector and publisher, never a relay.
      trust_revision:
        type: integer
        format: int64
        minimum: 1
        x-go-type-skip-optional-pointer: true
      operation_id:
        type: string
        x-go-type-skip-optional-pointer: true
        description: Rebind operation that issued this revision; absent for a legacy initial binding.
      binding_challenge:
        type: string
        pattern: "^[A-Za-z0-9_-]{42}[AEIMQUYcgkosw048]$"
        x-go-type-skip-optional-pointer: true
      binding_state:
        $ref: "../openapi.yaml#/components/schemas/ConnectorPeerPairBindingState"
        x-go-type-skip-optional-pointer: true
      source_ip: { type: string, maxLength: 45 }
      publisher_proved_until:
        type: string
        format: date-time
        description: Independent publisher path-proof freshness, at most five seconds and capped by installation, claim, pending-operation and owner bounds. Used only for activation, not a serving lease. Inspect, exact proof retries and owner renewal cannot extend it; fresh proofs use the prepared operation in service-runs.yaml.
      observed_at:
        type: string
        format: date-time
        description: Control's authority observation time; subtract request transit when installing local deadlines.
      publisher_prepared_until:
        type: string
        format: date-time
        description: The publisher reported its exact packet registration and inner listener installed through this bound. This startup barrier is not visitor permission or a guarantee of continued process liveness.
      relays:
        type: array
        minItems: 2
        maxItems: 2
        items: { $ref: "../openapi.yaml#/components/schemas/ConnectorPeerPairRelay" }
      expires_at:
        type: string
        format: date-time
        description: Owner authority deadline, conservatively capped for a pending snapshot by pending_until. Independent relay claims and publisher installation retain their confirmed bounds; see ConnectorPeerPairPrepared.binding_expires_at in service-runs.yaml. Only a fresh authorized owner renewal extends owner authority; inspect and exact lifecycle retries do not.
  ConnectorPeerPairRenewal:
    type: object
    additionalProperties: false
    description: One authenticated authority decision for the pinned run, pair lease and signed visitor permission. All deadlines share pair.observed_at; install local bounds from request start so transit spends the interval. Publisher installation and relay claims retain their independently confirmed deadlines.
    required: [pair, run_valid_until, protocol, trust_revision, endpoint, visitor_permission]
    properties:
      pair: { $ref: "../openapi.yaml#/components/schemas/ConnectorPeerPair" }
      run_valid_until: { type: string, format: date-time }
      protocol: { $ref: "../openapi.yaml#/components/schemas/ServiceProtocol" }
      trust_revision: { type: integer, format: int64, minimum: 1 }
      endpoint: { $ref: "../openapi.yaml#/components/schemas/ServiceEndpoint" }
      visitor_permission: { $ref: "../openapi.yaml#/components/schemas/VisitorTokenResponse" }
  ConnectorPeerPairRebindPhase:
    type: string
    enum: [inspect, prepare, activate, abort]
    x-enum-varnames:
      [
        ConnectorPeerPairInspect,
        ConnectorPeerPairPrepare,
        ConnectorPeerPairActivate,
        ConnectorPeerPairAbort,
      ]
  ConnectorPeerPairBindingState:
    type: string
    enum: [active, suspended, prepared, installed, proved]
    x-enum-varnames:
      [
        ConnectorPeerPairBindingActive,
        ConnectorPeerPairBindingSuspended,
        ConnectorPeerPairBindingPrepared,
        ConnectorPeerPairBindingInstalled,
        ConnectorPeerPairBindingProved,
      ]
  ConnectorPeerPairRebindOperationStatus:
    type: string
    enum: [pending, active, aborted, expired]
    x-enum-varnames:
      [
        ConnectorPeerPairOperationPending,
        ConnectorPeerPairOperationActive,
        ConnectorPeerPairOperationAborted,
        ConnectorPeerPairOperationExpired,
      ]
  ConnectorPeerPairPathProof:
    type: object
    additionalProperties: false
    description: A revision-bound probe reply from the opposite endpoint, not an application permission. Runtime also checks that its physical carrier is still current.
    required: [connection_slot, probe_nonce, reply_frame]
    properties:
      connection_slot: { type: integer, minimum: 0, maximum: 1 }
      probe_nonce: { type: string, pattern: "^[A-Za-z0-9_-]{21}[AQgw]$" }
      reply_frame:
        type: string
        minLength: 1
        maxLength: 342
        pattern: "^[A-Za-z0-9_-]+$"
        description: Canonical unpadded base64url of a bounded binary PeerProbeReply authenticated with SessionKey.
  ConnectorPeerPairRebindRequest:
    type: object
    additionalProperties: false
    description: One signed lifecycle operation for an existing owner and exact run. Inspect never selects a run or renews authority. Retain each phase's exact signed request after an uncertain response. Empty phase-specific strings and arrays are explicit; source credentials are not signed.
    required:
      [
        phase,
        idempotency_key,
        operation_id,
        expected_generation,
        requested_at,
        service_run_id,
        run_number,
        publisher_identity_id,
        trust_revision,
        subject,
        source,
        expected_relays,
        binding_challenge,
        path_proofs,
        signature,
      ]
    properties:
      phase: { $ref: "../openapi.yaml#/components/schemas/ConnectorPeerPairRebindPhase" }
      idempotency_key: { $ref: "../openapi.yaml#/components/schemas/IdempotencyKey" }
      operation_id:
        type: string
        maxLength: 25
        description: Empty for inspect; otherwise an ik_ opaque id retained across all phases of one operation.
      expected_generation:
        type: integer
        format: int64
        minimum: 1
        description: Known high-water for inspect, exact high-water CAS for prepare, exact pending revision for activate or abort.
      requested_at: { type: string, format: date-time }
      service_run_id: { $ref: "../openapi.yaml#/components/schemas/ServiceRunID" }
      run_number: { type: integer, format: int64, minimum: 1 }
      publisher_identity_id: { type: string, pattern: "^pub_[A-Za-z0-9]{22}$" }
      trust_revision: { type: integer, format: int64, minimum: 1 }
      subject: { $ref: "../openapi.yaml#/components/schemas/VisitorSubject" }
      source:
        x-go-type: json.RawMessage
        oneOf:
          - { $ref: "../openapi.yaml#/components/schemas/VisitorTokenDeviceSource" }
          - { $ref: "../openapi.yaml#/components/schemas/VisitorTokenWorkloadSource" }
      expected_relays:
        type: array
        maxItems: 2
        description: Exactly two ordered relay slots for prepare; empty for every other phase.
        items: { $ref: "../openapi.yaml#/components/schemas/ConnectorPeerPairRelay" }
      binding_challenge:
        type: string
        maxLength: 43
        description: The pending binding's canonical 32-byte base64url challenge for activate; empty otherwise.
      path_proofs:
        type: array
        maxItems: 2
        description: Exactly two ordered connector-initiated proofs for activate; empty otherwise.
        items: { $ref: "../openapi.yaml#/components/schemas/ConnectorPeerPairPathProof" }
      signature: { type: string, minLength: 86, maxLength: 86 }
  ConnectorPeerPairRebindOperation:
    type: object
    additionalProperties: false
    required: [operation_id, delivery_generation, status]
    properties:
      operation_id: { type: string, pattern: "^ik_[A-Za-z0-9]{22}$" }
      delivery_generation: { type: integer, format: int64, minimum: 1 }
      status: { $ref: "../openapi.yaml#/components/schemas/ConnectorPeerPairRebindOperationStatus" }
  ConnectorPeerPairRebindState:
    type: object
    additionalProperties: false
    description: At most one active and one pending binding for the same retained owner. High-water and the last operation survive abort or expiry; observations never extend authority. Snapshot observed_at values agree. Ready relays are a credential-free hint for this saved run, never a new selection.
    required: [high_water_generation, ready_relays]
    properties:
      active: { $ref: "../openapi.yaml#/components/schemas/ConnectorPeerPair" }
      pending: { $ref: "../openapi.yaml#/components/schemas/ConnectorPeerPair" }
      high_water_generation: { type: integer, format: int64, minimum: 1 }
      pending_until:
        type: string
        format: date-time
        description: Fixed pending-operation deadline, at most ten seconds from preparation and capped by the existing owner authority. Inspect, exact retries and owner renewal cannot extend it. Publisher installation and path proofs in service-runs.yaml cannot outlive this deadline while pending.
      ready_relays:
        type: array
        maxItems: 2
        items: { $ref: "../openapi.yaml#/components/schemas/ConnectorPeerPairRelay" }
      operation: { $ref: "../openapi.yaml#/components/schemas/ConnectorPeerPairRebindOperation" }
  VisitorDevice:
    type: object
    additionalProperties: false
    required: [id, identity_id, public_key, created_at]
    properties:
      id: { type: string, pattern: "^vdev_[A-Za-z0-9]{22}$" }
      identity_id: { $ref: "../openapi.yaml#/components/schemas/IdentityID" }
      public_key: { type: string, pattern: "^[0-9a-f]{64}$" }
      created_at: { type: string, format: date-time }
      revoked_at: { type: string, format: date-time }
  IssueServiceClientCertificateRequest:
    type: object
    additionalProperties: false
    required: [device_id, csr]
    properties:
      device_id: { type: string, pattern: "^vdev_[A-Za-z0-9]{22}$" }
      csr: { type: string, format: byte, maxLength: 10924 }
  ServiceClientCertificate:
    type: object
    additionalProperties: false
    required: [service_id, certificate_pem, issuer_pem, expires_at]
    properties:
      service_id: { $ref: "../openapi.yaml#/components/schemas/ServiceID" }
      certificate_pem: { type: string, maxLength: 16384 }
      issuer_pem: { type: string, maxLength: 16384 }
      expires_at: { type: string, format: date-time }
  ServiceClientCertificateDecision:
    type: object
    additionalProperties: false
    required: [allowed, admitted, valid_until]
    properties:
      allowed: { type: boolean }
      admitted:
        {
          type: boolean,
          description: Ingress has reserved ordinary capacity. The publisher must wait for this before sending application bytes to the target.,
        }
      valid_until: { type: string, format: date-time }
