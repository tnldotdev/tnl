schemas:
  PublicURLID:
    $ref: "../openapi.yaml#/components/schemas/ResourceID"
  PublicURLScope:
    type: string
    enum: [member, shared]
  PublicURLPurpose:
    type: string
    enum: [app, alias, demo, oauth, webhooks]
  PublicURLServiceProtocol:
    type: string
    enum: [http]
  PublicURLLifecycleState:
    type: string
    enum: [enabled, suspended]
  PublicURL:
    type: object
    additionalProperties: false
    required:
      [
        id,
        team_id,
        domain_id,
        canonical_hostname,
        target,
        public_url_scope,
        purpose,
        service_protocol,
        access_mode,
        mutation_revision,
        policy_revision,
        lifecycle_state,
        next_publish_run_number,
        ephemeral,
        created_at,
        updated_at,
      ]
    properties:
      id:
        $ref: "../openapi.yaml#/components/schemas/PublicURLID"
      team_id:
        $ref: "../openapi.yaml#/components/schemas/TeamID"
      domain_id:
        $ref: "../openapi.yaml#/components/schemas/DomainID"
      membership_id:
        $ref: "../openapi.yaml#/components/schemas/MembershipID"
      canonical_hostname:
        $ref: "../openapi.yaml#/components/schemas/CanonicalHostname"
      target:
        type: string
        pattern: "^$|^https?://"
        description: Empty for saved app or alias public URLs whose publisher supplies its HTTP target locally.
      service_protocol:
        $ref: "../openapi.yaml#/components/schemas/PublicURLServiceProtocol"
      publisher_pool: { type: boolean, default: false }
      public_url_scope:
        $ref: "../openapi.yaml#/components/schemas/PublicURLScope"
      purpose:
        $ref: "../openapi.yaml#/components/schemas/PublicURLPurpose"
      access_mode:
        $ref: "../openapi.yaml#/components/schemas/VisitorAccessMode"
      mutation_revision:
        type: integer
        format: int64
        minimum: 1
      policy_revision:
        type: integer
        format: int64
        minimum: 1
      lifecycle_state:
        $ref: "../openapi.yaml#/components/schemas/PublicURLLifecycleState"
      allowed_ip_prefixes:
        type: array
        uniqueItems: true
        items:
          type: string
          minLength: 1
          maxLength: 64
          pattern: "^\\S+$"
      next_publish_run_number:
        type: integer
        format: int64
        minimum: 1
      ephemeral:
        type: boolean
      expires_at:
        type: string
        format: date-time
      open_publish_run_id:
        $ref: "../openapi.yaml#/components/schemas/PublishRunID"
      created_at:
        type: string
        format: date-time
      updated_at:
        type: string
        format: date-time
  AllocateEphemeralPublicURLRequest:
    type: object
    additionalProperties: false
    required: [invocation_id, target]
    properties:
      invocation_id:
        $ref: "../openapi.yaml#/components/schemas/ResourceID"
      target:
        type: string
        description: Local service address, such as http://app.internal:3000.
      ip:
        type: array
        maxItems: 32
        uniqueItems: true
        items:
          type: string
      access_mode:
        $ref: "../openapi.yaml#/components/schemas/VisitorAccessMode"
      limits:
        $ref: "../openapi.yaml#/components/schemas/PublisherApplicationLimits"
  PublicURLPage:
    type: object
    additionalProperties: false
    required: [public_urls]
    properties:
      public_urls:
        type: array
        items:
          $ref: "../openapi.yaml#/components/schemas/PublicURL"
      next_cursor:
        $ref: "../openapi.yaml#/components/schemas/PublicURLID"
  CreatePublicURLRequest:
    type: object
    additionalProperties: false
    required: [team_id, domain_id, canonical_hostname, target, public_url_scope, purpose]
    properties:
      team_id:
        $ref: "../openapi.yaml#/components/schemas/TeamID"
      domain_id:
        $ref: "../openapi.yaml#/components/schemas/DomainID"
      membership_id:
        $ref: "../openapi.yaml#/components/schemas/MembershipID"
      canonical_hostname:
        $ref: "../openapi.yaml#/components/schemas/CanonicalHostname"
      target:
        type: string
        pattern: "^$|^https?://"
        description: Leave empty for a saved app or alias public URL whose publisher supplies its HTTP target locally. Ephemeral, demo, OAuth, and webhook URLs require a target.
      service_protocol:
        $ref: "../openapi.yaml#/components/schemas/PublicURLServiceProtocol"
      publisher_pool: { type: boolean, default: false }
      public_url_scope:
        $ref: "../openapi.yaml#/components/schemas/PublicURLScope"
      purpose:
        $ref: "../openapi.yaml#/components/schemas/PublicURLPurpose"
      access_mode:
        $ref: "../openapi.yaml#/components/schemas/VisitorAccessMode"
      allowed_ip_prefixes:
        type: array
        uniqueItems: true
        items:
          type: string
          minLength: 1
          maxLength: 64
          pattern: "^\\S+$"
      ephemeral:
        type: boolean
        default: false
  UpdatePublicURLRequest:
    type: object
    additionalProperties: false
    required: [target, allowed_ip_prefixes]
    properties:
      target:
        type: string
        pattern: "^$|^https?://"
        description: empty only when keeping a saved app or alias public URL targetless.
      allowed_ip_prefixes:
        type: array
        uniqueItems: true
        items:
          type: string
          minLength: 1
          maxLength: 64
          pattern: "^\\S+$"
