          $ref: "#/components/schemas/PublisherConnectionID"
        connection_assignment_revision:
          type: integer
          format: int64
          minimum: 1
        relay_service_id:
          $ref: "#/components/schemas/RelayServiceID"
        relay_address:
          type: string
          minLength: 1
          maxLength: 256
        tls_server_name:
          $ref: "#/components/schemas/CanonicalHostname"
        publisher_connection_credential:
          type: string
          minLength: 1
          maxLength: 4096
        publisher_connection_credential_expires_at:
          type: string
          format: date-time
        state:
          $ref: "#/components/schemas/PublisherConnectionState"
    PublishRunSetup:
      type: object
      additionalProperties: false
      required:
        [public_url, publish_run, publish_run_token, certificate_plan, publisher_connections]
