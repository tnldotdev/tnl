      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PrivateServiceRunDeclaration" }
      description: Reserve a new run ID and number and capture its exact managed hostname, port, domain and certificate plan under the authenticated publisher grant. Retrying the same idempotency key returns the same preparation.
