  /v1/private-services/{private_service_id}/ingress-assignment:
    post:
      operationId: createVisitorIngressAssignment
      description: Reserve exactly one unbound ingress assignment for the current person, device, and private service grant. Retain idempotency_key across ambiguous failures; a replay returns the same session and credential only while access, device, assignment, and ingress lease remain valid. Keys bind the identity, device, service, assignment count, and excluded ingress; a changed request conflicts. Results expire with the sessions and keys are retained for another 24 hours. exclude_ingress_id keeps a healthy sibling out of placement without granting access. Release unused or trust-failed reservations before starting a new request.
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/PrivateServiceID" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [device_id, idempotency_key]
              properties:
                device_id: { type: string, pattern: "^vdev_[A-Za-z0-9]{22}$" }
                exclude_ingress_id: { type: string, maxLength: 128 }
                idempotency_key: { $ref: "#/components/schemas/IdempotencyKey" }
      responses:
        "201":
          description: One infrastructure session setup; no run key or stream ticket
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PrivateConnectorSessionSetup" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/private-services/{private_service_id}/ingress-assignments:
    post:
      operationId: createVisitorIngressAssignments
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [device_id, idempotency_key]
              properties:
                device_id: { type: string, pattern: "^vdev_[A-Za-z0-9]{22}$" }
                idempotency_key: { $ref: "#/components/schemas/IdempotencyKey" }
      description: Check current visitor access and atomically reserve two distinct live ingress addresses. Retain idempotency_key across ambiguous failures; replay returns the same IDs and one-use credentials while both unbound assignments, device, access, and leases remain valid. Keys bind the identity, device, service, and assignment count; changed requests conflict. Results expire with the sessions and keys are retained for another 24 hours. The ingress-observed source is bound when each session connects. This does not authorize visitor streams.
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/PrivateServiceID" }]
      responses:
        "201":
          description: Infrastructure session setup; no service run key or stream ticket
          content:
            application/json:
              schema:
                type: array
                minItems: 2
                maxItems: 2
                items: { $ref: "#/components/schemas/PrivateConnectorSessionSetup" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/private-services/{private_service_id}/select-run:
    post:
      operationId: selectPrivateServiceRun
      description: For EACH new visitor stream, recheck the exact service grant and ready run, then issue one short-lived ticket bound to this identity's authenticated ingress session and its observed source. The caller never supplies an IP address.
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/PrivateServiceID" }]
      requestBody:
