          $ref: "#/components/schemas/PublicURL"
        publish_run:
          $ref: "#/components/schemas/PublishRun"
        publish_run_token:
          type: string
          minLength: 1
          maxLength: 4096
        certificate_plan:
          $ref: "#/components/schemas/CertificatePlan"
        publisher_connections:
          type: array
          minItems: 2
          maxItems: 2
          items:
            $ref: "#/components/schemas/ConnectionAssignment"
    PublishRunVersionRequest:
      type: object
      additionalProperties: false
      required: [publish_run_number]
      properties:
        publish_run_number:
          type: integer
          format: int64
          minimum: 1
    PublishRunHeartbeat:
      type: object
      additionalProperties: false
      required: [publish_run, publisher_connections, policy_denials]
      properties:
        publish_run:
          $ref: "#/components/schemas/PublishRun"
        publisher_connections:
          type: array
          minItems: 2
          maxItems: 2
          items:
            $ref: "#/components/schemas/ConnectionAssignment"
        policy_denials:
          description: Total IP policy denials reported so far for this publish run number. The total may lag.
          type: integer
          format: int64
          minimum: 0
    CertificateInstalledRequest:
      type: object
      additionalProperties: false
      required: [publish_run_number, issuance_id, not_after]
