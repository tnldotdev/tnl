      required: [selectors, text_node, offset]
      properties:
        selectors:
          $ref: "#/components/schemas/FeedbackSelectors"
        text_node:
          type: integer
          minimum: 0
          maximum: 65535
        offset:
          type: integer
          minimum: 0
          maximum: 1048576
    FeedbackSelectors:
      type: array
      minItems: 1
      maxItems: 6
      uniqueItems: true
      items:
        type: string
        minLength: 1
        maxLength: 512
    FeedbackAnchor:
      type: object
      additionalProperties: false
      required: [schema_version, selectors, x, y]
      properties:
        schema_version:
          $ref: "#/components/schemas/ReviewSchemaVersion"
        selectors:
          $ref: "#/components/schemas/FeedbackSelectors"
        x:
          type: number
          minimum: 0
          maximum: 1
        y:
          type: number
          minimum: 0
          maximum: 1
        selection:
          type: object
          additionalProperties: false
          required: [start, end, text]
          properties:
            start:
              $ref: "#/components/schemas/FeedbackTextBoundary"
            end:
              $ref: "#/components/schemas/FeedbackTextBoundary"
            text:
              type: string
              minLength: 1
              maxLength: 2000
    FeedbackElement:
      type: object
      additionalProperties: false
      properties:
        role:
          type: string
          maxLength: 128
        label:
          type: string
          maxLength: 256
        test_id:
          type: string
          maxLength: 128
        html:
          type: string
          maxLength: 4096
    FeedbackEvidence:
      type: object
      additionalProperties: false
      required: [schema_version, actions, failed_requests]
      properties:
        schema_version:
          $ref: "#/components/schemas/ReviewSchemaVersion"
        element:
          $ref: "#/components/schemas/FeedbackElement"
        actions:
          type: array
          maxItems: 20
          items:
            type: object
            additionalProperties: false
            required: [type]
            properties:
              type:
                type: string
                enum: [navigation, click, submit]
              path:
                type: string
                maxLength: 2048
              label:
                type: string
                maxLength: 256
              test_id:
                type: string
                maxLength: 128
        failed_requests:
          type: array
          maxItems: 20
          items:
            type: object
            additionalProperties: false
            required: [method, path, status, duration_ms]
            properties:
              method:
                type: string
                minLength: 1
                maxLength: 12
              path:
                type: string
                minLength: 1
                maxLength: 2048
                pattern: "^/"
              status:
                type: integer
                minimum: 0
                maximum: 599
              duration_ms:
                type: integer
                minimum: 0
                maximum: 600000
    SourceFileState:
      type: object
      additionalProperties: false
      required: [path, status]
      properties:
        path:
          type: string
          minLength: 1
          maxLength: 512
          description: Path relative to the selected project directory
        status:
          type: string
          enum: [added, modified, deleted]
          description: Working-tree change from HEAD; staging does not affect this value
        blob_id:
          type: string
          pattern: "^(?:[0-9a-f]{40}|[0-9a-f]{64})$"
          description: Git blob ID from git hash-object --no-filters; absent for deleted or unreadable files
        mode:
          type: string
          pattern: "^100(?:644|755)$"
          description: Git file mode; absent for deleted or unsupported files
    SourceState:
      type: object
      additionalProperties: false
      required: [schema_version, head_commit, project_path, branch, changed_files, complete]
      description: >-
        Bounded Git identifiers for the source present in one project directory.
        Compare HEAD, project_path, and changed_files only when both records are
        complete. Branch names and index state do not affect matching. Source
        bytes and absolute paths are not stored. Ignored files are outside this
        comparison; an unsupported or truncated capture is incomplete.
      properties:
        schema_version:
          $ref: "#/components/schemas/ReviewSchemaVersion"
        head_commit:
          type: string
          pattern: "^(?:[0-9a-f]{40}|[0-9a-f]{64})?$"
          description: Full Git HEAD commit ID; empty when unavailable
        project_path:
          type: string
          maxLength: 512
          description: Selected project's path relative to the repository root; empty at the root
        branch:
          type: string
          maxLength: 128
          description: Informational branch name; empty for detached HEAD or when unavailable
        changed_files:
          type: array
          maxItems: 64
          description: Unique project-relative paths sorted lexically; renames are a deletion and an addition
          items:
            $ref: "#/components/schemas/SourceFileState"
        complete:
          type: boolean
          description: All supported Git-visible project changes were captured within the bounds
    FeedbackThread:
