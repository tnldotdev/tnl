openapi: 3.1.0
info:
  title: tnl control API
  version: 1.0.0
  license:
    name: BSD-3-Clause
    identifier: BSD-3-Clause
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
servers:
  - url: https://control.example.com
paths:
  /v1/browser/managed-login:
    get:
      operationId: beginManagedBrowserLogin
      security: []
      description: Start sign-in for one managed HTTP service. Uses the common browser callback and a snapshot of ready runs; the allocated service port is retained.
      parameters:
        - {
            name: private_service_id,
            in: query,
            required: true,
            schema: { $ref: "#/components/schemas/PrivateServiceID" },
          }
        - {
            name: return_path,
            in: query,
            required: true,
            schema: { type: string, maxLength: 2048 },
          }
        - { name: switch_account, in: query, schema: { type: boolean } }
      responses:
        "302": { description: Redirect to the configured identity provider }
        default: { $ref: "#/components/responses/Problem" }
  /v1/private-services/{private_service_id}/http-grants:
    post:
      operationId: createManagedHTTPGrant
      security: [{ bearerAuth: [] }]
      description: Create a service-scoped HTTP token or share. Requires current service management permission. The secret is returned once and grants no management or feedback permission.
      parameters: [{ $ref: "#/components/parameters/PrivateServiceID" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateManagedHTTPGrantRequest" }
      responses:
        "201":
          description: Exact managed subject and one-time secret
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ManagedHTTPGrant" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/private-services/{private_service_id}/http-grants/{grant_id}:
    delete:
      operationId: revokeManagedHTTPGrant
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: "#/components/parameters/PrivateServiceID" }
        - { name: grant_id, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: Grant revoked }
        default: { $ref: "#/components/responses/Problem" }
  /v1/private-services/{private_service_id}/runs/{private_run_id}/http-authorize:
    post:
      operationId: authorizeManagedHTTPVisitor
      security: [{ bearerAuth: [] }]
      description: Check the selected HTTP credential and exact trusted ingress admission. An allowed decision cannot forward target bytes until admitted is true. Certificate authentication is optional and never grants feedback or management.
      parameters:
        - { $ref: "#/components/parameters/PrivateServiceID" }
        - {
            name: private_run_id,
            in: path,
            required: true,
            schema: { $ref: "#/components/schemas/PrivateRunID" },
          }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ManagedHTTPVisitorRequest" }
      responses:
        "200":
          description: Current request and ingress promotion decision
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ServiceClientCertificateDecision" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/private-services/{private_service_id}/runs/{private_run_id}/browser/handoff:
    post:
      operationId: redeemManagedBrowserHandoff
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: "#/components/parameters/PrivateServiceID" }
        - {
            name: private_run_id,
            in: path,
            required: true,
            schema: { $ref: "#/components/schemas/PrivateRunID" },
          }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ManagedBrowserRequest" }
      responses:
        "200":
          description: Host-bound browser credential for the exact managed subject
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BrowserHandoffResponse" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/private-services/{private_service_id}/runs/{private_run_id}/browser/session:
    post:
      operationId: checkManagedBrowserSession
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: "#/components/parameters/PrivateServiceID" }
        - {
            name: private_run_id,
            in: path,
            required: true,
            schema: { $ref: "#/components/schemas/PrivateRunID" },
          }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ManagedBrowserRequest" }
      responses:
        "200":
          description: Current browser identity and visit permission, not management permission
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BrowserAccessResponse" }
        default: { $ref: "#/components/responses/Problem" }
    delete:
      operationId: revokeManagedBrowserSession
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: "#/components/parameters/PrivateServiceID" }
        - {
            name: private_run_id,
            in: path,
            required: true,
            schema: { $ref: "#/components/schemas/PrivateRunID" },
          }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ManagedBrowserRequest" }
      responses:
        "204": { description: Host-bound browser session revoked }
        default: { $ref: "#/components/responses/Problem" }
  /v1/projects/{project_key}/private-services/{service}:
    get:
      operationId: getProjectPrivateService
      security: [{ bearerAuth: [] }]
      description: Resolve an applied service by its exact Git source and configuration key using current visitor access. Does not return targets or require project-manager permission.
      parameters:
        - { name: project_key, in: path, required: true, schema: { type: string } }
        - {
            name: service,
            in: path,
            required: true,
            schema: { $ref: "#/components/schemas/PrivateServiceName" },
          }
        - {
            name: team_id,
            in: query,
            required: true,
            schema: { $ref: "#/components/schemas/TeamID" },
          }
        - {
            name: source_fingerprint,
            in: query,
            required: true,
            schema: { type: string, pattern: "^[0-9a-f]{64}$" },
          }
      responses:
        "200":
          description: Exact saved service from the applied configuration, including offline services
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PrivateService" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/private-services/{private_service_id}/runs/{private_run_id}/start:
    post:
      operationId: startManagedServiceRun
      security: [{ bearerAuth: [] }]
      description: Start one exact prepared run using its authenticated publisher identity. Visitor TLS uses the approved service certificate, without an ephemeral stream key or custom TLS proof.
      parameters:
        - { $ref: "#/components/parameters/PrivateServiceID" }
        - {
            name: private_run_id,
            in: path,
            required: true,
            schema: { $ref: "#/components/schemas/PrivateRunID" },
          }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [run_number]
              properties:
                run_number: { type: integer, format: int64, minimum: 1 }
      responses:
        "200":
          description: Run token and two independent relay assignments
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PrivateServiceRunSetup" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/private-services/{private_service_id}/client-certificates:
    post:
      operationId: issueServiceClientCertificate
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/PrivateServiceID" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/IssueServiceClientCertificateRequest" }
      responses:
        "201":
          description: Exact service/identity/device client certificate; the client key never leaves the client
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ServiceClientCertificate" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/private-services/{private_service_id}/runs/{private_run_id}/authorize-connector:
    post:
      operationId: authorizeServiceConnector
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: "#/components/parameters/PrivateServiceID" }
        - {
            name: private_run_id,
            in: path,
            required: true,
            schema: { $ref: "#/components/schemas/PrivateRunID" },
          }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AuthorizeServiceConnectorRequest" }
      responses:
        "200":
          description: Live permission for the exact authenticated connector admission
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ServiceClientCertificateDecision" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/private-services/{private_service_id}/runs/{private_run_id}/authorize-client-certificate:
    post:
      operationId: authorizeServiceClientCertificate
      description: Authenticate a direct ingress visitor after TLS key possession. Connector admissions use their authenticated session instead. Permission alone does not authorize target bytes until ingress acknowledges ordinary capacity.
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: "#/components/parameters/PrivateServiceID" }
        - {
            name: private_run_id,
            in: path,
            required: true,
            schema: { $ref: "#/components/schemas/PrivateRunID" },
          }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AuthorizeServiceClientCertificateRequest" }
      responses:
        "200":
          description: Live permission for an exact admitted connection after TLS proved client key possession
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ServiceClientCertificateDecision" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/private-services/{private_service_id}/runs/{private_run_id}/certificate-issuances:
    parameters:
      - { $ref: "#/components/parameters/PrivateServiceID" }
      - {
          name: private_run_id,
          in: path,
          required: true,
          schema: { $ref: "#/components/schemas/PrivateRunID" },
        }
    post:
      operationId: createPrivateCertificateIssuance
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreatePrivateCertificateIssuanceRequest" }
      responses:
        "201":
          description: DNS-01 issuance authorized for the exact private run and approved scope
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PrivateCertificateIssuance" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/private-services/{private_service_id}/runs/{private_run_id}/certificate-issuances/{issuance_id}:
    get:
      operationId: getPrivateCertificateIssuance
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: "#/components/parameters/PrivateServiceID" }
        - {
            name: private_run_id,
            in: path,
            required: true,
            schema: { $ref: "#/components/schemas/PrivateRunID" },
          }
        - {
            name: issuance_id,
            in: path,
            required: true,
            schema: { $ref: "#/components/schemas/IssuanceID" },
          }
      responses:
        "200":
          description: Current private-run certificate issuance
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PrivateCertificateIssuance" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/private-services/{private_service_id}/runs/{private_run_id}/certificate-installed:
    post:
      operationId: markPrivateCertificateInstalled
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: "#/components/parameters/PrivateServiceID" }
        - {
            name: private_run_id,
            in: path,
            required: true,
            schema: { $ref: "#/components/schemas/PrivateRunID" },
          }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PrivateCertificateInstalledRequest" }
      responses:
        "204": { description: Current run acknowledged the exact publisher-owned certificate }
        default: { $ref: "#/components/responses/Problem" }
  /v1/projects/{project_key}/publisher-groups/{group_name}/namespace/rename:
    post:
      operationId: renamePublisherNamespace
      security: [{ bearerAuth: [] }]
      description: Change the group's DNS namespace label beneath its existing project and domain. Preserves group, service, replica and visitor-grant IDs and ports. Closes old managed service runs, revokes their publication authority and assigns new grants and certificate plans. Retires old DNS and certificate scope until actual certificate expiry, outstanding issuance, DNS cleanup and quarantine permit reuse. Does not change the configuration selector or separately configured public URLs. The same idempotency key and exact request return the original response; changed input with that key conflicts. The expected revision fences concurrent configuration and namespace mutations.
      parameters:
        - { name: project_key, in: path, required: true, schema: { type: string } }
        - { name: group_name, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RenamePublisherNamespaceRequest" }
      responses:
        "200":
          description: Applied descriptors with the new managed service hostnames
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AppliedProjectConfiguration" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/projects/{project_key}/publisher-groups/{group_name}/rename:
    post:
      operationId: renamePublisherGroup
      security: [{ bearerAuth: [] }]
      description: Rename the configuration key while preserving the group ID, namespace, service IDs, ports, enrolled identities and grants. Update Git configuration references before the next apply. Retrying the completed rename is idempotent.
      parameters:
        - { name: project_key, in: path, required: true, schema: { type: string } }
        - { name: group_name, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RenamePublisherGroupRequest" }
      responses:
        "200":
          description: Renamed desired configuration and unchanged endpoint identities
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AppliedProjectConfiguration" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/visitor-ingress-assignments/{connector_session_id}:
    delete:
      operationId: releaseVisitorIngressAssignment
      security: [{ bearerAuth: [] }]
      description: Release this person's exact device assignment. Pending reservations immediately free capacity. A bound assignment is revoked and its active streams fail rechecks; sibling sessions are never affected. Retrying release of an owned assignment succeeds.
      parameters:
        - {
            name: connector_session_id,
            in: path,
            required: true,
            schema: { $ref: "#/components/schemas/PrivateConnectorSessionID" },
          }
      responses:
        "204": { description: Exact assignment released }
        default: { $ref: "#/components/responses/Problem" }
  /v1/projects/{project_key}/public-metadata:
    get:
      operationId: getProjectPublicMetadata
      security: [{ bearerAuth: [] }]
      description: Browser-safe project source and public service IDs/hostnames, including exact local worktree realizations before or after first apply. Returns only public services the caller may visit, or all public services for a project manager. A service key may appear more than once for separate worktree URLs. Never returns configuration, targets, trust, grants, or publisher data.
      parameters:
        - { name: project_key, in: path, required: true, schema: { type: string } }
        - { $ref: "#/components/parameters/TeamIDQuery" }
      responses:
        "200":
          description: Authorized public service metadata
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProjectPublicMetadata" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/projects/{project_key}/local-services/{service}:
    get:
      operationId: getLocalProjectService
      security: [{ bearerAuth: [] }]
      description: Read the exact private service previously realized for this team, project source, service key, and worktree. Requires current ordinary private visitor access, not project management access. Returns only immutable identity and approved visitor protocol/TLS metadata, never configuration, targets, or credentials. Does not realize or adopt a service. Missing or unauthorized bindings return not found; an authorized binding with another source fingerprint returns conflict. No other team, project, worktree, or saved name is searched.
      parameters:
        - {
            name: project_key,
            in: path,
            required: true,
            schema: { type: string, pattern: "^[a-z][a-z0-9-]{0,62}$" },
          }
        - {
            name: service,
            in: path,
            required: true,
            schema: { type: string, pattern: "^[a-z]([a-z0-9-]{0,30}[a-z0-9])?$" },
          }
        - { $ref: "#/components/parameters/TeamIDQuery" }
        - {
            name: source_fingerprint,
            in: query,
            required: true,
            schema: { type: string, pattern: "^[0-9a-f]{64}$" },
          }
        - {
            name: worktree_key,
            in: query,
            required: true,
            schema: { type: string, minLength: 1, maxLength: 128 },
          }
      responses:
        "200":
          description: Exact authorized local private service and approved visitor metadata
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LocalProjectService" }
        default: { $ref: "#/components/responses/Problem" }
    put:
      operationId: realizeLocalProjectService
      security: [{ bearerAuth: [] }]
      description: Realize only one source-bound local service for one worktree. Private IDs are allocated here with worktree-scoped names, never adopted by name. Public IDs must be exact caller-owned app URLs already allocated by this runtime, bound to the caller's membership or to the caller's own personal team when current namespace authorization selects shared scope. Organization shared URLs and another member's or team's URLs are rejected. Records provenance before first apply; later apply reconciles that legitimate resource. When configuration has been applied the local declaration must match it. Does not apply remote group changes.
      parameters:
        - { name: project_key, in: path, required: true, schema: { type: string } }
        - { name: service, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RealizeLocalProjectServiceRequest" }
      responses:
        "200":
          description: Exact local resource and approved private metadata
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LocalProjectService" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/projects/{project_key}/publisher-groups/{group_name}/members/{publisher_identity_id}:
    delete:
      operationId: revokePublisherGroupMember
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: project_key, in: path, required: true, schema: { type: string } }
        - { name: group_name, in: path, required: true, schema: { type: string } }
        - { name: publisher_identity_id, in: path, required: true, schema: { type: string } }
        - { $ref: "#/components/parameters/TeamIDQuery" }
      responses:
        "204":
          { description: Exact group member identity revoked and its public/private runs closed }
        default: { $ref: "#/components/responses/Problem" }
  /v1/projects/{project_key}/configuration:
    parameters:
      - {
          name: project_key,
          in: path,
          required: true,
          schema: { type: string, pattern: "^[a-z][a-z0-9-]{0,62}$" },
        }
    put:
      operationId: applyProjectConfiguration
      security: [{ bearerAuth: [] }]
      description: Atomically reconcile normalized declarations. The source fingerprint is stable across clones and worktrees. Identical content is idempotent; different content requires the current revision. Targets are encrypted and only returned to project managers and scoped publishers.
      requestBody:
        {
          required: true,
          content:
            {
              application/json:
                { schema: { $ref: "#/components/schemas/ApplyProjectConfigurationRequest" } },
            },
        }
      responses:
        "200":
          {
            description: Applied desired state and observed publisher revisions,
            content:
              {
                application/json:
                  { schema: { $ref: "#/components/schemas/AppliedProjectConfiguration" } },
              },
          }
        default: { $ref: "#/components/responses/Problem" }
    get:
      operationId: getProjectConfiguration
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/TeamIDQuery" }]
      responses:
        "200":
          {
            description: Manager-only normalized configuration and status,
            content:
              {
                application/json:
                  { schema: { $ref: "#/components/schemas/AppliedProjectConfiguration" } },
              },
          }
        default: { $ref: "#/components/responses/Problem" }
  /v1/projects/{project_key}/publisher-groups/{group_name}/enrollments:
    post:
      operationId: createPublisherGroupEnrollment
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: project_key, in: path, required: true, schema: { type: string } }
        - { name: group_name, in: path, required: true, schema: { type: string } }
      requestBody:
        {
          required: true,
          content:
            {
              application/json:
                { schema: { $ref: "#/components/schemas/CreatePublisherGroupEnrollmentRequest" } },
            },
        }
      responses:
        "201":
          {
            description: Bounded project/group bootstrap credential,
            content:
              {
                application/json:
                  { schema: { $ref: "#/components/schemas/PublisherGroupEnrollment" } },
              },
          }
        default: { $ref: "#/components/responses/Problem" }
  /v1/publisher-groups/enroll:
    post:
      operationId: redeemPublisherGroupEnrollment
      security: []
      description: Each replica submits its own Ed25519 public key. Retrying the same key is idempotent and consumes no additional enrollment capacity.
      requestBody:
        {
          required: true,
          content:
            {
              application/json:
                { schema: { $ref: "#/components/schemas/RedeemPublisherGroupEnrollmentRequest" } },
            },
        }
      responses:
        "200":
          {
            description: One signed publisher identity scoped to one group,
            content:
              {
                application/json: { schema: { $ref: "#/components/schemas/PublisherGroupMember" } },
              },
          }
        default: { $ref: "#/components/responses/Problem" }
  /v1/publisher-groups/verify:
    post:
      operationId: verifyPublisherGroupIdentity
      security: []
      description: Prove the replica's signing key and read its immutable membership and current/historical selectors without replacing a running publisher's group lease. The one-use assertion audience is the control URL followed by this path.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PublisherGroupLeaseRequest" }
      responses:
        "200":
          description: Verified membership without a lease or service targets
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PublisherGroupVerification" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/publisher-runtime:
    post:
      operationId: observePublisherRuntime
      security: []
      description: >-
        Explicit remote runtime lifecycle, independent of enrollment, verification,
        and identity kind. A one-use Ed25519 assertion binds scope_id, action,
        process_run_id and expected_epoch through the runtime proof scope, with
        this path as its audience. Inspect reads the current epoch without recording
        an address. Start compares that epoch and installs a new process run;
        retries retain that run and epoch. Renew and stop require the current run
        and epoch. Control records only the validated request source, never a body
        address. Group start/renew also issue the existing group lease atomically.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PublisherRuntimeRequest" }
      responses:
        "200":
          description: Current runtime epoch and optional group lease
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PublisherRuntimeResponse" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/publisher-groups/lease:
    post:
      operationId: acquirePublisherGroupLease
      security: []
      description: Exchange a one-use signed assertion for a short-lived group lease. The assertion audience is the control URL followed by this path; its grant claim is the group ID.
      requestBody:
        {
          required: true,
          content:
            {
              application/json:
                { schema: { $ref: "#/components/schemas/PublisherGroupLeaseRequest" } },
            },
        }
      responses:
        "200":
          {
            description: Current group lease,
            content:
              {
                application/json: { schema: { $ref: "#/components/schemas/PublisherGroupLease" } },
              },
          }
        default: { $ref: "#/components/responses/Problem" }
  /v1/publisher-groups/assignments:
    get:
      operationId: getPublisherGroupAssignments
      security: [{ publisherAuth: [] }]
      responses:
        "200":
          {
            description: Exact assigned services and native publisher grants for this replica,
            content:
              {
                application/json:
                  { schema: { $ref: "#/components/schemas/PublisherGroupAssignments" } },
              },
          }
        default: { $ref: "#/components/responses/Problem" }
  /v1/publisher-groups/ack:
    post:
      operationId: acknowledgePublisherGroupConfiguration
      security: [{ publisherAuth: [] }]
      requestBody:
        {
          required: true,
          content:
            {
              application/json:
                { schema: { $ref: "#/components/schemas/PublisherGroupAcknowledgement" } },
            },
        }
      responses:
        "204": { description: Exact current configuration revision acknowledged }
        default: { $ref: "#/components/responses/Problem" }
  /v1/teams/{team_id}/service-audit:
    get:
      operationId: listServiceAudit
      security: [{ bearerAuth: [] }]
      parameters:
