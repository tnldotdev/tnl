    UpdatePublicURLRequest:
      type: object
      additionalProperties: false
      required: [target, allowed_ip_prefixes]
      properties:
        target:
          type: string
          pattern: "^$|^https?://"
          description: empty only when keeping a saved app public URL targetless.
        allowed_ip_prefixes:
          type: array
          uniqueItems: true
          items:
            type: string
            minLength: 1
            maxLength: 64
            pattern: "^\\S+$"
    CertificateChallengeMethod:
      type: string
      enum: [dns-01, tls-alpn-01]
    CertificatePlan:
      type: object
      additionalProperties: false
      required: [cache_key, scope, identifiers, challenge_method]
      properties:
        cache_key:
          type: string
          minLength: 1
          maxLength: 256
        scope:
          type: string
          minLength: 1
          maxLength: 256
        identifiers:
          type: array
          minItems: 1
          maxItems: 2
          uniqueItems: true
          items:
            type: string
            minLength: 1
            maxLength: 253
            pattern: "^(?:\\*\\.)?[a-z0-9](?:[a-z0-9.-]*[a-z0-9])?$"
        challenge_method:
          $ref: "#/components/schemas/CertificateChallengeMethod"
    CreatePublishRunRequest:
      type: object
      additionalProperties: false
      properties:
        traffic:
          $ref: "#/components/schemas/TrafficSelection"
    TrafficSelection:
      type: object
      additionalProperties: false
      description: Explicit encrypted visitor traffic limits, resolved once against operator defaults and ceilings when the publish run is created. Omitted values use operator defaults. Zero totals mean unlimited.
      properties:
        connections:
          type: integer
          minimum: 1
          maximum: 1048576
        rate:
          type: integer
          minimum: 1
          maximum: 2147483648
        rate_per:
          type: string
          minLength: 1
          maxLength: 32
          description: Go duration between 1ms and 24h, such as 1s or 500ms.
        burst:
          type: integer
          minimum: 1
          maximum: 2147483648
        upload_bytes:
          type: integer
          format: int64
          minimum: 65536
          maximum: 1099511627776
          description: Encrypted upload bytes per second.
        download_bytes:
          type: integer
          format: int64
          minimum: 65536
          maximum: 1099511627776
          description: Encrypted download bytes per second.
        total_connections:
          type: integer
          format: int64
          minimum: 0
        total_upload_bytes:
          type: integer
          format: int64
          minimum: 0
        total_download_bytes:
          type: integer
          format: int64
          minimum: 0
    TrafficLimits:
      type: object
      additionalProperties: false
      description: Resolved limits for one exact public URL and publish run, enforced independently on each ingress process. Omitted totals are unlimited.
      required: [connections, rate, rate_per_ns, burst, upload_bytes, download_bytes]
      properties:
        connections:
          type: integer
          minimum: 1
          maximum: 1048576
        rate:
          type: integer
          minimum: 1
          maximum: 2147483648
        rate_per_ns:
          type: integer
          format: int64
          minimum: 1000000
          maximum: 86400000000000
        burst:
          type: integer
          minimum: 1
          maximum: 2147483648
        upload_bytes:
          type: integer
          format: int64
          minimum: 65536
          maximum: 1099511627776
        download_bytes:
          type: integer
          format: int64
          minimum: 65536
          maximum: 1099511627776
        total_connections:
          type: integer
          format: int64
          minimum: 1
        total_upload_bytes:
          type: integer
          format: int64
          minimum: 1
        total_download_bytes:
          type: integer
          format: int64
          minimum: 1
    PublishRunState:
      type: string
      enum: [starting, ready, draining, closed, expired, canceled]
    PublishRun:
      type: object
      additionalProperties: false
      required:
        [
          id,
          public_url_id,
          team_id,
          publish_run_number,
          policy_revision,
          state,
          created_at,
          expires_at,
        ]
      properties:
        id:
          $ref: "#/components/schemas/PublishRunID"
        public_url_id:
          $ref: "#/components/schemas/PublicURLID"
        team_id:
          $ref: "#/components/schemas/TeamID"
        membership_id:
          $ref: "#/components/schemas/MembershipID"
        publish_run_number:
          type: integer
          format: int64
          minimum: 1
        policy_revision:
          type: integer
          format: int64
          minimum: 1
        state:
          $ref: "#/components/schemas/PublishRunState"
        ready_publisher_connections:
          type: integer
          minimum: 0
          maximum: 2
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
        ready_at:
          type: string
          format: date-time
        closed_at:
          type: string
          format: date-time
    PublisherConnectionState:
      type: string
      enum: [assigned, connected, ready, replacing]
    ConnectionAssignment:
      type: object
      additionalProperties: false
      required:
        [
          connection_slot,
          publisher_connection_id,
          connection_assignment_revision,
          relay_service_id,
          relay_address,
          tls_server_name,
          publisher_connection_credential,
          publisher_connection_credential_expires_at,
          state,
        ]
      properties:
        connection_slot:
          type: integer
          minimum: 0
          maximum: 1
        publisher_connection_id:
          $ref: "#/components/schemas/PublisherConnectionID"
        connection_assignment_revision:
          type: integer
          format: int64
          minimum: 1
        relay_service_id:
          $ref: "#/components/schemas/RelayServiceID"
        relay_address:
          type: string
          minLength: 1
          maxLength: 256
        tls_server_name:
          $ref: "#/components/schemas/CanonicalHostname"
        publisher_connection_credential:
          type: string
          minLength: 1
          maxLength: 4096
        publisher_connection_credential_expires_at:
          type: string
          format: date-time
        state:
          $ref: "#/components/schemas/PublisherConnectionState"
    PublishRunSetup:
      type: object
      additionalProperties: false
      allOf:
        - if:
            properties:
              public_url:
                properties:
                  service_protocol: { const: ssh }
                required: [service_protocol]
            required: [public_url]
          then:
            not: { required: [certificate_plan] }
          else:
            required: [certificate_plan]
      required: [public_url, publish_run, publish_run_token, publisher_connections]
      properties:
        traffic:
          $ref: "#/components/schemas/TrafficLimits"
        public_url:
          $ref: "#/components/schemas/PublicURL"
        publish_run:
          $ref: "#/components/schemas/PublishRun"
        publish_run_token:
          type: string
          minLength: 1
          maxLength: 4096
        certificate_plan:
          $ref: "#/components/schemas/CertificatePlan"
          description: Required for HTTP; absent for SSH, which has no visitor TLS certificate or ACME order.
        publisher_connections:
          type: array
          minItems: 2
          maxItems: 2
          items:
            $ref: "#/components/schemas/ConnectionAssignment"
    PublishRunVersionRequest:
      type: object
      additionalProperties: false
      required: [publish_run_number]
      properties:
        publish_run_number:
          type: integer
          format: int64
          minimum: 1
    EnableShareAccessRequest:
