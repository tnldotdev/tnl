openapi: 3.1.0
info:
  title: tnl control API
  version: 1.0.0
  license:
    name: MIT
    identifier: MIT
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
servers:
  - url: https://control.example.com
paths:
  /v1/publish-runs/{publish_run_id}/visitor-access:
    post:
      operationId: authorizeHTTPVisitor
      security: [{ publishRunAuth: [] }]
      parameters:
        - { $ref: "#/components/parameters/PublishRunID" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/HTTPVisitorRequest" }
      responses:
        "200":
          description: Transaction-owned current HTTP permission and separate browser identity
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HTTPVisitorResponse" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/visitor/public-urls:
    get:
      operationId: listAvailablePublicURLs
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: team_id, in: query, schema: { type: string } }
        - { name: cursor, in: query, schema: { type: string } }
      responses:
        "200":
          description: Identity-wide visitor inventory without targets, policies or secrets
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AvailablePublicURLPage" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/public-urls/{public_url_id}/visitor-grants:
    parameters:
      - { $ref: "#/components/parameters/PublicURLID" }
    get:
      operationId: listVisitorGrants
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Grants for an owned public URL
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/VisitorGrant" } }
        default: { $ref: "#/components/responses/Problem" }
    post:
      operationId: createTeamVisitorGrant
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateTeamVisitorGrantRequest" }
      responses:
        "201":
          description: Exact URL grant for current team members
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VisitorGrant" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/public-urls/{public_url_id}/visitor-identity-grants:
    post:
      operationId: createIdentityVisitorGrant
      summary: Create an explicit identity grant, including for the current identity
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: "#/components/parameters/PublicURLID" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateIdentityVisitorGrantRequest" }
      responses:
        "201":
          description: Exact URL and identity grant
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VisitorGrant" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/public-urls/{public_url_id}/visitor-grants/{grant_id}:
    delete:
      operationId: revokeVisitorGrant
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: "#/components/parameters/PublicURLID" }
        - { name: grant_id, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: Grant revoked }
        default: { $ref: "#/components/responses/Problem" }
  /v1/public-urls/{public_url_id}/visitor-invitations:
    parameters:
      - { $ref: "#/components/parameters/PublicURLID" }
    get:
      operationId: listVisitorInvitations
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Named visitor invitations
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/VisitorInvitation" } }
        default: { $ref: "#/components/responses/Problem" }
    post:
      operationId: createVisitorInvitation
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateVisitorInvitationRequest" }
      responses:
        "201":
          description: One-use verified-email invitation without team membership
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VisitorInvitation" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/public-urls/{public_url_id}/visitor-invitations/{invitation_id}:
    delete:
      operationId: revokeVisitorInvitation
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: "#/components/parameters/PublicURLID" }
        - { name: invitation_id, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: Invitation and accepted grant revoked }
        default: { $ref: "#/components/responses/Problem" }
  /v1/visitor-invitations/accept:
    post:
      operationId: acceptVisitorInvitation
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [secret]
              properties:
                secret: { type: string, maxLength: 128 }
      responses:
        "200":
          description: Exact identity grant
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VisitorGrant" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/public-urls/{public_url_id}/access:
    parameters:
      - { $ref: "#/components/parameters/PublicURLID" }
    put:
      operationId: replaceVisitorAccess
      summary: Replace the complete live visitor access policy
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReplaceVisitorAccessRequest" }
      responses:
        "200":
          description: Saved policy for this public URL, active for new visitor work
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PublicURL" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/public-urls/{public_url_id}/visitor-certificate:
    post:
      operationId: issueVisitorCertificate
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: "#/components/parameters/PublicURLID" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [csr]
              properties:
                csr: { type: string, maxLength: 16384 }
      responses:
        "201":
          description: URL-bound client certificate bounded by seven days and grant expiry
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VisitorCertificate" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/publish-runs/{publish_run_id}/visitor-certificate:
    post:
      operationId: authorizeVisitorCertificate
      security: [{ publishRunAuth: [] }]
      parameters:
        - { $ref: "#/components/parameters/PublishRunID" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [publish_run_number, source_ip]
              properties:
                publish_run_number: { type: integer, format: int64, minimum: 1 }
                certificate: { type: string, maxLength: 16384 }
                source_ip: { type: string, maxLength: 64 }
                ssh_user:
                  $ref: "#/components/schemas/SSHUser"
                  description: For SSH only. Omit for a connection-level check of any explicit SSH grant; supply to check this exact account.
      responses:
        "200":
          description: Current permission for this new connection. SSH always requires a URL-bound identity certificate and an explicit SSH grant, in addition to the IP filter. SSH returns identity_id, and ssh_user when an account was checked.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [public_url_id, valid_until]
                properties:
                  identity_id: { $ref: "#/components/schemas/IdentityID" }
                  public_url_id: { $ref: "#/components/schemas/PublicURLID" }
                  ssh_user: { $ref: "#/components/schemas/SSHUser" }
                  valid_until: { type: string, format: date-time }
        default: { $ref: "#/components/responses/Problem" }
  /v1/guest-demo/publisher:
    post:
      operationId: enrollGuestPublisher
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EnrollGuestPublisherRequest" }
      responses:
        "200":
          description: Trial-bound publisher for the assigned demo URL
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GuestPublisherIdentity" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/browser/login:
    get:
      operationId: beginPreviewBrowserLogin
      summary: Start sign-in for a preview visitor
      security: []
      parameters:
        - name: preview_id
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/PreviewID"
        - name: public_url_id
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/PublicURLID"
        - name: return_path
          in: query
          required: true
          schema:
            type: string
            pattern: "^/"
            maxLength: 2048
        - { name: switch_account, in: query, schema: { type: boolean } }
      responses:
        "302":
          description: Redirect to the configured identity provider
        default:
          $ref: "#/components/responses/Problem"
  /v1/browser/callback:
    get:
      operationId: completePreviewBrowserLogin
      summary: Return a signed-in visitor to the preview
      security: []
      parameters:
        - name: state
          in: query
          required: true
          schema:
            type: string
        - name: code
          in: query
          required: true
          schema:
            type: string
      responses:
        "303":
          description: Redirect to a one-time handoff on the public URL
        default:
          $ref: "#/components/responses/Problem"
  /v1/publish-runs/{publish_run_id}/browser/handoff:
    post:
      operationId: redeemPreviewBrowserHandoff
      summary: Redeem a one-time browser handoff on the publisher
      security:
        - publishRunBearer: []
      parameters:
        - $ref: "#/components/parameters/PublishRunID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BrowserHandoffRequest"
      responses:
        "200":
          description: Browser cookie and safe return path
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrowserHandoffResponse"
        default:
          $ref: "#/components/responses/Problem"
  /v1/publish-runs/{publish_run_id}/browser/access:
    post:
      operationId: checkPreviewBrowserAccess
      summary: Check a browser cookie against current preview access
      security:
        - publishRunBearer: []
      parameters:
        - $ref: "#/components/parameters/PublishRunID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BrowserAccessRequest"
      responses:
        "200":
          description: Browser identity and current team access
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrowserAccessResponse"
        default:
          $ref: "#/components/responses/Problem"
  /v1/publish-runs/{publish_run_id}/browser/logout:
    post:
      operationId: revokePreviewBrowserAccess
      summary: Revoke the current browser session
      security:
        - publishRunBearer: []
      parameters:
        - $ref: "#/components/parameters/PublishRunID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BrowserAccessRequest"
      responses:
        "204":
          description: Browser session revoked
        default:
          $ref: "#/components/responses/Problem"
  /v1/publish-runs/{publish_run_id}/preview:
    post:
      operationId: createPublishRunPreview
      summary: Create feedback context for one ephemeral demo publish run
      security:
        - publishRunBearer: []
      parameters:
        - $ref: "#/components/parameters/PublishRunID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PublishRunVersionRequest"
      responses:
        "200":
          description: Run-scoped preview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Preview"
        default:
          $ref: "#/components/responses/Problem"
  /v1/health:
    get:
      operationId: getHealth
      summary: Confirm that the control HTTP server is serving
      security: []
      responses:
        "200":
          description: Control HTTP server is serving
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        default:
          $ref: "#/components/responses/Problem"
  /v1/ready:
    get:
      operationId: getReadiness
      summary: Confirm that the tnld role is ready to serve
      security: []
      responses:
        "200":
          description: The tnld role is ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessResponse"
        "503":
          description: The tnld role is not ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessResponse"
        default:
          $ref: "#/components/responses/Problem"
  /v1/client-ip:
    get:
      operationId: getClientIP
      summary: Return the requesting client's public IP address
      security: []
      responses:
        "200":
          description: Client IP address
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientIPResponse"
        default:
          $ref: "#/components/responses/Problem"
  /v1/discovery:
    get:
      operationId: getControlDiscovery
      summary: Describe control and its authentication methods
      security: []
      responses:
        "200":
          description: Control discovery
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ControlDiscovery"
        default:
          $ref: "#/components/responses/Problem"
  /v1/webhook-providers/{provider}/source:
    get:
      operationId: getWebhookProviderSource
      summary: Read one webhook provider source policy
      security: []
      parameters:
        - name: provider
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/WebhookProvider"
      responses:
        "200":
          description: Webhook provider source policy
          headers:
            ETag:
              schema:
                type: string
            Cache-Control:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookProviderSourceResponse"
        "304":
          description: Source policy matches If-None-Match
        default:
          $ref: "#/components/responses/Problem"
  /v1/guest-demo:
    post:
      operationId: createGuestDemo
      summary: Create a restricted guest credential for the built-in demo
      security: []
      responses:
        "201":
          description: Guest credential and managed namespace
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GuestDemoSession"
        default:
          $ref: "#/components/responses/Problem"
  /v1/guest-demo/number:
    post:
      operationId: allocateGuestDemoNumber
      summary: Allocate a new hostname number for this guest trial
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Next demo number
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GuestDemoNumber"
        default:
          $ref: "#/components/responses/Problem"
  /v1/previews:
    post:
      operationId: createPreview
      summary: Create or reuse a preview for one team
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePreviewRequest"
      responses:
        "201":
          description: Preview identity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Preview"
        default:
          $ref: "#/components/responses/Problem"
  /v1/previews/{preview_id}:
    get:
      operationId: getPreview
      summary: Read a preview and its public URLs
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/PreviewID"
      responses:
        "200":
          description: Preview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Preview"
        default:
          $ref: "#/components/responses/Problem"
  /v1/previews/{preview_id}/public-urls:
    post:
      operationId: addPreviewPublicURL
      summary: Add an authorized public URL to a preview
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/PreviewID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddPreviewPublicURLRequest"
      responses:
        "200":
          description: Preview with updated public URLs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Preview"
        default:
          $ref: "#/components/responses/Problem"
  /v1/previews/{preview_id}/team-access:
    put:
      operationId: setPreviewTeamAccess
      summary: Enable or disable team visitor access for this preview
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/PreviewID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetPreviewTeamAccessRequest"
      responses:
        "200":
          description: Updated preview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Preview"
        default:
          $ref: "#/components/responses/Problem"
  /v1/previews/{preview_id}/shares:
    post:
      operationId: createShare
      summary: Store one share for a snapshot of authorized public URLs
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/PreviewID"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateShareRequest"
      responses:
        "201":
          description: Stored share without its secret
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Share"
        default:
          $ref: "#/components/responses/Problem"
    get:
      operationId: listShares
      summary: List shares for a preview
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/PreviewID"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Share page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SharePage"
        default:
          $ref: "#/components/responses/Problem"
  /v1/shares:
    post:
      operationId: createURLShare
      summary: Store one share for an exact authorized HTTP public URL
      description: A guest trial can share only its own demo URL from the issuing IP; the share expires by the trial's end even if the requested expiry is later.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateShareRequest"
      responses:
        "201":
          description: Stored share without its secret
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Share"
        default:
          $ref: "#/components/responses/Problem"
    get:
      operationId: listTeamShares
      summary: List manageable shares for one team
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TeamIDQuery"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Share page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SharePage"
        default:
          $ref: "#/components/responses/Problem"
  /v1/shares/{share_id}:
    get:
      operationId: getShare
      summary: Read one share
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ShareID"
      responses:
        "200":
          description: Share without its secret
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Share"
        default:
          $ref: "#/components/responses/Problem"
  /v1/shares/{share_id}/revoke:
    post:
      operationId: revokeShare
      summary: Stop new access through one share
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ShareID"
      responses:
        "200":
          description: Revoked share
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Share"
        default:
          $ref: "#/components/responses/Problem"
  /v1/feedback:
    get:
      operationId: listFeedbackThreads
      summary: List feedback threads manageable in one team
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TeamIDQuery"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Feedback thread page and event cursor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeedbackThreadPage"
        default:
          $ref: "#/components/responses/Problem"
  /v1/feedback/events:
    get:
      operationId: listFeedbackEvents
      summary: Resume ordered feedback events for one team
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TeamIDQuery"
        - $ref: "#/components/parameters/FeedbackAfterCursor"
      responses:
        "200":
          description: Feedback event page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeedbackEventPage"
        default:
          $ref: "#/components/responses/Problem"
  /v1/feedback/{feedback_id}:
    get:
      operationId: getFeedbackThread
      summary: Read one immutable report and current feedback state
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/FeedbackID"
      responses:
        "200":
          description: Feedback thread
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeedbackThread"
        default:
          $ref: "#/components/responses/Problem"
  /v1/feedback/{feedback_id}/events:
    get:
      operationId: listFeedbackThreadEvents
      summary: Read ordered follow-up events for one feedback thread
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/FeedbackID"
        - $ref: "#/components/parameters/FeedbackAfterCursor"
      responses:
        "200":
          description: Feedback event page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeedbackEventPage"
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: appendFeedbackEvent
      summary: Reply, record a checkout update, resolve, or reopen feedback
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/FeedbackID"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppendFeedbackEventRequest"
      responses:
        "201":
          description: Recorded feedback event
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeedbackEvent"
        default:
          $ref: "#/components/responses/Problem"
  /v1/public-urls:
    get:
      operationId: listPublicURLs
      summary: List public URLs for one team
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TeamIDQuery"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/CanonicalHostnameQuery"
      responses:
        "200":
          description: PublicURL page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicURLPage"
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: createPublicURL
      summary: Create one team public URL
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePublicURLRequest"
      responses:
        "201":
          description: PublicURL created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicURL"
        default:
          $ref: "#/components/responses/Problem"
  /v1/public-urls/{public_url_id}:
    get:
      operationId: getPublicURL
      summary: Read one public URL
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/PublicURLID"
      responses:
        "200":
          description: PublicURL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicURL"
        default:
          $ref: "#/components/responses/Problem"
    patch:
      operationId: updatePublicURL
      summary: Update a public URL's target and IP policy
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/PublicURLID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePublicURLRequest"
      responses:
        "200":
          description: Updated public URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicURL"
        default:
          $ref: "#/components/responses/Problem"
    delete:
      operationId: deletePublicURL
      summary: Delete one public URL and close its publish run
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/PublicURLID"
      responses:
        "204":
          description: PublicURL deleted
        default:
          $ref: "#/components/responses/Problem"
  /v1/public-urls/{public_url_id}/publish-runs:
