    MaintenanceControl:
      type: object
      additionalProperties: false
      required: [name, allowed, revision, updated_at, updated_by]
      properties:
        name:
          $ref: "#/components/schemas/MaintenanceControlName"
        allowed:
          type: boolean
        revision:
          type: integer
          format: int64
          minimum: 1
        updated_at:
          type: string
          format: date-time
        updated_by:
          $ref: "#/components/schemas/IdentityID"
    SetMaintenanceControlRequest:
      type: object
      additionalProperties: false
      required: [allowed]
      properties:
        allowed:
          type: boolean
    ProblemCode:
      type: string
      enum:
        [
          invalid_request,
          traffic_selection_invalid,
          unauthenticated,
          forbidden,
          guest_demo_only,
          guest_ip_changed,
          guest_issuance_limited,
          guest_trial_exhausted,
          not_found,
          conflict,
          rate_limited,
          unavailable,
          internal,
          name_unavailable,
          publish_run_open,
          policy_revision_stale,
          dns_setup_pending,
          placement_unavailable,
          member_hostname_depth_exceeded,
          issuance_retry,
        ]
    Problem:
      type: object
      additionalProperties: false
      required: [type, title, status, code, detail, request_id]
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
          minLength: 1
        status:
          type: integer
          minimum: 400
          maximum: 599
        code:
          $ref: "#/components/schemas/ProblemCode"
        request_id:
          type: string
          minLength: 1
        detail:
          type: string
          minLength: 1
        retry_at:
          type: string
          format: date-time
        details:
          type: object
          additionalProperties: true
