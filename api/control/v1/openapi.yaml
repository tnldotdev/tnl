          maxLength: 32
          description: Go duration between 1ms and 24h, such as 1s or 500ms.
        burst:
          type: integer
          minimum: 1
          maximum: 2147483648
        upload_bytes:
          type: integer
          format: int64
          minimum: 65536
          maximum: 1099511627776
          description: Encrypted upload bytes per second.
        download_bytes:
          type: integer
          format: int64
          minimum: 65536
          maximum: 1099511627776
