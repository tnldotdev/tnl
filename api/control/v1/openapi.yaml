openapi: 3.1.0
info:
  title: tnl control API
  version: 1.0.0
  license:
    name: MIT
    identifier: MIT
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
servers:
  - url: https://control.example.com
paths:
  /v1/browser/login:
    get:
      operationId: beginPreviewBrowserLogin
      summary: Start sign-in for a preview visitor
      security: []
      parameters:
        - name: preview_id
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/PreviewID"
        - name: public_url_id
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/PublicURLID"
        - name: return_path
          in: query
          required: true
          schema:
            type: string
            pattern: "^/"
            maxLength: 2048
      responses:
        "302":
          description: Redirect to the configured identity provider
        default:
          $ref: "#/components/responses/Problem"
  /v1/browser/callback:
    get:
      operationId: completePreviewBrowserLogin
      summary: Return a signed-in visitor to the preview
      security: []
      parameters:
        - name: state
          in: query
          required: true
          schema:
            type: string
        - name: code
          in: query
          required: true
          schema:
            type: string
      responses:
        "303":
          description: Redirect to a one-time handoff on the public URL
        default:
          $ref: "#/components/responses/Problem"
  /v1/publish-runs/{publish_run_id}/browser/handoff:
    post:
      operationId: redeemPreviewBrowserHandoff
      summary: Redeem a one-time browser handoff on the publisher
      security:
        - publishRunBearer: []
      parameters:
        - $ref: "#/components/parameters/PublishRunID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BrowserHandoffRequest"
      responses:
        "200":
          description: Browser cookie and safe return path
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrowserHandoffResponse"
        default:
          $ref: "#/components/responses/Problem"
  /v1/publish-runs/{publish_run_id}/browser/access:
    post:
      operationId: checkPreviewBrowserAccess
      summary: Check a browser cookie against current preview access
      security:
        - publishRunBearer: []
      parameters:
        - $ref: "#/components/parameters/PublishRunID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BrowserAccessRequest"
      responses:
        "200":
          description: Browser identity and current team access
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrowserAccessResponse"
        default:
          $ref: "#/components/responses/Problem"
  /v1/publish-runs/{publish_run_id}/browser/logout:
    post:
      operationId: revokePreviewBrowserAccess
      summary: Revoke the current browser session
      security:
        - publishRunBearer: []
      parameters:
        - $ref: "#/components/parameters/PublishRunID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BrowserAccessRequest"
      responses:
        "204":
          description: Browser session revoked
        default:
          $ref: "#/components/responses/Problem"
  /v1/publish-runs/{publish_run_id}/preview:
    post:
      operationId: createPublishRunPreview
      summary: Create feedback context for one ephemeral demo publish run
      security:
        - publishRunBearer: []
      parameters:
        - $ref: "#/components/parameters/PublishRunID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PublishRunVersionRequest"
      responses:
        "200":
          description: Run-scoped preview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Preview"
        default:
          $ref: "#/components/responses/Problem"
  /v1/health:
    get:
      operationId: getHealth
      summary: Confirm that the control HTTP server is serving
      security: []
      responses:
        "200":
          description: Control HTTP server is serving
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        default:
          $ref: "#/components/responses/Problem"
  /v1/ready:
    get:
      operationId: getReadiness
      summary: Confirm that the tnld role is ready to serve
      security: []
      responses:
        "200":
          description: The tnld role is ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessResponse"
        "503":
          description: The tnld role is not ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessResponse"
        default:
          $ref: "#/components/responses/Problem"
  /v1/client-ip:
    get:
      operationId: getClientIP
      summary: Return the requesting client's public IP address
      security: []
      responses:
        "200":
          description: Client IP address
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientIPResponse"
        default:
          $ref: "#/components/responses/Problem"
  /v1/discovery:
    get:
      operationId: getControlDiscovery
      summary: Describe control and its authentication methods
      security: []
      responses:
        "200":
          description: Control discovery
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ControlDiscovery"
        default:
          $ref: "#/components/responses/Problem"
  /v1/webhook-providers/{provider}/source:
    get:
      operationId: getWebhookProviderSource
      summary: Read one webhook provider source policy
      security: []
      parameters:
        - name: provider
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/WebhookProvider"
      responses:
        "200":
          description: Webhook provider source policy
          headers:
            ETag:
              schema:
                type: string
            Cache-Control:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookProviderSourceResponse"
        "304":
          description: Source policy matches If-None-Match
        default:
          $ref: "#/components/responses/Problem"
  /v1/guest-demo:
    post:
      operationId: createGuestDemo
      summary: Create a restricted guest credential for the built-in demo
      security: []
      responses:
        "201":
          description: Guest credential and managed namespace
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GuestDemoSession"
        default:
          $ref: "#/components/responses/Problem"
  /v1/guest-demo/number:
    post:
      operationId: allocateGuestDemoNumber
      summary: Allocate a new hostname number for this guest trial
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Next demo number
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GuestDemoNumber"
        default:
          $ref: "#/components/responses/Problem"
  /v1/previews:
    post:
      operationId: createPreview
      summary: Create or reuse a preview for one team
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePreviewRequest"
      responses:
        "201":
          description: Preview identity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Preview"
        default:
          $ref: "#/components/responses/Problem"
  /v1/previews/{preview_id}:
    get:
      operationId: getPreview
      summary: Read a preview and its public URLs
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/PreviewID"
      responses:
        "200":
          description: Preview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Preview"
        default:
          $ref: "#/components/responses/Problem"
  /v1/previews/{preview_id}/public-urls:
    post:
      operationId: addPreviewPublicURL
      summary: Add an authorized public URL to a preview
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/PreviewID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddPreviewPublicURLRequest"
      responses:
        "200":
          description: Preview with updated public URLs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Preview"
        default:
          $ref: "#/components/responses/Problem"
  /v1/previews/{preview_id}/team-access:
    put:
      operationId: setPreviewTeamAccess
      summary: Enable or disable team visitor access for this preview
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/PreviewID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetPreviewTeamAccessRequest"
      responses:
        "200":
          description: Updated preview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Preview"
        default:
          $ref: "#/components/responses/Problem"
  /v1/previews/{preview_id}/shares:
    post:
      operationId: createShare
      summary: Store one share for a snapshot of authorized public URLs
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/PreviewID"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateShareRequest"
      responses:
        "201":
          description: Stored share without its secret
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Share"
        default:
          $ref: "#/components/responses/Problem"
    get:
      operationId: listShares
      summary: List shares for a preview
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/PreviewID"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Share page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SharePage"
        default:
          $ref: "#/components/responses/Problem"
  /v1/shares:
    get:
      operationId: listTeamShares
      summary: List manageable shares for one team
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TeamIDQuery"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Share page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SharePage"
        default:
          $ref: "#/components/responses/Problem"
  /v1/shares/{share_id}:
    get:
      operationId: getShare
      summary: Read one share
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ShareID"
      responses:
        "200":
          description: Share without its secret
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Share"
        default:
          $ref: "#/components/responses/Problem"
  /v1/shares/{share_id}/revoke:
    post:
      operationId: revokeShare
      summary: Stop new access through one share
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ShareID"
      responses:
        "200":
          description: Revoked share
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Share"
        default:
          $ref: "#/components/responses/Problem"
  /v1/feedback:
    get:
      operationId: listFeedbackThreads
      summary: List feedback threads manageable in one team
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TeamIDQuery"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Feedback thread page and event cursor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeedbackThreadPage"
        default:
          $ref: "#/components/responses/Problem"
  /v1/feedback/events:
    get:
      operationId: listFeedbackEvents
      summary: Resume ordered feedback events for one team
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TeamIDQuery"
        - $ref: "#/components/parameters/FeedbackAfterCursor"
      responses:
        "200":
          description: Feedback event page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeedbackEventPage"
        default:
          $ref: "#/components/responses/Problem"
  /v1/feedback/{feedback_id}:
    get:
      operationId: getFeedbackThread
      summary: Read one immutable report and current feedback state
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/FeedbackID"
      responses:
        "200":
          description: Feedback thread
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeedbackThread"
        default:
          $ref: "#/components/responses/Problem"
  /v1/feedback/{feedback_id}/events:
    get:
      operationId: listFeedbackThreadEvents
      summary: Read ordered follow-up events for one feedback thread
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/FeedbackID"
        - $ref: "#/components/parameters/FeedbackAfterCursor"
      responses:
        "200":
          description: Feedback event page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeedbackEventPage"
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: appendFeedbackEvent
      summary: Reply, record a checkout update, resolve, or reopen feedback
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/FeedbackID"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppendFeedbackEventRequest"
      responses:
        "201":
          description: Recorded feedback event
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeedbackEvent"
        default:
          $ref: "#/components/responses/Problem"
  /v1/public-urls:
    get:
      operationId: listPublicURLs
      summary: List public URLs for one team
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TeamIDQuery"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/CanonicalHostnameQuery"
      responses:
        "200":
          description: PublicURL page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicURLPage"
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: createPublicURL
      summary: Create one team public URL
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePublicURLRequest"
      responses:
        "201":
          description: PublicURL created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicURL"
        default:
          $ref: "#/components/responses/Problem"
  /v1/public-urls/{public_url_id}:
    get:
      operationId: getPublicURL
      summary: Read one public URL
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/PublicURLID"
      responses:
        "200":
          description: PublicURL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicURL"
        default:
          $ref: "#/components/responses/Problem"
    patch:
      operationId: updatePublicURL
      summary: Update a public URL's target and IP policy
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/PublicURLID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePublicURLRequest"
      responses:
        "200":
          description: Updated public URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicURL"
        default:
          $ref: "#/components/responses/Problem"
    delete:
      operationId: deletePublicURL
      summary: Delete one public URL and close its publish run
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/PublicURLID"
      responses:
        "204":
          description: PublicURL deleted
        default:
          $ref: "#/components/responses/Problem"
  /v1/public-urls/{public_url_id}/publish-runs:
    post:
      operationId: createPublishRun
      summary: Create a publish run and allocate its publish run number
      security:
        - bearerAuth: []
        - publicURLPublishAuth: []
      parameters:
        - $ref: "#/components/parameters/PublicURLID"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "201":
          description: Publish run and two publisher connection assignments
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublishRunSetup"
        default:
          $ref: "#/components/responses/Problem"
  /v1/public-urls/{public_url_id}/publish-credentials:
    post:
      operationId: createPublicURLPublishCredential
      summary: Issue one public URL-scoped publish credential
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/PublicURLID"
      responses:
        "201":
          description: One-time credential and its public metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IssuedPublicURLPublishCredential"
        default:
          $ref: "#/components/responses/Problem"
    get:
      operationId: listPublicURLPublishCredentials
      summary: List credentials issued for a public URL
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/PublicURLID"
      responses:
        "200":
          description: Credential metadata for this public URL
          content:
            application/json:
              schema:
                type: object
                required: [credentials]
                properties:
                  credentials:
                    type: array
                    items:
                      $ref: "#/components/schemas/PublicURLPublishCredential"
        default:
          $ref: "#/components/responses/Problem"
  /v1/public-urls/{public_url_id}/publish-credentials/{credential_id}:
    delete:
      operationId: revokePublicURLPublishCredential
      summary: Revoke one public URL publish credential
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/PublicURLID"
        - name: credential_id
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/ResourceID"
      responses:
        "204":
          description: Credential revoked; active run will close on heartbeat
        default:
          $ref: "#/components/responses/Problem"
  /v1/publish-credentials/current:
    get:
      operationId: getPublicURLForPublishCredential
      summary: Read the one public URL bound to this publish credential
      security:
        - publicURLPublishAuth: []
      responses:
        "200":
          description: Bound public URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicURL"
        default:
          $ref: "#/components/responses/Problem"
  /v1/publish-credentials:
    get:
      operationId: listTeamPublicURLPublishCredentials
      summary: List publish credentials in the selected team without secrets
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TeamIDQuery"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Page of public URL publish credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicURLPublishCredentialPage"
        default:
          $ref: "#/components/responses/Problem"
  /v1/publish-credentials/{credential_id}:
    delete:
      operationId: revokePublishCredentialByID
      summary: Revoke a publish credential by its globally unique ID
      security:
        - bearerAuth: []
      parameters:
        - name: credential_id
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/ResourceID"
        - $ref: "#/components/parameters/TeamIDQuery"
      responses:
        "200":
          description: Revoked credential metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicURLPublishCredential"
        default:
          $ref: "#/components/responses/Problem"
  /v1/publish-runs/{publish_run_id}/heartbeat:
    post:
      operationId: heartbeatPublishRun
      summary: Renew a publish run and replace missing publisher connections
      security:
        - publishRunAuth: []
      parameters:
        - $ref: "#/components/parameters/PublishRunID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PublishRunVersionRequest"
      responses:
        "200":
          description: Renewed publish run plan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublishRunHeartbeat"
        default:
          $ref: "#/components/responses/Problem"
  /v1/publish-runs/{publish_run_id}/share-access:
    post:
      operationId: enableShareAccess
      summary: Enable share-aware HTTP handling for this preview publish run
      security:
        - publishRunAuth: []
      parameters:
        - $ref: "#/components/parameters/PublishRunID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EnableShareAccessRequest"
      responses:
        "204":
          description: Publisher can check shares for this publish run
        default:
          $ref: "#/components/responses/Problem"
  /v1/publish-runs/{publish_run_id}/share-state:
    post:
      operationId: getPublishRunShareState
      summary: Read short-lived share access state for this publisher
      security:
        - publishRunAuth: []
      parameters:
        - $ref: "#/components/parameters/PublishRunID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PublishRunVersionRequest"
      responses:
        "200":
          description: Current share fingerprints and cookie hashes for this public URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublishRunShareState"
        default:
          $ref: "#/components/responses/Problem"
  /v1/publish-runs/{publish_run_id}/share-redemptions:
    post:
      operationId: redeemPublishRunShare
      summary: Redeem a share link or one short-lived cross-host handoff
      security:
        - publishRunAuth: []
      parameters:
        - $ref: "#/components/parameters/PublishRunID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RedeemShareRequest"
      responses:
        "200":
          description: Host-only cookie secret and the next review hostname
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShareRedemption"
        default:
          $ref: "#/components/responses/Problem"
  /v1/publish-runs/{publish_run_id}/feedback:
    post:
      operationId: createFeedbackReport
      summary: Store a reviewer's first report for a preview page
      security:
        - publishRunAuth: []
      parameters:
        - $ref: "#/components/parameters/PublishRunID"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateFeedbackReportRequest"
      responses:
        "201":
          description: Immutable report and open feedback thread
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeedbackThread"
        default:
          $ref: "#/components/responses/Problem"
  /v1/publish-runs/{publish_run_id}/feedback/query:
    post:
      operationId: listPreviewPageFeedback
      summary: List feedback on one page for a reviewer
      security:
        - publishRunAuth: []
      parameters:
        - $ref: "#/components/parameters/PublishRunID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PreviewPageFeedbackRequest"
      responses:
        "200":
          description: Page feedback threads
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeedbackThreadPage"
        default:
          $ref: "#/components/responses/Problem"
  /v1/publish-runs/{publish_run_id}/feedback/{feedback_id}/events:
    post:
      operationId: appendReviewerFeedbackEvent
      summary: Reply, resolve, or reopen feedback through preview access
      security:
        - publishRunAuth: []
      parameters:
        - $ref: "#/components/parameters/PublishRunID"
        - $ref: "#/components/parameters/FeedbackID"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppendReviewerFeedbackEventRequest"
      responses:
        "201":
          description: Recorded reviewer event
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeedbackEvent"
        default:
          $ref: "#/components/responses/Problem"
  /v1/publish-runs/{publish_run_id}/feedback/{feedback_id}/query:
    post:
      operationId: getReviewerFeedbackThread
      summary: Read a feedback thread through a current publisher connection
      security:
        - publishRunAuth: []
      parameters:
        - $ref: "#/components/parameters/PublishRunID"
        - $ref: "#/components/parameters/FeedbackID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviewerFeedbackReadRequest"
      responses:
        "200":
          description: Feedback thread
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeedbackThread"
        default:
          $ref: "#/components/responses/Problem"
  /v1/publish-runs/{publish_run_id}/feedback/{feedback_id}/events/query:
    post:
      operationId: listReviewerFeedbackEvents
      summary: Read thread events through a current publisher connection
      security:
        - publishRunAuth: []
      parameters:
        - $ref: "#/components/parameters/PublishRunID"
        - $ref: "#/components/parameters/FeedbackID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviewerFeedbackReadRequest"
      responses:
        "200":
          description: Feedback event page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeedbackEventPage"
        default:
          $ref: "#/components/responses/Problem"
  /v1/publish-runs/{publish_run_id}/ready:
    post:
      operationId: markPublishRunReady
      summary: Mark a publish run ready after its certificate and two publisher connections are ready
      security:
        - publishRunAuth: []
      parameters:
        - $ref: "#/components/parameters/PublishRunID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PublishRunVersionRequest"
      responses:
        "200":
          description: Ready publish run
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublishRun"
        default:
          $ref: "#/components/responses/Problem"
  /v1/publish-runs/{publish_run_id}/certificate-installed:
    post:
      operationId: markPublishRunCertificateInstalled
      summary: Record installation of the current public URL certificate
      security:
        - publishRunAuth: []
      parameters:
        - $ref: "#/components/parameters/PublishRunID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CertificateInstalledRequest"
      responses:
        "200":
          description: Updated publish run
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublishRun"
        default:
          $ref: "#/components/responses/Problem"
  /v1/publish-runs/{publish_run_id}:
    delete:
      operationId: closePublishRun
      summary: Close and drain a publish run without deleting its public URL
      security:
        - publishRunAuth: []
      parameters:
        - $ref: "#/components/parameters/PublishRunID"
      responses:
        "204":
          description: Publish run closed
        default:
          $ref: "#/components/responses/Problem"
  /v1/publish-runs/{publish_run_id}/certificate-issuances:
    post:
      operationId: createCertificateIssuance
      summary: Begin issuance for the publish run's certificate plan
      security:
        - publishRunAuth: []
      parameters:
        - $ref: "#/components/parameters/PublishRunID"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCertificateIssuanceRequest"
      responses:
        "201":
          description: Certificate issuance
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CertificateIssuance"
        default:
          $ref: "#/components/responses/Problem"
  /v1/certificate-issuances/{issuance_id}:
    get:
      operationId: getCertificateIssuance
      summary: Read one publish-run certificate issuance
      security:
        - publishRunAuth: []
      parameters:
        - $ref: "#/components/parameters/IssuanceID"
      responses:
        "200":
          description: Certificate issuance
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CertificateIssuance"
        default:
          $ref: "#/components/responses/Problem"
  /v1/certificate-issuances/{issuance_id}/challenge-ready:
    post:
      operationId: markCertificateChallengeReady
      summary: Confirm a TLS-ALPN-01 challenge is installed
      security:
        - publishRunAuth: []
      parameters:
        - $ref: "#/components/parameters/IssuanceID"
      responses:
        "200":
          description: Certificate issuance
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CertificateIssuance"
        default:
          $ref: "#/components/responses/Problem"
  /v1/certificate-issuances/{issuance_id}/challenge-removed:
    post:
      operationId: markCertificateChallengeRemoved
      summary: Confirm a TLS-ALPN-01 challenge is removed
      security:
        - publishRunAuth: []
      parameters:
        - $ref: "#/components/parameters/IssuanceID"
      responses:
        "200":
          description: Certificate issuance
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CertificateIssuance"
        default:
          $ref: "#/components/responses/Problem"
  /v1/admin/status:
    get:
      operationId: getAdminServerStatus
      summary: Read control, ingress, and relay status
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Server status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminServerStatus"
        default:
          $ref: "#/components/responses/Problem"
  /v1/admin/relays:
    get:
      operationId: listAdminRelays
      summary: List relay leases
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Relay lease page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminRelayPage"
        default:
          $ref: "#/components/responses/Problem"
  /v1/admin/relays/{relay_id}/drain:
    post:
      operationId: drainAdminRelay
      summary: Remove a matching relay lease from placement and begin draining
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/RelayID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminDrainRelayRequest"
      responses:
        "200":
          description: Draining relay lease
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminRelayLease"
        default:
          $ref: "#/components/responses/Problem"
  /v1/admin/maintenance-controls:
    get:
      operationId: listMaintenanceControls
      summary: List maintenance controls
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Maintenance controls
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MaintenanceControl"
        default:
          $ref: "#/components/responses/Problem"
  /v1/admin/maintenance-controls/{control_name}:
    put:
      operationId: setMaintenanceControl
      summary: Set one maintenance control
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/MaintenanceControlName"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetMaintenanceControlRequest"
      responses:
        "200":
          description: Maintenance control
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MaintenanceControl"
        default:
          $ref: "#/components/responses/Problem"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: tnl access token
    publishRunAuth:
      type: http
      scheme: bearer
      bearerFormat: tnl publish-run token
    publicURLPublishAuth:
      type: http
      scheme: bearer
      bearerFormat: tnl public URL publish credential
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        $ref: "#/components/schemas/IdempotencyKey"
    Cursor:
      name: cursor
      in: query
      required: false
      schema:
        $ref: "#/components/schemas/ResourceID"
    TeamIDQuery:
      name: team_id
      in: query
      required: true
      schema:
        $ref: "#/components/schemas/TeamID"
    CanonicalHostnameQuery:
      name: canonical_hostname
      in: query
      required: false
      description: Exact canonical hostname within the selected team. Returns zero or one non-deleted public URL with no next cursor. Cannot be combined with cursor.
      schema:
        $ref: "#/components/schemas/CanonicalHostname"
    PublicURLID:
      name: public_url_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/PublicURLID"
    PreviewID:
      name: preview_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/PreviewID"
    ShareID:
      name: share_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/ShareID"
    FeedbackID:
      name: feedback_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/FeedbackID"
    FeedbackAfterCursor:
      name: after_cursor
      in: query
      required: false
      schema:
        type: integer
        format: int64
        minimum: 0
    PublishRunID:
      name: publish_run_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/PublishRunID"
    IssuanceID:
      name: issuance_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/IssuanceID"
    RelayID:
      name: relay_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/RelayID"
    MaintenanceControlName:
      name: control_name
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/MaintenanceControlName"
    DNSAuthorityReference:
      name: dns_authority_reference
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 256
        pattern: "^[A-Za-z0-9_-]+$"
  responses:
    Problem:
      description: Request failed
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
  schemas:
    WebhookProvider:
      type: string
      enum:
        [
          amazon-sns,
          auth0,
          clerk,
          custom,
          discord,
          github,
          gitlab,
          incident-io,
          lemon-squeezy,
          linear,
          loops,
          paddle,
          postmark,
          resend,
          sendgrid,
          shopify,
          slack,
          stripe,
          supabase,
          telegram,
          twilio,
          vercel,
          workos,
        ]
    WebhookProviderSourceResponse:
      type: object
      additionalProperties: false
      required: [source]
      properties:
        source:
          oneOf:
            - type: object
              additionalProperties: false
              required: [kind, ranges]
              properties:
                kind:
                  type: string
                  const: ip_ranges
                ranges:
                  type: array
                  minItems: 1
                  maxItems: 512
                  uniqueItems: true
                  items:
                    type: string
            - type: object
              additionalProperties: false
              required: [kind]
              properties:
                kind:
                  type: string
                  const: "*"
    ResourceID:
      type: string
      minLength: 1
      maxLength: 256
      pattern: '^\S(?:.*\S)?$'
    IdentityID:
      $ref: "#/components/schemas/ResourceID"
    TeamID:
      $ref: "#/components/schemas/ResourceID"
    MembershipID:
      $ref: "#/components/schemas/ResourceID"
    DomainID:
      $ref: "#/components/schemas/ResourceID"
    PublicURLID:
      $ref: "#/components/schemas/ResourceID"
    PreviewID:
      $ref: "#/components/schemas/ResourceID"
    ShareID:
      $ref: "#/components/schemas/ResourceID"
    FeedbackID:
      $ref: "#/components/schemas/ResourceID"
    PublishRunID:
      $ref: "#/components/schemas/ResourceID"
    PublisherConnectionID:
      $ref: "#/components/schemas/ResourceID"
    IssuanceID:
      $ref: "#/components/schemas/ResourceID"
    RelayServiceID:
      $ref: "#/components/schemas/ResourceID"
    RelayID:
      $ref: "#/components/schemas/ResourceID"
    IdempotencyKey:
      type: string
      minLength: 1
      maxLength: 128
      pattern: '^\S(?:.*\S)?$'
    CanonicalHostname:
      type: string
      minLength: 1
      maxLength: 253
      pattern: "^[a-z0-9](?:[a-z0-9.-]*[a-z0-9])?$"
    HealthResponse:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          const: ok
    ReadinessResponse:
      type: object
      additionalProperties: false
      required: [status, checks]
      properties:
        status:
          type: string
          enum: [ready, not_ready]
        checks:
          type: object
          additionalProperties: false
          required: [database, control]
          properties:
            database:
              type: string
              enum: [ok, failed]
            control:
              type: string
              description: Control listeners and public control certificate are ready.
              enum: [ok, failed]
            ingress:
              type: string
              description: Present in standalone; checks the ingress lease, routing table, and listener.
              enum: [ok, failed]
            relay:
              type: string
              description: Present in standalone; checks both relay services and their listeners.
              enum: [ok, failed]
            route53_credentials:
              type: string
              description: Present when control uses Route 53; checks that its AWS credentials can be obtained.
              enum: [ok, failed]
    ClientIPResponse:
      type: object
      additionalProperties: false
      required: [ip]
      properties:
        ip:
          type: string
          minLength: 2
          maxLength: 45
    ControlDiscovery:
      type: object
      additionalProperties: false
      required:
        [
          managed_domain,
          managed_url_mode,
          managed_domain_max_member_child_labels,
          custom_domains_enabled,
          dns_automation,
          guest_demo,
          authentication,
        ]
      properties:
        managed_domain:
          $ref: "#/components/schemas/CanonicalHostname"
        managed_url_mode:
          type: string
          enum: [simple, generated]
          description: Default public URL naming on the server's managed domain.
        managed_domain_max_member_child_labels:
          type: integer
          minimum: 0
          description: Maximum labels beneath a member namespace on the managed domain. Zero imposes no limit beyond DNS hostname bounds; custom domains are not subject to this setting.
        custom_domains_enabled:
          type: boolean
          description: Whether teams may add new custom domains. Existing custom domains remain usable when disabled.
        dns_automation:
          type: boolean
        guest_demo:
          type: boolean
          description: Whether this server accepts limited anonymous demo publishers.
        browser_login_available:
          type: boolean
          description: Whether visitors can sign in through a browser OIDC client.
          pattern: "^https://"
        authentication:
          $ref: "#/components/schemas/AuthenticationFacts"
    GuestDemoSession:
      type: object
      additionalProperties: false
      required: [access_token, guest_id, team_id, membership_id, domain_id, namespace, expires_at]
      properties:
        access_token:
          type: string
          minLength: 1
        guest_id:
          $ref: "#/components/schemas/ResourceID"
        team_id:
          $ref: "#/components/schemas/TeamID"
        membership_id:
          $ref: "#/components/schemas/MembershipID"
        domain_id:
          $ref: "#/components/schemas/DomainID"
        namespace:
          $ref: "#/components/schemas/CanonicalHostname"
        expires_at:
          type: string
          format: date-time
    GuestDemoNumber:
      type: object
      additionalProperties: false
      required: [number]
      properties:
        number:
          type: integer
          format: int64
          minimum: 1
    AuthenticationFacts:
      type: object
      additionalProperties: false
      required: [methods]
      properties:
        methods:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            enum: [login_token, oidc]
        oidc:
          $ref: "#/components/schemas/OIDCAuthenticationFacts"
    OIDCAuthenticationFacts:
      type: object
      additionalProperties: false
      required: [issuer, client_id, login_flow, scopes]
      properties:
        issuer:
          type: string
          format: uri
        client_id:
          type: string
          minLength: 1
          maxLength: 128
        login_flow:
          type: string
          enum: [device_code, authorization_code_pkce]
        scopes:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            minLength: 1
            maxLength: 128
    PublicURLScope:
      type: string
      enum: [member, shared]
    PublicURLPurpose:
      type: string
      enum: [app, alias, demo, oauth, webhooks]
    PublicURLLifecycleState:
      type: string
      enum: [enabled, suspended]
    PublicURL:
      type: object
      additionalProperties: false
      required:
        [
          id,
          team_id,
          domain_id,
          canonical_hostname,
          target,
          public_url_scope,
          purpose,
          policy_revision,
          lifecycle_state,
          next_publish_run_number,
          ephemeral,
          created_at,
          updated_at,
        ]
      properties:
        id:
          $ref: "#/components/schemas/PublicURLID"
        team_id:
          $ref: "#/components/schemas/TeamID"
        domain_id:
          $ref: "#/components/schemas/DomainID"
        membership_id:
          $ref: "#/components/schemas/MembershipID"
        canonical_hostname:
          $ref: "#/components/schemas/CanonicalHostname"
        target:
          type: string
          pattern: "^$|^https?://"
          description: empty when a saved app public URL has no saved target.
        public_url_scope:
          $ref: "#/components/schemas/PublicURLScope"
        purpose:
          $ref: "#/components/schemas/PublicURLPurpose"
        policy_revision:
          type: integer
          format: int64
          minimum: 1
        lifecycle_state:
          $ref: "#/components/schemas/PublicURLLifecycleState"
        allowed_ip_prefixes:
          type: array
          uniqueItems: true
          items:
            type: string
            minLength: 1
            maxLength: 64
            pattern: "^\\S+$"
        next_publish_run_number:
          type: integer
          format: int64
          minimum: 1
        ephemeral:
          type: boolean
        expires_at:
          type: string
          format: date-time
        open_publish_run_id:
          $ref: "#/components/schemas/PublishRunID"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    PublicURLPublishCredential:
      type: object
      additionalProperties: false
      required: [id, public_url_id, public_url, created_at, expires_at]
      properties:
        id:
          $ref: "#/components/schemas/ResourceID"
        public_url_id:
          $ref: "#/components/schemas/PublicURLID"
        public_url:
          type: string
          format: uri
          pattern: "^https://"
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
        revoked_at:
          type: string
          format: date-time
    PublicURLPublishCredentialPage:
      type: object
      additionalProperties: false
      required: [credentials]
      properties:
        credentials:
          type: array
          items:
            $ref: "#/components/schemas/PublicURLPublishCredential"
        next_cursor:
          $ref: "#/components/schemas/ResourceID"
    IssuedPublicURLPublishCredential:
      type: object
      additionalProperties: false
      required: [id, public_url_id, created_at, expires_at, credential]
      properties:
        id:
          $ref: "#/components/schemas/ResourceID"
        public_url_id:
          $ref: "#/components/schemas/PublicURLID"
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
        credential:
          type: string
          minLength: 1
    PublicURLPage:
      type: object
      additionalProperties: false
      required: [public_urls]
      properties:
        public_urls:
          type: array
          items:
            $ref: "#/components/schemas/PublicURL"
        next_cursor:
          $ref: "#/components/schemas/PublicURLID"
    CreatePublicURLRequest:
      type: object
      additionalProperties: false
      required: [team_id, domain_id, canonical_hostname, target, public_url_scope, purpose]
      properties:
        team_id:
          $ref: "#/components/schemas/TeamID"
        domain_id:
          $ref: "#/components/schemas/DomainID"
        membership_id:
          $ref: "#/components/schemas/MembershipID"
        canonical_hostname:
          $ref: "#/components/schemas/CanonicalHostname"
        target:
          type: string
          pattern: "^$|^https?://"
          description: empty only for a saved app public URL with no saved target.
        public_url_scope:
          $ref: "#/components/schemas/PublicURLScope"
        purpose:
          $ref: "#/components/schemas/PublicURLPurpose"
        allowed_ip_prefixes:
          type: array
          uniqueItems: true
          items:
            type: string
            minLength: 1
            maxLength: 64
            pattern: "^\\S+$"
        ephemeral:
          type: boolean
          default: false
    ReviewSchemaVersion:
      type: integer
      minimum: 1
      description: Review data format version; writers currently emit 1. Separate from revisions and publish run numbers.
    CreatePreviewRequest:
      type: object
      additionalProperties: false
      required: [team_id]
      properties:
        team_id:
          $ref: "#/components/schemas/TeamID"
    AddPreviewPublicURLRequest:
      type: object
      additionalProperties: false
      required: [public_url_id]
      properties:
        public_url_id:
          $ref: "#/components/schemas/PublicURLID"
    SetPreviewTeamAccessRequest:
      type: object
      additionalProperties: false
      required: [enabled]
      properties:
        enabled:
          type: boolean
    BrowserHandoffRequest:
      type: object
      additionalProperties: false
      required: [publish_run_number, token]
      properties:
        publish_run_number:
          type: integer
          format: int64
          minimum: 1
        token:
          type: string
          pattern: "^[A-Za-z0-9_-]{43}$"
    BrowserHandoffResponse:
      type: object
      additionalProperties: false
      required: [cookie_secret, return_path, expires_at]
      properties:
        cookie_secret:
          type: string
          pattern: "^[A-Za-z0-9_-]{43}$"
        return_path:
          type: string
          pattern: "^/"
        next_url:
          type: string
          pattern: "^https://"
        bridge:
          type: boolean
        expires_at:
          type: string
          format: date-time
    BrowserAccessRequest:
      type: object
      additionalProperties: false
      required: [publish_run_number, cookie_secret]
      properties:
        publish_run_number:
          type: integer
          format: int64
          minimum: 1
        cookie_secret:
          type: string
          pattern: "^[A-Za-z0-9_-]{43}$"
    BrowserAccessResponse:
      type: object
      additionalProperties: false
      required: [identity_id, display_name, team_member]
      properties:
        identity_id:
          $ref: "#/components/schemas/IdentityID"
        display_name:
          type: string
          minLength: 1
          maxLength: 256
        team_member:
          type: boolean
    Preview:
      type: object
      additionalProperties: false
      required: [schema_version, id, team_id, public_url_ids, created_at]
      properties:
        schema_version:
          $ref: "#/components/schemas/ReviewSchemaVersion"
        id:
          $ref: "#/components/schemas/PreviewID"
        team_id:
          $ref: "#/components/schemas/TeamID"
        public_url_ids:
          type: array
          uniqueItems: true
          items:
            $ref: "#/components/schemas/PublicURLID"
        team_access_enabled:
          type: boolean
        created_at:
          type: string
          format: date-time
    CreateShareRequest:
      type: object
      additionalProperties: false
      required: [public_url_ids, expires_at, secret_fingerprint]
      properties:
        public_url_ids:
          type: array
          minItems: 1
          maxItems: 32
          uniqueItems: true
          items:
            $ref: "#/components/schemas/PublicURLID"
        expires_at:
          type: string
