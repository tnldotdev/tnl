        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppendReviewerFeedbackEventRequest"
      responses:
        "201":
          description: Recorded reviewer event
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeedbackEvent"
        default:
          $ref: "#/components/responses/Problem"
  /v1/publish-runs/{publish_run_id}/feedback/{feedback_id}/query:
    post:
      operationId: getReviewerFeedbackThread
      summary: Read a feedback thread through a current publisher connection
      security:
        - publishRunAuth: []
      parameters:
        - $ref: "#/components/parameters/PublishRunID"
        - $ref: "#/components/parameters/FeedbackID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviewerFeedbackReadRequest"
      responses:
        "200":
          description: Feedback thread
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeedbackThread"
        default:
          $ref: "#/components/responses/Problem"
  /v1/publish-runs/{publish_run_id}/feedback/{feedback_id}/events/query:
    post:
      operationId: listReviewerFeedbackEvents
      summary: Read thread events through a current publisher connection
      security:
        - publishRunAuth: []
      parameters:
        - $ref: "#/components/parameters/PublishRunID"
        - $ref: "#/components/parameters/FeedbackID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviewerFeedbackReadRequest"
      responses:
        "200":
          description: Feedback event page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeedbackEventPage"
        default:
          $ref: "#/components/responses/Problem"
  /v1/publish-runs/{publish_run_id}/ready:
    post:
      operationId: markPublishRunReady
      summary: Mark a publish run ready after its certificate and two publisher connections are ready
      security:
        - publishRunAuth: []
      parameters:
        - $ref: "#/components/parameters/PublishRunID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PublishRunVersionRequest"
      responses:
        "200":
          description: Ready publish run
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublishRun"
        default:
          $ref: "#/components/responses/Problem"
  /v1/publish-runs/{publish_run_id}/certificate-installed:
    post:
      operationId: markPublishRunCertificateInstalled
      summary: Record installation of the current public URL certificate
      security:
        - publishRunAuth: []
      parameters:
        - $ref: "#/components/parameters/PublishRunID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CertificateInstalledRequest"
      responses:
        "200":
          description: Updated publish run
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublishRun"
        default:
          $ref: "#/components/responses/Problem"
  /v1/publish-runs/{publish_run_id}:
    delete:
      operationId: closePublishRun
      summary: Close and drain a publish run without deleting its public URL
      security:
        - publishRunAuth: []
      parameters:
        - $ref: "#/components/parameters/PublishRunID"
      responses:
        "204":
          description: Publish run closed
        default:
          $ref: "#/components/responses/Problem"
  /v1/publish-runs/{publish_run_id}/certificate-issuances:
    post:
      operationId: createCertificateIssuance
      summary: Begin issuance for the publish run's certificate plan
      security:
        - publishRunAuth: []
      parameters:
        - $ref: "#/components/parameters/PublishRunID"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCertificateIssuanceRequest"
      responses:
        "201":
          description: Certificate issuance
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CertificateIssuance"
        default:
          $ref: "#/components/responses/Problem"
  /v1/certificate-issuances/{issuance_id}:
    get:
      operationId: getCertificateIssuance
      summary: Read one publish-run certificate issuance
      security:
        - publishRunAuth: []
      parameters:
        - $ref: "#/components/parameters/IssuanceID"
      responses:
        "200":
          description: Certificate issuance
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CertificateIssuance"
        default:
          $ref: "#/components/responses/Problem"
  /v1/certificate-issuances/{issuance_id}/challenge-ready:
    post:
      operationId: markCertificateChallengeReady
      summary: Confirm a TLS-ALPN-01 challenge is installed
      security:
        - publishRunAuth: []
      parameters:
        - $ref: "#/components/parameters/IssuanceID"
      responses:
        "200":
          description: Certificate issuance
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CertificateIssuance"
        default:
          $ref: "#/components/responses/Problem"
  /v1/certificate-issuances/{issuance_id}/challenge-removed:
    post:
      operationId: markCertificateChallengeRemoved
      summary: Confirm a TLS-ALPN-01 challenge is removed
      security:
        - publishRunAuth: []
      parameters:
        - $ref: "#/components/parameters/IssuanceID"
      responses:
        "200":
          description: Certificate issuance
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CertificateIssuance"
        default:
          $ref: "#/components/responses/Problem"
  /v1/admin/status:
    get:
      operationId: getAdminServerStatus
      summary: Read control, ingress, and relay status
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Server status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminServerStatus"
        default:
          $ref: "#/components/responses/Problem"
  /v1/admin/relays:
    get:
      operationId: listAdminRelays
      summary: List relay leases
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Relay lease page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminRelayPage"
        default:
          $ref: "#/components/responses/Problem"
  /v1/admin/relays/{relay_id}/drain:
    post:
      operationId: drainAdminRelay
      summary: Remove a matching relay lease from placement and begin draining
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/RelayID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminDrainRelayRequest"
      responses:
        "200":
          description: Draining relay lease
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminRelayLease"
        default:
          $ref: "#/components/responses/Problem"
  /v1/admin/maintenance-controls:
    get:
      operationId: listMaintenanceControls
      summary: List maintenance controls
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Maintenance controls
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MaintenanceControl"
        default:
          $ref: "#/components/responses/Problem"
  /v1/admin/maintenance-controls/{control_name}:
    put:
      operationId: setMaintenanceControl
      summary: Set one maintenance control
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/MaintenanceControlName"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetMaintenanceControlRequest"
      responses:
        "200":
          description: Maintenance control
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MaintenanceControl"
        default:
          $ref: "#/components/responses/Problem"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: tnl access token
    publishRunAuth:
      type: http
      scheme: bearer
      bearerFormat: tnl publish-run token
    privateRunAuth:
      type: http
      scheme: bearer
      bearerFormat: tnl private-service run token
    publisherAuth:
      type: http
      scheme: bearer
      bearerFormat: tnl grant-scoped publisher access token
    browserIdentityCookie:
      type: apiKey
      in: cookie
      name: __Host-tnl-identity
      description: Digest-only random control-host cookie, backed by encrypted authority tokens; never an SSH code.
  parameters:
    PrivateServiceID:
      name: private_service_id
      in: path
      required: true
      schema: { $ref: "#/components/schemas/PrivateServiceID" }
    PrivateServiceCursor:
      name: cursor
      in: query
      required: false
      schema: { $ref: "#/components/schemas/PrivateServiceID" }
    SSHAttemptID:
      name: attempt_id
      in: path
      required: true
      schema: { type: string, minLength: 1, maxLength: 128 }
    PublisherIdentityID:
      name: publisher_identity_id
      in: path
      required: true
      schema: { $ref: "#/components/schemas/ResourceID" }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        $ref: "#/components/schemas/IdempotencyKey"
    Cursor:
      name: cursor
      in: query
      required: false
      schema:
        $ref: "#/components/schemas/ResourceID"
    TeamIDQuery:
      name: team_id
      in: query
      required: true
      schema:
        $ref: "#/components/schemas/TeamID"
    CanonicalHostnameQuery:
      name: canonical_hostname
      in: query
      required: false
      description: Exact canonical hostname within the selected team. Returns zero or one non-deleted public URL with no next cursor. Cannot be combined with cursor.
      schema:
        $ref: "#/components/schemas/CanonicalHostname"
    PublicURLID:
      name: public_url_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/PublicURLID"
    PreviewID:
      name: preview_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/PreviewID"
    ShareID:
      name: share_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/ShareID"
    FeedbackID:
      name: feedback_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/FeedbackID"
    FeedbackAfterCursor:
      name: after_cursor
      in: query
      required: false
      schema:
        type: integer
        format: int64
        minimum: 0
    PublishRunID:
      name: publish_run_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/PublishRunID"
    IssuanceID:
      name: issuance_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/IssuanceID"
    RelayID:
      name: relay_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/RelayID"
    MaintenanceControlName:
      name: control_name
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/MaintenanceControlName"
    DNSAuthorityReference:
      name: dns_authority_reference
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 256
        pattern: "^[A-Za-z0-9_-]+$"
  responses:
    Problem:
      description: Request failed
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
  schemas:
    PrivateServiceID:
      type: string
      pattern: "^psvc_[A-Za-z0-9]{22}$"
    PrivateRunID:
      type: string
      pattern: "^psrun_[A-Za-z0-9]{22}$"
    PrivateConnectorSessionID:
      type: string
      pattern: "^pcs_[A-Za-z0-9]{22}$"
    PrivateServiceInvitationID:
      type: string
      pattern: "^psivt_[A-Za-z0-9]{22}$"
    PrivateServiceGrantID:
      type: string
      pattern: "^psgr_[A-Za-z0-9]{22}$"
    PrivateServiceName:
      type: string
      pattern: "^[a-z](?:[a-z0-9-]{0,30}[a-z0-9])?$"
      maxLength: 32
    CreatePrivateServiceRequest:
      type: object
      additionalProperties: false
      required: [team_id, name]
      properties:
        team_id: { $ref: "#/components/schemas/TeamID" }
        name: { $ref: "#/components/schemas/PrivateServiceName" }
    PrivateService:
      type: object
      additionalProperties: false
      description: Saved private service. private_run_id and run_number are absent together while offline; their presence identifies a currently ready run, not a ticket.
      required: [id, team_id, name, enabled, created_at]
      dependentRequired:
        private_run_id: [run_number]
        run_number: [private_run_id]
      properties:
        id: { $ref: "#/components/schemas/PrivateServiceID" }
        team_id: { $ref: "#/components/schemas/TeamID" }
        name: { $ref: "#/components/schemas/PrivateServiceName" }
        enabled: { type: boolean }
        created_at: { type: string, format: date-time }
        private_run_id:
          {
            $ref: "#/components/schemas/PrivateRunID",
            description: Present for a ready run with a live publisher grant and at least one live ready publisher connection; first readiness requires two.,
          }
        run_number:
          {
            type: integer,
            format: int64,
            minimum: 1,
            description: Present only alongside private_run_id.,
          }
    PrivateServicePage:
      type: object
      additionalProperties: false
      required: [services]
      properties:
        services: { type: array, items: { $ref: "#/components/schemas/PrivateService" } }
        next_cursor: { $ref: "#/components/schemas/PrivateServiceID" }
    CreatePrivateServiceGrantRequest:
      type: object
      additionalProperties: false
      required: [kind]
      properties:
        kind: { type: string, enum: [team, identity] }
        identity_id: { $ref: "#/components/schemas/IdentityID" }
        expires_at: { type: string, format: date-time }
    PrivateServiceGrant:
      type: object
      additionalProperties: false
      required: [id, private_service_id, kind, created_at]
      properties:
        id: { $ref: "#/components/schemas/PrivateServiceGrantID" }
        private_service_id: { $ref: "#/components/schemas/PrivateServiceID" }
        kind: { type: string, enum: [team, identity] }
        identity_id: { $ref: "#/components/schemas/IdentityID" }
        invitation_id: { $ref: "#/components/schemas/PrivateServiceInvitationID" }
        created_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
        revoked_at: { type: string, format: date-time }
    CreatePrivateServiceInvitationRequest:
      type: object
      additionalProperties: false
      required: [email, expires_at]
      properties:
        email: { type: string, format: email }
        expires_at: { type: string, format: date-time }
    PrivateServiceInvitation:
      type: object
      additionalProperties: false
      required: [id, private_service_id, email, expires_at]
      properties:
        id: { $ref: "#/components/schemas/PrivateServiceInvitationID" }
        private_service_id: { $ref: "#/components/schemas/PrivateServiceID" }
        email: { type: string, format: email }
        expires_at: { type: string, format: date-time }
        accepted_at: { type: string, format: date-time }
        revoked_at: { type: string, format: date-time }
        secret:
          {
            type: string,
            minLength: 32,
            maxLength: 128,
            description: Returned only when the invitation is created; share it with the verified email recipient. Never returned by list.,
          }
    PrivateConnectorSessionSetup:
      type: object
      additionalProperties: false
      required:
        [connector_session_id, private_service_id, session_credential, ingress_address, expires_at]
      properties:
        connector_session_id: { $ref: "#/components/schemas/PrivateConnectorSessionID" }
        private_service_id: { $ref: "#/components/schemas/PrivateServiceID" }
        session_credential: { type: string, minLength: 32, maxLength: 512 }
        ingress_address:
          {
            type: string,
            minLength: 1,
            description: Shared ingress infrastructure TLS endpoint,
            not a service-specific hostname.,
          }
        expires_at: { type: string, format: date-time }
    CreatePrivateServiceTicketRequest:
      type: object
      additionalProperties: false
      required: [connector_session_id]
      properties:
        connector_session_id: { $ref: "#/components/schemas/PrivateConnectorSessionID" }
    PrivateServiceConnection:
      type: object
      additionalProperties: false
      required:
        [
          private_service_id,
          private_run_id,
          run_number,
          connector_session_id,
          ticket,
          expires_at,
          stream_public_key,
          identity_id,
          observed_source_ip,
        ]
      properties:
        private_service_id: { $ref: "#/components/schemas/PrivateServiceID" }
        private_run_id: { $ref: "#/components/schemas/PrivateRunID" }
        run_number: { type: integer, format: int64, minimum: 1 }
        connector_session_id: { $ref: "#/components/schemas/PrivateConnectorSessionID" }
        identity_id: { $ref: "#/components/schemas/IdentityID" }
        observed_source_ip:
          {
            type: string,
            minLength: 3,
            maxLength: 45,
            description: Copied from the source bound by ingress to this authenticated mux session; compare it with PrivateVisitorAccepted.,
          }
        ticket: { type: string, minLength: 32, maxLength: 512 }
        expires_at: { type: string, format: date-time }
        stream_public_key:
          {
            type: string,
            pattern: "^[0-9a-f]{64}$",
            description: Pin the publisher's per-run TLS 1.3 certificate public key and verify the signed connector challenge; no WebPKI certificate is issued for this service.,
          }
    PrivateServiceRunPreparation:
      type: object
      additionalProperties: false
      required:
        [
          team_id,
          private_service_id,
          private_run_id,
          run_number,
          publisher_identity_id,
          publisher_grant_id,
          publisher_key_id,
          idempotency_key,
          binding_nonce,
          expires_at,
        ]
      properties:
        team_id: { $ref: "#/components/schemas/TeamID" }
        private_service_id: { $ref: "#/components/schemas/PrivateServiceID" }
        private_run_id: { $ref: "#/components/schemas/PrivateRunID" }
        run_number: { type: integer, format: int64, minimum: 1 }
        publisher_identity_id: { $ref: "#/components/schemas/ResourceID" }
        publisher_grant_id: { $ref: "#/components/schemas/ResourceID" }
        publisher_key_id: { $ref: "#/components/schemas/ResourceID" }
        idempotency_key: { $ref: "#/components/schemas/IdempotencyKey" }
        binding_nonce: { type: string, pattern: "^[0-9a-f]{64}$" }
        expires_at: { type: string, format: date-time }
    BindPrivateServiceRunKeyRequest:
      type: object
      additionalProperties: false
      required: [run_number, stream_public_key, binding_signature]
      properties:
        run_number: { type: integer, format: int64, minimum: 1 }
        stream_public_key:
          {
            type: string,
            pattern: "^[0-9a-f]{64}$",
            description: Publisher-generated Ed25519 public key; the private key stays with the publisher.,
          }
        binding_signature:
          {
            type: string,
            pattern: "^[A-Za-z0-9_-]{86}$",
            description: Ed25519 signature by the enrolled publisher identity over tunnelv1.PrivateRunBindingDigest for this prepared run.,
          }
    PrivateServiceRunSetup:
      type: object
      additionalProperties: false
      required:
        [
          private_service_id,
          private_run_id,
          run_number,
          run_token,
          stream_public_key,
          publisher_connections,
        ]
      properties:
        private_service_id: { $ref: "#/components/schemas/PrivateServiceID" }
        private_run_id: { $ref: "#/components/schemas/PrivateRunID" }
        run_number: { type: integer, format: int64, minimum: 1 }
        run_token: { type: string, minLength: 1, maxLength: 4096 }
        stream_public_key:
          {
            type: string,
            pattern: "^[0-9a-f]{64}$",
            description: Exact publisher-generated key pinned for this run; no private TLS key is returned.,
          }
        publisher_connections:
          {
            type: array,
            minItems: 2,
            maxItems: 2,
            items: { $ref: "#/components/schemas/ConnectionAssignment" },
          }
    PrivateServiceRunState:
      type: object
      additionalProperties: false
      required:
        [
          private_service_id,
          private_run_id,
          run_number,
          state,
          publisher_expires_at,
          stream_public_key,
          publisher_connections,
        ]
      properties:
        private_service_id: { $ref: "#/components/schemas/PrivateServiceID" }
        private_run_id: { $ref: "#/components/schemas/PrivateRunID" }
        run_number: { type: integer, format: int64, minimum: 1 }
        state: { type: string, enum: [starting, ready, closed] }
        publisher_expires_at: { type: string, format: date-time }
        stream_public_key: { type: string, pattern: "^[0-9a-f]{64}$" }
        publisher_connections:
          {
            type: array,
            minItems: 2,
            maxItems: 2,
            items: { $ref: "#/components/schemas/ConnectionAssignment" },
          }
    SSHAttemptCode:
      type: string
      minLength: 8
      maxLength: 8
      pattern: "^[A-Z0-9]{8}$"
    SSHAttemptCodeRequest:
      type: object
      additionalProperties: false
      required: [code]
      properties:
        code: { $ref: "#/components/schemas/SSHAttemptCode" }
    CreateSSHAttemptRequest:
      type: object
      additionalProperties: false
      required: [publish_run_number, visitor_connection_id, source_ip, ssh_user, ssh_session_hash]
      properties:
        publish_run_number: { type: integer, format: int64, minimum: 1 }
        visitor_connection_id: { type: string, minLength: 1, maxLength: 128 }
        source_ip: { type: string, maxLength: 64 }
        ssh_user: { type: string, pattern: "^[a-z_][a-z0-9_-]{0,31}$" }
        ssh_session_hash: { type: string, pattern: "^[0-9a-f]{64}$" }
    SSHAttemptCreated:
      type: object
      additionalProperties: false
      required: [attempt_id, code, publisher_proof, expires_at]
      properties:
        attempt_id: { type: string }
        code: { $ref: "#/components/schemas/SSHAttemptCode" }
        publisher_proof: { type: string, minLength: 43, maxLength: 43 }
        expires_at: { type: string, format: date-time }
    SSHAttemptBrowserView:
      type: object
      additionalProperties: false
      required: [attempt_id, public_url_id, hostname, source_ip, ssh_user, expires_at]
      properties:
        attempt_id: { type: string }
        public_url_id: { $ref: "#/components/schemas/PublicURLID" }
        hostname: { $ref: "#/components/schemas/CanonicalHostname" }
        source_ip: { type: string }
        ssh_user: { type: string }
        expires_at: { type: string, format: date-time }
    SSHAttemptDecisionRequest:
      type: object
      additionalProperties: false
      required: [code, decision]
      properties:
        code: { $ref: "#/components/schemas/SSHAttemptCode" }
        decision: { type: string, enum: [approve, deny] }
    UpdateSSHAttemptRequest:
      type: object
      additionalProperties: false
      required: [publish_run_number, publisher_proof, action]
      properties:
        publish_run_number: { type: integer, format: int64, minimum: 1 }
        publisher_proof: { type: string, minLength: 43, maxLength: 43 }
        action: { type: string, enum: [poll, claim, cancel] }
        visitor_connection_id: { type: string, minLength: 1, maxLength: 128 }
        source_ip: { type: string, maxLength: 64 }
        ssh_user: { type: string, pattern: "^[a-z_][a-z0-9_-]{0,31}$" }
        ssh_session_hash: { type: string, pattern: "^[0-9a-f]{64}$" }
    SSHAttemptState:
      type: object
      additionalProperties: false
      required: [state, expires_at]
      properties:
        state: { type: string, enum: [pending, approved, denied, claimed, canceled] }
        expires_at: { type: string, format: date-time }
    HTTPVisitorRequest:
      type: object
      additionalProperties: false
      required: [publish_run_number, source_ip]
      properties:
        publish_run_number: { type: integer, format: int64, minimum: 1 }
        source_ip: { type: string, maxLength: 64 }
        browser_cookie_secret: { type: string, maxLength: 43 }
        share_id: { type: string }
        share_cookie_secret: { type: string, maxLength: 43 }
        share_secret: { type: string, maxLength: 43 }
    ReplaceVisitorAccessRequest:
