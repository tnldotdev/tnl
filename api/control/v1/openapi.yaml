      type: object
      additionalProperties: false
      description: Explicit encrypted visitor traffic limits, resolved once against operator defaults and ceilings when the publish run is created. Omitted values use operator defaults. Zero totals mean unlimited.
      properties:
        connections:
          type: integer
          minimum: 1
          maximum: 1048576
        rate:
          type: integer
          minimum: 1
          maximum: 2147483648
        rate_per:
          type: string
          minLength: 1
          maxLength: 32
          description: Go duration between 1ms and 24h, such as 1s or 500ms.
        burst:
          type: integer
          minimum: 1
          maximum: 2147483648
        upload_bytes:
          type: integer
          format: int64
          minimum: 65536
          maximum: 1099511627776
          description: Encrypted upload bytes per second.
        download_bytes:
          type: integer
          format: int64
          minimum: 65536
          maximum: 1099511627776
          description: Encrypted download bytes per second.
        total_connections:
          type: integer
          format: int64
          minimum: 0
        total_upload_bytes:
          type: integer
          format: int64
          minimum: 0
        total_download_bytes:
          type: integer
          format: int64
          minimum: 0
    TrafficLimits:
      type: object
      additionalProperties: false
      description: Resolved limits for one exact public URL and publish run, enforced independently on each ingress process. Omitted totals are unlimited.
      required: [connections, rate, rate_per_ns, burst, upload_bytes, download_bytes]
      properties:
        connections:
          type: integer
          minimum: 1
          maximum: 1048576
        rate:
          type: integer
          minimum: 1
          maximum: 2147483648
        rate_per_ns:
          type: integer
          format: int64
          minimum: 1000000
          maximum: 86400000000000
        burst:
          type: integer
          minimum: 1
          maximum: 2147483648
        upload_bytes:
          type: integer
          format: int64
          minimum: 65536
          maximum: 1099511627776
        download_bytes:
          type: integer
          format: int64
          minimum: 65536
          maximum: 1099511627776
        total_connections:
          type: integer
          format: int64
          minimum: 1
        total_upload_bytes:
          type: integer
          format: int64
          minimum: 1
        total_download_bytes:
          type: integer
          format: int64
          minimum: 1
