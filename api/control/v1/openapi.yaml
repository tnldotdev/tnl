      properties:
        connections:
          type: integer
          minimum: 1
          maximum: 1048576
        rate:
          type: integer
          minimum: 1
          maximum: 2147483648
        rate_per_ns:
          type: integer
          format: int64
          minimum: 1000000
          maximum: 86400000000000
        burst:
          type: integer
          minimum: 1
          maximum: 2147483648
        upload_bytes:
          type: integer
          format: int64
          minimum: 65536
          maximum: 1099511627776
        download_bytes:
          type: integer
          format: int64
          minimum: 65536
          maximum: 1099511627776
        total_connections:
          type: integer
          format: int64
          minimum: 1
        total_upload_bytes:
