          description: Recorded reviewer event
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeedbackEvent"
        default:
          $ref: "#/components/responses/Problem"
  /v1/publish-runs/{publish_run_id}/feedback/{feedback_id}/query:
    post:
      operationId: getReviewerFeedbackThread
      summary: Read a feedback thread through a current publisher connection
      security:
        - publishRunAuth: []
      parameters:
        - $ref: "#/components/parameters/PublishRunID"
        - $ref: "#/components/parameters/FeedbackID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviewerFeedbackReadRequest"
      responses:
        "200":
          description: Feedback thread
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeedbackThread"
        default:
          $ref: "#/components/responses/Problem"
  /v1/publish-runs/{publish_run_id}/feedback/{feedback_id}/events/query:
    post:
      operationId: listReviewerFeedbackEvents
      summary: Read thread events through a current publisher connection
      security:
        - publishRunAuth: []
      parameters:
        - $ref: "#/components/parameters/PublishRunID"
        - $ref: "#/components/parameters/FeedbackID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviewerFeedbackReadRequest"
      responses:
        "200":
          description: Feedback event page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeedbackEventPage"
        default:
          $ref: "#/components/responses/Problem"
  /v1/publish-runs/{publish_run_id}/ready:
    post:
      operationId: markPublishRunReady
      summary: Mark a publish run ready after its certificate and two publisher connections are ready
      security:
        - publishRunAuth: []
      parameters:
        - $ref: "#/components/parameters/PublishRunID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PublishRunVersionRequest"
      responses:
        "200":
          description: Ready publish run
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublishRun"
        default:
          $ref: "#/components/responses/Problem"
  /v1/publish-runs/{publish_run_id}/certificate-installed:
    post:
      operationId: markPublishRunCertificateInstalled
      summary: Record installation of the current public URL certificate
      security:
        - publishRunAuth: []
      parameters:
        - $ref: "#/components/parameters/PublishRunID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CertificateInstalledRequest"
      responses:
        "200":
          description: Updated publish run
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublishRun"
        default:
          $ref: "#/components/responses/Problem"
  /v1/publish-runs/{publish_run_id}:
    delete:
      operationId: closePublishRun
      summary: Close and drain a publish run without deleting its public URL
      security:
        - publishRunAuth: []
      parameters:
        - $ref: "#/components/parameters/PublishRunID"
      responses:
        "204":
          description: Publish run closed
        default:
          $ref: "#/components/responses/Problem"
  /v1/publish-runs/{publish_run_id}/certificate-issuances:
    post:
      operationId: createCertificateIssuance
      summary: Begin issuance for the publish run's certificate plan
      security:
        - publishRunAuth: []
      parameters:
        - $ref: "#/components/parameters/PublishRunID"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCertificateIssuanceRequest"
      responses:
        "201":
          description: Certificate issuance
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CertificateIssuance"
        default:
          $ref: "#/components/responses/Problem"
  /v1/certificate-issuances/{issuance_id}:
    get:
      operationId: getCertificateIssuance
      summary: Read one publish-run certificate issuance
      security:
        - publishRunAuth: []
      parameters:
        - $ref: "#/components/parameters/IssuanceID"
      responses:
        "200":
          description: Certificate issuance
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CertificateIssuance"
        default:
          $ref: "#/components/responses/Problem"
  /v1/admin/status:
    get:
      operationId: getAdminServerStatus
      summary: Read control, ingress, and relay status
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Server status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminServerStatus"
        default:
          $ref: "#/components/responses/Problem"
  /v1/admin/relays:
    get:
      operationId: listAdminRelays
      summary: List relay leases
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Relay lease page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminRelayPage"
        default:
          $ref: "#/components/responses/Problem"
  /v1/admin/relays/{relay_id}/drain:
    post:
      operationId: drainAdminRelay
      summary: Remove a matching relay lease from placement and begin draining
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/RelayID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminDrainRelayRequest"
      responses:
        "200":
          description: Draining relay lease
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminRelayLease"
        default:
          $ref: "#/components/responses/Problem"
  /v1/admin/maintenance-controls:
    get:
      operationId: listMaintenanceControls
      summary: List maintenance controls
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Maintenance controls
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MaintenanceControl"
        default:
          $ref: "#/components/responses/Problem"
  /v1/admin/maintenance-controls/{control_name}:
    put:
      operationId: setMaintenanceControl
      summary: Set one maintenance control
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/MaintenanceControlName"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetMaintenanceControlRequest"
      responses:
        "200":
          description: Maintenance control
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MaintenanceControl"
        default:
          $ref: "#/components/responses/Problem"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: tnl access token
    publishRunAuth:
      type: http
      scheme: bearer
      bearerFormat: tnl publish-run token
    privateRunAuth:
      type: http
      scheme: bearer
      bearerFormat: tnl private-service run token
    publisherAuth:
      type: http
      scheme: bearer
      bearerFormat: tnl grant-scoped publisher access token
  parameters:
    PrivateServiceID:
      name: private_service_id
      in: path
      required: true
      schema: { $ref: "#/components/schemas/PrivateServiceID" }
    PrivateServiceCursor:
      name: cursor
      in: query
      required: false
      schema: { $ref: "#/components/schemas/PrivateServiceID" }
    PublisherIdentityID:
      name: publisher_identity_id
      in: path
      required: true
      schema: { $ref: "#/components/schemas/ResourceID" }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        $ref: "#/components/schemas/IdempotencyKey"
    Cursor:
      name: cursor
      in: query
      required: false
      schema:
        $ref: "#/components/schemas/ResourceID"
    TeamIDQuery:
      name: team_id
      in: query
      required: true
      schema:
        $ref: "#/components/schemas/TeamID"
    CanonicalHostnameQuery:
      name: canonical_hostname
      in: query
      required: false
      description: Exact canonical hostname within the selected team. Returns zero or one non-deleted public URL with no next cursor. Cannot be combined with cursor.
      schema:
        $ref: "#/components/schemas/CanonicalHostname"
    PublicURLID:
      name: public_url_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/PublicURLID"
    PreviewID:
      name: preview_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/PreviewID"
    ShareID:
      name: share_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/ShareID"
    FeedbackID:
      name: feedback_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/FeedbackID"
    FeedbackAfterCursor:
      name: after_cursor
      in: query
      required: false
      schema:
        type: integer
        format: int64
        minimum: 0
    PublishRunID:
      name: publish_run_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/PublishRunID"
    IssuanceID:
      name: issuance_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/IssuanceID"
    RelayID:
      name: relay_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/RelayID"
    MaintenanceControlName:
      name: control_name
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/MaintenanceControlName"
    DNSAuthorityReference:
      name: dns_authority_reference
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 256
        pattern: "^[A-Za-z0-9_-]+$"
  responses:
    Problem:
      description: Request failed
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
  schemas:
    HTTPAuthorizationSubject:
      type: object
      additionalProperties: false
      required: [kind, id]
      properties:
        kind: { type: string, enum: [public_url, managed_service] }
        id: { type: string }
      description: An explicit authorization scope. A public URL grant never applies to a managed service, even when they have related names or owners.
    CreateManagedHTTPGrantRequest:
      type: object
      additionalProperties: false
      required: [kind, expires_at]
      properties:
        kind: { type: string, enum: [token, share] }
        expires_at: { type: string, format: date-time }
    ManagedHTTPGrant:
      type: object
      additionalProperties: false
      required: [subject, id, kind, secret, expires_at]
      properties:
        subject: { $ref: "#/components/schemas/HTTPAuthorizationSubject" }
        id: { type: string }
        kind: { type: string, enum: [token, share] }
        secret: { type: string }
        share_url: { type: string, format: uri }
        expires_at: { type: string, format: date-time }
    ManagedHTTPCredential:
      type: object
      additionalProperties: false
      required: [kind]
      properties:
        kind: { type: string, enum: [none, browser, token, share, certificate] }
        secret: { type: string, maxLength: 256 }
        certificate: { type: string, format: byte, maxLength: 22000 }
      description: Exactly one selected credential. Explicit HTTP credentials take precedence over an optional TLS client certificate. Invalid supplied credentials fail closed.
    ManagedHTTPVisitorRequest:
      type: object
      additionalProperties: false
      required: [run_number, visitor_connection_id, source_ip, destination_port, credential]
      properties:
        run_number: { type: integer, format: int64, minimum: 1 }
        visitor_connection_id: { type: string }
        source_ip: { type: string }
        destination_port: { type: integer, minimum: 1024, maximum: 65535 }
        credential: { $ref: "#/components/schemas/ManagedHTTPCredential" }
    ManagedBrowserRequest:
      type: object
      additionalProperties: false
      required: [run_number, secret]
      properties:
        run_number: { type: integer, format: int64, minimum: 1 }
        secret: { type: string, maxLength: 256 }
    ProjectPublicMetadata:
      type: object
      additionalProperties: false
      required: [source_fingerprint, services]
      properties:
        source_fingerprint: { type: string }
        services:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [service, hostname, port]
            properties:
              service: { type: string }
              public_url_id: { $ref: "#/components/schemas/PublicURLID" }
              private_service_id: { $ref: "#/components/schemas/PrivateServiceID" }
              port: { type: integer, minimum: 1, maximum: 65535 }
              hostname: { type: string }
    RealizeLocalProjectServiceRequest:
      type: object
      additionalProperties: false
      required: [team_id, source_fingerprint, worktree_key, configuration]
      properties:
        team_id: { type: string }
        source_fingerprint: { type: string, pattern: "^[0-9a-f]{64}$" }
        worktree_key: { type: string, minLength: 1, maxLength: 128 }
        worktree_label: { type: string, minLength: 1, maxLength: 63 }
        domain_id: { $ref: "#/components/schemas/DomainID" }
        public_url_id: { $ref: "#/components/schemas/PublicURLID" }
        configuration: { $ref: "#/components/schemas/ProjectServiceConfiguration" }
    LocalProjectService:
      type: object
      additionalProperties: false
      required: [service, worktree_key, service_kind, service_id]
      properties:
        service: { type: string }
        worktree_key: { type: string }
        service_kind: { type: string, enum: [private_service, public_url] }
        service_id: { type: string }
        hostname: { type: string }
        private_service: { $ref: "#/components/schemas/PrivateServiceMetadata" }
    ApplyProjectConfigurationRequest:
      type: object
      additionalProperties: false
      required: [team_id, source_fingerprint, expected_revision, configuration]
      properties:
        team_id: { type: string }
        source_fingerprint: { type: string, pattern: "^[0-9a-f]{64}$" }
        project_label:
          { type: string, minLength: 1, maxLength: 63, pattern: "^[a-z0-9]([a-z0-9-]*[a-z0-9])?$" }
        expected_revision: { type: integer, format: int64, minimum: 0 }
        configuration: { $ref: "#/components/schemas/ProjectConfiguration" }
    ProjectConfiguration:
      type: object
      description: Normalized declarative configuration, at most 512 KiB encoded. All local declarations defer allocation to source-bound worktree realization. A project supports at most 256 active enrolled replicas across its groups.
      additionalProperties: false
      required: [publishers, services, oauth, webhooks]
      properties:
        oauth:
          type: boolean
          default: false
          description: Desired local app-led OAuth integration URL declaration. Control stores the declaration and revision; applying it does not provision a handler on a named publisher group.
        webhooks:
          type: object
          maxProperties: 32
          additionalProperties: { $ref: "#/components/schemas/ProjectWebhook" }
          description: Desired exact endpoints for the existing local webhook integration handler. Each endpoint names a declared local HTTP service with public_url enabled, including app, address, compose, and docker targets. Control does not fetch provider catalogs or provision remote webhook handlers during apply.
        publishers:
          {
            type: object,
            maxProperties: 32,
            additionalProperties: { $ref: "#/components/schemas/ProjectPublisherGroup" },
          }
        services:
          {
            type: object,
            maxProperties: 128,
            additionalProperties: { $ref: "#/components/schemas/ProjectServiceConfiguration" },
          }
    ProjectPublisherGroup:
      type: object
      additionalProperties: false
      properties:
        description: { type: string, maxLength: 1024 }
        domain_id: { type: string }
        public: { type: boolean, default: false }
    RenamePublisherNamespaceRequest:
      type: object
      additionalProperties: false
      required: [team_id, namespace_label, expected_revision, idempotency_key]
      properties:
        team_id: { type: string }
        namespace_label: { type: string, pattern: "^[a-z]([a-z0-9-]{0,30}[a-z0-9])?$" }
        expected_revision: { type: integer, format: int64, minimum: 1 }
        idempotency_key: { type: string, minLength: 1, maxLength: 256 }
    RenamePublisherGroupRequest:
      type: object
      additionalProperties: false
      required: [team_id, name, expected_revision]
      properties:
        team_id: { type: string }
        name: { type: string, pattern: "^[a-z]([a-z0-9-]{0,30}[a-z0-9])?$" }
        expected_revision: { type: integer, format: int64, minimum: 1 }
    ProjectWebhook:
      type: object
      additionalProperties: false
      required: [service, path, provider]
      properties:
        service: { type: string, minLength: 1, maxLength: 32 }
        path: { type: string, minLength: 1, maxLength: 2048 }
        provider: { $ref: "#/components/schemas/WebhookProvider" }
        delivery: { type: string, pattern: "^(fanout|selected)$" }
        methods:
          type: array
          maxItems: 7
          uniqueItems: true
          items: { type: string, pattern: "^(POST|GET|PUT|PATCH|DELETE|HEAD|OPTIONS)$" }
        source_ips:
          type: array
          minItems: 1
          maxItems: 256
          uniqueItems: true
          items: { type: string, minLength: 1, maxLength: 64 }
    ProjectServiceConfiguration:
      type: object
      additionalProperties: false
      required: [target]
      properties:
        publisher: { type: string, default: local }
        name: { type: string, maxLength: 32 }
        protocol: { $ref: "#/components/schemas/PrivateServiceProtocol" }
        target:
          type: string
          minLength: 1
          maxLength: 8192
          description: Public targets use the runtime NormalizeTarget rules, including an explicit port and no trailing slash on HTTP/HTTPS origins. Private targets normalize to host:port; private HTTPS origins require target_tls and plaintext HTTP origins forbid it. The publisher uses the approved transport/trust snapshot independently of mandatory managed visitor TLS. Only local publishers may use deferred app (HTTP only), compose:SERVICE:PORT, or docker:CONTAINER:PORT descriptors; control never discovers or executes those targets.
        public_url: { $ref: "#/components/schemas/ProjectServicePublicURL" }
        target_tls: { $ref: "#/components/schemas/ProjectTargetTLS" }
        access: { $ref: "#/components/schemas/ProjectServiceAccess" }
        http: { $ref: "#/components/schemas/ProjectServiceHTTP" }
    ProjectServiceHTTP:
      type: object
      additionalProperties: false
      description: Local HTTP behavior. Named publisher groups reject http settings until their execution contract supports readiness and path mounts.
      properties:
        readiness:
          type: object
          additionalProperties: false
          required: [path]
          properties:
            path: { type: string, minLength: 1, maxLength: 2048 }
        paths:
          type: object
          maxProperties: 32
          additionalProperties:
            type: object
            additionalProperties: false
            required: [service]
            properties:
              service: { type: string }
              strip_prefix: { type: boolean }
        open: { type: boolean }
    ProjectServicePublicURL:
      type: object
      additionalProperties: false
      properties:
        domain_id: { type: string }
        hostname: { type: string, maxLength: 253 }
        access: { $ref: "#/components/schemas/ProjectPublicAccess" }
        limits: { $ref: "#/components/schemas/ProjectPublicLimits" }
        ephemeral:
          type: boolean
          default: false
          description: Local deferred declarations may request an ephemeral worktree URL. Named publisher groups require saved pooled URLs and reject true.
      description: Named publisher groups require domain_id. An omitted hostname uses the service name beneath that authorized domain. Local declarations defer URL allocation to their worktree runtime.
    ProjectPublicAccess:
      type: object
      additionalProperties: false
      properties:
        mode: { $ref: "#/components/schemas/VisitorAccessMode" }
        ip:
          type: array
          minItems: 1
          maxItems: 256
          uniqueItems: true
          items: { type: string, maxLength: 64 }
    ProjectPublicLimits:
      type: object
      additionalProperties: false
      properties:
        http: { $ref: "#/components/schemas/ProjectHTTPApplicationLimits" }
        traffic: { $ref: "#/components/schemas/TrafficSelection" }
    ProjectHTTPApplicationLimits:
      type: object
      additionalProperties: false
      properties:
        total: { type: integer, minimum: 1, maximum: 9007199254740991 }
        concurrency: { type: integer, minimum: 1, maximum: 9007199254740991 }
        rate: { $ref: "#/components/schemas/ProjectApplicationRate" }
    ProjectApplicationRate:
      type: object
      additionalProperties: false
      required: [count, per]
      properties:
        count: { type: integer, minimum: 1, maximum: 9007199254740991 }
        per: { type: string, minLength: 1, maxLength: 64 }
        burst: { type: integer, minimum: 1, maximum: 9007199254740991 }
    ProjectTargetTLS:
      type: object
      additionalProperties: false
      required: [hostname, digest]
      description: Publisher-to-target TLS trust for http, tcp, postgres, or mysql, independent of mandatory managed visitor TLS. The protocol selects native negotiation. ca_pem is a CA-only snapshot added to the publisher's system roots. digest is lowercase SHA-256 of "tnl-target-tls/v1", NUL, hostname, NUL, and ca_pem. No filesystem path or remote bundle URL is accepted.
      properties:
        hostname: { type: string, minLength: 1, maxLength: 253 }
        ca_pem: { type: string, maxLength: 1048576 }
        digest: { type: string, pattern: "^[0-9a-f]{64}$" }
    ProjectServiceAccess:
      type: object
      additionalProperties: false
      required: [team]
      properties:
        team: { type: boolean, enum: [true] }
    AppliedProjectConfiguration:
      type: object
      additionalProperties: false
      required:
        [
          team_id,
          project_key,
          source_fingerprint,
          revision,
          configuration_hash,
          configuration,
          services,
          members,
        ]
      properties:
        team_id: { type: string }
        project_key: { type: string }
        source_fingerprint: { type: string }
        revision: { type: integer, format: int64 }
        configuration_hash: { type: string }
        configuration: { $ref: "#/components/schemas/ProjectConfiguration" }
        services: { type: array, items: { $ref: "#/components/schemas/AppliedProjectService" } }
        members: { type: array, items: { $ref: "#/components/schemas/PublisherGroupMemberStatus" } }
        groups: { type: array, items: { $ref: "#/components/schemas/AppliedPublisherGroup" } }
    AppliedPublisherGroup:
      type: object
      required: [id, name, group_names, namespace, domain_id, public]
      properties:
        id: { type: string }
        name: { type: string }
        group_names:
          type: array
          description: Authoritative current and historical selectors permanently bound to this group ID.
          items: { type: string }
        namespace: { type: string }
        domain_id: { type: string }
        public: { type: boolean }
    AppliedProjectService:
      type: object
      required: [service, publisher, service_kind, desired_revision, trust_revision]
      properties:
        service: { type: string }
        publisher: { type: string }
        service_kind: { type: string, enum: [public_url, private_service, local] }
        service_id: { type: string }
        hostname: { type: string }
        desired_revision: { type: integer, format: int64 }
        trust_revision: { type: integer, format: int64 }
        port: { type: integer, minimum: 1024, maximum: 65535 }
        public: { type: boolean }
    CreatePublisherGroupEnrollmentRequest:
      type: object
      additionalProperties: false
      required: [team_id, max_members, expires_in]
      properties:
        team_id: { type: string }
        max_members: { type: integer, minimum: 1, maximum: 256 }
        expires_in: { type: integer, minimum: 60, maximum: 86400 }
    PublisherGroupEnrollment:
      type: object
      required: [enrollment_key, group_id, expires_at, max_members]
      properties:
        enrollment_key: { type: string }
        group_id: { type: string }
        expires_at: { type: string, format: date-time }
        max_members: { type: integer }
    RedeemPublisherGroupEnrollmentRequest:
      type: object
      additionalProperties: false
      required: [enrollment_key, public_key]
      properties:
        enrollment_key: { type: string, maxLength: 256 }
        public_key: { type: string, pattern: "^[A-Za-z0-9_-]{43}$" }
    PublisherGroupMember:
      type: object
      required: [team_id, project_key, group_id, group_name, publisher_identity_id, key_id]
      properties:
        team_id: { type: string }
        project_key: { type: string }
        group_id: { type: string }
        group_name: { type: string }
        publisher_identity_id: { type: string }
        key_id: { type: string }
    PublisherGroupMemberStatus:
      allOf:
        - { $ref: "#/components/schemas/PublisherGroupMember" }
        - type: object
          required: [observed_revision, healthy]
          properties:
            observed_revision: { type: integer, format: int64 }
            healthy: { type: boolean }
            lease_expires_at: { type: string, format: date-time }
            runtime: { $ref: "#/components/schemas/PublisherRuntimeStatus" }
    PublisherRuntimeRequest:
      type: object
      additionalProperties: false
      required: [publisher_identity_id, scope_id, process_run_id, expected_epoch, action, assertion]
      properties:
        publisher_identity_id: { type: string }
        scope_id:
          type: string
          description: Immutable group ID for a group replica, or an exact live grant ID for an installed publisher.
        process_run_id: { type: string, pattern: "^[a-f0-9]{32}$" }
        expected_epoch: { type: integer, format: int64, minimum: 0 }
        action:
          type: string
          enum: [inspect, start, renew, stop]
          x-enum-varnames: [RuntimeInspect, RuntimeStart, RuntimeRenew, RuntimeStop]
        assertion: { type: string, maxLength: 4096 }
        deployment: { $ref: "#/components/schemas/PublisherDeploymentReport" }
    PublisherDeploymentReport:
      type: object
      additionalProperties: false
      description: >-
        Optional, bounded metadata reported by a signed group publisher process.
        The runtime assertion binds every field. It supplies no tenant, group, or
        publisher authority and is not AWS attestation. Values stay fixed within
        a process run. Deployment, provider, replica and instance stay bound to
        the same publisher identity across replacement processes.
      required:
        [
          deployment_id,
          provider,
          replica_key,
          instance,
          image,
          software_version,
          template_version,
          template_sha256,
        ]
      properties:
        deployment_id: { type: string, pattern: "^[a-z0-9][a-z0-9-]{0,47}$", maxLength: 48 }
        provider: { type: string, enum: [aws] }
        replica_key: { type: string, pattern: "^[a-z]([a-z0-9-]{0,30}[a-z0-9])?$", maxLength: 32 }
        instance: { type: string, pattern: "^[a-z]([a-z0-9-]{0,30}[a-z0-9])?$", maxLength: 32 }
        image:
          type: string
          maxLength: 512
          pattern: "^[a-z0-9.-]+(:[0-9]+)?/[a-z0-9._/-]+@sha256:[a-f0-9]{64}$"
          description: Reported digest-pinned image reference, without a tag, scheme or credentials. Control does not inspect the running image.
        software_version:
          { type: string, maxLength: 64, pattern: "^[A-Za-z0-9][A-Za-z0-9.+_-]{0,63}$" }
        template_version:
          { type: string, maxLength: 32, pattern: "^[A-Za-z0-9][A-Za-z0-9.+_-]{0,31}$" }
        template_sha256: { type: string, pattern: "^[a-f0-9]{64}$", maxLength: 64 }
    PublisherDeploymentObservation:
      type: object
      additionalProperties: false
      description: >-
        A deployment report accepted through the signed runtime lifecycle.
        Publisher and team are the surrounding runtime's authenticated identity;
        group_id is derived by control from current publisher membership.
        Timestamps are control receipt times. This is evidence of a publisher
        report, not cloud deployment state, image attestation or target health.
        The group/deployment/replica tuple is reserved for this publisher identity.
      required: [report, group_id, evidence, first_observed_at, observed_at]
      properties:
        report: { $ref: "#/components/schemas/PublisherDeploymentReport" }
        group_id: { type: string }
        evidence: { type: string, enum: [publisher_reported] }
        first_observed_at: { type: string, format: date-time }
        observed_at: { type: string, format: date-time }
    PublisherRuntimeResponse:
      type: object
      required: [epoch]
      properties:
        epoch: { type: integer, format: int64, minimum: 0 }
        lease_expires_at: { type: string, format: date-time }
        group_lease: { $ref: "#/components/schemas/PublisherGroupLease" }
    PublisherRuntimeStatus:
      type: object
      additionalProperties: false
      description: >-
        Latest explicitly started runtime for this immutable publisher identity.
        A single bounded record survives stop and lease expiry. Active describes
        the runtime lease, not target reachability or a permanent static IP.
        Control egress may differ from database-target routing, address family,
        or NAT. This evidence never grants access or configures an allowlist.
      required:
        [
          publisher_identity_id,
          team_id,
          process_run_id,
          epoch,
          evidence,
          address_family,
          started_at,
          observed_at,
          last_seen_at,
          lease_expires_at,
          active,
        ]
      properties:
        publisher_identity_id: { type: string }
        team_id: { type: string }
        process_run_id: { type: string }
        epoch: { type: integer, format: int64 }
        evidence: { type: string, enum: [control_observed] }
        address:
          type: string
          description: Canonical public routable IPv4 or IPv6 host, never a CIDR. Absent for private or non-routable sources.
        address_family: { type: string, enum: [ipv4, ipv6, unknown] }
        started_at: { type: string, format: date-time }
        observed_at: { type: string, format: date-time }
        last_seen_at: { type: string, format: date-time }
        lease_expires_at: { type: string, format: date-time }
        stopped_at: { type: string, format: date-time }
        active: { type: boolean }
        deployment: { $ref: "#/components/schemas/PublisherDeploymentObservation" }
    PublisherGroupLeaseRequest:
      type: object
      additionalProperties: false
      required: [publisher_identity_id, group_id, assertion]
      properties:
        publisher_identity_id: { type: string }
        group_id: { type: string }
        assertion: { type: string, maxLength: 4096 }
    PublisherGroupLease:
      type: object
      required: [access_token, expires_at]
      properties:
        access_token: { type: string }
        expires_at: { type: string, format: date-time }
    PublisherGroupVerification:
      type: object
      required: [member, group_names]
      properties:
        member: { $ref: "#/components/schemas/PublisherGroupMember" }
        group_names:
          type: array
          minItems: 1
          uniqueItems: true
          items: { type: string, minLength: 1, maxLength: 63 }
    PublisherGroupAssignments:
      type: object
      required: [member, revision, configuration_hash, services]
      properties:
        certificate_state_required:
          type: boolean
          description: This replica has submitted certificate issuance work. Missing durable certificate state must not be replaced with fresh keys. Absence means the server does not support this recovery boundary.
        member: { $ref: "#/components/schemas/PublisherGroupMember" }
        revision: { type: integer, format: int64 }
        configuration_hash: { type: string }
        services:
          {
            type: array,
            maxItems: 128,
            items: { $ref: "#/components/schemas/PublisherGroupServiceAssignment" },
          }
    PublisherGroupServiceAssignment:
      type: object
      required: [service, service_id, service_kind, grant_id, configuration, trust_revision]
      properties:
        service: { type: string }
        service_id: { type: string }
        service_kind: { type: string, enum: [public_url, private_service] }
        grant_id: { type: string }
        hostname: { type: string }
        trust_revision: { type: integer, format: int64 }
        configuration: { $ref: "#/components/schemas/ProjectServiceConfiguration" }
    PublisherGroupAcknowledgement:
      type: object
