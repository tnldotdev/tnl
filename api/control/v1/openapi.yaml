      security:
        - bearerAuth: []
      responses:
        "200":
          description: Maintenance controls
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MaintenanceControl"
        default:
          $ref: "#/components/responses/Problem"
  /v1/admin/maintenance-controls/{control_name}:
    put:
      operationId: setMaintenanceControl
      summary: Set one maintenance control
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/MaintenanceControlName"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetMaintenanceControlRequest"
      responses:
        "200":
          description: Maintenance control
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MaintenanceControl"
        default:
          $ref: "#/components/responses/Problem"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: tnl access token
    publishRunAuth:
      type: http
      scheme: bearer
      bearerFormat: tnl publish-run token
    publisherAuth:
      type: http
      scheme: bearer
      bearerFormat: tnl grant-scoped publisher access token
  parameters:
    PublisherIdentityID:
      name: publisher_identity_id
      in: path
      required: true
      schema: { $ref: "#/components/schemas/ResourceID" }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        $ref: "#/components/schemas/IdempotencyKey"
    Cursor:
      name: cursor
      in: query
      required: false
      schema:
        $ref: "#/components/schemas/ResourceID"
    TeamIDQuery:
      name: team_id
      in: query
      required: true
      schema:
        $ref: "#/components/schemas/TeamID"
    CanonicalHostnameQuery:
      name: canonical_hostname
      in: query
      required: false
      description: Exact canonical hostname within the selected team. Returns zero or one non-deleted public URL with no next cursor. Cannot be combined with cursor.
      schema:
        $ref: "#/components/schemas/CanonicalHostname"
    PublicURLID:
      name: public_url_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/PublicURLID"
    PreviewID:
      name: preview_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/PreviewID"
    ShareID:
      name: share_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/ShareID"
    FeedbackID:
      name: feedback_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/FeedbackID"
    FeedbackAfterCursor:
      name: after_cursor
      in: query
      required: false
      schema:
        type: integer
        format: int64
        minimum: 0
    PublishRunID:
      name: publish_run_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/PublishRunID"
    IssuanceID:
      name: issuance_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/IssuanceID"
    RelayID:
      name: relay_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/RelayID"
    MaintenanceControlName:
      name: control_name
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/MaintenanceControlName"
    DNSAuthorityReference:
      name: dns_authority_reference
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 256
        pattern: "^[A-Za-z0-9_-]+$"
  responses:
    Problem:
      description: Request failed
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
  schemas:
    HTTPVisitorRequest:
      type: object
      additionalProperties: false
      required: [publish_run_number, source_ip]
      properties:
        publish_run_number: { type: integer, format: int64, minimum: 1 }
        source_ip: { type: string, maxLength: 64 }
        browser_cookie_secret: { type: string, maxLength: 43 }
        share_id: { type: string }
        share_cookie_secret: { type: string, maxLength: 43 }
        share_secret: { type: string, maxLength: 43 }
    ReplaceVisitorAccessRequest:
      type: object
      additionalProperties: false
      required: [mode, ip, expected_revision]
      properties:
        mode: { $ref: "#/components/schemas/VisitorAccessMode" }
        ip:
          type: array
          maxItems: 256
          uniqueItems: true
          items: { type: string, minLength: 1, maxLength: 64 }
        expected_revision: { type: integer, format: int64, minimum: 1 }
    HTTPVisitorResponse:
      type: object
      additionalProperties: false
      required: [visit_allowed, team_member]
      properties:
        visit_allowed: { type: boolean }
        team_member: { type: boolean }
        identity_id: { type: string }
        display_name: { type: string }
        valid_until: { type: string, format: date-time }
    SSHUser:
      type: string
      minLength: 1
      maxLength: 32
      pattern: "^[a-z_][a-z0-9_-]{0,31}$"
      description: Exact nonroot local account. The root account is forbidden; SSH grants require this field and HTTP/database grants forbid it.
    SSHHostKey:
      type: string
      minLength: 1
      maxLength: 1024
      description: Registered Ed25519 SSH host public key in authorized-key format, without options or certificates. Required and immutable for managed SSH URLs; forbidden for other protocols. The private key stays with the publisher.
    CreateTeamVisitorGrantRequest:
      type: object
      additionalProperties: false
      properties:
        expires_at: { type: string, format: date-time }
        ssh_user: { $ref: "#/components/schemas/SSHUser" }
    CreateIdentityVisitorGrantRequest:
      type: object
      additionalProperties: false
      required: [identity_id]
      properties:
        identity_id: { $ref: "#/components/schemas/IdentityID" }
        expires_at: { type: string, format: date-time }
        ssh_user: { $ref: "#/components/schemas/SSHUser" }
    VisitorGrant:
      type: object
      additionalProperties: false
      required: [id, public_url_id, kind, created_at]
      properties:
        id: { type: string }
        public_url_id: { $ref: "#/components/schemas/PublicURLID" }
        kind: { type: string, enum: [team, identity] }
        identity_id: { type: string }
        ssh_user: { $ref: "#/components/schemas/SSHUser" }
        created_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
        revoked_at: { type: string, format: date-time }
    CreateVisitorInvitationRequest:
      type: object
      additionalProperties: false
      required: [email, token_digest, expires_at]
      properties:
        email: { type: string, maxLength: 320 }
        token_digest: { type: string, pattern: "^[0-9a-f]{64}$" }
        expires_at: { type: string, format: date-time }
        ssh_user: { $ref: "#/components/schemas/SSHUser" }
    VisitorInvitation:
      type: object
      additionalProperties: false
      required: [id, public_url_id, email, expires_at]
      properties:
        id: { type: string }
        public_url_id: { $ref: "#/components/schemas/PublicURLID" }
        email: { type: string }
        expires_at: { type: string, format: date-time }
        accepted_identity_id: { type: string }
        ssh_user: { $ref: "#/components/schemas/SSHUser" }
