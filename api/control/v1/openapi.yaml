openapi: 3.1.0
info:
  title: tnl control API
  version: 1.0.0
  license:
    name: BSD-3-Clause
    identifier: BSD-3-Clause
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
servers:
  - url: https://control.example.com
paths:
  /v1/private-services:
    get:
      operationId: listPrivateServices
      description: Team-owned saved services; never return target addresses or stream keys.
      security: [{ bearerAuth: [] }]
      parameters:
        [
          { $ref: "#/components/parameters/TeamIDQuery" },
          { $ref: "#/components/parameters/PrivateServiceCursor" },
        ]
      responses:
        "200":
          {
            description: Team inventory,
            content:
              { application/json: { schema: { $ref: "#/components/schemas/PrivateServicePage" } } },
          }
        default: { $ref: "#/components/responses/Problem" }
    post:
      operationId: createPrivateService
      description: Create a team-scoped saved name. No DNS record, public URL, certificate or dedicated visitor port is allocated.
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        {
          required: true,
          content:
            {
              application/json:
                { schema: { $ref: "#/components/schemas/CreatePrivateServiceRequest" } },
            },
        }
      responses:
        "201":
          {
            description: Saved private service,
            content:
              { application/json: { schema: { $ref: "#/components/schemas/PrivateService" } } },
          }
        default: { $ref: "#/components/responses/Problem" }
  /v1/private-services/{private_service_id}:
    get:
      operationId: getPrivateService
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/PrivateServiceID" }]
      responses:
        "200":
          {
            description: Saved service for an authorized team administrator,
            content:
              { application/json: { schema: { $ref: "#/components/schemas/PrivateService" } } },
          }
        default: { $ref: "#/components/responses/Problem" }
    delete:
      operationId: deletePrivateService
      description: Revoke access and close any run before tombstoning its ID-keyed ingress projection.
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/PrivateServiceID" }]
      responses:
        "204": { description: Service deleted }
        default: { $ref: "#/components/responses/Problem" }
  /v1/private-services/{private_service_id}/grants:
    get:
      operationId: listPrivateServiceGrants
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/PrivateServiceID" }]
      responses:
        "200":
          {
            description: Exact service grants,
            content:
              {
                application/json:
                  {
                    schema:
                      { type: array, items: { $ref: "#/components/schemas/PrivateServiceGrant" } },
                  },
              },
          }
        default: { $ref: "#/components/responses/Problem" }
    post:
      operationId: createPrivateServiceGrant
      security: [{ bearerAuth: [] }]
      parameters:
        [
          { $ref: "#/components/parameters/PrivateServiceID" },
          { $ref: "#/components/parameters/IdempotencyKey" },
        ]
      requestBody:
        {
          required: true,
          content:
            {
              application/json:
                { schema: { $ref: "#/components/schemas/CreatePrivateServiceGrantRequest" } },
            },
        }
      responses:
        "201":
          {
            description: Revocable team or identity grant,
            content:
              {
                application/json: { schema: { $ref: "#/components/schemas/PrivateServiceGrant" } },
              },
          }
        default: { $ref: "#/components/responses/Problem" }
  /v1/private-services/{private_service_id}/grants/{grant_id}:
    delete:
      operationId: revokePrivateServiceGrant
      security: [{ bearerAuth: [] }]
      parameters:
        [
          { $ref: "#/components/parameters/PrivateServiceID" },
          {
            name: grant_id,
            in: path,
            required: true,
            schema: { $ref: "#/components/schemas/PrivateServiceGrantID" },
          },
        ]
      responses:
        "204": { description: Grant revoked }
        default: { $ref: "#/components/responses/Problem" }
  /v1/private-services/{private_service_id}/invitations:
    get:
      operationId: listPrivateServiceInvitations
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/PrivateServiceID" }]
      responses:
        "200":
          description: Invitations for service administrators
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/PrivateServiceInvitation" }
        default: { $ref: "#/components/responses/Problem" }
    post:
      operationId: invitePrivateServiceVisitor
      security: [{ bearerAuth: [] }]
      parameters:
        [
          { $ref: "#/components/parameters/PrivateServiceID" },
          { $ref: "#/components/parameters/IdempotencyKey" },
        ]
      requestBody:
        {
          required: true,
          content:
            {
              application/json:
                { schema: { $ref: "#/components/schemas/CreatePrivateServiceInvitationRequest" } },
            },
        }
      responses:
        "201":
          {
            description: One-use verified-email invitation,
            content:
              {
                application/json:
                  { schema: { $ref: "#/components/schemas/PrivateServiceInvitation" } },
              },
          }
        default: { $ref: "#/components/responses/Problem" }
  /v1/private-services/{private_service_id}/invitations/{invitation_id}:
    delete:
      operationId: revokePrivateServiceInvitation
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: "#/components/parameters/PrivateServiceID" }
        - name: invitation_id
          in: path
          required: true
          schema: { $ref: "#/components/schemas/PrivateServiceInvitationID" }
      responses:
        "204": { description: Invitation and accepted identity grant revoked }
        default: { $ref: "#/components/responses/Problem" }
  /v1/private-service-invitations/accept:
    post:
      operationId: acceptPrivateServiceInvitation
      security: [{ bearerAuth: [] }]
      requestBody:
        {
          required: true,
          content:
            {
              application/json:
                {
                  schema:
                    {
                      type: object,
                      additionalProperties: false,
                      required: [secret],
                      properties: { secret: { type: string, minLength: 32, maxLength: 128 } },
                    },
                },
            },
        }
      responses:
        "200":
          {
            description: Exact identity grant,
            content:
              {
                application/json: { schema: { $ref: "#/components/schemas/PrivateServiceGrant" } },
              },
          }
        default: { $ref: "#/components/responses/Problem" }
  /v1/visitor/private-services:
    get:
      operationId: listAvailablePrivateServices
      description: Authorized saved private services for tnl connect, including offline services. Initial readiness requires two ready publisher connections; after that one surviving ready connection keeps a run available during replacement. Inventory never grants a stream ticket by itself and contains no target address, DNS or key material.
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/PrivateServiceCursor" }]
      responses:
        "200":
          {
            description: Authorized visitor inventory,
            content:
              { application/json: { schema: { $ref: "#/components/schemas/PrivateServicePage" } } },
          }
        default: { $ref: "#/components/responses/Problem" }
  /v1/private-services/{private_service_id}/connector-sessions:
    post:
      operationId: createPrivateConnectorSession
      description: Authorize one saved service for an identity and return a one-use credential for a shared ingress mux session. The ingress-observed source is bound when the session connects. This does not authorize visitor streams.
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/PrivateServiceID" }]
      responses:
        "201":
          description: Infrastructure session setup; no service run key or stream ticket
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PrivateConnectorSessionSetup" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/private-services/{private_service_id}/connect:
    post:
      operationId: createPrivateServiceTicket
      description: For EACH new visitor stream, recheck the exact service grant and ready run, then issue one short-lived ticket bound to this identity's authenticated ingress session and its observed source. The caller never supplies an IP address.
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/PrivateServiceID" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreatePrivateServiceTicketRequest" }
      responses:
        "201":
          {
            description: One-use connector ticket,
            content:
              {
                application/json:
                  { schema: { $ref: "#/components/schemas/PrivateServiceConnection" } },
              },
          }
        default: { $ref: "#/components/responses/Problem" }
  /v1/private-services/{private_service_id}/runs:
    post:
      operationId: preparePrivateServiceRun
      description: Reserve a new run ID, number and binding nonce under the exact publisher grant and enrolled signing key. Retrying the same idempotency key returns the same preparation; control does not generate or store a private TLS key.
      security: [{ publisherAuth: [] }]
      parameters:
        [
          { $ref: "#/components/parameters/PrivateServiceID" },
          { $ref: "#/components/parameters/IdempotencyKey" },
        ]
      responses:
        "201":
          {
            description: Prepared run for the publisher to sign,
            content:
              {
                application/json:
                  { schema: { $ref: "#/components/schemas/PrivateServiceRunPreparation" } },
              },
          }
        default: { $ref: "#/components/responses/Problem" }
  /v1/private-services/{private_service_id}/runs/{private_run_id}/bind:
    post:
      operationId: bindPrivateServiceRunKey
      description: Verify an Ed25519 signature from the enrolled, current publisher identity key over the exact prepared team/service/run/number/nonce/grant/key/idempotency tuple and the publisher-generated public TLS key. A retry must repeat the same proof and pin; it may rotate only the run token.
      security: [{ publisherAuth: [] }]
      parameters:
        - { $ref: "#/components/parameters/PrivateServiceID" }
        - name: private_run_id
          in: path
          required: true
          schema: { $ref: "#/components/schemas/PrivateRunID" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BindPrivateServiceRunKeyRequest" }
      responses:
        "200":
          description: Bound publisher-generated public key and current run token
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PrivateServiceRunSetup" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/private-services/{private_service_id}/runs/{private_run_id}:
    post:
      operationId: heartbeatPrivateServiceRun
      description: Renew only the current run under its exact publisher grant. First readiness requires two live relay services; one surviving ready connection can continue serving while the other is replaced.
      security: [{ privateRunAuth: [] }]
      parameters:
        - { $ref: "#/components/parameters/PrivateServiceID" }
        - name: private_run_id
          in: path
          required: true
          schema: { $ref: "#/components/schemas/PrivateRunID" }
      responses:
        "200":
          description: Current run and assignments
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PrivateServiceRunState" }
        default: { $ref: "#/components/responses/Problem" }
    delete:
      operationId: closePrivateServiceRun
      description: Close the exact run, invalidate tickets and its pinned public key, and publish a private-service tombstone. The publisher discards its local private key.
      security: [{ privateRunAuth: [] }]
      parameters:
        - { $ref: "#/components/parameters/PrivateServiceID" }
        - name: private_run_id
          in: path
          required: true
          schema: { $ref: "#/components/schemas/PrivateRunID" }
      responses:
        "204": { description: Run closed }
        default: { $ref: "#/components/responses/Problem" }
  /v1/browser/identity/login:
    get:
      operationId: beginBrowserIdentityLogin
      description: Start OIDC sign-in for the shared control-host browser identity session.
      security: []
      responses:
        "302": { description: Redirect to the identity provider }
        default: { $ref: "#/components/responses/Problem" }
  /v1/browser/identity/callback:
    get:
      operationId: completeBrowserIdentityLogin
      description: Finish OIDC sign-in; set a random, Secure, HttpOnly, SameSite=Lax __Host-tnl-identity cookie scoped to the control hostname. Store only its digest; the session expires within 24 hours.
      security: []
      parameters:
        - { name: state, in: query, required: true, schema: { type: string } }
        - { name: code, in: query, required: true, schema: { type: string } }
      responses:
        "303": { description: Return to the control-host approval page }
        default: { $ref: "#/components/responses/Problem" }
  /v1/browser/identity/session:
    post:
      operationId: createBrowserIdentitySession
      description: A CLI administrator may create a browser identity session bound to the parent control session. Revoking the parent invalidates the cookie. Never return authority tokens to the browser.
      security: [{ bearerAuth: [] }]
      responses:
        "204": { description: Set the host-only __Host-tnl-identity cookie }
        default: { $ref: "#/components/responses/Problem" }
    delete:
      operationId: revokeBrowserIdentitySession
      security: [{ browserIdentityCookie: [] }]
      responses:
        "204": { description: Session revoked and cookie cleared }
        default: { $ref: "#/components/responses/Problem" }
  /v1/publish-runs/{publish_run_id}/ssh-attempts:
    post:
      operationId: createSSHAttempt
      description: Current SSH run only. The publisher sends the trusted visitor source and SSH session hash, never a browser-provided address. The eight-character code is for lookup, not permission; return a separate private proof for publisher polling and claiming.
      security: [{ publishRunAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/PublishRunID" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateSSHAttemptRequest" }
      responses:
        "201":
          description: Pending attempt, one-time code and private publisher proof
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SSHAttemptCreated" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/browser/ssh-attempts/lookup:
    post:
      operationId: lookupSSHAttempt
      description: Requires a current shared browser identity session. Code lookup only displays the request; it never authorizes an SSH connection.
      security: [{ browserIdentityCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SSHAttemptCodeRequest" }
      responses:
        "200":
          description: Bounded attempt details for confirmation
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SSHAttemptBrowserView" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/browser/ssh-attempts/{attempt_id}/decision:
    post:
      operationId: decideSSHAttempt
      description: Check Origin and the current exact URL SSH grant and OS account under the URL lock before approval. The code identifies the request but carries no permission.
      security: [{ browserIdentityCookie: [] }]
      parameters: [{ $ref: "#/components/parameters/SSHAttemptID" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SSHAttemptDecisionRequest" }
      responses:
        "200":
          description: One durable approval or denial
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SSHAttemptState" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/publish-runs/{publish_run_id}/ssh-attempts/{attempt_id}:
    parameters:
      - { $ref: "#/components/parameters/PublishRunID" }
      - { $ref: "#/components/parameters/SSHAttemptID" }
    post:
      operationId: updateSSHAttempt
      description: Poll, atomically claim once, or cancel with the current run token and private publisher proof. Claim also binds the original visitor connection, source, account and SSH session hash. Expiry, run closure or replacement invalidates the attempt.
      security: [{ publishRunAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateSSHAttemptRequest" }
      responses:
        "200":
          description: Current attempt state; no browser credential or code
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SSHAttemptState" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/publish-runs/{publish_run_id}/visitor-access:
    post:
      operationId: authorizeHTTPVisitor
      security: [{ publishRunAuth: [] }]
      parameters:
        - { $ref: "#/components/parameters/PublishRunID" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/HTTPVisitorRequest" }
      responses:
        "200":
          description: Transaction-owned current HTTP permission and separate browser identity
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HTTPVisitorResponse" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/visitor/public-urls:
    get:
      operationId: listAvailablePublicURLs
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: team_id, in: query, schema: { type: string } }
        - { name: cursor, in: query, schema: { type: string } }
      responses:
        "200":
          description: Identity-wide visitor inventory without targets, policies or secrets
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AvailablePublicURLPage" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/public-urls/{public_url_id}/visitor-grants:
    parameters:
      - { $ref: "#/components/parameters/PublicURLID" }
    get:
      operationId: listVisitorGrants
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Grants for an owned public URL
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/VisitorGrant" } }
        default: { $ref: "#/components/responses/Problem" }
    post:
      operationId: createTeamVisitorGrant
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateTeamVisitorGrantRequest" }
      responses:
        "201":
          description: Exact URL grant for current team members
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VisitorGrant" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/public-urls/{public_url_id}/visitor-grants/{grant_id}:
    delete:
      operationId: revokeVisitorGrant
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: "#/components/parameters/PublicURLID" }
        - { name: grant_id, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: Grant revoked }
        default: { $ref: "#/components/responses/Problem" }
  /v1/public-urls/{public_url_id}/visitor-invitations:
    parameters:
      - { $ref: "#/components/parameters/PublicURLID" }
    get:
      operationId: listVisitorInvitations
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Named visitor invitations
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/VisitorInvitation" } }
        default: { $ref: "#/components/responses/Problem" }
    post:
      operationId: createVisitorInvitation
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateVisitorInvitationRequest" }
      responses:
        "201":
          description: One-use verified-email invitation without team membership
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VisitorInvitation" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/public-urls/{public_url_id}/visitor-invitations/{invitation_id}:
    delete:
      operationId: revokeVisitorInvitation
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: "#/components/parameters/PublicURLID" }
        - { name: invitation_id, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: Invitation and accepted grant revoked }
        default: { $ref: "#/components/responses/Problem" }
  /v1/visitor-invitations/accept:
    post:
      operationId: acceptVisitorInvitation
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [secret]
              properties:
                secret: { type: string, maxLength: 128 }
      responses:
        "200":
          description: Exact identity grant
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VisitorGrant" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/public-urls/{public_url_id}/access:
    parameters:
      - { $ref: "#/components/parameters/PublicURLID" }
    put:
      operationId: replaceVisitorAccess
      summary: Replace the complete live visitor access policy
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReplaceVisitorAccessRequest" }
      responses:
        "200":
          description: Saved policy for this public URL, active for new visitor work
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PublicURL" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/public-urls/{public_url_id}/visitor-certificate:
    post:
      operationId: issueVisitorCertificate
      description: Available for exact HTTP public URLs; SSH is ineligible.
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: "#/components/parameters/PublicURLID" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [csr]
              properties:
                csr: { type: string, maxLength: 16384 }
      responses:
        "201":
          description: URL-bound client certificate bounded by seven days and grant expiry
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VisitorCertificate" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/publish-runs/{publish_run_id}/visitor-certificate:
    post:
      operationId: authorizeVisitorCertificate
      description: Check a visitor certificate on an HTTP public URL; SSH does not issue visitor certificates.
      security: [{ publishRunAuth: [] }]
      parameters:
        - { $ref: "#/components/parameters/PublishRunID" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [publish_run_number, source_ip]
              properties:
                publish_run_number: { type: integer, format: int64, minimum: 1 }
                certificate: { type: string, maxLength: 16384 }
                source_ip: { type: string, maxLength: 64 }
      responses:
        "200":
          description: Current permission for this new connection
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [public_url_id]
                properties:
                  identity_id: { $ref: "#/components/schemas/IdentityID" }
                  public_url_id: { $ref: "#/components/schemas/PublicURLID" }
                  valid_until: { type: string, format: date-time }
        default: { $ref: "#/components/responses/Problem" }
  /v1/guest-demo/publisher:
    post:
      operationId: enrollGuestPublisher
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EnrollGuestPublisherRequest" }
      responses:
        "200":
          description: Trial-bound publisher for the assigned demo URL
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GuestPublisherIdentity" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/browser/login:
    get:
      operationId: beginPreviewBrowserLogin
      summary: Start sign-in for a preview visitor
      security: []
      parameters:
        - name: preview_id
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/PreviewID"
        - name: public_url_id
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/PublicURLID"
        - name: return_path
          in: query
          required: true
          schema:
            type: string
            pattern: "^/"
            maxLength: 2048
        - { name: switch_account, in: query, schema: { type: boolean } }
      responses:
        "302":
          description: Redirect to the configured identity provider
        default:
          $ref: "#/components/responses/Problem"
  /v1/browser/callback:
    get:
      operationId: completePreviewBrowserLogin
      summary: Return a signed-in visitor to the preview
      security: []
      parameters:
        - name: state
          in: query
          required: true
          schema:
            type: string
        - name: code
          in: query
          required: true
          schema:
            type: string
      responses:
        "303":
          description: Redirect to a one-time handoff on the public URL
        default:
          $ref: "#/components/responses/Problem"
  /v1/publish-runs/{publish_run_id}/browser/handoff:
    post:
      operationId: redeemPreviewBrowserHandoff
