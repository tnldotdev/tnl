openapi: 3.1.0
info:
  title: tnl authority API
  version: 1.0.0
  license:
    name: BSD-3-Clause
    identifier: BSD-3-Clause
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
servers:
  - url: https://control.example
paths:
  /v1/service/teams/{team_id}/private-services:
    parameters:
      - { $ref: "#/components/parameters/TeamID" }
      - { $ref: "#/components/parameters/ServiceActorToken" }
    get:
      operationId: listWebsitePrivateServices
      security: [{ webServiceAuth: [] }]
      description: Current owner/admin inventory for this exact team, with current company source checks. Cursor is included in the signed request target.
      parameters:
        - { name: cursor, in: query, schema: { type: string } }
      responses:
        "200":
          description: Saved services, including managed HTTP, with source context
          content:
            application/json:
              schema:
                { $ref: "../../control/v1/openapi.yaml#/components/schemas/PrivateServicePage" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/service/private-services/{private_service_id}:
    parameters:
      - { $ref: "#/components/parameters/PrivateServiceID" }
      - { $ref: "#/components/parameters/ServiceActorToken" }
    get:
      operationId: getWebsitePrivateService
      security: [{ webServiceAuth: [] }]
      responses:
        "200":
          description: Exact currently manageable saved service
          content:
            application/json:
              schema: { $ref: "../../control/v1/openapi.yaml#/components/schemas/PrivateService" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/service/private-services/{private_service_id}/grants:
    parameters:
      - { $ref: "#/components/parameters/PrivateServiceID" }
      - { $ref: "#/components/parameters/ServiceActorToken" }
    get:
      operationId: listWebsitePrivateServiceGrants
      security: [{ webServiceAuth: [] }]
      responses:
        "200":
          description: Exact service grants, including expired and revoked records
          content:
            application/json:
              schema:
                type: array
                items:
                  { $ref: "../../control/v1/openapi.yaml#/components/schemas/PrivateServiceGrant" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/service/private-services/{private_service_id}/grants/{grant_id}:
    parameters:
      - { $ref: "#/components/parameters/PrivateServiceID" }
      - { $ref: "#/components/parameters/ServiceActorToken" }
      - {
          name: grant_id,
          in: path,
          required: true,
          schema:
            { $ref: "../../control/v1/openapi.yaml#/components/schemas/PrivateServiceGrantID" },
        }
    delete:
      operationId: revokeWebsitePrivateServiceGrant
      security: [{ webServiceAuth: [] }]
      responses:
        "204": { description: Exact grant revoked }
        default: { $ref: "#/components/responses/Problem" }
  /v1/service/private-services/{private_service_id}/invitations:
    parameters:
      - { $ref: "#/components/parameters/PrivateServiceID" }
      - { $ref: "#/components/parameters/ServiceActorToken" }
    get:
      operationId: listWebsitePrivateServiceInvitations
      security: [{ webServiceAuth: [] }]
      responses:
        "200":
          description: Exact service invitations without secrets
          content:
            application/json:
              schema:
                type: array
                items:
                  {
                    $ref: "../../control/v1/openapi.yaml#/components/schemas/PrivateServiceInvitation",
                  }
        default: { $ref: "#/components/responses/Problem" }
    post:
      operationId: inviteWebsitePrivateServiceVisitor
      security: [{ webServiceAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              {
                $ref: "../../control/v1/openapi.yaml#/components/schemas/CreatePrivateServiceInvitationRequest",
              }
      responses:
        "201":
          description: Exact service invitation; secret returned only at creation
          content:
            application/json:
              schema:
                {
                  $ref: "../../control/v1/openapi.yaml#/components/schemas/PrivateServiceInvitation",
                }
        default: { $ref: "#/components/responses/Problem" }
  /v1/service/private-services/{private_service_id}/invitations/{invitation_id}:
    parameters:
      - { $ref: "#/components/parameters/PrivateServiceID" }
      - { $ref: "#/components/parameters/ServiceActorToken" }
      - {
          name: invitation_id,
          in: path,
          required: true,
          schema:
            {
              $ref: "../../control/v1/openapi.yaml#/components/schemas/PrivateServiceInvitationID",
            },
        }
    delete:
      operationId: revokeWebsitePrivateServiceInvitation
      security: [{ webServiceAuth: [] }]
      responses:
        "204": { description: Exact invitation and its accepted grant revoked }
        default: { $ref: "#/components/responses/Problem" }
  /v1/service/private-service-invitations/preview:
    post:
      operationId: previewWebsitePrivateServiceInvitation
      security: [{ webServiceAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/ServiceActorToken" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PrivateServiceInvitationCredential" }
      responses:
        "200":
          description: Bounded exact service and deadline for the matching verified recipient; does not accept
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PrivateServiceInvitationPreview" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/service/private-service-invitations/accept:
    post:
      operationId: acceptWebsitePrivateServiceInvitation
      security: [{ webServiceAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/ServiceActorToken" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PrivateServiceInvitationCredential" }
      responses:
        "200":
          description: Existing exact-service identity grant, retaining the invitation deadline
          content:
            application/json:
              schema:
                { $ref: "../../control/v1/openapi.yaml#/components/schemas/PrivateServiceGrant" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/service/private-services/{private_service_id}/http-grants:
    parameters:
      - { $ref: "#/components/parameters/PrivateServiceID" }
      - { $ref: "#/components/parameters/ServiceActorToken" }
    get:
      operationId: listWebsiteManagedHTTPGrants
      security: [{ webServiceAuth: [] }]
      responses:
        "200":
          description: Secretless credential summaries for this exact managed service
          content:
            application/json:
              schema:
                type: array
                items:
                  {
                    $ref: "../../control/v1/openapi.yaml#/components/schemas/ManagedHTTPGrantSummary",
                  }
        default: { $ref: "#/components/responses/Problem" }
    post:
      operationId: createWebsiteManagedHTTPGrant
      security: [{ webServiceAuth: [] }]
      description: Requires current management and visit access. Company-session-bound credential issuance still requires a control session; this bridge never creates a session or relaxes credential rechecks.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              {
                $ref: "../../control/v1/openapi.yaml#/components/schemas/CreateManagedHTTPGrantRequest",
              }
      responses:
        "201":
          description: Exact managed subject and one-time secret
          content:
            application/json:
              schema: { $ref: "../../control/v1/openapi.yaml#/components/schemas/ManagedHTTPGrant" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/service/private-services/{private_service_id}/http-grants/{grant_id}:
    parameters:
      - { $ref: "#/components/parameters/PrivateServiceID" }
      - { $ref: "#/components/parameters/ServiceActorToken" }
      - { name: grant_id, in: path, required: true, schema: { type: string } }
    delete:
      operationId: revokeWebsiteManagedHTTPGrant
      security: [{ webServiceAuth: [] }]
      responses:
        "204": { description: Exact managed HTTP credential revoked }
        default: { $ref: "#/components/responses/Problem" }
  /v1/workload-sessions/github:
    post:
      operationId: exchangeGitHubWorkload
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GitHubWorkloadExchange" }
      responses:
        "200":
          description: Retry-stable visitor-only key-bound session; 90 second lease, renew after 30 seconds, fixed absolute deadline
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkloadSession" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/workload-sessions/{session_id}/renew:
    parameters:
      - { name: session_id, in: path, required: true, schema: { type: string } }
    post:
      operationId: renewWorkloadSession
      security: [{ workloadAuth: [] }]
      responses:
        "200":
          description: Renewed lease within the original execution window
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkloadSession" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/workload-sessions/{session_id}:
    parameters:
      - { name: session_id, in: path, required: true, schema: { type: string } }
    delete:
      operationId: revokeWorkloadSession
      security: [{ workloadAuth: [] }]
      responses:
        "204": { description: Workload access revoked }
        default: { $ref: "#/components/responses/Problem" }
  /v1/service/teams/{team_id}/identity-connections:
    parameters:
      - { name: team_id, in: path, required: true, schema: { type: string } }
      - { $ref: "#/components/parameters/CompanyActorToken" }
    get:
      operationId: readCompanyConnections
      summary: Read active and pending connections with current owner proof
      security: [{ webServiceAuth: [] }]
      responses:
        "200":
          description: Current nonretired connection
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CompanyConnections" }
        default: { $ref: "#/components/responses/Problem" }
    post:
      operationId: beginIdentityConnectionSetup
      summary: Begin consent setup without changing current enforcement
      security: [{ webServiceAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateIdentityConnectionRequest" }
      responses:
        "201":
          description: Immutable team-bound connection and scoped provisioning credential
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IdentityConnectionSetup" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/service/teams/{team_id}/identity-connections/{identity_connection_id}:
    parameters:
      - { name: team_id, in: path, required: true, schema: { type: string } }
      - { name: identity_connection_id, in: path, required: true, schema: { type: string } }
      - { $ref: "#/components/parameters/CompanyActorToken" }
    delete:
      operationId: disconnectIdentityConnection
      summary: Abort pending consent or retire an active connection
      security: [{ webServiceAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expected_revision]
              properties:
                expected_revision: { type: integer, format: int64, minimum: 1 }
      responses:
        "204": { description: Connection revision advanced and old source work fenced }
        default: { $ref: "#/components/responses/Problem" }
  /v1/service/teams/{team_id}/identity-connections/{identity_connection_id}/activate:
    parameters:
      - { name: team_id, in: path, required: true, schema: { type: string } }
      - { name: identity_connection_id, in: path, required: true, schema: { type: string } }
      - { $ref: "#/components/parameters/CompanyActorToken" }
    post:
      operationId: activateIdentityConnection
      security: [{ webServiceAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expected_revision, setup_token]
              properties:
                expected_revision: { type: integer, format: int64, minimum: 1 }
                setup_token: { type: string }
      responses:
        "200":
          description: Consent verified; source revision advanced and provisioning token issued
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IdentityConnectionSecret" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/service/teams/{team_id}/identity-connections/{identity_connection_id}/provisioning-token:
    parameters:
      - { name: team_id, in: path, required: true, schema: { type: string } }
      - { name: identity_connection_id, in: path, required: true, schema: { type: string } }
      - { $ref: "#/components/parameters/CompanyActorToken" }
    post:
      operationId: rotateCompanyProvisioningToken
      security: [{ webServiceAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expected_revision]
              properties:
                expected_revision: { type: integer, format: int64 }
      responses:
        "200":
          description: Old provisioning credential revoked
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IdentityConnectionSecret" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/service/company-eligibility:
    post:
      operationId: provisionCompanyEligibility
      summary: Apply one revision-fenced eligibility delta without granting roles
      description: Requires both website authentication and the exact connection provisioning credential. Missing entries never remove members. A revision retry must have identical content.
      security: [{ webServiceAuth: [] }]
      parameters:
        - { name: X-Tnl-Provisioning-Token, in: header, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CompanyEligibilityRequest" }
      responses:
        "204": { description: Eligibility recorded; managed admission creates only member access }
        default: { $ref: "#/components/responses/Problem" }
  /v1/service/teams/{team_id}/memberships/{membership_id}/company-decision:
    parameters:
      - { name: team_id, in: path, required: true, schema: { type: string } }
      - { name: membership_id, in: path, required: true, schema: { type: string } }
      - { $ref: "#/components/parameters/CompanyActorToken" }
    put:
      operationId: setCompanyMembershipDecision
      security: [{ webServiceAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [suspended, personal_account_exception]
              properties:
                suspended: { type: boolean }
                personal_account_exception: { type: boolean }
      responses:
        "204": { description: Independent owner decision recorded and audited }
        default: { $ref: "#/components/responses/Problem" }
  /v1/service/teams/{team_id}/invitations/{invitation_id}/company-decision:
    parameters:
      - { name: team_id, in: path, required: true, schema: { type: string } }
      - { name: invitation_id, in: path, required: true, schema: { type: string } }
      - { $ref: "#/components/parameters/CompanyActorToken" }
    put:
      operationId: setCompanyInvitationException
      security: [{ webServiceAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [personal_account_exception]
              properties:
                personal_account_exception: { type: boolean }
      responses:
        "204": { description: Pending invitation owner exception recorded }
        default: { $ref: "#/components/responses/Problem" }
  /v1/service/teams/{team_id}/company-admissions:
    parameters:
      - { name: team_id, in: path, required: true, schema: { type: string } }
      - { $ref: "#/components/parameters/CompanyActorToken" }
    get:
      operationId: listCompanyAdmissions
      security: [{ webServiceAuth: [] }]
      responses:
        "200":
          description: Control-owned admission requests
          content:
            application/json:
              schema:
                { type: array, items: { $ref: "#/components/schemas/CompanyAdmissionRequest" } }
        default: { $ref: "#/components/responses/Problem" }
  /v1/service/teams/{team_id}/company-admissions/{request_id}:
    parameters:
      - { name: team_id, in: path, required: true, schema: { type: string } }
      - { name: request_id, in: path, required: true, schema: { type: string } }
      - { $ref: "#/components/parameters/CompanyActorToken" }
    post:
      operationId: decideCompanyAdmission
      security: [{ webServiceAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [connection_revision, decision]
              properties:
                connection_revision: { type: integer, format: int64 }
                decision:
                  {
                    type: string,
                    enum: [approved, denied],
                    x-enum-varnames: [AdmissionApproved, AdmissionDenied],
                  }
      responses:
        "204": { description: Current owner decision applied without role escalation }
        default: { $ref: "#/components/responses/Problem" }
  /v1/auth/company-admissions:
    post:
      operationId: requestCompanyAdmission
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [team_id, identity_connection_id, connection_revision, member_slug]
              properties:
                team_id: { type: string }
                identity_connection_id: { type: string }
                connection_revision: { type: integer, format: int64 }
                member_slug: { type: string }
      responses:
        "200":
          description: Eligible user request; managed admission may complete immediately
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CompanyAdmissionRequest" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/auth/company-intents:
    post:
      operationId: createCompanyLoginIntent
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [team_id]
              properties:
                team_id: { type: string }
      responses:
        "201":
          description: Exact current company selection and control-owned OIDC callback binding
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CompanyLoginIntent" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/auth/company-intents/{intent_id}/resolve:
    parameters:
      - { name: intent_id, in: path, required: true, schema: { type: string } }
    post:
      operationId: resolveCompanyLoginIntent
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CompanyIntentCredential" }
      responses:
        "200":
          description: Bound selection for the issuer or control browser handler
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CompanyLoginIntent" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/company-access/recovery:
    post:
      operationId: recoverCompanyOwner
      summary: Explicit audited recovery grants a personal-account exception to a nonremoved owner
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [team_id, membership_id]
              properties:
                team_id: { type: string }
                membership_id: { type: string }
      responses:
        "204":
          { description: Current owner or server administrator explicitly recovered this owner }
        default: { $ref: "#/components/responses/Problem" }
  /v1/teams/{team_id}/feedback-policy:
    parameters:
      - { name: team_id, in: path, required: true, schema: { type: string } }
    get:
      operationId: getTeamFeedbackPolicy
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Live feedback author policy
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TeamFeedbackPolicy" }
        default: { $ref: "#/components/responses/Problem" }
    put:
      operationId: setTeamFeedbackPolicy
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TeamFeedbackPolicy" }
      responses:
        "200":
          description: Policy applies to every subsequent feedback write
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TeamFeedbackPolicy" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/auth/browser-handoff:
    post:
      operationId: issueControlBrowserHandoff
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [public_url_id, refresh_token]
              properties:
                public_url_id: { type: string }
                refresh_token: { type: string }
      responses:
        "201":
          description: One-use handoff for an independent browser session
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [url]
                properties:
                  url: { type: string, pattern: "^https://" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/publisher-enrollments/redeem:
    post:
      operationId: redeemPublisherEnrollment
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RedeemPublisherEnrollmentRequest" }
      responses:
        "200":
          description: Registered client key and initial grant
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PublisherEnrollmentResult" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/publisher-token:
    post:
      operationId: exchangePublisherAssertion
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PublisherTokenRequest" }
      responses:
        "200":
          description: Short-lived token scoped to one current grant
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PublisherTokenResponse" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/publisher-keys/rotate:
    post:
      operationId: rotatePublisherKey
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RotatePublisherKeyRequest" }
      responses:
        "204": { description: Current key retired and replacement registered }
        default: { $ref: "#/components/responses/Problem" }
  /v1/service/identity-context:
    post:
      operationId: resolveServiceIdentity
      summary: Read current memberships for the signed-in website identity
      security:
        - webServiceAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ServiceIdentity"
      responses:
        "200":
          description: Current identity and memberships, without session credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IdentityContext"
        default:
          $ref: "#/components/responses/Problem"
  /v1/service/invitations/preview:
    post:
      operationId: previewServiceInvitation
      summary: Preview an invitation for the signed-in website identity
      security:
        - webServiceAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ServiceInvitationRequest"
      responses:
        "200":
          description: Invitation details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvitationPreview"
        default:
          $ref: "#/components/responses/Problem"
  /v1/service/invitations/accept:
    post:
      operationId: acceptServiceInvitation
      summary: Accept an invitation for the signed-in website identity
      security:
        - webServiceAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ServiceInvitationRequest"
      responses:
        "200":
          description: Accepted membership
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Membership"
        default:
          $ref: "#/components/responses/Problem"
  /v1/auth/device:
    post:
      operationId: startDeviceLogin
      summary: Start a control-owned device login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StartDeviceLoginRequest" }
      responses:
        "201":
          description: Private polling credential and browser approval instructions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceLoginChallenge"
        default:
          $ref: "#/components/responses/Problem"
  /v1/auth/device/poll:
    post:
      operationId: pollDeviceLogin
      summary: Read a device login result; safe to retry until expiration
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeviceLoginCredential"
      responses:
        "200":
          description: Pending or approved device login
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceLoginResult"
        default:
          $ref: "#/components/responses/Problem"
  /v1/auth/device/approve:
    get:
      operationId: beginDeviceBrowser
      summary: Begin browser authentication for a control-issued device code
      security: []
      parameters:
        - name: code
          in: query
          required: true
          schema: { type: string, minLength: 13, maxLength: 13 }
      responses:
        "302": { description: Redirect to the configured OIDC provider with state, nonce, and PKCE }
        default: { $ref: "#/components/responses/Problem" }
    post:
      operationId: approveDeviceBrowser
      summary: Confirm the displayed device code after browser OIDC authentication
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [code, binding]
              properties:
                code: { type: string, minLength: 13, maxLength: 13 }
                binding: { type: string, minLength: 43, maxLength: 43 }
      responses:
        "200": { description: Login approved; return to the terminal }
        default: { $ref: "#/components/responses/Problem" }
  /v1/auth/device/callback:
    get:
      operationId: completeDeviceBrowser
      summary: Redeem one state-bound authorization code and show explicit device confirmation
      security: []
      parameters:
        - {
            name: state,
            in: query,
            required: true,
            schema: { type: string, minLength: 43, maxLength: 43 },
          }
        - { name: code, in: query, schema: { type: string, maxLength: 4096 } }
        - { name: error, in: query, schema: { type: string, maxLength: 128 } }
      responses:
        "200":
          description: Device confirmation form bound to the authenticated browser
          content:
            text/html:
              schema: { type: string }
        default: { $ref: "#/components/responses/Problem" }
  /v1/auth/refresh:
    post:
      operationId: refreshControlSession
      summary: Rotate a control session's access and refresh tokens
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshControlSessionRequest"
      responses:
        "200":
          description: Rotated control session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ControlSessionResponse"
        default:
          $ref: "#/components/responses/Problem"
  /v1/auth/device/cancel:
    post:
      operationId: cancelDeviceLogin
      summary: Cancel an attempt and revoke any session it issued
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeviceLoginCredential"
      responses:
        "204":
          description: Attempt cancelled
        default:
          $ref: "#/components/responses/Problem"
  /v1/auth/logout:
    post:
      operationId: logoutControlSession
      summary: Revoke the authenticated control session
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Control session revoked
        default:
          $ref: "#/components/responses/BearerProblem"
  /v1/identity:
    get:
      operationId: getIdentityContext
      summary: Read the authenticated identity and memberships
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Identity context
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IdentityContext"
        default:
          $ref: "#/components/responses/BearerProblem"
  /v1/teams:
    get:
      operationId: listTeams
      summary: List teams for the authenticated identity
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Team page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamPage"
        default:
          $ref: "#/components/responses/BearerProblem"
    post:
      operationId: createTeam
      summary: Create an organization team
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTeamRequest"
      responses:
        "201":
          description: Team created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Team"
        default:
          $ref: "#/components/responses/Problem"
  /v1/teams/{team_id}:
    get:
      operationId: getTeam
      summary: Read one team
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TeamID"
      responses:
        "200":
          description: Team
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Team"
        default:
          $ref: "#/components/responses/Problem"
  /v1/teams/{team_id}/memberships:
    get:
      operationId: listTeamMemberships
      summary: List team memberships
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TeamID"
      responses:
        "200":
          description: Membership page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MembershipPage"
        default:
          $ref: "#/components/responses/Problem"
  /v1/teams/{team_id}/memberships/{membership_id}:
    patch:
      operationId: setMembershipRole
      summary: Change one membership's team role
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TeamID"
        - $ref: "#/components/parameters/MembershipID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetMembershipRoleRequest"
      responses:
        "200":
          description: Updated membership
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Membership"
        default:
          $ref: "#/components/responses/Problem"
    delete:
      operationId: removeMembership
      summary: Remove one membership
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TeamID"
        - $ref: "#/components/parameters/MembershipID"
      responses:
        "204":
          description: Membership removed
        default:
          $ref: "#/components/responses/Problem"
  /v1/teams/{team_id}/invitations:
    get:
      operationId: listTeamInvitations
      summary: List team invitations
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TeamID"
      responses:
        "200":
          description: Invitation page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvitationPage"
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: createTeamInvitation
      summary: Create an expiring invitation
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TeamID"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateInvitationRequest"
      responses:
        "201":
          description: Invitation and one-time secret
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvitationSecret"
        default:
          $ref: "#/components/responses/Problem"
  /v1/teams/{team_id}/invitations/{invitation_id}:
    delete:
      operationId: revokeTeamInvitation
      summary: Revoke one pending invitation
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TeamID"
        - $ref: "#/components/parameters/InvitationID"
      responses:
        "204":
          description: Invitation revoked
        default:
          $ref: "#/components/responses/Problem"
  /v1/invitations/accept:
    post:
      operationId: acceptInvitation
      summary: Accept an invitation with its secret
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AcceptInvitationRequest"
      responses:
        "200":
          description: Membership created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Membership"
        default:
          $ref: "#/components/responses/Problem"
  /v1/teams/{team_id}/domains:
    get:
      operationId: listTeamDomains
      summary: List domains available to the team
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TeamID"
      responses:
        "200":
          description: Domain page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DomainPage"
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: claimTeamDomain
      summary: Begin claiming one domain
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TeamID"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClaimDomainRequest"
      responses:
        "201":
          description: Domain claim
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Domain"
        default:
          $ref: "#/components/responses/Problem"
  /v1/teams/{team_id}/domains/{domain_id}/default:
    post:
      operationId: setTeamDefaultDomain
      summary: Select a ready default domain
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TeamID"
        - $ref: "#/components/parameters/DomainID"
      responses:
        "200":
          description: Updated team
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Team"
        default:
          $ref: "#/components/responses/Problem"
  /v1/teams/{team_id}/domains/{domain_id}:
    delete:
      operationId: releaseTeamDomain
      summary: Release one custom domain
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TeamID"
        - $ref: "#/components/parameters/DomainID"
      responses:
        "204":
          description: Domain release started
        default:
          $ref: "#/components/responses/Problem"
components:
  securitySchemes:
    workloadAuth:
      type: http
      scheme: bearer
      description: Visitor-only workload credential; never a human control session.
    webServiceAuth:
      type: http
      scheme: bearer
      description: Scoped website credential; identity facts are bound to the server-configured OIDC issuer.
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: OAuth access token
  parameters:
    PrivateServiceID:
      name: private_service_id
      in: path
      required: true
      schema: { $ref: "#/components/schemas/PrivateServiceID" }
    ServiceActorToken:
      name: X-Tnl-Actor-Token
      in: header
      required: true
      description: Configured-issuer, configured-client signed human assertion with unique jti and at most five-minute lifetime. Nonce is base64url(SHA256("tnl.service.actor.v1\n" + METHOD + "\n" + escaped path and raw query + "\n" + base64url(SHA256(exact body bytes)))); base64url has no padding. GET and DELETE use an empty body. Only these service bridge operations accept this purpose. Current control identity, roles, eligibility and signed company source contexts are checked transactionally; website credentials and token roles alone grant nothing.
      schema: { type: string }
    CompanyActorToken:
      name: X-Tnl-Actor-Token
      in: header
      required: true
      description: Fresh configured-issuer ID token; nonce is the operation-bound digest specified by company access. Its OIDC sub resolves the actor. The website credential alone grants no owner authority.
      schema: { type: string }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: '^\S(?:.*\S)?$'
    TeamID:
      name: team_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/TeamID"
    MembershipID:
      name: membership_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/MembershipID"
    InvitationID:
      name: invitation_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/InvitationID"
    DomainID:
      name: domain_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/DomainID"
  responses:
    Problem:
      description: Request failed
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    BearerProblem:
      description: Authentication failed
      headers:
        WWW-Authenticate:
          required: true
          schema:
            type: string
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
  schemas:
    PrivateServiceInvitationCredential:
      $ref: "../../control/v1/openapi.yaml#/components/schemas/PrivateServiceInvitationCredential"
    PrivateServiceInvitationPreview:
      type: object
      additionalProperties: false
      required: [private_service_id, team_id, name, protocol, expires_at]
      properties:
        private_service_id: { $ref: "#/components/schemas/PrivateServiceID" }
        team_id: { $ref: "#/components/schemas/TeamID" }
        name: { type: string }
        protocol: { type: string }
        expires_at: { type: string, format: date-time }
    GitHubWorkloadExchange:
      type: object
      additionalProperties: false
      required: [team_id, project_key, ci, assertion, public_key, signature]
      properties:
        team_id: { type: string, maxLength: 128 }
        project_key: { type: string, maxLength: 128 }
        ci: { type: string, maxLength: 32 }
        assertion: { type: string, minLength: 1, maxLength: 32768 }
        public_key: { type: string, description: Unpadded base64url Ed25519 public key }
        signature:
          {
            type: string,
            description: Unpadded base64url signature of the workload exchange digest,
          }
        services:
          { type: array, minItems: 1, maxItems: 32, uniqueItems: true, items: { type: string } }
    WorkloadSession:
      type: object
      additionalProperties: false
      required:
        [
          id,
          credential,
          team_id,
          project_key,
          ci,
          subject,
          lease_expires_at,
          expires_at,
          renew_after,
          service_ids,
          run_id,
          run_attempt,
          check_run_id,
        ]
      properties:
        id: { type: string, pattern: "^wls_[A-Za-z0-9]{22}$" }
        credential: { type: string }
        team_id: { type: string }
        project_key: { type: string }
        ci: { type: string }
        subject: { $ref: "../../control/v1/openapi.yaml#/components/schemas/VisitorSubject" }
        lease_expires_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
        renew_after: { type: string, format: date-time }
        service_ids: { type: array, maxItems: 32, items: { type: string } }
        run_id: { type: string }
        run_attempt: { type: string }
        check_run_id: { type: string }
    CompanyConnections:
      type: object
      additionalProperties: false
      properties:
        active: { $ref: "#/components/schemas/IdentityConnection" }
        setup: { $ref: "#/components/schemas/IdentityConnection" }
    CompanyAdmissionRequest:
      type: object
      additionalProperties: false
      required:
        [
          request_id,
          team_id,
          identity_connection_id,
          connection_revision,
          identity_id,
          subject,
          member_slug,
          state,
          created_at,
        ]
      properties:
        request_id: { type: string }
        team_id: { type: string }
        identity_connection_id: { type: string }
        connection_revision: { type: integer, format: int64 }
        identity_id: { type: string }
        subject: { type: string }
        member_slug: { type: string }
        state: { type: string }
        created_at: { type: string, format: date-time }
    CompanyIntentCredential:
      type: object
      additionalProperties: false
      required: [binding_token]
      properties:
        binding_token: { type: string }
    CompanyLoginIntent:
      type: object
      additionalProperties: false
      required:
        [
          intent_id,
          team_id,
          identity_connection_id,
          connection_revision,
          source_id,
          issuer,
          client_id,
          redirect_uri,
          nonce,
          expires_at,
        ]
      properties:
        intent_id: { type: string }
        team_id: { type: string }
        identity_connection_id: { type: string }
        connection_revision: { type: integer, format: int64 }
        source_id: { type: string }
        issuer: { type: string }
        client_id: { type: string }
        redirect_uri: { type: string }
        nonce: { type: string }
        binding_token: { type: string }
        expires_at: { type: string, format: date-time }
    IdentityConnectionSetup:
      type: object
      additionalProperties: false
      required:
        [
          identity_connection_id,
          team_id,
          issuer,
          source_id,
          admission,
          state,
          revision,
          setup_token,
          expires_at,
        ]
      properties:
        identity_connection_id: { type: string }
        team_id: { type: string }
        issuer: { type: string }
        source_id: { type: string }
        admission: { type: string }
        state: { type: string }
        revision: { type: integer, format: int64 }
        setup_token: { type: string }
        expires_at: { type: string, format: date-time }
    IdentityConnection:
      type: object
      additionalProperties: false
      required: [identity_connection_id, team_id, issuer, source_id, admission, state, revision]
      properties:
        identity_connection_id: { type: string }
        team_id: { type: string }
        issuer: { type: string }
        source_id: { type: string }
        admission:
          {
            type: string,
            enum: [approval, managed],
            x-enum-varnames: [ConnectionViewApproval, ConnectionViewManaged],
          }
        state:
          {
            type: string,
            enum: [pending, active, retired],
            x-enum-varnames: [ConnectionViewPending, ConnectionViewActive, ConnectionViewRetired],
          }
        revision: { type: integer, format: int64 }
    CreateIdentityConnectionRequest:
      type: object
      additionalProperties: false
      required: [admission, source_id]
      properties:
        source_id:
          {
            type: string,
            minLength: 1,
            maxLength: 256,
            description: Opaque immutable source fingerprint; provider configuration stays at the issuer,
          }
        admission:
          {
            type: string,
            enum: [approval, managed],
            x-enum-varnames: [CreateConnectionApproval, CreateConnectionManaged],
          }
        replace_id: { type: string }
        expected_revision: { type: integer, format: int64, minimum: 1 }
    IdentityConnectionSecret:
      type: object
      additionalProperties: false
      required:
        [
          identity_connection_id,
          team_id,
          issuer,
          source_id,
          admission,
          state,
          revision,
          provisioning_token,
        ]
      properties:
        identity_connection_id: { type: string }
        team_id: { type: string }
        issuer: { type: string }
        source_id: { type: string }
        admission:
          {
            type: string,
            enum: [approval, managed],
            x-enum-varnames: [ConnectionAdmissionApproval, ConnectionAdmissionManaged],
          }
        state: { type: string, enum: [active], x-enum-varnames: [ConnectionActive] }
        revision: { type: integer, format: int64 }
        provisioning_token:
          {
            type: string,
            description: One-time scoped provisioning credential; control stores only its digest,
          }
    CompanyEligibilityRequest:
      type: object
      additionalProperties: false
      required:
        [
          team_id,
          identity_connection_id,
          connection_revision,
          account_subject,
          subject,
          revision,
          eligible,
          valid_until,
          member_slug,
        ]
      properties:
        team_id: { type: string }
        identity_connection_id: { type: string }
        connection_revision: { type: integer, format: int64, minimum: 1 }
        account_subject:
          {
            type: string,
            description: Website OIDC sub under the configured issuer; never a directory subject or email,
          }
        subject: { type: string, maxLength: 256 }
        revision: { type: integer, format: int64, minimum: 1 }
        eligible: { type: boolean }
        valid_until: { type: string, format: date-time }
        member_slug: { type: string }
    VerifiedOIDCTeamContext:
      description: The configured issuer signs this value in the tnl_team_contexts ID-token claim. Control binds it to the identity and newly created session after verifying the token and consuming its assertion. This schema is documentation, never a client authentication input.
      type: object
      additionalProperties: false
      required:
        [team_id, identity_connection_id, connection_revision, source_id, subject, authenticated_at]
      properties:
        team_id: { type: string }
        identity_connection_id: { type: string }
        connection_revision: { type: integer, format: int64, minimum: 1 }
        subject: { type: string }
        source_id: { type: string }
        authenticated_at:
          {
            type: integer,
            format: int64,
            description: Unix seconds of actual company authentication; not token refresh time,
          }
    PrivateServiceID:
      $ref: "../../control/v1/openapi.yaml#/components/schemas/PrivateServiceID"
    TeamFeedbackPolicy:
      type: object
      additionalProperties: false
      required: [authors]
      properties:
        authors: { type: string, enum: [anyone, signed_in, team_members], default: anyone }
    RedeemPublisherEnrollmentRequest:
      type: object
      additionalProperties: false
      required: [enrollment_key, public_key]
      properties:
        enrollment_key: { type: string, minLength: 1, maxLength: 256 }
        public_key:
          {
            type: string,
            minLength: 43,
            maxLength: 43,
            description: Base64url unpadded Ed25519 public key,
          }
    PublisherEnrollmentResult:
      type: object
      additionalProperties: false
      required: [client_id, key_id, grant_id, team_id, kind]
      properties:
        client_id: { type: string }
        key_id: { type: string }
        grant_id: { type: string }
        team_id: { type: string }
        kind: { type: string, enum: [saved_url, namespace, private_service] }
        public_url_id: { type: string }
        private_service_id: { $ref: "#/components/schemas/PrivateServiceID" }
        domain_id: { type: string }
        namespace: { type: string }
    PublisherTokenRequest:
      type: object
      additionalProperties: false
      required: [grant_type, client_id, grant_id, client_assertion_type, client_assertion]
      properties:
        grant_type: { type: string, enum: [client_credentials] }
        client_id: { type: string }
        grant_id: { type: string }
        client_assertion_type:
          { type: string, enum: ["urn:ietf:params:oauth:client-assertion-type:jwt-bearer"] }
        client_assertion: { type: string, maxLength: 8192 }
    PublisherTokenResponse:
      type: object
      additionalProperties: false
      required: [access_token, token_type, expires_in, grant_id]
      properties:
        access_token: { type: string }
        token_type: { type: string, enum: [Bearer] }
        expires_in: { type: integer, minimum: 1, maximum: 300 }
        grant_id: { type: string }
    RotatePublisherKeyRequest:
      type: object
      additionalProperties: false
      required: [key_id, public_key, proof, current_proof]
      properties:
        key_id: { type: string }
        public_key: { type: string, minLength: 43, maxLength: 43 }
        proof: { type: string, maxLength: 8192 }
        current_proof:
          {
            type: string,
            maxLength: 8192,
            description: Current-key assertion whose audience binds the replacement key ID and public key,
          }
    EmailDeliveryRequest:
      description: Invitation email sent by control to POST /api/internal/tnl/emails on the configured mailer. HTTP 204 means the mailer sent it or already recorded that delivery_id.
      type: object
      additionalProperties: false
      required: [delivery_id, type, to, data]
      properties:
        delivery_id:
          $ref: "#/components/schemas/ResourceID"
        type:
          type: string
          enum: [team_invitation]
        to:
          type: string
          format: email
        data:
          $ref: "#/components/schemas/TeamInvitationEmail"
    TeamInvitationEmail:
      type: object
      additionalProperties: false
      required: [team_display_name, secret, expires_at]
      properties:
        team_display_name:
          $ref: "#/components/schemas/CanonicalLabel"
        secret:
          type: string
          minLength: 32
          maxLength: 4096
        expires_at:
          type: string
          format: date-time
    ServiceIdentity:
      type: object
      additionalProperties: false
      required: [subject, display_name]
      properties:
        subject:
          type: string
          minLength: 1
          maxLength: 256
        display_name:
          type: string
          minLength: 1
          maxLength: 256
        verified_email:
          type: string
          format: email
          maxLength: 320
    ServiceInvitationRequest:
      type: object
      additionalProperties: false
      required: [identity, secret]
      properties:
        identity:
          $ref: "#/components/schemas/ServiceIdentity"
        secret:
          type: string
          minLength: 32
          maxLength: 4096
    InvitationPreview:
      type: object
      additionalProperties: false
      required: [team_display_name, initial_role, expires_at]
      properties:
        team_display_name:
          $ref: "#/components/schemas/CanonicalLabel"
        initial_role:
          $ref: "#/components/schemas/TeamRole"
        expires_at:
          type: string
          format: date-time
    ResourceID:
      type: string
      minLength: 1
      maxLength: 256
      pattern: '^\S(?:.*\S)?$'
    IdentityID:
      $ref: "#/components/schemas/ResourceID"
    TeamID:
      $ref: "#/components/schemas/ResourceID"
    MembershipID:
      $ref: "#/components/schemas/ResourceID"
    InvitationID:
      $ref: "#/components/schemas/ResourceID"
    DomainID:
      $ref: "#/components/schemas/ResourceID"
    PublicURLID:
      $ref: "#/components/schemas/ResourceID"
    CanonicalHostname:
      type: string
      minLength: 1
      maxLength: 253
      pattern: "^[a-z0-9](?:[a-z0-9.-]*[a-z0-9])?$"
    CanonicalLabel:
      type: string
      minLength: 1
      maxLength: 63
      pattern: "^[a-z0-9](?:[a-z0-9-]*[a-z0-9])?$"
    StartDeviceLoginRequest:
      type: object
      additionalProperties: false
      properties:
        team: { type: string, maxLength: 128 }
        refresh_token: { type: string, maxLength: 4096 }
    DeviceLoginCredential:
      type: object
      additionalProperties: false
      required: [polling_credential]
      properties:
        polling_credential:
          type: string
          minLength: 43
          maxLength: 43
    DeviceLoginChallenge:
      type: object
      additionalProperties: false
      required: [polling_credential, approval_url, user_code, expires_at, interval_seconds]
      properties:
        polling_credential: { type: string, minLength: 43, maxLength: 43 }
        approval_url: { type: string, format: uri }
        user_code: { type: string, minLength: 13, maxLength: 13 }
        expires_at: { type: string, format: date-time }
        interval_seconds: { type: integer, minimum: 1, maximum: 30 }
    DeviceLoginResult:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status: { type: string, enum: [pending, approved, cancelled, denied] }
        session: { $ref: "#/components/schemas/ControlSessionResponse" }
    RefreshControlSessionRequest:
      type: object
      additionalProperties: false
      required: [refresh_token]
      properties:
        refresh_token:
          type: string
          minLength: 1
          maxLength: 4096
    ControlSessionResponse:
      type: object
      additionalProperties: false
      required:
        [session_id, access_token, access_expires_at, refresh_token, refresh_expires_at, identity]
      properties:
        company_authentication_expires_at:
          type: string
          format: date-time
          description: Fixed company authentication deadline, bounded by original authentication age and control refresh expiry; refreshing never advances it. Expired or revoked company context rejects refresh and requires a new company login intent.
        session_id:
          $ref: "#/components/schemas/ResourceID"
        access_token:
          type: string
          minLength: 1
        access_expires_at:
          type: string
          format: date-time
        refresh_token:
          type: string
          minLength: 1
        refresh_expires_at:
          type: string
          format: date-time
        identity:
          $ref: "#/components/schemas/IdentityContext"
    Identity:
      type: object
      additionalProperties: false
      required: [id, display_name, administrator, created_at]
      properties:
        id:
          $ref: "#/components/schemas/IdentityID"
        display_name:
          type: string
          minLength: 1
          maxLength: 256
        normalized_email:
          type: string
          format: email
        email_verified:
          type: boolean
          default: false
        administrator:
          type: boolean
        created_at:
          type: string
          format: date-time
    IdentityContext:
      type: object
      additionalProperties: false
      required: [identity, personal_team_id, memberships]
      properties:
        identity:
          $ref: "#/components/schemas/Identity"
        personal_team_id:
          $ref: "#/components/schemas/TeamID"
        default_team_id:
          $ref: "#/components/schemas/TeamID"
        memberships:
          type: array
          items:
            $ref: "#/components/schemas/Membership"
    TeamRole:
      type: string
      enum: [member, admin, owner]
    TeamKind:
      type: string
      enum: [personal, organization]
    Team:
      type: object
      additionalProperties: false
      required:
        [
          id,
          kind,
          display_name,
          managed_label,
          default_domain_id,
          policy_revision,
          created_at,
          updated_at,
        ]
      properties:
        id:
          $ref: "#/components/schemas/TeamID"
        kind:
          $ref: "#/components/schemas/TeamKind"
        display_name:
          $ref: "#/components/schemas/CanonicalLabel"
        managed_label:
          $ref: "#/components/schemas/CanonicalLabel"
        default_domain_id:
          $ref: "#/components/schemas/DomainID"
        policy_revision:
          type: integer
          format: int64
          minimum: 1
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    TeamPage:
      type: object
      additionalProperties: false
      required: [teams]
      properties:
        teams:
          type: array
          items:
            $ref: "#/components/schemas/Team"
        next_cursor:
          $ref: "#/components/schemas/TeamID"
    CreateTeamRequest:
      type: object
      additionalProperties: false
      required: [display_name]
      properties:
        display_name:
          $ref: "#/components/schemas/CanonicalLabel"
        member_slug:
          $ref: "#/components/schemas/CanonicalLabel"
    Membership:
      type: object
      additionalProperties: false
      required:
        [
          id,
          team_id,
          identity_id,
          team_display_name,
          team_kind,
          role,
          member_slug,
          managed_label,
          policy_revision,
          created_at,
          updated_at,
        ]
      properties:
        identity_connection_id:
          {
            type: string,
            description: Immutable managed admission source; absent for manually admitted members,
          }
        manual_suspended_at: { type: string, format: date-time }
        personal_account_exception: { type: boolean }
        company_sign_in_required: { type: boolean }
        active: { type: boolean }
        id:
          $ref: "#/components/schemas/MembershipID"
        team_id:
          $ref: "#/components/schemas/TeamID"
        identity_id:
          $ref: "#/components/schemas/IdentityID"
        team_display_name:
          $ref: "#/components/schemas/CanonicalLabel"
        team_kind:
          $ref: "#/components/schemas/TeamKind"
        role:
          $ref: "#/components/schemas/TeamRole"
        member_slug:
          $ref: "#/components/schemas/CanonicalLabel"
        managed_label:
          $ref: "#/components/schemas/CanonicalLabel"
        policy_revision:
          type: integer
          format: int64
          minimum: 1
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    MembershipPage:
      type: object
      additionalProperties: false
      required: [memberships]
      properties:
        memberships:
          type: array
          items:
            $ref: "#/components/schemas/Membership"
        next_cursor:
          $ref: "#/components/schemas/MembershipID"
    SetMembershipRoleRequest:
      type: object
      additionalProperties: false
      required: [role]
      properties:
        role:
          $ref: "#/components/schemas/TeamRole"
    InvitationState:
      type: string
      enum: [pending, accepted, revoked, expired]
    Invitation:
      type: object
      additionalProperties: false
      required: [id, team_id, member_slug, initial_role, state, created_at, expires_at]
      properties:
        personal_account_exception:
          { type: boolean, description: Explicit owner-approved personal-account sign-in exception }
        id:
          $ref: "#/components/schemas/InvitationID"
        team_id:
          $ref: "#/components/schemas/TeamID"
        member_slug:
          $ref: "#/components/schemas/CanonicalLabel"
        initial_role:
          $ref: "#/components/schemas/TeamRole"
        normalized_email_restriction:
          type: string
          format: email
        state:
          $ref: "#/components/schemas/InvitationState"
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
    InvitationPage:
      type: object
      additionalProperties: false
      required: [invitations]
      properties:
        invitations:
          type: array
          items:
            $ref: "#/components/schemas/Invitation"
        next_cursor:
          $ref: "#/components/schemas/InvitationID"
    InvitationSecret:
      type: object
      additionalProperties: false
      required: [invitation, secret]
      properties:
        invitation:
          $ref: "#/components/schemas/Invitation"
        secret:
          type: string
          minLength: 32
          maxLength: 4096
    CreateInvitationRequest:
      type: object
      additionalProperties: false
      required: [member_slug, initial_role, expires_at]
      properties:
        personal_account_exception:
          {
            type: boolean,
            default: false,
            description: Only a current team owner may explicitly allow personal-account sign-in,
          }
        member_slug:
          $ref: "#/components/schemas/CanonicalLabel"
        initial_role:
          $ref: "#/components/schemas/TeamRole"
        expires_at:
          type: string
          format: date-time
        email_restriction:
          type: string
          format: email
    AcceptInvitationRequest:
      type: object
      additionalProperties: false
      required: [secret]
      properties:
        secret:
          type: string
          minLength: 32
          maxLength: 4096
    DomainKind:
      type: string
      enum: [managed, custom]
    DomainState:
      type: string
      enum: [pending, ready, releasing, failed]
    DNSRecord:
      type: object
      additionalProperties: false
      required: [name, type, value]
      properties:
        name:
          $ref: "#/components/schemas/CanonicalHostname"
        type:
          type: string
          enum: [NS, TXT, CNAME, A, AAAA]
        value:
          type: string
    Domain:
      type: object
      additionalProperties: false
      required:
        [
          id,
          kind,
          canonical_domain,
          state,
          authority_revision,
          required_records,
          created_at,
          updated_at,
        ]
      properties:
        id:
          $ref: "#/components/schemas/DomainID"
        kind:
          $ref: "#/components/schemas/DomainKind"
        team_id:
          $ref: "#/components/schemas/TeamID"
        canonical_domain:
          $ref: "#/components/schemas/CanonicalHostname"
        state:
          $ref: "#/components/schemas/DomainState"
        authority_revision:
          type: integer
          format: int64
          minimum: 1
        required_records:
          type: array
          items:
            $ref: "#/components/schemas/DNSRecord"
        verified_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    DomainPage:
      type: object
      additionalProperties: false
      required: [domains]
      properties:
        domains:
          type: array
          items:
            $ref: "#/components/schemas/Domain"
        next_cursor:
          $ref: "#/components/schemas/DomainID"
    ClaimDomainRequest:
      type: object
      additionalProperties: false
      required: [domain]
      properties:
        domain:
          $ref: "#/components/schemas/CanonicalHostname"
        make_default:
          type: boolean
          default: false
    PublicURLScope:
      type: string
      enum: [member, shared]
    CertificateChallengeMethod:
      type: string
      enum: [dns-01]
    CertificatePlan:
      type: object
      additionalProperties: false
      required: [cache_key, scope, identifiers, challenge_method]
      properties:
        cache_key:
          type: string
          minLength: 1
          maxLength: 256
        scope:
          type: string
          minLength: 1
          maxLength: 256
        identifiers:
          type: array
          minItems: 1
          maxItems: 2
          uniqueItems: true
          items:
            type: string
            minLength: 1
            maxLength: 253
            pattern: "^(?:\\*\\.)?[a-z0-9](?:[a-z0-9.-]*[a-z0-9])?$"
        challenge_method:
          $ref: "#/components/schemas/CertificateChallengeMethod"
    Problem:
      type: object
      additionalProperties: false
      required: [type, title, status, code, detail, request_id]
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
          minLength: 1
        status:
          type: integer
          minimum: 400
          maximum: 599
        code:
          type: string
          enum:
            [
              invalid_request,
              unauthenticated,
              forbidden,
              manager_required,
              source_sign_in_required,
              verified_email_required,
              not_found,
              conflict,
              rate_limited,
              unavailable,
              internal,
              name_unavailable,
              policy_revision_stale,
              dns_setup_pending,
              custom_domains_disabled,
            ]
        request_id:
          type: string
          minLength: 1
        detail:
          type: string
          minLength: 1
        retry_at:
          type: string
          format: date-time
        details:
          type: object
          additionalProperties: true
