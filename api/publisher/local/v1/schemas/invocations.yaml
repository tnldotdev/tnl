schemas:
  PreparePublication:
    type: object
    additionalProperties: false
    required: [version, invocation_id, owner, pid, application_credential, resource_id]
    properties:
      version: { type: integer, enum: [1] }
      invocation_id: { type: string, maxLength: 128 }
      owner: { type: string, pattern: "^[a-f0-9]{32}$" }
      pid: { type: integer, minimum: 1 }
      application_credential: { type: string, minLength: 1, maxLength: 65536 }
      resource_id: { type: string, pattern: "^(url|svc)_[A-Za-z0-9]{22}$" }
      server_url: { type: string, maxLength: 4096 }
  PublicationAssignment:
    type: object
    additionalProperties: false
    required: [version, registration_id, resource_id, hostname, public_url]
    properties:
      version: { type: integer, enum: [1] }
      registration_id: { type: string, maxLength: 128, x-go-name: RegistrationID }
      resource_id: { type: string, pattern: "^(url|svc)_[A-Za-z0-9]{22}$" }
      hostname: { type: string, minLength: 1, maxLength: 253 }
      public_url:
        {
          type: string,
          maxLength: 4096,
          description: "HTTPS public endpoint, or empty for a connector-only HTTP service.",
        }
  Registration:
    type: object
    additionalProperties: false
    required: [version, registration_id, owner]
    properties:
      version: { type: integer, enum: [1] }
      registration_id: { type: string, maxLength: 128, x-go-name: RegistrationID }
      owner: { type: string, pattern: "^[a-f0-9]{32}$" }
      target: { type: string, maxLength: 4096, x-go-type-skip-optional-pointer: true }
  Lease:
    type: object
    additionalProperties: false
    required: [service, owner, pid, configuration_digest]
    properties:
      service: { type: string, maxLength: 63 }
      owner: { type: string, pattern: "^[a-f0-9]{32}$" }
      pid: { type: integer, minimum: 1 }
      configuration_digest:
        type: string
        pattern: "^[a-f0-9]{64}$"
        description: Digest of the complete selected native project snapshot, including configuration provenance and resolved server/team selection. The owner rejects another snapshot before reserving a service.
  Invocation:
    type: object
    additionalProperties: false
    required: [version, invocation_id, owner, pid, target]
    properties:
      version: { type: integer, enum: [1] }
      invocation_id: { type: string, maxLength: 128 }
      owner: { type: string, pattern: "^[a-f0-9]{32}$" }
      pid: { type: integer, minimum: 1 }
      target: { type: string, maxLength: 4096 }
      server_url: { type: string, maxLength: 4096 }
      publisher_identity_id: { type: string, maxLength: 128, x-go-type-skip-optional-pointer: true }
      publisher_credential_file:
        { type: string, maxLength: 4096, x-go-type-skip-optional-pointer: true }
      application_credential:
        type: string
        maxLength: 65536
        description: Private JSON credential document. Selects only an exact publication grant; never persisted in observations or supplied with another identity source.
      resource_id:
        type: string
        maxLength: 64
        description: Exact publication resource in the application credential document. This field cannot select ambient personal authority.
      access_mode: { type: string, enum: [restricted, anonymous] }
      require_post_quantum: { type: boolean }
      ip: { type: array, maxItems: 32, items: { type: string, maxLength: 64 } }
      limits:
        $ref: "../../../../control/public/v1/openapi.yaml#/components/schemas/PublisherApplicationLimits"
