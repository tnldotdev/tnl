paths:
  /v1/status:
    get:
      operationId: status
      description: Owner sees the transactional project snapshot; app sees only its service; invocation sees only its publication. Does not probe.
      responses:
        default: { $ref: "../openapi.yaml#/components/responses/Problem" }
        "200":
          description: snapshot with one opaque exclusive event cursor
          content:
            application/json:
              schema: { $ref: "../openapi.yaml#/components/schemas/Snapshot" }
  /v1/events:
    get:
      operationId: events
      description: Exclusively resume the native project journal. App and invocation capabilities see only their own observations; cursor-only events advance past unrelated work. Expired cursors return 410.
      parameters:
        - name: after
          in: query
          required: true
          schema: { type: string, maxLength: 128 }
      responses:
        default: { $ref: "../openapi.yaml#/components/responses/Problem" }
        "200":
          description: bounded retained events
          content:
            application/json:
              schema: { type: array, items: { $ref: "../openapi.yaml#/components/schemas/Event" } }
  /v1/check:
    post:
      operationId: check
      description: Perform fresh readiness checks, fenced by lease, target and exact run. App and invocation capabilities can check only their own publication and receive a scoped snapshot. Proofs stay in owner memory.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "../openapi.yaml#/components/schemas/Check" }
      responses:
        default: { $ref: "../openapi.yaml#/components/responses/Problem" }
        "200":
          description: fresh project snapshot
          content:
            application/json:
              schema: { $ref: "../openapi.yaml#/components/schemas/Snapshot" }
