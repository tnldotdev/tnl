openapi: 3.1.0
info:
  title: tnl publisher API
  version: 1.0.0
  license: { name: BSD-3-Clause, identifier: BSD-3-Clause }
  description: >-
    Same-origin browser feedback endpoints served by the local publisher on a
    public URL. The publisher supplies the preview, service, public URL, publish
    run, and current source state. Visitors cannot select that scope or supply
    control credentials. Current visitor access, including a sign-in, share,
    token, or explicitly anonymous URL, grants preview access; an optional IP
    filter never grants access by itself. The browser tracking cookie only selects a short failed-request
    trail. Requests and responses use Cache-Control no-store. Errors are plain
    text diagnostics and never include upstream response bodies or credentials.
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
servers: [{ url: / }]
security: [{}, { shareCookie: [] }]
paths:
  /__tnl/access:
    $ref: "./paths/browser-access.yaml#/paths/~1__tnl~1access"
  /__tnl/feedback:
    $ref: "./paths/feedback.yaml#/paths/~1__tnl~1feedback"
  /__tnl/feedback/{feedback_id}:
    $ref: "./paths/feedback.yaml#/paths/~1__tnl~1feedback~1{feedback_id}"
  /__tnl/feedback/{feedback_id}/events:
    $ref: "./paths/feedback.yaml#/paths/~1__tnl~1feedback~1{feedback_id}~1events"
  /__tnl/feedback/evidence:
    $ref: "./paths/feedback.yaml#/paths/~1__tnl~1feedback~1evidence"
components:
  securitySchemes:
    shareCookie:
      $ref: "./schemas/common.yaml#/securitySchemes/shareCookie"
  parameters:
    FeedbackID:
      $ref: "./schemas/common.yaml#/parameters/FeedbackID"
    IdempotencyKey:
      $ref: "./schemas/common.yaml#/parameters/IdempotencyKey"
  responses:
    FeedbackError:
      $ref: "./schemas/common.yaml#/responses/FeedbackError"
  schemas:
    BrowserAccessStatus:
      $ref: "./schemas/browser-access.yaml#/schemas/BrowserAccessStatus"
    BrowserFeedbackReportRequest:
      $ref: "./schemas/feedback.yaml#/schemas/BrowserFeedbackReportRequest"
    BrowserFeedbackEventRequest:
      $ref: "./schemas/feedback.yaml#/schemas/BrowserFeedbackEventRequest"
    BrowserFailedRequest:
      $ref: "./schemas/feedback.yaml#/schemas/BrowserFailedRequest"
    BrowserFeedbackEvidence:
      $ref: "./schemas/feedback.yaml#/schemas/BrowserFeedbackEvidence"
