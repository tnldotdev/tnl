paths:
  /__tnl/access:
    get:
      operationId: getBrowserAccessStatus
      summary: Check whether this browser can visit the current public URL
      description: >-
        Uses the same IP, share cookie, and team session decision as forwarding
        on this hostname. The response contains no share or session secrets.
        Denied visitors have only the bounded denied-connection budget.
        This endpoint does not reach the local service.
      responses:
        "200":
          description: Current browser access to the published preview
          content:
            application/json:
              schema:
                $ref: "../openapi.yaml#/components/schemas/BrowserAccessStatus"
        "403":
          description: This browser cannot currently visit the public URL
          content:
            application/json:
              schema:
                $ref: "../openapi.yaml#/components/schemas/BrowserAccessStatus"
        default:
          $ref: "../openapi.yaml#/components/responses/FeedbackError"
