openapi: 3.1.0
info:
  title: tnl ingress API
  version: 1.0.0
  license:
    name: BSD-3-Clause
    identifier: BSD-3-Clause
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
servers:
  - url: https://ingress-control.internal
security:
  - clusterAuth: []
paths:
  /internal/v1/ingresses/{ingress_id}/direct-services/admit:
    post:
      operationId: admitDirectServiceVisitor
      parameters: [{ $ref: "#/components/parameters/IngressID" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DirectServiceVisitorClaim" }
      responses:
        "200":
          description: Bounded pre-authentication admission and ready publisher selection
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DirectServiceVisitorAdmission" }
        default: { $ref: "#/components/responses/Problem" }
  /internal/v1/ingresses/{ingress_id}/direct-services/status:
    post:
      operationId: directServiceVisitorStatus
      parameters: [{ $ref: "#/components/parameters/IngressID" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DirectServiceVisitorLookup" }
      responses:
        "200":
          description: Current pending or authenticated admission, without extending a pending deadline
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DirectServiceVisitorStatus" }
        default: { $ref: "#/components/responses/Problem" }
  /internal/v1/ingresses/{ingress_id}/direct-services/promote:
    post:
      operationId: promoteDirectServiceVisitor
      parameters: [{ $ref: "#/components/parameters/IngressID" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DirectServiceVisitorLookup" }
      responses:
        "204":
          { description: Ingress has reserved ordinary capacity for this authenticated visitor }
        default: { $ref: "#/components/responses/Problem" }
  /internal/v1/ingresses/{ingress_id}/direct-services/close:
    post:
      operationId: closeDirectServiceVisitor
      parameters: [{ $ref: "#/components/parameters/IngressID" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DirectServiceVisitorLookup" }
      responses:
        "204": { description: Exact visitor reservation released; duplicate closure is harmless }
        default: { $ref: "#/components/responses/Problem" }
  /internal/v1/ingresses/{ingress_id}/service-observations:
    post:
      operationId: reportIngressServiceObservations
      parameters:
        - { $ref: "#/components/parameters/IngressID" }
        - { $ref: "#/components/parameters/IngressRunID" }
        - { $ref: "#/components/parameters/IngressLeaseRevision" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [events]
              properties:
                events:
                  {
                    type: array,
                    minItems: 1,
                    maxItems: 256,
                    items:
                      {
                        $ref: "../../control/v1/openapi.yaml#/components/schemas/ServiceObservation",
                      },
                  }
      responses:
        "200":
          {
            description: Accepted and duplicate observation counters,
            content:
              {
                application/json:
                  {
                    schema:
                      {
                        $ref: "../../control/v1/openapi.yaml#/components/schemas/ServiceObservationResult",
                      },
                  },
              },
          }
        default: { $ref: "#/components/responses/Problem" }
  /internal/v1/ingresses/{ingress_id}/transport-certificate:
    post:
      operationId: getIngressTransportCertificate
      description: Retrieve the control-managed infrastructure certificate and key for this exact current process lease. The hostname is selected from its registered connector identity; the request cannot choose another hostname.
      parameters: [{ $ref: "#/components/parameters/IngressID" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [ingress_run_id, ingress_lease_revision]
              properties:
                ingress_run_id: { $ref: "#/components/schemas/Identifier" }
                ingress_lease_revision: { type: integer, format: int64, minimum: 1 }
      responses:
        "200":
          description: Current lease-bound certificate and private key; refresh after lease renewal
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IngressTransportCertificate" }
        default: { $ref: "#/components/responses/Problem" }
  /internal/v1/ingresses/{ingress_id}/private-services/streams/{visitor_connection_id}:
    delete:
      operationId: closePrivateServiceStream
      parameters:
        - { $ref: "#/components/parameters/IngressID" }
        - name: visitor_connection_id
          in: path
          required: true
          schema: { $ref: "#/components/schemas/VisitorConnectionID" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [ingress_run_id, ingress_lease_revision, connector_session_id]
              properties:
                ingress_run_id: { $ref: "#/components/schemas/Identifier" }
                ingress_lease_revision: { type: integer, format: int64, minimum: 1 }
                connector_session_id: { $ref: "#/components/schemas/PrivateConnectorSessionID" }
      responses:
        "204": { description: Exact stream capacity released; duplicate closure is harmless }
        default: { $ref: "#/components/responses/Problem" }
  /internal/v1/ingresses/{ingress_id}/private-connector-sessions/claim:
    post:
      operationId: claimPrivateConnectorSession
      description: Authenticate an enrolled device on its assigned ingress lease and bind ingress-observed socket source metadata. Each stream is authorized separately for its exact service.
      parameters: [{ $ref: "#/components/parameters/IngressID" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PrivateConnectorSessionClaim" }
      responses:
        "200":
          description: Authenticated mux session, without visitor stream permission
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PrivateConnectorSessionResult" }
        default: { $ref: "#/components/responses/Problem" }
  /internal/v1/ingresses/{ingress_id}/private-services/snapshot:
    get:
      operationId: getPrivateServiceSnapshot
      description: Service/run IDs and connected relay assignments for a current ingress lease. Publisher stream keys are returned by authenticated control selection.
      parameters:
        - $ref: "#/components/parameters/IngressID"
        - $ref: "#/components/parameters/IngressRunID"
        - $ref: "#/components/parameters/IngressLeaseRevision"
      responses:
        "200":
          {
            description: Current private service projections,
            content:
              {
                application/json:
                  { schema: { $ref: "#/components/schemas/PrivateServiceSnapshot" } },
              },
          }
        default: { $ref: "#/components/responses/Problem" }
  /internal/v1/ingresses/{ingress_id}/private-services/events:
    get:
      operationId: getPrivateServiceEvents
      parameters:
        - $ref: "#/components/parameters/IngressID"
        - $ref: "#/components/parameters/IngressRunID"
        - $ref: "#/components/parameters/IngressLeaseRevision"
        - {
            name: after,
            in: query,
            required: true,
            schema: { type: integer, format: int64, minimum: 0 },
          }
      responses:
        "200":
          {
            description: Ordered private projections and tombstones,
            content:
              {
                application/json:
                  { schema: { $ref: "#/components/schemas/PrivateServiceSnapshot" } },
              },
          }
        default: { $ref: "#/components/responses/Problem" }
  /internal/v1/ingresses/{ingress_id}/private-services/claim:
    post:
      operationId: authorizePrivateServiceStream
      description: Authorize each new stream against the live enrolled device and exact service grant. The connector pins the selected run key before application bytes. Ingress alone supplies the original source.
      parameters: [{ $ref: "#/components/parameters/IngressID" }]
      requestBody:
        {
          required: true,
          content:
            {
              application/json:
                { schema: { $ref: "#/components/schemas/PrivateServiceStreamClaim" } },
            },
        }
      responses:
        "200":
          {
            description: Authorized run and visitor connection,
            content:
              {
                application/json:
                  { schema: { $ref: "#/components/schemas/PrivateServiceStreamResult" } },
              },
          }
        default: { $ref: "#/components/responses/Problem" }
  /internal/v1/ingresses/{ingress_id}/private-services/recheck:
    post:
      operationId: recheckPrivateServiceVisitor
      description: Check an admitted visitor connection against its current service, run, enrolled device, connector session, identity, ingress-observed source, grant and ingress lease. An explicit denial closes the stream; an unavailable response never extends its hard deadline.
      parameters: [{ $ref: "#/components/parameters/IngressID" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PrivateServiceVisitorRecheck" }
      responses:
        "200":
          description: Current permission for one already admitted visitor
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PrivateServiceVisitorRecheckResult" }
        default: { $ref: "#/components/responses/Problem" }
  /internal/v1/ingresses/register:
    post:
      operationId: registerIngress
      summary: Register one ingress process run
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IngressRegistration"
      responses:
        "200":
          description: Ingress lease created or renewed when the same registration is repeated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IngressLease"
        default:
          $ref: "#/components/responses/Problem"
  /internal/v1/ingresses/{ingress_id}/renew:
    post:
      operationId: renewIngress
      summary: Renew a matching ingress lease
      parameters:
        - $ref: "#/components/parameters/IngressID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IngressRenewal"
      responses:
        "200":
          description: Ingress lease renewed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IngressLease"
        default:
          $ref: "#/components/responses/Problem"
  /internal/v1/ingresses/{ingress_id}/drain:
    post:
      operationId: drainIngress
      summary: Stop a matching ingress process from accepting new visitors
      parameters:
        - $ref: "#/components/parameters/IngressID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IngressDrainRequest"
      responses:
        "200":
          description: Ingress drain recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IngressLease"
        default:
          $ref: "#/components/responses/Problem"
  /internal/v1/ingresses/{ingress_id}/routing-table/snapshot:
    get:
      operationId: getIngressRoutingTableSnapshot
      summary: Load a consistent ingress routing-table snapshot
      parameters:
        - $ref: "#/components/parameters/IngressID"
        - $ref: "#/components/parameters/IngressRunID"
        - $ref: "#/components/parameters/IngressLeaseRevision"
      responses:
        "200":
          description: Current ingress routing-table snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IngressRoutingTableSnapshot"
        default:
          $ref: "#/components/responses/Problem"
  /internal/v1/ingresses/{ingress_id}/routing-table/events:
    get:
      operationId: getIngressRoutingTableEvents
      summary: Wait for ordered ingress routing-table events
      parameters:
        - $ref: "#/components/parameters/IngressID"
        - $ref: "#/components/parameters/IngressRunID"
        - $ref: "#/components/parameters/IngressLeaseRevision"
        - name: after
          in: query
          required: true
          schema:
            type: integer
            format: int64
            minimum: 0
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 256
        - name: wait
          in: query
          description: Maximum long-poll wait as a whole-second duration.
          schema:
            type: string
            pattern: "^(?:[0-9]|1[0-9]|2[0-5])s$"
            default: 25s
      responses:
        "200":
          description: Ordered ingress routing-table event page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IngressRoutingTablePage"
        "409":
          description: Revision was compacted and a new snapshot is required
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /internal/v1/ingresses/{ingress_id}/usage-reports:
    post:
      operationId: reportIngressUsage
      summary: Store cumulative public URL usage from one ingress process run
      parameters:
        - $ref: "#/components/parameters/IngressID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IngressUsageReportBatch"
      responses:
        "204":
          description: Usage reports committed or replayed
        default:
          $ref: "#/components/responses/Problem"
  /internal/v1/ingresses/{ingress_id}/public-url-recovery/{recovery_episode_id}/observed:
    post:
      operationId: observePublicURLRecovery
      summary: Record the first publisher byte after public URL recovery
      parameters:
        - $ref: "#/components/parameters/IngressID"
        - name: recovery_episode_id
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PublicURLRecoveryObservationRequest"
      responses:
        "200":
          description: Recovery observation committed or replayed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicURLRecoveryObservation"
        default:
          $ref: "#/components/responses/Problem"
components:
  securitySchemes:
    clusterAuth:
      type: http
      scheme: bearer
      bearerFormat: tnl cluster secret
  parameters:
    IngressID:
      name: ingress_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Identifier"
    IngressRunID:
      name: ingress_run_id
      in: query
      required: true
      schema:
        $ref: "#/components/schemas/Identifier"
    IngressLeaseRevision:
      name: ingress_lease_revision
      in: query
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
  responses:
    Problem:
      description: Request failed
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
  schemas:
    IngressTransportCertificate:
      type: object
      additionalProperties: false
      required: [trust, private_key_pem]
      properties:
        trust: { $ref: "../../control/v1/openapi.yaml#/components/schemas/IngressTransportTrust" }
        private_key_pem: { type: string, minLength: 1, maxLength: 16384 }
    PrivateServiceID:
      type: string
      pattern: "^psvc_[A-Za-z0-9]{22}$"
    PrivateRunID:
      type: string
      pattern: "^psrun_[A-Za-z0-9]{22}$"
    PrivateConnectorSessionID:
      type: string
      pattern: "^pcs_[A-Za-z0-9]{22}$"
    VisitorConnectionID:
      type: string
      pattern: "^vc_[A-Za-z0-9]{22}$"
    PrivateConnectorSessionClaim:
      type: object
      additionalProperties: false
      required:
        [
          ingress_run_id,
          ingress_lease_revision,
          private_service_id,
          connector_session_id,
          session_credential,
          observed_source_ip,
          subject,
          nonce,
          signature,
        ]
      properties:
        ingress_run_id: { $ref: "#/components/schemas/Identifier" }
        ingress_lease_revision: { type: integer, format: int64, minimum: 1 }
        private_service_id: { $ref: "#/components/schemas/PrivateServiceID" }
        connector_session_id: { $ref: "#/components/schemas/PrivateConnectorSessionID" }
        session_credential: { type: string, minLength: 32, maxLength: 512 }
        subject: { $ref: "../../control/v1/openapi.yaml#/components/schemas/VisitorSubject" }
        nonce: { type: string, pattern: "^[0-9a-f]{64}$" }
        signature: { type: string, pattern: "^[A-Za-z0-9_-]{86}$" }
        observed_source_ip:
          {
            type: string,
            minLength: 3,
            maxLength: 45,
            description: Trusted original source observed by ingress on this mux socket. The connector never supplies this value.,
          }
    PrivateConnectorSessionResult:
      type: object
      additionalProperties: false
      required: [connector_session_id, private_service_id, subject, observed_source_ip, expires_at]
      properties:
        connector_session_id: { $ref: "#/components/schemas/PrivateConnectorSessionID" }
        private_service_id: { $ref: "#/components/schemas/PrivateServiceID" }
        subject: { $ref: "../../control/v1/openapi.yaml#/components/schemas/VisitorSubject" }
        observed_source_ip: { type: string, minLength: 3, maxLength: 45 }
        expires_at: { type: string, format: date-time }
    DirectServiceVisitorClaim:
      type: object
      additionalProperties: false
      required:
        [
          ingress_run_id,
          ingress_lease_revision,
          ingress_pool_id,
          destination_port,
          observed_source_ip,
          visitor_connection_id,
        ]
      properties:
        ingress_run_id: { $ref: "#/components/schemas/Identifier" }
        ingress_lease_revision: { type: integer, format: int64, minimum: 1 }
        ingress_pool_id: { type: string, minLength: 1, maxLength: 128 }
        destination_port: { type: integer, minimum: 1024, maximum: 65535 }
        observed_source_ip: { type: string, minLength: 1, maxLength: 64 }
        visitor_connection_id: { $ref: "#/components/schemas/VisitorConnectionID" }
    DirectServiceVisitorLookup:
      type: object
      additionalProperties: false
      required: [ingress_run_id, ingress_lease_revision, visitor_connection_id]
      properties:
        ingress_run_id: { $ref: "#/components/schemas/Identifier" }
        ingress_lease_revision: { type: integer, format: int64, minimum: 1 }
        visitor_connection_id: { $ref: "#/components/schemas/VisitorConnectionID" }
    DirectServiceVisitorAdmission:
      type: object
      additionalProperties: false
      required:
        [
          private_service_id,
          private_run_id,
          run_number,
          visitor_connection_id,
          expires_at,
          connected_relays,
        ]
      properties:
        private_service_id: { $ref: "#/components/schemas/PrivateServiceID" }
        private_run_id: { $ref: "#/components/schemas/PrivateRunID" }
        run_number: { type: integer, format: int64, minimum: 1 }
        visitor_connection_id: { $ref: "#/components/schemas/VisitorConnectionID" }
        expires_at: { type: string, format: date-time }
        connected_relays:
          type: array
          minItems: 1
          maxItems: 2
          items: { $ref: "#/components/schemas/PrivateServiceRelay" }
    DirectServiceVisitorStatus:
      type: object
      additionalProperties: false
      required: [state, valid_until]
      properties:
        state:
          {
            type: string,
            enum: [pending, authenticated, allowed, denied],
            x-enum-varnames:
              [
                DirectVisitorPending,
                DirectVisitorAuthenticated,
                DirectVisitorAllowed,
                DirectVisitorDenied,
              ],
          }
        valid_until: { type: string, format: date-time }
    PrivateServiceProjection:
      type: object
      additionalProperties: false
      required: [revision, private_service_id, kind, expires_at]
      properties:
        revision: { type: integer, format: int64, minimum: 1 }
        private_service_id: { $ref: "#/components/schemas/PrivateServiceID" }
        kind: { type: string, enum: [upsert, tombstone] }
        private_run_id: { $ref: "#/components/schemas/PrivateRunID" }
        run_number: { type: integer, format: int64, minimum: 1 }
        expires_at: { type: string, format: date-time }
        connected_relays:
          {
            type: array,
            minItems: 1,
            maxItems: 2,
            items: { $ref: "#/components/schemas/PrivateServiceRelay" },
          }
    PrivateServiceRelay:
      type: object
      additionalProperties: false
      required:
        [
          publisher_connection_id,
          connection_slot,
          connection_assignment_revision,
          internal_relay_address,
          tls_server_name,
          relay_service_id,
          relay_id,
          relay_run_id,
          relay_lease_revision,
          lease_expires_at,
        ]
      properties:
        publisher_connection_id: { $ref: "#/components/schemas/Identifier" }
        connection_slot: { type: integer, minimum: 0, maximum: 1 }
        connection_assignment_revision: { type: integer, format: int64, minimum: 1 }
        internal_relay_address: { type: string, minLength: 1 }
        tls_server_name: { type: string, minLength: 1, maxLength: 253 }
        relay_service_id: { $ref: "#/components/schemas/Identifier" }
        relay_id: { $ref: "#/components/schemas/Identifier" }
        relay_run_id: { $ref: "#/components/schemas/Identifier" }
        relay_lease_revision: { type: integer, format: int64, minimum: 1 }
        lease_expires_at: { type: string, format: date-time }
    PrivateServiceSnapshot:
      type: object
      additionalProperties: false
      required: [revision, entries]
      properties:
        revision: { type: integer, format: int64, minimum: 0 }
        entries: { type: array, items: { $ref: "#/components/schemas/PrivateServiceProjection" } }
    PrivateServiceStreamClaim:
      type: object
      additionalProperties: false
      required:
        [
          ingress_run_id,
          ingress_lease_revision,
          private_service_id,
          private_run_id,
          run_number,
          connector_session_id,
          observed_source_ip,
          visitor_connection_id,
        ]
      properties:
        ingress_run_id: { $ref: "#/components/schemas/Identifier" }
        ingress_lease_revision: { type: integer, format: int64, minimum: 1 }
        private_service_id: { $ref: "#/components/schemas/PrivateServiceID" }
        private_run_id: { $ref: "#/components/schemas/PrivateRunID" }
        run_number: { type: integer, format: int64, minimum: 1 }
        connector_session_id: { $ref: "#/components/schemas/PrivateConnectorSessionID" }
        observed_source_ip:
          {
            type: string,
            minLength: 3,
            maxLength: 45,
            description: Copied by ingress from the authenticated mux socket,
            not parsed from the visitor stream.,
          }
        visitor_connection_id: { $ref: "#/components/schemas/VisitorConnectionID" }
    PrivateServiceStreamResult:
      type: object
      additionalProperties: false
      required:
        [
          private_service_id,
          private_run_id,
          run_number,
          connector_session_id,
          subject,
          observed_source_ip,
          visitor_connection_id,
          expires_at,
          valid_until,
          grant_revision,
        ]
      properties:
        private_service_id: { $ref: "#/components/schemas/PrivateServiceID" }
        private_run_id: { $ref: "#/components/schemas/PrivateRunID" }
        run_number: { type: integer, format: int64, minimum: 1 }
        connector_session_id: { $ref: "#/components/schemas/PrivateConnectorSessionID" }
        subject: { $ref: "../../control/v1/openapi.yaml#/components/schemas/VisitorSubject" }
        observed_source_ip: { type: string, minLength: 3, maxLength: 45 }
        visitor_connection_id: { $ref: "#/components/schemas/VisitorConnectionID" }
        expires_at: { type: string, format: date-time }
        valid_until:
          type: string
          format: date-time
          description: Hard deadline bounded by the current grant, connector session, publisher run, ingress and live relay leases, and at most two minutes from this decision.
        grant_revision: { type: integer, format: int64, minimum: 1 }
    PrivateServiceVisitorRecheck:
      type: object
      additionalProperties: false
      required:
        [
          ingress_run_id,
          ingress_lease_revision,
          private_service_id,
          private_run_id,
          run_number,
          connector_session_id,
          subject,
          observed_source_ip,
          visitor_connection_id,
        ]
      properties:
        ingress_run_id: { $ref: "#/components/schemas/Identifier" }
        ingress_lease_revision: { type: integer, format: int64, minimum: 1 }
        private_service_id: { $ref: "#/components/schemas/PrivateServiceID" }
        private_run_id: { $ref: "#/components/schemas/PrivateRunID" }
        run_number: { type: integer, format: int64, minimum: 1 }
        connector_session_id: { $ref: "#/components/schemas/PrivateConnectorSessionID" }
        subject: { $ref: "../../control/v1/openapi.yaml#/components/schemas/VisitorSubject" }
        observed_source_ip:
          {
            type: string,
            minLength: 3,
            maxLength: 45,
            description: Copied from the original ingress-observed mux source; never supplied by a visitor.,
          }
        visitor_connection_id: { $ref: "#/components/schemas/VisitorConnectionID" }
    PrivateServiceVisitorRecheckResult:
      type: object
      additionalProperties: false
      required: [allowed, recheck_at, valid_until]
      properties:
        allowed: { type: boolean }
        recheck_at:
          {
            type: string,
            format: date-time,
            description: Ingress must check again no later than this time,
            and must cap loss of control at two minutes after the last successful check.,
          }
        valid_until:
          type: string
          format: date-time
          description: Current hard deadline, including grant and run expiration; never later than two minutes from this decision.
    Identifier:
      type: string
      minLength: 1
      maxLength: 256
      pattern: '^\S(?:.*\S)?$'
    IngressRegistration:
      type: object
      additionalProperties: false
      required:
        [
          ingress_id,
          ingress_run_id,
          protocol_version,
          connection_capacity,
          ingress_pool_id,
          service_ports,
        ]
      properties:
        ingress_pool_id:
          $ref: "#/components/schemas/Identifier"
        service_ports:
          type: array
          maxItems: 256
          uniqueItems: true
          description: Sorted managed ports bound before registration or exposed by the trusted destination-metadata proxy.
          items:
            type: integer
            minimum: 1024
            maximum: 65535
        private_connector_address:
          type: string
          maxLength: 512
          description: Direct reachable endpoint for this ingress process; required for private visitor placement.
        private_connector_tls_server_name:
          type: string
          maxLength: 253
          description: Infrastructure TLS identity presented on the direct connector endpoint.
        ingress_id:
          $ref: "#/components/schemas/Identifier"
        ingress_run_id:
          $ref: "#/components/schemas/Identifier"
        protocol_version:
          type: integer
          format: int64
          minimum: 1
        connection_capacity:
          type: integer
          format: int64
          minimum: 1
    IngressLeaseIdentity:
      type: object
      additionalProperties: false
      required: [ingress_id, ingress_run_id, ingress_lease_revision]
      properties:
        ingress_id:
          $ref: "#/components/schemas/Identifier"
        ingress_run_id:
          $ref: "#/components/schemas/Identifier"
        ingress_lease_revision:
          type: integer
          format: int64
          minimum: 1
    IngressRenewal:
      unevaluatedProperties: false
      allOf:
        - $ref: "#/components/schemas/IngressLeaseIdentity"
        - type: object
          required: [reported_connections, routing_table_revision]
          properties:
            reported_connections:
              type: integer
              format: int64
              minimum: 0
            routing_table_revision:
              type: integer
              format: int64
              minimum: 0
    IngressDrainRequest:
      unevaluatedProperties: false
      allOf:
        - $ref: "#/components/schemas/IngressLeaseIdentity"
        - type: object
          required: [deadline]
          properties:
            deadline:
              type: string
              format: date-time
    IngressLease:
      type: object
      additionalProperties: false
      required:
        - ingress_id
        - ingress_run_id
        - ingress_lease_revision
        - protocol_version
        - connection_capacity
        - reported_connections
        - routing_table_revision
        - visitor_network_hash_keys
        - draining
        - registered_at
        - renewed_at
        - lease_expires_at
      properties:
        ingress_id:
          $ref: "#/components/schemas/Identifier"
        ingress_run_id:
          $ref: "#/components/schemas/Identifier"
        ingress_lease_revision:
          type: integer
          format: int64
          minimum: 1
        protocol_version:
          type: integer
          format: int64
          minimum: 1
        connection_capacity:
          type: integer
          format: int64
          minimum: 1
        reported_connections:
          type: integer
          format: int64
          minimum: 0
        routing_table_revision:
          type: integer
          format: int64
          minimum: 0
        visitor_network_hash_keys:
          type: array
          minItems: 2
          maxItems: 2
          description: Keys for the current and next UTC dates. Ingress uses them only to hash visitor networks for one public URL.
          items:
            $ref: "#/components/schemas/VisitorNetworkHashKey"
        draining:
          type: boolean
        drain_deadline:
          type: string
          format: date-time
        registered_at:
          type: string
          format: date-time
        renewed_at:
          type: string
          format: date-time
        lease_expires_at:
          type: string
          format: date-time
    IngressRoutingPublisherConnection:
      type: object
      additionalProperties: false
      required:
        - connection_slot
        - publisher_connection_id
        - connection_assignment_revision
        - relay_service_id
        - relay_id
        - relay_run_id
        - relay_lease_revision
        - internal_relay_address
        - tls_server_name
        - lease_expires_at
      properties:
        available_streams:
          type: integer
          format: int64
          minimum: 0
          description: Last relay-reported free stream capacity; the relay enforces its current capacity at open.
        connection_slot:
          type: integer
          minimum: 0
          maximum: 1
        publisher_connection_id:
          $ref: "#/components/schemas/Identifier"
        connection_assignment_revision:
          type: integer
          format: int64
          minimum: 1
        relay_service_id:
          $ref: "#/components/schemas/Identifier"
        relay_id:
          $ref: "#/components/schemas/Identifier"
        relay_run_id:
          $ref: "#/components/schemas/Identifier"
        relay_lease_revision:
          type: integer
          format: int64
          minimum: 1
        internal_relay_address:
          $ref: "#/components/schemas/Identifier"
        tls_server_name:
          $ref: "#/components/schemas/Identifier"
        lease_expires_at:
          type: string
          format: date-time
    IngressRoutingTableEntry:
      type: object
      additionalProperties: false
      required:
        - public_url_id
        - publish_run_id
        - publish_run_number
        - canonical_hostname
        - policy_revision
        - access_mode
        - ip_policy
        - allowed_ip_hashes
        - public_url_expires_at
        - publisher_connections
      properties:
        public_url_id:
          $ref: "#/components/schemas/Identifier"
        publish_run_id:
          $ref: "#/components/schemas/Identifier"
        publish_run_number:
          type: integer
          format: int64
          minimum: 1
        canonical_hostname:
          type: string
          minLength: 1
          maxLength: 253
        ingress_pool_id:
          $ref: "#/components/schemas/Identifier"
        service_protocol:
          type: string
          enum: [http]
        policy_revision:
          type: integer
          format: int64
          minimum: 1
        access_mode:
          type: string
          enum: [restricted, anonymous]
        ip_policy:
          type: string
          enum: [allow_all, hashed_allowlist]
        allowed_ip_hashes:
          type: array
          uniqueItems: true
          items:
            $ref: "#/components/schemas/HashedIPPrefix"
        ip_policy_key:
          type: string
          format: byte
          description: Purpose-specific verifier sent only on the authenticated private API; never persisted with routing events.
        public_url_expires_at:
          type: string
          format: date-time
        recovery_episode_id:
          type: integer
          format: int64
          minimum: 1
        publisher_connections:
          type: array
          maxItems: 2
          items:
            $ref: "#/components/schemas/IngressRoutingPublisherConnection"
        traffic:
          $ref: "#/components/schemas/IngressTrafficLimits"
    IngressTrafficLimits:
      type: object
      additionalProperties: false
      description: Resolved per-public-URL publish-run budgets, enforced independently on each ingress process. Byte rates count encrypted visitor bytes per second. Omitted totals are unlimited.
      required: [connections, rate, rate_per_ns, burst, upload_bytes, download_bytes]
      properties:
        connections:
          type: integer
          minimum: 1
          maximum: 1048576
        rate:
          type: integer
          minimum: 1
          maximum: 2147483648
        rate_per_ns:
          type: integer
          format: int64
          minimum: 1000000
          maximum: 86400000000000
        burst:
          type: integer
          minimum: 1
          maximum: 2147483648
        upload_bytes:
          type: integer
          format: int64
          minimum: 65536
          maximum: 1099511627776
        download_bytes:
          type: integer
          format: int64
          minimum: 65536
          maximum: 1099511627776
        total_connections:
          type: integer
          format: int64
          minimum: 1
        total_upload_bytes:
          type: integer
          format: int64
          minimum: 1
        total_download_bytes:
          type: integer
          format: int64
          minimum: 1
    HashedIPPrefix:
      type: object
      additionalProperties: false
      required: [family, prefix_length, digest]
      properties:
        family:
          type: string
          enum: [ipv4, ipv6]
        prefix_length:
          type: integer
          minimum: 0
          maximum: 128
        digest:
          type: string
          pattern: "^[A-Za-z0-9_-]{43}$"
    IngressRoutingTableEvent:
      type: object
      additionalProperties: false
      required:
        - routing_table_revision
        - kind
        - public_url_id
        - publish_run_number
        - canonical_hostname
        - entry_revision
        - entry
        - created_at
      properties:
        routing_table_revision:
          type: integer
          format: int64
          minimum: 1
        kind:
          type: string
          enum: [public_url_upsert, public_url_tombstone]
        public_url_id:
          $ref: "#/components/schemas/Identifier"
        publish_run_number:
          type: integer
          format: int64
          minimum: 1
        canonical_hostname:
          type: string
        entry_revision:
          type: integer
          format: int64
          minimum: 1
        entry:
          $ref: "#/components/schemas/IngressRoutingTableEntry"
        public_url_expires_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
    IngressRoutingTableSnapshot:
      type: object
      additionalProperties: false
      required: [through_revision, retained_after_revision, entries]
      properties:
        through_revision:
          type: integer
          format: int64
          minimum: 0
        retained_after_revision:
          type: integer
          format: int64
          minimum: 0
        entries:
          type: array
          items:
            $ref: "#/components/schemas/IngressRoutingTableEvent"
    IngressRoutingTablePage:
      type: object
      additionalProperties: false
      required: [through_revision, retained_after_revision, next_revision, more, events]
      properties:
        through_revision:
          type: integer
          format: int64
          minimum: 0
        retained_after_revision:
          type: integer
          format: int64
          minimum: 0
        next_revision:
          type: integer
          format: int64
          minimum: 0
        more:
          type: boolean
        events:
          type: array
          maxItems: 1000
          items:
            $ref: "#/components/schemas/IngressRoutingTableEvent"
    IngressUsageReport:
      type: object
      additionalProperties: false
      required:
        - public_url_id
        - publish_run_number
        - bucket_start
        - bucket_end
        - observed_through
        - report_revision
        - connection_attempts
        - policy_denials
        - capacity_denials
        - visitor_stream_open_failures
        - successful_streams
        - connection_nanoseconds
        - ingress_bytes
        - egress_bytes
        - histogram_data
        - final
      properties:
        public_url_id:
          $ref: "#/components/schemas/Identifier"
        publish_run_number:
          type: integer
          format: int64
          minimum: 1
        bucket_start:
          type: string
          format: date-time
        bucket_end:
          type: string
          format: date-time
        observed_through:
          type: string
          format: date-time
        report_revision:
          type: integer
          format: int64
          minimum: 1
        connection_attempts:
          type: integer
          format: int64
          minimum: 0
        policy_denials:
          type: integer
          format: int64
          minimum: 0
        capacity_denials:
          type: integer
          format: int64
          minimum: 0
        visitor_stream_open_failures:
          type: integer
          format: int64
          minimum: 0
        successful_streams:
          type: integer
          format: int64
          minimum: 0
        connection_nanoseconds:
          type: integer
          format: int64
          minimum: 0
        ingress_bytes:
          type: integer
          format: int64
          minimum: 0
        egress_bytes:
          type: integer
          format: int64
          minimum: 0
        histogram_data:
          type: string
          format: byte
        final:
          type: boolean
    VisitorNetworkHashKey:
      type: object
      additionalProperties: false
      required: [utc_date, key]
      properties:
        utc_date:
          type: string
          format: date
        key:
          type: string
          format: byte
    IngressUsageReportBatch:
      unevaluatedProperties: false
      allOf:
        - $ref: "#/components/schemas/IngressLeaseIdentity"
        - type: object
          required: [complete, reports]
          properties:
            observed_through:
              type: string
              format: date-time
            complete:
              type: boolean
            reports:
              type: array
              maxItems: 256
              items:
                $ref: "#/components/schemas/IngressUsageReport"
    PublicURLRecoveryObservationRequest:
      unevaluatedProperties: false
      allOf:
        - $ref: "#/components/schemas/IngressLeaseIdentity"
        - type: object
          required: [public_url_id, publish_run_number, observed_at]
          properties:
            public_url_id:
              $ref: "#/components/schemas/Identifier"
            publish_run_number:
              type: integer
              format: int64
              minimum: 1
            observed_at:
              type: string
              format: date-time
    PublicURLRecoveryObservation:
      type: object
      additionalProperties: false
      required:
        [
          recovery_episode_id,
          public_url_id,
          publish_run_number,
          opened_at,
          observed_at,
          observed_seconds,
        ]
      properties:
        recovery_episode_id:
          type: integer
          format: int64
          minimum: 1
        public_url_id:
          $ref: "#/components/schemas/Identifier"
        publish_run_number:
          type: integer
          format: int64
          minimum: 1
        opened_at:
          type: string
          format: date-time
        observed_at:
          type: string
          format: date-time
        observed_seconds:
          type: number
          format: double
          minimum: 0
    ProblemCode:
      type: string
      enum:
        - invalid_request
        - invalid_json
        - unsupported_media_type
        - unauthenticated
        - not_found
        - internal
        - ingress_already_running
        - ingress_lease_stale
        - recovery_episode_stale
        - invalid_usage_report
        - usage_route_not_found
        - stale_usage_report
        - usage_report_conflict
        - usage_bucket_finalized
        - routing_table_resnapshot_required
    Problem:
      type: object
      additionalProperties: false
      required: [type, title, status, code, detail, request_id]
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        code:
          $ref: "#/components/schemas/ProblemCode"
        detail:
          type: string
          minLength: 1
        request_id:
          type: string
          minLength: 1
        retry_at:
          type: string
          format: date-time
        details:
          type: object
          additionalProperties: true
