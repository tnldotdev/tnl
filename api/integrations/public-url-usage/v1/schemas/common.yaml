securitySchemes:
  serviceToken:
    type: http
    scheme: bearer
    bearerFormat: tnl service token
responses:
  Problem:
    description: Request failed
    content:
      application/problem+json:
        schema:
          $ref: "../openapi.yaml#/components/schemas/Problem"
schemas:
  Problem:
    type: object
    additionalProperties: false
    required: [type, title, status, code, request_id, details]
    properties:
      type:
        type: string
        format: uri
      title:
        type: string
        minLength: 1
        maxLength: 128
      status:
        type: integer
        minimum: 400
        maximum: 599
      code:
        type: string
        enum:
          - invalid_argument
          - unauthenticated
          - not_found
          - status_conflict
          - idempotency_conflict
          - temporarily_unavailable
          - internal
      request_id:
        type: string
        pattern: ^req_[A-Za-z0-9-]+$
      details:
        type: object
        maxProperties: 16
