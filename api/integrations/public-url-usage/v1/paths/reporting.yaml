paths:
  /v1/public-urls/usage-bucket-reports:
    post:
      operationId: ingestPublicURLUsageBucketReports
      summary: Ingest public URL usage bucket reports
      security:
        - serviceToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/PublicURLUsageBucketReportBatch"
      responses:
        "200":
          description: Per-report ingestion results
          content:
            application/json:
              schema:
                $ref: "../openapi.yaml#/components/schemas/PublicURLUsageBucketReportBatchResponse"
        "400":
          $ref: "../openapi.yaml#/components/responses/Problem"
        "401":
          $ref: "../openapi.yaml#/components/responses/Problem"
        "404":
          $ref: "../openapi.yaml#/components/responses/Problem"
        "409":
          $ref: "../openapi.yaml#/components/responses/Problem"
        "413":
          $ref: "../openapi.yaml#/components/responses/Problem"
        "415":
          $ref: "../openapi.yaml#/components/responses/Problem"
        default:
          $ref: "../openapi.yaml#/components/responses/Problem"
