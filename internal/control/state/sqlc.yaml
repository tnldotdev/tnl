version: "2"
sql:
  - engine: "postgresql"
    schema: "migrations"
    queries: "queries"
    gen:
      go:
        package: "controlstatedb"
        out: "controlstatedb"
        sql_package: "pgx/v5"
        rename:
          ssh_host_key: SSHHostKey
          ssh_user: SSHUser
          last_http_status: LastHTTPStatus
        emit_interface: true
