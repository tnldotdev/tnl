name: tnl-dns-integration-test

services:
  postgres:
    image: public.ecr.aws/docker/library/postgres:17.6-alpine@sha256:ef257d85f76e48da1c64832459b59fcaba1a4dac97bf5d7450c77753542eee94
    environment:
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
    healthcheck:
      test: [CMD-SHELL, pg_isready --username postgres --dbname postgres]
      interval: 2s
      timeout: 5s
      retries: 10

  test:
    image: public.ecr.aws/docker/library/golang:1.27.2-bookworm@sha256:5cf287a799e6b94384bad13d16b14904c531f51ba65792237e122ce42b392f61
    init: true
    depends_on:
      postgres:
        condition: service_healthy
    working_dir: /workspace
    volumes:
      - ../../..:/workspace:ro
    command:
      - sh
      - -ec
      - |
        go install github.com/letsencrypt/pebble/v2/cmd/pebble@v2.10.1
        go test -race -v ./internal/tnldruntime \
          -run='^TestDNSIntegrationSplitAutomaticRelayCertificates$$' \
          -count=1 -timeout=5m -args \
          -tnl-test-tier=dns \
          -tnl-test-postgres-url='postgres://postgres:postgres@postgres:5432/postgres?sslmode=disable'
