name: tnl-separated-load-test

x-runtime: &runtime
  image: tnl-runtime-load:local
  build:
    context: ../../..
    dockerfile: internal/tnldruntime/testdata/runtime-load.Dockerfile
  init: true
  stop_grace_period: 15s
  volumes:
    - artifacts:/artifacts:ro
    - coordination:/load
    - ${RESULTS:?results directory required}:/results
  environment: &environment
    PATH: /artifacts:/usr/local/go/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
  command:
    - sh
    - -ec
    - |
      exec /artifacts/runtime.test \
        -test.v \
        -test.run='^TestSeparatedRuntimeComponent$$' \
        -test.timeout=30m \
        -tnl-test-tier=runtime-load \
        -tnl-test-postgres-url='postgres://postgres:postgres@postgres:5432/postgres?sslmode=disable' \
        -tnl-separated-component="$${SEPARATED_COMPONENT}" \
        -tnl-runtime-load-routes='${ROUTES:-4}' \
        -tnl-runtime-load-start-parallel='${START_PARALLEL:-4}' \
        -tnl-runtime-load-ready-timeout='${READY_TIMEOUT:-30s}' \
        -tnl-runtime-load-route-certificate-workers='${ROUTE_CERTIFICATE_WORKERS:-4}' \
        -tnl-runtime-load-rps='${RPS:-16}' \
        -tnl-runtime-load-workers='${WORKERS:-128}' \
        -tnl-runtime-load-queue='${QUEUE:-8}' \
        -tnl-runtime-load-held-streams='${HELD_STREAMS:-8}' \
        -tnl-runtime-load-held-warmup='${HELD_WARMUP:-0s}' \
        -tnl-runtime-load-held-measure='${HELD_MEASURE:-0s}' \
        -tnl-runtime-load-heap-profile='${HEAP_PROFILE:-0}' \
        -tnl-runtime-load-capacity-only='${CAPACITY_ONLY:-0}' \
        -tnl-runtime-load-direct-path='${DIRECT_PATH:-0}' \
        -tnl-runtime-load-bandwidth-direction='${BANDWIDTH_DIRECTION:-}' \
        -tnl-runtime-load-bandwidth-mbits-per-second='${BANDWIDTH_MBITS_PER_SECOND:-100}' \
        -tnl-runtime-load-bandwidth-streams='${BANDWIDTH_STREAMS:-64}' \
        -tnl-runtime-load-source-connection-rate='${SOURCE_CONNECTION_RATE:-50}' \
        -tnl-runtime-load-source-connection-burst='${SOURCE_CONNECTION_BURST:-200}' \
        -tnl-runtime-load-client-hello-connection-limit='${CLIENT_HELLO_CONNECTION_LIMIT:-1024}' \
        -tnl-runtime-load-challenge-connection-limit='${CHALLENGE_CONNECTION_LIMIT:-1024}' \
        -tnl-runtime-load-challenge-hostname-connection-limit='${CHALLENGE_HOSTNAME_CONNECTION_LIMIT:-8}' \
        -tnl-runtime-load-visitor-connection-limit='${VISITOR_CONNECTION_LIMIT:-20000}' \
        -tnl-runtime-load-route-connection-limit='${ROUTE_CONNECTION_LIMIT:-500}' \
        -tnl-runtime-load-publisher-connection-limit='${PUBLISHER_CONNECTION_LIMIT:-4000}' \
        -tnl-runtime-load-relay-stream-capacity='${RELAY_STREAM_CAPACITY:-4096}' \
        -tnl-runtime-load-quic-max-incoming-streams='${QUIC_MAX_INCOMING_STREAMS:-4096}' \
        -tnl-runtime-load-scenario='${SCENARIO:-relay-restart}' \
        -tnl-runtime-load-network-path='${NETWORK_PATH:-forwarding}' \
        -tnl-runtime-load-rtt='${RTT:-20ms}' \
        -tnl-runtime-load-loss='${LOSS:-0.1}' \
        -tnl-runtime-load-trace='${TRACE:-0}' \
        -tnl-runtime-load-duration='${DURATION:-10s}'

x-visitor: &visitor
  <<: *runtime
  cpus: "${VISITOR_CPUS:-1}"
  mem_limit: "${VISITOR_MEMORY:-128m}"
  memswap_limit: "${VISITOR_MEMORY:-128m}"

services:
  build:
    image: golang:1.27.0-bookworm@sha256:ded31c68586d2e49e760acc2e65a884b23d032e9bbbed0ae0c55abd3fcaf4452
    working_dir: /workspace
    environment:
      GOFLAGS: -tags=ts_omit_ssh
      GOBIN: /artifacts
      RACE: "${RACE:-0}"
    volumes:
      - ../../..:/workspace:ro
      - artifacts:/artifacts
      - go-cache:/root/.cache/go-build
      - go-modules:/go/pkg/mod
    command:
      - sh
      - -ec
      - |
        go install github.com/letsencrypt/pebble/v2/cmd/pebble@v2.10.1
        if [ "$${RACE}" = 1 ]; then
          go test -race -c -o /artifacts/runtime.test ./internal/tnldruntime
        else
          go test -c -o /artifacts/runtime.test ./internal/tnldruntime
        fi

  postgres:
    image: postgres:17.6-alpine@sha256:ef257d85f76e48da1c64832459b59fcaba1a4dac97bf5d7450c77753542eee94
    cpus: "${DATABASE_CPUS:-1}"
    mem_limit: "${DATABASE_MEMORY:-512m}"
    memswap_limit: "${DATABASE_MEMORY:-512m}"
    environment:
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
    healthcheck:
      test: [CMD-SHELL, pg_isready --username postgres --dbname postgres]
      interval: 2s
      timeout: 5s
      retries: 10

  setup:
    <<: *runtime
    command:
      - /artifacts/runtime.test
      - -test.v
      - -test.run=^TestSeparatedRuntimeSetup$$
      - -test.timeout=1m
      - -tnl-test-tier=runtime-load
      - -tnl-test-postgres-url=postgres://postgres:postgres@postgres:5432/postgres?sslmode=disable
      - -tnl-separated-component=setup

  control:
    <<: *runtime
    cpus: "${CONTROL_CPUS:-1}"
    mem_limit: "${CONTROL_MEMORY:-2g}"
    memswap_limit: "${CONTROL_MEMORY:-2g}"
    environment:
      <<: *environment
      SEPARATED_COMPONENT: control
    networks:
      default:
        aliases: [control.split.integration.test]

  ingress:
    <<: *runtime
    cap_add: [NET_ADMIN]
    cpus: "${INGRESS_CPUS:-1}"
    mem_limit: "${INGRESS_MEMORY:-2g}"
    memswap_limit: "${INGRESS_MEMORY:-2g}"
    environment:
      <<: *environment
      SEPARATED_COMPONENT: ingress

  relay-a:
    <<: *runtime
    cap_add: [NET_ADMIN]
    cpus: "${RELAY_A_CPUS:-1}"
    mem_limit: "${RELAY_A_MEMORY:-2g}"
    memswap_limit: "${RELAY_A_MEMORY:-2g}"
    environment:
      <<: *environment
      SEPARATED_COMPONENT: relay-a
    networks:
      default:
        aliases: [relay-a.split.integration.test]

  relay-b:
    <<: *runtime
    cap_add: [NET_ADMIN]
    cpus: "${RELAY_B_CPUS:-1}"
    mem_limit: "${RELAY_B_MEMORY:-2g}"
    memswap_limit: "${RELAY_B_MEMORY:-2g}"
    environment:
      <<: *environment
      SEPARATED_COMPONENT: relay-b
    networks:
      default:
        aliases: [relay-b.split.integration.test]

  publishers:
    <<: *runtime
    cap_add: [NET_ADMIN]
    cpus: "${PUBLISHER_CPUS:-2}"
    mem_limit: "${PUBLISHER_MEMORY:-512m}"
    memswap_limit: "${PUBLISHER_MEMORY:-512m}"
    environment:
      <<: *environment
      SEPARATED_COMPONENT: publishers

  visitor-1:
    <<: *visitor
    environment:
      <<: *environment
      SEPARATED_COMPONENT: visitor-1
  visitor-2:
    <<: *visitor
    environment:
      <<: *environment
      SEPARATED_COMPONENT: visitor-2
  visitor-3:
    <<: *visitor
    environment:
      <<: *environment
      SEPARATED_COMPONENT: visitor-3
  visitor-4:
    <<: *visitor
    environment:
      <<: *environment
      SEPARATED_COMPONENT: visitor-4

  app:
    <<: *runtime
    network_mode: service:publishers
    cpus: "${APP_CPUS:-1}"
    mem_limit: "${APP_MEMORY:-128m}"
    memswap_limit: "${APP_MEMORY:-128m}"
    environment:
      <<: *environment
      SEPARATED_COMPONENT: app

  pebble:
    <<: *runtime
    cpus: "${PEBBLE_CPUS:-1}"
    mem_limit: "${PEBBLE_MEMORY:-128m}"
    memswap_limit: "${PEBBLE_MEMORY:-128m}"
    environment:
      <<: *environment
      SEPARATED_COMPONENT: pebble

  coordinator:
    <<: *runtime
    ports: ["127.0.0.1::8080"]
    cpus: "0.5"
    mem_limit: 128m
    memswap_limit: 128m
    volumes:
      - artifacts:/artifacts:ro
      - coordination:/load
      - ${RESULTS:?results directory required}:/results
    command:
      - /artifacts/runtime.test
      - -test.v
      - -test.run=^TestLoadSeparatedRuntime$$
      - -test.timeout=30m
      - -tnl-test-tier=runtime-load
      - -tnl-test-postgres-url=postgres://postgres:postgres@postgres:5432/postgres?sslmode=disable
      - -tnl-separated-component=coordinator
      - "-tnl-runtime-load-routes=${ROUTES:-4}"
      - "-tnl-runtime-load-start-parallel=${START_PARALLEL:-4}"
      - "-tnl-runtime-load-ready-timeout=${READY_TIMEOUT:-30s}"
      - "-tnl-runtime-load-route-certificate-workers=${ROUTE_CERTIFICATE_WORKERS:-4}"
      - "-tnl-runtime-load-rps=${RPS:-16}"
      - "-tnl-runtime-load-workers=${WORKERS:-128}"
      - "-tnl-runtime-load-queue=${QUEUE:-8}"
      - "-tnl-runtime-load-held-streams=${HELD_STREAMS:-8}"
      - "-tnl-runtime-load-held-warmup=${HELD_WARMUP:-0s}"
      - "-tnl-runtime-load-held-measure=${HELD_MEASURE:-0s}"
      - "-tnl-runtime-load-heap-profile=${HEAP_PROFILE:-0}"
      - "-tnl-runtime-load-capacity-only=${CAPACITY_ONLY:-0}"
      - "-tnl-runtime-load-direct-path=${DIRECT_PATH:-0}"
      - "-tnl-runtime-load-bandwidth-direction=${BANDWIDTH_DIRECTION:-}"
      - "-tnl-runtime-load-bandwidth-mbits-per-second=${BANDWIDTH_MBITS_PER_SECOND:-100}"
      - "-tnl-runtime-load-bandwidth-streams=${BANDWIDTH_STREAMS:-64}"
      - "-tnl-runtime-load-source-connection-rate=${SOURCE_CONNECTION_RATE:-50}"
      - "-tnl-runtime-load-source-connection-burst=${SOURCE_CONNECTION_BURST:-200}"
      - "-tnl-runtime-load-client-hello-connection-limit=${CLIENT_HELLO_CONNECTION_LIMIT:-1024}"
      - "-tnl-runtime-load-challenge-connection-limit=${CHALLENGE_CONNECTION_LIMIT:-1024}"
      - "-tnl-runtime-load-challenge-hostname-connection-limit=${CHALLENGE_HOSTNAME_CONNECTION_LIMIT:-8}"
      - "-tnl-runtime-load-visitor-connection-limit=${VISITOR_CONNECTION_LIMIT:-20000}"
      - "-tnl-runtime-load-route-connection-limit=${ROUTE_CONNECTION_LIMIT:-500}"
      - "-tnl-runtime-load-publisher-connection-limit=${PUBLISHER_CONNECTION_LIMIT:-4000}"
      - "-tnl-runtime-load-relay-stream-capacity=${RELAY_STREAM_CAPACITY:-4096}"
      - "-tnl-runtime-load-quic-max-incoming-streams=${QUIC_MAX_INCOMING_STREAMS:-4096}"
      - "-tnl-runtime-load-scenario=${SCENARIO:-relay-restart}"
      - "-tnl-runtime-load-network-path=${NETWORK_PATH:-forwarding}"
      - "-tnl-runtime-load-rtt=${RTT:-20ms}"
      - "-tnl-runtime-load-loss=${LOSS:-0.1}"
      - "-tnl-runtime-load-trace=${TRACE:-0}"
      - "-tnl-runtime-load-duration=${DURATION:-10s}"

volumes:
  artifacts:
  coordination:
  go-cache:
    external: true
    name: tnl-load-go-build
  go-modules:
    external: true
    name: tnl-load-go-modules
