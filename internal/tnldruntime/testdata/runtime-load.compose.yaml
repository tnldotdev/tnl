name: tnl-runtime-load-test

services:
  build:
    image: golang:1.27.0-bookworm@sha256:ded31c68586d2e49e760acc2e65a884b23d032e9bbbed0ae0c55abd3fcaf4452
    working_dir: /workspace
    environment:
      GOFLAGS: -tags=ts_omit_ssh
      GOBIN: /artifacts
    volumes:
      - ../../..:/workspace:ro
      - artifacts:/artifacts
    command:
      - sh
      - -ec
      - |
        go install github.com/letsencrypt/pebble/v2/cmd/pebble@v2.10.1
        go test -c -o /artifacts/runtime.test ./internal/tnldruntime

  postgres:
    image: postgres:17.6-alpine@sha256:ef257d85f76e48da1c64832459b59fcaba1a4dac97bf5d7450c77753542eee94
    cpus: "${TNL_TEST_DATABASE_CPUS:-1}"
    mem_limit: "${TNL_TEST_DATABASE_MEMORY:-512m}"
    memswap_limit: "${TNL_TEST_DATABASE_MEMORY:-512m}"
    environment:
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
    healthcheck:
      test: [CMD-SHELL, pg_isready --username postgres --dbname postgres]
      interval: 2s
      timeout: 5s
      retries: 10

  test:
    image: golang:1.27.0-bookworm@sha256:ded31c68586d2e49e760acc2e65a884b23d032e9bbbed0ae0c55abd3fcaf4452
    init: true
    cpus: "${TNL_TEST_RUNTIME_CPUS:-2}"
    mem_limit: "${TNL_TEST_RUNTIME_MEMORY:-1g}"
    memswap_limit: "${TNL_TEST_RUNTIME_MEMORY:-1g}"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PATH: /artifacts:/usr/local/go/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      TNL_TEST_INTEGRATION: "1"
      TNL_TEST_RUNTIME_LOAD: "1"
      TNL_TEST_RUNTIME_ROUTES: "${TNL_TEST_RUNTIME_ROUTES:-16}"
      TNL_TEST_RUNTIME_RPS: "${TNL_TEST_RUNTIME_RPS:-20}"
      TNL_TEST_RUNTIME_SOURCES: "${TNL_TEST_RUNTIME_SOURCES:-1}"
      TNL_TEST_RUNTIME_TRACE: "${TNL_TEST_RUNTIME_TRACE:-0}"
      TNL_TEST_RUNTIME_DURATION: "${TNL_TEST_RUNTIME_DURATION:-30s}"
      TNL_TEST_POSTGRES_URL: postgres://postgres:postgres@postgres:5432/postgres?sslmode=disable
    volumes:
      - artifacts:/artifacts:ro
    command:
      [
        /artifacts/runtime.test,
        -test.v,
        -test.run=^TestLoadRuntimeVisitors$$,
        -test.count=1,
        -test.timeout=15m,
      ]

volumes:
  artifacts:
